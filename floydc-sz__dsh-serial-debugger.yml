url: https://github.com/floydc-sz/dsh-serial-debugger
name: floydc-sz/dsh-serial-debugger
category: tools
description:
  en: 'Serial-port debugger for DeepSeek Harness — port parameters, live receive display and data sending, in a right-sidebar panel with a Chinese/English interface. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 串口调试插件：串口参数设置、实时接收显示与数据发送，面板位于右侧边栏，界面支持中英文。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
