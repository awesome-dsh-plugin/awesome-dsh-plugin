url: https://github.com/Eddielllllllllllll/dsh-fiction-voices
name: Eddielllllllllllll/dsh-fiction-voices
category: skill
description:
  en: Registers five Chinese prose-voice skills for fiction writing (jiangnan, fanhua, kuangbiao, tangxi, jinhua), each a Markdown instruction file covering sentence rhythm, imagery banks, dialogue technique, sample passages, taboos and a pre-writing checklist.
  zh: 注册五套中文小说笔法技能（江南、繁花、狂飙、汤溪、婺州），每套是一份 Markdown 指令文件，讲句子节奏、意象库、对话技术、示范段落、禁区与写作前自检。
