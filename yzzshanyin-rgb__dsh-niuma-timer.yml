name: yzzshanyin-rgb/dsh-niuma-timer
category: ui
description:
  en: 'A handwritten-journal salary timer on the DSH composer dock: set your monthly salary and work hours, then it shows how much you have earned today and this month in real time, with daily, hourly and per-second rates, quitting-time progress, unpaid overtime, weekday attendance dots and a status badge. Three single-row presets (minimal, full, playful) range from a bare amount to a playful countdown; you can pick which figures appear, hide every amount and keep only progress, hide the chip behind a corner dot, and set its alignment and density. Settings are kept in localStorage only; no network requests.'
  zh: 挂在 DSH 输入框下方的「牛马费用计时器」手帐小卡——填好到手月薪与上下班时间，实时显示今天已挣多少、本月累计多少，附带日薪/时薪/秒薪、下班进度条、下班后的无偿加班时长、工作日打卡点阵与状态章。内置极简/完整/趣味三种单行显示方案，从只看到手金额到带倒计时红章都能选；可以自选显示哪些数字、隐藏全部金额只看进度、把胶囊收成角落一个小圆点，还能调整左右位置与显示密度。配置只存在页面 localStorage，不发网络请求。
icon: https://raw.githubusercontent.com/yzzshanyin-rgb/dsh-niuma-timer/main/assets/icon-180.png
