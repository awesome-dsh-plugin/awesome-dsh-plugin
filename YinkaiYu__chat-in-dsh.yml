url: https://github.com/YinkaiYu/chat-in-dsh
name: YinkaiYu/chat-in-dsh
category: ui
description:
  en: 'Embeds the official DeepSeek web chat (chat-demo) as a DSH sidebar panel and reuses the DSH DeepSeek account, so no API key is needed. Its HTTP routes require the DSH browser login and reject cross-site requests.'
  zh: '在 DSH 侧栏面板中嵌入官方 DeepSeek 网页版聊天（chat-demo），复用 DSH 的 DeepSeek 账号，无需填写 API Key。它的 HTTP 路由要求 DSH 浏览器登录，并拒绝跨站请求。'
icon: https://raw.githubusercontent.com/YinkaiYu/chat-in-dsh/main/assets/icon-180.png