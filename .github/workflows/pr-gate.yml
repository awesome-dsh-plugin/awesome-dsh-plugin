name: Submission gate

# Checks the repos behind a PR's entries: dsh.bundle manifest, repo age and
# commit count. All three need the authenticated GitHub API, which the
# fork-safe `pull_request` job in pr-check.yml deliberately has no access to —
# so this runs via workflow_run, in the base repository's context, after that
# job finishes.
#
# SECURITY: a token is in scope here, so nothing from the pull request is ever
# executed. The checkout stays on the base repo's default branch — trusted
# code, trusted lockfile — and the only thing taken from the PR is the content
# of data/plugins/*.yml, extracted into a scratch directory and read as data.
# Checking out refs/pull/N/merge and running `npm ci` there would hand the
# token to fork-supplied install scripts, which is the pull_request_target
# footgun this workflow exists to avoid.

on:
  workflow_run:
    workflows: ['PR check']
    types: [completed]

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run = context.payload.workflow_run
            const sha = run.head_sha
            try {
              // One request, not a walk of every open pull request. This gate
              // fires on every PR-check completion, and paginating ~150 open
              // PRs per fire is what exhausted the installation rate limit on
              // 2026-08-18. `workflow_run.pull_requests` is empty for forks —
              // presumably why this listed everything — but the head
              // repository and branch are always present and identify the PR
              // exactly, since a branch has at most one open PR.
              const head = `${run.head_repository.owner.login}:${run.head_branch}`
              const { data } = await github.rest.pulls.list({ owner, repo, state: 'open', head, per_page: 10 })
              const pr = data.find((p) => p.head.sha === sha)
              if (!pr) {
                // Either the PR closed, or a newer push superseded this run —
                // in which case that push has its own gate run and this one
                // would be judging a commit nobody is proposing any more.
                core.info(`no open PR at ${head} with head ${sha} — nothing to gate`)
                core.setOutput('found', 'false')
                return
              }
              core.setOutput('found', 'true')
              core.setOutput('number', String(pr.number))
              core.setOutput('created_at', pr.created_at)
            } catch (e) {
              // A gate that dies before posting is indistinguishable from one
              // that never needed to run: the PR simply carries no verdict,
              // and a green `check` beside it reads as ready to merge. That is
              // how two submissions under the commit-count bar came to look
              // mergeable on 2026-08-18. Say it on the commit instead.
              await github.rest.checks.create({
                owner, repo, name: 'Submission gate', head_sha: sha,
                status: 'completed', conclusion: 'failure',
                output: {
                  title: 'The gate could not run',
                  summary: [
                    `Resolving the pull request for this run failed: ${e.message}`,
                    '',
                    'This is a fault in the gate, not in the submission. Re-run the',
                    'workflow; if it keeps failing a maintainer needs to look at it.',
                  ].join('\n'),
                },
              }).catch(() => {})
              throw e
            }

      # Trusted code only: the base repo's default branch, never the PR's.
      - uses: actions/checkout@v4
        if: steps.pr.outputs.found == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.found == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.pr.outputs.found == 'true'

      - name: Extract the PR's entry files (data only, never executed)
        if: steps.pr.outputs.found == 'true'
        id: extract
        run: |
          set -euo pipefail
          git fetch -q origin "refs/pull/${{ steps.pr.outputs.number }}/head:pr-head"
          # The API's base.sha is a snapshot from when the PR was opened. For a
          # PR whose head is a fork's synced main branch, diffing against that
          # stale snapshot attributes every entry merged since to this PR — the
          # gate then judges other people's submissions (and pins its check-run
          # on the main-tip sha, a red X on main). The merge-base against
          # today's main gives exactly the PR's own contribution instead.
          BASE=$(git merge-base origin/main pr-head)

          # Entry files this PR ADDS — only new submissions face the gate.
          # Modifying an already-listed entry (recategorize, reword) must not
          # re-litigate repo age or commit count: those entries were accepted
          # under the rules in force at the time, and the weekly decay scan is
          # what watches listed entries for regressions. The diff goes to a
          # file first so a git failure fails the step instead of silently
          # reading as "no changes" and reporting success on an unchecked PR.
          # -z handles paths with spaces.
          mkdir -p /tmp/prdata
          # AR, not A: git reports a renamed entry file as R, and a rename is
          # how an entry's `url` changes without ever looking added. #1554
          # renamed one entry file and re-pointed it at a different repository;
          # the gate read "no entries changed" and passed. For a rename
          # --name-only prints the new path, which is the one to check —
          # the target may be a repository nothing has ever verified.
          git diff -z --name-only --diff-filter=AR "$BASE...pr-head" -- data/plugins > /tmp/prdata/diff.z

          # Entries this PR MODIFIES rather than adds. These face no gate (see
          # above) but they are where cross-entry damage hides: #1348 was a PR
          # to refresh one plugin's entry that also rewrote an unrelated
          # plugin's description, twice, past every check we had. Surfacing the
          # list is what lets a reviewer ask why it is there.
          git diff --name-only --diff-filter=M "$BASE...pr-head" -- data/plugins \
            | sed 's|^data/plugins/||;s|\.yml$||' > /tmp/prdata/modified.txt || true
          echo "modified entries: $(wc -l < /tmp/prdata/modified.txt | tr -d ' ')"
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < /tmp/prdata/diff.z
          printf 'changed entry files: %s\n' "${#FILES[@]}"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git archive writes the blobs without running anything from the PR.
          git archive pr-head -- data/plugins | tar -x -C /tmp/prdata
          printf '%s\n' "${FILES[@]}" | sed 's|^data/plugins/||' > /tmp/prdata/changed.txt
          echo "none=false" >> "$GITHUB_OUTPUT"

          # The gate applies only to PRs opened after it landed; everything
          # older is judged by the rules that were in force at the time.
          EFF=$(git log --diff-filter=A --format=%cI -1 -- .github/workflows/pr-gate.yml)
          echo "effective_from=${EFF:-1970-01-01T00:00:00Z}" >> "$GITHUB_OUTPUT"

          # The checker reads the catalog AT THIS COMMIT to answer one
          # question: is this entry's repository one we already list? A rename
          # inside a repository we accepted long ago must not be re-judged as a
          # new submission. It has to come from here rather than from the
          # checkout, because the checkout is the PR — every repository the PR
          # adds would look pre-existing.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check submitted entries
        if: steps.pr.outputs.found == 'true' && steps.extract.outputs.none == 'false'
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_EFFECTIVE_FROM: ${{ steps.extract.outputs.effective_from }}
        run: |
          node scripts/check-submission.mjs \
            --dir /tmp/prdata/data/plugins \
            --only-list /tmp/prdata/changed.txt \
            --pr-created "${{ steps.pr.outputs.created_at }}" \
            --base "${{ steps.extract.outputs.base }}" \
            --json gate-result.json

      - name: Report result on the PR
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          NOTHING_TO_CHECK: ${{ steps.extract.outputs.none }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const head_sha = context.payload.workflow_run.head_sha
            const post = (conclusion, title, summary) =>
              github.rest.checks.create({ owner, repo, name: 'Submission gate', head_sha, status: 'completed', conclusion,
                output: { title, summary: summary.slice(0, 65000) } })

              // Read before the early return below, not after it. A PR that only
              // MODIFIES entries has no added file, so it took that branch and
              // reported "does not add or modify any file" — false, and it hid the
              // very list #1348 taught us to surface. Defining it here covers both.
              const modified = (() => {
                try { return fs.readFileSync('/tmp/prdata/modified.txt', 'utf8').split('\n').map((s) => s.trim()).filter(Boolean) } catch { return [] }
              })()
              const modifiedNote = modified.length
                ? `\n\n**This PR also rewrites ${modified.length} existing entr${modified.length === 1 ? 'y' : 'ies'}:** ${modified.map((m) => `\`${m}\``).join(', ')}. If any of those aren't the subject of this PR, that's an accidental edit — check before merging.`
                : ''

              if (process.env.NOTHING_TO_CHECK === 'true') {
                await post(
                  'success',
                  modified.length === 0 ? 'No entries changed' : `No new entries; ${modified.length} modified`,
                  (modified.length === 0
                    ? 'This PR adds no file under `data/plugins/`.'
                    : 'This PR adds no new entry under `data/plugins/`, so the age and commit floors have nothing to judge.') + modifiedNote,
                )
                return
              }

            let result = null
            try { result = JSON.parse(fs.readFileSync('gate-result.json', 'utf8')) } catch {}

            // No result file means the checker itself failed. Reporting success
            // here would let an unchecked submission through, so say so instead.
            if (!result) {
              await post('failure', 'The gate could not run',
                `\`check-submission.mjs\` exited without producing a result (step outcome: ${process.env.CHECK_OUTCOME}). Re-run the workflow; if it keeps failing this is a bug in the check, not in the submission.`)
              core.setFailed('gate did not produce a result')
              return
            }

            // Over the per-PR entry cap. Reported before the "checked nothing"
            // branch below, because the checker deliberately stops before
            // probing anything in this case — checked === 0 here means the cap
            // was hit, not that the gate malfunctioned.
            if (result.tooMany) {
              const { count, limit } = result.tooMany
              await post('failure', `${count} entries in one pull request (limit ${limit})`,
                [
                  `This pull request adds **${count}** entries. The limit is **${limit}**.`,
                  '',
                  "Reviewing a submission means reading the plugin's source and checking every claim",
                  'in its description against it. That work is per-entry and does not get cheaper in',
                  'bulk, so a batch this size would either sit unreviewed or get waved through — and',
                  'waving it through is how a curated list turns into a directory.',
                  '',
                  `Please split this into separate pull requests, at most **${limit}** entries each.`,
                  'If they are all yours, pick as well as split: send the ones you would keep if you',
                  'could only keep a few, rather than everything that works.',
                ].join('\n'))
              core.setFailed(`${count} entries in one PR (limit ${limit})`)
              return
            }

            // The extract step said this PR adds entries, so the checker must
            // have examined some. If it examined none, the two disagree and we
            // do not know whether the submission is sound — say that instead of
            // vouching for checks that never ran.
            if (result.checked === 0) {
              await post('failure', 'The gate checked nothing',
                'This PR adds entries under `data/plugins/`, but the submission checker examined none of them, so no verdict was reached. Re-run the workflow; if it persists this is a bug in the gate, not in the submission.')
              core.setFailed('gate examined no entries despite changed files')
              return
            }

            if (result.ok) {
              // An entry the checker could not reach is let through — a busy
              // API quota must not reject a good submission — but it must not
              // be described as having met the bar either. On 2026-08-18 six
              // entries under the age or commit bar sat green because a 403
              // during a quota squeeze produced the same verdict as a clean
              // pass, and the summary said "repo old enough, enough commits"
              // about repositories nobody had looked at.
              const partial = result.incomplete ?? []
              if (partial.length) {
                const detail = partial.map((c) => `- **${c.url}** — ${c.unverified.join('; ')}`).join('\n')
                await post('neutral', `${partial.length} entry/entries could not be fully checked`,
                  `${result.checked - partial.length} of ${result.checked} submitted entr${result.checked === 1 ? 'y' : 'ies'} pass. The rest were let through unchecked rather than rejected, but nothing here vouches for them:\n\n${detail}\n\nRe-run the workflow to check them properly.${modifiedNote}`)
                return
              }
              await post('success', 'Entries look good',
                `All ${result.checked} submitted entr${result.checked === 1 ? 'y passes' : 'ies pass'}: \`dsh.bundle\` declared, repo old enough, enough commits.${modifiedNote}`)
              return
            }
            const body = result.failures.flatMap((f) => [`**${f.url}**`, ...f.problems.map((p) => `- ${p}`), '']).join('\n')
            const contrib = `https://github.com/${owner}/${repo}/blob/main/contributing.md`
            await post('failure', `${result.failures.length} entry/entries need changes`,
              `${body}\nSee [contributing.md](${contrib}) for the bundle manifest example and the full rules.`)
            core.setFailed(`${result.failures.length} entry/entries did not pass`)
