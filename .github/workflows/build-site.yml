name: Build site from README

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md', 'README.zh.md', 'scripts/*.mjs', 'site/*', 'package.json', 'package-lock.json', '.github/workflows/build-site.yml']

permissions:
  contents: write

# serialize runs — the cron and a merge-triggered run overlapping caused
# non-fast-forward push failures before
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build site rows from READMEs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/probe-npm.mjs
          node scripts/probe-stars.mjs
          node scripts/probe-readmes.mjs
          node scripts/build-site.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs README.md README.zh.md data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: rebuild site from README"
          git pull --rebase origin main
          git push
