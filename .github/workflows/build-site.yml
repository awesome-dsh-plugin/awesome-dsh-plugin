name: Build site from README

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['README.md', 'README.zh.md', 'scripts/*.mjs', 'site/*', 'package.json', 'package-lock.json', '.github/workflows/build-site.yml']

permissions:
  contents: write

# serialize runs — the cron and a merge-triggered run overlapping caused
# non-fast-forward push failures before
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/ is fully generated, so a rebase onto someone else's rebuild
          # conflicts in every file. Rebuild from the current tip instead and
          # retry if main moved under us.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/probe-npm.mjs
            node scripts/probe-stars.mjs
            node scripts/probe-readmes.mjs
            node scripts/build-site.mjs
            git add docs README.md README.zh.md data
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -m "chore: rebuild site from README"
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "main moved during the build — rebuilding from the new tip"
          done
          echo "main kept moving after 3 attempts"; exit 1
