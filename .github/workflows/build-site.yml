name: Build site from README

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # No paths filter, deliberately. A filtered-out push still advances main
    # without cancelling an in-flight build, whose push then fails non-ff with
    # nothing to recover it. Any human push must either supersede the running
    # build or start one; irrelevant pushes exit at "no changes". Bot pushes
    # use GITHUB_TOKEN and never trigger workflows, so there is no loop.

permissions:
  contents: write

# docs/ is a pure function of main's tip, so an older run can only produce
# stale output — supersede it rather than queueing it. Queueing was the bug:
# a run is pinned to its trigger SHA, so the queued one woke up behind main
# and tried to reconcile two full regenerations of docs/.
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Build against what main actually is, not the SHA that triggered
          # this run — those differ whenever the bot pushed in between.
          git fetch -q origin main
          git reset -q --hard origin/main
          node scripts/probe-npm.mjs
          node scripts/probe-stars.mjs
          node scripts/probe-readmes.mjs
          node scripts/build-site.mjs
          git add docs README.md README.zh.md data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: rebuild site from README"
          # Fast-forward or bust. Losing the race means a newer push exists,
          # and the run it triggered supersedes this one — never rebase
          # generated output, it conflicts in every file.
          git push
