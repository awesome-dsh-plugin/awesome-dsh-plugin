name: Build site from README

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # No paths filter, deliberately. A filtered-out push still advances main
    # without cancelling an in-flight build, whose data/ push then fails
    # non-ff with nothing to recover it. Any human push must either supersede
    # the running build or start one; irrelevant pushes still deploy the same
    # bytes, which Pages treats as a no-op. Bot pushes use GITHUB_TOKEN and
    # never trigger workflows, so there is no loop.

permissions:
  contents: write # data/ probe-cache writeback
  pages: write
  id-token: write

# docs/ is a pure function of main's tip, so an older run can only produce
# stale output — supersede it rather than queueing it.
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build against what main actually is, not the SHA that triggered
          # this run — those differ whenever the bot pushed in between.
          git fetch -q origin main
          git reset -q --hard origin/main
          node scripts/probe-npm.mjs
          node scripts/probe-stars.mjs
          node scripts/probe-readmes.mjs
          node scripts/build-site.mjs
      - name: Commit probe data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "chore: refresh probe data"
          # Fast-forward or bust: losing the race means a newer push exists,
          # and the run it triggered supersedes this one.
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
