name: Sync upstream

# 定时轮询 + 手动触发 + 预留 dispatch（供以后上游 push 时主动唤起）
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时一次，避开整点拥堵
  workflow_dispatch:
  repository_dispatch:
    types: [sync-upstream]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 用 merge 保留 fork 自身文件（尤其本 workflow）；禁止 reset/force
      - name: Merge upstream into fork
        env:
          UPSTREAM: awesome-dsh-plugin/awesome-dsh-plugin
          BRANCH: main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --prune
          git merge "upstream/${BRANCH}" --no-edit -m "chore: sync from ${UPSTREAM}/${BRANCH}" || {
            echo "::error::merge conflict, resolve manually"
            exit 1
          }
          git push origin "HEAD:${BRANCH}"
