name: Re-check gated submissions

# A gate verdict is a snapshot, and snapshots go out of date two ways.
#
# By the clock: a PR blocked at "0.5 days old" qualifies a few hours later, but
# nothing re-runs the check, so it sits red until someone pushes.
#
# By the code: when the gate itself changes, every verdict it issued earlier was
# decided by code that no longer exists. Re-running only the failures leaves the
# worse half unattended — a stale red gets noticed by its author, a stale green
# gets merged. This re-runs `PR check` (which re-triggers the gate) on open PRs
# that aged in, whose verdict predates the current gate, or that were never
# gated at all.
#
# Kept deliberately cheap: one page of runs is indexed by head SHA up front
# rather than queried per pull request, and MAX_RERUNS bounds each pass. The
# first version issued two calls per open PR and exhausted the hourly quota.

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  pull-requests: read

concurrency:
  group: regate
  cancel-in-progress: true

jobs:
  regate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          # Raised from 12 when re-running stale verdicts was added: that rule
          # has a one-off backlog to clear, and at 12 per six hours a gate fix
          # would take days to reach every open PR. Each pass costs one read per
          # open PR plus one write per re-run, so this stays well inside quota.
          MAX_RERUNS: '20'
        with:
          script: |
            const { owner, repo } = context.repo
            const MAX = Number(process.env.MAX_RERUNS)
            // How old a passing verdict may get before it is worth re-asking.
            // Two days: long enough that routine same-day merges never trigger
            // it, short enough that a PR sitting in the queue is re-checked
            // several times before anyone merges it.
            const PASS_STALE_MS = 48 * 3600 * 1000

            // Housekeeping: a busy API quota is a reason to do less this pass,
            // never a reason to page anyone with a red run. Everything below is
            // wrapped so the job only fails on a genuine bug.
            try {

            // One request: recent PR-check runs, indexed by the commit they ran on.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'pr-check.yml', per_page: 100,
            })
            const runBySha = new Map()
            for (const r of runs.data.workflow_runs) if (!runBySha.has(r.head_sha)) runBySha.set(r.head_sha, r.id)

            // When did a verdict's own code last change? Anything decided before
            // that was decided by code that is gone. Found the hard way twice:
            //
            // - the gate: a bug fixed on 2026-08-17 left open PRs showing "all
            //   entries pass" for entries the current gate rejects outright;
            // - `check`: it builds the WHOLE catalog, so it fails for reasons
            //   that have nothing to do with the pull request under it. From
            //   2026-09-08 to 2026-09-12 an added-date derivation bug on main
            //   (#4731) turned it red on every open PR at once.
            const lastChange = async (paths, label) => {
              let at = 0
              for (const path of paths) {
                try {
                  const { data } = await github.rest.repos.listCommits({ owner, repo, path, per_page: 1 })
                  const t = Date.parse(data[0]?.commit?.committer?.date ?? '')
                  if (t > at) at = t
                } catch (e) {
                  if (e.status === 403 || e.status === 429) { core.warning(`rate limited reading ${label} history`); break }
                }
              }
              core.info(`${label} last changed: ${at ? new Date(at).toISOString() : 'unknown'}`)
              return at
            }

            const gateChangedAt = await lastChange(
              ['.github/workflows/pr-gate.yml', 'scripts/check-submission.mjs'], 'gate')
            // Every input `check` runs. `scripts/lib` is where the derivation
            // fix landed, so a directory path is deliberate: listCommits accepts
            // one and reports the newest commit touching anything beneath it.
            const checkChangedAt = await lastChange(
              ['.github/workflows/pr-check.yml', 'scripts/build-site.mjs',
               'scripts/generate-readme.mjs', 'scripts/lib'], 'check')

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
            // Oldest first. pulls.list answers newest-first, and only
            // `speculative` was ever sorted (below) — so the blocked list
            // inherited that order and MAX_RERUNS truncated its tail, which is
            // exactly where the pull requests blocked longest live. #2146 sat
            // on an "aged in" verdict for 119 hours: every pass re-ran twenty
            // newer submissions and stopped before reaching it. Twenty-two of
            // them were in that state on 2026-08-25, the oldest five days deep.
            prs.sort((a, b) => a.number - b.number)

            // The run id used to come only from the map of the last 100 PR-check
            // runs above, which covers roughly two hours of activity here. Any
            // pull request not pushed to inside that window failed the lookup
            // and was skipped before a single reason below was evaluated —
            // invisible to the sweep rather than merely last in line. The check
            // run already names its own workflow run, so ask it.
            const runIdFrom = (url) => {
              const m = /\/actions\/runs\/(\d+)/.exec(url ?? '')
              return m ? Number(m[1]) : null
            }
            // Collected first, re-run second, so the cheap-and-urgent reasons
            // are never crowded out by the speculative one (see PASS_STALE).
            //
            // Three tiers, not two. `blocking` and `revalidate` used to share
            // one list sorted by PR number, which is fine until the gate file
            // changes: then EVERY open verdict becomes stale at once, ~140 of
            // them, and at 20 per pass they occupy the queue for two days.
            // Stale entries are old PR numbers and aged-in ones are new, so
            // ascending order put the whole backlog ahead of the submissions
            // that are actually blocked — a plugin waiting only for its
            // repository to turn one day old would wait two days instead of
            // six hours, and the trigger would be a maintainer editing a
            // comment in the gate script.
            //
            // The two are not equally urgent. `blocking` means nothing has
            // vouched for this PR or the author is stuck behind a clock;
            // `revalidate` means the verdict is probably still right and is
            // being re-asked out of diligence. Diligence yields.
            const blocking = []
            const revalidate = []
            const speculative = []
            let requeued = 0
            for (const pr of prs) {
              if (pr.draft) continue
              // Nothing found past this point can be re-run this pass anyway,
              // and each iteration costs a listForRef. Stopping here makes the
              // sweep cheaper than the version that scanned every open PR to
              // build a list it was about to truncate.
              if (blocking.length >= MAX) break

              let gate, check
              try {
                const { data } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 30 })
                gate = data.check_runs.find((c) => c.name === 'Submission gate')
                check = data.check_runs.find((c) => c.name === 'check')
              } catch (e) {
                if (e.status === 403) { core.warning('rate limited — stopping early'); break }
                continue
              }

              const runId = runBySha.get(pr.head.sha) ?? runIdFrom(check?.details_url)
              if (!runId) continue // nothing to re-trigger

              // A failing `check` usually means the PR's own content is wrong;
              // time will not fix that, and re-running just burns quota.
              //
              // Usually — but `check` also builds the whole catalog, so it goes
              // red for things on main that the submitter cannot touch, and
              // then this guard becomes a deadlock: the red skips the PR, the
              // skip means nothing re-runs it, and the red never clears. That
              // is not hypothetical. #4731 held `check` red on every open PR
              // for four days; the sweep skipped all of them, so a submission
              // blocked only on "repository is 0.7 days old — this check
              // re-runs by itself and should clear in about 8h" (#4785) was
              // still red three days later. Nothing but an author push could
              // free it, and the author had been told not to push.
              //
              // So a red that predates the last change to the check's own code
              // is stale evidence, exactly like a stale gate verdict, and is
              // not allowed to veto the re-run. Self-limiting: the re-run
              // restamps the check, so a PR that is genuinely broken fails
              // again with a current timestamp and is skipped from then on.
              //
              // KNOW WHAT THE RE-RUN CAN AND CANNOT DO. `reRunWorkflow` replays
              // the run's stored `head_sha`. For a `pull_request` event that is
              // the merge commit GitHub resolved when the run was FIRST created,
              // so the replay checks out the base as it stood then — not main as
              // it stands now. Measured on #4725: attempt 2 started 2026-09-13
              // against a head_sha dated 2026-09-09 and printed "3432 entries",
              // the count from that day, then failed on the same #4731 bug that
              // main had already fixed.
              //
              // Consequence, and it is the whole reason this paragraph exists:
              // for a pull request whose merge commit falls INSIDE a bad window
              // on main, a re-run cannot produce a true verdict. It re-fails,
              // now with today's timestamp, and afterwards reads as "checked
              // today, broken today" when it is neither. Only a new event — an
              // author push, or a maintainer merging locally — resolves those.
              // The re-run is still worth spending once, because the gate is a
              // separate App check that DOES re-evaluate against current data,
              // and refreshing the gate verdict is most of the value. Do not
              // read a red `check` here as a statement about the submission
              // without looking at what tree it ran on.
              const checkRanAt = Date.parse(check?.completed_at ?? '')
              const checkStale = checkChangedAt && (!checkRanAt || checkRanAt < checkChangedAt)
              if (check && check.conclusion !== 'success' && !checkStale) continue

              // Three reasons to re-run, and only three.
              const ranAt = Date.parse(gate?.completed_at ?? '')
              // 1. No verdict at all — the PR predates the gate, or its run died
              //    before reporting. Nothing has vouched for it, which looks
              //    identical to "passed" when scanning a PR list for green.
              const never = !gate
              // 2. The verdict predates the current gate (see above).
              const stale = gate && gateChangedAt && (!ranAt || ranAt < gateChangedAt)
              // 3. It failed on age or commit count, which time alone fixes.
              //    Once a day, not once a pass: the age bar is measured in whole
              //    days, so re-asking every six hours spends three runs to hear
              //    the same answer. Without the cooldown, a repository that is
              //    genuinely too new camps at the head of an oldest-first queue
              //    and re-runs forever while the rest of the backlog waits.
              const aged = gate?.conclusion === 'failure'
                && /days old|commit\(s\)/.test(gate.output?.summary ?? '')
                && (!ranAt || Date.now() - ranAt >= 24 * 3600 * 1000)
                // 3b. It reported `neutral`, which is the gate failing OPEN: when
                //    the repository lookup errors (HTTP 403 under rate limit) the
                //    gate lets the entry through and says so in its own summary —
                //    "let through unchecked ... nothing here vouches for them".
                //    That is reason 1's problem exactly (nothing vouched for it,
                //    and a PR list scanned for green reads it as fine), but
                //    `never` is false because a run does exist. Without this the
                //    verdict is never revisited: `aged` only matches `failure`
                //    and `passStale` only matches `success`, so a neutral sits
                //    unverified until the author happens to push again.
              const unverified = gate?.conclusion === 'neutral'

              // 4. It PASSED, but long enough ago that the verdict is a claim
              //    about a repository as it stood then. Reasons 1-3 all assume
              //    time can only improve a PR. It cannot: a submitter can force
              //    push and drop below the commit floor, rename a repo so the
              //    entry URL 404s, or delete it outright — and the green stays
              //    green, because nothing here ever re-asked. #1022 had both at
              //    once (three repos fell to 6/9/9 commits, a fourth went 404)
              //    a day after "All 11 submitted entries pass". Caught by a
              //    human re-check, which is not a control.
              const passStale = gate?.conclusion === 'success' && ranAt && (Date.now() - ranAt) > PASS_STALE_MS

              // 5. `check` is red on evidence older than the code it ran. The
              //    four reasons above all read the GATE's verdict, so a PR whose
              //    gate is green and current but whose `check` went red during a
              //    main-side outage matched none of them — it just sat there,
              //    unmergeable and unexamined. It is blocking, not speculative:
              //    a red check is the thing standing between the author and a
              //    merge, and no one else is going to clear it.
              const checkStaleRed = check && check.conclusion !== 'success' && checkStale

              if (never) blocking.push([pr, runId, 'never gated'])
              else if (unverified) blocking.push([pr, runId, 'gate failed open (neutral) — never verified'])
              else if (aged) blocking.push([pr, runId, 'aged in'])
              else if (checkStaleRed) blocking.push([pr, runId, 'check failed before the current check code'])
              else if (stale) revalidate.push([pr, runId, 'verdict predates the current gate'])
              else if (passStale) speculative.push([pr, runId, `passing verdict is ${Math.round((Date.now() - ranAt) / 3600000)}h old`])
            }

            // Blocked first: those PRs cannot proceed without the re-run. Then
            // re-validation of verdicts issued by gate code that no longer
            // exists, then re-checking greens — both oldest verdict first.
            revalidate.sort((a, b) => a[0].number - b[0].number)
            speculative.sort((a, b) => a[0].number - b[0].number)
            for (const [pr, runId, why] of [...blocking, ...revalidate, ...speculative]) {
              if (requeued >= MAX) { core.info(`hit MAX_RERUNS=${MAX}, stopping`); break }
              core.info(`#${pr.number}: ${why}`)
              try {
                await github.rest.actions.reRunWorkflow({ owner, repo, run_id: runId })
                core.info(`#${pr.number}: re-ran PR check`)
                requeued++
              } catch (e) {
                if (e.status === 403) { core.warning('rate limited — stopping early'); break }
                core.info(`#${pr.number}: could not re-run (${e.status})`)
              }
            }
            core.info(`re-queued ${requeued} pull request(s) (${blocking.length} blocked, ${revalidate.length} to re-validate, ${speculative.length} stale-pass candidates)`)

            } catch (e) {
              if (e.status === 403 || e.status === 429) core.warning(`API quota busy — skipping this pass (${e.status})`)
              else throw e
            }
