name: Re-check gated submissions

# A gate verdict is a snapshot, and snapshots go out of date two ways.
#
# By the clock: a PR blocked at "0.5 days old" qualifies a few hours later, but
# nothing re-runs the check, so it sits red until someone pushes.
#
# By the code: when the gate itself changes, every verdict it issued earlier was
# decided by code that no longer exists. Re-running only the failures leaves the
# worse half unattended — a stale red gets noticed by its author, a stale green
# gets merged. This re-runs `PR check` (which re-triggers the gate) on open PRs
# that aged in, whose verdict predates the current gate, or that were never
# gated at all.
#
# Kept deliberately cheap: one page of runs is indexed by head SHA up front
# rather than queried per pull request, and MAX_RERUNS bounds each pass. The
# first version issued two calls per open PR and exhausted the hourly quota.

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  pull-requests: read

concurrency:
  group: regate
  cancel-in-progress: true

jobs:
  regate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          # Raised from 12 when re-running stale verdicts was added: that rule
          # has a one-off backlog to clear, and at 12 per six hours a gate fix
          # would take days to reach every open PR. Each pass costs one read per
          # open PR plus one write per re-run, so this stays well inside quota.
          MAX_RERUNS: '20'
        with:
          script: |
            const { owner, repo } = context.repo
            const MAX = Number(process.env.MAX_RERUNS)
            // How old a passing verdict may get before it is worth re-asking.
            // Two days: long enough that routine same-day merges never trigger
            // it, short enough that a PR sitting in the queue is re-checked
            // several times before anyone merges it.
            const PASS_STALE_MS = 48 * 3600 * 1000

            // Housekeeping: a busy API quota is a reason to do less this pass,
            // never a reason to page anyone with a red run. Everything below is
            // wrapped so the job only fails on a genuine bug.
            try {

            // One request: recent PR-check runs, indexed by the commit they ran on.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'pr-check.yml', per_page: 100,
            })
            const runBySha = new Map()
            for (const r of runs.data.workflow_runs) if (!runBySha.has(r.head_sha)) runBySha.set(r.head_sha, r.id)

            // When did the gate last change? Any verdict older than that was
            // reached by code that is gone. Found the hard way: a gate bug fixed
            // on 2026-08-17 left open PRs showing "all entries pass" for entries
            // that the current gate rejects outright.
            let gateChangedAt = 0
            for (const path of ['.github/workflows/pr-gate.yml', 'scripts/check-submission.mjs']) {
              try {
                const { data } = await github.rest.repos.listCommits({ owner, repo, path, per_page: 1 })
                const at = Date.parse(data[0]?.commit?.committer?.date ?? '')
                if (at > gateChangedAt) gateChangedAt = at
              } catch (e) {
                if (e.status === 403 || e.status === 429) { core.warning('rate limited reading gate history'); break }
              }
            }
            core.info(`gate last changed: ${gateChangedAt ? new Date(gateChangedAt).toISOString() : 'unknown'}`)

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
            // Oldest first. pulls.list answers newest-first, and only
            // `speculative` was ever sorted (below) — so `urgent` inherited that
            // order and MAX_RERUNS truncated its tail, which is exactly where
            // the pull requests blocked longest live. #2146 sat on a "resubmit
            // in about 24h" verdict for 119 hours: every pass re-ran twenty
            // newer submissions and stopped before reaching it. Twenty-two of
            // them were in that state on 2026-08-25, the oldest five days deep.
            prs.sort((a, b) => a.number - b.number)

            // The run id used to come only from the map of the last 100 PR-check
            // runs above, which covers roughly two hours of activity here. Any
            // pull request not pushed to inside that window failed the lookup
            // and was skipped before a single reason below was evaluated —
            // invisible to the sweep rather than merely last in line. The check
            // run already names its own workflow run, so ask it.
            const runIdFrom = (url) => {
              const m = /\/actions\/runs\/(\d+)/.exec(url ?? '')
              return m ? Number(m[1]) : null
            }
            // Collected first, re-run second, so the cheap-and-urgent reasons
            // are never crowded out by the speculative one (see PASS_STALE).
            const urgent = []
            const speculative = []
            let requeued = 0
            for (const pr of prs) {
              if (pr.draft) continue
              // Nothing found past this point can be re-run this pass anyway,
              // and each iteration costs a listForRef. Stopping here makes the
              // sweep cheaper than the version that scanned every open PR to
              // build a list it was about to truncate.
              if (urgent.length >= MAX) break

              let gate, check
              try {
                const { data } = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 30 })
                gate = data.check_runs.find((c) => c.name === 'Submission gate')
                check = data.check_runs.find((c) => c.name === 'check')
              } catch (e) {
                if (e.status === 403) { core.warning('rate limited — stopping early'); break }
                continue
              }

              const runId = runBySha.get(pr.head.sha) ?? runIdFrom(check?.details_url)
              if (!runId) continue // nothing to re-trigger

              // A failing `check` means the PR's own content is wrong; time
              // will not fix that, and re-running just burns quota.
              if (check && check.conclusion !== 'success') continue

              // Three reasons to re-run, and only three.
              const ranAt = Date.parse(gate?.completed_at ?? '')
              // 1. No verdict at all — the PR predates the gate, or its run died
              //    before reporting. Nothing has vouched for it, which looks
              //    identical to "passed" when scanning a PR list for green.
              const never = !gate
              // 2. The verdict predates the current gate (see above).
              const stale = gate && gateChangedAt && (!ranAt || ranAt < gateChangedAt)
              // 3. It failed on age or commit count, which time alone fixes.
              //    Once a day, not once a pass: the age bar is measured in whole
              //    days, so re-asking every six hours spends three runs to hear
              //    the same answer. Without the cooldown, a repository that is
              //    genuinely too new camps at the head of an oldest-first queue
              //    and re-runs forever while the rest of the backlog waits.
              const aged = gate?.conclusion === 'failure'
                && /days old|commit\(s\)/.test(gate.output?.summary ?? '')
                && (!ranAt || Date.now() - ranAt >= 24 * 3600 * 1000)
                // 3b. It reported `neutral`, which is the gate failing OPEN: when
                //    the repository lookup errors (HTTP 403 under rate limit) the
                //    gate lets the entry through and says so in its own summary —
                //    "let through unchecked ... nothing here vouches for them".
                //    That is reason 1's problem exactly (nothing vouched for it,
                //    and a PR list scanned for green reads it as fine), but
                //    `never` is false because a run does exist. Without this the
                //    verdict is never revisited: `aged` only matches `failure`
                //    and `passStale` only matches `success`, so a neutral sits
                //    unverified until the author happens to push again.
              const unverified = gate?.conclusion === 'neutral'

              // 4. It PASSED, but long enough ago that the verdict is a claim
              //    about a repository as it stood then. Reasons 1-3 all assume
              //    time can only improve a PR. It cannot: a submitter can force
              //    push and drop below the commit floor, rename a repo so the
              //    entry URL 404s, or delete it outright — and the green stays
              //    green, because nothing here ever re-asked. #1022 had both at
              //    once (three repos fell to 6/9/9 commits, a fourth went 404)
              //    a day after "All 11 submitted entries pass". Caught by a
              //    human re-check, which is not a control.
              const passStale = gate?.conclusion === 'success' && ranAt && (Date.now() - ranAt) > PASS_STALE_MS

              if (never || stale || aged || unverified) urgent.push([pr, runId, never ? 'never gated' : stale ? 'verdict predates the current gate' : aged ? 'aged in' : 'gate failed open (neutral) — never verified'])
              else if (passStale) speculative.push([pr, runId, `passing verdict is ${Math.round((Date.now() - ranAt) / 3600000)}h old`])
            }

            // Urgent first: those PRs are blocked on the re-run, while a stale
            // pass is only *possibly* wrong. Whatever budget is left goes to
            // re-checking greens, oldest verdict first.
            speculative.sort((a, b) => a[0].number - b[0].number)
            for (const [pr, runId, why] of [...urgent, ...speculative]) {
              if (requeued >= MAX) { core.info(`hit MAX_RERUNS=${MAX}, stopping`); break }
              core.info(`#${pr.number}: ${why}`)
              try {
                await github.rest.actions.reRunWorkflow({ owner, repo, run_id: runId })
                core.info(`#${pr.number}: re-ran PR check`)
                requeued++
              } catch (e) {
                if (e.status === 403) { core.warning('rate limited — stopping early'); break }
                core.info(`#${pr.number}: could not re-run (${e.status})`)
              }
            }
            core.info(`re-queued ${requeued} pull request(s) (${urgent.length} urgent, ${speculative.length} stale-pass candidates)`)

            } catch (e) {
              if (e.status === 403 || e.status === 429) core.warning(`API quota busy — skipping this pass (${e.status})`)
              else throw e
            }
