name: 📋 清单或网站的问题
description: 条目有误、失效、分类不对，或 awesome-dsh-plugin.com 网站异常
labels: [list]
body:
  - type: markdown
    attributes:
      value: |
        本仓库**只**维护插件清单和它的网站。

        在**市场界面里**看到的问题（安装卡住、一键安装组件失败、找不到 pnpm、深色模式显示异常）请到 [dsh-market](https://github.com/dsh-market/dsh-market/issues)；
        **插件自身**的 bug 请到该插件的仓库提。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 条目的仓库没了、已归档或装不上了
        - 条目分类不对
        - 条目描述有误或有误导
        - 两个条目是同一个插件
        - 网站有问题
        - 其他清单相关问题
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: 哪个条目
      description: 请粘贴清单里显示的 GitHub 地址；网站问题可留空
      placeholder: https://github.com/owner/repo
  - type: textarea
    id: detail
    attributes:
      label: 具体问题
      description: 「装不上」请贴出 `dsh plugin add` 的输出；网站问题请附页面地址和截图
    validations:
      required: true
