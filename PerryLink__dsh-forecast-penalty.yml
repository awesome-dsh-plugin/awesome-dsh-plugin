  en: "Forecast-deviation and assessment-ledger check for DeepSeek Harness: check forecast deviation and assessment ledgers against the currency-code standard and the applicable electricity-market assessment rules and grid-connection dispatch agreement (no national standard). Flags discrepancies only and makes no conclusive judgment."
