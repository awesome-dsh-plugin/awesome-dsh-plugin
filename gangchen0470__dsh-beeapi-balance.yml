name: gangchen0470/dsh-beeapi-balance
category: usage
description:
  en: 'Shows BeeAPI account balance in DSH with manual and automatic refresh and a fixed-rate CNY estimate. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 中显示 BeeAPI 账户余额，支持手动与自动刷新，并按固定汇率估算人民币金额。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
