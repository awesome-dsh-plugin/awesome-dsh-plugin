url: https://github.com/aaron999-h/dsh-screenshot
name: aaron999-h/dsh-screenshot
category: ui
description:
  en: 'Adds a screenshot row to the DSH composer + menu (plus a system-wide Alt+A hotkey that works while DSH is minimized): pick a window or drag a region anywhere on the desktop (DSH stays visible), annotate it with rectangle, ellipse, line, arrow, pen, mosaic and text, stitch a scrolling page into one tall image, then insert it into the draft, copy it, or save it. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 输入框的「+」菜单里增加「截图提问」，并注册系统级 Alt+A 热键（DSH 最小化时也能用）：DSH 窗口不隐藏，可直接选中窗口或在整个桌面上框选区域，用矩形、椭圆、直线、箭头、画笔、马赛克、文字标注，也能把需要滚动的长页面拼成一张长图，再插入对话、复制或另存为。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/aaron999-h/dsh-screenshot/main/assets/icon-180.png
tarball: https://github.com/aaron999-h/dsh-screenshot/releases/latest/download/dsh-screenshot.tgz
