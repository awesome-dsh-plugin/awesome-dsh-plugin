description:
  en: 'Give each DSH session its own GitHub watch: reviews on the PR it opened, failing CI, issues assigned to it and @mentions arrive in the next turn; an idle session can turn up on its own to fix them. Read-only.'
  zh: '让 DSH 的会话自己盯 GitHub：它提的 PR 被评审、CI 挂了、派给它的 issue 有人回，都会在下一轮自动进上下文；会话空闲时还能自己开一轮去修。只读，不改仓库。'
