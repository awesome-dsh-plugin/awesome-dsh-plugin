description:
  en: 'Generate and edit images in DSH conversations using cloud or local models, with provider presets and configurable image APIs. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 对话中生成和编辑图片，支持云端和本地模型、提供商预设及自定义生图 API。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
