url: https://github.com/Tera-Dark/dsh-desk-kit
name: Tera-Dark/dsh-desk-kit
category: ui
description:
  en: 'Reminders, quick notes with screenshots, a bookmark grid and an encrypted vault in one sidebar tab, plus 27 agent tools, global search, and backup export/import; data stays local in ~/.dsh/desk-kit. Its loopback HTTP API checks Host, Origin and an x-desk-kit header instead of using DSH session auth, so other local processes can call it.'
  zh: '侧栏标签页里的定时提醒、能贴截图的随手便签、网页收藏格子和加密保险库，另带 27 个 Agent 工具、全局搜索与备份导入；数据只落在本机 ~/.dsh/desk-kit。它的 HTTP 接口只接受本机回环地址，靠 Host、Origin 与 x-desk-kit 头校验而不是 DSH 会话鉴权，因此本机其它进程可以调用。'
