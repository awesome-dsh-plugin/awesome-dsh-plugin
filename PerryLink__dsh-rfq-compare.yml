url: https://github.com/PerryLink/dsh-rfq-compare
name: PerryLink/dsh-rfq-compare
category: workflow
description:
  en: "Compare supplier quotes for the same materials: lowest and next-lowest price, price gap and lead time, flagging below-cost, over-budget or expired quotes, then export a CSV."
  zh: "把多家供应商对同一批物料的报价压进一张表：最低价、次低价、价差与交期，标出低于成本线、超预算或已过期的报价，导出 CSV。"
