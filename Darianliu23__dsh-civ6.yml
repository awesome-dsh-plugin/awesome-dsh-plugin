url: https://github.com/Darianliu23/dsh-civ6
name: Darianliu23/dsh-civ6
category: fun
description:
  en: 'Lets the session''s own model play Civilization VI through civ6-mcp (a fork of lmwilki/civ6-mcp, branch base-game-compat, installed separately), which reads state and issues commands over the game''s Tuner port. Registers three session presets: the AI plays on its own, an advisor limited to read-only tools, and co-op where it acts on request and the player can take over at any time. A civ6 gateway tool also works in every session, including ones already started. A config card sets the gateway mode, extra instructions, base-game mode (hides expansion-only tools) and the civ6-mcp folder.'
  zh: '让会话自己的模型玩《文明6》：通过 civ6-mcp（lmwilki/civ6-mcp 的分叉，base-game-compat 分支，需另外安装）经游戏的 Tuner 端口读取局面、发出操作。注册三个会话预设：AI 自己玩、只有查询工具的助理、按你的话操作且可随时接手的一起玩；另有一个所有会话（包括已经聊过的）都能用的 civ6 入口工具。配置卡片里可以设入口工具的玩法、给 AI 的额外要求、原版规则模式（隐藏资料片专属工具）和 civ6-mcp 文件夹。'
