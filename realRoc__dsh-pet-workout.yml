url: https://github.com/realRoc/dsh-pet-workout
name: realRoc/dsh-pet-workout
category: fun
description:
  en: 'Workout and water-reminder companion for PC2005-cloud/dsh-pet. Work out together: from the pet''s right-click More menu, the Dafeiyu pet leads a 6-minute leg strength routine (or a 1-minute trial) with demonstration animations, bubble countdowns, rests and the occasional slacking-off gag; dragging or clicking her pauses it. Water reminder: every 45 minutes by default (30/45/60/90 or off) she hands you a water bottle, and if you ignore her she escalates every 5 minutes: demonstrates drinking, walks to the middle of the screen and knocks, then hurls a giant water jug and sulks at the screen edge for a few minutes. Click her to log a cup (8 a day). Counts only while you are at the keyboard and stays quiet from 22:00 to 09:00. Drives dsh-pet only through its public HTTP API; workout plans are JSON files. Requires dsh-pet 0.4.8 or later. Its clip route requires DSH''s own access check or a random per-launch key it hands only to dsh-pet.'
  zh: 'dsh-pet 的配套插件：一起锻炼 + 喝水提醒。一起锻炼：在宠物右键「更多」里开练，大肥鱼带你做 6 分钟腿部力量训练（或 1 分钟试练），有示范动画、气泡倒计时、休息和偶尔偷懒的小彩蛋；拖一下或点一下她就暂停。喝水提醒：默认每 45 分钟（可选 30/45/60/90 或关）递水壶催你喝水，不理她就每 5 分钟加码：示范喝水、走到屏幕中间敲屏幕、最后扔大水并躲到屏幕边上生几分钟气；点她一下就记一杯（一天 8 杯）。只在你坐在电脑前时计时，22 点到 9 点不提醒。只通过 dsh-pet 公开的 HTTP 接口指挥宠物，训练计划是 JSON 文件。需要 dsh-pet 0.4.8 及以上。它托管动画的 HTTP 路由要过 DSH 的访问检查，或带每次启动随机生成、只交给 dsh-pet 的钥匙。'
