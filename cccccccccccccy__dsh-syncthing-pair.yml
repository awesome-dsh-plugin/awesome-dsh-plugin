name: cccccccccccccy/dsh-syncthing-pair
category: remote
description:
  en: 'Pairs one folder on this Mac with one folder on a remote Mac over SSH and creates the same two-way Syncthing folder on both sides, with a DSH Web panel and an agent tool. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '输入本机与远端 Mac 的两个目录，通过 SSH 在两端创建同一个 Syncthing 双向文件夹；带 DSH 网页面板和 agent 工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/cccccccccccccy/dsh-syncthing-pair/main/assets/icon-180.png
