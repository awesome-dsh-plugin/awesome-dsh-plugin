url: https://github.com/ZhongqiXiao/dsh-annotator
name: ZhongqiXiao/dsh-annotator
category: browser
description:
  en: 'Pick elements on a real Chrome, Edge or ego lite page inside DeepSeek Harness, comment and screenshot them, then insert them into the chat as reference chips; the agent receives the CSS selector, page position, comment and screenshot and edits the front end you are looking at. Reference mode splits annotations into a changes column and a read-only references column, pairs each change with 1:N references, tags the dimension to imitate (layout, spacing, color, type, radius, interaction, copy), and emits one instruction block that says what to change, what to only imitate, and to self-check each item.'
  zh: '在 DeepSeek Harness 里拾取真实 Chrome / Edge / ego lite 页面上的元素，写评论、截元素图，再把标注作为引用芯片插入对话——agent 拿到 CSS 选择器、页面位置、评论与截图，照着你眼前的界面改前端。参照模式把标注分成「改动区」与只读的「参照区」两栏，一条改动可挂多条参照（1:N）并标明照哪些维度（布局、间距、配色、字号、圆角、交互、文案），生成的提示词带任务说明与逐条执行要求：哪些必须改、哪些只准照、改完逐条自检。'
