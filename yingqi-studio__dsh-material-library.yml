name: yingqi-studio/dsh-material-library
category: session
description:
  en: 'Collect a folder, file or note from a conversation into real folders on disk with tags, browse it Finder-style, and jump back to the source chat in one click — entries reference the original path rather than copying it. Includes a materials_archive tool and auto-filing rules: file a task''s deliverable once and later scheduled runs file their new documents into the same folder.'
  zh: '对话里产出的成品收藏夹：把聊出来的目录、文件或笔记收进本地真实文件夹，打标签、按 Finder 方式浏览、点一下跳回原会话，条目只记原路径不复制文件。内置 materials_archive 工具与自动归档规则：某个任务的成品收过一次，之后每次定时任务跑完都会自动把新成品归档到同一个文件夹。'
