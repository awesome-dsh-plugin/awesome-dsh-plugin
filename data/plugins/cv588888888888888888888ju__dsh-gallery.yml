description:
  en: 'Image gallery for the conversation: collect local files, image URLs and conversation attachments into albums (content-hash dedup), tag them, find them by keyword or tag, and send them back as native markdown images; ships a settings panel, an input-box picker, and a pack market with SHA-256 verified installs plus ZIP import/export.'
  zh: '对话里的图片收藏夹：本地文件、网图 URL、对话附件一键收进专辑（按内容哈希去重），打标签、按关键词或分类找图，并以原生 markdown 图片直接发出；带设置面板、输入框选图器，以及带 SHA-256 校验的图包市场与 ZIP 导入导出。'
