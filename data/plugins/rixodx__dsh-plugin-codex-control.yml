name: rixodx/dsh-plugin-codex-control
category: workflow
description:
  en: 'Local CLI bridge for Codex or terminals to create and continue conversations in the running Harness desktop/Web Host, query progress, wait for output, and cancel tasks. Needs Harness 0.2.2-rc.1 and Node.js 24.9+. Requests travel through a per-user file queue in the Harness home (no network port), and approvals and questions stay in the Harness UI.'
  zh: '让 Codex 或终端通过本机 CLI 桥接正在运行的 Harness 桌面/Web Host，创建与续接界面会话、查询进度、等待输出和取消任务。需要 Harness 0.2.2-rc.1 与 Node.js 24.9+。请求经 Harness home 下按用户隔离的文件队列传递（不开网络端口），权限审批和提问仍在 Harness 界面里处理。'
