description:
  en: 'Read web novels inside the DSH web GUI: import legado book sources, search across them, keep a bookshelf with reading progress, read in one continuous scroll, import local TXT and EPUB books, and let agent tools reach the same sources, shelf and text.'
  zh: '在 DSH Web GUI 里读网络小说：导入 legado 书源、跨源搜索、带进度的书架、连续滚动阅读、导入本地 TXT 与 EPUB，并让 AI 助手工具接到同一套书源、书架与正文上。'
