url: https://github.com/NoiraBaka/dsh-compact-suite
name: NoiraBaka/dsh-compact-suite
category: session
description:
  en: 'Takes over the compaction threshold on every mounted engine: forces headroomTokens to -1e6 so the ratio is the only term in the trigger, keeps retention below it on every write path, reroutes the compaction call to a chosen model, and adds a panel with a one-click compaction button and a per-session compaction log.'
  zh: '接管所有已挂载压缩引擎的触发阈值：把 headroomTokens 强制成 −1e6，使比值成为触发点的唯一决定项；在每条下发路径上保证保留量低于触发点；把压缩调用改派到指定模型；并提供一键立即压缩与本会话压缩记录面板。'
