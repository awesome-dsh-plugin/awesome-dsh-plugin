name: JialaoLiu/dsh-baton#dsh-baton
category: workflow
description:
  en: 'Let Claude Code or Codex do the thinking: understand the request, write a clear prompt for DeepSeek Harness to do the work, and review the result. dsh-baton runs your tests itself, lists what changed, and has a sub-agent check every requirement, so your main model only reads the result and decides. On big jobs it saves most of your plan''s quota.'
  zh: '让 Claude Code 或 Codex 负责动脑：理解需求，写好 prompt 交给 DeepSeek Harness 去干活，最后把关。dsh-baton 会自己跑测试、列出改了哪些文件，再派一个子代理逐条核对需求，你的主力模型只看结果拍板。大任务能省下大半订阅额度。'
