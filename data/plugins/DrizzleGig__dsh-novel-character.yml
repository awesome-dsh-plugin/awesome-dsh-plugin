url: https://github.com/DrizzleGig/dsh-novel-character
name: DrizzleGig/dsh-novel-character
category: fun
description:
  en: 'Import a novel you like, choose a character, and talk with a familiar character. It extracts character information, speech samples, relationships and mental states from the original text to build an evidence-based character profile. As you chat, the character accumulates memories, adjusts trust and attitude toward you, and carries the relationship across sessions.'
  zh: '导入你喜欢的小说，选择其中的人物，让熟悉的角色与你展开对话。它从原文中提取角色信息、语言样本、人物关系和心理状态，建立有原文依据的角色档案。聊天过程中，角色会根据对话积累记忆、调整对你的信任与态度，并在不同会话之间延续关系。'
