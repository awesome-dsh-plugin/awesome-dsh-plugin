url: https://github.com/DrizzleGig/dsh-novel-character
name: DrizzleGig/dsh-novel-character
category: fun
description:
  en: 'Turn a novel into a character conversation: import TXT/MD/EPUB/DOCX or your own draft, build evidence-based character cards, and talk to a character who keeps their canon memories, voice, relationships and a choosable chapter-memory boundary. Includes 12 themes, local avatars with web search / official matching / upload, and built-in expression cards; chats stay local and never edit the novel.'
  zh: '把小说变成角色对话：导入 TXT/MD/EPUB/DOCX 或原创稿，建带原文依据的角色卡，和保留原文记忆、口吻、关系与可调章节记忆边界的角色聊天。12 套主题、本地头像（网页搜图/官方匹配/上传）、内置表情卡；聊天只存本机，不改正文。'
