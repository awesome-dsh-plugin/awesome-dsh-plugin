description:
  en: 'Adds SSH, WSL and Docker projects to the native DSH sidebar. Choose a local Agent with shared files or a full remote DSH backend, and selectively sync local Skills with difference previews and explicit updates.'
  zh: '在当前 DSH 窗口的原生侧栏中添加 SSH / WSL / Docker 项目，支持轻量模式与全量远程 DSH、密码/密钥/证书认证，以及可勾选、比较差异和更新的本机 Skill 同步。'
