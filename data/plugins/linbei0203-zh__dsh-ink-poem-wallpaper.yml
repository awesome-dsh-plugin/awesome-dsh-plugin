url: https://github.com/linbei0203-zh/dsh-ink-poem-wallpaper
name: linbei0203-zh/dsh-ink-poem-wallpaper
category: theme
description:
  en: 'Wallpaper of a daily Chinese couplet set in a brush face on an ink-wash landscape drawn as SVG from the verse itself, with a re-cut Qin bird-worm seal; both are draggable, and the plugin makes no network requests. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '水墨诗词壁纸：每天一句中国古典诗词，题在一幅随句意现场生成的 SVG 水墨山水上，配一枚重刻边框的秦式鸟虫篆朱印；诗句与朱印均可拖动，插件不发网络请求。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/linbei0203-zh/dsh-ink-poem-wallpaper/main/docs/icon.png
