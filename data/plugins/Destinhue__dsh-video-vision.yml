description:
  en: 'Four tools for reading a video as raw material rather than as something to watch: video_probe returns metadata and a reading plan without decoding frames; video_storyboard turns a window into one contact sheet plus a text index binding every cell to its timecode, cut count and frame time; video_zoom re-renders 1-9 cells from a short window at a larger scale; and video_read decodes only keyframes, OCRs each screen with the OCR engine Windows already ships, and returns an outline plus [mm:ss] text -- the path for lectures, slide decks and screen recordings, where the words are the content. Cuts, dissolves and one-frame flashes are found in a single ffmpeg pass, cell numbers are burned in as bitmaps, and subtitle tracks are quoted on the cell their cue falls in. It also takes a B station link (bilibili.com/video/BV..., a bare BV id, an av id or a b23.tv short link) wherever it takes a file: by default a clip of up to 300 seconds is read from the CDN in place with nothing written to disk, while longer videos are downloaded once and cached; a probe on a link answers without downloading. Needs ffmpeg, uses ffprobe when present, and has no other runtime dependencies. Dialogue can come from a supplied SRT/WebVTT/JSON file, the embedded subtitle track, or a speech engine of your own through DSH_ASR_CMD; invented lines are filtered and the manifest reports how many. It is a wire-compatible reimplementation of SAOS-3624/dsh-video-storyboard: it registers the same video_probe / video_storyboard / video_zoom tool names, so the two cannot be enabled together.'
  zh: '四个把视频当原料而不是当节目看的工具：video_probe 返回元数据与阅读计划，不解码画面；video_storyboard 把一个时间窗口压成一张分镜图，再给一份文本索引，把每一格绑到它的时间码、切点数与取帧时刻；video_zoom 把短窗口里的 1-9 格按更大尺寸重画；video_read 只解关键帧，用 Windows 自带的 OCR 引擎逐屏识字，返回大纲与 [mm:ss] 正文——讲课、幻灯片、录屏走这条，因为字才是内容。切点、叠化与单帧闪光由一次 ffmpeg 扫描得出，格子编号以位图写在图上，字幕按落在哪一格就写在哪一格。它还能在原本要传文件的地方直接吃 B 站链接（bilibili.com/video/BV…、裸 BV 号、av 号或 b23.tv 短链）：默认 300 秒以内的短片直接从 CDN 就地读取、不落盘，更长的视频下载一次并缓存；对链接做 probe 不需要下载。对话还能来自自带的 SRT/WebVTT/JSON 文件、内嵌字幕轨，或用 DSH_ASR_CMD 接入自己的语音引擎；编造的台词会被过滤，清单里会报告过滤了多少行。需要 ffmpeg，有 ffprobe 时会用，除此之外无运行时依赖。它与 SAOS-3624/dsh-video-storyboard 接口兼容，注册同名的 video_probe / video_storyboard / video_zoom 三个工具，两者不能同装。'
