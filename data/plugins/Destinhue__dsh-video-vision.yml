description:
  en: 'Five tools for reading a video as raw material rather than as something to watch. video_outline maps a whole file as text and draws nothing at all: 4-60 equal windows, each with its cut count, speech share, intensity bar and tags, then the windows worth opening and the exact start/end for the call that follows -- zero image tokens. video_probe returns metadata and a reading plan without decoding frames. video_storyboard turns a window into one contact sheet plus a text index binding every cell to its timecode, cut count and frame time; cells whose text would be illegible at that scale are marked zoom, and dedupe global folds a picture that comes back after a cut. video_zoom re-renders 1-9 cells from a short window at a larger scale. video_read decodes only keyframes, OCRs each screen, and returns an outline plus [mm:ss] text -- the path for lectures, slide decks and screen recordings, where the words are the content. It also reads a file with sound and no picture as a transcript (subtitle track, then DSH_ASR_CMD, then a transcript file you pass; long audio is cut at 45 s onto silence), composes six changed frames into one sheet when a file has no readable text at all, and can write the result out as SRT, WebVTT or text. Cuts, dissolves and one-frame flashes are found in a single ffmpeg pass; from ten minutes up a file is analysed on its keyframes only, 2.7x faster on a two-hour lecture; and a cell is never shrunk below a fifth of the source, so a 1440p sheet spends the same tokens on fewer, bigger cells. OCR is the engine Windows ships, tesseract with line boxes, or DSH_OCR_CMD. It takes a B station link (bilibili.com/video/BV..., a bare BV id, an av id or a b23.tv short link) wherever it takes a file: up to 300 seconds is read from the CDN in place with nothing written to disk, longer videos are downloaded once and cached within a 4 GB / 24 video budget, play URLs are cached for ten minutes, and a link that is not a single video says what it is. Needs ffmpeg, uses ffprobe when present, and has no other runtime dependencies. It is a wire-compatible reimplementation of SAOS-3624/dsh-video-storyboard: it registers the same video_probe / video_storyboard / video_zoom tool names, so the two cannot be enabled together.'
  zh: '五个工具，把视频当成原料而不是节目来读。video_outline 把整片映射成文字、一张图都不画：4-60 个等分窗口，每行给切点数量、语音占比、强度条和标签，再给出值得先看的窗口以及下一步的精确 start/end —— 零图像 token。video_probe 不解码画面就给元数据和阅读计划。video_storyboard 把一个时间窗口压成一张分镜图，再给一份文本索引，把每一格绑到时间码、切点数量与取帧时刻；在那一档尺寸下文字会糊掉的格子会被标记 zoom，dedupe global 可以把切走之后又回来的画面折叠掉。video_zoom 把短窗口里的 1-9 格按更大尺寸重画。video_read 只解关键帧，逐屏 OCR，返回大纲加 [mm:ss] 文本 —— 讲座、幻灯片和录屏走这条，因为文字才是内容。它也能把只有声音没有画面的文件读成转录稿（字幕轨、DSH_ASR_CMD、你传的转录文件，长音频按 45 秒切在静音处），没有任何可读文字时会把六张变化过的画面拼成一张图，还可以把结果导出成 SRT、WebVTT 或纯文本。切点、叠化与单帧闪烁用一遍 ffmpeg 找出；十分钟以上的片只解关键帧分析，两小时课程快 2.7 倍；格子永远不会缩到源图的五分之一以下，所以 1440p 的图用同样的 token 换更少更大的格子。OCR 可以用 Windows 自带的引擎、带行框的 tesseract，或 DSH_OCR_CMD。凡是要文件的地方都能直接给 B 站链接（bilibili.com/video/BV…、裸 BV 号、av 号、b23.tv 短链）：300 秒以内直接在 CDN 上读、不落盘，更长的下一遍缓存，缓存有 4 GB / 24 片的预算，play 链接缓存十分钟，不是单个视频的链接会各自说明是什么。需要 ffmpeg，有 ffprobe 时用 ffprobe，除此之外没有运行时依赖。它是 SAOS-3624/dsh-video-storyboard 的接口兼容重实现：注册同样的 video_probe / video_storyboard / video_zoom 工具名，所以两者不能同时启用。'
