description:
  en: 'Four tools for reading a video as raw material rather than as something to watch: video_probe returns metadata and a reading plan without decoding frames; video_storyboard turns a window into one contact sheet plus a text index binding every cell to its timecode, cut count and frame time; video_zoom re-renders 1-9 cells from a short window at a larger scale; and video_read decodes only keyframes, OCRs each screen with the OCR engine Windows already ships, and returns an outline plus [mm:ss] text -- the path for lectures, slide decks and screen recordings, where the words are the content. Cuts, dissolves and one-frame flashes are found in a single ffmpeg pass, cell numbers are burned in as bitmaps, and subtitle tracks are quoted on the cell their cue falls in. Needs ffmpeg, uses ffprobe when present, and has no other runtime dependencies. It is a wire-compatible reimplementation of SAOS-3624/dsh-video-storyboard: it registers the same video_probe / video_storyboard / video_zoom tool names, so the two cannot be enabled together.'
  zh: '四个把视频当原料而不是当节目看的工具：video_probe 返回元数据与阅读计划，不解码画面；video_storyboard 把一个时间窗口压成一张分镜图，再给一份文本索引，把每一格绑到它的时间码、切点数与取帧时刻；video_zoom 把短窗口里的 1-9 格按更大尺寸重画；video_read 只解关键帧，用 Windows 自带的 OCR 引擎逐屏识字，返回大纲与 [mm:ss] 正文——讲课、幻灯片、录屏走这条，因为字才是内容。切点、叠化与单帧闪光由一次 ffmpeg 扫描得出，格子编号以位图写在图上，字幕按落在哪一格就写在哪一格。需要 ffmpeg，有 ffprobe 时会用，除此之外无运行时依赖。它与 SAOS-3624/dsh-video-storyboard 接口兼容，注册同名的 video_probe / video_storyboard / video_zoom 三个工具，两者不能同装。'
