url: https://github.com/lisusuba/Hardworking-donkey
name: lisusuba/Hardworking-donkey
category: ui
description:
  en: 'A full-viewport donkey-mill background for the DSH Web UI: an animated top-down donkey or a Chinese-character form circles the millstone, accelerating with the model''s live token throughput and easing to a full stop once every session stops generating; a bottom-right panel switches form, adjusts opacity and hides the scene, persisting in localStorage. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH Web UI 的全屏驴拉磨背景：俯视动画驴或汉字形态绕磨盘转动，转速随模型实时 token 吞吐加快、所有会话停止生成后减速并停住；右下角面板可切换形态、调节透明度、隐藏背景，设置保存在 localStorage。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
