url: https://github.com/wulun811/LiuHe
name: wulun811/LiuHe
category: tools
description:
  en: 'Bridges the LiuHe MCP code toolkit (44 tools) into dsh web: repo_map, symbol search, edit_batch with tolerant matching, transactional edits with undo journal, and deterministic quality gates — backed by a crash-isolated Rust tree-sitter parse daemon and SQLite index.'
  zh: 将 LiuHe MCP 代码工具集（44 个工具）桥接进 dsh web：repo_map、符号搜索、带容错匹配的 edit_batch、带撤销日志的事务性编辑，以及确定性质量门禁——由崩溃隔离的 Rust tree-sitter 解析守护进程和 SQLite 索引支撑。
  ja: LiuHe の MCP コードツールキット（44 ツール）を dsh web に橋渡しします。repo_map、シンボル検索、表記ゆれに強い edit_batch、取り消しジャーナル付きのトランザクション編集、決定論的な品質ゲートを、クラッシュを隔離した Rust の tree-sitter 解析デーモンと SQLite の索引が支えます。
