description:
  en: 'Fingerprint configured DSH models without trusting their reported token counts: a 55-vector tokenizer reference, four greedy identity probes, refusal-prose and stop-vocabulary probes, and a local 18-item weighted intelligence battery scoring 0-100 with a tier and per-question evidence, plus animated or custom SVG and HTML drawing probes, quick SVG limits, concurrency controls, and latency and token metrics. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '不依赖端点自报 token 数的模型指纹：55 条分词器参考向量、4 项温度 0 身份探针、拒绝文案与停止词表探针，以及本地 18 题加权基准给出的 0–100 智力值、档位与逐题证据；另支持动态或自定义 SVG 与 HTML 绘图、SVG 快速模式限制、并发控制及耗时与 Token 统计。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
