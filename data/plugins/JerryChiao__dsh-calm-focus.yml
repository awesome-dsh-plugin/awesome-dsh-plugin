url: https://github.com/JerryChiao/dsh-calm-focus
name: JerryChiao/dsh-calm-focus
category: notify
description:
  en: 'A rope-hung mascot at the top edge of the window speaks a short, original healing line on a timer, reminding you to stay with the current task and let outside judgement and public chatter pass; a left-sidebar panel holds a focus dialog, 5–60 minute reminder settings, a show/hide switch and an optional custom mascot image.'
  zh: '窗口顶边挂着一只吉祥物，定时用一句原创的安抚话提醒你专注手头的任务、别被外界评价和舆情带走；左侧栏面板里有专注对话框、5–60 分钟提醒设置、显示开关和可选的自定义图案。'
