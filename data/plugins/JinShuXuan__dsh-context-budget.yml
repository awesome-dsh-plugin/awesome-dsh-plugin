url: https://github.com/JinShuXuan/dsh-context-budget
name: JinShuXuan/dsh-context-budget
category: usage
description:
  en: >-
    Per-step context ledger for dsh: measures what every step actually re-sends, then offers three opt-in
    gates — a schema-budgeted tool table, long-tail result externalization, and duplicate-read pointers.
    In the author's A/B test the tool-table gate cut 16,110 first-step prompt tokens (-49.7%), about -23%
    of per-step context on long sessions. v0.3.1 adds a read-only /budget-doctor self-check, spill index
    maintenance and a growth forecast.
  zh: >-
    每步上下文账本：量化每步重发量，并提供三个可单独开关的闸门——按 schema 体积裁工具表、长结果外置、重复读回指针。
    作者 A/B 实测，工具表闸门省首步 16,110 token（-49.7%），长会话每步上下文约降 23%。
    v0.3.1 新增只读 /budget-doctor 自检、spill 索引维护与增速预测。