url: https://github.com/marsken88/dsh-studio
name: marsken88/dsh-studio
category: workflow
description:
  en: 'Role-based multi-agent board for the software lifecycle - product, architect, dev and QA agents pick up cards, a design-review gate blocks unreviewed work, regression suites run per card, and quality is reported per expert. Every HTTP route passes the DSH Host/Origin fence and requires an authenticated browser session, except the anonymous intake endpoints, which accept submissions only.'
  zh: '角色化的多智能体研发生命周期看板：产品/架构/研发/测试各自认领卡片，设计评审闸门拦住未评审的开发，用例按套件回归，效能按专家度量。所有 HTTP 路由都过 DSH 的 Host/Origin 栅栏并要求已认证的浏览器会话；只有匿名自助提单入口例外，且它只能提交。'
icon: https://raw.githubusercontent.com/marsken88/dsh-studio/main/assets/icon-180.png
