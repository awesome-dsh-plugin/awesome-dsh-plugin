name: Vhow123/dsh-drawcraft
category: ui
description:
  en: 'Drawcraft — an image-generation studio in the sidebar panel list, split into three pages that share one result. Prompt page: pick a target dialect, a style and an aspect, write one rough sentence, and a chat model returns an 11-field shot breakdown that the plugin stitches into the syntax that dialect actually accepts — six dialects (natural English, natural Chinese, GPT-Image, Midjourney, Stable Diffusion, nano-banana), 18 style presets, negative prompts, filler-word stripping and local history; an image can also be reverse-engineered into the same fields, and a one-line edit such as light turns to dusk rewrites only the named fields. Image page: text-to-image and image-to-image through three channels — a built-in Muse free-quota channel that drives muse.ai in a bundled headless browser, so you log in once and renders draw on the account weekly free quota with no second plugin and no API key (about 30 to 70 seconds per image, the aspect ratio is passed as one sentence inside the prompt, and the output is webp with a 2048 long edge); a locally installed image-generation plugin; or an OpenAI-compatible endpoint you add in the panel, whose key stays on disk and is never echoed back to the browser. With a subject image attached it posts to /images/edits and carries up to four extra references. Canvas page: an infinite canvas where image, prompt and result nodes are dragged, resized, wired by hand or by generation, with undo and redo, marquee selection, copy and paste, a minimap, pointer-centred wheel zoom and JSON export and import; rendering from a node walks the whole upstream chain so no reference is dropped, one node can be pinned as the subject, and the reference library opens inside the canvas. A reference library of 4,345 Chinese-labelled entries — 1,439 poses with matching depth maps, 1,407 outfits, 1,499 portraits — is searched and faceted by pose system, angle, category, season, hair length and hairstyle, paged 24 at a time, and the entries you pick are injected into the prompt as binding constraints. Renders can pick the image channel and model, one of eight aspect sizes or follow-the-aspect, and quality at 1K/2K/4K; a preview opens into a lightbox with pointer-centred wheel zoom from 20% to 800%, drag-to-pan, double-click reset and one-click save. The prompt tools and the library are also exposed as the optimize_image_prompt, patch_image_prompt and search_reference_gallery agent tools. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '绘语 Drawcraft——侧边栏面板里的生图工作室，分成三个页签，共用同一份结果。提示词页：选好目标方言、视觉风格与画幅，写一句人话，对话模型输出 11 字段的画面拆解，插件再拼成该方言真正认的语法——六种方言（自然英文、自然中文、GPT-Image、Midjourney、Stable Diffusion、nano-banana）、18 种风格预设、负向提示词、废词清理与本地历史；也能拖一张图反推出同一套字段，或写一句「光线换成黄昏」只重写被点名的字段。生图页：文生图与图生图有三条通道——内置的 Muse 免费额度通道，用自带的 headless 浏览器驱动 muse.ai，登录一次即可按账号的每周免费额度出图，不用装第二个插件，也不用填 API key（每张约 30 到 70 秒，画幅以一句话写进提示词，成品为长边 2048 的 webp）；本机已装的生图插件；或你在面板里自填的 OpenAI 兼容端点，密钥落盘保存、不回传给浏览器。带主体图时走 /images/edits 并最多附带四张参考图。画布页：一块无限画布，图片、提示词与结果节点可拖动、改尺寸、手动连线或按出图自动连线，支持撤销重做、框选、复制粘贴、小地图、以指针为中心的滚轮缩放与 JSON 导出导入；从节点出图会沿连线把整条上游链都收进来，不丢参考，也可以把某个节点钉成主体；参考库能直接在画布里打开。另有 4,345 条中文标注的参考库——1,439 条姿势（配同源深度图）、1,407 套服装、1,499 位人像——可按姿势体系、角度、分类、季节、发长与发型分面检索，每次翻 24 条，选中的条目会作为硬约束注入提示词。出预览图时可选出图渠道与模型、八个比例或跟随画幅、清晰度 1K/2K/4K；点开大图支持以指针为中心的滚轮缩放（20%–800%）、拖动平移、双击复位与一键保存。提示词功能与参考库同时以 optimize_image_prompt、patch_image_prompt 与 search_reference_gallery 三个智能体工具提供。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
