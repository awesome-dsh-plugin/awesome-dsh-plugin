description:
  en: A draggable tarot card back in the corner of the shell. Click to draw, right-click for the four spreads, full 78-card deck with bilingual meanings. Readings use only the cards actually drawn.
  zh: 壳一角可拖动的塔罗牌背。点一下抽牌，右击选四种牌阵，完整 78 张牌库，正逆位含义中英双语。解读只用真正抽到的牌。
