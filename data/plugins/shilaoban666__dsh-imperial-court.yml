url: https://github.com/shilaoban666/dsh-imperial-court
name: shilaoban666/dsh-imperial-court
category: workflow
description:
  en: 'Runs the AI coding CLIs on your machine as a Tang-dynasty court: one tool drafts a plan, a second tool reviews or vetoes it, six ministries carry out the steps in parallel by dependency, an inspector checks each output and a final audit runs before you approve. Each task works in its own git worktree and branch and is merged only on approval. Supports Claude Code, Codex, Gemini CLI, Cursor CLI, OpenCode, Qwen Code, WorkBuddy and DSH itself via dsh headless, with a tool catalog that shows install commands. Also includes a task queue that splits a list into separate tasks, per-call token and cost accounting with budgets, and an English Roman Senate mode.'
  zh: '把本机的 AI 编程命令行排成三省六部：一家工具拟方案，另一家审议或封驳，六部按依赖并行办差，御史逐件巡查，门下复核后由你批红。每道旨在独立的 git worktree 与分支里办，批红才合并。支持 Claude Code、Codex、Gemini CLI、Cursor CLI、OpenCode、Qwen Code、WorkBuddy 以及经 dsh headless 的 DSH 本体，内置列出安装命令的工具目录。另有把清单拆成多道旨的候旨队列、逐次调用的 token 与花销记账和预算，以及古罗马元老院英文版。'
icon: https://raw.githubusercontent.com/shilaoban666/dsh-imperial-court/master/docs/brand/icon.png
