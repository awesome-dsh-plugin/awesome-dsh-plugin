description:
  en: 'Folders for the DSH Plugins page: group installed plugins, toggle a whole group, batch move with undo, search across groups, long-press drag to reorder, reinstall removed plugins from their record, and restart Harness with one click.'
  zh: '给 DSH 插件页加文件夹：把已装插件分组、整组开关、批量移动并可撤销、跨分组搜索、长按拖动排序，卸载后按记录一键装回，还能一键重启 Harness。'
