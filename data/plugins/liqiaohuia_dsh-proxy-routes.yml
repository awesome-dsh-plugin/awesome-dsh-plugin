description:
  zh: "按提供商（账号）分流的 SOCKS5/HTTP 代理池，同域多账号的救星。针对同一模型服务商的多个账号（如NVIDIA NIM、Anthropic等），本插件基于API密钥识别账号，实现精准的账号级代理分流。完美支持 SOCKS5、HTTP/HTTPS 代理，配置在 DSH 设置页图形化管理，保存即热生效，无需手写任何配置文件。"
  en: "Per-provider (account) proxy routing for DSH. SOCKS5/HTTP proxy pool with account-level routing based on API keys, supporting multiple accounts for the same API domain (e.g., NVIDIA NIM, Anthropic). Fully supports SOCKS5, HTTP/HTTPS proxies, with a graphical settings page in DSH. Hot-reload on save, no config files needed."
