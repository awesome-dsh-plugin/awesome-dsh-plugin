description:
  en: 'Local-first experience library for DeepSeek Harness: signature-based search over plain markdown, pre-step recall that raises its own bar when hints go unread, failure-to-fix drafts, and one-click triage of the gap queue. Ships a sanitized starter library. No model calls, no network.'
  zh: '本地优先的经验库：纯 markdown 条目按报错签名检索；开口前召回按「读回率」自动抬高阈值；失败→修复自动起稿，缺口队列一键认领/归档。自带脱敏起步库，不调模型、不联网。'
