description:
  en: 'Local-first experience library for DeepSeek Harness: error-signature retrieval, pre-step recall with feedback, failure-to-fix drafts, one-click queue triage, and a full-page library view. Ships a sanitized starter library. No model calls, no network.'
  zh: '本地优先的经验库：给 DeepSeek Harness 的索引化 markdown 知识，支持错误签名检索、开口前召回（带采纳反馈）、失败→修复起草、待办一键认领/归档与整页浏览视图；自带脱敏起步库，不调模型、不联网。'
