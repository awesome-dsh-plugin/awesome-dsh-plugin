url: https://github.com/ZhengXianTai/dsh-mindmap
name: ZhengXianTai/dsh-mindmap
category: ui
description:
  en: 'A map-first DeepSeek Harness (DSH) plugin: the session tree is the main mind map, and a frosted floating chat forks a child subtopic when you send its first message. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness（DSH）插件：会话树就是主面板思维导图；在毛玻璃浮窗里发送第一条消息，会生成子话题节点。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
