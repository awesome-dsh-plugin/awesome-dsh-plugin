url: https://github.com/first-fluke/oh-my-agent/tree/main/integrations/dsh
name: first-fluke/oh-my-agent#dsh
category: dev
description:
  en: Runs project OMA checks before and after tool execution and when a turn tries to finish. Requires the OMA CLI on PATH and an initialized OMA project (.agents/oma-config.yaml or .agents/oma-config.cue); the plugin does not install OMA itself.
  zh: 在工具执行前后以及尝试结束当前轮次时运行项目 OMA 检查。需先确保 PATH 中可用 OMA CLI，并有已初始化的 OMA 项目（.agents/oma-config.yaml 或 .agents/oma-config.cue）；插件本身不安装 OMA。
