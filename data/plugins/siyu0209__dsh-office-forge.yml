description:
  en: 'Office document toolkit for DSH: Word/Excel/PowerPoint/PDF/HTML generation, editing, audit, preview, and pluggable PPT adapters. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 办公文档工具包：Word/Excel/PowerPoint/PDF/HTML 生成、编辑、审计、预览与可插拔 PPT 适配器。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
