url: https://github.com/summerscar/dsh-mnemon-sync
name: summerscar/dsh-mnemon-sync
category: memory
description:
  en: 'Backup and restore for dsh-mnemon: pick any of its three memory components (memory spaces, project documents, runtime memory) and archive them to S3-compatible storage or WebDAV, then browse the archives and restore a chosen subset. Live SQLite databases are copied through node:sqlite backup() so a concurrent writer cannot tear the copy; every file carries a SHA-256 checked before upload and again before restore; a restore previews by default and deletes the stale -wal/-shm sidecars before writing a database back. Archives are named mnemon-sync-<device>-<timestamp>.zip so backups from several machines stay tellable apart. Runs a single timer with intervals from hourly to weekly, stores credentials in a 0600 file outside the DSH profile, and depends on nothing outside Node.'
  zh: '给 dsh-mnemon 做备份与恢复：它的三类记忆组件（记忆空间、项目档案、运行时记忆）可任选，打包到 S3 兼容存储或 WebDAV，之后可浏览备份列表并只恢复选中的部分。SQLite 库经 node:sqlite 的 backup() 在线复制，写入方同时写也不会撕开副本；每个文件带 SHA-256，上传前校验一次、恢复前再校验一次；恢复默认只做预览，写回数据库前会先删掉残留的 -wal/-shm。备份文件名是 mnemon-sync-<设备名>-<时间戳>.zip，多台机器备份到同一目录也能分辨来源。定时器只有一个，间隔从每小时到每周；凭据存在 DSH profile 之外的 0600 文件里；除 Node 外没有其他依赖。'
