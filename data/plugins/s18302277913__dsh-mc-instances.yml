description:
  en: "PCL2-style Minecraft mod-testing instance manager in the DSH right sidebar: detects run/<name>/ profiles, launches and stops Gradle clients/servers, toggles mods without deleting jars, tails game and Gradle logs, creates/deletes instances, and writes IntelliJ run configurations."
  zh: "藏在 DSH 右侧栏里的 PCL2 风格 Minecraft 模组测试实例管理器：自动检测 run/<名字>/ 实例，一键启动/停止 Gradle 客户端或服务端，开关 mod 不删文件，查看游戏与 Gradle 日志，新建/删除实例，并生成 IntelliJ 运行配置。"
