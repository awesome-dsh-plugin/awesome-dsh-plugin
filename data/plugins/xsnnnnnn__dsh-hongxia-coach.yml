url: https://github.com/xsnnnnnn/dsh-hongxia-coach
name: xsnnnnnn/dsh-hongxia-coach
category: skill
description:
  en: 'Endurance-coaching skill bundle that turns COROS, iGPSPORT and Intervals.icu training data into decisions: readiness gating from sleep, HRV and resting heart rate, VDOT pace and heart-rate zones, periodized weekly plans, session reviews, race-day pacing and fueling, and weather-adjusted workouts. The bundle registers the hongxia-coach skill in the profile, ships deterministic helper scripts, reads an athlete profile created by its init script, and requires the agent to state when data is unavailable instead of inventing it.'
  zh: '耐力训练决策技能包：把 COROS、iGPSPORT、Intervals.icu 的训练数据变成可执行决策——用睡眠、HRV、静息心率做恢复闸门，算 VDOT 配速与心率区间，排周期化周计划、复盘单次训练、做赛前配速与补给、按天气修正训练。插件在 profile 里注册 hongxia-coach 技能，内置确定性计算脚本，读取初始化脚本生成的运动员档案，并强制「取不到数据就如实说明、不得编造」。'
icon: https://raw.githubusercontent.com/xsnnnnnn/dsh-hongxia-coach/main/assets/icon.png
