url: https://github.com/xiaoxiaolelang-ai/dsh-rail
name: xiaoxiaolelang-ai/dsh-rail
category: ui
description:
  en: "Narrow 40px icon rail for the DSH sidebar: panel icons move into a single column so the session list gets the full width, session titles gain a three-level hierarchy, and the DeepSeek account balance sits just above the sidebar footer with today and cumulative spend accounted from balance deltas, plus value-based colours. Follows the DSH 0.2.2-rc.2 sidebar structure (the two-column grid now lives on the nested scrollArea), so icons and the workspace list stay side by side."
  zh: "把面板图标收进 40px 窄栏、把宽度还给会话列表，会话标题分三级明暗；侧栏底部栏上方常显 DeepSeek 余额，并按余额差值记录今日与累计消费（按数值变色）。已适配 DSH 0.2.2-rc.2 的侧栏结构（两列网格挂在 scrollArea 上），图标列与工作区保持并排。"
tarball: https://github.com/xiaoxiaolelang-ai/dsh-rail/releases/download/v0.3.5/dsh-rail-0.3.5.tgz
