url: https://github.com/Chael-Chael/dsh-ascii-whales
name: Chael-Chael/dsh-ascii-whales
category: theme
description:
  en: Adds an animated ASCII whale ocean behind empty chats, with neutral frosted-glass input, visual color selection, light/dark support, and configurable whales, fish, grid and wakes.
  zh: 在空白聊天背景中呈现 ASCII 鲸群与游鱼，提供中性毛玻璃输入框、可视化选色器、深浅色适配，以及鲸鱼、鱼群、栅格和尾迹参数设置。
