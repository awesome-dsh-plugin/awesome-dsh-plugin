url: https://github.com/HelloGUOSHIJUN/dsh-claude-theme
name: HelloGUOSHIJUN/dsh-claude-theme
category: theme
description:
  en: "Turns the DeepSeek Harness Web UI into Claude's desktop look: warm paper surfaces, clay accents, tighter corners and softer elevation, with 17px serif body text. Covers 268 DSH tokens across light and dark, with every animation behind prefers-reduced-motion."
  zh: "把 DeepSeek Harness 的 Web 界面换成 Claude 桌面端的风格：暖白纸感底色、陶土橙点缀、更小的圆角与更柔和的投影，正文用 17px 衬线字体。覆盖 268 个 DSH 令牌，含亮暗两套；所有动效受 prefers-reduced-motion 控制。"
