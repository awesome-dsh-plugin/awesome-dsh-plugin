name: dsh-cyberegg
category: usage
description:
  en: 'One sidebar panel that shows the remaining credit balance and today''s check-in state of every freebie platform already configured on the machine (Loomy, MiniMax Code, Trae, Qoder, Raccoon, WorkBuddy, CodeArts, WPS Lingxi, MobileClaw), read through the plugins that own each platform plus two bundled read-only readers. Query and manual check-in only: no login UI, no stored tokens, and a manual check-in is reported as successful only when the measured balance actually increased.'
  zh: '一个侧栏面板，显示本机已配置的全部白嫖平台的剩余积分与今日签到状态（Loomy、MiniMax Code、Trae、Qoder、Raccoon、WorkBuddy、CodeArts、WPS 灵犀、MobileClaw）；数据通过各平台既有的插件读取，另带两个只读读取器。只做查询与手动签到：不提供登录界面、不保存凭据，且手动签到只有在实测余额确实增加时才显示成功。'
icon: https://raw.githubusercontent.com/1015677515/dsh-cyberegg/main/assets/icon-180.png
