  en: "Adds a screenshot row to the DSH composer + menu: pick a window or drag a region anywhere on the desktop (DSH stays visible), annotate it with rectangle, ellipse, line, arrow, pen, mosaic and text, then insert it into the draft, copy it, or save it."
  zh: "在 DSH 输入框的「+」菜单里增加「截图提问」：DSH 窗口不隐藏，可直接选中窗口或在整个桌面上框选区域，并用矩形、椭圆、直线、箭头、画笔、马赛克、文字标注，再插入对话、复制或另存为。"
