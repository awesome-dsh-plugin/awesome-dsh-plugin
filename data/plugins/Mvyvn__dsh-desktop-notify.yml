url: https://github.com/Mvyvn/dsh-desktop-notify
name: Mvyvn/dsh-desktop-notify
category: notify
description:
  en: Notifies you about 11 configurable DSH agent events (task completion, questions, denied approvals, background subagents/goals/jobs, team tasks, context compaction, triggered schedules, plugin startup and permission changes) as browser Web Notifications through a bundled service worker, falling back to Windows toast or Linux D-Bus, with three silence levels and click-to-open.
  zh: 为 11 类可配置的 DSH agent 事件（任务完成、提问、审批被拒、后台子代理/目标/任务、团队任务、上下文压缩、定时任务触发、插件挂载、权限变更）发送桌面通知，优先走自带 Service Worker 的浏览器 Web Notification，降级到 Windows Toast 或 Linux D-Bus，支持三档静默与点击跳转。