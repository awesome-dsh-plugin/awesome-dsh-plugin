url: https://github.com/uoiszero/dsh-photo-picker/tree/main/plugin
name: uoiszero/dsh-photo-picker#dsh-photo-picker
category: ui
icon: https://raw.githubusercontent.com/uoiszero/dsh-photo-picker/main/plugin/assets/icon-180.png
description:
  en: 'A DSH workbench for picking photos from local folders on macOS and Windows: local dedupe, filtering and grouping; AI grid triage and scoring with an image-capable model you supply (the plugin bundles no model, credentials or quota); AI scene labels with manual correction, tunable edit recipes with freeform/aspect crop, per-project model-route selection, human review, calibration, a cross-project photo wall with scene/verdict filters, AI stage run history, and export with scene/edit metadata. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 本机照片挑选工作台（macOS / Windows）：本地去重、过滤与分组；用你自备的图片输入模型做 AI 网格粗筛与评分（插件不内置模型、凭据或额度）；支持 AI 场景标签与人工修正、可微调修图配方与自由/比例裁剪、按项目切换模型路由、人工复核、校准、跨项目照片墙与场景/判定筛选、AI 阶段运行记录，以及带场景/修图来源信息的导出。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
