description:
  en: "Shows each turn's and the session's cost in CNY or USD (official CNY price lists plus the bundled USD catalog), distinguishes subscription plans from metered API keys, prices Chinese vendors from a local editable CNY price file, and adds a budget pill, balance reminders, a billing dashboard and Excel export."
  zh: "在每轮对话底部显示本轮与会话花费（人民币按官方价目表、美元按内置目录计价），区分订阅套餐与按量 API，国产模型人民币价目来自可编辑的本地文件，并提供预算按钮、余额提醒、计费统计与 Excel 导出。"
