description:
  en: 'A pixel whale-girl desktop pet for DSH on Windows: live agent state from real session events, poke and tickle, Ctrl-drag, 72-480 px resize, and a transparent always-on-top Electron window with 22 bundled animations.'
  zh: '把 DSH 会话状态变成 Windows 桌面上的像素鲸娘：按真实会话事件实时换动作，可戳脸、挠痒、按住 Ctrl 拖动，72–480 px 缩放，独立 Electron 透明置顶窗，随包附带 22 个动作。'
