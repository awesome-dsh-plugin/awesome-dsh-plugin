url: https://github.com/AAMMNNZZ/dsh-opencode-usage-sidebar
name: AAMMNNZZ/dsh-opencode-usage-sidebar
category: usage
description:
  en: 'Shows OpenCode Go subscription usage (5-hour, weekly and monthly) in the DSH sidebar footer, with a live countdown to the monthly reset. Requires an OPENCODE_GO_API_KEY credential (Settings → Models, or a refs entry in ~/.dsh/.credentials.yaml); without it the card stays hidden. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 侧栏底部显示 OpenCode Go 订阅的 5 小时、本周、本月用量，并实时倒计时到本月窗口重置。需先在「设置 → 模型」或 ~/.dsh/.credentials.yaml 的 refs 中配置 OPENCODE_GO_API_KEY，否则卡片不显示。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
tarball: https://github.com/AAMMNNZZ/dsh-opencode-usage-sidebar/releases/latest/download/dsh-opencode-usage-sidebar.tgz
