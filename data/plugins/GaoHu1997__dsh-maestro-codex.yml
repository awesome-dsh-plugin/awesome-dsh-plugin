name: GaoHu1997/dsh-maestro-codex
category: workflow
description:
  en: Manage Claude Code, Codex and Grok CLIs inside dsh and dispatch tasks to them as headless subagents, with dsh models, skills and tools bridged into each task, resumable CLI subsessions and a hierarchical task board.
  zh: '在 dsh 中管理 Claude Code / Codex / Grok CLI，并把任务派发给它们作为子智能体执行：dsh 的模型、技能与工具随任务桥接，CLI 子会话可回放续聊，任务看板分层展示主/子智能体。'
