name: swluo777/dsh-fish-dandan
category: identity
description:
  en: 'A DeepSeek Harness plugin that keeps one persistent persona across every session, with layered memory, mood and state, and optional Douyin automation. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '给 DeepSeek Harness 用的统一人格与记忆插件：所有会话保持同一个角色，带三层记忆、心情状态和可选的抖音日常。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/swluo777/dsh-fish-dandan/master/assets/icon.png
