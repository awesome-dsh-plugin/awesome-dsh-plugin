url: https://github.com/2JumpSinA/dsh-context-guard
name: 2JumpSinA/dsh-context-guard
category: session
description:
  en: 'Long sessions get expensive, and the platform compacts the context on its own. This plugin adds an occupancy badge (hover to see how it is computed), writes a handover draft into HANDOVER.md from 45% — files changed, money spent, what recent turns were about — and reminds you once at 60% to wrap up. On compaction it records the reading from just before, so you can check it later. No model calls, nothing added to the conversation; it does not prevent compaction.'
  zh: '长会话越跑越贵，平台到点还会把上下文压掉。这个插件做三件事：在会话标题旁显示当前上下文占了多少，鼠标停上去能看到这个数是怎么来的；过 45% 时往工作目录的 HANDOVER.md 写一份交接草稿，记下改过哪些文件、花了多少钱、最近几轮在聊什么；到 60% 提醒你一次该收尾了。平台压缩发生时，它把压缩前的数字记一行，事后还查得到。不调用模型，也不改动对话内容。它不阻止压缩，拿不回已经被压掉的部分。'
