description:
  en: 'DSH context-window attribution (read-only): ranks the messages, reasoning blocks and tool results of a session by the tokens each occupies; reports the share per entry type and the heaviest entries across live sessions.'
  zh: 'DSH 上下文窗口归因（只读）：按各自占用的 token 数对会话的消息、推理块与工具结果排序；给出各类条目所占比例以及各活动会话中占用 token 最多的条目。'
