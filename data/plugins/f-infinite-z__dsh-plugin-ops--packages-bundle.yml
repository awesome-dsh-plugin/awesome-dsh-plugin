description:
  en: 'Pre-boot health checks and repair for dsh plugin trees — ten static scan rules that follow the launcher runtime resolution, fault attribution after a failed boot, whitelisted reversible fixes verified in an isolated instance first, an upgrade preview naming the plugins a target release would skip, and a panel with plugin-row management plus a RAG knowledge base of past failures.'
  zh: 'dsh 插件树的启动前体检与修复——十条跟随启动器运行时解析的静态规则、启动失败后的故障归因、先在隔离实例复验再落地的白名单可逆修复、点名目标版本会跳过哪些插件的升级预演，以及带插件行管理面板与历次故障 RAG 知识库的设置界面。'
