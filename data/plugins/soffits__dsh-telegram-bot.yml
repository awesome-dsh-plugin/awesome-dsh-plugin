description:
  en: 'Telegram client for DSH sessions, one forum topic per session shared with the Web UI: streamed answers, turns from other clients mirrored in, tool approvals and ask_user_question as buttons, model and permission controls, photos, files and transcribed voice messages, and a send-to-topic API for scripts and other plugins. Maintained fork of Boobaw/dsh-telegram-bot.'
