description:
  en: 'Kubernetes workbench for DeepSeek Harness: kubectl-backed multi-cluster tools, interactive OIDC login, CRD lists, container terminal, YAML editing, RBAC view, node cordon/uncordon/drain and cluster read/write mode.'
  zh: 'DeepSeek Harness 的 Kubernetes 工作台：基于 kubectl 的多集群工具、交互式 OIDC 登录、CRD 列表、容器终端、YAML 编辑、RBAC 视图、节点封锁/解封/排空与集群读写模式。'
