url: https://github.com/PerryLink/dsh-table-ingest
name: PerryLink/dsh-table-ingest
category: tools
description:
  en: 'Converts tables in .docx, .xlsx, .xlsm, .csv and .tsv files into the table JSON consumed by the rule checkers, and reports when it could not rather than guessing.'
  zh: '把 .docx、.xlsx、.xlsm、.csv、.tsv 中的表格转换成规则核查器可读的 table JSON；识别不了时明确报告，不做猜测。'
