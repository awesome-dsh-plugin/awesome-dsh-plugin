url: https://github.com/tuibe/dsh-deepseek-theme-studio
name: tuibe/dsh-deepseek-theme-studio
category: theme
description:
  en: 'Client theme plugin for the DSH Web GUI: fluid WebGL background, frosted glass panels, a quantised particle mark and an ambient star field, plus an iOS-style press-and-spring animation on buttons and the composer. Only controls animate; code blocks and other read-only output stay still so a copy button never moves under the pointer. 116 parameters, editable in Settings and persisted to a JSON file.'
  zh: 'DSH Web GUI 客户端主题插件：流体 WebGL 背景、毛玻璃面板、量子化粒子图形与背景星尘层，以及按钮与输入卡的 iOS 式按下回弹动画；只有控件会有弹缩，代码块等只读内容保持静止，复制按钮不会随内容移动。116 项参数可在设置里调整并持久化到 JSON 文件。'
