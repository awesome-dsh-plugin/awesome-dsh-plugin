url: https://github.com/tuibe/dsh-deepseek-theme-studio
name: tuibe/dsh-deepseek-theme-studio
category: theme
description:
  en: 'Client theme plugin for the DSH Web GUI: fluid WebGL background, frosted glass panels, a quantised particle mark and an ambient star field, plus an iOS-style press-and-spring animation on buttons and the composer. 116 parameters, editable in Settings and persisted to a JSON file. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH Web GUI 客户端主题插件：流体 WebGL 背景、毛玻璃面板、量子化粒子图形与背景星尘层，以及按钮与输入卡的 iOS 式按下回弹动画；116 项参数可在设置里调整并持久化到 JSON 文件。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
