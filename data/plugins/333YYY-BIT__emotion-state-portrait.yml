url: https://github.com/333YYY-BIT/emotion-state-portrait
name: 333YYY-BIT/emotion-state-portrait
category: tools
description:
  en: 'Emotion, energy and per-user portrait engine for AI characters: a 303-word emotion library scored in two steps (pick one of 6 categories first, then choose within it), novelty reward and same-word cooldown for diversity, a spirit meter with easter-egg state transitions (excited / suppressed / angry), and per-user portraits. File mode works with any AI; the optional OneBot mode reads friend message history from a OneBot 11 endpoint such as NapCat. Requires your own OpenAI-compatible LLM endpoint and API key (EMOTION_LLM_KEY or emotion/config.json).'
  zh: '给 AI 角色的情绪·状态·人物画像引擎：303 情绪词分两步打分（先定 6 大类再在类内选词），冷门探索奖励 + 同类冷却保证情绪多样性，精神值阶梯 + 彩蛋式状态跃迁（亢奋/压抑/生气），按人画像，file/onebot 双模式。需要自备 OpenAI 兼容的 LLM 地址与 API Key（环境变量 EMOTION_LLM_KEY，或 emotion/config.json 的 llm 配置）。'
icon: https://raw.githubusercontent.com/333YYY-BIT/emotion-state-portrait/main/assets/icon-180.png
