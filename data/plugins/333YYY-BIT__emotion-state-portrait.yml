description:
  en: 'Emotion, energy and per-user portrait engine for AI characters: a 303-word emotion library scored in two steps (pick one of 6 categories first, then choose within it), novelty reward and same-word cooldown for diversity, a spirit meter with easter-egg state transitions (excited / suppressed / angry), and per-user portraits.'
  zh: '给 AI 角色的情绪·状态·人物画像引擎：303 情绪词分两步打分（先定 6 大类再在类内选词），冷门探索奖励 + 同类冷却保证情绪多样性，精神值阶梯 + 彩蛋式状态跃迁（亢奋/压抑/生气），按人画像，file/onebot 双模式。'
