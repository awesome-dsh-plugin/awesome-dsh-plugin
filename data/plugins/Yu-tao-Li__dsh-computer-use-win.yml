name: Yu-tao-Li/dsh-computer-use-win
category: tools
description:
  en: 'Lets the DSH agent operate your Windows apps and web pages: it reads controls through UI Automation, clicks, types, captures the screen and reads text with OCR, and works on web pages in its own browser in the background, without moving your mouse; when it needs your mouse or keyboard, an on-screen indicator appears and Esc stops it.'
  zh: '让 DSH 的 agent 直接操作你的 Windows 桌面程序和网页：用 UI Automation 读控件，点击、输入、截图、识别文字；网页在它自己的浏览器里后台完成，不动你的鼠标；需要用鼠标键盘时屏幕会提示，按 Esc 立刻停下。'
