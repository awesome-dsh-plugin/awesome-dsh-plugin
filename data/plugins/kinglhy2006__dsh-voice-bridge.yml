url: https://github.com/kinglhy2006/dsh-voice-bridge
name: kinglhy2006/dsh-voice-bridge
category: voice
description:
  en: 'Hands-free voice for DSH on Windows: local wake word, local Chinese speech-to-text inserted and sent into the composer, and spoken replies that can be interrupted and resumed. Requires a one-time run of the bundled install.ps1 (Python speech dependencies plus microphone pick) and a SenseVoice model already downloaded by the DSH voice input (or placed under models/sensevoice-onnx).'
  zh: 'Windows 上的免手语音：本地唤醒词、本地中文识别自动填入并发送、回答语音朗读，可打断与续播。需先运行仓库自带的 install.ps1（安装 Python 语音依赖并选定麦克风），并准备 SenseVoice 识别模型（跑一次 DSH 语音输入让它自动下载，或放到 models/sensevoice-onnx）。'