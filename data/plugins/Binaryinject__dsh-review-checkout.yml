url: https://github.com/Binaryinject/dsh-review-checkout
name: Binaryinject/dsh-review-checkout
category: git
description:
  en: 'Codex-style review of session file changes: one card per edit turn (click a file to jump into that turn), a review tab with switchable split/card views (persisted across restarts), sticky headers and turn-scoped syntax-highlighted diffs, 12 fully-wired color settings with light/dark presets that follow the DSH theme live, one-click per-turn revert via a built-in tool (works on DSH Desktop too) that fills the revert instruction into the composer, workspace-relative paths and a resilient multi-stage session-history fallback chain (cold-boot channel attach) for the current DSH session API.'
  zh: 'Codex 风格的会话文件修改审查：每轮编辑一张卡片（点击文件跳转到该轮审查）；审查标签支持分屏/卡片双视图切换（选择在重启后保留）、按轮展示语法高亮 diff 且文件头吸顶；12 项完整生效的颜色设置与深浅双套预设，随 DSH 主题即时切换；内置工具按轮一键撤销（DSH Desktop 同样可用，撤销指令自动填入对话输入框）；工作区相对路径显示；多级回退的会话历史通道（含冷启动通道附加），兼容当前 DSH 会话 API。'
