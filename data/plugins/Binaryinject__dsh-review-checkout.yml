url: https://github.com/Binaryinject/dsh-review-checkout
name: Binaryinject/dsh-review-checkout
category: git
description:
  en: 'Codex-style review of session file changes: per-turn cards (optionally taking over the shell edited cards), a review tab with syntax-highlighted diffs, real line numbers, open-at-line and a draggable split, light/dark presets that follow the DSH theme, typography that follows DSH and installed skins (or any font on the machine, with a px stepper), and one-click per-turn revert — powered by the official session channel.'
  zh: 'Codex 风格的会话文件修改审查：每轮变更卡片（可接管 shell 的 edited 卡片）、语法高亮 diff 审查标签（真实行号、按行打开、可拖拽分栏）、跟随 DSH 主题的深浅双套配色、字体跟随 DSH 与已装皮肤（也可选机器上的任意字体并微调字号）、内置工具按轮一键撤销——基于官方会话通道。'
