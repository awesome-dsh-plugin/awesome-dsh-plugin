url: https://github.com/Binaryinject/dsh-review-checkout
name: Binaryinject/dsh-review-checkout
category: git
description:
  en: 'Codex-style review of session file changes: per-turn cards (optionally taking over the shell edited cards) whose totals are the turn net diff, a review tab with syntax-highlighted diffs that never wrap, real line numbers, open-at-line and a draggable split, a hover preview of the whole file with three lines of context around each change, one-click per-turn revert, and the on-disk record size with a clear button in the review toolbar. Records are sharded per session, with content-addressed snapshot blobs that dedupe and are garbage collected. Light/dark presets follow the DSH theme, typography follows DSH and installed skins (or any font on the machine, with a px stepper), and a settings switch injects a think-in-Simplified-Chinese rule into the global AGENTS.md.'
  zh: 'Codex 风格的会话文件修改审查：每轮变更卡片（可接管 shell 的 edited 卡片），统计口径为本轮净差异；审查 tab 的 diff 不自动换行、真实行号、按行打开、可拖拽分栏；悬停预览显示整文件差异（每处改动前后 3 行上下文）；按轮一键撤回；工具条显示记录占用并可一键清空。记录按会话分片存储，快照用内容寻址 blob 去重并自动 GC。深浅两套配色跟随 DSH 主题，字体跟随 DSH 与已装皮肤（也可选机器上的任意字体并微调字号）；设置里可把「用简体中文思考」规则注入全局 AGENTS.md。'