url: https://github.com/WekyJay/Dsh-Microsoft-ToDo
name: WekyJay/Dsh-Microsoft-ToDo
category: ui
description:
  en: 'Microsoft To Do panel: browse lists, add, edit, complete and reopen tasks, and open notes, due date, reminder, recurrence, steps and attachments. Lists can be collected into local groups, and a batch of tasks can be picked into a My Day shortlist. Signs in with the Microsoft device-code flow; the token cache belongs to the upstream microsoft-todo-mcp server, while groups and My Day live locally. Chinese and English UI.'
  zh: '微软待办面板：浏览清单，新增、编辑、完成与重新打开任务，并查看备注、截止日期、提醒、重复、步骤与附件；清单可在本机分组，也能挑一批任务放进「我的一天」。用微软设备码登录，令牌缓存由上游 microsoft-todo-mcp 服务持有；分组与「我的一天」存在本机。中英双语界面。'
