url: https://github.com/damlys99/dsh-morning-paper
name: damlys99/dsh-morning-paper
category: ui
description:
  en: 'A newspaper-style front page for a session you left running, as a Conversation View tab beside Chat and Trajectory: a per-turn timeline (duration, steps, tools, tokens, outcome), file churn counted per file, where the wall clock went and how much of it was the model rather than tools, which single turn ate the spend, failures nobody retried quoted with their failing command, and a context-pressure gauge measured against the routed model''s own declared capacity. The briefing is folded from the durable session log and never generated by a model, so it costs no tokens, cannot hallucinate, and is byte-identical for the same log and clock; it appends nothing to the session and reaches no model, and it reports a pending approval without ever answering it. Pages are offered only when they have content, and the tab refreshes itself on turn settle and on a two-speed poll backed by a metadata-only tail probe.'
  zh: '把跑着的会话排成一张报纸式头版，作为 Chat 与 Trajectory 旁的 Conversation View 标签页：逐轮时间线（耗时、步数、工具、token、结果）、按文件统计的改动热度、墙钟时间去向以及其中多少是模型而非工具、哪一轮吃掉了花费、无人重试的失败（附失败命令），以及对照该路由模型自报容量的上下文压力仪表。简报由持久会话日志折算而成、从不调用模型：零 token、不会编造、同一份日志与时钟下字节一致；不向会话追加任何内容、也不触达模型，只报告待批准项而绝不代为应答。仅在某一页有内容时才提供该页；标签页在轮次结束时自刷新，并用只读日志尾部的探针做两档轮询。'
