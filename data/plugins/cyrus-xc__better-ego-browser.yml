description:
  en: 'Connects DeepSeek Harness to the installed Windows ego lite app through authenticated loopback HTTP for task spaces, navigation, page reading, clicks, form input and screenshots.'
  zh: '通过带认证的本机 HTTP 连接已安装的 Windows ego lite，为 DeepSeek Harness 提供任务空间、导航、页面读取、点击、表单输入和截图。'
