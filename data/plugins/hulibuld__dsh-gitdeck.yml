# GitHub connection plugin for DSH: one github_api tool that fronts the whole REST API.
# Fork of Moon-shiyue/dsh-github-connect (MIT); cannot be installed alongside it.
url: https://github.com/hulibuld/dsh-gitdeck
name: hulibuld/dsh-gitdeck
category: git
description:
  en: 'Connects a GitHub account to DSH from the composer button (OAuth device flow or a personal access token) and exposes one github_api tool for REST calls — create repositories, write files, read pull requests and workflow runs — with a read-only switch and an in-panel call log. A rewritten fork of Moon-shiyue/dsh-github-connect (MIT): device-flow Client IDs are no longer rejected, paths may carry query strings and non-ASCII characters, undici is no longer a hard dependency, and the panel has four tabs. Registers the same github_api tool name and the same credential namespace, so it cannot be installed alongside that plugin.'
  zh: '在对话框左下角连接你的 GitHub 账号（设备流或 Personal Access Token），提供一个 github_api 工具直接调 REST 接口——建仓库、写文件、读 PR 与 Actions，带只读开关和调用记录。改自 Moon-shiyue/dsh-github-connect（MIT）：不再拒收设备流 Client ID，路径可带查询串与非 ASCII 字符，不再硬依赖 undici，面板改成四页签。工具名 github_api 与凭据命名空间都与原插件相同，两者不能同时安装。'
