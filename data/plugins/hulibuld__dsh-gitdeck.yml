# GitHub connection plugin for DSH: one github_api tool that fronts the whole REST API.
url: https://github.com/hulibuld/dsh-gitdeck
name: hulibuld/dsh-gitdeck
category: git
description:
  en: 'Connects a GitHub account to DSH from the composer button (OAuth device flow or a personal access token) and exposes one github_api tool for REST calls — create repositories, write files, read pull requests and workflow runs — with a read-only switch and an in-panel call log.'
  zh: '在对话框左下角连接你的 GitHub 账号（设备流或 Personal Access Token），提供一个 github_api 工具直接调 REST 接口——建仓库、写文件、读 PR 与 Actions，带只读开关和调用记录。'
