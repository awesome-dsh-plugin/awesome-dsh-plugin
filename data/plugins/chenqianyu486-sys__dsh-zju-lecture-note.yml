name: chenqianyu486-sys/dsh-zju-lecture-note
category: docs
description:
  en: 'Turns Zhejiang University classroom replays (classroom.zju.edu.cn) into Markdown study notes. Built on the scraping core of nzw806/zju-lecture-summerizer- (a standalone Python tool, not a DSH plugin), it reads the public speech transcript by minute, sentence or chunk, and can download the projected slide screenshots as a PDF and reference selected pages in the note. The slide capture needs a ZJU login state (ZJU_COOKIE / ZJU_COOKIE_FILE or a local Edge profile); transcript reading is public. It writes a note named after the class date and section, and checks the Markdown so formulas and tables render.'
  zh: '把浙大智云课堂（classroom.zju.edu.cn）回放整理成 Markdown 复习讲义。抓取内核来自 nzw806/zju-lecture-summerizer-（独立 Python 工具，不是 DSH 插件）：读取公开语音字幕（按分钟 / 逐句 / 分块），还可下载课堂投影截图并合成 PDF、按需把关键页引用进讲义。字幕读取公开免登录；投影截图需浙大登录态（ZJU_COOKIE / ZJU_COOKIE_FILE 或本机 Edge）。讲义按上课日期与本节内容命名写入，并检查 Markdown 使公式与表格正常渲染。'
icon: https://raw.githubusercontent.com/chenqianyu486-sys/dsh-zju-lecture-note/main/icon.png
