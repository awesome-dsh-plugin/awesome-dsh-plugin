url: https://github.com/jediliu005/dsh-duplicate-file-check
name: jediliu005/dsh-duplicate-file-check
category: tools
description:
  en: 'File dedupe and unify toolkit, shown as "小视频整理" in the DSH sidebar: exact matches by head/middle/tail sampling or full byte compare, near-duplicate MP4s grouped by duration and a configurable first-N-seconds frame window (default 10s, 1–5 fps, default 2; longer videos are compared on their first N seconds too), batch rename or move by extension, UUID, file size or video length, empty-folder cleanup under the selected sources, and MOV/AVI/WMV detected by file header and transcoded to MP4 keeping resolution, frame rate and audio parameters. Requires ffmpeg and ffprobe on PATH. Concurrent workers per task with a shared setting; one task at a time; per-group help dialogs; local-only API. Every task that moves files has one-click restore: per-group/target _dupfc_restore.json records, deleted files skipped and counted, files outside the record renamed to UUID and moved into resetFail; orphaned ffmpeg processes left by a crashed host are swept on plugin load.'
  zh: '文件查重与整理（DSH 侧边栏显示为「小视频整理」）：完全一致支持快速抽样或逐字节严格比对，转码过的视频按时长分组并比对可配置的前 N 秒画面（默认 10 秒、每秒 1–5 帧可调、默认 2 帧，超长视频同样只比对开头 N 秒）；可按后缀、UUID、文件大小或视频时长批量改名移动，可清理来源目录下的空文件夹，并按文件头识别 MOV/AVI/WMV 后转成 MP4（分辨率、帧率、音频参数对齐原片）。需本机安装 ffmpeg / ffprobe。各任务按统一并发数并行、同一时刻只跑一个任务，每个分组都有配置说明；接口仅限本机调用。所有会移动文件的功能都支持一键复位：按分组/目标目录内的 _dupfc_restore.json 记录把文件搬回原目录，已删除的跳过并计数，记录外的文件统一 UUID 改名移入 resetFail；宿主机异常退出留下的孤儿 ffmpeg 会在插件加载时清扫。'
