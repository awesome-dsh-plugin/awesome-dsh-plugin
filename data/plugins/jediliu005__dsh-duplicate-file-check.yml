url: https://github.com/jediliu005/dsh-duplicate-file-check
name: jediliu005/dsh-duplicate-file-check
category: tools
description:
  en: 'File dedupe and unify toolkit, shown as "小视频整理" in the DSH sidebar: exact matches by head/middle/tail sampling or full byte compare; near-duplicate MP4s found by a prefix frame-level multi-candidate matcher (only the first N seconds, default 40, max 60; a frame-level index plus multiple candidate tracks handle shifted intros and repeated segments). The "ignore intro" scan maintains a SQLite fingerprint cache keyed by absolute path and size, with MAD-first frame lookup and dHash/pHash fallback; incomplete cache rows are removed and rebuilt automatically, and a full scan rebuilds the band index. A "quick file lookup" takes one file, uses the cache when present, generates its fingerprint on demand when missing, and reports a task with live logs, progress and cancellation without rescanning the source folder. Duration-bucket matching always probes and captures fresh, and does not use the fingerprint cache. Batch rename or move by extension, UUID, file size or video length; empty-folder cleanup; MOV/AVI/WMV detected by header and transcoded to MP4 keeping resolution, frame rate and audio. Requires ffmpeg and ffprobe. Scans run in a sidecar worker with live progress, A-B single-direction dedupe and asynchronous fingerprint writes; one task at a time; local-only API. Every task that moves files has one-click restore: per-group/target _dupfc_restore.json records, deleted files skipped and counted, files outside the record renamed to UUID and moved into resetFail.'
  zh: '文件查重与整理（DSH 侧边栏显示为「小视频整理」）：完全一致支持快速抽样或逐字节严格比对；转码过的视频用前缀帧级多候选匹配（每条只抓前 N 秒，默认 40、最多 60；帧级索引 + 多候选起点，支持片头错位和重复片段）。「忽略片头」扫描用 SQLite 指纹缓存（按绝对路径 + 文件大小），以 MAD 优先、dHash/pHash 兜底做帧匹配；不完整缓存会自动删除重抓，完整扫描会重建 band 索引。新增「指定文件快速查重」：只查一个文件，有缓存就直接用，缺缓存只为该文件按需生成指纹，不重扫来源目录；任务带实时日志、进度和强制停止。时长匹配每次现抓现算，不读写指纹缓存。可按后缀、UUID、文件大小或视频时长批量改名移动；可清理空文件夹；按文件头识别 MOV/AVI/WMV 后转成 MP4（分辨率、帧率、音频参数对齐原片）。需本机安装 ffmpeg / ffprobe。扫描在独立 sidecar worker 中运行，带实时进度、A-B 单向去重和指纹异步写入；同一时刻只跑一个任务，接口仅限本机调用。所有会移动文件的功能都支持一键复位：按分组/目标目录内的 _dupfc_restore.json 记录把文件搬回原目录，已删除的跳过并计数，记录外的文件统一 UUID 改名移入 resetFail。'