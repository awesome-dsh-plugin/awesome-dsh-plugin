url: https://github.com/jediliu005/dsh-duplicate-file-check
name: jediliu005/dsh-duplicate-file-check
category: tools
description:
  en: 'File dedupe and unify toolkit: exact matches by head/middle/tail sampling or full byte compare, near-duplicate MP4s grouped by duration and a configurable first-N-seconds frame window (default 10s, 1 fps; longer videos are skipped), batch rename or move by extension, UUID, file size or video length, and MOV/AVI/WMV detected by file header and transcoded to MP4 keeping resolution, frame rate and audio parameters. Concurrent workers per task with a shared setting; one task at a time; per-group help dialogs; local-only API.'
  zh: '文件查重与整理：完全一致支持快速抽样或逐字节严格比对，转码过的视频按时长分组并比对可配置的前 N 秒画面（默认 10 秒、每秒 1 帧，超长视频跳过）；可按后缀、UUID、文件大小或视频时长批量改名移动，并按文件头识别 MOV/AVI/WMV 后转成 MP4（分辨率、帧率、音频参数对齐原片）。各任务按统一并发数并行、同一时刻只跑一个任务，每个分组都有配置说明；接口仅限本机调用。'
