  en: 'Universal Multi-Agent AI Video Studio (v0.7.0 — DSH / DSH NEXT / Claude Code / Codex CLI / WorkBuddy / Cursor / Silent Windowless Daemon): your own talking anime presenter made once from a photo (free mouth shapes + blinks locally, optional local Talking Head Anime 3, or your own Vidu / Volcengine / Runway key), AI editing of your own footage (talking-head rough cut with real captions, packaging, B-roll from the library, Vlog highlights), fill-in templates, the host agent can write for the plugin (no API key), fine per-shot AI visual self-review and a per-run model usage report, AI Agent War Room UI with three switchable skins, built-in figure library with per-film character styles, 48 MCP tools (46 inside DSH), CinePulse Hub (影核广场) template plaza, cross-genre adaptive FFmpeg beat-sync + 48kHz SFX & LUFS mastering, Reference vs Remake compare player, 4-track timeline editor, optional BYOK cloud Image/Video/Audio (Seedream/Seedance/Kling/Flux/Suno/MiniMax + open custom HTTP protocol), and optional 1-click local TTS installer (Original Author: Merziller | QQ: 1411574209 | WeChat: Merziller | k26789228@gmail.com).'
