  en: 'Universal Multi-Agent AI Video Studio (v0.6.0 — DSH / Claude Code / Codex CLI / WorkBuddy / Cursor / Silent Windowless Daemon): new AI Agent War Room UI with three switchable skins (Prism Lab default / Nova Deck / Ink Loom) and native panels, built-in figure library with a per-film character style (silhouette / paper-cut / shadow puppet / ink / flat / stick, or AI-designed characters) and AI visual self-review, 41 MCP & Cordis tools, CinePulse Hub (影核广场) built-in & community MOTION.md template plaza, cross-genre adaptive FFmpeg beat-sync + 48kHz SFX & LUFS mastering, Reference vs Remake split/curtain sync compare player, 4-track visual timeline editor, optional BYOK cloud Image/Video/Audio (Seedream/Seedance/Kling/Flux/Suno/MiniMax + open custom HTTP protocol), and optional 1-click local TTS installer (Original Author: Merziller | QQ: 1411574209 | WeChat: Merziller | k26789228@gmail.com).'
