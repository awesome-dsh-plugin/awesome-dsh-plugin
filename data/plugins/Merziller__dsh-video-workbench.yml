description:
  en: '禾杨视频工坊 (DSH Video Workbench) · Universal Multi-Agent AI Video Studio (v0.8.1 — DSH / DSH NEXT / Claude Code / Codex CLI / WorkBuddy / Cursor / Silent Windowless Daemon): long recordings of your own (interviews, podcasts, live replays, lessons) cut into stand-alone short clips with captions, titles and covers; uploaded music starts at its highlight; every AI voice-over take is listened back and re-dubbed once when misread; the local speech recognition prepares itself automatically; the end notice and its credit are opt-in; your own talking anime presenter; AI editing of your own footage (talking-head rough cut with real captions, packaging, Vlog highlights); fill-in templates; the host agent can write for the plugin (no API key); AI Agent War Room UI with three switchable skins; 49 MCP tools (47 inside DSH); CinePulse Hub (影核广场) template plaza; cross-genre beat-sync and LUFS mastering; optional BYOK cloud image / video / music and optional local TTS (禾杨智绘出品 · Copyright (c) 2026 绍兴市柯桥区禾杨智绘软件开发工作室 & Merziller (子墨) · QQ: 1411574209 | WeChat: Merziller | k26789228@gmail.com).'
  zh: '禾杨视频工坊（禾杨智绘出品）· 全智能体通用双引擎 AI 视频工作台（v0.8.1 — DSH / DSH NEXT / Claude Code / Codex / WorkBuddy / Cursor / 无黑窗后台静默守护）：长视频拆条（把你自己的访谈、播客、直播回放、课程剪成多条带字幕、标题和封面的短视频）、配乐从精彩处开始、配音回听校验（AI 配音读错自动重配）、本地语音识别自动准备好（不用手动安装）、片尾声明和署名改为可选；「我的动漫形象」会说话的动漫讲解员、AI 剪辑你自己的素材（口播粗剪与真实字幕、口播包装、Vlog 高光）、模板填空、由当前智能体代写（不用 API Key）、AI Agent 作战大屏（三套皮肤）、49 个 MCP 工具（DSH 内 47 个）、影核广场模板广场、全品类节拍卡点与响度母带，可选 BYOK 云端生图 / 生视频 / 音乐与本地配音（Copyright (c) 2026 绍兴市柯桥区禾杨智绘软件开发工作室 & Merziller (子墨)｜QQ：1411574209｜微信：Merziller｜Email：k26789228@gmail.com）。'
