description:
  en: Reply beside selected chat text, combine several excerpts in one reply, and keep individually removable quote replies at the top of the composer until you send them as Markdown.
  zh: 划选会话文字可在选区旁回复，同一条回复可引用多段原文，完成的回复以可逐条删除的气泡固定在聊天框顶部，发送时保留 Markdown 引用和分段。
