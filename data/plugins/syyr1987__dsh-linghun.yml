url: https://github.com/syyr1987/dsh-linghun
name: syyr1987/dsh-linghun
category: agi
description:
  en: 'End the agent''s endless planning. Linghun installs a judgment core into DeepSeek Harness: the cognition loop gives every decision a source and attribution, hippocampus condenses running experience into reusable knowledge, and a customizable persona card adapts the agent to your scene. Not a role-play card — the engineering component that makes an agent stop planning and start doing. Requires DSH ^0.1.0-rc.7.'
  zh: '终结 Agent 无限规划。给 DeepSeek Harness 装上判断内核：认知循环让判断有来处、反馈有归因、规划必收口；海马体把运行经历沉淀为可复用知识，踩过的坑下次不踩；人格参数自定义（姓名/性格/沟通风格）适配场景。不是角色扮演，是让 Agent 从"会想"到"会做完"的工程组件。兼容 DSH ^0.1.0-rc.7。'
