description:
  en: 'A cognitive-subject plugin for DeepSeek Harness: a customizable soul card (name, personality, communication style, and more), a cognition loop that makes every judgment traceable, and hippocampus memory that condenses experience into reusable knowledge. Not a persona card — auditable judgment.'
  zh: '给 DeepSeek Harness 装一个会思考的自我：灵魂卡自定义姓名、性格、沟通风格等；认知循环让判断有来处、反馈有归因；海马体把经历沉淀为知识与经验。不是人设卡，是判断力。'
