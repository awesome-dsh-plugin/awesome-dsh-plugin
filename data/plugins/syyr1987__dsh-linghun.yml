url: https://github.com/syyr1987/dsh-linghun
name: syyr1987/dsh-linghun
category: agi
description:
  en: 'A judgment core for DeepSeek Harness: a cognition loop that gives every decision a source and attribution and drives planning to a close, hippocampus memory that condenses running experience into knowledge (journal ledger, episodic archive, low-confidence decay), judgment identity responsibilities in the architecture (consistent rubric, judgment bound to its source), and an A2A memory-management team via dsh-linghun-assembler. Requires DSH ^0.1.0-rc.7 (rc.2 supported).'
  zh: 'DeepSeek Harness 的判断内核：认知循环让判断有来处、反馈有归因、规划收口；海马体把运行经历沉淀为可复用知识（序时账留痕、情景归档、低置信降权遗忘）；判分身份职责入架构（口径一致、判据绑定来源）；联动 dsh-linghun-assembler 的 A2A 记忆管理团队。需要 DSH ^0.1.0-rc.7（支持 rc.2）。'
