url: https://github.com/seven282/oss-prompt-optimizer
name: seven282/oss-prompt-optimizer
category: tools
description:
  en: 'Optimize a raw instruction into a professional, ready-to-use prompt through the harness llm service — four-section (Role / Task / Context / Format) or a headerless plain-text style. Situation-aware: the instruction and conversation are parsed into role / task / goal profiles, so the role stays on-task and goals are preserved; roles are written as identity + capability + behavior with per-task-type tips. Built-in few-shot examples matched to the task type and language; conciseness rules and sentence-based line breaks keep results terse and readable. Context-aware by default; stream early-stop and an optional fast profile cut latency. Composer ✨ one-click optimize / undo / cancel, prompt_optimize tool (optimize + iterate), auto-optimize hook, auto-detected zh/en role document.'
  zh: '将一句随手写的话，经 harness llm 服务优化为专业、可直接使用的提示词——四段（Role / Task / Context / Format）或无标题纯文本风格。情境感知：自动解析指令与对话为角色/任务/目标画像，角色与任务强相关、目标与约束自动保留，并按「身份＋能力＋行为」三要素撰写、附任务类型写法建议；内置按任务类型与语言匹配的 few-shot 示例，简洁输出规则与按句断行让结果精炼可读。上下文感知默认开启；流式早停与可选速档降低耗时。输入框 ✨ 一键优化/撤销/取消、prompt_optimize 工具（优化+迭代）、自动优化钩子与中英自动检测的角色文档。'
