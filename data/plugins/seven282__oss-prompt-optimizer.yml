url: https://github.com/seven282/oss-prompt-optimizer
name: seven282/oss-prompt-optimizer
category: tools
description:
  en: 'Optimize a raw instruction into a professional prompt through the harness llm service — four-section (Role / Task / Context / Format) by default, or a headerless plain-text style (outputStyle: plain) that cuts token usage. Context-aware by default: the recent conversation is injected as background reference. Composer ✨ one-click optimize & undo, prompt_optimize tool (optimize + iterate), auto-optimize hook, auto-detected zh/en role document.'
  zh: '将原始指令经 harness llm 服务优化为专业提示词——默认 Role / Task / Context / Format 四段，可配置为无标题纯文本（outputStyle: plain，更省 token）；上下文感知默认开启（注入此前对话作背景参考）；提供输入框 ✨ 一键优化与撤销、prompt_optimize 工具（优化+迭代）、自动优化钩子与中英自动检测的角色文档。'
