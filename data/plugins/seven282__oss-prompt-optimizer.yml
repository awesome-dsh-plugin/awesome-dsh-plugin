url: https://github.com/seven282/oss-prompt-optimizer
name: seven282/oss-prompt-optimizer
category: tools
description:
  en: 'Optimize a raw instruction into a professional prompt through the harness llm service — four-section (Role / Task / Context / Format) or a headerless plain-text style. Context-aware by default: the recent conversation is injected as background and may enrich the ## Context section. Long outputs resume from the truncation point with auto-expanded budgets; validated results are cached (identical requests cost zero model calls); a unified call budget bounds worst-case cost. Composer ✨ one-click optimize, undo, cancel and a token-cost hint; prompt_optimize tool (optimize + iterate), auto-optimize hook, auto-detected zh/en role document.'
  zh: '将原始指令经 harness llm 服务优化为专业提示词——四段（Role / Task / Context / Format）或无标题纯文本风格；上下文感知默认开启（注入此前对话作背景，四段模式可充实 ## Context 段）；长输出断点续传+自动扩容、结果缓存（同请求零模型调用）、统一调用预算控制最坏成本；输入框 ✨ 一键优化/撤销/取消与 token 消耗提示、prompt_optimize 工具（优化+迭代）、自动优化钩子与中英自动检测的角色文档。'
