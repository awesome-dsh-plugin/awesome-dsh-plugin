url: https://github.com/seven282/oss-prompt-optimizer
name: seven282/oss-prompt-optimizer
category: tools
description:
  en: 'Optimize a raw instruction into a professional prompt through the harness llm service — four-section (Role / Task / Context / Format) or a headerless plain-text style. Situation-aware (1.3.0+): instruction + conversation parsed into role/task/goal profiles; roles follow an identity + capability + behavior formula with per-task-type tips (1.3.3-1.3.5). Built-in few-shot examples matched to the task type and language (1.4.0); conciseness rules and sentence-based line breaks keep results terse and readable (1.3.8-1.4.1). Context-aware by default; stream early-stop and an optional fast profile cut latency (1.3.6). Composer ✨ one-click optimize / undo / cancel, prompt_optimize tool (optimize + iterate), auto-optimize hook, auto-detected zh/en role document.'
  zh: '将原始指令经 harness llm 服务优化为专业提示词——四段（Role / Task / Context / Format）或无标题纯文本；情境感知（1.3.0+）解析指令与对话为角色/任务/目标画像，角色按「身份＋能力＋行为」三要素撰写并附任务类型写法建议（1.3.3-1.3.5）；内置按任务类型与语言匹配的 few-shot 示例（1.4.0），简洁输出规则与按句断行让结果精炼可读（1.3.8-1.4.1）；上下文感知默认开启；流式早停与可选速档降低耗时（1.3.6）；输入框 ✨ 一键优化/撤销/取消、prompt_optimize 工具（优化+迭代）、自动优化钩子与中英自动检测的角色文档。'
