url: https://github.com/Ade-hale/dsh-session-eraser
name: Ade-hale/dsh-session-eraser
category: session
description:
  en: 'Restorable session delete for the DSH Web GUI: a red Delete session row after Archive deletes in two steps (the first click arms the action for four seconds, so a stray click cannot destroy a chat) and moves the session directory into $DSH_HOME/session-delete-trash/ instead of unlinking it. A Trash panel opened from the same menu lists every entry with its directory, source workspace, deletion time and size, and can restore one to its original workspace, purge one forever, or empty the trash after a second click; entries past the retention window (30 days by default, DSH_SESSION_DELETE_RETENTION_DAYS) are purged automatically. Delete also drops the projection cache, clears the workspace mount and the pin and archive references through the durable registry, and broadcasts the official removed event so the row vanishes without a refresh. Batch deletes accept up to 50 ids, a running session is refused with 409 before anything is touched, ids resolve with or without the session- prefix, restore never overwrites a live session, and every route enforces a same-origin check (Origin/Host plus Sec-Fetch-Site) so a page on another site cannot delete your sessions.'
  zh: 'DSH Web 界面里的可恢复会话删除：在会话右键菜单的「归档」后面加一行红色「删除会话」，采用两步确认（首次点击只把动作标记为待确认，4 秒内不点第二次就自动取消，误触毁不掉一段对话），并把会话目录整个移入 $DSH_HOME/session-delete-trash/ 而不是直接 unlink。同一菜单里的「回收站」会打开列表面板，显示每个条目的会话目录、来源工作区、删除时间与体积，可还原到原工作区、彻底删除单条，或在二次点击后清空整个回收站；超过保留期（默认 30 天，可用 DSH_SESSION_DELETE_RETENTION_DAYS 调整）的条目自动永久清除。删除还会清掉投影缓存、工作区挂载与置顶、归档引用（经持久化工作区登记），并广播官方移除事件，列表当场消失、无需刷新。批量删除一次最多 50 个 id，正在运行的会话在动手前就以 409 拒绝，id 带不带 session- 前缀都能定位，还原遇到同名会话绝不覆盖，所有路由都做同源校验（Origin/Host 与 Sec-Fetch-Site），别的站点页面无法删掉你的会话。'
