description:
  en: "Windows disk manager for the DeepSeek Harness right sidebar: volume overview with usage bars, folder browsing with sort and grouping, drag files straight into the chat composer, on-demand folder sizes, desktop shortcuts with real app icons, and an explorer-style context menu. Delete goes to the recycle bin."
  zh: "DSH 右栏里的 Windows 磁盘管理：卷总览带用量条、目录浏览支持排序分组、把文件直接拖进对话输入框、按需统计文件夹大小、桌面快捷方式显示真图标，右键菜单对齐资源管理器；删除一律进回收站。"
