description:
  en: 'macOS computer use with seven computer_* tools: accessibility-tree and Vision OCR screen reading, actions by element index or visible label that also reach background windows, and CoreGraphics mouse and keyboard events; its Swift helper compiles on first use, so there is no runtime dependency.'
  zh: 'macOS 电脑操作：7 个 computer_* 工具，读屏走辅助功能树与 Vision OCR，按元素 index 或可见文字执行 press / focus / set_value / click（后台窗口也能操作），并提供 CoreGraphics 鼠标键盘事件；自带的 Swift 助手首次调用时编译，无运行时依赖。'
