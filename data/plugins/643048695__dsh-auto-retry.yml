url: https://github.com/643048695/dsh-auto-retry
name: 643048695/dsh-auto-retry
category: model
description:
  en: "Selective retry for transient model-request failures in DeepSeek Harness: gateway blips, HTTP/2 and upstream stream interruptions get a 2s / 5s / 10s / 20s backoff, while quota, auth, context-overflow and parameter errors pass straight back to DSH."
  zh: "为 DeepSeek Harness 的暂时性模型请求故障补充重试：中转抖动、HTTP/2 与上游流中断按 2/5/10/20 秒阶梯重试；额度、鉴权、上下文超限和参数错误直接交回 DSH。"
