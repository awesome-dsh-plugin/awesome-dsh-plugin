url: https://github.com/hongdougao111/dsh-bagu
name: hongdougao111/dsh-bagu
category: tools
description:
  en: 'Two gates for outbound AI text. (1) Guard: before any text goes out it blocks the shapes anyone could write — padding verbs plus abstract nouns ("optimised the code structure"), hollow adjectives, universal filler, template openers, git commit/PR/review boilerplate, comments that narrate the code. Covers chat, comments, email, commit messages, PR descriptions, reviews, issues, docs and code comments. Passes with OK, blocks with one line naming what to change. (2) Catch memes: when someone drops a slang term the model does not guess or look it up — it already knows. A built-in 6792-entry meme wiki is queried before the model starts thinking, and the entry usage field ("how to answer this") goes straight into context. Matches only exact title/slug/alias hits, never fuzzy, so ordinary chat never triggers it. Bundled SQLite by node:sqlite, zero dependencies, 1.6ms per query. Settings page: guard on/off, strict mode, prompt section toggle, meme wiki toggle, per-turn auto-lookup, a four-step tone slider (reserved / measured / follow the room / unrestrained) that is behavioural rather than a label, AI-completion switch (off by default, uses the session own model so no API key needed), a paste-and-test box, and three thresholds. No model call for any check.'
  zh: '管 AI 对外说话的两道门。一、守门：发出去之前拦掉「谁都能说」的形状——空转（动词配宏观名词，如「优化了代码结构」）、空形容词、万能话、模板开场白、git commit/PR/review 的套话、把代码念一遍的注释。聊天、评论、邮件、commit message、PR 描述、review、issue、文档、代码注释都覆盖。过了回 OK，没过回一行说明怎么改。二、接梗：对方抛出网络梗时不猜、不联网搜——内置 6792 条梗词库，在模型开始思考之前就查好，把词条的「用法」字段（这个梗该怎么接）直接塞进上下文。只认标题/slug/别名的精确命中，不做模糊匹配，所以日常闲聊不会误触发。词库用 Node 自带 node:sqlite，零依赖，单次查询 1.6ms。设置页：守门开关、严格模式、提示节开关、梗库开关、每轮自动查、四档玩梗尺度滑杆（很收着/有点度/跟着玩/放得开，写行为不写标签）、AI 接话开关（默认关，走会话自己的模型不用填 key）、粘一段当场试、三个阈值。所有判断都在本地跑，不调模型。'
