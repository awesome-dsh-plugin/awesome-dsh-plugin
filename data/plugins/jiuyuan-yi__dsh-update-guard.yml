url: https://github.com/jiuyuan-yi/dsh-update-guard
name: jiuyuan-yi/dsh-update-guard
category: dev
description:
  en: 'Checks installed plugins against a DSH update before you install it, and reports the shared UI members and host services they use that the new version no longer exports — the case where an update installs cleanly but leaves plugins failing to load. Includes a read-only diagnose command. Windows only, DSH desktop, Node.js 18+.'
  zh: '在装 DSH 更新之前，把已装插件用到的共享 UI 成员和宿主服务，与新版本实际导出的逐项比对，列出新版本不再提供的那几个——也就是「更新装上了、插件却加载不起来」那种。附一个只读 diagnose 命令。仅支持 Windows 上的 DSH 桌面端，需要 Node.js 18+。'
