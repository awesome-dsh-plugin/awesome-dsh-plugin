url: https://github.com/Zbcc0826/dsh-llm-wiki
name: Zbcc0826/dsh-llm-wiki
category: memory
description:
  en: "Local DeepSeek Harness plugin (not published to npm) built from Andrej Karpathy's LLM Wiki gist. Raw sources go into raw/ and are never rewritten. Pages update only from validated patches after user approval, and writes return NOT_APPROVED without hanging if no approval UI is present. Registers only 8 tools: wiki_status, wiki_parsers, wiki_read, wiki_ingest, wiki_query, wiki_graph, wiki_lint, and wiki_llm. Contradictions keep both sides on pages and in query results. wiki_graph walks 0 to 4 hops along page relations (optionally filtered by predicate) without calling a model; both relations and source hashes live on pages. Long sources split by headings and tables up to 8 segments per ingest with no resume parameter: unread text is noted on the source index page, wiki_lint reports PARTIAL, re-ingesting the full text still processes only the first 8 segments, and the unread tail must be ingested as a separate source. Built-in parsers cover images (pixels only, no OCR), Markdown, plain text, JSON, CSV, and HTML. PDF, Office, audio, and video return NEED_EXTERNAL_PARSER and can connect via the llm-wiki.parsers service or wiki_ingest's parsed parameter."
  zh: "基于 Andrej Karpathy 的 LLM Wiki 说明实现的 DeepSeek Harness 本地插件（不发布到 npm）。原料存入 raw/ 后不再修改。页面只在用户批准后按校验过的补丁更新；没有审批界面时写入返回 NOT_APPROVED，不挂起。仅注册 8 个工具：wiki_status、wiki_parsers、wiki_read、wiki_ingest、wiki_query、wiki_graph、wiki_lint、wiki_llm。页面可记录矛盾的另一面，查询时保留两边。wiki_graph 不调用模型，沿页面上的 relations 走 0 到 4 跳（可用 predicate 筛选一种谓语）；关系和来源哈希都写在页面上。长材料按章节和表格切分，每次最多摄入 8 段且没有续读参数：未纳入的文字标在来源目录页上，wiki_lint 对不完整页报告 PARTIAL，用同一份全文再次摄入仍只展开前 8 段，未读尾巴需另作一份新材料再摄入。内建解析器支持图像（只留像素，不编造 OCR）、Markdown、纯文本、JSON、CSV、HTML；PDF、Office、音视频返回 NEED_EXTERNAL_PARSER，可通过服务 llm-wiki.parsers 或 wiki_ingest 的 parsed 参数接入。"
