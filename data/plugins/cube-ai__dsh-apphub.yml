url: https://github.com/cube-ai/dsh-apphub
name: cube-ai/dsh-apphub
category: dev
description:
  en: 'A multi-application aggregation DSH plugin. It currently includes applications such as Shennong Wenzhenon, Smart Home controller, Cloud Greenhouse, Coffee Workshop, Calculator, Snake, and more. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '一个多应用聚合 DSH 插件。目前收录有神农问诊、智慧家庭、云上温室、咖啡工坊、计算器、贪吃蛇等应用。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
  