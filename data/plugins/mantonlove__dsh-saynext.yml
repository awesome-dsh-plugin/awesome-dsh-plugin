url: https://github.com/mantonlove/dsh-saynext
name: mantonlove/dsh-saynext
category: ui
description:
  en: 'Next-line suggestions inside the DSH composer. After a turn ends normally the host asks the model for three candidate lines, then picks with local rules rather than trusting the model: candidates that repeat what the assistant just said, reuse identifiers only the assistant used, or talk about this plugin itself are rejected. The winner appears as a grey line at the placeholder position, inside the input box, adding no height and never colliding with the goal bar or todo panel. The first Enter moves it into the draft without sending; the second Enter sends. It hides while a turn is streaming, while the input already has text, or when the suggestion belongs to an older turn, and every session keeps its own line. Suggestions never leave your machine unless you opt in: sharing is off by default, and only a choice made on the download page starts uploading the shown line, the message you then sent, and up to 1200 UTF-16 units of the previous request and the last assistant reply to the maintainer endpoint, with a stop control that clears the local queue. (input prediction / prompt suggestion / ghost text)'
  zh: '在 DSH 输入框里写下「下一句」。每轮回答正常结束后，宿主让模型一次给出三条候选，再用本地规则挑一条，而不是直接信模型：复述 AI 刚说的话、复用只有 AI 用过的标识符、谈论插件自身的候选会被挡掉。选中的那句显示在输入框内部、原占位符的位置上，一行灰字，不额外占高度，也不会和目标条、待办面板打架；按第一次 Enter 只把它填进草稿、不发送，按第二次 Enter 才发出去。流式输出中、输入框已有文字、或这条建议属于更早的回合时自动隐藏，多条会话各存各的。建议默认不离开你的机器：分享关闭，只有在下载页亲自选择后才会上传展示的那句、你随后发送的那句，以及上一轮请求与最后一条助手答复各最多 1200 个 UTF-16 码元；随时可停止并清除本机队列。（输入预测 / 提示词建议 / 下一句 / 灰字补全）'
