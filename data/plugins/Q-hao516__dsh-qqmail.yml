url: https://github.com/Q-hao516/dsh-qqmail
name: Q-hao516/dsh-qqmail
category: tools
description:
  en: 'Read-only QQ Mail over IMAP: list, search, and read messages; the settings page verifies the account before saving. Needs IMAP enabled on the mailbox and its 16-character authorization code (not the QQ password); the server is fixed to imap.qq.com.'
  zh: '通过 IMAP 只读访问 QQ 邮箱：列出、搜索、读取邮件；设置页在保存前会先验证账号。需要在邮箱里开启 IMAP，并使用 16 位授权码（不是 QQ 密码）；服务器固定为 imap.qq.com。'
