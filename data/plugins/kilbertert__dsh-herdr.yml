url: https://github.com/kilbertert/dsh-herdr
name: kilbertert/dsh-herdr
category: remote
description:
  en: Adds a Herdr panel to the DSH sidebar that opens a host PTY running herdr --remote dev-us --session work and renders it with xterm.js. The startup command is typed once per terminal, so switching panels or reloading the page does not open a second session. The remote name and session are a one-line constant in lib/client.js.
  zh: 在 DSH 侧栏新增 Herdr 面板，通过宿主 PTY 服务运行 herdr --remote dev-us --session work 并用 xterm.js 渲染。启动命令每个终端只发送一次，切换面板或刷新页面不会重复开会话。远程名与会话名是 lib/client.js 里的一行常量，可自行修改。
