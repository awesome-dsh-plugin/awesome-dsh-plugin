url: https://github.com/tony92921/dsh-compact-manager
name: tony92921/dsh-compact-manager
category: session
description:
  en: "Take over context compaction on both the manual and the automatic path, each runnable by a compaction model (falling back to a second model, or used directly) or by a mechanical fold that builds the summary card locally with no model call; the fold goes through the same official compaction transaction, so the replaced events stay in the append-only session log under their sequence numbers. It adapts code from dsh-compact-saviour and takes the mechanical fold from dsh-ledger-compact (both MIT) — install it instead of dsh-compact-saviour, not alongside it."
  zh: "接管上下文压缩：手动与自动压缩都可选用模型压缩（支持备用模型兜底或直接使用备用模型），或选用机械折页——在本地把旧历史整理成摘要卡，不调用模型、不消耗 token；折页走官方压缩事务，被替换的原始事件仍以原序号留在只追加的会话日志里。代码改编自 dsh-compact-saviour、折页算法取自 dsh-ledger-compact（均为 MIT），请替代 dsh-compact-saviour 安装，不要两者同装。"
