url: https://github.com/Weihao654/dsh-workflow/tree/main/plugins/l2-protocol
name: Weihao654/dsh-workflow#l2-protocol
category: workflow
description:
  en: 'Adds twelve chain_* tools that turn a multi-agent role chain into a round state machine with one frozen baseline, per-signature failure counts, role-tagged evidence, blocking approval gates and one audit file per round; also adds a settings card that routes each role to its own model and thinking effort. Requires the sibling l1-presets bundle (plan/work/code/review) - without those presets every chain_* tool returns ROLE_DENIED.'
  zh: '新增十二个 chain_* 工具，把多 Agent 角色链变成轮次状态机：唯一冻结的基线、按签名累计的失败次数、按角色标注的证据、阻塞式审批门禁，以及每轮一份审计文件。另附设置页卡片，可为每个角色指定模型与思考深度。需同时安装同仓库的 l1-presets 包（plan/work/code/review 四个 preset），否则所有 chain_* 工具都会返回 ROLE_DENIED。'
icon: https://raw.githubusercontent.com/Weihao654/dsh-workflow/main/assets/icon-1024.png
