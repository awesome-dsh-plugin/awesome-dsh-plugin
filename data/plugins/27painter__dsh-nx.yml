url: https://github.com/27painter/dsh-nx
name: 27painter/dsh-nx
category: tools
description:
  en: 'Drives Siemens NX 12, 2406 and 2506 from DeepSeek Harness: the NXOpen bridge ported to the CPython 3.6.1 that NX 12 embeds, an executor that judges a journal run from its log rather than its exit code (NX returns 0 for a journal that swallowed its exception, and 0xC0000409 after a clean one), and 16 typed tools over a resident batch NX. Windows only; NX 12 and 2406 verified on real parts, 2506 expected.'
  zh: '从 DeepSeek Harness 驱动 Siemens NX 12、2406 与 2506：把 NXOpen 桥移植到 NX 12 内嵌的 CPython 3.6.1；一个按日志而非退出码判定 journal 成败的执行器（NX 对吞掉异常的 journal 返回 0，干净结束时返回 0xC0000409）；以及常驻批处理 NX 上的 16 个类型化工具。仅 Windows；NX 12 与 2406 已在真实零件上验证，2506 为预期可用。'
