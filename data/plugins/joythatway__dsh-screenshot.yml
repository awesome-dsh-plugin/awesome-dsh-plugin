url: https://github.com/joythatway/dsh-screenshot
name: joythatway/dsh-screenshot
category: ui
description:
  en: 'Composer screenshot menu with three modes (region capture that hides the harness window, a window list with live hover previews, and full screen); captures land in the draft or save to disk, the preview zooms with the mouse wheel, and a settings page changes the shortcut, save folder and auto-hide behaviour.'
  zh: '输入框截图菜单，三种模式：框选（自动让开 DSH 窗口）、窗口列表（悬停实时预览）、整屏；截图可入草稿或存到磁盘（默认桌面），预览支持滚轮缩放，设置页可改快捷键、保存位置与自动隐藏。'
icon: https://raw.githubusercontent.com/joythatway/dsh-screenshot/main/docs/icon.png
