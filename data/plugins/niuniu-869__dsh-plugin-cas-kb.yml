description:
  en: 'Chinese accounting and tax knowledge base for DSH agents, served by the hosted Quaesto service at api.accountingllm.site (needs network access; no account or API key, but your queries leave the machine): answers questions on CAS enterprise accounting standards, the small-enterprise accounting standards, CSA auditing standards and tax law with original articles, decision procedures, applicability checks and tax-accounting differences, exposed through 10 MCP tools and a china-accounting-standards skill.'
  zh: '为 DSH 智能体提供中国会计与税务知识库，由托管服务 Quaesto（api.accountingllm.site）提供，需联网、无需账号或 API key，但查询内容会发往该服务：查企业会计准则、小企业会计准则、审计准则与税法的原文条款、判断决策程序、适用性判定与税会差异，通过 10 个 MCP 工具与 china-accounting-standards 技能对外提供。'