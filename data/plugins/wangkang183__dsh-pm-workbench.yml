description:
  en: 'A right-sidebar workbench for memos, projects with Gantt, a read-only QQ Mail inbox, calendar, AI item parsing, a weekly digest, and host tools for conversational and WeChat todo management. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '右侧栏工作台：记事本式备忘、项目甘特图、QQ 邮箱只读收件箱、日历、AI 拆分、周报，以及对话/微信操作待办的 Host 工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
