url: https://github.com/dingchenhui0618-arch/dsh-fact-lock-rewrite
name: dingchenhui0618-arch/dsh-fact-lock-rewrite
category: tools
description:
  en: 'Two-pass Chinese de-AI rewriting for DeepSeek Harness: pass one extracts the facts that may not change (price, stock, model, spec, date, after-sales promise, link, contact) into a fact-lock with line:col; pass two rewrites with those facts masked as placeholders the model cannot edit, then compares item by item. A changed amount, a vanished fact, an invented claim, or a crossed qualifier (原价→现价, 仅剩→已售) rejects the whole piece, withholds the text and points at the conflict; only a clean pass yields a side-by-side source/rewrite diff. Two gates: drafts save with their conflict count, publishing requires a passing check. Ships a conversation-view panel, two agent tools (fact_lock_rewrite / fact_lock_check) and a CLI whose exit code makes check composable in a publish pipeline. Fails closed on every uncertainty. Zero dependency build, MIT. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 的中文「去 AI 味」两遍流水线：第一遍把不许改的事实（价格、库存、型号、规格、日期、售后承诺、链接、联系方式）抽成带行:列 的 fact-lock 并显示给你看；第二遍改写时事实已换成模型改不到的占位符，改完逐项比对。金额变了、事实没了、凭空多一项、或限定词跨家族（原价→现价、仅剩→已售），就整篇拒绝、扣留正文并指出冲突位置；只有全对才给原文/改写并排 diff。两级闸门：草稿随时存并标注冲突数，正式发布要求核对通过。带对话视图面板、两个 agent 工具（fact_lock_rewrite / fact_lock_check）与命令行（退出码可直接接在发布脚本前）。任何不确定都 fail-closed。零依赖构建，MIT。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
