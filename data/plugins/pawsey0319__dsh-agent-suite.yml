url: https://github.com/pawsey0319/dsh-agent-suite
name: pawsey0319/dsh-agent-suite
category: notify
description:
  en: 'Desktop task radar for DSH: a draggable always-on-top capsule showing running sessions, pending approvals and questions, with inline approve/answer and completion banners. Bundles agent-bridge (Codex / Claude / WorkBuddy), a delivery judge and office-artifact scanning.'
  zh: 'DSH 桌面任务雷达：可拖动的置顶小胶囊，显示运行中的会话、待批准与提问，支持就地批准或回答并弹出完成横幅；同时整合 Codex/Claude/WorkBuddy 外部任务、交付判别与办公产物扫描。'
# manifest lives at the repo root (bundle package moved there 2026-11-24), so
# `dsh plugin add github:pawsey0319/dsh-agent-suite` installs it directly.
installs from the repo root: true
