description:
  en: 'Windows XP Luna skin for the DeepSeek Harness Web UI: a blue taskbar sidebar, Luna title bars, translucent conversation and plugin windows with adjustable opacity and blur, and a settings page for importing a wallpaper.'
  zh: '为 DeepSeek Harness Web UI 提供 Windows XP Luna 皮肤：蓝色任务栏侧栏、Luna 标题栏、可调节不透明度与模糊的半透明对话及插件窗口，以及可导入壁纸的设置页。'
