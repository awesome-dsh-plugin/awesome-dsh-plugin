url: https://github.com/pengtang1024/dsh-smart-provider
name: pengtang1024/dsh-smart-provider
category: model
description:
  en: A DSH meta-provider that routes requests across configured models and accounts with smart routing, account pooling, cost statistics, and layered health management: 4 virtual models (Balanced / Economy / Efficient / Smart, Smart by default inside the plugin) and 6 thinking efforts (auto default + off / low / medium / high / max), with names localized in 7 languages and neutral ranking by default (cost-first is opt-in).
  zh: 一个在已配置模型与账号间智能路由的 DSH 元提供商，提供账号池、成本统计与三层健康管理：4 个虚拟模型（均衡 / 省钱 / 效率 / 智能，插件内默认智能）与 6 档思考强度（auto 默认 + 关闭 / 低 / 中 / 高 / 极高），名称支持 7 语本地化；账号择优默认中立，省钱优先为可选项。
