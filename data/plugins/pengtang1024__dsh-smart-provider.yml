description:
  en: A DSH meta-provider that routes requests across configured models and accounts with smart routing, account pooling, cost statistics, and layered health management—neutral by default, with cost-first as an opt-in strategy.
  zh: 一个在已配置模型与账号间智能路由的 DSH 元提供商，提供账号池、成本统计与三层健康管理，默认中立，省钱优先为可选项。
