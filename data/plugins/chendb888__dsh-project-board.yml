url: https://github.com/chendb888/dsh-project-board
name: chendb888/dsh-project-board
category: ui
description:
  en: Domain-agnostic whitebox project board with a persistent conversation box at every level (locked to the selected task), blueprint-driven layout, dynamic loading progress, SVG dependency flowchart, burndown, edit cards with diffs, voice input and auto TTS broadcast.
  zh: 领域无关项目白盒看板：每层保留对话框并锁定当前任务、蓝图驱动布局、动态加载进度、SVG依赖流程图、燃尽图、编辑卡diff、语音输入与自动播报。
