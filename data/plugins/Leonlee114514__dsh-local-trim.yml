url: https://github.com/Leonlee114514/dsh-local-trim
name: Leonlee114514/dsh-local-trim
category: model
description:
  en: 'Light harness for small local models: for providers on a loopback or private-network baseURL (or whose id carries a local marker), masks the tool list through tools.restrict, drops named system-prompt sections and memory contexts, swaps the injected instruction block for a short one while preserving its first 80 and last 96 characters, and truncates tool-schema descriptions without touching structure or required fields. Cloud providers are returned as the same assembly object, untouched. Works with any OpenAI-compatible endpoint (llama.cpp, Ollama, vLLM, LM Studio).'
  zh: '给小本地模型的轻量 harness：对 baseURL 指向回环或私有网段（或 id 带 local 等标记）的 provider，用 tools.restrict 收缩工具面、按段名丢弃系统提示词段落与记忆 context、把注入的指令块换成一页纸同时保留其首 80 与末 96 字符、截断工具 schema 的 description 而不动结构与 required。云端 provider 原样返回同一个 assembly 对象，不做任何改动。适配任何 OpenAI 兼容端点（llama.cpp、Ollama、vLLM、LM Studio）。'
