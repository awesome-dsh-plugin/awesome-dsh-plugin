description:
  # v1.2.7 (2026-10-27): relocate long system prompt past domestic gateway channel-risk classifier; rewrite DSH brand string; debug dump.
  # Fork of Faide-cyber/dsh-workbuddy (upstream entry already in the catalogue). Do not co-install both — they share provider id "workbuddy-ai".
  en: Brings WorkBuddy free/paid models (domestic + international) into DSH without the desktop app, published as @bushizhanghan/dsh-workmate. This package is a maintained fork of Faide-cyber/dsh-workbuddy (whose upstream entry is already listed in this catalogue); do NOT co-install both, as they register the same provider id "workbuddy-ai" and will collide. v1.2.7 relocates over-long system prompts past the domestic gateway channel-risk classifier, rewrites the DSH brand string, and adds a debug dump; supports dsh 0.2.0-rc.2 through 0.2.1 (incl. prereleases).
  zh: 把 WorkBuddy 国内版和国际版的免费/付费模型接进 DSH，无需桌面端；以 @bushizhanghan/dsh-workmate 发布。本包是 Faide-cyber/dsh-workbuddy 的维护分支（上游条目已在目录内）；请勿与上游同装，二者共用 provider id「workbuddy-ai」会冲突。v1.2.7：跨国内网关风控——长系统提示自动搬迁、出站体改写 DSH 字样、调试落盘；支持 dsh 0.2.0-rc.2 至 0.2.1（含预发布）。
