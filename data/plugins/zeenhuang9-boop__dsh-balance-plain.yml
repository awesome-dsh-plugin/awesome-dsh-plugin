name: zeenhuang9-boop/dsh-balance-plain
category: usage
description:
  en: 'DeepSeek balance, today''s spend, peak/off-peak countdown and per-turn cost rendered as one text line embedded in the DSH sidebar footer, plus a low-balance alert. A text-only derivative of dsh-whale-widget (MeteorNOX/DeepSeek-Balance-Whale-Widget); do not install both - they register the same /dsh-whale/* routes and share the same ledger files.'
  zh: '把 DeepSeek 余额、今日已用、峰谷倒计时与每轮消耗做成 DSH 侧栏 footer 里的一行纯文本，并在余额低于阈值时提醒。这是 dsh-whale-widget（MeteorNOX/DeepSeek-Balance-Whale-Widget）的纯文本衍生版，不能与上游同装：两者注册相同的 /dsh-whale/* 路由并共用同一份账本文件。'
icon: https://raw.githubusercontent.com/zeenhuang9-boop/dsh-balance-plain/main/assets/icon-180.png
