url: https://github.com/guicaiyue/dsh-context-domains
name: guicaiyue/dsh-context-domains
category: session
description:
  en: 'Puts a domain bar under the session header — a domain groups skills and tools and toggles as one block, so one click loads or unloads every member. Hovering a chip lists its members (skills, then tools) in a height-capped panel that scrolls. The right end of the bar is a compaction-threshold counter (− 5 +, 100k tokens per step) that rewrites the live compaction engine policies, so the compaction trigger line changes on the next turn without restarting dsh; a degraded fallback turns the number amber and is reported in the snapshot. Settings maintains domains and members with search, skill/tool tabs, all/selected/unselected filters and a copyable AI grouping prompt. Tool removal uses tools.restrict plus a guard; hiding a skill re-registers it with modelInvocable false, so it leaves the model catalog while /name still works. Sessions of another preset are left untouched.'
  zh: '在会话头下方放一条领域横条：领域是用户自定义的 skill 与 tool 分组，点一下整块加载或卸载，不必逐条开关。悬停芯片在限高面板里列出成员（技能在前、工具在后，超出就在面板内滚动）。最右端是压缩阈值计数器（− 5 +，每格 10 万 token）：它给运行中的压缩引擎重写 modelPolicies，所以压缩触发线改完下一轮就生效，不用重启 dsh；降级时数字转琥珀色并写进 snapshot 的 degraded。设置页维护领域与成员，带搜索、技能与工具页签、全部与已选与未选筛选、可一键复制的 AI 归类 prompt。工具移除走 tools.restrict 加 guard；skill 隐藏是在会话作用域重投同名 skill 并标记不可被模型调用，于是它从模型目录消失而 /名字 仍可用。属于别的 preset 的会话一律不动。'
