url: https://github.com/tkliuxing/dsh-video-forge
name: tkliuxing/dsh-video-forge
category: tools
description:
  en: 'Video generation for DSH from online models, plus narrated teaching videos rendered on this machine. Three model tools send text, image, first-last-frame and reference-image jobs to Volcengine ARK Seedance, MiniMax or an OpenAI-Videos-compatible gateway, record every task in a durable ledger so a timeout or a restart never pays twice, write each take to renders/<shot>/vNNN.mp4 with a JSON sidecar, list them in a Videos panel, and answer cost questions from a public price-table feed with every figure labelled an estimate. Four video_teach_* tools make local teaching videos: validate a storyboard.yaml manuscript and report missing local programs, synthesize the narration with TTS, render reveal.js slides and Manim scenes to one FFmpeg segment per sentence, then export SRT, timeline.json and 16:9 and 4:3 cover screenshots. Teaching videos need FFmpeg and ffprobe locally, a Chromium for slides and a Python with Manim for animated scenes.'
  zh: '在 DSH 里用在线模型生成视频，也在本机渲染旁白讲解视频。三个模型工具把文生视频、图生视频、首尾帧与参考图任务提交给火山方舟 Seedance、MiniMax 或兼容 OpenAI Videos 的网关，每个任务记进耐久台账，超时或重启都不会重复付费，成片写成 renders/<shot>/vNNN.mp4 并配 JSON 说明，列在视频面板里，费用按公开价目表给出并标注为估算。四个 video_teach_* 工具做本机讲解视频：校验 storyboard.yaml 稿本并报告缺失的本地程序，用 TTS 合成旁白，把 reveal.js 幻灯片与 Manim 场景逐句渲染成 ffmpeg 片段，再导出 SRT、timeline.json 与 16:9、4:3 封面截图。讲解视频需要本机 ffmpeg 与 ffprobe，幻灯片另需 Chromium，动画段落另需装了 manim 的 Python。'
