description:
  en: 'Manage Oracle, PostgreSQL, MySQL, MariaDB, SQL Server and SQLite connections with driver diagnostics, column defaults/comments, and opt-in metadata browsing for agents; requires a separate Python 3 environment with the per-driver packages (SQLite needs only the standard library).'
  zh: '管理 Oracle、PostgreSQL、MySQL、MariaDB、SQL Server 与 SQLite 连接，提供驱动诊断、字段默认值/注释和需显式授权的智能体元数据浏览；需另建 Python 3 环境并安装对应驱动（SQLite 仅需标准库）。'
