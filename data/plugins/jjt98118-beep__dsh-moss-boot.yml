  en: 'Plays an intro full-frame when you open DSH, when you open a new conversation, or every time you open the one you pinned. The built-in footage is themed on a Wandering Earth-style space station and the quantum AI MOSS (550W): a red single eye ignites while the Earth’s curve slides past the viewport. Four clips ship embedded in the code — no separate video files — and the library lets you tick any number to rotate at random (never the same clip twice in a row), preview the rotation, or swap in your own videos. Sound plays without a click; the pin button sits beside Settings.'
