url: https://github.com/waspqj/dsh-study-mode
name: waspqj/dsh-study-mode
category: memory
description:
  en: 'Learning-mode agent preset for DSH with a topic knowledge base: answers retrieve from your own stored cards and cite the card they came from, mark anything not found as unverified, and only go online when verification is required. The sidebar panel browses topics, searches and edits cards, and every card can be AI-reviewed, verified, rolled back and versioned. Cards can reference each other by title in the card body; the panel shows both outgoing links and which cards reference the one you are reading. New cards arrive as a preview you confirm before they enter the library; topic and card names are editable in the UI. The knowledge base is plain local files, not an automatic scraper.'
  zh: '学习模式 agent 预设 + 主题知识库：回答先从你自己存的卡片里检索，命中就标出处，查不到标「未验证」，必须查证才联网；侧边栏面板按主题浏览、搜索、编辑卡片，每张卡可 AI 校验补充、核实、回退和看版本；卡片之间可以在正文里按标题互链，面板里能看到「它连着谁」和「谁引用了它」；新卡片先出预览，确认后才入库；主题名和卡片名都能在界面里改。知识库是本地普通文件，不做后台自动抓取。'
icon: https://raw.githubusercontent.com/waspqj/dsh-study-mode/main/assets/icon-180.png
