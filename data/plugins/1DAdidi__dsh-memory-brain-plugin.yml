name: 1DAdidi/dsh-memory-brain-plugin
category: ui
description:
  en: 'A 3D neural memory map panel for the meow-memory store inside DeepSeek Harness. Sidebar entry + desktop embed, with 8-region memory classification and retrieval. Requires the meow-memory plugin (it reads .dsh-meow/memory.db) and Node 22.5+ (node:sqlite).'
  zh: '记忆星脑：meow-memory 记忆库的 3D 神经脑图面板，左侧栏入口 + 桌面内嵌，支持八分区归类与记忆检索；需先安装 meow-memory 插件（读取其 .dsh-meow/memory.db），并要求 Node 22.5+（node:sqlite）。'