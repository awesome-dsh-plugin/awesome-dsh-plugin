url: https://github.com/feng-yifan/dsh-plugins/tree/main/packages/dsh-enhancement
name: feng-yifan/dsh-plugins#dsh-enhancement
category: remote
description:
  en: 'Web GUI enhancement bundle: a standalone password gateway (optional HTTPS via your own certificate or a self-signed local CA) for LAN and remote access without `?token=`, PWA install with icon and app name, desktop and mobile Web Push notifications for task/approval events, and optional session-id request-header injection for third-party OpenAI-compatible routes, all configured from a settings page.'
  zh: 'DSH 增强套件：为 Web GUI 提供独立的密码访问网关（可选 HTTPS，支持上传证书或由插件自签发本地 CA），无需 `?token=` 即可在局域网 / 远程登录；整合 PWA 安装与应用名 / 图标、桌面通知与手机 Web Push（任务完成、等待审批等事件），并可选地把当前会话的 session id 注入第三方 OpenAI 兼容路由的请求头，均在设置页统一配置。'
