description:
  en: Full-interface whale skin pack for the DSH Web UI — layered wallpaper, metallic trim, lace and bows, a corner mascot that reacts to agent state, ambient particles, plus an installable third-party skin-pack format.
  zh: DSH Web 界面全屏鲸鱼皮肤包：多层壁纸、金/银描边、蕾丝蝴蝶结、随 Agent 状态反应的角落立绘与环境粒子，并支持可安装的第三方皮肤包格式。
