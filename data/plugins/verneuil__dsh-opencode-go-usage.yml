description:
  en: 'Floating pill for DeepSeek Harness that shows OpenCode Go usage for the 5-hour, weekly and monthly windows as three rings, works out the remaining model quota automatically and can show the DeepSeek account balance alongside; a minimal mode nests the rings and lets you choose which of the 5-hour / weekly / monthly figures each outer / middle / inner ring shows, with a live preview.'
  zh: 'DSH 悬浮窗：三环显示 OpenCode Go 的 5 小时 / 本周 / 本月用量，支持自动计算模型配额剩余，可选同时显示 DeepSeek 账户余额；极简模式把三环嵌套显示并支持自定义外 / 中 / 内环数据与实时预览。'
