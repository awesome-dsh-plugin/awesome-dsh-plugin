url: https://github.com/xiajiajun516/dsh-config-manager
name: xiajiajun516/dsh-config-manager
category: tools
description:
  en: 'One-click backup / export / import / migrate whole DSH config: settings, plugins, MCP, skills, workspaces. Secrets are never exported, paths are auto-mapped, imports preview then auto-backup with rollback, profiles support multiple setups, and remote sync pushes portable config via a private Git repo (snapshots restore in CLI & GUI).'
  zh: 一键备份 / 导出 / 导入 / 迁移整套 DSH 配置：设置、插件、MCP、技能、工作区。密钥永不导出、路径自动映射、导入先预览并自动备份支持回滚、支持多套配置档案，远程同步通过私有 Git 仓库推送可移植配置（快照恢复支持 CLI 与 GUI）。