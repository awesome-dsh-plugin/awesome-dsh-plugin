url: https://github.com/YEYEYEYESHIFU/dsh-session-hotkeys
name: YEYEYEYESHIFU/dsh-session-hotkeys
category: session
description:
  en: 'Session hotkeys for the DSH Web GUI: switch sessions like browser tabs (positional Alt+1-9, pinned slots, previous/next, new/archive/rename), keyboard model switching via Alt+M, alternate send, Esc focus hand-off, and Alt+W to close or restore a dsh-split-screen workspace — all rebindable with Windows/macOS presets. Verified on DSH 0.1.1 and 0.1.5.'
  zh: Web 会话热键插件：像切浏览器标签页一样用键盘管理会话——Alt+1-9 顺序切换、固定槽位、上/下一个、新建/归档/重命名、Alt+M 键盘切换模型与备用发送、Esc 焦点交接，Alt+W 关闭/恢复 dsh-split-screen 工作区；键位可在面板录制重绑，Windows/macOS 双预设。已适配 DSH 0.1.1 与 0.1.5。
