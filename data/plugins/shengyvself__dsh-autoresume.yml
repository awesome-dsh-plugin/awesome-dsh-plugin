url: https://github.com/shengyvself/dsh-autoresume
name: shengyvself/dsh-autoresume
category: workflow
description:
  en: >-
    Auto-continues dsh sessions interrupted by web restarts or transient
    network failures. Global scan over recent sessions (24h window), resumes
    with the session's own model preset, live watch catches mid-run network
    failures, and a dead-loop guard settles models that keep returning empty
    content.
  zh: >-
    自动继续被 web 重启或网络瞬时故障打断的会话：全域扫描近 24h 会话、以会话原
    模型预设自我恢复、liveWatch 补捞运行期间再次失败，并对持续空返回的模型内置
    死循环守卫；completed/settled 一律不打扰。