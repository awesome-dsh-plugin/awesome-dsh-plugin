url: https://github.com/CheeseFox259/dsh-better-composer
name: CheeseFox259/dsh-better-composer
category: ui
description:
  en: 'Markdown visual enhancement and session workbench for DSH Web Composer: live syntax presentation with caret-row source reveal (inactive-line markers can be hidden or faded), deterministic local completions, and list/quote continuation on line break with ordered-list renumbering; long pastes fold into persistent chips with inline context or file-mode delivery (@path across 50+ extensions) plus sidebar LLM rewrites (stop, preview diff, undo/redo); real-time context map with token gauge, composition breakdown, per-turn growth chart with anchor lines, in-place /compact, turn forking, and a Context Doctor workspace (overview, diagnostics, analysis, feedback).'
  zh: 'DSH Web Composer 视觉增强与会话工作台：实时 Markdown 呈现与光标行源码还原（非焦点行语法标记可完全隐藏或淡化显示）、确定性本地补全、列表与引用的换行自动续行及有序列表重编号；超长粘贴自动收纳为持久化引用 chip，支持直接内联或文件送达（支持 50+ 种扩展名），并在右栏抽屉提供大模型智能改写（支持中止、预览对比、应用与撤销重做）；集成实时上下文地图，包含 Token 仪表盘、构成穿透钻取、逐轮增长图与锚定刻线、一键 /compact 及会话分叉，并内置 Context Doctor 工作区（概览、诊断、分析、反馈）。'
