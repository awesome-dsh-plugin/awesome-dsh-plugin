name: bangyu888-cmd/dsh-quota-card
category: usage
description:
  en: Shows ChatGPT, Gemini and Grok Bot remaining usage with reset countdowns plus the DeepSeek balance in a compact card above the sidebar account row; thresholds, refresh interval and per-provider HTTP proxies are configurable.
  zh: 在侧栏登录名上方以紧凑卡片显示 ChatGPT、Gemini、Grok Bot 的剩余额度与重置倒计时，以及 DeepSeek 余额；可配置阈值、刷新间隔与每个 provider 的 HTTP 代理。
