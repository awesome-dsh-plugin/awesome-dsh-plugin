description:
  en: 'Windows Computer Use for DeepSeek Harness with 21 tools and verified targeting: controls are addressed through their UI Automation identity and patterns, and numbered marks are checked against the live window before input, so a stale target is refused instead of clicked. A known sequence runs in one computer_batch call, one model round trip; incremental observations, compact receipts (normally no more than about 6 KiB extra), bounded handoff waits (HANDOFF_WAIT_TIMEOUT/HANDOFF_HELD_TIMEOUT as continuations), the desktop-block cycle boundary and a deterministic 100 s owner-scoped leave backstop keep context small and prevent a stuck handoff from waiting out the tool deadline. Approval modes settle an unanswerable ask honestly: in a danger-full-access session with no approval card the action runs under that grant, every other sandbox — and every delegated subagent session — refuses and names the unavailable channel instead of reporting a user rejection, and gate diagnostics land in policy.jsonl. Human handoff, a model-visible stop brake and prebuilt native workers.'
  zh: '给 DeepSeek Harness 的 Windows 桌面操控，21 个工具，定位可验证：控件按 UI Automation 的真实身份与控件模式寻址，编号标记在派发前对照实时窗口校验，过期目标拒绝而不是点错。已知流程用一次 computer_batch 跑完，只花一轮模型往返；增量观察、默认精简回执（通常最多再加约 6 KiB）、有界的交接等待（HANDOFF_WAIT_TIMEOUT/HANDOFF_HELD_TIMEOUT，均作为可继续检查点）、“离开桌面块就 release”的边界与 100 秒 owner-scoped 自动释放兜底，让上下文保持轻量，也避免卡住的交接等到工具超时。审批模式会诚实地裁决无人可答的 ask：完全权限且无审批卡时按该授权执行，其它沙箱与被委派的子会话一律拒绝并点名“审批通道不可用”，不再把自动拒绝写成人的拒绝；门禁诊断落在 policy.jsonl。含人工接管、能传进模型的停止刹车，原生组件随包提供。'
