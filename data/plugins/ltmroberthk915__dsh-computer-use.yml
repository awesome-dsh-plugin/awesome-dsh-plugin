description:
  en: 'Windows Computer Use for DeepSeek Harness with 19 tools and verified targeting: controls are addressed through their UI Automation identity and patterns, and numbered marks are checked against the live window before input, so a stale target is refused instead of clicked. A known sequence runs in one computer_batch call, one model round trip; incremental observations and 2.0.0 compact receipts, normally no more than about 6 KiB extra, keep context small. Human handoff, approval modes, a model-visible stop brake and prebuilt native workers.'
  zh: '给 DeepSeek Harness 的 Windows 桌面操控，19 个工具，定位可验证：控件按 UI Automation 的真实身份与控件模式寻址，编号标记在派发前对照实时窗口校验，过期目标拒绝而不是点错。已知流程用一次 computer_batch 跑完，只花一轮模型往返；增量观察与 2.0.0 默认的精简回执（通常最多再加约 6 KiB）让上下文保持轻量。含人工接管、审批模式、能传进模型的停止刹车，原生组件随包提供。'
