category: session
description:
  en: 'One dedicated folder per conversation: archives the transcript, auto-categorizes research output by type once the conversation has been idle for 10 minutes, adds a delete action to the session menu, and permanently removes the folder with the conversation.'
  zh: '每个会话一个专属文件夹：自动存档对话记录，会话空闲 10 分钟后把调研产出的表格、图表等文件按类别归档并自动命名，会话菜单中提供删除入口，删除会话时连同文件夹一起彻底删除。'
