url: https://github.com/WinKing-R/dsh-uniterminal
name: WinKing-R/dsh-uniterminal
category: remote
description:
  en: SSH terminal, SFTP file manager and port forwarding (-L/-R/-D) in the DSH right sidebar, with jump-host chains and remembered passwords kept in the operating system credential store.
  zh: 在 DSH 右侧栏里提供 SSH 终端、SFTP 文件管理与端口转发（-L/-R/-D），支持跳板链，记住的密码交给操作系统密码箱保管。
