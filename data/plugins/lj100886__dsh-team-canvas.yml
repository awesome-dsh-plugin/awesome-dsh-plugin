url: https://github.com/lj100886/dsh-team-canvas
name: lj100886/dsh-team-canvas
category: ui
description:
  en: 'Renders an Agent Teams swimlane canvas above the composer: lead centred with members below, tasks laid out in lanes by longest dependency path, and four SVG connector families drawn as dashed paths (task dependency as a cubic bezier from the upstream card edge to the downstream card edge, lead bus, peer bus, member-to-task tether). Cards are absolutely positioned DOM, connectors are one SVG layer sharing the same geometry constants. Layout constants and path algorithms are ported from cc-haha. Uses theme tokens only and ships zh/en dictionaries. The roster, tasks and messages are currently built-in demo data, not a live Agent Teams projection.'
  zh: '在输入框上方渲染 Agent Teams 泳道看板：队长居中、成员在下，任务按最长依赖路径分泳道排列，四类连线用 SVG 虚线绘制（任务依赖是上游卡片右缘到下游卡片左缘的三次贝塞尔，另有队长总线、成员同级总线、成员到任务的 tether）。卡片是绝对定位 DOM，连线是一层 SVG，两者共用同一组几何常量。布局常量与路径算法移植自 cc-haha。只用主题 token，带中英文字典。团队成员、任务与消息目前是内置演示数据，尚未接入实时 Agent Teams 投影。'
