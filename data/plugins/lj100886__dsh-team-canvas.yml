url: https://github.com/lj100886/dsh-team-canvas
name: lj100886/dsh-team-canvas
category: ui
description:
  en: 'Renders an Agent Teams swimlane canvas above the composer: lead centred with members below, tasks laid out in lanes by longest dependency path, and four SVG connector families drawn as dashed paths (task dependency as a cubic bezier from the upstream card edge to the downstream card edge, lead bus, peer bus, member-to-task tether). Cards are absolutely positioned DOM, connectors are one SVG layer sharing the same geometry constants. Layout constants and path algorithms are ported from cc-haha. Reads the live per-session agentTeam projection (roster, shared tasks, dependency edges, running state) and falls back to the session todo list when the session has no team; team messages are not part of the projection yet, so the communication panel shows an empty state. Body colours come from host theme tokens; the eight member identity colours are the deliberate exception — fixed hues mixed with the theme accent via color-mix, declared as CSS variables because the same values feed an SVG stroke attribute that rejects colour functions. Ships zh/en dictionaries with identical keys.'
  zh: '在输入框上方渲染 Agent Teams 泳道看板：队长居中、成员在下，任务按最长依赖路径分泳道排列，四类连线用 SVG 虚线绘制（任务依赖是上游卡片右缘到下游卡片左缘的三次贝塞尔，另有队长总线、成员同级总线、成员到任务的 tether）。卡片是绝对定位 DOM，连线是一层 SVG，两者共用同一组几何常量。布局常量与路径算法移植自 cc-haha。数据读当前会话实时的 agentTeam 投影（名册、共享任务、依赖边、执行态）；会话没有团队时回退到本会话的工作清单。团队消息暂不在投影里，通讯面板显示空态。主体配色走宿主主题 token；八名成员的身份色是刻意的例外——色相固定，饱和度与明度用 color-mix 从主题强调色派生，且以 CSS 变量声明，因为这些值同时喂给 SVG 的 stroke 属性，而该位置不接受颜色函数。带中英文字典，两份键位一致。'
