url: https://github.com/SLZ2025/dsh-open-code-workspace
name: SLZ2025/dsh-open-code-workspace
category: ui
description:
  en: 'Adds a button beside the workspace header that opens a VS Code .code-workspace file as one multi-root Workspace and starts a new Session in it. Folders are linked under $DSH_HOME/multiroot (junction on Windows, symlink elsewhere); only the chosen file is read. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在「工作区」标题旁加一个按钮：选择 .code-workspace 文件后，把其中的目录链接成一个多根工作区并在其中新开会话（Windows 用 junction，其他平台用软链接，聚合目录位于 $DSH_HOME/multiroot）。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
