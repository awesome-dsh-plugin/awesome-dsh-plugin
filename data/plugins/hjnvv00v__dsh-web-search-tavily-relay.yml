url: https://github.com/hjnvv00v/dsh-web-search-tavily-relay
name: hjnvv00v/dsh-web-search-tavily-relay
category: browser
description:
  en: Registers a Tavily-backed search provider into the ctx.web seam so the built-in web_search uses it, with the endpoint, credential and wire protocol configurable so a relay domain or an OpenAI-compatible gateway works like the official API.
  zh: 向 ctx.web 接缝注册一个 Tavily 搜索后端，内置 web_search 直接使用它；端点、凭据与协议均可配置，中转域名或 OpenAI 兼容网关与官方接口一样可用。