description:
  en: "The Kaipu site plugin: define an organisation and its seats, then dispatch tasks through a project lifecycle that runs from requirements to archive. Phase advancement needs human confirmation — an agent can only propose it. Every request, handoff and approval is recorded and can be verified. Installs and uninstalls on its own."
  zh: "山海·开铺 场地插件：定义组织结构与席位，再按项目阶段（从立需求到归档）派发任务。阶段推进需要人工确认——Agent 只能提出建议，由人确认后才生效。每一次派单、交接与审批都有记录，可供核对。可单独安装或卸载。"
