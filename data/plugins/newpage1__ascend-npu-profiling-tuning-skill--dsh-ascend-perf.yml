description:
  en: "Ascend NPU fleet monitor plus controlled vLLM container deployment for DeepSeek Harness. Environments come from envs.json; npu-smi is collected locally or over SSH with one connection per environment. The sidebar shows idle/partial/busy occupancy, processes, and per-card/per-chip details, and lets you preview or start a vLLM container on selected idle NPU chips. Preview is read-only; real start requires deploy.allowRealExecution plus a confirmation token, only touches dsh-apf-svc-* containers, binds ports to 127.0.0.1, and never stops other users' containers."
  zh: "DeepSeek Harness 的昇腾 NPU 多环境占用看板 + 受控 vLLM 容器服务：环境从 envs.json 读取，通过本机或 SSH 只读采集 npu-smi（每环境一条连接），侧栏显示空闲/部分/高负载、占用进程与逐卡逐 chip 详情；可在选定环境的空闲 NPU chip 上预览/启动 vLLM 容器。预览为只读，真实启动需 deploy.allowRealExecution + 确认令牌，只操作 dsh-apf-svc-* 自有容器，端口只绑 127.0.0.1，不停止他人容器。"
