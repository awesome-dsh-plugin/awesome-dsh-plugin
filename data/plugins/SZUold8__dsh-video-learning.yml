url: https://github.com/SZUold8/dsh-video-learning
name: SZUold8/dsh-video-learning
category: vision
description:
  en: 'Video study toolkit for DeepSeek Harness: fetch a public Bilibili single part or YouTube video, sample every 3 seconds plus change-triggered frames, transcribe locally with faster-whisper, page through section grids, and render a 16:9 study deck. Windows only; FFmpeg required; transcription and deck output need optional dependencies.'
  zh: '视频精读：获取 B 站单分P或 YouTube 视频，每 3 秒基础采样并补取变化帧，本地 faster-whisper 转写，分页读取分段图版，并可排版成 16:9 学习 PPT。仅 Windows；需 FFmpeg；转写与 PPT 输出需可选依赖。'
icon: https://raw.githubusercontent.com/SZUold8/dsh-video-learning/main/assets/icon-180.png
