url: https://github.com/tshui1/dsh-skill-autoload
name: tshui1/dsh-skill-autoload
category: skill
description:
  en: 'Auto-loads a matching installed skill from each user message, and lets the user choose which skills may auto-load from a sidebar panel. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '根据每条消息自动加载匹配的已装技能，无需触发词，并可在右侧栏勾选允许自动加载的技能。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/tshui1/dsh-skill-autoload/main/assets/icon-180.png
