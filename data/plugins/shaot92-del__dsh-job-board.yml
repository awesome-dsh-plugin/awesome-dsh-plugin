url: https://github.com/shaot92-del/dsh-job-board
name: shaot92-del/dsh-job-board
category: remote
description:
  en: 'Multi-machine job board for DSH: 12 board tools, 4 shell tools, a GUI panel, and a dispatcher that hands queued tasks to remote hosts through dsh-remote-agent. Single-machine use starts its own loopback board; multi-machine use needs the bundled Python board server (tools/board_server.py, started with GP_BOARD_TOKEN set, binding 0.0.0.0 by default) and dsh-remote-agent hosts. The sh_* tools only reach directories on the allowedRoots list.'
  zh: 'DSH 多机作业板：12 个作业板工具、4 个命令工具、一个图形面板，并经 dsh-remote-agent 把排队任务派给多台机器。单机使用时会自己在回环地址起一个板子；多机使用需要随包附带的 Python 作业板服务（tools/board_server.py，启动前设置 GP_BOARD_TOKEN，默认绑定 0.0.0.0）和 dsh-remote-agent 主机。sh_* 工具只能访问 allowedRoots 名单里的目录。'
icon: https://raw.githubusercontent.com/shaot92-del/dsh-job-board/main/assets/icon-180.png