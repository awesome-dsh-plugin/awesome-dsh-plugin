url: https://github.com/romantic123fly/dsh-session-folders
name: romantic123fly/dsh-session-folders
category: session
description:
  en: 'Gives every new conversation its own folder inside the workspace directory, names the folder after the conversation title, moves the agent working directory into it, and adds a session-menu delete action that asks before removing a folder that still contains files.'
  zh: '为工作区里的每个新对话在对应目录下创建以对话标题命名的文件夹，把该对话的工作目录切到其中；侧边栏会话菜单新增删除入口，文件夹内仍有文件时会先询问是否一并删除。'
