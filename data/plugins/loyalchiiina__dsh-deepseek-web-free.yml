url: https://github.com/loyalchiiina/dsh-deepseek-web-free
name: loyalchiiina/dsh-deepseek-web-free
category: model
description:
  en: 'Registers a `deepseek-web` provider that drives your own signed-in chat.deepseek.com account as an extra model in DSH, and also embeds the DeepSeek web app inside the DSH window: a right-sidebar tab, plus a draggable and resizable whale floating window whose position and size are remembered across restarts (the window follows the ball while you drag it). Sign-in is one-time and synchronized in both directions - signing in or out in the settings page or inside the panel updates the other side, so a restart does not ask again. The provider side needs no Open Platform API key: the sidebar footer lists your Web conversations, Fork to Workspace opens an independent Harness session that never writes back to the original conversation, native search stays on for the `default` model, and `/clean` is a session toggle that sends only the human text. Fork of y-wi/dsh-deepseek-web, kept working on current DSH 0.2.x (widened peer ranges, `ctx.settings.configure()` plus `.volatile()` config fields, renamed client icons, SSE errors surfaced as real errors instead of poisoning the session history). Installing it alongside the upstream dsh-deepseek-web is not supported: both register the same deepseek-web provider. Use only for personal convenience: reusing a web login from a third-party client may violate DeepSeek''s terms of service and carries account risk (rate limiting, suspension, ban); the authors accept no responsibility for any consequences.'
  zh: '把你已登录的 chat.deepseek.com 账号当作额外模型接入 DSH，同时把 DeepSeek 网页端直接嵌进 DSH 窗口：右侧栏标签页，以及一颗可拖动、可拉伸的鲸鱼悬浮球窗口（位置与尺寸跨重启记忆，拖球时窗口跟随）。登录只需一次且双向同步——在设置页或面板内登录/退出都会同步到另一边，重启后无需重登。Provider 侧无需 Open Platform API key：侧边栏底部列出你的网页端会话，「Fork to Workspace」会开一个独立的 Harness 会话、不回写原对话，`default` 模型保持网页端原生搜索，`/clean` 是只发送人类文本的会话开关。本包是 y-wi/dsh-deepseek-web 的 fork，适配当前 DSH 0.2.x（放宽 peer 范围、用 `ctx.settings.configure()` 与 `.volatile()` 配置字段、更新改名的客户端图标、SSE 错误直接报错而不再污染会话历史）。不能与上游 dsh-deepseek-web 同装：两者注册同一个 deepseek-web provider。仅供个人方便使用：把网页端登录态用于第三方客户端可能违反 DeepSeek 服务条款，存在账号风险（限流 / 冻结 / 封禁），作者不承担任何责任。'
