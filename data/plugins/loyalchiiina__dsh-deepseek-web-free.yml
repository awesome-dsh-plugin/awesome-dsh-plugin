url: https://github.com/loyalchiiina/dsh-deepseek-web-free
name: loyalchiiina/dsh-deepseek-web-free
category: model
description:
  en: 'Registers a `deepseek-web` provider that drives your own signed-in chat.deepseek.com account as an extra model in DSH, so no Open Platform API key is needed: the sidebar footer lists your Web conversations, Fork to Workspace opens an independent Harness session that never writes back to the original conversation, native search stays on for the `default` model, and `/clean` is a session toggle that sends only the human text. Fork of y-wi/dsh-deepseek-web, kept working on DSH 0.2.1-alpha.2: the peer ranges are widened so the compatibility gate no longer rejects the whole bundle, the removed settings API is replaced with `ctx.settings.configure()` plus `.volatile()` config fields, the renamed client icons are updated, and an upstream SSE error now surfaces as a real error instead of an empty message that poisoned the session history.'
  zh: '把你已登录的 chat.deepseek.com 账号当作额外模型接入 DSH：注册 `deepseek-web` provider，无需 Open Platform API key；侧边栏底部列出你的网页端会话，「Fork to Workspace」会开一个独立的 Harness 会话、不回写原对话，`default` 模型保持网页端原生搜索，`/clean` 是只发送人类文本的会话开关。本包是 y-wi/dsh-deepseek-web 的 fork，已适配 DSH 0.2.1-alpha.2：放宽 peer 范围以免被兼容性门禁整包拒绝、用 `ctx.settings.configure()` 与配置字段 `.volatile()` 替代被移除的 settings API、更新已改名的客户端图标、并让上游 SSE 错误直接报错（不再返回空消息污染会话历史）。'
