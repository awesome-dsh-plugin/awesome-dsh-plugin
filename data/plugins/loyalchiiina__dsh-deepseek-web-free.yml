description:
  en: 'A fork of y-wi/dsh-deepseek-web that keeps only the floating ball and sidebar shortcuts opening the official chat.deepseek.com web panel inside DSH. In-DSH chat by selecting a DeepSeek Web model was removed in 1.0.44; selected-text right-click still sends text into the web input after clearing it. Sign in once on the official page inside the panel. WARNING: a real account ban was observed (the author test account was muted until 2026-11-20 16:21 for violating user terms); versions before 1.0.44 carry a HIGH BAN RISK, and the author accepts no liability. Adapts DSH kernel 0.2.2-rc.1. Cannot be installed alongside y-wi/dsh-deepseek-web.'
  zh: 'y-wi/dsh-deepseek-web 的 fork：1.0.44 起只保留悬浮球与侧边栏打开官方 chat.deepseek.com 网页面板，已移除在 DSH 中直接选 DeepSeek Web 模型对话的功能；选中文字右键投送到网页端输入框的功能保留。在网页面板里用官方页面登录一次即可。⚠️ 已出现真实账号封禁案例（作者测试账号因违反用户规范被禁言至 2026-11-20 16:21）；1.0.44 之前版本有较高封号风险，作者不承担任何责任。适配 DSH 内核 0.2.2-rc.1。不能与 y-wi/dsh-deepseek-web 同装。'
