description:
  en: 'Paste a link and the agent reads it for you. Douyin, Xiaohongshu and Bilibili videos parse automatically; articles, PDFs and audio become citable Markdown and knowledge-base entries. Sign in with one scan. Measured on 123 live links: 80% came back as usable material (93% of the pages that answered at all), and an unreachable link reports in 26 s instead of 77 s. Works in Codex, Claude Code and DSH.'
  zh: '贴一条链接，Agent 直接把内容读给你。抖音、小红书、B 站视频自动解析；文章、PDF、音频秒变可引用的 Markdown 和知识库条目。登录就地扫码。123 条真实链接实测：80% 能当材料用（能连上的页面里 93% 读出正文），打不开的链接 26 秒就报，不用干等 77 秒。Codex / Claude Code / DSH 通用。'
