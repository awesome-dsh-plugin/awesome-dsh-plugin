name: regrevia/Envoy#envoy-dsh
category: browser
description:
  en: 'DeepSeek Harness bundle for Envoy: mounts the Envoy MCP bridge with the bounded core toolset and registers the Envoy Agent Skill. Paste one Douyin or Bilibili share link — an image-note, a short video, a course episode — and Envoy reads it as traceable material with source locators, transcript timestamps and frames, then organizes it into the Markdown deliverable you asked for; articles, PDFs and audio work the same way. Long runs checkpoint every item, so an interrupted batch resumes instead of starting over.'
  zh: 'Envoy 的 DeepSeek Harness 插件：挂载有界 core 工具集的 Envoy MCP 桥并注册 Envoy Agent Skill。粘一条抖音或 B 站的图文、短视频、课程分集分享链接，Envoy 就把它读成带来源定位的可追溯材料——转写时间戳、抽帧俱全——再整理成你要的 Markdown 干货稿；文章、PDF、音频同理。长任务逐条落检查点，中断后续跑，不必重来。'
