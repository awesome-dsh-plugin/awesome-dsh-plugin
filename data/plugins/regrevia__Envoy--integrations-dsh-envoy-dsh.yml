description:
  en: 'Paste a link and the agent reads it for you. Douyin, Xiaohongshu and Bilibili videos parse automatically; articles, PDFs and audio become citable Markdown. Same 60 turns with vs without: finishes reading 22% → 92%, times out 68% → 0%, answer quotes a real source fact 23% → 82%. On 123 live links 80% came back usable (93% of the pages that answered), and an unreachable link reports in 26 s instead of 77. Codex, Claude Code, DSH.'
  zh: '贴一条链接，Agent 直接把内容读给你。抖音、小红书、B 站视频自动解析，文章/PDF/音频秒变可引用 Markdown。同一批题 60 轮对照：读完并作答 22% → 92%，跑到超时 68% → 0%，答案说中原文事实 23% → 82%。123 条真实链接里 80% 能直接当素材（能连上的页面里 93%），打不开的链接 26 秒就报，不用干等 77 秒。Codex / Claude Code / DSH 通用。'
