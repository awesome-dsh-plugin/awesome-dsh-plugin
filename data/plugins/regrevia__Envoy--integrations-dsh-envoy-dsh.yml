name: regrevia/Envoy#dsh-envoy
category: browser
description:
  en: 'Distill any link into Markdown, a wiki or a knowledge base. Installs per host: DSH -> envoy-dsh; Claude Code/Codex -> envoy@envoy. Douyin/Bilibili video, image posts, WeChat, Xiaohongshu, PDFs, podcasts. Video is read on its own timeline with keyframes and ASR transcripts locatable to [mm:ss], so the context carries what was said and shown instead of the title and the recommendation rail. On 60 turns with vs without: ends normally with the gaps named 22% -> 92%, times out 68% -> 0% (the A/B is exploratory: different time caps, no human correctness review). On 123 live links 80% came back usable (93% of the pages that answered).'
  zh: '蒸馏一切链接，出摘要、Markdown、Wiki 或知识库。装法按宿主：DSH → envoy-dsh；Claude Code、Codex → envoy@envoy。抖音与 B 站视频、图文笔记、公众号、小红书、PDF、播客都在内。视频按时序读：关键帧配 ASR 转写，内容定到 [mm:ss]，上下文里是实际说过、看得见的东西，不是标题和推荐流。同一批题 60 轮对照：正常读完并把缺口说清 22% → 92%，跑到超时 68% → 0%（这组 A/B 是探索性的：两臂时限不同、未做人工正确性复核）。123 条真实链接里 80% 能直接当素材（能连上的页面里 93%）。'
