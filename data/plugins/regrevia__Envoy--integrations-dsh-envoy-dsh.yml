description:
  en: 'Paste a link, let the agent take it from there. Douyin, Xiaohongshu and Bilibili videos come back parsed — captions, chapters, timestamped frames — and articles, PDFs and audio become Markdown, wiki pages or knowledge-base entries the model can quote. A sign-in wall is one scan in place; nothing else to install. One skill across Codex, Claude Code and DeepSeek Harness.'
  zh: '粘贴一条链接，剩下的交给 Agent。抖音、小红书、B 站的视频自动解析——字幕、分P、时间轴画面；文章、PDF、音频同样变成可直接引用的 Markdown、wiki 页和知识库条目。要登录就地扫码，不用再装第二个 CLI。同一套技能，Codex / Claude Code / DeepSeek Harness 通用。'
