description:
  en: 'Reads a linked page, PDF, video or audio through Envoy and returns source-located Markdown, wiki pages or knowledge-base entries the harness can use directly. One skill, shared with Codex and Claude Code; this entry is the DeepSeek Harness bundle, which provisions its own Envoy runtime on first use.'
  zh: '把链接直接变成可用的素材：网页、PDF、视频、音频交给 Envoy 读取，返回带来源定位的 Markdown、wiki 页或知识库条目，供 DeepSeek Harness 直接使用。同一套技能与 Codex、Claude Code 共用；本条目是 DeepSeek Harness 插件，首次使用时自行准备 Envoy 运行时。'
