name: regrevia/Envoy#envoy-dsh
category: browser
description:
  en: 'Drop the link you are looking at, get the thing you wanted out: Markdown, a wiki page, a knowledge-base entry. Douyin, Bilibili, Xiaohongshu, Zhihu, WeChat posts, PDFs and podcasts take the same path. Measured on 92 live links: 75% usable as source material, 0 failures. DeepSeek Harness build of the Envoy skill (also ships for Codex and Claude Code). Requires the separate Envoy CLI (0.1.6+, GitHub release wheel, then envoy browser setup); macOS/Linux only.'
  zh: '把看到的任何链接丢给 AI，直接产出你要的东西：Markdown、wiki、知识库条目。抖音、B站、小红书、知乎、公众号、PDF、播客同一条路。实测 92 条真实链接 75% 可直接当素材用，失败 0 条。同一套 Envoy 技能也适配 Codex 与 Claude Code，本条目是 DeepSeek Harness 插件。需另装 Envoy CLI（0.1.6+，用 GitHub Release 的 wheel 安装并运行 envoy browser setup）；仅支持 macOS/Linux。'
