url: https://github.com/wzciczw/dsh-explainer
name: wzciczw/dsh-explainer
category: ui
description:
  en: "Select text in the DSH chat or in a file opened in the right sidebar and ask about it in place (floating pill, right-click, or Ctrl/Cmd+Shift+E): answers stream from a one-shot completion that follows the main window's model, inherits a read-only conversation snapshot, and, for a right-sidebar file, reads that file whole as context. A composer quick-ask entry (Ctrl/Cmd+Shift+K) opens the same window without a selection; nothing is written to the main session."
  zh: "在 DSH 对话里或右侧栏打开的文件里划词就地提问（浮出按钮、右键或 Ctrl/Cmd+Shift+E）：答案由一次性 completion 流式产出，沿用主窗口模型，继承只读对话快照；来自右侧栏文件时还会读取该文件全文作为上下文。输入框的「快问」入口（Ctrl/Cmd+Shift+K）可不开选区直接提问，且不会写入主会话。"
icon: https://raw.githubusercontent.com/wzciczw/dsh-explainer/main/assets/icon-180.png