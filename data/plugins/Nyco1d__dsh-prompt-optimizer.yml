description:
  en: Prompt optimizer whose output length follows your ask - say "keep it short" and it writes a 350-word brief instead of a 1200-word template. Original templates, no upstream copy.
  zh: 提示词优化器，长度跟着你的话走：说「简洁」就写 350-650 字的精简版，不说才展开到 1400 字。模板原创，不复刻上游。
