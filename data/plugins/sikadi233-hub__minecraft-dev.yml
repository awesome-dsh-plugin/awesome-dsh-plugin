description:
  en: "Minecraft development for DeepSeek Harness (dsh), covering Minecraft 1.7.10 through 26.3: 9 skills for Paper/Spigot plugins, Fabric, Forge and NeoForge mods, addon development against major mods, and Gradle/JDK setup per era; the mc_scaffold generator and mc_gradle runner; 18 offline API signature indexes generated from the pinned artefacts with provenance headers; and mc_arbitrate, a deterministic sharded pipeline (contract freeze, per-shard briefs, 21 high-confidence audit rules including 5 cross-shard checks, manifest merge, compile-error routing) that calls no model inside the engine. Apache-2.0 with NOTICE."
  zh: "面向 DeepSeek Harness（dsh）的 Minecraft 开发插件，覆盖 Minecraft 1.7.10 至 26.3：9 个技能（Paper/Spigot 插件、Fabric/Forge/NeoForge 模组、大型模组附属、分时代 Gradle/JDK 构建）、mc_scaffold 项目生成器与 mc_gradle 构建执行器、18 份由钉选工件生成且带 provenance 头的离线 API 签名索引，以及确定性分片流水线 mc_arbitrate（契约冻结、分片任务书、21 条高置信审计规则含 5 条跨分片检查、清单合并、编译错误定点路由），引擎内部不调用模型。Apache-2.0 + NOTICE。"
