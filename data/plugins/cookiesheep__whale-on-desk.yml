description:
  en: Pixel-art whale desktop companion with 12 frame-audited states — taps the glass and flashes the tab title when an approval waits, speaks a completion report when a turn ends, and adds the first slash-command palette to the web client.
  zh: 像素鲸鱼桌宠,12 个逐帧验收状态:等批准时贴屏敲玻璃并让标签页标题闪烁,任务完成开口汇报,并内置 web 端第一个斜杠命令面板。
