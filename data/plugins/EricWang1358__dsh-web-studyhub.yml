url: https://github.com/EricWang1358/dsh-web-studyhub
name: EricWang1358/dsh-web-studyhub
category: tools
description:
  en: 'Study workspace for DeepSeek Harness: imports your own PDF, DOCX, PPTX and Markdown materials plus lecture recordings, turns them into source-cited flashcards, quizzes and open questions, and schedules spaced review with FSRS-6 in a built-in web panel. Imported recordings are transcribed with your own SiliconFlow, Groq or Gemini key; live classes can instead use an on-device SenseVoice engine that needs no key (about 239 MB on first install); requires DSH 0.2.0-rc.2 or later but below 0.3.'
  zh: 'DSH 的学习工作台：导入自己的 PDF、DOCX、PPTX、Markdown 资料与课堂录音，生成带出处引用的卡片、测验与开放题，按 FSRS-6 安排间隔复习，自带网页面板。导入的录音需用自备的 SiliconFlow、Groq 或 Gemini 密钥转写；课堂实录可改用本机 SenseVoice 引擎，无需密钥（首次约下载 239 MB）；需要 DSH 0.2.0-rc.2 及以上、0.3 以下。'
