url: https://github.com/TZYCeng/dsh-model-visibility
name: TZYCeng/dsh-model-visibility
category: ui
description:
  en: >-
    Manage which models appear in the composer model menu. A settings page lists every model in the active profile grouped by provider, with a per-model switch, provider-level show/hide and filters by model kind; switched-off models leave the menu while the model in use in the current session stays. Each row is tagged with reasoning support and the reasoning-effort levels the adapter publishes, context window, input modalities and model kind, merged from the settings document, the adapter, the relay's own GET /models response, a built-in pi-ai / models.dev catalog, model-name inference and a vendor-correction table, with the source named on hover and dashed borders marking inferred values. A switch, on by default, lets relay routes whose models declare text-only input accept images in memory, without editing configuration files. The hidden list is stored in the profile patch and mirrored to $DSH_HOME.
  zh: >-
    管理哪些模型出现在输入框的模型菜单里。设置页按 Provider 分组列出当前 profile 的全部模型，支持逐模型开关、渠道级批量显隐和按模型类型筛选；关闭的模型从菜单中消失，当前会话正在使用的模型保留。每行标注该模型是否支持推理及适配器公布的思考强度档位、上下文窗口、输入模态和模型类型，取值按设置文档、适配器、中转站自己的 GET /models 响应、内置 pi-ai / models.dev 目录、模型名推断和厂商校正表的顺序合并，悬停可看到来源，虚线边框表示推断值。一个默认开启的开关让中转站上声明纯文本输入的模型真正能接收图片，只在内存里生效，不修改任何配置文件。隐藏列表保存在 profile patch 中，并镜像到 $DSH_HOME。
