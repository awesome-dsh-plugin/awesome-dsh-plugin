name: DrizzleGig/dsh-novel-fanfic
category: workflow
description:
  en: 'Import the original and you have a fanfic reference library of your own: relationships, plot history and world rules always at hand, and the fates, relationships and plot you choose to change recorded as Fic Canon. While writing, keep knowledge, timeline and scene details straight; after writing, check OOC, canon conflicts and continuity. The original is only a reference — your story is yours to decide.'
  zh: '把原著导入，就能拥有一套专属的同人创作资料库。人物关系、剧情经历、世界规则，随时查阅；你想改写的人物命运、关系和剧情，也能按本作设定记录下来。写作时帮你理清人物知情、时间线和场景细节，写完还能检查人物 OOC、设定冲突和剧情前后矛盾。原著只是参考，你的故事由你决定。'
