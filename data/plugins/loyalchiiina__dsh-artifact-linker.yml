url: https://github.com/loyalchiiina/dsh-artifact-linker
name: loyalchiiina/dsh-artifact-linker
category: ui
description:
  en: 'Turns every file artifact the agent names in chat into a clickable entry — and refuses to paint one that does not resolve. Hover resolves asynchronously, and only a file that really exists becomes a hand pointer with a dashed blue outline (30 s TTL cache, so repeated hovers cost nothing); confirmed non-artifacts stay plain text and the right-click falls through to the host menu untouched. Left click reveals the file in Explorer already selected (Shell.Application Explore plus SelectItem with SVSI_ENSUREVISIBLE, so the pane scrolls to it; explorer.exe /select is deliberately not used because it silently drops the selection when an instance is already running). Right click offers seven actions: preview in DSH''s built-in sidebar, open with the default app, reveal in Explorer, save as, copy the file itself to the clipboard, copy the absolute path, or insert the path into the composer. Ctrl or Shift with left click opens with the default app, Alt with left click copies the path. Names resolve through the absolute path, the session workspace and every profile workspace, then a cached basename index built with a depth budget, shrinking from the left when a mention swallows leading words. The host half also keeps six system-prompt rules resident, so absolute paths stay in tool arguments while the body shows only file names, and every route is loopback-only.'
  zh: '把对话里出现的每个文件产物变成可点入口，并且拒绝给解析不到的文件画芯片。悬停时先异步解析，只有文件真的存在才变手型并画蓝色虚线框（结果进 30 秒 TTL 缓存，反复悬停不重复请求）；确认不是产物的片段保持普通文字，右键直接放行宿主原生菜单。左键在资源管理器里定位并选中该文件（Shell.Application 的 Explore + SelectItem，带 SVSI_ENSUREVISIBLE 所以会自动滚到可见处；刻意不用 explorer.exe /select，因为已有窗口时它会静默丢掉选中）。右键七项：在侧边栏预览、用默认程序打开、在文件夹中显示、另存为、复制文件、复制文件路径、添加到对话框。Ctrl/Shift+左键用默认程序打开，Alt+左键复制路径。路径按绝对路径、会话工作区、各 profile 工作区、以及带深度预算的同名文件索引逐级解析，遇到「提及吞掉了前面几个词」时从左收缩重试。宿主侧还常驻六条系统提示词铁律，让绝对路径留在工具参数里、正文只写文件名；所有路由仅回环可用。'
