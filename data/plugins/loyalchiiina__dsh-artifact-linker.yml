url: https://github.com/loyalchiiina/dsh-artifact-linker
name: loyalchiiina/dsh-artifact-linker
category: ui
description:
  en: 'Forces every file the assistant produces to be reported as an absolute path, and extends the official context menu on a file link with eight actions: open in the sidebar, open in a floating window, open with the default app, reveal in Explorer, save a copy elsewhere, copy the file, copy its path, and add it to the chat box, so a result reaches a friend in one click. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '强制对话里每个产物都给出完整绝对路径，并把官方右键菜单扩展成八项：在侧边栏打开、在悬浮窗打开、用默认程序打开、在资源管理器中定位、另存为到指定位置、复制文件、复制文件路径、添加到对话框，产物一键分享给好友。适配 DSH 内核 0.2.2-rc.1。'
