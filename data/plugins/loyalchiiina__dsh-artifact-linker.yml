url: https://github.com/loyalchiiina/dsh-artifact-linker
name: loyalchiiina/dsh-artifact-linker
category: ui
description:
  en: 'Forces every file the assistant produces to be reported as an absolute path, and extends the official context menu on a file link with six actions: copy the file to the clipboard, copy its path into the chat box, open it in the sidebar, open it in a floater, reveal it in Explorer, and open it with the default app, so a result reaches a friend in one click. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '强制对话里每个产物都给出完整绝对路径，并把官方右键菜单扩展成六项：复制文件到剪贴板、复制路径到对话框、在侧边栏打开、在悬浮窗打开、定位文件夹、用默认应用打开，产物一键分享给好友。适配 DSH 内核 0.2.2-rc.1。'
