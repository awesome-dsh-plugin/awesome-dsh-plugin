url: https://github.com/ralcer-he/dsh-progress-lens
name: ralcer-he/dsh-progress-lens
category: ui
description:
  en: "A right-side panel for long-running tasks: every so often it says in plain words what has been finished, what is happening now, and what comes next — and now and then it mutters a thought of its own, the kind that is not progress at all: a doubt, a small smugness, something that looks off. Progress notes stay dry and third-person; the asides are rewritten into a short first-person sentence, shown as a lighter italic line beneath, and stay silent when nothing is worth saying. Read-only, never touches your session, and you can ask it a question or just chat while the task keeps running. Requires the dsh-better-sidebar plugin, whose right sidebar hosts the panel."
  zh: "在右侧栏盯着长任务的进度面板：隔一会儿用大白话说清做完了什么、现在手头是什么、接下来大概要做什么；另外偶尔冒一句自己的心里话——那些压根不算进度的东西，一点犹豫、半点小得意、哪儿看着别扭。进展照旧是干巴巴的第三人称摘要，心里话则压成一句第一人称的碎碎念，淡色斜体排在下面，没得说就一句不说。只读不写会话，跑着的时候也能随时问一句或随便聊两句。需先安装 dsh-better-sidebar（面板借用它的右栏）。"
icon: https://raw.githubusercontent.com/ralcer-he/dsh-progress-lens/main/assets/icon-180.png
