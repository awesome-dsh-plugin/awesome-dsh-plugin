name: loyalchiiina/dsh-skill-browser
category: ui
icon: https://raw.githubusercontent.com/loyalchiiina/dsh-skill-browser/main/icon.svg
description:
  en: 'Skills and MCP browser behind one floating ball with four tabs (Skills, Call Ledger, MCP, Market) plus a ? Quick Start help entry at top right (click to expand/collapse), with 17 author plugins in the settings page version list. Skills: native folder picker, two-level categories plus custom groups, tree or flat view, manual/keyword/AI grouping on metadata only, search, per-card or whole-library enable/disable with backups. Call Ledger: counts, success rate, trend, ranking. Session bar lists injected MCP servers as colored capsules (hover for details). MCP: live loader config, real Fiber states, tools and call stats, optimistic one-click master switch, instant enable/disable follow, reconnect, uninstall, export to mcpServers JSON, local scan and AI fix. Market: official Registry plus 29 curated free entries, 19 flat categories, grid/list views, one-click install/uninstall, free-only filter, two-way sync with MCP tab. 130 skins sync across three balls. Adapts DSH kernel 0.2.2-rc.1. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '技能与 MCP 浏览器：一个悬浮球四个 Tab（技能浏览 / 调用台账 / MCP / 市场 · MCP 市场）+ 右上角 ? 快速上手帮助入口（点击展开/再点收起），设置页作者插件/插件版本清单共 17 项。技能浏览（系统目录选库、两级分类加自定义分组、树状/平铺、手动/关键词/AI 分组且只发元数据、搜索、单卡或全库启停并自动备份）、调用台账（次数/成功率/趋势/排行）、会话栏列出已注入 MCP 的彩色胶囊（悬停看详情）、MCP（真实 loader 配置与 Fiber 状态、工具清单与调用统计、总开关乐观刷新、启停即时跟手/重连/卸载/导出 mcpServers JSON、本机 MCP 扫描与 AI 修复）、市场（官方 MCP Registry + 29 条精选免费目录、19 大类平铺分类、网格/列表双模式、一键安装/卸载、仅免费筛选、与 MCP 页双向即时同步）。130 款皮肤在三颗悬浮球间同步。适配 DSH 内核 0.2.2-rc.1。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
