url: https://github.com/loyalchiiina/dsh-skill-browser
name: loyalchiiina/dsh-skill-browser
category: ui
description:
  en: 'Skills and MCP browser for DeepSeek Harness. One floating ball opens a four-tab panel: Skills, Call Ledger, MCP and Quick Start. The Skills tab browses the library you point it at (native directory chooser, defaults to ~/.dsh/skills, no path is shipped with the plugin) with two-level categories plus custom groups, tree and flat views, expand-all and collapse-all, a configurable number of cards per row (2-6), manual, keyword-based and AI grouping, and search by skill name, description or body. AI grouping sends metadata only - directory name plus the frontmatter description - never the skill body, and it never modifies any skill file; it ships a 24-hour result cache, a live progress overlay showing elapsed versus estimated seconds, and a cumulative-time badge that survives closing or switching away from the panel. Per-card, per-category and whole-library enable/disable rewrites disable-model-invocation in that SKILL.md with a timestamped backup. The Call Ledger reports call counts, success rate, trend and a ranking from tools/result events. The MCP tab reads the live loader configuration (serverName, transport, command, args, env keys), shows real Fiber states, per-server tool lists and persisted call statistics, and supports enable and disable by appending a managed block to the profile patch instead of rewriting the whole YAML, plus reconnect and export to mcpServers JSON. It also scans the machine for installed but unconfigured MCP packages and runs an AI fix pass that diagnoses failing servers and applies reconnect, enable, disable or clean actions with automatic backup. Quick Start is an eight-step guide, and 130 skins stay in sync across the three floating balls.'
  zh: 'DeepSeek Harness 的技能与 MCP 浏览器。右下角一个悬浮球打开四页面板：技能浏览 / 调用台账 / MCP / 快速上手。技能浏览页浏览你指定的技能库（弹系统目录选择框，默认 ~/.dsh/skills，插件不含任何预设路径），支持两级分类加自定义分组、树状与平铺视图、全部展开与全部收起、每行卡片数可调（2~6）、手动分组、关键词分组与 AI 分组，并可按技能名、简介或正文搜索。AI 分组只发送元数据（目录名加 frontmatter 简介），绝不读取技能正文，也绝不修改任何技能文件；自带 24 小时结果缓存、显示已用与预计秒数的进度浮窗，以及关闭面板或切走对话后仍保留的累计用时标签。单卡、按分类与全库启停会改写该 SKILL.md 的 disable-model-invocation，写盘前自动生成带时间戳的备份。调用台账基于 tools/result 事件统计调用次数、成功率、趋势与排行。MCP 页读取运行时真实 loader 配置（serverName、transport、command、args、env 键名），展示真实 Fiber 状态、每个服务器的工具清单与落盘调用统计，启停通过在 profile 补丁末尾追加受管块实现而不重写整份 YAML，并支持重连与导出 mcpServers JSON；还能扫描本机已安装但未配置的 MCP 包，并执行 AI 修复：诊断异常服务器并应用重连、启用、停用或清理动作，改配置前自动备份。快速上手为八步图文引导，130 款皮肤在三颗悬浮球之间同步。'
