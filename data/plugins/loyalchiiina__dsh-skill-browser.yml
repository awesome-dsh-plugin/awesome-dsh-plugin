url: https://github.com/loyalchiiina/dsh-skill-browser
name: loyalchiiina/dsh-skill-browser
category: ui
description:
  en: 'Browse the skill library from a floating-ball panel: you choose the skill root yourself through a native directory chooser (defaults to ~/.dsh/skills, no path is shipped with the plugin), skills are grouped into first and second level categories, descriptions are read from each SKILL.md frontmatter, search filters by skill name, description or original text, and a card opens the full SKILL.md. Skills can be switched on and off per card, per category or for the whole library — the toggle rewrites disable-model-invocation in that SKILL.md and keeps a .bak-toggle backup, and disabled cards grey out until restored. A failure ledger separates automatic from manual entries and records skill successes and failures by listening to tools/result events, reusing an existing ledger file if one is found in the library and otherwise creating one under skill-master/references. The DSH settings page gains a floating-ball section that shows or hides the three balls and offers one-click restore of a ball dragged off-screen.'
  zh: '悬浮球面板直接浏览技能库：技能库位置由你自己指定（弹系统目录选择框，默认 ~/.dsh/skills，插件不含任何预设路径），技能按一级/二级分类归组，中文简介直接读各 SKILL.md 的 frontmatter，支持按技能名、简介或原文实时搜索，点卡片查看 SKILL.md 全文。技能可单个卡片、按分类或全库批量启停——启停即改写该 SKILL.md frontmatter 的 disable-model-invocation 并自动备份为 .bak-toggle，停用卡灰显带徽章、随时一键恢复。失效台账分「自动 / 人工」两栏显示，监听 tools/result 事件自动登记成功与失败；初始化时会先在技能库内搜索已有台账文件复用（约定路径 skill-master/references 优先），搜不到才创建。DSH 设置页新增「悬浮球导航」分区，可控制三个悬浮球的显隐，并提供「一键恢复悬浮球默认位置」，把拖出屏幕的球立即复位。'