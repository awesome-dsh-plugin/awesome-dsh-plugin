url: https://github.com/loyalchiiina/dsh-skill-browser
name: loyalchiiina/dsh-skill-browser
category: ui
description:
  en: 'Skills and MCP browser behind one floating ball with five tabs: Skills (native folder picker, two-level categories plus custom groups, tree or flat view, manual, keyword and AI grouping on metadata only, search, and per-card or whole-library enable/disable with timestamped backups), Call Ledger (counts, success rate, trend, ranking), MCP (live loader config, real Fiber states, per-server tools and call stats, enable, disable, reconnect, export to mcpServers JSON, plus scan-and-AI-fix for unconfigured servers), Market (MCP marketplace: the official MCP Registry plus 29 curated free servers, 19 flat categories with per-category counts, grid and list views with 3-6 cards per row, one-click install into cordis.patch.yml with automatic backup, one-click uninstall, every server shown with its own real icon, two-way instant sync with the MCP tab, and the last scroll position is recalled) and Quick Start. 130 skins sync across the three balls. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '技能与 MCP 浏览器：一个悬浮球五个页面。技能浏览（系统目录选库、两级分类加自定义分组、树状/平铺、手动/关键词/AI 分组且只发元数据、搜索、单卡或全库启停并自动备份）、调用台账（次数/成功率/趋势/排行）、MCP（真实 loader 配置与 Fiber 状态、工具与调用统计、启停/重连/导出）、市场（MCP 市场：官方 MCP Registry 与 29 条精选免费服务器，19 大类平铺并带每类数量，网格/列表双视图且每行 3~6 列，一键安装写入 cordis.patch.yml 并自动备份、一键卸载，每条服务器用其自身真实图标，与 MCP 页双向即时同步，并记忆上次滚动位置）与快速上手。130 款皮肤在三颗悬浮球间同步。适配 DSH 内核 0.2.2-rc.1。'
