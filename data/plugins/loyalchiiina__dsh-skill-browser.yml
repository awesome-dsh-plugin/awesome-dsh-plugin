url: https://github.com/loyalchiiina/dsh-skill-browser
name: loyalchiiina/dsh-skill-browser
category: ui
description:
  en: 'Browse and govern the skill library from a floating-ball panel with three tabs — skills, call ledger and quick start. You choose the skill root yourself through a native directory chooser (defaults to ~/.dsh/skills, no path is shipped with the plugin); skills are grouped into two levels of categories, with manual, keyword-based and AI grouping available and a tree or flat view toggle, and grouping is purely visual so no skill file is ever moved. Descriptions are read from each SKILL.md frontmatter, search filters by skill name, description or original text, and a card opens the full SKILL.md. Skills can be switched on and off per card, per category or for the whole library — the toggle rewrites disable-model-invocation in that SKILL.md and writes a SKILL.md.bak-toggle-<timestamp> backup before saving, rolling back if the write fails; disabled cards grey out until restored. The call ledger separates automatic from manual entries, records skill successes and failures by listening to tools/result events, and reports call counts, success rate, trend and a ranking, reusing an existing ledger file found in the library. Hot reload picks up skill edits without a restart. The DSH settings page gains a floating-ball section that shows or hides the three balls, offers one-click restore of a ball dragged off-screen, and picks the shared 130-skin catalogue for all three balls.'
  zh: '悬浮球面板直接浏览与治理技能库，分「技能浏览 / 调用台账 / 快速上手」三页。技能库位置由你自己指定（弹系统目录选择框，默认 ~/.dsh/skills，插件不含任何预设路径）；技能按两级分类归组，支持手动分组、关键词分组与 AI 分组三种方案，并可切树状/平铺视图，分组只改视图不动任何技能文件。中文简介直接读各 SKILL.md 的 frontmatter，支持按技能名、简介或原文实时搜索，点卡片查看 SKILL.md 全文。技能可单个卡片、按分类或全库批量启停——启停即改写该 SKILL.md frontmatter 的 disable-model-invocation，写盘前自动备份为 SKILL.md.bak-toggle-<时间戳>，写失败自动回滚；停用卡灰显带徽章、随时一键恢复。调用台账分「自动 / 人工」两栏显示，监听 tools/result 事件自动登记成功与失败，并给出调用次数、成功率、趋势与排行；初始化时会先在技能库内搜索已有台账文件复用。支持一键热重载，改完技能无需重启。DSH 设置页新增「悬浮球导航」分区，可控制三个悬浮球的显隐、一键复位被拖出屏幕的球，并为三球统一挑选共享的 130 款皮肤。'
