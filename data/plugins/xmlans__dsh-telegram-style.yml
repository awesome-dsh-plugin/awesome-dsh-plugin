url: https://github.com/xmlans/dsh-telegram-style
name: xmlans/dsh-telegram-style
category: theme
description:
  en: Telegram look-and-feel for the DSH Web GUI — a solid-colour wallpaper with a tinted doodle pattern, a floating chat-list card, session rows with avatars and times, message bubbles with read ticks, a floating composer, and three palettes (Classic, Glass, Pink).
  zh: 为 DSH 换上 Telegram 的主题——纯色底加染色涂鸦图案的墙纸、浮动的会话列表卡片、带头像和时间的会话行、消息气泡、悬浮输入条，以及经典、玻璃、粉色三套配色
