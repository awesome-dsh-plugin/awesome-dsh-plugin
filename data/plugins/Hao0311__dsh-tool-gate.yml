url: https://github.com/Hao0311/dsh-tool-gate
name: Hao0311/dsh-tool-gate
category: tools
description:
  en: 'Finds the plugins that cost you context and never get called: tool_gate scans every registered tool, groups it by purpose (subagents, workflow, scheduled tasks, session queries, MCP servers, voice, meta), estimates each group''s share of the tool-definition prompt from its real schemas, and counts how often each tool was actually called over the last 90 days from the local plugin-usage log, then prints one table of group, tool count, tokens and calls. off group=<id> folds that group out of the current agent''s tool surface through the host tools.restrict() API and on group=<id> brings it back. It only suggests, never folds on its own; the core group (shell, read, write, edit, grep) and tool_gate itself cannot be folded. Token counts are estimates of the definitions the group adds (plus or minus about ten percent) and count a call only where the local usage log has one, so a freshly installed profile shows zero calls until it has run for a while. The fold lasts for the session and is forgotten on restart, and a group whose tools are not registered globally is reported but cannot be folded.'
  zh: '揪出那些占着上下文却从不被调用的插件：tool_gate 扫一遍当前注册的全部工具，按用途分组（子代理、workflow、定时任务、会话查询、MCP 服务器、语音、杂项），用真实 schema 估算每组在工具定义里占多少 token，再从本地 plugin-usage 日志统计每个工具最近 90 天被调用了几次，一张表列出组、工具数、token 与调用数。off group=<id> 经宿主的 tools.restrict() 把那组从当前 agent 的工具面折掉，on group=<id> 恢复。它只给建议、绝不自动折；核心组（shell、读、写、改、grep）和 tool_gate 自己不可折。token 数是「这组定义多占多少」的估算（正负约一成），调用数只统计本地日志里有的调用，所以刚装的 profile 在跑够一段时间之前显示为零。折叠只在本会话有效、重启即忘；没有全局注册的工具组只会被报告，折不了。'
