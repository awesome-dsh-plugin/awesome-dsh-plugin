description:
  en: "BotHub routes in the model picker: the OpenAI-compatible gateway (https://openai.bothub.chat/v1) as five sections — text, architecture, design, images and video; the key is read from BOTHUB_API_KEY in the credential store. A settings card edits each section's shortcode, creates user-defined sections as extra provider routes, and links to the developer page (author referral link, disclosed)."
