url: https://github.com/damijun/dsh-browser-automation
name: damijun/dsh-browser-automation
category: browser
description:
  en: 'Drive the DSH Desktop right-sidebar browser on Windows through playwright-cli, with a stable per-session page ID. Needs DSH started with --remote-debugging-port=0 and @playwright/cli installed globally.'
  zh: '在 Windows 的 DSH 桌面端通过 playwright-cli 驱动右侧边栏浏览器，为每个会话提供稳定的 pageId。需要用 --remote-debugging-port=0 启动 DSH，并全局安装 @playwright/cli。'
