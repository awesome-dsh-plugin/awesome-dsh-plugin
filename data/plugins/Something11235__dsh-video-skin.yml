url: https://github.com/Something11235/dsh-video-skin
name: Something11235/dsh-video-skin
category: theme
description:
  en: Uses a looping silent clip as the chat background with adjustable opacity, and plays a startup animation with sound. On first launch under a light theme it switches once to dark, with an undo prompt.
  zh: 把一段循环短片铺成聊天背景（可调透明度），启动时再播放一段有声片头动画。首次启动若为浅色主题，会一次性切到深色（附撤销提示）。
