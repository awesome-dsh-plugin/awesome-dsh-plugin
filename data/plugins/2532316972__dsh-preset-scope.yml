description:
  en: 'Preset switching and capability scoping for DeepSeek Harness, in one package: change the Agent preset of a running session from its header, and restrict which Skills and MCP servers load per workspace, per session, or globally. Combines dsh-preset-switcher and dsh-workspace-scope.'
  zh: '会话标题栏切换 Agent 预设，并按工作区、会话或全局收窄可加载的 Skill 与 MCP，两个能力合成一个包。合并自 dsh-preset-switcher 与 dsh-workspace-scope。'
