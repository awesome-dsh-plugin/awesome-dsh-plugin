url: https://github.com/yanli-nyan/dsh-open-in-app-fix
name: yanli-nyan/dsh-open-in-app-fix
category: ui
description:
  en: 'Removes the inherited ELECTRON_RUN_AS_NODE variable from the environment the open-in-app package hands to launched editors, so the desktop host''s "Open in ..." launches stop failing with HTTP 502 launch-failed; app.asar is untouched.'
  zh: '修复桌面端「用其它应用打开」启动编辑器与终端失败（HTTP 502 launch-failed）：从 open-in-app 包交给被启动程序的环境里去掉继承来的 ELECTRON_RUN_AS_NODE 变量，不改动 app.asar。'
icon: https://raw.githubusercontent.com/yanli-nyan/dsh-open-in-app-fix/main/icon.png
