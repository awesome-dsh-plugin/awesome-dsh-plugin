name: OMSociety/dsh-fishpai
category: docs
description:
  en: 'FishPai: a Markdown editor and WeChat Official Account typesetting tool with themes, interactive components, collaborative editing, and clipboard-ready HTML. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '鱼排：公众号排版与 Markdown 编辑器，支持微信 HTML、主题、交互组件、协同改稿与一键复制。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'