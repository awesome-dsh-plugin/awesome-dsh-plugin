description:
  en: 'FishPai: a WeChat Official Account typesetting and editing workbench with a professional canvas, interactive components, and human-model collaboration. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '鱼排：公众号排版与改稿工具，支持专业画布、交互组件、人与模型协同与一键复制到微信。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'