name: Eason-0712/dsh-zotero-skill
category: skill
description:
  en: "Zotero skill for DeepSeek Harness: page-anchored Q&A, full-text translation and close reading, native highlights and Chinese notes, bilingual PDF and paragraph Markdown, evidence comparison tables, and reviews with citation tracking; finds papers on OpenAlex or Crossref, imports Chinese CNKI export files, classifies the library into research-direction folders, surfaces research gaps, and runs a ranked daily digest of new papers. Python-based (basic library management uses the standard library; the reading workflow downloads its PDF/OCR components on first use); writes need a one-time Zotero authorization, and daily scheduling is Windows-only. Adapted from the OpenAI MIT Zotero plugin."
  zh: "为 DeepSeek Harness 打造的 Zotero 文献技能：原文定位问答、全文翻译与精读、原生高亮和中文批注、双语 PDF 与逐段 Markdown、论文证据对比表、综述与引用追踪；支持 OpenAlex / Crossref / 知网导出文件三种来源，按研究方向建文件夹分类、提炼脉络、发现空白，并可每日自动收录新论文。基于 Python（基础文献管理用标准库，阅读流程首次使用时下载 PDF/OCR 组件）；写入需一次性 Zotero 授权，每日定时收录仅支持 Windows。改编自 OpenAI 的 MIT Zotero 插件。"
