description:
  en: "Travel wallpaper for DeepSeek Harness: take up to three built-in or custom characters into one world, or observe without a traveler. Choose among 20 art styles, use text or multiple reference images, and generate through your own image subscription, API or local setup. Apply still images to the Windows desktop and lock screen without Wallpaper Engine; optional multi-image playback uses Wallpaper Engine. Trips include world events, a short letter from the first traveler and a browsable archive. Today/tomorrow A/B/C choices or custom directions shape the next scene. Track visits to 50 preset worlds and collect illustrated souvenirs, with new items for generated worlds. Includes daily updates, instant and scheduled blind-box trips, startup catch-up, retries and sign-in recovery. Export images or a world ZIP to your chosen folder. No other image plugin is required; the plugin provides no image quota."
  zh: "DeepSeek Harness 的旅行壁纸：最多三名默认或自定义角色结伴出行，也可不带角色观察世界。选择20种画风，使用文字或多张参考图，经自己的生图订阅、API或本地环境生成壁纸；Windows静态桌面与锁屏无需小红车，多图轮播可选小红车。每趟留下世界见闻、主角色短来信和旅行档案；今日／次日剧情支持A/B/C选择或自定义，点击继续再生效。记录50个预设世界到访进度，收集配有正式物品图的特产，动态世界可创作新收藏。提供每日更新、立即与预约盲盒旅行、启动补执行、失败重试及登录恢复，支持自定义目录导出图片和世界ZIP。无需另装生图插件，不提供生图额度。"
