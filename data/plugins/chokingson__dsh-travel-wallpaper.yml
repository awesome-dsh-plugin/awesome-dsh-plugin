description:
  en: "Travel wallpaper for DeepSeek Harness: pick one of three built-in characters (DeepSeek whale girl, GPT dragon girl, Claude young lady) or upload your own reference photo, or observe a world without any character; choose a world and one of 20 art styles, and the plugin assembles the image prompt, generates the wallpaper through your own image channel (ChatGPT or Google subscription, OpenAI-compatible API, Gemini, Volcengine Seedream, or local ComfyUI/MOSS) and applies it to the Windows desktop or lock screen. Character trips also return world events and a letter from the character, and replying to the letter shapes the next scene; observe-world trips return world events only. Every trip stays in a browsable archive with image and ZIP export. Ships daily wallpaper, instant blind-box trips and scheduled blind-box trips. Data lives in ~/.dsh/planet-news; provider credentials are read from DSH's credential store, and the plugin provides no image quota."
