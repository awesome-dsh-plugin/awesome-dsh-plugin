url: https://github.com/Daneel0001/dsh-plugin-zh-cn
name: Daneel0001/dsh-plugin-zh-cn
category: ui
description:
  en: 'Renders installed DSH plugin titles and descriptions in Simplified Chinese: at startup it translates the plugins the local JSON cache lacks through the harness LLM service, then projects { en, zh } metadata for resolveText() to render — no DOM changes, no third-party API.'
  zh: '把已安装插件的显示名与描述变成简体中文：启动时用 DSH 自带的模型服务翻译缓存尚未收录的插件，再投影 { en, zh } 元数据供 resolveText() 渲染——不改 DOM，也不调用第三方 API。'
