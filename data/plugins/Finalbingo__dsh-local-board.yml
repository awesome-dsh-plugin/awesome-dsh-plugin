url: https://github.com/Finalbingo/dsh-local-board
name: Finalbingo/dsh-local-board
category: ui
description:
  en: 'A local-first todo board for the DSH sidebar with Todo/Doing/Done columns organised by project, storing everything in one Markdown file inside a folder you pick on first run. Cards carry due dates down to the minute, a colour stripe, a private blur that hides the title until you reveal it, notes and per-project roles, and can be dragged between columns or onto another project; macOS gets a morning digest, an upcoming-due reminder and a weekly review as system notifications, all editable from an in-panel Automations tab.'
  zh: '本地优先的待办看板：左侧导航里的 Todo/Doing/Done 三列，按项目组织，所有数据都在你首次使用时自己选的文件夹里的一个 Markdown 文件中。卡片支持精确到分钟的截止时间、颜色标记、私密打码（默认遮罩，点击才显示）、备注与项目角色，可在列与项目之间拖拽；macOS 上有每日摘要、临近到期提醒和每周回顾三种系统通知，可在面板里的「自动化」标签中改时间或停用。'
