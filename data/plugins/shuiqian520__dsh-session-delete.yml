description:
  en: 'Permanently deletes one session from the sidebar session menu, or several at once through a bulk-delete dialog opened from the "..." menu beside the sidebar section title — tick sessions (running ones are refused), then confirm; log directory, workspace membership, live Host instances and the client list row are all cleaned. It also sweeps rows whose log is already gone, and retries a user message or an assistant reply from the button right of Copy.'
  zh: '在侧栏会话行的「…」菜单里永久删除单个会话;也可从侧栏标题旁的「⋯」菜单打开批量删除弹窗,勾选多个会话后确认一次删除(会话日志、工作区归属、宿主内存实例、客户端列表行一并清理);另可清理日志已不存在的残留行,用户消息与 AI 回复的复制按钮右侧各有「重试」。'
