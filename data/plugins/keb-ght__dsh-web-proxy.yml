url: https://github.com/keb-ght/dsh-web-proxy
name: keb-ght/dsh-web-proxy
category: model
description:
  en: Turn a logged-in DeepSeek web account into an OpenAI and Anthropic compatible endpoint, with tool calling, image input, an account pool and a local admin console. First use needs a one-time `node scripts/fetch-assets.mjs` in the installed plugin directory to download DeepSeek's PoW runtime from the vendor CDN; without it the proxy starts but every upstream request fails.
  zh: 把已登录的 DeepSeek 网页账号包装成 OpenAI / Anthropic 兼容接口，支持工具调用、图片输入、账号池与本地管理台。首次使用需在插件目录手动运行一次 `node scripts/fetch-assets.mjs`，从 DeepSeek 官方 CDN 拉取 PoW 运行时；未拉取时反代能启动，但所有上游请求都会失败。
