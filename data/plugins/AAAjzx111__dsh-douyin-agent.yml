name: AAAjzx111/dsh-douyin-agent
category: fun
description:
  en: "Douyin for DSH: bounded autonomous watching with storyboard frames and danmaku sampling, persona and interest memory, a daily watch report, plus direct-message auto-reply and one daily greeting for a whitelisted set of friends. This is a maintained fork of dafeiyu1314520/dsh-douyin-agent 1.4.7 that fixes follow-list read timeouts, unclickable conversations, missed replies, and greetings that stopped scheduling after a single send."
  zh: "DSH 里的抖音：限时自主观看（抽帧故事板 + 弹幕采样）、人格与兴趣记忆、观看日报，并给许可名单里的好友自动回私信、每天问候一次。本条目是基于 dafeiyu1314520/dsh-douyin-agent 1.4.7 的维护分支，修掉了关注名单读取超时、会话点不开、漏回消息、问候发一条就停等问题。"
