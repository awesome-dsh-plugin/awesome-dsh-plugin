url: https://github.com/AAAjzx111/dsh-douyin-agent
name: AAAjzx111/dsh-douyin-agent
category: fun
description:
  en: 'Douyin for DSH: bounded autonomous watching with storyboard frames and danmaku sampling, persona and interest memory, a daily watch report, plus direct-message auto-reply and one daily greeting for a whitelisted set of friends. This is a maintained fork of dafeiyu1314520/dsh-douyin-agent 1.4.7 that fixes follow-list read timeouts, unclickable conversations, missed replies, and greetings that stopped scheduling after a single send. Windows only (a dedicated Edge window, Node.js 22.13+). Replies and greetings are sent as ordinary messages with no “automated reply” label, and once you have enabled them they restart by themselves each time DSH launches until you stop them by hand. It registers the same bundle id as dafeiyu1314520/dsh-douyin-agent and LockyBee/dsh-douyin-agent, so it replaces them rather than running next to them.'
  zh: 'DSH 里的抖音：限时自主观看（抽帧故事板 + 弹幕采样）、人格与兴趣记忆、观看日报，并给许可名单里的好友自动回私信、每天问候一次。本条目是基于 dafeiyu1314520/dsh-douyin-agent 1.4.7 的维护分支，修掉了关注名单读取超时、会话点不开、漏回消息、问候发一条就停等问题。仅限 Windows（专用 Edge 窗口、Node.js 22.13+）。回复和问候以普通消息发出，不带“自动回复”标记；启用后每次 DSH 启动都会自动恢复，直到你手动停止。它和 dafeiyu1314520/dsh-douyin-agent、LockyBee/dsh-douyin-agent 注册同一个 bundle id，是替代而不是并装。'
