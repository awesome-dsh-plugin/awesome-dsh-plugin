description:
  en: 22 light-only palettes (Pantone / Chinese traditional / Morandi) and 14 composable surface effects for DeepSeek Harness, with twelve-shichen clock rotation, manual picks that lead until the next boundary, workspace binding, per-session colour marks and a nickname/avatar row whose editor lives in the settings page.
  zh: 22 套仅浅色配色（Pantone / 中国传统 / 莫兰迪）与 14 种可叠加的表面效果，含十二时辰轮换、手动选色优先到时段边界、工作区绑定、会话颜色标记，以及设置页内的昵称与内联头像编辑。
