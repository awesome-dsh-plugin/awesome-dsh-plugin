url: https://github.com/BangBang-03/dsh-client-ui-quote
name: BangBang-03/dsh-client-ui-quote
category: ui
description:
  en: 'Select text in a DSH conversation, a file preview or the terminal to quote it: the floating bar offers Comment, Add to chat and Side chat, and Alt+Q / Alt+C / Alt+B do the same three things. The quote - and its comment, kept in the same chip - is inserted as a native reference chip, and a sent quote stays one rounded capsule in the message that expands on click and can be copied. A hover card can jump back to the message a quote came from, and the right sidebar carries a quote list page that searches every quote of the session, jumps back to any of them and exports them as Markdown. Side chat writes the quote into the composer of one dsh-better-sidebar side thread per conversation without sending it, and that page can bring the thread conclusion back into the main composer or export it as a file. A sent quote can also be revised: the card puts its old comment back in the comment box, the corrected quote is sent as a new message, and the old capsule is marked as superseded (the transcript itself is append-only).'
  zh: '在 DSH 对话、文件预览或终端里选中文字即可引用：浮层提供「评论」「添加到对话」与「侧边对话」，Alt+Q / Alt+C / Alt+B 是同样的三个动作。引用以原生 reference-chip 插入输入框，评论与引用在同一颗芯片里；发送后消息里仍是一颗圆角胶囊，可点击展开、可复制，悬停卡片可「跳回原文」。右侧栏还有一个引用清单页：搜索本会话全部引用、跳回原文、导出 Markdown，底部可把侧边线程的结论带回主会话输入框或导出成文件。已发送的引用还能「改这条引用」：卡片把旧评论放回评论框，改好发出一条新引用，旧胶囊随即标「已修订」（DSH 的消息本身只追加，改不了原消息）。「侧边对话」把引用写进 dsh-better-sidebar 侧边线程的输入框（一条主会话一条线程），不替你发送。'
