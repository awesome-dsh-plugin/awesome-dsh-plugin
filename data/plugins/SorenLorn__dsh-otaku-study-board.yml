description:
  en: 'Sorchron Study Board, a study workspace plugin with pomodoro timer, task management and activity heatmap for DSH harness. Records stay in the browser''s localStorage (JSON export for backup) and the plugin makes no network requests.'
  zh: '溯时学习工作台，为DSH提供番茄计时、任务管理与学习热力图的学习工作台插件。记录只存在浏览器的 localStorage（可导出 JSON 备份），插件不发任何网络请求。'
