name: "cococo1ng/dsh-sorceress-widget#plugin"
category: ui
description:
  en: 'Sorceress — a tarot-reading witch in the bottom-right corner of the DSH Web UI, opening a panel with six tabs. Tarot covers four spreads (daily, single card, three card, ten-card Celtic Cross) with a meaning per position and upright/reversed readings for all 78 cards, plus a history replayable from its seed and a 78-card library. Divination adds a daily draw, a mood-based card, either/or, two-person card, a seven-card relationship spread, a three-minute breathing timer and a wish jar that opens on the next new or full moon, a birthday or after 30 days. The zodiac tab seeds today''s card from sign, date and moon phase and lists Mercury/Venus/Mars retrograde. The billing tab reads the host''s own usage: balance, the turn in progress, today / 7-day / all windows, peak and off-peak prices with a switch countdown, model share, and per-session and per-turn detail with search. Settings carry 5 tarot and 3 announcement sound tracks, 8 loopable ambient soundscapes, a daily-card reminder, balance and budget alerts, 18 fixed poses, 8 editable line groups, scale, corner, and export/import. The diary is password-locked and keeps period, mood and sleep entries encrypted in localStorage. Nineteen portraits, 78 card faces and 16 real sound recordings ship inline; the only network call is the account-balance lookup the host performs with your API key, and no agent tools are registered. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'Sorceress · 塔罗挂件：DSH 网页界面右下角会说话的女巫，点开是六个页签。塔罗四选一（每日 / 单张 / 三张 / 凯尔特十张），每位先讲位义再给牌，78 张逐张写正逆牌义；历史可按种子重放，另带 78 张牌库。占卜页是每日一签、按心情抽牌、二选一、双人牌、关系阵、三分钟安神呼吸，以及到下一个新月 / 满月 / 生日 / 30 天后才开箱的许愿瓶。星座页按星座加日期与真月相取今日句，并标水星金星火星逆行。计费页读宿主自己的用量：余额、进行中这一轮的实时金额、今日 / 近 7 天 / 全部、峰谷价与切档倒计时、模型占比、按会话与逐条明细（带搜索）。配置页管 5 条塔罗音轨与 3 条播报音轨、8 套可叠加环境音景、每日一牌提醒、余额与预算提醒，另有 18 张定格姿态、8 组可编辑台词、缩放、屏幕角与设置导出导入。档案页用数字密码锁，经期与情绪睡眠记录加密后存本地。19 张立绘、78 张牌面、16 路真实录音全部内联；外网只走宿主代为发起的余额查询（API key 不出宿主），不注册 agent 工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
