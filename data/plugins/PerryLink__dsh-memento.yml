url: https://github.com/PerryLink/dsh-memento
name: PerryLink/dsh-memento
category: memory
description:
  en: 'Bounded, layered, approval-gated, auditable cross-session memory: a typed `ctx.memory` seam with a zero-dependency SQLite provider, a `memory` tool, and frozen snapshot injection, plus the dsh-memory-protocol v1 rehearsal with an adapter registry and a distributable conformance suite.'
  zh: 有界、分层、带审批门、可审计的跨会话记忆：`ctx.memory` 服务 + 零依赖 SQLite 存储 + `memory` 工具与冻结快照注入，并预演 dsh-memory-protocol v1——适配器注册表与可分发的一致性套件。
  ja: 範囲を限定し、層に分け、承認を挟み、監査もできるセッション横断メモリ。型付きの `ctx.memory` 接続点、依存関係ゼロの SQLite プロバイダー、`memory` ツール、凍結スナップショットの注入に加え、アダプターレジストリと配布可能な適合テストを備えた dsh-memory-protocol v1 の試行版を含みます。
