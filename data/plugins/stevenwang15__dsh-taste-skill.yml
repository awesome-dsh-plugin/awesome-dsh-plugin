name: stevenwang15/dsh-taste-skill
category: skill
description:
  en: "Registers one native DeepSeek Harness skill, design-taste-frontend — an MIT port of tasteskill v2 — for designing, redesigning and reviewing landing pages, marketing sites, portfolios, product pages and app screens (dashboards, admin, settings, inboxes). Directions are dealt by script instead of improvised: three of 20 researched art directions, then the chosen direction's hero composition, section blueprints, type system, palette, photography set and motion entry, drawn from a library of 58 hero compositions, 185 section blueprints, 44 type systems, 56 palettes, 19 photography sets and 18 motion entries, remembering recent draws so consecutive projects do not converge. The house style is measured, not asserted — a static lint plus a real-browser inspector at 1440/768/390 checking headline lines, type, colour, rules, shadows, gradients, contrast and overflow — and the agent then iterates on its own screenshots against a juror's rubric, up to three rounds. Openly licensed photos come with title, author and licence recorded for attribution. Node 22+; Chrome/Edge/Chromium only for the visual checks, and without one it falls back to the static lint and says so."
  zh: "把一个原生技能 design-taste-frontend 注册进 DeepSeek Harness——tasteskill v2 的 MIT 移植——用来设计、重设计与评审落地页、营销站、作品集、产品页与应用界面（仪表盘、后台、设置、收件箱）。方向由脚本发牌而不是模型即兴：从 20 个研究过的艺术方向里发 3 个供选择，再按选中的方向发下首屏构图、分节蓝图、字体系统、配色、摄影参考与动效配方——它们来自含 58 种首屏构图、185 条分节蓝图、44 套字体系统、56 套配色、19 组摄影参考与 18 条动效配方的库——并记住最近用过的方向，连续项目不会趋同。硬规范靠测量而非声明——静态 lint 加真浏览器检查器，在 1440/768/390 三档量标题行数、字号、颜色、分割线、阴影、渐变、对比度与溢出——然后按评委评分表对着自己的截图返工，最多三轮。开放许可照片会记录标题、作者与许可证用于署名。需要 Node 22+；Chrome/Edge/Chromium 只用于视觉检查，没有时降级到静态 lint 并在报告里说明。"
