url: https://github.com/yicun0316/dsh-claude-slider
name: yicun0316/dsh-claude-slider
category: ui
description:
  en: 'Replaces the reasoning-effort dropdown with a liquid-glass direct-drag slider featuring 9 Canvas themes (Milky Way, Crystal Ice, Polar Day, Rainy Window, Glass Mercury, Sakura Flutter, Flower Garden, GPT Starlight, Claude Mosaic) that scale across Off/Low/High/Max. Includes a Monet dynamic color engine with a cursor-reactive prism/Monet composer glow border, a 60fps pixel pet theater perched above the composer (6 selectable pets that stroll, tussle, sway during thinking, and celebrate on completion), custom character figure/avatar handles with auto-trim, and 5 snap sounds plus local audio upload; zero build and zero network requests.'
  zh: '把推理强度下拉框换成液态玻璃「直接拖」滑块，内置 9 款 Canvas 动效（银河星穹、冰晶凝霜、极昼晴空、雨夜灯窗、玻璃水银、落樱春水、繁花盛放、GPT 星流、Claude 织格），随档位逐阶递进。带莫奈动态取色与随鼠流光输入框边框、可多只同屏的 60fps 输入框像素萌宠剧场（6 只内置萌宠，支持散步、相遇打架、推理起风晃动与完工撒花）、支持自动裁边的立绘/圆头游标以及 5 款内置与自定义音效；零构建、零网络请求。'
