url: https://github.com/Jessicaisleep/dsh-source-inbox
name: Jessicaisleep/dsh-source-inbox
category: memory
description:
  en: 'Archives your own material from 27 platforms into one local knowledge base. Every row carries an official entry link where one exists (20 of 27) and guidance for what to do after the login page (84 steps across all 27 rows). 8 rows take a pasted credential in a box that the plugin itself writes to $DSH_HOME/_secrets, showing only a masked preview afterwards. 7 rows (11 pages) are read directly by a controlled browser the plugin launches with its own profile over CDP, so a logged-in page such as the Douyin creator centre can be archived without copy-paste; a page that is still a login wall is reported and never archived. Capabilities that other tools usually supply by asking you to install a package are built in instead, with zero third-party dependencies: link-to-Markdown with an https/private-network gate that re-checks the URL after redirects, WeRead highlight export, Cubox sync, and an IMAP client that uses BODY.PEEK so your mail is never marked read. Text is stored on disk, large media is kept as a pointer with a text shadow, every record is indexed with a unified schema and can be deleted again. Registers 17 agent tools. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把你自己各平台账号的资料汇聚进本地知识库。27 条数据源中，有官方入口的 20 条带一键跳转按钮，27 条全部带「登录之后怎么做」的分步引导（共 84 步）。8 条源提供凭据粘贴框，保存由插件写进 $DSH_HOME/_secrets，之后只回显打码预览。7 条源共 11 个页面可由插件自己启动的受控浏览器读取——独立 profile、走 CDP，抖音创作者中心这类已登录页面不用再复制粘贴；读到的仍是登录墙会如实报告且不归档。别的工具通常要你装个包才有的能力，这里全部实现在插件本体、零第三方依赖：链接转 Markdown（仅 https、拒内网、重定向后复查地址）、微信读书划线导出、Cubox 收藏同步，以及用 BODY.PEEK 收信因此不会把你的邮件标成已读的 IMAP 客户端。文字资料落盘，大素材只存指针并生成文字影子，归档记录按统一 schema 索引，每条都能撤回删除。注册 17 个模型工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
