url: https://github.com/lucky01222/dsh-workbench-theme
name: lucky01222/dsh-workbench-theme
category: theme
description:
  en: Light/dark colour theme for the DSH web UI with an APTX capsule logo, browser tab title and icon branding, and optional Ai Haibara (Detective Conan) artwork panels, configured under Settings → General → Appearance with a no-decoration mode.
  zh: DSH Web 明暗配色主题：APTX 胶囊标志、浏览器标签标题与图标、可选的灰原哀（名侦探柯南）展示素材，在「设置 → 通用 → 外观」中配置，可选无装饰模式。
