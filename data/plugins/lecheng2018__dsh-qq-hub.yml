name: lecheng2018/dsh-qq-hub
category: notify
description:
  en: 'QQ hub for DeepSeek Harness: private and group chats over OneBot v11 (SnowLuma/NapCat), with per-chat scoped memory, per-chat persona routing, a vision helper that narrates images for text-only models, multi-platform link parsing (videos and galleries sent as files) and a web panel for models, personas and settings.'
  zh: '把 QQ 接入 DeepSeek Harness：经 OneBot v11（SnowLuma / NapCat）接私聊与群聊，按会话隔离记忆、按会话分流人格，文本模型收图时由辅助模型转述，多平台链接解析（视频与图集以文件发出），并提供网页管理面板。'
