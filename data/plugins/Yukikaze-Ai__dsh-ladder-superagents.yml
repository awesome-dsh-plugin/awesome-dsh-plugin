url: https://github.com/Yukikaze-Ai/dsh-ladder-superagents
name: Yukikaze-Ai/dsh-ladder-superagents
category: agi
description:
  en: 'Ranks models in a ten-slot ladder, routes each subagent by a 1-10 difficulty, and falls back a tier when one fails. Windows only; applies to sessions that opt in. Subagents can also launch local agent CLIs (Codex verified, nine others experimental), and a subagent granted full authority runs its CLI with --dangerously-skip-permissions, --yolo or --force. Run records go to .dsh-supa/ in the workspace.'
  zh: '把模型排成十档阶梯，按 1–10 的难度给子代理选档，失败自动降一档。仅支持 Windows，按会话选择启用。子代理还可以启动本机的 agent CLI（Codex 已验证，另有 9 个为实验性），被授予完全权限的子代理会给其 CLI 加 --dangerously-skip-permissions、--yolo 或 --force。运行记录写在工作区的 .dsh-supa/ 里。'