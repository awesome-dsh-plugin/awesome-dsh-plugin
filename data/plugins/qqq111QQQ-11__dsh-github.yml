description:
  en: 'GitHub client inside DeepSeek Harness: official OAuth device-flow sign-in, then browse your repositories, stars, notifications and issues/pull requests without leaving the app. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DeepSeek Harness 里使用 GitHub：官方 OAuth 设备授权登录，之后直接浏览仓库、收藏、通知与议题／拉取请求。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
