url: https://github.com/luoshuizhiwei/dsh-desktop-restart
name: luoshuizhiwei/dsh-desktop-restart
category: dev
description:
  en: 'Restart the whole DeepSeek Harness desktop app from five entry points (sidebar panel, sidebar footer, conversation title bar, /restart-desktop slash command, settings row) through a detached helper that ends and relaunches the Electron main process, instead of only restarting the dsh web process. It hard-blocks a restart while a plugin install/update is running and pnpm is still alive, sweeps the change snapshots DSH leaves behind in the system temp directory, and hides the easy-to-misclick feedback item in the account menu. Desktop only; on dsh web the status route reports desktop: false and the button is disabled.'
  zh: '从五个入口（侧栏面板、侧栏底部、会话标题栏、/restart-desktop 斜杠命令、设置页）经分离的 helper 结束并重新拉起 Electron 主进程，重启整个 DeepSeek Harness 桌面应用，而不是只重启 dsh web 进程；插件正在安装/更新且 pnpm 还活着时硬拦重启，清理 DSH 漏在系统临时目录里的改动快照，并藏掉账号菜单里容易误点的「意见反馈」。仅适用于桌面版；在 dsh web 上状态路由如实报告 desktop: false 并禁用按钮。'
