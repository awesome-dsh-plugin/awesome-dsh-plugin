url: https://github.com/bingomu/dsh-usage-printer
name: bingomu/dsh-usage-printer
category: usage
description:
  en: Sidebar receipt printer for DeepSeek balance — a dot-matrix screen shows the remaining balance as a percentage with the peak/off-peak price band, and a receipt slides out on hover with balance, spend and per-token prices.
  zh: 侧栏小票机：点阵屏用百分比显示余额水位与峰谷价格带，鼠标悬停时从槽口送出一张明细小票（余额、已充值、今日/本月花费、单价）。
