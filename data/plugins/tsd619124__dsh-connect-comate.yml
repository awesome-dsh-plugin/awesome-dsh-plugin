description:
  en: Registers the Comate (Zulu) models of a locally signed-in Comate CLI as a DSH provider, supervising a loopback `zulu serve` and translating its SSE into the DSH stream. A Settings section trims the model picker to the models you tick, and a `comate_usage` tool reports the daily credit, which public SaaS accounts return no figure for.
  zh: 把本机已登录的 Comate CLI（Zulu）模型注册成 DSH 的 provider，监管一个仅回环的 `zulu serve` 并把它的 SSE 转成 DSH 流。设置页可以把模型选择器收窄到勾选的那几个，`comate_usage` 工具查询每日积分——公有云 SaaS 账号查不到数字。
