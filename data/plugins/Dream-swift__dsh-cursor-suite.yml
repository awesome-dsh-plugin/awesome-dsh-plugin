url: https://github.com/Dream-swift/dsh-cursor-suite
name: Dream-swift/dsh-cursor-suite
category: model
description:
  en: 'Cursor subscription plus a read_image vision bridge for DeepSeek Harness: browser PKCE sign-in, model discovery, DSH-local tools, and image reading when the Cursor route drops pixels. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DeepSeek Harness 中接入 Cursor 订阅，并附带 read_image 视觉桥：浏览器 PKCE 登录、模型发现、DSH 本地工具，以及 Cursor 路由丢弃像素时的读图能力。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
