url: https://github.com/patrick1099/dsh-claude-plugin-loader
name: patrick1099/dsh-claude-plugin-loader
category: dev
description:
  en: 'Loads Claude-style plugins into DeepSeek Harness (dsh): exposes their skills and slash commands, and bridges plugin hooks to dsh events (session start, prompt submit, pre/post tool with deny, turn stop via steer, session end), synthesizing a Claude transcript so Stop-style document gates work, with hot command reload and a hook execution log.'
  zh: '把 Claude 风格插件加载进 DeepSeek Harness（dsh）：接入插件的 skills 与斜杠命令，并把插件 hooks 桥接到 dsh 事件（会话开始、用户提交、工具前/后含拒绝、回合收工用 steer 拦截、会话结束），合成 Claude 会话记录让 Stop 类文档闸可用，含命令热更新与 hook 执行日志。'
