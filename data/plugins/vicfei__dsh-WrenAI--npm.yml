url: https://github.com/vicfei/dsh-WrenAI
name: vicfei/dsh-WrenAI
category: tools
description:
  en: 'Self-hosted semantic layer for DSH - ask data questions in natural language and every number comes back with its metric caliber attached (the line between governed analytics and raw text-to-SQL). Single-SELECT guard with self-heal SQL; SQLite, PostgreSQL (zero-dependency stdlib wire client) or DuckDB execution; a zero-config --weknora bridge; a model lifecycle (--bootstrap emits a skeleton from the live catalog, --check drift-accounts it, exit 1 on drift); caliber accountability (versioned calibers, a deterministic --calibers alarm that exits 1 on an edit-in-place, an append-only ask ledger and --replay that re-runs a recorded SQL and reports what moved - cells and caliber versions side by side); WrenAI MDL files import in place; typed tools (wren_ask and friends) in the npm package.'
  zh: '自托管语义层：自然语言问数，数字带着指标口径一起回来（受治理问数与裸 text-to-SQL 的分界线）。单条 SELECT 护栏+自愈重试；SQLite/PostgreSQL（零依赖 stdlib wire 客户端）/DuckDB 三后端；零配置 --weknora 桥；模型生命周期（--bootstrap 从活目录起骨架、--check 漂移对账、漂移即 exit 1）；口径可问责（版本化口径、--calibers 告警对原地改动 exit 1、只增不改的问数台账、--replay 重放记录的 SQL 并对比变化——单元格与口径版本并排看）；WrenAI MDL 文件原地导入；npm 包内含 typed tools（wren_ask 等）。'
