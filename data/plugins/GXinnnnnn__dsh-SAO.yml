description:
  en: "Sword Art Online theme with native Link Start, Kirito/Asuna voices and NerveGear audio; responsive wide/portrait layouts and full or startup-only mode; separate light/dark accents, system-default or user-selected local fonts; liquid/frosted glass with 50% default conversation-surface transparency and independent composer materials, each remembering its transparency (20% by default); rounded question choices, custom answers, themed settings and sidebar file/change/task UI; nine wallpapers, local images or looping video, power saving, and a model reasoning-intensity slider."
  zh: "刀剑神域主题：原生 Link Start、桐人／亚丝娜语音与 NerveGear 音效，支持宽屏、竖屏和窗口缩放，可选全部功能或仅启动动画；明暗主题色独立记忆、系统默认字体与本机字体选择；液态／磨砂玻璃，会话液态表面默认透明度 50%，输入框两种材质及透明度独立设置并分别记忆，默认均 20%；圆角提问选项、自定义回答、设置与右栏文件／变更／任务等 GUI 适配；九张壁纸、本地图片或循环视频及静态省电；模型思考强度滑条与单项重置。"
