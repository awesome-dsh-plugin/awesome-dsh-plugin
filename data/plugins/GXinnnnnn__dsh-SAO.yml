  en: 'SAO (Sword Art Online) theme for DeepSeek Harness: a Link Start startup animation rendered ahead of the app shell, with Kirito/Asuna voice lines, plus theme and surface colours, liquid or frosted glass, per-component transparency, nine built-in or uploaded wallpapers, and a model-intensity slider.'
