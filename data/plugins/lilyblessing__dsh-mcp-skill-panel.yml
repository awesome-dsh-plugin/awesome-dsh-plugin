url: https://github.com/lilyblessing/dsh-mcp-skill-panel
name: lilyblessing/dsh-mcp-skill-panel
category: ui
description:
  en: 'MCP & Skill manager: enable/disable MCP servers and skills from a Settings panel to free context in real time; optional AI middle layer (mcp_search/mcp_call) calls disabled servers on demand, with state-based visibility filtering that keeps user-enabled servers visible.'
  zh: 'MCP 与技能管理面板：设置页面板实时启停 MCP 服务器与 Skill 释放上下文占用；可选 AI 中间层（mcp_search/mcp_call）按需调用停用服务器，按 server 状态过滤模型可见性（用户打开的保持可见）。'
  ja: MCP とスキルの管理。設定パネルから MCP サーバーとスキルを有効化/無効化して、その場でコンテキストを空けられます。任意の AI 中間層（mcp_search/mcp_call）が無効なサーバーも必要に応じて呼び出し、状態に応じた表示の絞り込みでユーザーが有効にしたサーバーは常に見えるようにします。
