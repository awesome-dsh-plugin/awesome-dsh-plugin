description:
  en: Right-click a session in the left session list to choose one of eight gradient washes or three hand-drawn line patterns; the last blank row clears it.
  zh: 右键左侧会话列表中的会话，选择八档渐变或三个手绘线条图案（星星、猫、狗）；最后一条空白条清除。
