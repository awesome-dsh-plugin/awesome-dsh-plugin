description:
  en: "Mistake journal plugin: records pitfalls, root causes, fixes and prevention rules and pins them into the system prompt, with add, list, fix and delete tools, so the same mistake never happens twice."
  zh: "错题本插件：把踩过的坑、根因、解法与预防守则记账并钉进提示词，配记错、查错、改账与删账工具，同样的错不犯第二遍。"
