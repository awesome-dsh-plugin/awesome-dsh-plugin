name: weseeon/dsh-session-topics
category: session
description:
  en: 'LLM-organized topic navigation for a conversation: jump to a topic, return to the latest turn, keep talking from an older thread, and search topics across sessions by keyword or meaning. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把会话整理成可导航的主题列表：跳到某个主题、一键回到最新、从旧话题继续讨论，并跨会话按关键词或语意搜索主题。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
