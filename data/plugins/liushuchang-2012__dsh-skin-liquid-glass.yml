name: liushuchang-2012/dsh-skin-liquid-glass
category: theme
description:
  en: 'iOS 26 liquid-glass skin: one white-grey-blue fog field behind the whole window, a single 40px frost on top of it, a floating glass sidebar and reply bubbles. Light and dark palettes, no photo wallpaper, no dependencies (33 KB).'
  zh: 'iOS 26 液态玻璃皮肤：整窗共用一层白→灰→淡蓝的静态雾场，雾上只磨一次（blur 40px），左侧栏是悬浮玻璃卡，回复是一条气泡；浅深两套配色，不用照片壁纸，零依赖（33 KB）。'