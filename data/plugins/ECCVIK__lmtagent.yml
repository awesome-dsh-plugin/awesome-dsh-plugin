description:
  en: 'Multi-agent software engineering and security audit workflow with 8 role presets (Captain, CEO, Designer, Eng Manager, Reviewer/CSO, Builder, QA Lead, Release), 4-Wave DAG scheduling across 6 default concurrency slots (1-12), PostgreSQL Wire Protocol v3 + SQLite WAL fact store, 29 skills, and a docked right-panel web console.'
  zh: '软件研发与安全审计多智能体工作流：内置 8 个角色预设（Captain 主控与 CEO、Designer、Eng Manager、Reviewer/CSO、Builder、QA Lead、Release 七个执行预设）、默认 6 并发槽（1-12 可调）的 4-Wave DAG 调度、PostgreSQL Wire v3 与 SQLite WAL 双模事实库、29 个随包技能及右侧常驻 Web 控制台。'
