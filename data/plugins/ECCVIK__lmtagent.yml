url: https://github.com/ECCVIK/lmtagent
name: ECCVIK/lmtagent
category: workflow
description:
  en: 'Multi-agent software engineering and security audit workflow with 8 role presets (Captain, CEO, Designer, Eng Manager, Reviewer/CSO, Builder, QA Lead, Release), 4-Wave DAG scheduling across 6 default concurrency slots (1-12), PostgreSQL Wire Protocol v3 + SQLite WAL fact store, 29 skills, and a docked right-panel web console. A fork of Jueze-2019/dsh-redteam-mode that keeps its package name, mount ids and redteam_* tool names, so the two cannot be installed together. The fact store uses PostgreSQL when REDTEAM_PG_URL, DSH_PG_URL, DATABASE_URL or PGHOST is set in the environment and a local SQLite file under $DSH_HOME/redteam otherwise; role presets are written to $DSH_HOME/.agent-presets/redteam.'
  zh: '软件研发与安全审计多智能体工作流：内置 8 个角色预设（Captain 主控与 CEO、Designer、Eng Manager、Reviewer/CSO、Builder、QA Lead、Release 七个执行预设）、默认 6 并发槽（1-12 可调）的 4-Wave DAG 调度、PostgreSQL Wire v3 与 SQLite WAL 双模事实库、29 个随包技能及右侧常驻 Web 控制台。是 Jueze-2019/dsh-redteam-mode 的分支，沿用其包名、挂载 id 与 redteam_* 工具名，不能与原版同时安装。环境变量里设了 REDTEAM_PG_URL、DSH_PG_URL、DATABASE_URL 或 PGHOST 时事实库用 PostgreSQL，否则用 $DSH_HOME/redteam 下的本地 SQLite；角色预设写入 $DSH_HOME/.agent-presets/redteam。'
