description:
  en: 'Usage and balance dock for the DeepSeek Harness sidebar: today''s spend next to a Beijing-time peak/off-peak pricing band, today''s tokens and cache hit rate, and a plain balance row that opens a detail panel. The panel lists the balance account, an eight-week activity heatmap where any day can be selected, and that day''s tokens, cache hit rate, peak/off-peak cost and per-session breakdown with each session''s own composition bar. Usage is read from the local session logs only; the only outbound request is the balance query against the provider base URL already configured in DSH.'
  zh: 'DeepSeek Harness 侧栏的用量与余额悬浮卡：今日花费配北京时间峰谷计价带、今日用量与缓存命中率，以及一行余额入口。面板里有余额账户明细、近八周活跃热力图（可点选任意一天），以及当天的用量、命中率、峰谷费用和按会话拆分的明细（每个会话带自己的成分条）。用量只读本机会话日志；唯一的对外请求是用 DSH 里已配置的供应商 base URL 查询余额。'
