url: https://github.com/Natasha123-bit/dsh-vibrancy-skin
name: Natasha123-bit/dsh-vibrancy-skin
category: theme
description:
  en: 'macOS-only frosted-glass skin for the DSH NEXT / DSH Desktop conversation pane and third-party sidebars: native vibrancy material, independent switches per level, an optional wallpaper backdrop with adjustable frost, and a Settings section; background material only, no layout changes.'
  zh: 'macOS 专用磨砂玻璃皮肤：给 DSH NEXT / DSH Desktop 的会话面板与第三方侧边栏套上原生 Vibrancy 材质，两级效果各自独立开关，可选壁纸底图并调节磨砂度，附设置页；只改背景材质，不动布局。'
