name: fangqiuci/dsh-doubao-video
category: workflow
tarball: https://registry.npmjs.org/dsh-doubao-video/-/dsh-doubao-video-0.1.4.tgz
description:
  zh: "豆包视频工坊：把分镜脚本做成成片的全流程闸门。风格锁定、分镜机检、角色卡与参考图分离、首尾帧衔接、片段去重；支持多模型时长上限（Mini/Fast ≤10s、2.0 ≤15s、2.5 ≤30s），配 ffmpeg 做取帧、拼接、字幕与语音合成。"
  en: "Doubao video workshop: a gated pipeline from storyboard to finished cut. Locked art direction, shot validation, character-card vs reference-image separation, first/last-frame continuity and clip dedup; model-aware duration caps (Mini/Fast 10s, 2.0 15s, 2.5 30s), with ffmpeg for frame extraction, concatenation, subtitles and TTS."
