name: Yuanqs-pine/DSH-Transparent-Frosted
category: theme
description:
  en: '(UI enhancement) Frosted-glass background for the whole app: one slider blends from a genuinely blurred, milky frost to a fully transparent page, and every region, control and expanded page moves as a single sheet painted on body::before; the settings page has its own independent slider, and an optional whale particle overlay reacts to the pointer. In a browser the plugin paints its own dark backdrop behind the frost. On the desktop the effect is painted on the app window itself: the dsh Windows window has never been transparent (only macOS gets a vibrancy window), so on Windows the page shows the window background instead of your wallpaper, while macOS keeps the native transparent window. Works on every dsh version (checked up to 0.2.2-alpha.3).'
  zh: '（UI 增强）整页磨砂背景：一条滑杆从真实模糊的磨砂过渡到完全透明，所有区域、组件与展开面板作为画在 body::before 上的同一张纸一起变化；设置页有独立滑杆，另有可选的鲸鱼粒子图层，随鼠标推开与拖动。浏览器里插件会自绘一层深色背景垫在磨砂之下。桌面端的效果直接画在应用窗口上：dsh 的 Windows 主窗口历来不透明（只有 macOS 才有 vibrancy 透明窗口），所以 Windows 上看到的是窗口自身的底色而不是你的壁纸，macOS 则仍是原生透明窗口。适用于所有 dsh 版本（已核对到 0.2.2-alpha.3）。'
tarball: https://github.com/Yuanqs-pine/DSH-Transparent-Frosted/releases/download/v1.0.2/dsh-transparent-frosted-1.0.2.tgz
