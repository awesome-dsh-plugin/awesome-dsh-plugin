name: Yuanqs-pine/DSH-Transparent-Frosted
category: theme
description:
  en: '(UI enhancement) Frosted-glass background for the whole app: one slider blends from a genuinely blurred, milky frost to a fully transparent page, and every region, control and expanded page moves as a single sheet painted on body::before; the settings page has its own independent slider, and an optional whale particle overlay reacts to the pointer. Because the dsh desktop window on Windows has never been transparent (only macOS gets a vibrancy window), the plugin paints its own backdrop there: pick any picture and the page reads as see-through, with the same blur and transparency sliders still working. Compatibility: all dsh versions — the theme is pure CSS and works everywhere, but the dsh Windows desktop window is opaque in every release (verified up to 0.2.2-alpha.3), so on Windows the backdrop is the picture you pick instead of your real wallpaper; macOS keeps the native transparent window.'
  zh: '（UI 增强）整页磨砂背景：一条滑杆从真实模糊的磨砂过渡到完全透明，所有区域、组件与展开面板作为画在 body::before 上的同一张纸一起变化；设置页有独立滑杆，另有可选的鲸鱼粒子图层，随鼠标推开与拖动。由于 dsh 的 Windows 桌面端主窗口历来不透明（只有 macOS 才有 vibrancy 透明窗口），插件在 Windows 上会自绘背景：选一张图片，页面就"透出"它，模糊与透明滑杆依旧完全生效。兼容性：适用于所有 dsh 版本——主题是纯 CSS，在哪里都能用；但 Windows 桌面端主窗口在所有版本里都不透明（已核对到 0.2.2-alpha.3），所以 Windows 上的"透出"是你选的图片，而不是真实桌面壁纸；macOS 仍是原生透明窗口。'
