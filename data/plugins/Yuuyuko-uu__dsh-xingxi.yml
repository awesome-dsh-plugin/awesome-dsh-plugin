url: https://github.com/Yuuyuko-uu/dsh-xingxi
name: Yuuyuko-uu/dsh-xingxi
category: memory
description:
  en: Turns an organised memory archive into a browsable star map — one star per memory, the diary as an outer timeline, plus a chapter view, a day view, and a picking task that files each day's raw conversation into the archive.
  zh: 把整理好的记忆档案铺成一张能点的星图——一条记忆一颗星，日记在外圈排成时间星带，另有星册、星历，以及把每天的原始对话收进档案的「拾星」。
