description:
  en: "Math-modeling contest workbench for DeepSeek Harness: a sidebar P0–P7 progress board and traceable facts ledger, one-click render/check/layout/compile, PDF preview, and human sign-off; paired with the math-modeling-cumcm skill. Requires the math-modeling-cumcm skill's scripts (set skillDir), Python 3.10+ and XeLaTeX with ctex/xeCJK; fully verified only on Windows 11 + MiKTeX."
  zh: "国赛论文工作台：侧栏展示 P0–P7 进度与可追溯的 facts 台账，一键执行 render/check/layout/编译，预览 PDF，并支持人工签字；配套 math-modeling-cumcm skill。需配置该技能的脚本（skillDir）、Python 3.10+ 与 XeLaTeX + ctex/xeCJK 环境，目前仅在 Windows 11 + MiKTeX 完整实测。"
