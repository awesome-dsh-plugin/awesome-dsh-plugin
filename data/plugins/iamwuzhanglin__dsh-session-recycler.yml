description:
  en: "Delete a conversation record from the DeepSeek Harness Web UI, with a trash bin to restore or purge it. Both this and zhezhi33/dsh-session-recycler install under the package name dsh-session-recycler, so install only one of them."
  zh: "在 DeepSeek Harness 网页界面里真正删除会话记录：带可恢复、可彻底清除的回收站。本插件与 zhezhi33/dsh-session-recycler 安装后的包名同为 dsh-session-recycler，请只装其中一个。"
