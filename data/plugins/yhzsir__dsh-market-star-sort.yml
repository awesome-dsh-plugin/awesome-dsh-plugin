description:
  en: 'Adds a Stars order to the plugin Discover tab, ranking entries by GitHub star counts taken from the market index site public catalog. Ships a star snapshot so the order works offline from the first launch, then refreshes it daily in the background. The daily refresh downloads the roughly 6 MB catalog.json from awesome-dsh-plugin.com, and the plugin wraps the host''s global fetch to add the star sort key to the market index responses.'
  zh: '在「插件 → 发现」的排序菜单里增加「Star 数」，按市场索引站点公开目录中的 GitHub Star 数从高到低排序。随包带一份星标快照，首次启动即可离线排序，之后每天在后台刷新。每天的刷新会从 awesome-dsh-plugin.com 下载约 6 MB 的 catalog.json，插件还会包装宿主的全局 fetch，给市场索引的响应补上 Star 排序键。'