description:
  en: 'Electron browser that splits a web walkthrough into a Stage window for the audience and a hidden Recorder that produces 1080p30 video with evidence files over CDP, without forking the browser engine. Demo flows are scripted as scene.yaml packages (a report-review example ships in fixtures/scenes) driven from a Director console plus a loopback control API on 127.0.0.1:7317; headless recording shows no window, takes no focus and stays out of the Dock, so the machine stays usable while recording. Requires Node 22.12 or newer.'
  zh: 'Electron 演示浏览器：把网页演示拆成给观众看的 Stage 与隐藏录制的 Recorder（CDP 抓帧、1080p30 出片、证据文件），不 fork 浏览器内核；演示流程编排成 scene.yaml 场景包（fixtures/scenes 自带信审复核示例），由 Director 控制台与 127.0.0.1:7317 本地控制 API 驱动。无头录制不显示窗口、不抢焦点、不占 Dock，录制期间电脑照常可用。要求 Node 22.12 或更新。'
