url: https://github.com/Lumos-789/malo-browser
name: Lumos-789/malo-browser
category: browser
description:
  en: 'Electron browser with two faces. For agents it is a runtime: a daemon hands out port leases so several agents drive isolated, profile-backed sessions (24 session tools — navigate, act, observe, screenshot, batch runs — plus network_capture/responses for reading XHR/fetch bodies through a real browser), and it needs no window. For demos it splits a web walkthrough into a Stage window for the audience and a hidden Recorder that produces 1080p30 video with evidence files over CDP, without forking the browser engine; flows are scripted as scene.yaml packages driven from a Director console plus a loopback control API on 127.0.0.1:7317; headless recording shows no window, takes no focus and stays out of the Dock. Requires Node 22.12 or newer.'
  zh: 'Electron 浏览器，两种形态。对 agent 是运行时：守护进程按端口发放租约，多个 agent 可同时驱动隔离且可复用登录态的 session（24 个 session 工具——导航、交互、观察、截图、批量执行——外加 network_capture/responses，用真浏览器取 XHR/fetch 响应体），全程不需要窗口。对演示是舞台：把网页演示拆成给观众看的 Stage 与隐藏录制的 Recorder（CDP 抓帧、1080p30 出片、证据文件），不 fork 浏览器内核；流程编排成 scene.yaml 场景包，由 Director 控制台与 127.0.0.1:7317 本地控制 API 驱动；无头录制不显示窗口、不抢焦点、不占 Dock。要求 Node 22.12 或更新。'
