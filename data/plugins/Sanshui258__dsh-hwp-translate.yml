url: https://github.com/Sanshui258/dsh-hwp-translate
name: Sanshui258/dsh-hwp-translate
category: docs
description:
  en: 'Translates .hwp/.hwpx (Hangul) and .docx documents into Chinese, keeping tables, bullets, indentation and font size, and writes the result beside the original as *_zh. hwp_extract returns the document segments as JSON (50 per page by default, 200 max, next_offset for pagination); hwp_apply takes {segment id: translation} and returns the output path with applied and missing counts. Translation is done by the calling session model, so these two tools need no API key; a legacy hwp_translate is kept for callers that want the bundled translator to call an API with their own key. Windows only: .hwpx and .docx are parsed in pure Python, while legacy .hwp drives the installed Hangul over COM and requires allow_hangul.'
  zh: '把 .hwp/.hwpx（한글）与 .docx 文档翻成中文，保留表格、项目符号、缩进与字号，译文写在原文件旁（原名_zh）。hwp_extract 返回文档段落 JSON（默认每页 50 段、上限 200，用 next_offset 分页）；hwp_apply 按 {段落 id: 译文} 写回，返回输出路径与 applied/missing。翻译由调用方会话模型完成，这两个工具不需要 API Key；另保留旧接口 hwp_translate，供希望由随包翻译器自带 Key 调 API 的调用方使用。仅 Windows：.hwpx 与 .docx 纯 Python 解析，旧版 .hwp 通过 COM 驱动本机 한글，需要 allow_hangul。'
icon: https://raw.githubusercontent.com/Sanshui258/dsh-hwp-translate/main/icon.png
