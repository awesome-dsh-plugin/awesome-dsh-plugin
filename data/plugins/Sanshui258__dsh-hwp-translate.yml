name: Sanshui258/dsh-hwp-translate
category: docs
description:
  en: 'Works with .hwp/.hwpx (Hangul) and .docx: translate into the language the session model writes (Chinese is the common case, Korean to English works the same way), read a document as plain text without writing anything, or convert .hwp/.hwpx to Word .docx through Hangul''s own OOXML export. Four offline tools: hwp_extract returns segments as JSON (50 per page by default, 200 max, next_offset for pagination); hwp_read returns readable text with a character budget and next_offset; hwp_apply takes {segment id: translation} and returns the output path with applied and missing counts; hwp_to_word writes <stem>_word.docx beside the original. Translation must come from the calling session model: the plugin never calls an API and accepts no API key, and its bundled 10 MB translator only reads, writes and converts locally. Windows only: .hwpx and .docx are parsed in pure Python, while legacy .hwp and the Word conversion drive the installed Hangul over COM and require allow_hangul.'
  zh: '处理 .hwp/.hwpx（한글）与 .docx：翻成会话模型能写的语言（中文最常见，韩转英、英转韩同理）、纯阅读成整篇文本（不写文件）、或经 한글 自带的 OOXML 导出转成 Word .docx。四个离线工具：hwp_extract 返回段落 JSON（默认每页 50 段、上限 200，用 next_offset 分页）；hwp_read 按字符预算返回可读文本与 next_offset；hwp_apply 按 {段落 id: 译文} 写回，返回输出路径与 applied/missing；hwp_to_word 在原件旁写 <原名>_word.docx。译文必须由调用方会话模型提供：插件不访问任何 API、也不接受 API Key；随包的 10 MB 翻译器只在本地读写与转换。仅 Windows：.hwpx 与 .docx 纯 Python 解析，旧版 .hwp 与转 Word 通过 COM 驱动本机 한글，需要 allow_hangul。'
