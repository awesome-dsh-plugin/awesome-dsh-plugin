url: https://github.com/Sanshui258/dsh-hwp-translate
name: Sanshui258/dsh-hwp-translate
category: docs
description:
  en: 'Translates .hwp/.hwpx (Hangul) and .docx documents into Chinese while keeping tables, bullets and indentation. Registers two offline tools: hwp_extract returns the document segments as JSON, and hwp_apply writes {segment id: translation} back and returns the output path. Legacy .hwp is converted to .hwpx with the locally installed Hangul and converted back on write, in a subprocess with a 120s timeout; .hwpx needs no such dependency. Translation is done by the session model, so no API key is needed. Failures return a structured {code, hint, error} object. Windows only.'
  zh: '把 .hwp/.hwpx（한글）与 .docx 翻成中文，保留表格、项目符号与缩进。注册两个离线工具：hwp_extract 返回段落 JSON，hwp_apply 按 {段落 id: 译文} 写回并返回输出路径。旧版 .hwp 会用本机 한글 自动转成 .hwpx，写回时再转回 .hwp（子进程执行、120 秒超时）；.hwpx 无此依赖。翻译由会话模型完成，不需要 API Key。失败返回结构化 {code, hint, error}。仅 Windows。'
icon: https://raw.githubusercontent.com/Sanshui258/dsh-hwp-translate/main/icon.png
