url: https://github.com/loyalchiiina/dsh-font-enhancer
name: loyalchiiina/dsh-font-enhancer
category: ui
description:
  en: 'DIY the DSH UI typography and colours: 10 built-in regions plus box-select region creation, each with its own Chinese and English font, size, line-height, weight (100-900), italic switch and text colour picker; 18 Chinese and 18 English fonts ship in the pickers, every region can be overridden by one unified setting, and named theme presets can be saved, applied, renamed and deleted. Random font assignment and random colour generation work for the whole UI or per region, and 8 fonts (LXGW WenKai, Smiley Sans, ZCOOL KuaiLe, Comic Neue, Baloo 2, Fredoka, Nunito, Caveat) can be downloaded and installed with one click (only Comic Neue ships in the package) alongside your own .ttf/.otf files, with a factory-default reset that restores the shipped palette. A 字 floating ball opens the panel, which carries a collapsible quick-start guide, and position and settings persist across restarts. The ball is shown or hidden from the DSH settings floating-ball section together with the other two balls, which share one 130-skin catalogue with a per-ball sync switch.'
  zh: 'DIY 你的 DSH 界面字体与颜色：10 个内置区域 + 框选建区，每区域独立设中英文字体、字号、行距、字重（100–900）、斜体开关与文字颜色取色器；内置 18 款中文字体与 18 款英文字体，支持全局统一覆盖，主题方案可保存、应用、重命名与删除。随机字体可按整站或单区域生成，配色可随机生成高区分度颜色；另有 8 款字体（霞鹜文楷、得意黑、站酷快乐体、Comic Neue、Baloo 2、Fredoka、Nunito、Caveat）可一键下载安装（仅 Comic Neue 随包），也支持选本地 .ttf/.otf 安装，并可一键恢复出厂默认配色。右下角「字」悬浮球打开面板，面板内含可折叠的快速上手栏，位置与配置重启后依然保留。可在 DSH 设置页「悬浮球导航」分区与另两个球一起显隐，三球共享 130 款皮肤且各带同步开关。'
