description:
  en: 'Shijian: sidebar memoranda and staged plans with tags, search, conversation snapshots, image notes, and hand-off to the composer. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '拾笺：在侧栏管理备忘录与分阶段计划，支持标签、搜索、对话快照、图片备忘录与送入输入框。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
