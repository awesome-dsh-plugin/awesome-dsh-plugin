url: https://github.com/jediliu005/dsh-fairy-maintenance
name: jediliu005/dsh-fairy-maintenance
category: tools
description:
  en: 'Scheduled task manager for DSH: the single place where unattended jobs are registered, scheduled and watched, with no dependency on Windows Task Scheduler, Windows services, Startup entries or extra background processes. Each job is a removable module folder (a module.json manifest plus a module.mjs exporting run(api)); the manager discovers modules at runtime, supports interval and daily schedules, limits concurrency and timeouts (with an abort signal), records last run, duration and failure count per module, prunes state for deleted modules, and hot-reloads the module folder without a restart. The sidebar panel shows a policy banner, three runtime settings (workspace, log directory, node executable), grouped module cards with enable, run now, stop and per-field configuration, and a list of modules that failed to load. It also injects a short schedule policy into the system prompt so agents default scheduled work to this plugin, and ships the module contract in docs/scheduled-tasks.md. The published package is the manager only: no personal jobs are included, you add your own module folders.'
  zh: 'DSH 的定时任务管理器：所有无人值守任务的唯一登记处，不依赖 Windows 计划任务、Windows 服务、开机启动项或额外常驻进程。每个任务是一个可拆的模块文件夹（module.json 清单 + 导出 run(api) 的 module.mjs）；管理器在运行时发现模块，支持间隔与每天定时，限制并发数并设置超时（带 abort 信号），记录每个模块的上次运行、耗时与失败次数，模块删除后自动清理状态，并热加载模块目录、无需重启。侧栏面板有约定横幅、三项运行配置（工作区、日志目录、node 路径）、按组排列的模块卡片（启停、立即运行、停止、按字段配置）以及加载失败列表。它还会向系统提示词注入一段调度约定，让智能体默认把定时任务交给本插件，并把模块契约写在 docs/scheduled-tasks.md。发布包只有管理器，不含任何个人任务，任务由你自己添加模块文件夹。'
