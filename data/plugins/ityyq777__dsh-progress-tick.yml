description:
  en: 'Keeps the main agent reporting during long turns: when a turn has run for the configured interval without an informative report, it injects a user-role notice asking the agent to say what it is doing, what is done, and what comes next before continuing. A reply only counts as a report when it is substantive (minReportChars) or hits a marker keyword, so a quick "still working" cannot reset the timer. Adds exponential back-off, stuck detection (the same action repeated N times switches the notice to "are you stuck?"), recent-action summaries from the session log, subagent status, zh/en text, and a /progress command for on-demand reports. Ships its own first-level section in the Settings panel (the settings.section slot, same as the plugin market) with a form that follows the active theme; all 18 settings are volatile, so edits apply live without a restart. Subagents are never nudged and the timer restarts every turn. Also adds a first-level sidebar page (progress-tick panel, next to Plugins / Task board / SSH): it lists every running main-agent session with elapsed time, the countdown to its next nudge, the last tool action and a stuck flag, fed by a loopback-only read-only endpoint that the page polls every 4 s.'
  zh: '让主 agent 在长回合里持续汇报：回合运行到设定间隔仍没有实质汇报，就注入一条用户消息，要求它先说清在做什么、已完成什么、下一步做什么再继续。只有正文达到 minReportChars 字数或命中关键词才算"汇报过"，一句"继续处理中"骗不过计时器。另有指数退避、卡住检测（同一动作连续 N 次改问"卡在哪"）、最近动作摘要（取自会话日志）、子 agent 状态、中英文案，以及随时催报的 /progress 命令。自带一个设置面板一级分区（settings.section 槽，与插件市场同级），表单跟随主题，18 个配置项均为 volatile，改完即生效、无需重启。子 agent 不打扰，计时每回合重置。另有一个左侧栏一级页面（与「插件 / 任务看板 / SSH」同级）：列出所有正在运行的主 agent 会话，显示已运行时长、下次提醒倒计时、最近工具动作与卡住标记，数据来自只回环地址可访问的只读接口，页面每 4 秒刷新。'
