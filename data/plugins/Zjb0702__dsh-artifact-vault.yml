url: https://github.com/Zjb0702/dsh-artifact-vault
name: Zjb0702/dsh-artifact-vault
category: session
description:
  en: 'Attributes workspace files to the session that wrote them by replaying session logs, groups same-named files into v1..vN, gives each session its own tools/ and artifacts/ workspace folder, and reclaims disk through a same-drive recycle bin plus a C-drive cleanup planner.'
  zh: '通过回放会话日志把工作区文件归属到写它的会话，同名文件自动排成 v1..vN，为每个会话建立独立的 tools/ 与 artifacts/ 工作区，并用同盘回收站与 C 盘清理计划回收磁盘空间。'
icon: https://raw.githubusercontent.com/Zjb0702/dsh-artifact-vault/main/assets/icon-180.png
