description:
  en: Local encrypted credential vault for accounts, passwords, API keys and documents; the agent can save entries and fetch them on request, with AES-256-GCM at rest and optional folder sync across devices.
  zh: 本机加密密码本：在侧栏管理账号密码、API Key、密钥与文档，模型可随时存取；AES-256-GCM 落盘，可选目录同步实现多端共用。
