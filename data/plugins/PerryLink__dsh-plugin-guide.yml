description:
  en: 'The DSH plugin-development knowledge base as an on-demand agent skill: official constraints, task workflows, API reference and community gotchas, installed with the bundle so the agent can look things up while building a plugin.'
  zh: DSH 插件开发知识库，作为按需加载的 agent 技能随 bundle 安装：官方约束、任务工作流、API 参考与社区踩坑，写插件时让 DSH 自己查。
  ja: DSH プラグイン開発の知識ベースを、必要なときに読み込むエージェントスキルとして提供。公式の制約、作業手順、API リファレンス、コミュニティで知られた落とし穴をバンドルと一緒に導入するので、プラグインを作りながら参照できます。
