url: https://github.com/AIcivilization/dsh-model
name: AIcivilization/dsh-model
category: model
icon: https://raw.githubusercontent.com/AIcivilization/dsh-model/main/assets/icon-180.png
description:
  en: 'Connects 36 model sources (free and pay-as-you-go APIs, Codex and Kimi subscriptions, local Ollama and LM Studio) to dsh and gives other tools one authenticated OpenAI-compatible address and key. The free pool model free/auto combines free API quotas such as ModelScope, Zhipu Flash, Gemini and Cloudflare Workers AI, moves to the next provider when one is used up, and by default only uses quotas that do not charge. Models appear in dsh grouped by source; Cherry Studio, Cline and scripts can use the same address (HTTPS is set up automatically next to dsh-vps). Daily check-in for 10 services (Trae, Qoder, WorkBuddy, Doubao, MiniMax Code, WPS Lingxi, DuMate, AStudio, Huawei CodeArts, OfficeAce) with several accounts each, pasted credentials for checking in on a server, and custom check-in services described as JSON. Installed from the plugin market it sets itself up, and the engine ships as an npm package, so no GitHub access is needed.'
  zh: '把 36 个模型来源（免费和按量付费的 API、Codex 和 Kimi 订阅、本机 Ollama 和 LM Studio）接进 dsh，并给其他软件一个带鉴权的 OpenAI 兼容地址和 key。免费池模型 free/auto 把魔搭、智谱 Flash、Gemini、Cloudflare Workers AI 等免费 API 额度合在一起，一家用完换下一家，默认只用不会扣费的额度。模型在 dsh 里按来源分组出现；Cherry Studio、Cline 和脚本可以用同一个地址（和 dsh-vps 同机时自动开 https）。每天自动签到 10 家（Trae、Qoder、WorkBuddy、豆包、MiniMax Code、WPS 灵犀、DuMate、AStudio、华为 CodeArts、OfficeAce），每家可加多个账号，可手动填凭据在服务器上签，也能用 JSON 描述添加自定义签到服务。从插件市场安装后自动完成设置；引擎随 npm 包一起安装，不需要访问 GitHub。'
