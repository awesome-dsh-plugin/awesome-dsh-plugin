name: azure5100/huahua-dsh-record-replay
category: session
description:
  en: 'Full-featured record & replay for DSH (works on Windows): replay every recorded session as a timeline, export/import shareable replay packs, re-run conversations in a fresh session, and record screen operations to auto-generate installable SKILL.md skills. A complete alternative to Codex record-replay with no macOS-only limitation.'
  zh: '功能完整的 DSH 录制回放插件（Windows 完全支持）：回放会话时间线、导出/导入可分享回放包、复刻会话重新执行、录屏自动生成可安装技能。完整替代 Codex 录制回放，无 macOS 平台限制。'
