  en: 'OpenCode OAuth and OpenCode Go provider for DeepSeek Harness: dual-track OAuth (desktop DB or device flow), auto-probed free models, and quota tracking. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 的 OpenCode OAuth 與 OpenCode Go 模型供應商：支援雙軌 OAuth（桌面版 DB 或裝置碼登入）、免費模型自動探測與額度檢視。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
