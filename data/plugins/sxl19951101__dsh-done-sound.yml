name: sxl19951101/dsh-done-sound
category: notify
description:
  en: 'Play a user-chosen sound when a conversation finishes in the DeepSeek Harness web GUI, with interrupt/error switches, auto-retry after errors with a configurable wait (10-300s), and a community sound library.'
  zh: '对话完成时播放自选提示音：支持正常完成、中断与出错三种触发开关；出错后自动重连，重连等待时长可自定义（10-300 秒）；附带社区音色库下载。'
