url: https://github.com/Ren-xing/dsh-audio-tools
name: Ren-xing/dsh-audio-tools
category: voice
description:
  en: 'Audio tools for DSH: inspect audio/video files, transcode or extract the audio track from a video, trim and normalize, and transcribe speech with local whisper.cpp or an OpenAI-compatible API. Requires ffmpeg and ffprobe on PATH (not bundled); local transcription also needs a whisper-cli binary and a ggml model.'
  zh: 'DSH 音频工具：查看音频/视频信息、转码、从视频提取音轨、裁剪与响度归一化，并用本地 whisper.cpp 或 OpenAI 兼容接口把语音转成文字和字幕。需要本机已装 ffmpeg 与 ffprobe（插件不自带）；本地转写还需 whisper-cli 与 ggml 模型。'
