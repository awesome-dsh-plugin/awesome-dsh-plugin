name: momasiku/dsh-pilot
category: tools
tarball: https://github.com/momasiku/dsh-pilot/releases/latest/download/dsh-pilot.tgz
description:
  en: 'Windows desktop vision and control: screen_view returns the live screen as a real image block the model can see (never OCR or a text summary), desktop_control drives the pointer, keyboard and windows inside that same per-monitor-DPI-aware pixel space, and desktop_sequence runs a whole batch of actions in one call — bounded by maxSequenceSteps (24 by default) — so a task costs one round trip and one frame instead of one of each per action.'
  zh: 'Windows 桌面视觉与控制：screen_view 把实时桌面作为真正的图像块交给模型（不是 OCR、不是文字描述），desktop_control 在同一个 per-monitor DPI 感知的像素空间里驱动指针、键盘与窗口，desktop_sequence 一次调用跑完一整串动作（受 maxSequenceSteps 限制，默认 24），让一个任务只花一次往返和一张图，而不是每个动作各花一次。'
