url: https://github.com/Lumos-789/delivery-video-plugin
name: Lumos-789/delivery-video-plugin
category: skill
description:
  en: 'Turn a feature that actually runs into a trustworthy delivery demo video, or a defect into a traceable feedback video: real screen recordings, edge-tts narration with word-clock subtitles, a self-contained ffmpeg pipeline, and a deterministic quality gate (spec, audio, loudness, black/freeze/silence scans) that refuses to pass a fake or broken demo. Feedback episodes add severity/phase chips, a repro-steps overlay and a ticket-ready report bound to the artifact SHA256. Preflight and artifact verification included. Requires Python 3.9+, ffmpeg/ffprobe on PATH, and `pip install edge-tts Pillow`; narration calls the public edge-tts endpoint.'
  zh: '把真实运行的功能做成可信交付演示视频，或把缺陷做成可追溯的问题反馈视频：真实录屏、edge-tts 旁白与逐字对齐字幕、自包含 ffmpeg 管线，配一道拒绝放过造假或残次演示的确定性质量闸（规格、音轨、响度、黑帧/冻结/静音扫描），含渲染前预检与成片证据核验。反馈模式带严重级别/阶段徽标、复现步骤浮层，以及按成片 SHA256 绑定的工单级问题报告。需 Python 3.9+、PATH 上的 ffmpeg/ffprobe，以及 `pip install edge-tts Pillow`；旁白会调用 edge-tts 公共接口。'
