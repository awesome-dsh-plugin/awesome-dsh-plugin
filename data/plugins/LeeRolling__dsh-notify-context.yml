description:
  en: 'Desktop notifications for turn completion, pending approval and pending questions, each with a per-situation title and the task summary it carries; silent while the client window is in front, and backed by a rotating diagnostic trace.'
  zh: '回合完成、等待授权、等待回答时弹系统通知，标题按情况分类并附任务摘要；客户端在前台时不打扰，并保留可轮转的诊断记录。'
