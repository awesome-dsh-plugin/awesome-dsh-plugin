url: https://github.com/Making-acid/dsh-synthv-studio
name: Making-acid/dsh-synthv-studio
category: voice
description:
  en: Connects a local Synthesizer V Studio 2 Pro to the agent through its own Lua script API, with five tools for discovery, a persistent bridge, voice composition, note editing and DAW (VST3/ARA + MIDI) integration. Windows 10/11 only; requires Synthesizer V Studio 2 Pro 2.1.2+ with a project open.
  zh: 通过 Synthesizer V Studio 2 Pro 自带的 Lua 脚本 API 把它接入 Agent，提供自动发现、常驻桥、演唱创作、音符编辑与 DAW（VST3/ARA + MIDI）集成五个工具。仅 Windows 10/11；需安装 Synthesizer V Studio 2 Pro 2.1.2+ 并打开工程。
icon: https://raw.githubusercontent.com/Making-acid/dsh-synthv-studio/main/assets/icon-180.png
