url: https://github.com/st21a1/dsh-bili-wallpaper
name: st21a1/dsh-bili-wallpaper
category: theme
description:
  en: 'Plays a Bilibili live room or video behind the DSH chat UI. Scan a QR code in the settings page to sign in with your own account, which unlocks the original quality tier for live streams; anonymous requests fall back to the best tier the public API returns. Live picks HLS ts segments over fmp4 so the muxed AAC track keeps audio and video in sync, and re-resolves by itself when a stream URL expires or the host reopens. Videos support part switching, a seek bar, resume position per video and part, and a configurable end action (play next part, loop, stop on the last frame, or turn the background off). Frame cover/contain, background blur, darkening scrim, panel opacity, volume and playback rate are adjustable, and playback pauses while the window is hidden. A Host-side proxy carries the Referer the CDN requires, rewrites HLS playlists, and signs every media URL with HMAC-SHA256 restricted to an allowlist of Bilibili CDN hosts.'
  zh: '把 B 站直播间或视频当作 DSH 聊天界面的背景。在设置页扫码用你自己的账号登录，直播即可解锁原画档；未登录时取公开接口能给的最高一档。直播优先选 HLS 的 ts 分片而非 fmp4，音轨混在分片里，音画天然同步；直播地址过期或主播下播后重开，会自动重新解析。视频支持分P 切换、拖动进度条、按「视频 + 分P」记住进度，以及可配置的播完动作（播下一P、循环、停在最后一帧、关闭背景）。可调铺满/完整、背景模糊、压暗遮罩、面板不透明度、音量与播放速度，窗口不可见时自动暂停。Host 端代理补上 CDN 要求的 Referer、改写 HLS 清单，并用 HMAC-SHA256 给每个媒体地址签名，且只允许 B 站 CDN 的域名白名单。'