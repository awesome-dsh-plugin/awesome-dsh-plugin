description:
  en: 'Deep-sea skin for the DSH Web UI: an 80-token light/dark theme layer, a two-layer background, a gradient sidebar with a whale sticker, a wordmark that doubles as the skin switch, and a rotating turn-status line.'
  zh: 'DSH Web 深海皮肤：80 条明暗双值令牌、背景两层、渐变侧栏与鲸鱼娘贴纸；左上角大字标就是皮肤开关，运行中的状态文案每 6 秒轮播。'
