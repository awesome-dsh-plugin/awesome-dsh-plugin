name: Asher-2000/dsh-expert-mode
category: tools
description:
  en: 'Expert-mode agent preset for DeepSeek Harness (v0.8.0, bilingual EN/ZH): a chief coordinator plus 16 domain-expert subagents with automatic task delegation and a real Inter-Expert Communication Bus (file-based, P2P, zero coordinator handover). Features: Five-Anchor constraint, Near-distance Guidance, progressive disclosure, expert persistence, cross-expert communication protocol, cross review, experience pool, fast-track for simple tasks, fault recovery with auto-retry. Experts: data analysis, copywriting, legal review, product, frontend, UI/UX, architect, ops, growth, quant finance, finance, backend, DevOps, database, QA, security.'
  zh: 专家模式 agent preset（v0.8.0，双语双份）：首席协调官 + 16 位领域专家子代理，按任务特性自动委派，专家间通过文件消息总线（bus.py）P2P 直连通信、内容零经手协调官。特性：五锚约束 + 近距离引导 + 渐进式披露 + 专家持久化 + 交叉评审 + 经验沉淀 + 快速通道 + 故障恢复。专家：数据分析/文案/法务/产品/前端/UI-UX/架构/运营/增长/量化/财务/后端/DevOps/数据库/QA/安全。