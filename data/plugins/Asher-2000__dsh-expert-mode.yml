name: Asher-2000/dsh-expert-mode
category: tools
description:
  en: 'Expert-mode agent preset for DeepSeek Harness (v0.3.0, bilingual EN/ZH): a chief coordinator plus 11 domain-expert subagents with automatic task delegation. New: Three-Anchor constraint (recall/convergence/anti-drift per turn) and Near-distance Guidance (identity/task/output template per expert). Experts: data analyst, copywriter, legal review, product manager, frontend, UI/UX, architect, social media ops, growth hacker, quant finance, finance.'
  zh: 专家模式 agent preset（v0.3.0，双语双份）：首席协调官 + 11 位领域专家子代理，按任务特性自动委派。新增：三锚约束（每轮回顾/收敛/反跑题自检）+ 近距离引导（身份/任务/输出格式模板）。专家：数据分析/文案/法务/产品/前端/UI-UX/架构/社交运营/增长/量化/财务。
