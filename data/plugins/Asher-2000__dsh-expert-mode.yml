description:
  en: 'Expert-mode agent preset for DeepSeek Harness (v0.6.0): a chief coordinator plus 11 domain-expert subagents with automatic task delegation. Progressive disclosure (-28% tokens), anchored non-degradation (5 stability anchors), five-anchor self-check, near-distance guidance, Quick Path, fault recovery, bilingual EN/ZH.'
  zh: 'DSH 专家模式 preset（v0.6.0）：一位协调官加11位领域专家子代理，自动任务委派。渐进式披露（token -28%）、锚定不降智（5个稳定性锚点）、五锚约束、近距离引导、快速通道、故障恢复、中英双语。'
