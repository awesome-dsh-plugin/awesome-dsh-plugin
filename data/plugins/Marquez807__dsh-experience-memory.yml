description:
  en: 'Cross-session experience memory for DSH: a lesson is injected only when it cites a verifiable source and this turn is about the same thing; what nobody looks up or confirms is retired, reversibly. Five tools and seven slash commands.'
  zh: '跨会话经验记忆：经验只有在能给出可核实出处、且这一轮确实在讲同一件事时才会被注入；没人查、也没人确认有用的会被退役（可逆）。五个模型工具、七个斜杠命令。'