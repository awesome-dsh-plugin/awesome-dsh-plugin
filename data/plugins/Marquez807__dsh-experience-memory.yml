description:
  en: 'Cross-session experience memory for DSH: a lesson is injected only when it cites a verifiable source and this turn is about the same thing, and just before an action only when the record declares which call it applies to. Controlled experiments on real model turns (0/18 vs 14/18; 0/6 vs 6/6) show it has prevented mistakes — for knowledge the user stated and no file states. What nobody looks up or confirms is retired, reversibly. Five tools and seven slash commands.'
  zh: '跨会话经验记忆：经验只有在给出可核实出处、且这一轮确实在讲同一件事时才会被注入；动手前提示还要记录自己声明适用哪次调用。真实模型对照实验（0/18 对 14/18、0/6 对 6/6）显示它防住过错——限「用户说过、文件里查不到」那类知识。没人查也没人确认有用的会被退役（可逆）。五个模型工具、七个斜杠命令。'
