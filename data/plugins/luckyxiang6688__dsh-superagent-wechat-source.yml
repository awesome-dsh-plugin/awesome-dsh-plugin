url: https://github.com/luckyxiang6688/dsh-superagent-wechat-source
name: luckyxiang6688/dsh-superagent-wechat-source
category: remote
description:
  en: Connects personal WeChat direct messages as a dsh-superagent Source, so private-chat text becomes a trigger for the orchestrator, accepted tasks run as work orders, and results are replied to the same chat; group and non-text messages are dropped.
  zh: 把个人微信私聊接成 dsh-superagent 的来源：私聊文本变成 Trigger 交给主控裁定，接下的任务建成工单执行，结果回帖到同一个对话；群消息与非文本消息直接丢弃。
