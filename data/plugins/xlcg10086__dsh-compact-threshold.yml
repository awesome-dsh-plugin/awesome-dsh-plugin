description:
  en: Composer control for the automatic context-compaction threshold. A 20%-80% slider rewrites the running BasicCompactionEngine config per step, shows current usage, context window and the effective trigger line, and compacts immediately when the threshold drops below current usage and the agent is idle.
  zh: 输入框旁的上下文自动压缩阈值控制器：20%-80% 滑条按 step 重写运行中 BasicCompactionEngine 的配置，显示当前用量、上下文窗口与实际触发线；阈值降到当前用量以下且 Agent 空闲时立即压缩。
