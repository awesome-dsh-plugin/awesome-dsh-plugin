url: https://github.com/Jasper-Alaric/dsh-a-hallucination
name: Jasper-Alaric/dsh-a-hallucination
category: agi
description:
  en: 'Runtime evidence discipline for DeepSeek Harness that does not rely on the model agreeing with itself. A bounded anti-hallucination contract is injected as one short system-prompt section, and four checks run outside the model: a ledger written only by real tool dispatches, so an entry cannot be fabricated; a provenance gate that records (and in the strict profile refuses) a call whose path, URL, id, account, or amount has no origin in the session; a risk gate that holds destructive, outward-facing, or paid tools, plus shell commands that delete, publish, or send, for confirmation; and an injection shield that marks web, file, MCP, and A2A output as data rather than instructions, counting instruction-like fragments it finds. Before sending an answer the model calls answer_verify with one claim per assertion, each citing a ledger id and the exact quoted excerpt; the verifier compares quotes against the stored result, so a fabricated number fails even when a tool call did happen. Time-sensitive claims (price, incumbent, version, current) must cite evidence inside an age limit. Every verdict reports the verification level it applied (light, standard, strict) and the output form the answer should take (direct, annotate, or abstain with what is missing), plus running metrics such as verification counts, pass rate and quote rate, and the Settings panel shows those same counts in plain language. Three profiles cover the tradeoff: observe only records, inspect also blocks and annotates, adjudicate additionally refuses untraceable targets, and the Settings panel labels the three of them 静观 (observe), 明察 (inspect) and 断案 (adjudicate). Ships a plain-language Settings panel with a collapsible technical section, durable profile selection, and a read-only ledger_view tool. No embedding service, no vector database, no network calls, no runtime dependencies.'
  zh: '为 DeepSeek Harness 提供一套不依赖模型自我承诺的运行时证据纪律。一段有字数预算的反幻觉契约作为单个系统提示片段注入，另外四道检查全部跑在模型之外：证据台账只由真实工具派发写入，模型伪造不出一条；溯源门记录（断案档下直接拒绝）路径、URL、ID、账号、金额这类参数在本会话里找不到出处的调用；高风险门按住删除、外发、付费类工具，以及命令行里出现删除、发布、发送的动作，交给人确认；注入免疫给网页、文件、MCP 与其他 Agent 的返回加上「这是数据不是指令」的抬头，并统计其中像指令的片段。回答发出前，模型把答案连同每条断言交到 answer_verify：一条断言一条 claim，附台账编号与逐字原文引用；核验器拿引用和台账真实结果比对，所以哪怕本轮调过工具，编的数字也过不了。时效性断言（价格、现任、版本、「目前/最新」）引的证据必须在期限內。每次核验都会报告验证档位（轻/标准/严格）、输出形态（直接输出/标注/弃权）以及运行指标（核验次数、通过率、引文比例）。三档覆盖取舍：静观只记账，明察另加拦截与标注，断案追加对无出处目标的拒绝。三档在设置页分别显示为「静观」「明察」「断案」，可随时切换。附带说人话的设置页（技术细节折叠）、重启不丢的档位持久化，以及只读工具 ledger_view。不依赖向量库、不外发数据、无运行时依赖。'
