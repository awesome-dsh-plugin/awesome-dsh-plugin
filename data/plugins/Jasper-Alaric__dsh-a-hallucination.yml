name: Jasper-Alaric/dsh-a-hallucination
category: agi
description:
  en: 'Runtime evidence discipline for DeepSeek Harness that does not rely on the model agreeing with itself. A bounded anti-hallucination contract is injected as one short system-prompt section, and four checks run outside the model: a ledger written only by real tool dispatches, so an entry cannot be fabricated; a provenance gate that records (and in the strict profile refuses) a call whose path, URL, id, account, or amount has no origin in the session; a risk gate that holds destructive, outward-facing, or paid tools, plus shell commands that delete, publish, or send, for confirmation; and an injection shield that marks web, file, MCP, and A2A output as data rather than instructions, counting instruction-like fragments it finds. At the end of each turn a completion audit checks that language such as executed or already published is backed by a successful call in that turn, and reports every invariant it could not check as unchecked instead of returning a clean pass. Three profiles cover the tradeoff: observe only records, inspect also blocks and annotates, adjudicate additionally refuses untraceable targets. Ships a plain-language Settings panel with a collapsible technical section, durable profile selection, and a read-only ledger_view tool with status, list, observations, and verdict. No embedding service, no vector database, no network calls, no runtime dependencies.'
