url: https://github.com/dingchenhui0618-arch/dsh-in-hand
name: dingchenhui0618-arch/dsh-in-hand
category: remote
description:
  en: 'Phone client for DeepSeek Harness — no app to install (PWA). Read sessions, background jobs, subagents, goal rounds, workflows and pending approvals, and talk to any session from it: streamed replies, tool-call progress, stop at any time, switch sessions and models. Also ships a GUI sidebar panel. Formerly dsh-taskwatch; the npm package is now dsh-in-hand.'
  zh: '掌上 DSH（dsh-in-hand）：DeepSeek Harness 的手机端，不用装 App（PWA）。既能在适配手机的页面上读会话、后台任务、子代理、目标轮次、工作流与待审批，也能直接和任意会话对话：逐字流式回复、工具调用进度、随时停止、切换会话与模型。另含 GUI 侧边栏面板。原名 dsh-taskwatch，npm 包已改为 dsh-in-hand。'
