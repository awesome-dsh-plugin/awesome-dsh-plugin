name: PPawnsir/dsh-notes-plugin#dsh-notes-plugin
category: workflow
description:
  en: "Local Markdown notes as governable working memory for DeepSeek Harness agents: dual-mode source/WYSIWYG editor with images, convention or reference notes auto-inject into the system prompt with sensitive values masked, plus snapshot version history, recycle bin, undoable archiving, AI reorganization, backlinks and full-text search. Compatible with DSH 0.1.7-0.2.x."
  zh: "DeepSeek Harness 的可治理 Agent 工作记忆层，沉淀为本地 Markdown 笔记：双模式编辑器（源码⇄富文本，支持图片），约定/资料笔记自动注入系统提示（敏感值自动脱敏），另有快照版本历史、回收站、可撤销归档、AI 整理、双链与全文搜索。兼容 DSH 0.1.7～0.2.x。"
