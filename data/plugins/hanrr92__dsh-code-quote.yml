url: https://github.com/hanrr92/dsh-code-quote
name: hanrr92/dsh-code-quote
category: ui
description:
  en: 'Composer code-quote collapse for the DSH Web UI: pasting a `path:line` header followed by code folds the input into one compact inline quote chip, and at send time the `agent/pre-step` hook injects the full pasted snapshot to the model as a separate context message. 0.5.x also folds sidebar file-selections that insert only a `path:lines` line (large selections), fetching the code from disk by session cwd, and preempts Ctrl+V paste interception.'
  zh: '输入框代码引用折叠：粘贴「路径:行号 + 代码」时自动折叠为「文件图标+文件名:行号」引用芯片（Ctrl+Z 可还原），发送时由 agent/pre-step 钩子将完整代码快照作为独立上下文消息注入给模型。0.5 起支持侧边栏「添加到对话框」大段选区（仅插路径行时按会话工作目录读磁盘取代码），并在捕获阶段抢权接管 Ctrl+V 粘贴。'
tarball: https://github.com/hanrr92/dsh-code-quote/releases/latest/download/dsh-code-quote.tgz