name: bradeGithub/DSH-Plugins-Marketplace
category: market
description:
  en: 'GitHub-topic-driven plugin & skill marketplace: a Settings page that browses the auto-collected registry (the whole dsh-plugin topic plus the skills index, CI-refreshed every 2 hours) with one-click install, type detection, install-script and host-shadow-dependency safety confirmations, env-key management, and the STANDARD.md recognition spec.'
  zh: 面向 GitHub dsh-plugin 话题的插件与技能市场：设置页内逛自动收录的全量索引（CI 每 2 小时刷新），一键安装带类型识别、安装脚本与宿主依赖遮蔽安全检查、环境变量密钥管理，并附 STANDARD.md 识别层规范。
  ja: GitHub の topic を情報源にしたプラグイン＆スキルのマーケット。自動収集されたレジストリ（dsh-plugin topic 全体とスキルの索引、CI で 2 時間ごとに更新）を閲覧できる設定ページで、ワンクリックのインストール、種別の判定、インストールスクリプトとホストの依存上書きに対する安全確認、環境変数キーの管理、STANDARD.md の認識仕様を備えます。
