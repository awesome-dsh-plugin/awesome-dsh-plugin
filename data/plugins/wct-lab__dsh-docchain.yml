# 提交方式：
#   fork https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
#   把本文件复制为该仓库的 data/plugins/wct-lab__dsh-docchain.yml
#   提交 PR（一个 PR 最多 3 条；CI 校验通过后维护者会读源码核对描述）
url: https://github.com/wct-lab/dsh-docchain
name: wct-lab/dsh-docchain
category: docs
description:
  en: DocChain knowledge base and document conversion toolkit — filename, content and metadata search, locate-by-doc_id/name with content reading, topic listing, bulk document upload, document-to-Markdown conversion, image-similarity search, per-document image descriptions saved to a sidecar markdown, and a deep-research workflow. Every script-backed capability also ships as a native DSH tool executed in-process (doc search, content search, filename search, topic info, metadata search, upload, image search, image describe, doc2markdown). The configuration page keeps several docchain environments (each with its own address and credential), switches between them in one click, and pre-selects topics per environment. Needs a docchain service URL and API key (except doc2markdown); image descriptions additionally need an OpenAI-compatible multimodal endpoint (defaults to an internal gateway model, configurable).
  zh: 知识库和文档转换插件：文档文件名、内容与元数据检索，按 doc_id/文档名称定位并读取正文，主题查询，文档批量上传，文档转 Markdown，图搜图，文档图片转文字（逐张生成描述并写入旁路描述 md，主 md 不动），并附带深度研究工作流。所有带脚本的能力同时提供原生 DSH 工具，由宿主进程内直接执行（文档定位、内容搜索、文件名搜索、主题查询、元数据查询、批量上传、图搜图、文档图片转文字、文档转 Markdown）。配置页可保存多个 docchain 环境（各带独立地址与凭据）并一键切换，还可按环境预选主题。除 doc2markdown 外需配置 docchain 服务地址与 API key；图片转文字另需一个 OpenAI 兼容的多模态模型端点（默认走内网网关模型，可配置更换）。
