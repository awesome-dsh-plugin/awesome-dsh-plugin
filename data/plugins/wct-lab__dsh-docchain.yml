url: https://github.com/wct-lab/dsh-docchain
name: wct-lab/dsh-docchain
category: docs
description:
  en: "DocChain knowledge base, document conversion and knowledge-graph toolkit — filename, content and metadata search, locate-by-doc_id/name with content reading, topic listing, bulk document upload, document-to-Markdown conversion, image-similarity search, per-document image descriptions saved to a sidecar markdown (flowcharts and architecture diagrams are turned into PlantUML sketches, other images into text descriptions; the original image is replaced by a clickable link), a deep-research workflow, and a knowledge-graph layer (ontology inspection, read-only Cypher, ontology/entity/relation writes). Every script-backed capability also ships as a native DSH tool executed in-process: doc search, content search, filename search, topic info, metadata search, upload, image search, image describe, doc2markdown, plus kg schema / kg cypher / kg upsert node / kg upsert relation / kg delete node / kg delete relation. All graph operations go through the DocChain API, so no Neo4j password is needed. The configuration page keeps several docchain environments (each with its own address and credential), switches between them in one click, and pre-selects topics per environment. Needs a docchain service URL and API key (except doc2markdown); image descriptions additionally need an OpenAI-compatible multimodal endpoint (defaults to an internal gateway model, configurable)."
  zh: "知识库、文档转换与知识图谱插件：文档文件名、内容与元数据检索，按 doc_id/文档名称定位并读取正文，主题查询，文档批量上传，文档转 Markdown，图搜图，文档图片转文字（流程图/架构图这类结构图自动转成 PlantUML 草图，其它图写成文字描述，并写入旁路描述 md，主 md 不动；原图改为可点链接），深度研究工作流，以及知识图谱能力（查本体结构、执行只读 Cypher、本体/实体/关系的增删改，全部走 DocChain API，无需 Neo4j 密码）。所有带脚本的能力同时提供原生 DSH 工具，由宿主进程内直接执行：文档定位、内容搜索、文件名搜索、主题查询、元数据查询、批量上传、图搜图、文档图片转文字、文档转 Markdown，以及知识图谱的本体查询 / Cypher / 节点与关系的增改删。配置页可保存多个 docchain 环境（各带独立地址与凭据）并一键切换，还可按环境预选主题。除 doc2markdown 外需配置 docchain 服务地址与 API key；图片转文字另需一个 OpenAI 兼容的多模态模型端点（默认走内网网关模型，可配置更换）。"
