name: uigdwunm/dsh-process-fold
category: ui
tarball: https://github.com/uigdwunm/dsh-process-fold/releases/latest/download/dsh-process-fold.tgz
description:
  en: Folds each DSH Web turn's thinking, tool calls and context into bordered process boxes cut at every piece of model text; a collapsed box shows its latest two items, the stacked lines above its border open that one box, the border itself folds it back, and user dialogue, interactive questions and model text stay outside.
  zh: 把每轮 DSH Web 会话中的思考、工具调用与上下文折叠进带边框的过程框，在每段模型文本处切开；折叠时每框只显示最新两项，点上边框的堆叠线展开这一个框、再点上边框收回，用户对话、交互式提问与模型文本始终留在框外。
