url: https://github.com/iimaguest/dsh-sandbox-escalation-guard
name: iimaguest/dsh-sandbox-escalation-guard
category: security
description:
  en: "Stops offering a sandbox escalation the calling session can never grant — which is what makes GPT-family models fail every tool call. That family completes every optional property in a tool schema, and the two optional properties on bash, write and edit are exactly the two a full-access session can never use, because escalation accepts only a strictly wider level than the one in effect and both advertised values are therefore rejected before anything runs. Models that send only what a call needs never touch them, which is why this looked model-specific. The guard narrows the enum per request against the session's effective mode and removes both the field and its escalation prose when nothing is grantable; a cached or non-conforming call is denied at tools/pre-execute with text naming the repair. Same ladder as approveEscalation, guarded by a drift test. Zero dependencies."
  zh: "不再提供当前会话根本无法授予的沙箱升级选项——这正是 GPT 系列模型每次工具调用都失败的原因。该系列会把工具 schema 里的可选属性全部填满，而 bash、write、edit 上这两个可选属性恰好是满权限会话永远用不到的：升级只接受严格宽于当前生效级别的取值，于是广告出去的两个值都会在任何执行发生前被拒。只发调用真正需要的属性的模型永远不会碰到它们，这就是它看起来像模型专有问题的原因。本插件按请求、依据会话实际模式收窄枚举；一个可授予级别都不剩时，连同该字段与升级说明一并移除；缓存 schema 或不按 schema 发起的调用会在 tools/pre-execute 被拒绝，并给出指明修复方式的说明。与 approveEscalation 使用同一梯度，并有防漂移测试。零依赖。"
