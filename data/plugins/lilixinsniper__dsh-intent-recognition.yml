# dsh-market 收录条目草稿
# 用法：fork https://github.com/awesome-dsh-plugin/awesome-dsh-plugin ，
# 在 data/plugins/ 下新增文件 lilixinsniper__dsh-intent-recognition.yml，
# 内容如下，然后提 PR（一个 PR 只加这一个文件；不要手工编辑两个 README，它们由脚本生成）。
# 前提：仓库创建满 1 天、已添加 dsh-plugin topic、代码已推送（package.json 含 dsh.bundle、根目录有 cordis.patch.yml）。

url: https://github.com/lilixinsniper/dsh-intent-recognition   # 必须与仓库完全一致
name: lilixinsniper/dsh-intent-recognition
category: tools                                         # 维护者认为更合适时会直接改，不会打回
description:
  en: Five-layer intent recognition pipeline (rules, pgvector retrieval, Jev scoring, fine-tuned arbitration, LLM fallback) with scenario management UI, PostgreSQL storage and distributable API services.
  zh: 五层意图识别流水线（规则、pgvector 向量检索、Jev 概率精判、微调仲裁、LLM 兜底），带场景管理界面、PostgreSQL 存储与可分发 API 服务。
