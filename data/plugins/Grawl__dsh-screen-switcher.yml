url: https://github.com/Grawl/dsh-screen-switcher
name: Grawl/dsh-screen-switcher
category: ui
description:
  en: 'Ctrl+Tab switcher over every visited screen — Sessions, Settings sections and plugin pages — shown while Ctrl is held; release to switch, Esc to stay. Browsers reserve Ctrl+Tab for their own tabs, so use it in the desktop app or in a browser that delivers the shortcut to the page.'
  zh: 'Ctrl+Tab 切换器：按住 Ctrl 时列出访问过的页面——会话、设置分区和插件页——松开即切换，Esc 取消。浏览器会把 Ctrl+Tab 留给自己的标签页，所以请在桌面端使用，或在能把该快捷键交给页面的浏览器里使用。'
