category: theme
description:
  en: Web theme and file workspace plugin with global typography controls, @file mentions, a project file tree, Markdown preview, and a resizable side panel.
  zh: DSH Web 主题与文件工作台：全局字体设置、@ 文件引用、项目文件树、Markdown 预览和可拖拽侧边面板。
  ja: Web テーマとファイルワークスペースのプラグイン。全体の文字組みの調整、@file メンション、プロジェクトのファイルツリー、Markdown プレビュー、幅を変えられるサイドパネルを備えます。
