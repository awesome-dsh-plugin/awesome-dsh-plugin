name: wxsimon2022/dsh-metaontic-newapi-lite
category: usage
description:
  en: "DSH management plugin for the MetaOntic AI unified API gateway, with a model plaza, grouped API key quotas and copying, subscriptions, top-ups and balance/usage queries; the platform aggregates models with OpenAI, Anthropic and Gemini compatibility, layered quotas, isolated personal/team allocations and centralized request records."
  zh: "MetaOntic AI 统一 AI 接口网关的 DSH 管理插件，提供模型广场、API Key 分组与额度管理、复制、订阅充值和余额用量查询；平台聚合多家模型，兼容 OpenAI、Anthropic 与 Gemini 协议，支持分层额度、个人与团队配额隔离及集中调用记录。"
