url: https://github.com/dingchenhui0618-arch/dsh-poker-night
name: dingchenhui0618-arch/dsh-poker-night
category: fun
description:
  en: 'A no-limit Texas holdem table where you are the only human. Eight seats: you plus seven LLM agents written on AI-founder personas (Altman, Dario Amodei, Musk, Liang Wenfeng, Jensen Huang, Lei Jun, Zhang Yiming). Each agent bets through the currently selected host model and falls back to its own heuristic style when no model is available; every agent only ever sees its own hole cards, because the prompt is built from that seat alone. A hand ends by revealing the winner hole cards, with a flip animation replayed on every community card, and a rail keeps a live action-and-table-talk timeline. LAN mode (off by default, single-machine play is unaffected) lets another install on the same network join this very table: the host shows a six-digit room code, UDP broadcast discovers nearby tables, and a joiner randomly takes over one bot seat, with the seat handed back to its character on leave or after twenty seconds of silence. The room code is never put on the wire and every snapshot is generated for one viewer seat, so nobody, not even the host, can read another player hole cards. Fork of BubblePtr/dsh-holdem (MIT), credited in the README and in the UI.'
  zh: '一张只有你一个人类的无限注德州扑克桌。八个座位：你，加上七位以 AI 创始人设写成的 LLM 智能体（Altman、达里奥、马斯克、梁文峰、黄仁勋、雷军、张一鸣）。每个智能体都通过宿主当前选中的模型下注，模型不可用时回落到自己的启发式风格；每个智能体只看得见自己的底牌，因为提示词只由它自己那个座位拼出来。一手结束时亮出赢家底牌，每张公共牌落地都会重播翻牌动画，侧栏保留实时的行动与桌边闲话时间线。局域网模式默认关闭、不影响单机玩法：同一网络里的另一份安装可以加入这张桌，主机屏幕显示 6 位房间号，UDP 广播负责发现附近的牌桌，加入者随机顶替一名人机座位，离开或静默二十秒后座位交还该角色。房间号从不上广播，且每份快照都按观看者座位生成，所以没有人（连主机也不行）能读到别人的底牌。本仓库是 BubblePtr/dsh-holdem（MIT）的 fork，README 与界面都保留了上游署名。'
