url: https://github.com/oriliz/agent-crop
name: oriliz/agent-crop
category: workflow
description:
  en: 'Times AI coding sessions, nudges long-running turns, and keeps a local work ledger with a collector-health dashboard, so you can see where the time actually went. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '给 AI 编码会话计时、催长任务、记工作台账，并提供采集健康度面板，看清时间到底花在哪。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
