description:
  en: 'Capability transform & assembly engine (Qian Xuesen cybernetics/systems framework): static resident layer manages the skill/MCP/plugin registries, auto-absorbs skills and tool metrics, and drives a negative-feedback evolution loop (scan Sick/Weak → mutate → select promote/reject → 30s rollback); includes a Web UI panel and a GitHub dsh-plugin store bridge.'
  zh: 能力转化与组装引擎（钱学森工程控制论/系统论框架）：静态常驻层管理 skill/MCP/插件三库、自动吸收技能与工具度量，驱动负反馈进化闭环（scan Sick/Weak → mutate → select 晋升/淘汰 → 30s 回滚）；含 Web UI 面板与 GitHub dsh-plugin 商店桥。
  ja: 能力の変換・組み立てエンジン（銭学森のサイバネティクス/システム理論に基づく）。常駐する静的層がスキル/MCP/プラグインのレジストリを管理し、スキルとツールの指標を自動で取り込みつつ、負のフィードバックによる進化ループ（Sick/Weak を検出 → 変異 → 採用/却下の選択 → 30 秒でロールバック）を回します。Web UI パネルと GitHub の dsh-plugin ストアブリッジも同梱。
