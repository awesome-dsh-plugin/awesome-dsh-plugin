name: eghrhegpe/dsh-connect-sensenova-token-plan
category: usage
description:
  en: 'One-tap connect SenseNova Token Plan language and text-to-image models into DSH, with image recognition and thinking level filled in automatically (off by default). On a rate limit it backs off and retries on its own instead of misreading it as an exhausted quota. After signing in to the SenseNova console you can see the card pill, credit pools and per-model consumption. Xiaohuanxiong can also be signed in by QR code, bringing in its models and their consumption multipliers.'
  zh: '一键接入商汤 Token Plan的语言、文生图模型到 DSH，自动填入图片识别与思考强度（默认关）；限频时自动退避重试，不会误判为额度耗尽；登陆商汤控制台后，可查看卡片胶囊、积分池、每模型消耗。也支持扫码登陆小浣熊，接入其模型，查看模型消耗倍率。'
