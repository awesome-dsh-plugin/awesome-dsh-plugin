name: kmyy350234-dz/dsh-tool-drawer
category: tools
description:
  en: "On-demand tool groups for DeepSeek Harness, with optional role-scoped tool surfaces. Role masks are off by default; Settings can enable or disable review/build/research, and add custom roles with a group allow-list. The role key comes from the host's session label, subagent marker or preset, so an orchestrator's child agents each see only their own allow-list. Also auto-groups tool families by name prefix, lets the agent classify ungrouped tools once, restores a hidden tool when it is actually called, and reports per-session visibility health."
  zh: "把重工具组从每一轮请求里收起来，并提供可选的角色工具面。角色工具面默认关闭；设置页可逐项开关 review/build/research，也能自定义角色和允许组。角色键来自宿主自己的会话 label、subagent 标记或 preset，编排器的子代理各看各的组白名单。另有按名前缀自动分组、让 AI 分一次没归组的工具、调用被收工具时自动放回，以及每个会话实际可见性的 health 快照。"
tarball: https://github.com/kmyy350234-dz/dsh-tool-drawer/releases/latest/download/dsh-tool-drawer.tgz
