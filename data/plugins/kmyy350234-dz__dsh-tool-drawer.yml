url: https://github.com/kmyy350234-dz/dsh-tool-drawer
name: kmyy350234-dz/dsh-tool-drawer
category: tools
description:
  en: "Keeps heavy tool groups out of every request and brings them back on demand, by keyword, or automatically at session start. Ships default groups for the cua_driver_native, dsh_browser and vision families, and auto-groups new families by tool-name prefix (autoGroups: off / suggest / on) — core tools are never grouped. Its settings page talks to the host over a loopback route (127.0.0.1) only."
  zh: "把重工具组从每一轮请求里收起来，需要时按需、按关键词或会话开始时自动恢复。自带 cua_driver_native、dsh_browser、vision 三类默认分组，并能按工具名前缀自动识别新家族建组（autoGroups: off / suggest / on），核心工具永不入组。设置页只通过本机回环（127.0.0.1）与宿主通信，不连外部地址。"
icon: https://raw.githubusercontent.com/kmyy350234-dz/dsh-tool-drawer/main/assets/icon-180.png