url: https://github.com/acttk/dsh-bili-interactor
name: acttk/dsh-bili-interactor
category: tools
description:
  en: 'Browses Bilibili on your behalf and actually takes part: search videos, like, coin, send danmaku, post comments, reply to other people, and keep replying when someone answers back. Reads the video''s Bilibili AI subtitle, or transcribes the audio locally when there is none, so its comments talk about what the video really says rather than just the title, and it reads that same content before deciding whom to reply to. Rather than copying other people''s sentences, it distills rules about how to sound like a person and gets less AI-ish the more it runs. Remembers which videos it already browsed, de-duplicates replies per thread, and checks whether a comment is genuinely public or only visible to your own account, warning you on the overview when replies got folded. Six-tab settings panel where every change takes effect immediately with no restart, plus an environment self-check that tells you exactly what to install. Requires Python 3 for the Bilibili actions; the built-in environment check lists any missing packages.'
  zh: '替你在 B 站上真的动手：搜视频、点赞、投币、发弹幕、发评论、回别人的评论，别人回了还能接着聊。会读视频的 B 站 AI 字幕（没有字幕时可本地转写），所以评论说的是视频里真正讲了什么，而不只是吐槽标题；挑该回谁之前也会先看一遍视频内容。它不抄别人的句子，而是总结「怎么说话才像真人」的规律，跑得越多 AI 味越淡。记得刷过哪些视频、不再重复推同一条，同一楼不重复回复。还能查一条评论是真公开了还是只有你自己看得见，并在总览上告警有多少条别人根本刷不到。六页签设置面板，改任何一项立刻生效、不用重启，自带环境自检，缺什么直接告诉你。B 站操作需要 Python 3；内置环境自检会列出缺少的依赖。'
