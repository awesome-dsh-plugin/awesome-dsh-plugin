url: https://github.com/acttk/dsh-bili-interactor
name: acttk/dsh-bili-interactor
category: tools
description:
  en: 'Browses Bilibili on your behalf and actually takes part: search videos, like, coin, send danmaku, post comments, reply to other people, and keep replying when someone answers back. Reads the video''s Bilibili AI subtitle (or transcribes the audio locally when there is none) so its comments talk about what the video really says, and it reads that same content before choosing whom to reply to. Instead of copying other people''s sentences, it distills rules about how to sound like a person and gets less AI-ish the more it runs. Skips videos it already browsed, de-duplicates replies per thread, and after too many rounds with the same person in one comment section it reviews whether the exchange has any substance -- if it looks like two bots complimenting each other, it says one last line and stops replying to that person there. Checks whether each comment is genuinely public or only visible to your own account, can scan any time window (last hour / day / 3 days / all) and lists the ones others cannot see, warning you on the overview when replies got folded. Six-tab settings panel where every change takes effect immediately with no restart, a manual run that queues behind the background listener instead of being refused, and an environment self-check that tells you exactly what to install. Requires Python 3 for the Bilibili actions; the built-in check lists any missing packages.'
  zh: '替你在 B 站上真的动手：搜视频、点赞、投币、发弹幕、发评论、回别人的评论，别人回了还能接着聊。会读视频的 B 站 AI 字幕（没有字幕时可本地转写），所以评论说的是视频里真正讲了什么；挑该回谁之前也会先看一遍视频内容。它不抄别人的句子，而是总结「怎么说话才像真人」的规律，跑得越多 AI 味越淡。会跳过刷过的视频、同一楼不重复回复；跟同一个人在同一个评论区来回聊太多轮时会先审查这段对话有没有营养 —— 如果像两个机器人在互相捧场，就说最后一句、之后不再回复他。还能查每条评论是真公开了还是只有你自己看得见，可以按任意时间范围（最近 1 小时 / 24 小时 / 3 天 / 全部）批量扫描并列出别人看不到的那些，总览上直接告警有多少条被折叠。六页签设置面板，改任何一项立刻生效、不用重启；手动「跑一轮」撞上后台监听会排队而不是被拒；自带环境自检，缺什么直接告诉你。B 站操作需要 Python 3，内置自检会列出缺少的依赖。'
