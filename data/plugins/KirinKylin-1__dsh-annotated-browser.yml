url: https://github.com/KirinKylin-1/dsh-annotated-browser
name: KirinKylin-1/dsh-annotated-browser
category: browser
description:
  en: 'An annotated browser tab: pages render on the host and are served same-origin, so you can click an element or drag a region, write what should change, and send the notes into the conversation with selectors, visible text and rectangles. Built-in browser untouched; picking continues until you press Esc.'
  zh: '带标注的浏览器标签：页面在宿主渲染并以同源方式提供，可以点选元素或框选区域，写下要改什么，把批注连同选择器、可见文本和位置一并发进对话。不动内置浏览器，点选可连续进行，按 Esc 才退出。'
icon: https://raw.githubusercontent.com/KirinKylin-1/dsh-annotated-browser/main/assets/icon-180.png
