url: https://github.com/Frank-Fan-1058/dsh-document-view
name: Frank-Fan-1058/dsh-document-view
category: ui
description:
  en: A split document view for DeepSeek Harness: the document stays centered while the conversation stays on the right. Select text in Word / PDF / PowerPoint to strike it out or leave a comment; the review panel lists every mark by page and sends the whole review to the AI as one structured message. After the agent edits the file, each changed span is highlighted in green (a deleted passage gets a green caret), so you can see what moved. Also: a resizable divider with keyboard support, three layout presets, auto-enter on document view, and a Document/Chat switch in narrow windows - saved per session. The plugin only rearranges the window and draws marks: no network requests, no file writes, no credentials; editing, saving and preview stay with DSH's native viewers. Verified on DSH 0.2.2-rc.5.
  zh: '为 DeepSeek Harness 增加分栏文档视图：文档居中、对话在右。可在 Word / PDF / PPT 里选中文字加「删除线」或「批注意见」，汇总面板按页列出，一键把整份清单作为一条结构化消息发给右侧 AI；AI 改完文件后，被改动的文字自动标绿（整段删除处为绿色竖线），一眼看出改了哪里。另有可拖动分隔线、三种布局预设、查看文档时自动进入协作、窄窗口下的「文档 / 对话」切换，开关与比例按会话保存。插件只调整布局与批注：不发网络请求、不读写原文件、不含凭据；编辑与预览沿用 DSH 原生查看器。已在 DSH 0.2.2-rc.5 上验证。'
