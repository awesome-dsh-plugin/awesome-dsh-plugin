url: https://github.com/zxsimple/dsh-revive
name: zxsimple/dsh-revive
category: session
description:
  en: 'Session replay view for DSH conversations: replays a session turn by turn at reading pace for prompts and answers while reasoning and tool output stream past, and every prompt is followed by a one-second pause. It can also re-run the original prompts in a new session, and record the replay — screen recording the conversation itself — to a WebM video through a 1280x720 canvas, with no OS screen-recording permission.'
  zh: 'DSH 会话回放视图：按轮重放一次会话，用户输入与助手正文保持阅读速度，思考与工具输出高速掠过且每段最多 3.5 秒，每条输入后停顿一秒；可一键把原始请求复刻到一个新会话，也可边回放边录制，把回放录屏导出成 WebM 视频（画布 1280×720，无需系统录屏权限）。'
