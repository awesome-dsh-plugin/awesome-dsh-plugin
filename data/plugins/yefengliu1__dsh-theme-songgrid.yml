name: yefengliu1/dsh-theme-songgrid
category: theme
description:
  en: 'Song-dynasty-inspired theme for the DSH web UI: a light "rice paper" and a dark "night ink" variant, Ru celadon carrying interactive states while kiln copper is reserved for blockquotes, plus a 4pt spacing scale and a 46-glyph mask icon set.'
  zh: 宋律 Songgrid —— 宋代美学主题，宣纸（浅）与夜墨（深）双变体；汝窑天青承担交互态、窑铜只用于引用块；另附 4pt 间距阶与 46 个 mask 图标。
