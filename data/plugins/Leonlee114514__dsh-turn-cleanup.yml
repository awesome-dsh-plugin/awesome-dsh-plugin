description:
  en: 'Blocks the end of a turn while temporary files from that turn are still lying around: it registers a listener on the serial agent/turn-stopping hook and, if anything is left, hands the model the file list plus two ways out — delete them, or justify each one and move it somewhere deliberate. Candidates come from two narrow temp-file sources, plus a backup-retention channel that is on by default and flags excess .bak copies of files touched this turn. The first is the .agent-tmp/ convention directory under the session cwd: whatever is left in it is reported outright, because that directory exists only for throwaway files. The second is the paths this turn actually wrote, captured through the fs/write-intent, fs/edit-intent and fs/delete-intent hooks; those are reported only when they sit under that cwd (compared after realpath normalisation), fall outside .git, node_modules, out, dist, build, target, vendor, .venv and __pycache__, match a temp-file pattern that requires a separator after the prefix so checkout.js and benchmark.ts are not taken for scratch files, and the file is still present — which keeps junk already sitting in the workspace from being resurrected as a complaint about this turn. One gate per turn, subagent sessions skipped, nothing deleted unless the backup mode is explicitly set to prune, and the injected wording follows the host locale instead of assuming a Chinese one.'
  zh: '临时文件没清完，这一轮就结束不了：在串行的 agent/turn-stopping 钩子上挂监听器，发现残留就把文件清单交回模型，并给两条出路——删掉，或者逐条说明理由再挪到明确位置。候选有两处很窄的临时件来源，另有一条默认开启的备份保留通道：本轮碰过的 .bak 副本超过保留份数会被列出。第一处是会话 cwd 下的 .agent-tmp/ 约定目录，留在里面的文件一律直接报出，因为这个目录的存在意义就是装可丢的东西。第二处是本轮经 fs/write-intent、fs/edit-intent、fs/delete-intent 钩子真实写入的路径，还要同时满足：在那个 cwd 之下（按 realpath 归一后比较）、不落在 .git / node_modules / out / dist / build / target / vendor / .venv / __pycache__ 里、命中要求前缀后带分隔符的临时件模式（所以 checkout.js 与 benchmark.ts 不会被当成草稿）、且文件此刻仍在——正因如此，工作区里早就躺着的垃圾不会被翻出来当成本轮的问题。每轮只拦一次，子会话跳过，除非把备份模式显式设成 prune 否则插件自己不删文件，注入文案跟随宿主语言环境而不是假定中文。'
