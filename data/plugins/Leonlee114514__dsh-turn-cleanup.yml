description:
  en: 'Stops a turn from ending while the files it just wrote are still lying around. Whatever is left in the .agent-tmp/ convention directory is reported outright; paths this turn actually wrote are reported only when they match a temp-file pattern, sit inside the session cwd and the file is still there — so junk that was already in the workspace is not blamed on this turn. The model gets the file list and two ways out: delete them, or justify each one and move it somewhere deliberate. One gate per turn, subagent sessions skipped, nothing deleted unless backup pruning is switched on. The panel counts blocks, files cleared, space freed and how often the model complied. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '本轮刚写下的临时文件没清完，这一轮就结束不了。留在 .agent-tmp/ 约定目录里的东西一律直接报出；本轮真实写入的路径则要命中临时件模式、落在会话 cwd 之内、且文件此刻仍在才报——所以工作区里早就躺着的垃圾不会被算成本轮的问题。清单交回模型时给两条出路：删掉，或者逐条说明理由后挪到明确位置。每轮只拦一次，子会话跳过，除非显式开启备份清理，插件自己不删文件。面板统计拦截次数、已清文件数、释放空间与依从率。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
