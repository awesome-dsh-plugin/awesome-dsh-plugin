url: https://github.com/Jessicaisleep/dsh-dsml-guard
name: Jessicaisleep/dsh-dsml-guard
category: session
description:
  en: 'Routes leaked model output into the right block: <thinking>/<analysis> text found in prose becomes a real reasoning block, a whole leaked DSML tool call is wrapped in a text fence and kept instead of deleted (no tool is ever executed), and commands or patches the model narrated instead of running are fenced as powershell or diff code. Also resumes a turn when a continue genuinely helps — max-tokens, empty or closed streams, misclassified network blips — stopping after 3 consecutive resumes until a normal reply resets the count; quota and context-window errors never resume, while AUTH and INVALID_REQUEST stay off by default and can be opted in. Codes the host already retries inside the step (EMPTY_RESPONSE, SERVER, TIMEOUT, TRANSPORT) are handed to it unless the host retry is provably not active that turn. Every switch is on a settings page. Requires DSH 0.2.1-rc.2 or newer, below 0.3.0, and Node 20 or newer.'
  zh: '把漏出来的模型输出放回正确的区块：正文里的 <thinking>/<analysis> 段搬成真正的「思考」块；整段漏进正文的 DSML 工具调用包进代码围栏保留、不再整段删掉（绝不真去执行）；模型只念出来没真执行的命令与补丁包成 powershell / diff 代码块。同时只在发「继续」确实有用时补一条——max-tokens、空响应或流中断、被上游误分类的网络抖动——默认连续 3 次失败后停下，任何正常回复都会清零；额度与上下文总体超限一律不续，鉴权失败与请求被拒默认不续、可自行勾选。与 DSH「重试策略」重叠的 EMPTY_RESPONSE / SERVER / TIMEOUT / TRANSPORT 默认交给宿主在 step 内重试，只有当宿主本轮确实没在重试时才由本插件接手。所有开关都在客户端设置页。适用 DSH 0.2.1-rc.2 起、0.3.0 以下，Node 20 起。'