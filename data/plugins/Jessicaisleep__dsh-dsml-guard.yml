url: https://github.com/Jessicaisleep/dsh-dsml-guard
name: Jessicaisleep/dsh-dsml-guard
category: session
description:
  en: 'Strips DSML markers that leak into assistant prose, and resumes a turn when a "continue" genuinely helps — a marker-only leak that produced no output, a single-reply output token cap (max-tokens), or an error the host''s own retry policy never covers; codes the host already retries inside the step (EMPTY_RESPONSE, SERVER, TIMEOUT, TRANSPORT) are handed to it by default, and setting skipHostRetriedCodes: false restores the plugin''s own resume. Codes upstream miscategorises are split by message text, and consecutive resumes stop at 3 until a normal reply resets them; quota, rate-limit, auth and context-window errors, and user aborts, never resume. Requires DSH 0.2.1-rc.2 or newer, below 0.3.0, and Node 20 or newer.'
  zh: '抹掉漏进助手正文的 DSML 标记；只在发「继续」确实有用时补一条——毫无产出的标记泄漏、单次回复输出 token 到顶（max-tokens），以及宿主重试策略不覆盖的错误；与 DSH 0.2.2 起「重试策略」重叠的 EMPTY_RESPONSE / SERVER / TIMEOUT / TRANSPORT 默认交给宿主在 step 内重试，把 skipHostRetriedCodes 置 false 可恢复插件自己续跑。被上游误分类的错误码按报文细分；默认连续 3 次失败后停下，任何正常回复都会清零。额度、限流、鉴权、上下文总体超限与人为取消一律不续。适用 DSH 0.2.1-rc.2 起、0.3.0 以下，Node 20 起。'
