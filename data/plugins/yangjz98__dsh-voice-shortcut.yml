url: https://github.com/yangjz98/dsh-voice-shortcut
name: yangjz98/dsh-voice-shortcut
category: voice
description:
  en: 'Adds a configurable keyboard shortcut to the built-in DSH voice input button — Alt+V starts recording and a second press stops and transcribes; Esc closes an open voice row.'
  zh: '给 DSH 内置的语音输入按钮加可自定义的键盘快捷键：按 Alt+V 开始录音、再按一次停止并识别；Esc 关闭已打开的语音行。'