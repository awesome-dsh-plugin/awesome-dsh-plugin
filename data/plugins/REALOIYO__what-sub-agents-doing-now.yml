url: https://github.com/REALOIYO/what-sub-agents-doing-now
name: REALOIYO/what-sub-agents-doing-now
category: tools
description:
  en: 'Registers a read-only tool that lets a parent agent read what each subagent is actually doing, not just whether it is running: the progress notes the child wrote itself, oldest first, paged backwards by seq, plus how many steps passed since the last look, and a quiet count when five or more steps go by with no new note.'
  zh: '注册一个只读工具，让父代理读到每个子代理实际在做什么，而不只是它有没有在跑：子代理自己写下的进度旁白，时间早的在前，按序号向前翻页，给出距上次查看已过去多少步，并在连续五步以上没有新旁白时给出沉默计数。'
