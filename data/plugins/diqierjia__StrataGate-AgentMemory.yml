description:
  en: 'Recent conversations retain their details, while older conversations become more concise and can be expanded when needed. StrataGate helps DeepSeek Harness remember important information across sessions, using long-term Events and a topic directory to organize memories and find their sources. The knowledge graph is disabled by default and can be enabled as needed. You can also import existing memories from other AIs to carry that context into future conversations.'
  zh: '近期对话保留细节，久远对话逐渐简化，需要时可重新展开。StrataGate 帮助 DeepSeek Harness 跨会话记住重要信息，通过长期事件和主题目录整理记忆、查找来源；知识图谱默认关闭，可按需开启。也支持导入其他 AI 的已有记忆，让对话接着已有背景继续。'
