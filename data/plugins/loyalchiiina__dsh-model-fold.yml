url: https://github.com/loyalchiiina/dsh-model-fold
name: loyalchiiina/dsh-model-fold
category: model
description:
  en: 'Three-column cascade model picker (provider to model to reasoning effort) with one-click image and reasoning switches, capability icons, and real per-model availability probes whose results persist across restarts. Adapts DSH kernel 0.2.2-rc.3. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '三级级联模型面板（来源 → 模型 → 思考强度），支持识图与思考强度一键开关、能力图标，以及逐模型真实测活并把结果持久化保存。适配 DSH 内核 0.2.2-rc.3。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
