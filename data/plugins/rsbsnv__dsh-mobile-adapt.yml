url: https://github.com/rsbsnv/dsh-mobile-adapt
name: rsbsnv/dsh-mobile-adapt
category: ui
description:
  en: "Phone-friendly layout: the sidebar becomes a slide-out drawer with swipe gestures and adjustable width, layered back key, bigger tap targets, keyboard avoidance and a 15px font floor."
  zh: "手机端适配：侧栏（侧边栏）变成可滑动的抽屉，支持手势开关与宽度调节；返回键逐层退出、按钮放大、键盘不挡输入框、字号不小于 15px。"
