url: https://github.com/rsbsnv/dsh-mobile-adapt
name: rsbsnv/dsh-mobile-adapt
category: ui
description:
  en: "Turns the desktop layout into a thumb-friendly one: swipe drawer sidebar with adjustable width, layered back key, bigger tap targets, keyboard avoidance and a 15px font floor."
  zh: "把电脑版界面调成适合手指用的样子：侧栏变可滑动的抽屉、宽度可调、返回键逐层退出、按钮放大、键盘不挡输入框、字号不小于 15px。"
