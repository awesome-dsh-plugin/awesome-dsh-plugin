name: hui-xu-ai/wensu#dsh-wensu
category: tools
description:
  en: "Read-only literature search and full-text reading for DSH: ten MCP tools search CNKI and Web of Science through your own Edge/Chrome over a native-messaging bridge, export RIS/EndNote text, and save the article page you already have open as MHTML for offline Markdown conversion. No PDF or CAJ downloads; 900 ms minimum interval and a 300-action daily cap. Requires pip install wensu, wensu setup and loading the browser extension."
  zh: "只读的文献检索与全文读取：十个 MCP 工具通过原生消息桥驱动你自己的 Edge/Chrome，检索知网与 Web of Science、导出 RIS/EndNote 文本，并把已打开的论文页存成 MHTML 供离线转 Markdown。不下载 PDF/CAJ，最小间隔 900 毫秒，每日上限 300 次。需要先 pip install wensu、运行 wensu setup 并加载浏览器扩展。"
