url: https://github.com/ciskonc/dsh-context-imports
name: ciskonc/dsh-context-imports
category: memory
description:
  en: Reads the files that AGENTS.md references with @path imports and injects their content into model context, with byte budgets, compaction re-seeding and a six-language settings card. v0.7.0 expands the imports of every instruction file the harness loaded (including a project AGENTS.md picked up mid-session), supports quoted @"paths with spaces", decodes GBK/ANSI files via GB18030, reports ignored or depth-limited references explicitly, and offers an opt-in live mode (off by default) that watches injected files, re-injects on change and can wake only the session you used last (needs DSH 0.2.0+; use 0.2.x on DSH 0.1.7).
  zh: 把 AGENTS.md 里 @路径 引用的文件读出来，在会话启动时注入模型上下文；带字节预算、压缩后重新注入和六语言设置卡片。v0.7.0 会展开 DSH 已加载的所有指令文件里的引用（包括会话中途自动带进来的项目 AGENTS.md），支持带引号的含空格路径，GB18030 解码 GBK/ANSI 文件，对忽略或深度受限的引用明确标注，实时模式（默认关闭）可监听已注入文件、变更后重注入，并可只叫醒最近使用的会话（需 DSH 0.2.0+；DSH 0.1.7 请用 0.2.x）。
