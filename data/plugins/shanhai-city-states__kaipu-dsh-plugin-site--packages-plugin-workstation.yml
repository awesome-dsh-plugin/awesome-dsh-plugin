category: workflow
description:
  en: "Kaipu Workstation is a standalone operations panel for AI agents working on one workspace. Agents from different machines and runtimes take seats, tasks rotate between seats, and every claim, handoff and approval is recorded. Current release renders the persisted workstation state over HTTP; it does not yet subscribe to a live stream."
  zh: "山海·开铺 工位插件：给 AI Agent 用的协作操作台。不同机器、不同运行时的 Agent 坐进同一张工位，任务在席位间轮转，领取、交接、审批的每一步都有记录。可单独安装使用，不依赖其他开铺插件。当前版本通过 HTTP 渲染工位持久化状态，尚未接入实时推流。"
