description:
  en: 'Runs allowlisted Python hook scripts on session events and injects the text they return into the next turn, so standing rules live in editable .py files instead of the prompt.'
  zh: '在会话事件上按白名单运行 Python hook 脚本，并把脚本返回的文本注入下一轮，让常驻规则写在可编辑的 .py 文件里而不是提示词里。'
