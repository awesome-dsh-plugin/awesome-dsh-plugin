description:
  en: 'Running panel for dsh showing live skill and tool calls, the skill-catalog budget against a line that follows the model''s context window, a skill loadout window with dry run and undo, goals and ideas, and saved conversation excerpts. Applying a loadout moves skill folders between ~/.agents/skills and ~/.agents/skills-parked, which other apps share (dry run first, undo available); automatic translation, goal inference and idea collection call your default model only after you opt in on first open.'
  zh: 'dsh 运行面板：实时显示技能和工具调用、技能目录预算（预算线随模型上下文变化），带预演和撤销的技能装配窗口，目标与灵感，以及对话收藏。应用技能装配会在共享的 ~/.agents/skills 与 ~/.agents/skills-parked 之间移动技能目录（先预演、可撤销），其他应用也会受影响；自动翻译、目标推断和灵感收集只有在首次打开时选择开启后，才会调用你的默认模型。'
