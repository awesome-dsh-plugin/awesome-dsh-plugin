name: XDeemoH/PULSE
category: ui
icon: https://raw.githubusercontent.com/XDeemoH/PULSE/main/docs/logo.png
description:
  en: 'Running panel for dsh for skill management and visualizing skill calls: live skill and tool calls, the skill-catalog token budget against a line that follows the model''s context window, a skill loadout window that enables and disables skills in bulk with dry run and undo, goals and ideas, and saved conversation excerpts. Applying a loadout moves skill folders between ~/.agents/skills and ~/.agents/skills-parked, which other apps share (dry run first, undo available); automatic translation, goal inference and idea collection call your default model only after you opt in on first open.'
  zh: 'dsh 运行面板，用于技能管理与 Skill 调用可视化：实时显示技能调用和工具调用；技能目录占用的 token 预算，预算线随模型上下文窗口变化；技能装配窗口可批量启用、停用技能，带预演和撤销；另有目标与灵感、对话收藏。应用技能装配会在共享的 ~/.agents/skills 与 ~/.agents/skills-parked 之间移动技能目录（先预演、可撤销），其他应用也会受影响；自动翻译、目标推断和灵感收集只有在首次打开时选择开启后，才会调用你的默认模型。'
