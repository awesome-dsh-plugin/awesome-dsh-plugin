url: https://github.com/Aizai9527/dsh-session-finder
name: Aizai9527/dsh-session-finder
category: session
description:
  en: 'Search every DSH chat session and jump straight to the matching message: multi-keyword AND search, scoped to the current session, all sessions or one project, anchored by call id for tool hits, with a draggable panel for previous and next.'
  zh: 跨会话搜索 DSH 聊天记录并直接跳到命中的那条消息：多关键词同时匹配，可限定当前会话、全部会话或某个项目，工具命中按 callId 精确定位，浮层可拖拽并支持上一处、下一处。
