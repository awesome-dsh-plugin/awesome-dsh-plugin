description:
  en: 'Local LoRA and QLoRA fine-tuning in a panel: import JSONL, see a VRAM estimate before training starts, evaluate, and export an adapter. One-click Python environment install. Verified end to end on Windows 11 with an RTX 3060 6 GB; Linux and other GPUs are untested.'
  zh: '面板里的本地 LoRA / QLoRA 微调：导入 JSONL、开始前先看显存估算、评测并导出适配器。一键安装 Python 环境。已在 Windows 11 + RTX 3060 6 GB 上完整跑通；Linux 与其他显卡未测。'
