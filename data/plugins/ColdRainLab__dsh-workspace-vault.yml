description:
  en: 'Pin workspaces and tasks in the sidebar, with a password-protected hidden space and a workspace access lock. The lock only hides items in the interface and does not encrypt session files on disk; dsh-workspace-sync skips hidden and locked items.'
  zh: '在侧栏置顶工作区和任务，并提供密码保护的隐藏空间与工作区访问锁。锁只在界面上隐藏内容，不对磁盘上的会话文件加密；dsh-workspace-sync 会跳过隐藏和加锁的内容。'
