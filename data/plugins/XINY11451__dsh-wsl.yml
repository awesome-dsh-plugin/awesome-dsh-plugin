description:
  en: 'Linux-native DSH, extended to WSL. Multi-step work shares one long-lived shell (subtasks above the composer); one-off commands start clean, in parallel, with timeouts. A terminal you opened can be shared: visible, read-only until you take the keyboard back; from WSL, `dsh` speaks into a chosen conversation. Path conversion, environment checks; destructive commands ask first. Runs as you, below the DSH sandbox (it does not confine it).'
  zh: '把 DSH 扩展到 WSL。多步任务共用一个长期 shell，目录与环境保留、子任务列在输入框上方；自洽命令每次全新开始，可并行，带退出码、stdin 与超时。你打开的终端可协作：全程可见，只读至你点「接管输入」。WSL 终端里 `dsh` 可向指定对话发言并流式回显。另有路径互转、环境体检、工具链补装、后台作业；危险命令先征求同意。以你的身份运行，位于 DSH 沙箱之下。'
