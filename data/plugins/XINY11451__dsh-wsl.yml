description:
  en: 'WSL tools for DSH: run Linux commands (fresh shell, exit codes, timeouts, truncation spill, stdin), convert Windows↔WSL paths, report the WSL environment, and check a project''s toolchain against the distribution — including commands that are really Windows binaries. Long builds become background jobs; destructive commands need consent; root is a panel switch. A left-sidebar panel switches each capability, an opt-in patch adds WSL to the sidebar terminal picker, and WSL calls run below the DSH sandbox.'
  zh: 'DSH 的 WSL 工具：执行 Linux 命令（每次全新 shell、退出码、超时、截断落盘、可喂 stdin）、Windows↔WSL 路径互转、WSL 环境体检，并对照项目清单检查发行版里到底缺什么——包括那些其实是 Windows 二进制的命令。长任务转后台作业；危险命令需显式放行，root 执行是一项面板开关。左侧栏面板逐项开关，可选 patch 让侧边栏「新建终端」多一个 WSL 选项；WSL 调用位于 DSH 沙箱层之下。'
