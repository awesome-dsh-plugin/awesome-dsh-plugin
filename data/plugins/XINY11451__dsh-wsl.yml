description:
  en: 'Linux-native DSH, extended to WSL. Multi-step work shares one long-lived shell; one-off commands start fresh, in parallel, with timeouts. Files can be read, written, edited and searched inside the distribution. A terminal you opened is visible and read-only until you take the keyboard back; from WSL, `dsh` speaks into a chosen conversation. Path conversion, environment checks; destructive commands ask first. Runs as you, below the DSH sandbox.'
  zh: '把 DSH 扩展到 WSL。多步任务共用一个长期 shell，目录与环境保留、子任务列在输入框上方；自洽命令每次全新开始，可并行，带退出码与超时。文件可直接读写编辑搜索（原子写、保留权限）。你打开的终端全程可见，只读至你点「接管输入」；WSL 终端里 `dsh` 可向指定对话发言。另有路径互转、环境体检、工具链补装；危险命令先征求同意。以你的身份运行，位于 DSH 沙箱之下。'
