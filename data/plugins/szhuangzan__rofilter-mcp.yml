url: https://github.com/szhuangzan/rofilter-mcp
name: szhuangzan/rofilter-mcp
category: tools
description:
  en: 'Mounts the hosted ROFilter MCP service (rofilter.cn) through the in-box @deepseek-ai/dsh-mcp-client bridge. ROFilter is a reverse-osmosis membrane system design tool with a 742-element library across 8 brands (Veolia, DuPont, Toray, LG, Hydranautics, CSM, Vontron, Ovay), feed-water analysis, scaling assessment, and full multi-stage system design (feed pressure, permeate TDS, energy, per-stage flux). Ships a shared trial token (1,000 calls per day for all users) and run_design is metered, so use your own rofilter.cn token for real work.'
  zh: '通过内置的 @deepseek-ai/dsh-mcp-client 桥接接入托管的 ROFilter MCP 服务（rofilter.cn）。ROFilter 是一款反渗透膜系统设计软件，内置 742 件膜元件库（威立雅、杜邦、东丽、LG、海德能、CSM、沃顿、澳维 8 大品牌）、进水水质分析、结垢评估与完整多段系统设计（进水压力、产水 TDS、能耗、逐段通量）。自带一个所有用户共用的试用令牌（每天 1000 次调用），run_design 会计量，正式使用请换成你自己的 rofilter.cn 令牌。'
icon: https://raw.githubusercontent.com/szhuangzan/rofilter-mcp/main/logo.jpg
