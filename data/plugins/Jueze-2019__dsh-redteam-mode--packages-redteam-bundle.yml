url: https://github.com/Jueze-2019/dsh-redteam-mode/tree/main/packages/redteam-bundle
name: Jueze-2019/dsh-redteam-mode#packages/redteam-bundle
category: security
description:
  en: "Red-team engagement mode: send one target organization name and a planner session runs a five-role execution team (recon, asset triage, vulnerability discovery, exploitation, internal pivot) under a configurable concurrency limit; preflight checks skills/resources and asks once for missing keys or VPS; scoring follows the 8-category / 25-point merged intrusion rules with server-side caps, highest-privilege-wins and per-service dedup; findings stay in a local SQLite fact base with discovery times. The persistent right-side console has five sections / ten pages (situation, assets, findings, report, resources), follows the selected session, and includes asset mapping, agent roster, tunnels, findings, attack chain, score targets, reports, a category-organised POC/EXP knowledge base and a skill library that explains every unusable skill. Reports now download with the target's name, include the same full actions/requests/credentials/tunnels/attack-file paths as the page, and avoid false reproduction gaps. Ships 16 bundled recon/assessment skills including DeepSeek Search/Fetch public-intel, 56 redteam_* tools and one-command self-update; attack-chain skills remain a separate toolkit Release attachment."
  zh: "红队作战模式：只发一个靶标单位名称，主会话指挥五个执行角色（信息收集/资产梳理/漏洞发现/漏洞利用/内网渗透）推进演练，并发数可配置；开工前先做技能与资源预检，缺 key 或 VPS 一次性向用户要齐；得分对齐《突破入侵类得分规则（合并版）》8 类 25 项，上限、权限取高、同服务去重均由服务端判定。发现落入本机 SQLite 事实库并带发现时间；右侧常驻控制台为 5 个分区 / 10 个页面（态势、资产、成果、报告、资源），跟随当前会话，包含资产测绘、智能体、会话隧道、漏洞战果、攻击链、得分目标、报告、按归类组织的 POC/EXP 知识库，以及逐条说明不可用原因的技能库。报告下载文件名使用靶标名，下载与页面同源，补齐动作、请求、凭据、隧道与攻击文件路径，并减少误报复现缺口。随包 16 个侦察/检测向技能（含 DeepSeek Search/Fetch 公开情报）、56 个 redteam_* 工具与一键自更新；攻击链技能仍作为独立工具箱 Release 附件。"
