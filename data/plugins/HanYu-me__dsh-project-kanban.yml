name: HanYu-me/dsh-project-kanban
category: ui
description:
  en: 'A project kanban in the dsh sidebar. Every project gets its own section with four fixed columns (todo, in progress, feedback, done); add, rename, recolor, reorder and delete projects and tasks, advance a task with one click, reorder by drag and drop or with the card menu, undo a deletion, and collapse a project. Clicking a project opens a page for its key data and results: two trees (data on the left, results on the right) you arrange by drag and drop and merge into chapters, lines that show which result came from which data, stars with a star-only view of the same tree, relations between results, colours by category, and undo or redo with Cmd+Z. Colours, radii and shadows come from the dsh theme, so it follows light and dark, and the layout reflows from four columns to two to one.'
  zh: 'dsh 侧边栏里的项目看板。每个项目一个区块，固定四列（待办 / 进行中 / 待反馈 / 已完成）：新建、重命名、换色、排序、删除项目和任务，点一下把任务推到下一列，拖拽或卡片菜单调整顺序，删除可撤销，项目可折叠。点开项目还有一个「数据与结果」页：左边数据树、右边结果树，可拖拽整理、合并成章节、连线看出结果来自哪份数据；节点可加星标并「只看星标」，让结果之间互相关联，按类别给节点和连线着色，支持撤销 / 重做（Cmd+Z）。颜色、圆角和阴影取自 dsh 主题变量，跟随浅色 / 深色，宽度不够时从四列变两列再变单列。'
