description:
  en: 'Six material skins for the DSH Web GUI — Ink Jade, Terracotta, Aurora, Abyss, Sakura Mist and Paper — painted with CSS only: one engine derives the 119 --dsw-* alias tokens from six colour inputs per appearance, Alt+K cycles skins, and the choice is remembered in localStorage. No images, no host route.'
  zh: '六套材质皮肤：墨玉、赤陶、极光、深海、樱雾、素笺。纯 CSS 绘制，一套引擎由六个输入色推导全部 119 个 --dsw-* 别名 token，Alt+K 轮换，选择记在浏览器本地；不含图片，不注册宿主路由。'
