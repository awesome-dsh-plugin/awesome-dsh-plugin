url: https://github.com/zhangkaiqiu/dsh-dev-launcher
name: zhangkaiqiu/dsh-dev-launcher
category: dev
description:
  en: 'Saves per-workspace dev commands behind a header button, starts and stops them as process trees, and exposes four tools so the agent can list, start and stop those saved commands and read their logs (it cannot add or change commands).'
  zh: '按工作区保存开发启动命令，在会话头部一键启停并以进程树方式管理，同时注册四个工具，让会话列出、启停这些已保存的命令并读日志（不能新增或修改命令）。'
