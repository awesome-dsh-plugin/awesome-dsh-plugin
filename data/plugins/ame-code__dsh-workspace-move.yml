url: https://github.com/ame-code/dsh-workspace-move
name: ame-code/dsh-workspace-move
category: session
description:
  en: 'Moves a workspace to another folder from its right-click menu: renames the folder, carries its nested workspaces and sessions along, rewrites their records, rolls back if anything fails, and can be undone in one click.'
  zh: '在工作区右键菜单里把整个工作区搬到另一个目录，顺带重命名：嵌套工作区与会话一起迁移并改写记录，失败自动回滚，移动后可一键撤销。'
