Plugin repository: https://github.com/Velestia-star/agent-skill

The plugin adds a sidebar panel for creating named subagents and skills, plus a `delegate_agent` tool that calls a subagent by name in the current conversation. Each subagent chooses its model, reasoning effort, spawn/fork mode, tool allowlist and attached skills. Skills are ordinary `SKILL.md` bundles and can be global, per workspace, or limited to selected conversations. It also includes a read-only per-conversation agent tree in the session header.

Verification: `node --check index.js`, `node --check client.js`, and `node --test test/host.test.mjs` (43/43 pass) in the repository; package version 0.3.0; DSH engines `>=0.2.2-rc.1`.