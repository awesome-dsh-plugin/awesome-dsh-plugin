url: https://github.com/eghrhegpe/dsh-connect-atomcode
name: eghrhegpe/dsh-connect-atomcode
category: tools
description:
  en: 'Bridges the AtomCode terminal AI coding assistant already signed in on this machine into DeepSeek Harness as two side tools: atomcode_ask (a side-conversation relay with per-working-directory session continuity) and atomcode_review (a one-shot, bounded code review with structured findings). atomcode_ask needs no API key and takes over no model — it reuses the AtomCode session already signed in on this machine. atomcode_review additionally requires a direct provider (standard API with an explicit api_key) configured in DSH; without one it refuses before calling. The settings card adds a read-only CodingPlan quota read-out, and each tool names its own model default.'
  zh: '把本机已登录的 AtomCode 终端 AI 编程助手接入 DeepSeek Harness，提供两个侧边工具：atomcode_ask（带按工作目录会话连续的侧边咨询）与 atomcode_review（有界的一次性代码评审、结构化 findings）。atomcode_ask 无需配置 API key、不接管模型，直接复用本机已登录的 AtomCode 会话；atomcode_review 还需要在 DSH 里配一个直连 provider（标准 API、显式 api_key），没配时会在调用前直接拒绝。设置卡片只加一个只读的 CodingPlan 额度读数，且两个工具各自点名自己的模型默认值。'
