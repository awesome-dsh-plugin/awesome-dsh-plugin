name: Dariandai/dsh-starter-pack
category: tools
description:
  en: 'A curated plugin starter pack: batch-installs and configures 15 vetted community plugins across four groups from a Settings-page UI or the /setup command.'
  zh: 精选插件启动包：从设置页或 /setup 命令一键批量安装并配置 4 组共 15 个经过筛选的社区插件。
  ja: 厳選プラグインのスターターパック。4 グループにわたる検証済みのコミュニティプラグイン 15 個を、設定ページの UI または /setup コマンドから一括でインストールして設定します。
