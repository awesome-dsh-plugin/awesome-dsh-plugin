url: https://github.com/paleech0/dsh-notify-desktop
name: paleech0/dsh-notify-desktop
category: notify
description:
  en: 'Windows native toast notifications for DSH desktop sessions: turn ends, approvals, questions and a reminder for an unanswered wait — each with its own sound and popup text (up to three named templates per situation), three delivery modes, previews, and imported custom sounds. Clicking a toast raises the DSH window.'
  zh: 'DSH 桌面端会话的 Windows 原生 Toast 通知：回合结束、审批、提问与未应答催办，每个情况可单独选择音效与弹窗文本（每个情况最多 3 套命名模板），支持三种通知形式、预览效果与导入自定义音效；点击通知把 DSH 窗口拉回前台。'
