url: https://github.com/zztand/dsh-lan-bridge
name: zztand/dsh-lan-bridge
category: remote
description:
  en: 'Hand a task to DSH on another computer in the same LAN. Both sides run the same bundle, discover each other over UDP, and dispatch over plain HTTP with the attached files streamed and sha256-checked. The remote DSH runs the agent turn in its own session, publishes live progress back, and returns the answer plus every produced file to the conversation that dispatched it. Includes approval tokens, a shared secret, resume of half-transferred jobs, disk-free pre-check, fan-out to several machines, and an offline USB package path for air-gapped peers. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把任务交给同一局域网里另一台电脑上的 DSH。两台装同一个 bundle，用 UDP 互相发现，走普通 HTTP 派活，附带的文件流式传输并做双端 sha256 校验。远端在自己的会话里跑完 agent 回合，实时回传进度，最后把结论和所有产物送回发起派活的那个对话。带准入令牌与共享口令、传一半断了能续传、盘满预检、一次分给多台，以及给不通网机器的 U 盘离线包路径。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
