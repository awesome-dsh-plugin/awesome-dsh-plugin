url: https://github.com/jkt-check/dsh-secret-scrub
name: jkt-check/dsh-secret-scrub
category: security
description:
  en: 'Irreversible secret-scrubbing guard: rewrites access keys, bearer tokens, and private key blocks into `[REDACTED:<category>]` placeholders before they reach the session log and the model.'
  zh: '不可逆密钥脱敏守护：在访问密钥、Bearer 令牌、私钥块进入会话日志和模型请求之前，将其改写为 `[REDACTED:<category>]` 占位符。'
