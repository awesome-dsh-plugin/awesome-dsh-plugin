description:
  en: 'Helps students and programming beginners learn technical English while working in Chinese, Spanish, Japanese, or Korean. Each reply gives terms a brief meaning in the reply language, then reuses the English name. Supports Codex on macOS; DSH requires 0.2.2-rc.1, the dedicated entry and Flash/High.'
