url: https://github.com/PerryLink/dsh-defend
name: PerryLink/dsh-defend
category: security
description:
  en: 'Prompt-injection, jailbreak, and secret-leak detection with allow/ask/block interception for DeepSeek Harness: an Aho-Corasick pattern engine gates user messages on agent/pre-step, tool arguments on tools/pre-execute, and tool results on tools/post-execute, with sanitized defend/* session audit events, a defend_report tool, and a /defend command.'
  zh: '提示注入/越狱/密钥泄露检测，allow/ask/block 三档拦截：Aho-Corasick 模式引擎分别在 agent/pre-step 拦截用户消息、tools/pre-execute 拦截工具参数、tools/post-execute 拦截工具结果，脱敏 defend/* 审计事件 + defend_report 工具 + /defend 命令。'
