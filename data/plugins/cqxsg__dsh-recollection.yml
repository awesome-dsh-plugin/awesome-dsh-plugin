description:
  en: Lets DeepSeek Harness agents autonomously search and revisit original history from the current session that has been removed from the model's context by compaction.
  zh: 让 DeepSeek Harness Agent 自主检索并回读当前会话中因上下文压缩而退出模型可见上下文的原始对话历史。
