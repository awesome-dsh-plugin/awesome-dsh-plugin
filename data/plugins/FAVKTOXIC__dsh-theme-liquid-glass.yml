url: https://github.com/FAVKTOXIC/dsh-theme-liquid-glass
name: FAVKTOXIC/dsh-theme-liquid-glass
category: theme
description:
  en: 'Apple Liquid Glass theme for DSH Web UI: frosted translucent token surfaces, dynamic wallpaper (URL/HTML/image/video), tunable blur/refraction/tint/brightness, and SVG edge refraction on the input card, send button, bubbles, view tabs, queue dock and sidebar.'
  zh: '苹果液态玻璃主题：半透明磨砂 UI 层、动态壁纸（网页/HTML/图片/视频）、可调磨砂/折射/颜色/亮度，输入框、发送按钮、消息气泡、视图标签、队列坞和侧边栏按钮的边缘折射效果。'