name: kleinklein0824/dsh-deepseek-atlas
category: ui
description:
  en: 'DeepSeek model almanac for DSH: long-press or right-click the composer model control to browse model families and a 31-day release calendar, compare models, and view pricing synced from api-docs.deepseek.com. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 的 DeepSeek 模型档案：长按或右键输入框模型控件，浏览模型家族与 31 天发布月历、对比模型，并查看从 api-docs.deepseek.com 同步的定价。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
