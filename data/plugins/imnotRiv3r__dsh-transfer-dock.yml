  en: 'Observes detected background download commands and renders live cards with bytes, speed and ETA; silent downloads get a total from a HEAD probe. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '观察识别到的后台下载命令并显示实时进度卡片（字节、速度、剩余时间）；静默下载用 HEAD 探测总量。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
