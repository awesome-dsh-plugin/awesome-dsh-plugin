  en: 'Xuyi (续忆), local long-term memory for QQ companion chats: archives QQ private and group messages to a local SQLite file, recalls earlier statements with their original wording through automatic recall and the `xuyi_recall` tool, writes a daily diary, supports backup export/restore, and ships 11 persona presets with a first-run setup guide.'
  zh: '续忆（Xuyi），QQ 陪伴聊天的本地长期记忆：把 QQ 私聊和群聊消息存进本机 SQLite，通过自动召回和 `xuyi_recall` 工具带原话找回以前说过的事，每天写一篇日记，支持备份导出与恢复，附 11 套人设和首次安装引导。'
