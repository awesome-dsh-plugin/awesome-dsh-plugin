name: littleblakew/msds-chain-mcp#dsh
category: tools
description:
  en: 'Chemical safety intelligence through the hosted MSDS Chain MCP endpoint: 23 tools for compatibility and mixing order, GHS hazards, PPE, storage, waste disposal, exposure limits, transport classification, multi-region regulatory compliance, SDS lookup and version diffs, and signed audit reports, each answer citing the supplier SDS and revision date it is grounded in.'
  zh: 通过托管的 MSDS Chain MCP 端点接入化学品安全数据：23 个工具覆盖相容性与投料顺序、GHS 危害、PPE、储存、废弃处置、职业接触限值、运输分类、多法域合规、SDS 查询与版本比对、签名审计报告；每条回答都标注其依据的供应商 SDS 与版本日期。
  ja: ホスト型の MSDS Chain MCP エンドポイントを通じた化学安全の情報提供。混合の可否と投入順序、GHS の危険有害性、保護具、保管、廃棄、ばく露限界値、輸送分類、複数地域の法規制対応、SDS の検索とバージョン差分、署名付きの監査レポートまで 23 のツールを備え、各回答には根拠とした供給者の SDS と改訂日が明記されます。
