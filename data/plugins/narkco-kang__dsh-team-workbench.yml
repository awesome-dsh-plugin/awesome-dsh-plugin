url: https://github.com/narkco-kang/dsh-team-workbench
name: narkco-kang/dsh-team-workbench
category: ui
description:
  en: 'A DS-Bot-style chat workbench for a named agent team: each member has its own model routes and a 3D mascot avatar, private chats and group rooms with mention relay and bounded parallelism, whole-department agents whose sub-agents run in parallel before the lead synthesizes, plus record search with highlight and time buckets, layered memory, local/cloud speech input and an avatar library.'
  zh: '把一支具名智能体团队做成聊天工作台：成员各有模型路由与 3D 头像，支持私聊、群聊（点名接力、受限并行）；整个部门可以是一个智能体，内部子智能体并行执行后由主管汇总；另有带高亮与时间分组的记录检索、分层记忆、本地/云端语音输入与头像素材库。'
