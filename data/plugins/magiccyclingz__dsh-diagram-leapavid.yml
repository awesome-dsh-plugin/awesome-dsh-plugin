description:
  en: 'Sidebar studio with 50 diagram templates that prepares a prompt and opens a new conversation to generate a single-file HTML diagram. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '侧栏图表工坊：50 种图表模板，填好内容后准备提示词并新建会话，生成单文件 HTML 图表。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
