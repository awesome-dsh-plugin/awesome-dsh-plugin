category: fun
description:
  en: "Local meme-sticker library: import from a file, a folder or the agent tool, tag images in a review queue you confirm yourself, group them, then let the agent search and send by mood. A design descendant of Loping151/dsh-nekowhale-stickers (no shared code; its sticker_* tool names differ, so the two can be installed side by side)."
  zh: "本地表情包库：从文件、文件夹或工具导入，在待识别队列里由你确认后才打标签，分组管理，再让 agent 按情绪检索发图。功能设计参考 Loping151/dsh-nekowhale-stickers，代码自写、工具名不同，可与上游并存。"
