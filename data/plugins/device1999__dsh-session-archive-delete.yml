url: https://github.com/device1999/dsh-session-archive-delete
name: device1999/dsh-session-archive-delete
category: session
description:
  en: 'Adds backup-then-delete and delete-only actions to the DSH session menu: the session directory, its projection cache and a metadata snapshot are copied to a local archive folder and checked file by file, then the originals are deleted to free disk space; subagent sessions it spawned are handled in the same run, and each backup folder keeps a RESTORE.txt with recovery steps. Keywords: 会话删除; 删除会话; 清理会话; 备份删除; 彻底删除; 会话管理; 释放磁盘空间; 子代理会话; session-delete; delete-session; session-cleanup; session-cleaner; remove-session; dsh-session; disk-space; subagent; deepseek-harness; dsh; dsh-plugin; session; delete; backup; archive; cleanup.'
  zh: '给 DSH 会话「…」菜单加「备份删除」与「彻底删除」两个入口：先把会话目录、投影缓存和元数据快照复制到本地归档文件夹并逐文件校验，通过后再删除原件以释放磁盘空间；派生的子代理会话一并处理，每个备份文件夹都带 RESTORE.txt 恢复步骤。关键词：会话删除；删除会话；清理会话；备份删除；彻底删除；会话管理；释放磁盘空间；子代理会话；session-delete；delete-session；session-cleanup；session-cleaner；remove-session；dsh-session；disk-space；subagent；deepseek-harness；dsh；dsh-plugin；session；delete；backup；archive；cleanup。'
