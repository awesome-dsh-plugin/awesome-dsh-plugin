url: https://github.com/device1999/dsh-session-archive-delete
name: device1999/dsh-session-archive-delete
category: session
description:
  en: 'Adds backup-then-delete and delete-only actions to the DSH session menu: a safe session-delete tool that copies the session directory, its projection cache and a metadata snapshot to a local archive folder and checks them file by file before deleting a session to free disk space; subagent sessions it spawned are handled in the same run, and each backup folder keeps a RESTORE.txt with recovery steps.'
  zh: '给 DSH 会话「···」菜单加「备份删除」与「彻底删除」两个入口：这是一个安全的会话删除工具（session-delete），删除会话前先把会话目录、投影缓存和元数据快照复制到本地归档文件夹并逐文件校验，通过后再删除原件以释放磁盘空间；派生的子代理会话一并处理，每个备份文件夹都带 RESTORE.txt 恢复步骤。'
