description:
  en: "Ranks DSH plugins by real monthly npm downloads instead of GitHub stars, and names the plugins that star ordering under-rates. It reports the disagreement between the two orderings rather than a single quality verdict, and every number is a live read from npm's public downloads endpoint at call time, not a stored snapshot. A second dimension answers what downloads cannot: it reads the tools version line a plugin declares in peerDependencies and compares it with the version running here, so a popular plugin that cannot be installed on this host is reported instead of recommended. Read-only GETs, no HTTP route of its own."
  zh: "按真实 npm 月下载量给 DSH 插件排名，而不是按 GitHub 星数，并点名被星数排序低估的插件。它报告的是两种排序之间的分歧，而不是给一个综合质量结论；显示的每个数字都是调用时从 npm 公开下载接口现读的，不是存下来的快照。第二个维度回答下载量回答不了的问题：读插件在 peerDependencies 里声明的 tools 版本线，和本机实际运行的版本比，因此「很热门但在本机装不上」的插件会被报出来，而不是被推荐。只发只读 GET，自身不注册 HTTP 路由。"
