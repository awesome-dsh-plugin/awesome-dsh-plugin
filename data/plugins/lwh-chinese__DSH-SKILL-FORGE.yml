url: https://github.com/lwh-chinese/DSH-SKILL-FORGE
name: lwh-chinese/DSH-SKILL-FORGE
category: skill
description:
  en: Adds a left-sidebar panel to list, view, hide, create and delete installed skills, a make-skill agent preset, and GitHub skill search. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 提供左侧栏面板，用于列出、查看、隐藏、新建和删除已安装的 skill，并附带制作 skill 预设与 GitHub skill 搜索。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
