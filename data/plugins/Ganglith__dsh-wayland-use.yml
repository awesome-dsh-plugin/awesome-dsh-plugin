url: https://github.com/Ganglith/dsh-wayland-use
name: Ganglith/dsh-wayland-use
category: tools
description:
  en: 'Wayland desktop control for GNOME/Mutter sessions: screenshot, OCR with screen coordinates, click by text, and batch input actions. Needs a Python 3 backend with python3-gi and GStreamer; OCR needs Tesseract.'
  zh: 'GNOME/Mutter 下的 Wayland 桌面控制：截图、带坐标的 OCR、按文字点击，以及批量输入动作。后端为 Python 进程，需 python3-gi 与 GStreamer；OCR 需 Tesseract。'
