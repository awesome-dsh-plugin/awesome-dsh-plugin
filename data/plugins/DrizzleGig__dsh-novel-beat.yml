name: DrizzleGig/dsh-novel-beat
category: workflow
description:
  en: 'Let the story go where you decide. Beat puts the plot of your novel back in your hands: whose fate turns, which relationship shifts, when a secret comes out, which major turn the story takes. Decide the road, revisit every decision the book has made, and see what the alternatives were. Want to change a turn? The Beat panel lays out every decision by chapter, previews exactly what a change touches (prose, established facts, later chapters), then reverts safely and lets you choose again. Past routes stay readable, so changing your mind no longer means losing the old draft. Off by default; it never writes your prose.'
  zh: '让故事怎么发展，由你决定！「拍板」帮助小说作者掌控全书剧情走向。人物命运、关系变化、秘密揭晓、重大转折，每一个重要选择都由你做主。你可以决定故事走哪条路，也能随时回看全书做过的选择，了解当初还有哪些可能。想改变剧情？右栏「拍板台」让你一眼看清全书决策，提前预览改动会影响哪些正文、设定和后续剧情，再安全回退、重新选择。过去的故事路线依然可以查看，不必害怕推翻旧决定。默认关闭，不写正文，每个选择都有迹可循。'
