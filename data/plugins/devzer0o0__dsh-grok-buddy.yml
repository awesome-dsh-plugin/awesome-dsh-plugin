description:
  en: 'Puts Grok Bot''s own face in the DSH sidebar session list: each row''s status dot becomes a living GrokBot avatar whose six motions read as idle, working, waiting, blocked, thinking and done — color marks the project, motion marks the state. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把 Grok Bot 本人那张脸装进 DSH 侧栏会话列表：每行的状态圆点变成会动的 GrokBot 头像，六种动作分别对应空闲、处理中、等待、已阻止、思考与完成——颜色标记项目，动作标记状态。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
