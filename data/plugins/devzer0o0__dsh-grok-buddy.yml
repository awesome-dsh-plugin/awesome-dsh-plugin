name: devzer0o0/dsh-grok-buddy
category: ui
description:
  en: 'Replaces the session status dot in the DSH sidebar with a Grok Bot avatar whose expression carries the state: eight DSH phases map onto the six official Grok Bot lifecycle stages (Idle, Thinking, Working, Waiting, Blocked, Done) using the ink colors published by xAI, with the eyes filled from the actual sidebar background so light and dark themes stay consistent.'
  zh: '把 DSH 侧栏会话行里那颗状态圆点换成 Grok Bot 头像，用表情表达状态：8 个 DSH 相位映射到官方六个生命周期（Idle / Thinking / Working / Waiting / Blocked / Done），墨色取自 xAI 公布的 Grok Bot 配色；眼睛按侧栏实际底色填充，明暗主题都对得上。'
icon: https://raw.githubusercontent.com/devzer0o0/dsh-grok-buddy/main/assets/icon-180.png
