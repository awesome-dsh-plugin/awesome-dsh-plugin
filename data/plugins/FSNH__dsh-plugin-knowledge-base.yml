name: FSNH/dsh-plugin-knowledge-base
category: docs
description:
  en: 'Local knowledge base for DeepSeek Harness: a folder tree, in-app viewing of the original layout of Office files, PDFs and images, Chinese-friendly full-text search with optional vector fusion, image descriptions produced by a vision model so pictures become searchable, and three read-only tools the model calls to list, search and read files.'
  zh: '个人本地知识库：树状目录、Office / PDF / 图片的原版式阅读、中英文全文检索（可选向量融合）、用视觉模型把图片描述成文字后也能搜；模型可通过三个只读工具列出、检索并读取文件。'
