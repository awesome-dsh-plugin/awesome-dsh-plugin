description:
  en: 'Cache-first code exploration: the rdd_explore tool queries the project''s .rdd/exploration index and, on a miss, dispatches a read-only worker subagent to explore and register findings; rdd_models serves the live model catalog for dispatch-time model selection.'
  zh: 缓存优先的代码探索：rdd_explore 工具查询项目 .rdd/exploration 索引，未命中时派遣只读 worker 子代理探索并注册产物；rdd_models 提供实时模型目录，用于派遣时选模型。
