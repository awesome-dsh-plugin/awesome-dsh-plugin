description:
  en: "Rewrites the New Session hero headline with a short greeting written by the model the session already uses, from the local time, the current city and the live weather; falls back to a local time-based greeting when no model is reachable."
  zh: "用新会话已选定的模型，按当地时间、城市与实时天气写一句简短问候，替换首屏标题；没有可用模型时退回本地按小时计算的问候。"
