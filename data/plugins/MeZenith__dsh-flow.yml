url: https://github.com/MeZenith/dsh-flow
name: MeZenith/dsh-flow
category: workflow
description:
  en: Adds five switchable workflow modes (Plan, Plan Ultra, Build, Review, Flow) to DSH, with layered prompt injection, a numbered document pipeline, approval gates answerable from desktop or Feishu/IM, and an error circuit breaker. All HTTP routes authenticate requests through DSH ctx.connection.requestRejection.
  zh: 为 DSH 增加 Plan / Plan Ultra / Build / Review / Flow 五种可切换工作流模式，包含分层提示词注入、编号文档流水线、桌面与飞书/IM 双向审批门禁及连续报错熔断器。所有 HTTP 路由均已通过 DSH ctx.connection.requestRejection 接入宿主准入认证。
