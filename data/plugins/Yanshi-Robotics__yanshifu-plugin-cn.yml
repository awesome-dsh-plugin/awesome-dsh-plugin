description:
  en: 'Adds three skills (yanshifu, ask, update) for the Let''s Build Robots SO-101 course: one reads the learner''s project files (environment, calibration, teleop logs, camera config, datasets, training checkpoints) and reports which lesson they are on and what to do next; the other answers questions from four handbooks; update checks the newest episode and installs it when behind.'
  zh: '三个技能（yanshifu、ask、update）：yanshifu 读学员的项目产物（环境、校准、遥操日志、相机、数据集、训练检查点）判断他做到哪一集并给下一步；ask 只答《偃师傅的 SO-101 落地指南》等四份资料里的问题；update 把资料更新到最新一集。'
