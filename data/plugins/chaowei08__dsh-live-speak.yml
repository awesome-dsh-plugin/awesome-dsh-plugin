name: chaowei08/dsh-live-speak
category: voice
icon: https://raw.githubusercontent.com/chaowei08/dsh-live-speak/main/icon-180.png
description:
  en: 'Reads assistant replies aloud while they stream: sentence-by-sentence speech with highlighted lines in a sidebar player, pause, mute and stop controls, and automatic quieting for code blocks. The speech engine is switchable: Edge TTS online by default, or the operating system local voices. Its HTTP routes do not verify the caller, so any program that can reach the local DSH port can call them.'
  zh: '边生成边把回复念出来：按句合成语音，侧栏播放器里当前句逐句滚动高亮，可暂停、静音、停止，遇到代码块自动静音。语音引擎可切换，默认用线上 Edge 语音，也可改用操作系统本机声线。它的 HTTP 路由不校验调用方，任何能访问 DSH 本地端口的程序都可以调用。'
