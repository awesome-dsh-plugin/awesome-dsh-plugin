description:
  en: 'Turn your phone into a full-featured camera for dsh sessions (requires the companion app; open source — install the plugin and scan the QR code it shows to get the app): 1. Live viewfinder over LAN or USB, injectable into the chat or savable to a folder. 2. Callable tools let the dsh model take photos, zoom, and switch lenses on demand mid-conversation, so in fully automated workflows the model can actively "see" the physical world. 3. Full zoom/flash, crop, and annotation. 4. Rich settings.'
  zh: 手机变 dsh 会话的全功能摄像头（需配合手机 App；App 已开源，安装插件后扫插件提供的二维码即可下载）：1. 局域网或 USB 直连实时取景，画面可直接注入对话框或保存到指定位置；2. 提供可调用工具，dsh 模型可在流式对话中按需主动拍照/变焦/切换镜头，便于全自动开发中模型主动"看见"物理世界；3. 提供完整的变焦/闪光灯、照片裁剪、标注等功能；4. 提供丰富的设置选项。
