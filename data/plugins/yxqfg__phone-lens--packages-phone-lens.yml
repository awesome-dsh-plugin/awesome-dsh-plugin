name: yxqfg/phone-lens#phone-lens
category: vision
tarball: https://github.com/yxqfg/phone-lens/releases/latest/download/phone-lens.tgz
description:
  en: 'Turn your phone into a full-featured camera and portable session terminal for dsh (requires the open-source Android companion app — install the plugin and scan the QR code it shows to download the APK): 1. Live viewfinder over LAN or USB, injectable into the chat or savable to a folder. 2. Callable tools let the dsh model take photos, zoom, and switch lenses on demand mid-conversation, so in fully automated workflows the model can actively "see" the physical world. 3. Full zoom/flash, crop, and annotation. 4. Work (Beta): the phone joins dsh sessions directly — live conversation with Markdown/LaTeX rendering, approval & question cards, slash commands, @ references, session fork/archive, and artifact downloads; multiple phones can collaborate at once. 5. Rich settings.'
  zh: 手机变 dsh 会话的全功能摄像头与随身会话终端（需配合开源的 Android 手机 App——安装插件后扫插件提供的二维码即可下载 APK）：1. 局域网或 USB 直连实时取景，画面可直接注入对话框或保存到指定位置；2. 提供可调用工具，dsh 模型可在流式对话中按需主动拍照/变焦/切换镜头，便于全自动开发中模型主动"看见"物理世界；3. 提供完整的变焦/闪光灯、照片裁剪、标注等功能；4. 工作(Beta)：手机直接参与会话——实时对话（Markdown/LaTeX 渲染）、审批与提问卡片、斜杠命令、@ 引用、新建/fork/归档会话、工作文件下载，多台手机可同时在线协作；5. 提供丰富的设置选项。
