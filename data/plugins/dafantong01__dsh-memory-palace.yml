url: https://github.com/dafantong01/dsh-memory-palace
name: dafantong01/dsh-memory-palace
category: memory
description:
  en: 'Local long-term memory for DSH sessions: archives older turns under context pressure, with a turn-summary index for faster turn lists, statistics, window probing and archive planning; the index rebuilds automatically when unavailable, and a manual full verification is available. Includes project-document filters for enabled/disabled/archived entries, dual user/assistant turn previews, four tiered hot-memory boards, project documents, memory families with editable family names and root transfer that preserves project hot memory, summary keyword locator with segment-level candidates and paging, manual injection, 20K segmented reads, and tag-related retrieval. Includes staged recall cues and post-install version verification. All data stays in the workspace.'
  zh: 'DSH 会话的本地长期记忆：上下文压力升高时归档较早轮次，提供轮次摘要索引（列表、统计、窗口与归档规划更快；索引不可用时自动重建，并支持手动全量校验）、项目档案启用/停用/归档筛选、轮次用户与助手双摘要，以及四板块分级热记忆、项目档案、记忆家族与根转移（家族名可独立修改，转移保留项目热记忆）、摘要关键词定位与段级候选翻页、手动注入、20K 分段读取和 tag 关联检索；包含分级回忆 cue 与安装后版本校验。数据都保存在工作区。'
