url: https://github.com/dafantong01/dsh-memory-palace
name: dafantong01/dsh-memory-palace
category: memory
description:
  en: 'Local long-term memory for DSH sessions: archives older turns under context pressure, with four tiered hot-memory boards, project documents, trivia notes (short, non-injected), a tag graph with prominence ranks and synonym expansion, memory families with root transfer, summary keyword locator, manual injection, 20K segmented reads, and tag-related retrieval. All data stays in the workspace. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 会话的本地长期记忆：上下文压力升高时归档较早轮次，提供四板块分级热记忆、项目档案、不注入的杂事随记、带瞩目等级与同义词扩展的关系图谱、记忆家族与根转移、摘要关键词定位、手动注入、20K 分段读取和 tag 关联检索。数据都保存在工作区。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
