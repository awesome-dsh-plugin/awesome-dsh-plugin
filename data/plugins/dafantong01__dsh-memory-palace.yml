description:
  en: 'Local long-term memory for DSH sessions: archives older turns under context pressure, with four tiered hot-memory boards, project documents, memory families and root transfer, summary keyword locator with segment-level candidates and paging, manual injection, 20K segmented reads, and tag-related retrieval. Includes staged recall cues and post-install version verification. All data stays in the workspace.'
  zh: 'DSH 会话的本地长期记忆：上下文压力升高时归档较早轮次，提供四板块分级热记忆、项目档案、记忆家族与根转移、摘要关键词定位与段级候选翻页、手动注入、20K 分段读取和 tag 关联检索；包含分级回忆 cue 与安装后版本校验。数据都保存在工作区。'
