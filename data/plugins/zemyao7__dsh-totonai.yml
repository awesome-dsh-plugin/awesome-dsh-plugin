  en: "Account-based access to the ToTonAI gateway inside DeepSeek Harness: sign in or register in the settings panel, use 65 mainstream models (GPT, Claude, Gemini, DeepSeek, Doubao, Grok, GLM), and pick a plan then pay by QR code in the same panel. Upstream API keys stay on the server."
