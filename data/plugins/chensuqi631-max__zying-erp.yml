description:
  en: '搞薯条ERP — full-source Amazon product research / follow-sell / listing suite for DeepSeek Harness, shipped as a DSH plugin (11 zying_* tools + 4-tab UI) plus a bundled MV3 browser extension under extension/. ERP backend runs locally on port 3088: multi-link collection (seller storefronts, search, category, bestseller, product pages) with a one-click full-flow mode (web collect -> signed data-source enrichment -> saved-rule filtering -> BG check on every configured shop -> keep-sellable-only, non-sellable items go to a 7-day trash); a product library with unified filters and sellable-state logic (sellable if any site is OK); per-shop multi-site BG, fulfillment, rank and price; FBA/FBM/Amazon profit calculator with per-site tax and FX; ifast.top listing and listing-status lookup from the logged-in ifast account; live freight quotes; trademark lookup and Excel export. The bundled extension adds the in-page panel (multi-site BG table, per-field price locks, tax settings, listing status). Proprietary software: installs and starts without a license, but every data call returns 403 until the author issues a device-bound license key. Needs Edge started with --remote-debugging-port=9222 and signed in to Amazon.'
  zh: '搞薯条ERP — 完整源码的亚马逊选品/跟卖/上架一体化套件（DSH 插件 + 内置 MV3 浏览器扩展 extension/）：11 个 zying_* 工具 + 四页签界面，本机 3088 端口 ERP 后端。支持多链接采集（店铺/搜索/类目/榜单/商品页）与一键「全流程采集」（网页采集 → 数据源基础信息 → 已保存规则过滤 → 全部店铺 BG → 只保留可售，非可售进 7 天回收站）；商品库统一筛选与可售状态（任意站点可售即算可售）；多站点 BG/配送/排名/价格；FBA/FBM/自营利润测算（分站点税率与汇率）；ifast.top 上架与「登录 ifast 后」的上架状态查询；实时运费、商标查重、Excel 导出。内置扩展提供商品页面板（多站点 BG 表、逐字段价格锁定、税率设置、上架状态）。商业授权软件：未获授权可安装可启动，但所有数据接口返回 403，需向作者申请与设备绑定的 license.key；需以 --remote-debugging-port=9222 启动 Edge 并登录亚马逊。'
