url: https://github.com/youchen-yc/dsh-heartprint
name: youchen-yc/dsh-heartprint
category: memory
description:
  en: "AI persona, emotion and fading memory for DeepSeek Harness: layered compression keeps personality, emotion and turning-point nodes, painful feelings fade while the facts stay. One memory document is auto-delivered after three months and then monthly; long absences freeze the forgetting clock instead of mass-forgetting on return."
  zh: "为 DeepSeek Harness 提供会淡忘的性格、情感与记忆：分层压缩后只保留性格、情感与转折节点，痛苦感受强制淡忘而事实保留；一份记忆文档在满 3 个月后自动交付、之后每月一份；长时间不在会冻结遗忘计时，不会一回来就批量淡忘。"
