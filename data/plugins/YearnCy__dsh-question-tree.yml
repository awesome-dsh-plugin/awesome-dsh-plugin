url: https://github.com/YearnCy/dsh-question-tree
name: YearnCy/dsh-question-tree
category: ui
description:
  en: 'Tree-style questioning for DSH. Hover the "Question tree" tab above and a small card pops up with the whole tree — identical to the sidebar, but it frees that column and is quicker to consult (click "List / Graph" in the card to switch views). Select text in a conversation, click "Ask in tree", and a node appears in a tree you can reach three ways — hover the "Question tree" tab for a floating card that leaves the conversation in place, open the same tree as a full conversation view, or pin it in the right sidebar. Each node holds the quoted passage plus your own questions; clicking another node makes it the current parent so later selections nest under it (Alt+click opens a root node, Ctrl+click appends another passage to the same node). Double-click jumps back to the quoted text and pages older history in automatically when the passage is not loaded yet. Hover a truncated node to read the full quote, switch between a list and a horizontal branch graph (the graph scrolls sideways with the wheel as depth grows), mark nodes understood with a red/green dot — or let "mark understood once answered" do it when the reply lands. Nodes live in localStorage; nothing is injected into the prompt.'
  zh: '鼠标放到上方「问题树」时出现问题树小卡片，效果与侧边栏完全一致，主要目的是腾出侧边栏的空间并更快捷地查看；卡片里点「列表 / 图」可切换视图。对话里划取文字后点「树形提问」，树上就多一个节点。树有三个入口，共用一份数据：鼠标停到顶部「问题树」标签会浮出小卡片（对话原地不动，最适合边看边点），也可以点开整页视图，或常驻右栏。节点里是引用的原文和你自己的问题；单击别的节点把它设为当前节点，之后再划取就挂在它下面（Alt+点击新开根节点，Ctrl+点击把新段落追加进同一节点）。双击节点跳回原文，若那段历史还没加载会自动向上翻页；节点文字被截断时悬停即可看全文；右上角可在列表与横向分支图之间切换，图会随深度向右延展、滚轮直接横滚；点左侧圆点标记「懂了」，也可以勾上「回答后自动标记为懂了」让收到回答时自动变绿。节点只存在 localStorage，不进提示词。'
