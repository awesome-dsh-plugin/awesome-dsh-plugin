name: yzzshanyin-rgb/dsh-background-task-engine
category: tools
description:
  en: 'Durable background task templates for DSH: define a task as one to ten ordered steps, then run it by hand or from a native Schedule entry. Steps are executed by the calling agent in its own authorized context - there is no resident worker. Each execution becomes its own TaskRun with a frozen template snapshot, persisted per-step status and progress, a heartbeat and execution token, a failure record naming the failing step, and a queryable run history. Failed, interrupted and blocked runs are recovered by creating a new run that carries completed steps over and resumes at the first unfinished one; a step that may have produced side effects needs explicit confirmation before retry, and records that cannot be proven finished are never replayed automatically. Records live in a StorageDomain rather than memory, so they survive restart; a duplicated schedule delivery cannot start a second execution, and overlapping runs are bounded per task and per Session. Verified on DSH 0.2.2-rc.3 (desktop) with Node 22+; scheduling uses the host native Schedule and is unavailable when that service is not mounted, while manual runs keep working. Tasks are private to the Session that created them; the board UI is meant for a single local user and does not claim multi-user isolation, because the host does not authenticate plugin HTTP routes. Registers 14 task_* tools and reuses the host schedule, agent and tool permissions instead of replacing them. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: DSH 的可复用后台任务模板：把任务写成 1 到 10 个有序步骤，既可以手动执行，也可以挂到原生定时任务上。步骤由调用方 Agent 在它自己的授权上下文里执行，不存在常驻 Worker。每次执行都是一条独立的 TaskRun，带冻结的模板快照、持久化的步骤状态与进度、心跳与执行凭证、记录失败步骤的错误信息，以及可查询的运行历史。失败、中断、阻塞的运行通过新建一次运行来恢复，已完成步骤会结转、从第一个未完成步骤继续；可能有副作用的步骤必须先由用户确认才能重试，无法确认结果时绝不自动重放。记录存放在 StorageDomain 而不是内存里，重启后仍在；同一时间点的重复定时投递不会重复启动，并发按任务与会话双重限额。已在 DSH 0.2.2-rc.3（桌面版）与 Node 22+ 上验证；定时复用宿主原生 Schedule，未挂载该服务时定时不可用而手动执行照常。任务只对创建它的会话可见；看板按本机单用户设计，不宣称多用户隔离，因为宿主不对插件的 HTTP 路由做认证。注册 14 个 task_* 工具，复用宿主既有的调度、Agent 与工具权限。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
