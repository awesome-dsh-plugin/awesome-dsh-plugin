description:
  en: "Starts a whole dev stack from one place: it scans a directory for projects, matches each one's start command, starts them in dependency order once their ports answer, and shows their colourised logs in the sidebar."
  zh: "一个地方管起整套开发环境：扫描目录发现项目并匹配各自的启动命令，按依赖顺序启动、以端口探测确认就绪，日志带彩色显示在侧栏。"
