name: Lumos-789/guster
category: dev
description:
  en: 'Audits and evolves agent context at four scopes: a single repository, a group of related repos, a knowledge hub, or the whole machine. Discovers projects, instruction files, skills, tools, knowledge, state, evidence and credential references; reports drift, duplicate facts, broken pointers, budget overruns, unindexed knowledge, stale state and unregistered credentials; scores each scope on its own dimensions; and turns findings into reviewable migration plans that back up every file before moving it. The format contract is a versioned spec (CTX rules, markdownlint-style IDs) following open conventions — the AGENTS.md open format, llms.txt-shaped indexes, YAML front-matter note headers — now backed by published JSON Schema contracts (draft 2020-12) for the hub manifest and the plan JSON, plus an editor modeline that validates hub.yaml with zero configuration. The hub is declarative (schema 2, zones with light profiles, sections may live outside the hub root), a one-pass check command runs scan, doctor and score, and state writes are atomic and lock-protected; scoring stays honest about missing evidence — a waiver greens the gate, never the score. Ships a stdlib-only Python CLI plus two skills; credentials are referenced by path and never printed. Requires Python 3.9+ (stdlib only) and DSH 0.2.1-rc.2 or newer, below 0.3.0.'
  zh: '按四个层级审计与治理 agent 上下文：单个仓库、一组相关仓库、知识中枢、整台机器。发现项目、指令文件、技能、工具、知识、状态、证据与凭据引用；报告漂移、同一事实多个家、断链、预算超限、未索引知识、过期状态与未登记凭据；每个层级只算属于它的维度；并把问题转成可复核的迁移计划，每个文件移动前先备份。格式契约是版本化规范（CTX 规则、markdownlint 式稳定编号），遵循开源惯例——AGENTS.md 开放格式、llms.txt 形态索引、YAML front-matter 笔记头——现在附带对外发布的 JSON Schema 契约（draft 2020-12，覆盖 hub 清单与 plan JSON），编辑器 modeline 让 hub.yaml 零配置可校验。Hub 走声明式（schema 2、zones 支持 light 档、节可指向 hub 外），check 一条命令跑完 scan/doctor/score，状态写入原子且带锁；指标对缺失证据诚实——waiver 只让门禁变绿、不改分数。包含零依赖 Python CLI 和两个 skill，凭据只引用路径、从不打印。需要 Python 3.9+（仅标准库）与 DSH 0.2.1-rc.2 或更新、低于 0.3.0 的版本。'
