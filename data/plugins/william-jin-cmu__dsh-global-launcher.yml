url: https://github.com/william-jin-cmu/dsh-global-launcher
name: william-jin-cmu/dsh-global-launcher
category: ui
description:
  en: A macOS global hotkey that opens a small prompt bar from any app and sends what you type, with an optional screenshot or window text, to a new or the last session.
  zh: macOS 全局热键，在任意应用里唤出一个小输入条，把输入内容连同可选的截图或窗口文字发到新会话或最近的会话。
