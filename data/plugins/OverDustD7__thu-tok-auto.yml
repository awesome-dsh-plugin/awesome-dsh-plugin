url: https://github.com/OverDustD7/thu-tok-auto
name: OverDustD7/thu-tok-auto
category: model
description:
  en: "Fetches Tsinghua MadModel API tokens and renews them from the saved SSO session on a 20-minute timer in a windowless browser, writes the token into the DSH credential MADMODEL_API_KEY and creates or reuses the madmodel model provider; one manual Get captures that session through the campus login window."
  zh: "获取清华 MadModel 的 API token，按每 20 分钟在无窗口浏览器里用已保存的 SSO 会话续期，写入 DSH 凭据 MADMODEL_API_KEY 并创建或复用 madmodel 模型 Provider；手动点一次 Get 就通过校内登录窗口捕获该会话。"
