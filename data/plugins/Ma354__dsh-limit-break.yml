url: https://github.com/Ma354/dsh-limit-break
name: Ma354/dsh-limit-break
category: memory
description:
  en: 'Durable cross-session memory plus a fetch ladder that survives hostname-keyed blocking. Four tools: memory_recall, memory_save and memory_stats over a plain-JSON fact store at $DSH_HOME/memory/facts.json, plus resilient_fetch which tries plain fetch, then a same-service alias host (Wikipedia only for now), then curl over IPv6 and IPv4 (needs curl on PATH). No daemon, no npm dependency, no network at import time. (1.3.0 shipped a fifth tool, memory_prune; it was withdrawn in 1.4.0 because adding a tool to a running plugin breaks sessions that were opened before it.)'
  zh: '跨会话持久记忆，加一条绕开主机名级封锁的取数阶梯：四个工具——memory_recall / memory_save / memory_stats 读写 $DSH_HOME/memory/facts.json 里的纯 JSON，resilient_fetch 依次尝试直连 fetch → 同服务别名主机（目前仅 Wikipedia）→ curl IPv6 → curl IPv4（curl 需在 PATH 上）。无后台进程、无 npm 依赖、导入期不联网。（1.3.0 曾加入第五个工具 memory_prune，已在 1.4.0 撤下：给运行中的插件加工具，会让此前打开的会话报错。）'
