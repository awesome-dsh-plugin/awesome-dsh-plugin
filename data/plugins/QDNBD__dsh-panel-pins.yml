name: QDNBD/dsh-panel-pins
category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Sidebar panel management for DeepSeek Harness: a grouped Panels launcher collects global panel rows and third-party plugin entry rows into one searchable menu — the full panel inventory (pinned and unpinned, unpinned open via temporary-pin peek), collapsible group memory, in-menu search with hit highlighting and keyboard navigation, Alt+1..9 direct activation of the Nth visible item, and hover pin/top quick-actions. A Ctrl+K command palette mirrors the inventory with quick commands, a Recent group of last-used panels (MRU, persisted), and named layout presets — save your whole arrangement (pins, top pins, folds, whitelist, icon-only, compact footer) and re-apply it in one click. v1.0.0 adds custom panel groups: define your own groups (inline rename, member picker in Settings) and they render as first-class groups with accurate counts in the menu and palette. Plus a keyboard-reachable right-click context menu, icon-only panel rows, top-pinning with drag-to-reorder, a compact footer with granular sub-toggles, and a Settings page with height sliders, a locale-safe whitelist, pin management, and settings export/import."
  zh: "DeepSeek Harness 侧栏面板收纳：把全局面板行（含未钉住的，未钉面板临时打开后还原）与第三方插件入口收进一个可搜索的分组「面板」菜单——分组折叠记忆、菜单内搜索带命中高亮与全键盘导航、Alt+1..9 直达第 N 个可见项、悬停钉住/置顶快捷操作。Ctrl+K 命令面板镜像同一清单，附带快捷命令、「最近使用」组（MRU 持久化）与具名布局预设——把整套排布（钉住、置顶、折叠、白名单、仅图标、紧凑底部区）存成预设一键套用。v1.0.0 新增自定义分组：在设置页建组、行内改名、挑选成员，菜单与命令面板中作为一等分组渲染且计数准确。右键上下文菜单（键盘可达）、面板行仅图标、置顶拖拽排序、紧凑底部区细分开关，设置页提供高度滑块、语言切换安全的白名单、钉住管理与配置导出/导入。"