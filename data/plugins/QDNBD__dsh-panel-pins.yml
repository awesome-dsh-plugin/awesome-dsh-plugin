category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Hand the DeepSeek Harness sidebar back to you: one searchable, grouped launcher collects every panel row and third-party plugin entry — in-menu search with hit highlighting, keyboard navigation, Alt+1..9 direct jumps — mirrored by a Ctrl+K command palette with a Recent (MRU) group and named layout presets that re-apply your whole arrangement (pins, folds, whitelist, icon-only, footer) in one click. Pin / top / reorder with hover quick-actions, hide or rename any row with a floating editor that survives the sidebar's constant re-renders, custom panel groups, icon-only rows, a compact footer with granular toggles, and a full Settings page with height sliders, a locale-safe whitelist and export/import. Display-layer only: no DOM surgery, clean uninstall, theme-token styling."
  zh: "把 DeepSeek Harness 侧栏的主动权还给你：一个可搜索的分组「面板」菜单收纳全部面板行与第三方插件入口——菜单内搜索带命中高亮、全键盘导航、Alt+1..9 直达——Ctrl+K 命令面板镜像同一清单，附「最近使用」组与具名布局预设，整套排布（钉住、折叠、白名单、仅图标、底部区）一键套用。悬停快捷钉住/置顶/排序，任意行可隐藏、可重命名（悬浮编辑器实时跟随滚动与折叠，侧栏每秒重渲染也不丢输入），自定义分组、仅图标行、紧凑底部区细分开关，设置页含高度滑块、语言切换安全的白名单与配置导出/导入。只改显示层：不做 DOM 手术、卸载零残留、主题 token 化。"
