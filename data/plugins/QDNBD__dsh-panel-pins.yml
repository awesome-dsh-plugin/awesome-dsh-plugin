url: https://github.com/QDNBD/dsh-panel-pins
name: QDNBD/dsh-panel-pins
category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: 'Keyboard-first sidebar panel launcher for DeepSeek Harness: a grouped Panels menu with in-menu search and hit highlighting, Alt+1..9 direct jumps and a Recent (MRU) group, mirrored by a Ctrl+K command palette — plus named layout presets, pin/top/hide/rename rows (floating editor that survives the sidebar''s constant re-renders), custom panel groups, icon-only mode, a compact footer and a full Settings page. v1.2.0 adds settings export/import via clipboard AND settings file. Display-layer only: no DOM surgery, clean uninstall, theme-token styling, widest host range (DSH >= 0.2.0-rc.1). Install: dsh plugin add dsh-panel-pins.'
  zh: 'DeepSeek Harness 侧栏键盘效率型启动器：分组「面板」菜单带菜单内搜索与命中高亮、Alt+1..9 直达与最近使用（MRU），并镜像为 Ctrl+K 命令面板；支持具名布局预设一键切换、钉住/置顶/隐藏/重命名侧栏行（悬浮编辑器实时跟随滚动与折叠，不丢输入）、自定义分组、仅图标模式与紧凑底部区，设置页完整可调。v1.2.0 新增配置导出/导入（剪贴板与配置文件双通道）。只改显示层：不做 DOM 手术、卸载零残留、主题 token 化，兼容区间最宽（DSH >= 0.2.0-rc.1）。安装：dsh plugin add dsh-panel-pins。'