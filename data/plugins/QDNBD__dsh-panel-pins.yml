name: QDNBD/dsh-panel-pins
category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Keyboard-first sidebar panel launcher for DeepSeek Harness — stop opening the sidebar at all. Ctrl+K anywhere, type two letters, Enter: panels, third-party plugin entries and EVERY settings page (core host pages, third-party sections, even the manager's own column — 13/13 parity with the settings dialog, same rows same order) live in one searchable grouped menu with hit highlighting, Alt+1..9 direct jumps and Recent/MRU. Also pin/top/hide/rename rows, drag-to-reorder with a live drop line, custom groups, named layout presets, icon-only mode, compact footer and a full Settings page with clipboard/file/drag-drop export. Display-layer only, no DOM surgery, clean uninstall, theme-token styling, widest host range (DSH >= 0.2.0-rc.1, Node >= 20). Install: dsh plugin add dsh-panel-pins."
  zh: "DeepSeek Harness 侧栏面板的键盘启动器—不必再打开侧栏：任意界面 Ctrl+K，打两个字回车，面板、第三方插件入口、每一个设置页（宿主内置页、插件 section、甚至管理器自身设置列 — 与设置对话框 13/13 同行同序同条目）全在同一个可搜索分组菜单里（命中高亮、Alt+1..9 直达、最近使用）。还可钉住/置顶/隐藏/重命名侧栏行、拖动排序（蓝色插入线）、自建分组、具名布局预设、仅图标模式、紧凑底部区，以及剪切板/文件/拖放三通道导出导入的完整设置页。只改显示层，不做 DOM 手术，卸载零残留，主题 token 化，兼容区间最宽（DSH >= 0.2.0-rc.1 / Node >= 20）。安装：dsh plugin add dsh-panel-pins。"
