category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Sidebar panel management for DeepSeek Harness: a grouped Panels launcher collects global panel rows and third-party plugin entry rows into one menu (clicks the original buttons), with persistent pin/unpin, a capped scrollable panel list, a toggleable compact footer, and a full Settings page — height sliders, a keep-in-place whitelist and bidirectional pin management."
  zh: "DeepSeek Harness 侧栏面板收纳：把全局面板行与第三方插件入口收进一个分组「面板」菜单（点击原按钮），钉住状态持久化、面板列表限高滚动、底部插件区可紧凑限高，设置页提供高度滑块、白名单常驻与双向钉住管理。"
