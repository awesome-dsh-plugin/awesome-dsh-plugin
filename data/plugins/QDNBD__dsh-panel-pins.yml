name: QDNBD/dsh-panel-pins
category: ui
icon: https://raw.githubusercontent.com/QDNBD/dsh-panel-pins/main/assets/icon-180.png
description:
  en: "Sidebar panel management for DeepSeek Harness: a grouped Panels launcher collects global panel rows and third-party plugin entry rows into one searchable menu — the full panel inventory (pinned and unpinned, unpinned open via temporary-pin peek), collapsible group memory, in-menu search with keyboard navigation, and hover pin/top quick-actions. A Ctrl+K command palette mirrors the inventory with quick commands; a keyboard-reachable right-click context menu covers open/pin/top/keep-in-sidebar. Supports icon-only panel rows, top-pinning with drag-to-reorder, a compact footer with granular sub-toggles, and a Settings page with height sliders, a locale-safe whitelist, pin management, and settings export/import."
  zh: "DeepSeek Harness 侧栏面板收纳：把全局面板行（含未钉住的，未钉面板临时打开后还原）与第三方插件入口收进一个可搜索的分组「面板」菜单——分组折叠记忆、菜单内搜索与全键盘导航、悬停钉住/置顶快捷操作；Ctrl+K 命令面板镜像同一清单并附带快捷命令；右键上下文菜单（键盘可达）覆盖打开/钉住/置顶/常驻侧栏；支持面板行仅图标、置顶拖拽排序、紧凑底部区细分开关，设置页提供高度滑块、语言切换安全的白名单、钉住管理与配置导出/导入。"