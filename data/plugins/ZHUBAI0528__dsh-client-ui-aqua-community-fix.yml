description:
  en: 'Aqua glass theme for DeepSeek Harness: adjustable blur and frost, a fluid or image/video wallpaper, unified corners and motion, and font family, size and colour controls — switching it off restores the stock UI. Continues the Aqua theme by WYH66666666 (DSH-Transparent-UI-Plugin v1.3.0); do not install alongside the upstream.'
  zh: 'Aqua 玻璃主题：可调模糊与磨砂、流体或图片/视频壁纸、统一圆角与动效、字体字号与文字配色，关掉即还原原生界面。承接 WYH66666666 的 Aqua 主题（DSH-Transparent-UI-Plugin v1.3.0），请勿与上游同装。'
