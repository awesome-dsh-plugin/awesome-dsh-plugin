url: https://github.com/maomaoxyz1/dsh-cpu-temp
name: maomaoxyz1/dsh-cpu-temp
category: ui
description:
  en: 'Shows a temperature chip beside the Skills button in the DSH composer, polling Windows ACPI thermal zones, selected Linux CPU hwmon sensors, or an optional external sampler snapshot once per second. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 输入框「技能」按钮右侧每秒显示温度胶囊，支持 Windows ACPI 热区、部分 Linux CPU hwmon 传感器或可选外部采样器快照。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
