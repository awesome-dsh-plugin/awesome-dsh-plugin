description:
  en: 'Connects dsh to the BulkPublish MCP server (32 tools) to draft, schedule, publish and analyse social media posts, manage media, and handle inbox conversations and comments across 15 platforms, authenticated with a BulkPublish API key sent as a bearer token.'
  zh: '把 dsh 连接到 BulkPublish MCP 服务器（32 个工具），用于草拟、定时、发布与分析社交媒体帖子，管理媒体，并处理 15 个平台上的收件箱对话与评论；以 BulkPublish API Key 作为 Bearer token 认证。'
