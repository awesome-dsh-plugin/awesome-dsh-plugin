url: https://github.com/loyalchiiina/dsh-lit-fetch
name: loyalchiiina/dsh-lit-fetch
category: tools
description:
  en: 'Free literature fetching: give it a DOI, a title or an author and it locates the paper and pulls the PDF through open-access routes, with no paid subscription and no API key. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '免费文献下载：给 DOI、标题或作者就能定位论文，走开放获取渠道拿到 PDF，不需要付费订阅，也不需要 API Key。适配 DSH 内核 0.2.2-rc.1。'
