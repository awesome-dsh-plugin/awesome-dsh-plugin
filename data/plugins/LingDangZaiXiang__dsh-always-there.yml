description:
  en: Two triggers (a heartbeat and a log marker) that wake a session and let the agent decide whether to say anything; silence is a reply.
  zh: 心跳与日志标记两种触发只负责叫醒会话，说不说由 agent 自己决定；沉默也是一种回答。
