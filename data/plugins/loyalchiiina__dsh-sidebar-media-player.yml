url: https://github.com/loyalchiiina/dsh-sidebar-media-player
name: loyalchiiina/dsh-sidebar-media-player
category: ui
description:
  en: 'Audio and video player that lives in the DSH sidebar: video (mp4/webm/mov/m4v/ogv) and audio (mp3/wav/flac/ogg/opus/m4a/aac) open in a sidebar tab with same-name subtitles and a draggable seek bar, while a panel with QQ Music and local music tabs adds a turntable, a live spectrum (bars or wave), a pitch readout (note name, Hz, cents) and lyrics with word-by-word timing, five effects and two layouts. One control row in a single style holds 18 candidate buttons (at most 17 on screen) for favourites, loop (order, single, shuffle), rate 0.5-2, subtitles and a 6 to 10 column grid. The QQ Music side covers search, charts, playlists and new songs, and favourites are written to the same liked list the signed-in account sees instead of a local flag. The local side scans a folder, accepts drag and drop and reads items as whole files so seeking works. A capsule bar docks above the input box, sits at the bottom or hides, and its buttons map onto panel controls through one shared store. Defaults: capsule above the input box, 10 columns, rainbow lyrics, order loop, spectrum on, two-line lyrics, bars. The QQ Music interface is unofficial and only the desktop profile is verified. It is a third-party fan tool, not a Tencent product, plays only your own library, joins no official campaign, and is removed on an infringement notice. Adapts DSH kernel 0.2.2-rc.1. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把音视频播放器搬进 DSH 侧边栏：视频（mp4/webm/mov/m4v/ogv）与音频（mp3/wav/flac/ogg/opus/m4a/aac）在侧边栏页签里打开，自动加载同名字幕、进度条可拖动；面板分 QQ音乐 与本地音乐两个页签，上方是唱盘、实时频谱（柱状或波形）、音准读数（音名、频率、音分）与歌词，有逐字时间轴时按逐字、没有时按整行，含五种动效与两种版式；控件行统一风格，18 枚候选按钮同屏至多 17 枚，涵盖收藏、循环三态（顺序／单曲／随机）、0.5–2 倍速、字幕与 6–10 列网格。QQ音乐侧覆盖搜索、榜单、歌单与新歌，收藏写回登录账号本人的「我喜欢」，不是本地标记；本地侧扫描目录、支持拖放，音频整文件读取所以拖动进度可用。胶囊播放条可停靠输入框上方、页面底部或隐藏，按钮与面板控件共用一份 store 一一对应。默认值：胶囊在输入框上方、10 列、歌词炫彩、顺序循环、频谱开、两句歌词、柱状。QQ音乐接口为非官方接口，仅在桌面端 profile 验证。本插件为第三方爱好者工具，非 QQ 音乐官方产品；仅播放自己账号的列表，不参与官方活动，收到侵权通知即删库。适配 DSH 内核 0.2.2-rc.1。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
