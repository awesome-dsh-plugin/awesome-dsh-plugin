name: makooslee/dsh-company
category: workflow
description:
  en: 'Multi-agent agent team of employee AI subagents for DeepSeek Harness — dsh-company: employee management, CEO bidding, n8n workflow orchestration, drag and drop canvas. DeepSeek Harness plugin with seven built-in roles (project director, product manager, tech lead, engineer, data analyst, QA, reviewer), each with its own persona, model and tool whitelist. Broadcast a mission and the employees bid for it themselves — the first line of their answer must be 【accept】 or 【decline】 — so accepted work runs in parallel instead of down a pipeline. The workflow canvas wires employee nodes with the start node, references each upstream result with {{input}}, and runs the graph in topological layers: parallel across employees, serial per employee, downstream skipped when upstream fails. Ships a web panel for the employee management tab, the mission board and each employee''s transcript, the /dsh-company slash command, a live mirror into the built-in agent-team panel, deletable missions, and a private memory directory per employee.'
  zh: 'dsh-company：多智能体 AI 团队、子智能体公司。员工管理、CEO 认单派活、n8n 式工作流编排：拖拽员工节点到画布、连线、并行执行。DeepSeek Harness 插件，七个内置角色（项目总监、产品经理、技术总监、工程师、数据分析师、测试工程师、审核员），每人各有人设、模型与工具白名单。任务广播下去，员工自己决定接不接——回复第一行必须是【接单】或【不接】——接单的人并行开工，而不是走流水线。工作流画布用开始节点串起员工节点，用 {{input}} 引用上游产出，图按拓扑分层执行：跨员工并行、同员工串行、上游失败下游自动跳过。附员工管理、任务板与员工对话详情的网页面板，/dsh-company 斜杠命令，与内置 agent-team 面板的实时联动，可删除的任务，以及每员工独立的记忆目录。'
