name: Zhang-Eli/dsh-github-trending-masonry
category: git
description:
  en: 'GitHub Trending in the DSH sidebar: daily, weekly and monthly boards with category chips, model-written project intros in the UI language, and one-click starring that syncs to a GitHub account or stays in a local collection. It reads github.com, api.github.com and raw.githubusercontent.com, sends README excerpts to your current model to write the introductions and text to Google Translate when a translation is needed, and stars with the GitHub token you connect (or GITHUB_TOKEN / GH_TOKEN from the environment); its HTTP routes (/dsh-github-trending-masonry/...) have no DSH access check.'
  zh: '在 DSH 侧栏浏览 GitHub Trending：日/周/月三榜加分类标签，由模型用界面语言撰写项目简介，一键加星可同步到 GitHub 账号或存入本地收藏。它会访问 github.com、api.github.com 和 raw.githubusercontent.com，把 README 摘录发给你当前的模型来写简介、需要翻译时把文本发给 Google 翻译，加星用的是你连接的 GitHub 令牌（或环境变量 GITHUB_TOKEN / GH_TOKEN）；插件的 HTTP 路由（/dsh-github-trending-masonry/…）没有 DSH 的访问检查。'
icon: https://raw.githubusercontent.com/Zhang-Eli/dsh-github-trending-masonry/master/assets/icon-180.png
