url: https://github.com/IcyDate/ofttold-memory
name: IcyDate/ofttold-memory
category: memory
description:
  en: 'Puts a hand-written markdown memory folder in front of every session — it reads only the sections you name, never summarizes or writes on its own, and fills in any starter file the folder is missing. The writing side ships as skills: one diary entry a day, the index line, the emotion value.'
  zh: 把你亲手写的 markdown 笔记文件夹摆进每个会话——只读你点名的几段，不自动总结、不替你写，缺哪个起始文件就补哪个。写的那一半做成 skill：一天一篇日记、索引行、当前情绪值。
icon: https://raw.githubusercontent.com/IcyDate/ofttold-memory/main/icon.png
