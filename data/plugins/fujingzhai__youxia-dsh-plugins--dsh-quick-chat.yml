name: fujingzhai/youxia-dsh-plugins#dsh-quick-chat
category: browser
description:
  en: 'Opens the official chat.deepseek.com page in the DSH main panel through the desktop app''s native browser view, so the login survives restarts, without an iframe or request proxying. A fork of JaMoLpE88/dsh-desktop-chat with the changes listed in its NOTICE. The login token is kept in plaintext in session.json.'
  zh: '在 DSH 主面板里用桌面端原生浏览器打开 chat.deepseek.com 官方网页，登录可跨重启恢复，不用 iframe、不代理请求；基于 JaMoLpE88/dsh-desktop-chat 的 fork，改动见 NOTICE。登录令牌以明文保存在 session.json 中。'
