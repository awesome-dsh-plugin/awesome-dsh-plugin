description:
  en: 'DeepSeek Harness skill bundle for Hearts of Iron IV 1.19.3 modding: registers the hoi4-modding skill and ships 14 Python tools to scaffold, statically verify, install and debug mods - focus trees, events, decisions, ideas, characters, technologies, MIO, special projects, scripted GUI and topbar buttons, localisation, DDS icons, 18-slot tank designer layouts, 3D tank models, CJK font auditing and error.log triage - plus a 23-workshop-mod technique survey and a multi-agent playbook. Requires DSH >=0.2.0 <0.3.0; Pillow is only needed for DDS generation; no game assets are shipped.'
  zh: '面向《钢铁雄心4》1.19.3 Mod 开发的 DSH 技能包：注册 hoi4-modding 技能，附 14 个 Python 工具，用于生成、静态校验、安装与排查 Mod——国策树、事件、决议、理念、角色、科技、MIO、特殊项目、scripted GUI 与顶栏按钮、本地化、DDS 图标、18 槽坦克设计器布局、3D 坦克模型、中文字体审计与 error.log 分诊——另含 23 个工坊 Mod 技法总览与多 agent 分工规范。要求 DSH >=0.2.0 <0.3.0；仅 DDS 生成需要 Pillow；不含游戏素材。'