url: https://github.com/meiyuxuan2007/dsh-sidebar-more
name: meiyuxuan2007/dsh-sidebar-more
category: ui
description:
  en: 'Fold left-sidebar panel entries into a More menu on demand, freeing height for the workspace and session list; entries can be opened from the menu, restored in one click, and the choice persists across reloads. Nothing is folded on first install; entries that appear later are folded by default (switchable).'
  zh: '把左侧栏的面板入口按需收进「更多」菜单，给下方工作区与会话列表腾出高度；入口可从菜单打开、一键全部还原，选择跨刷新保留。首次安装不预设折叠；之后新出现的入口默认收进「更多」（可关）。'
