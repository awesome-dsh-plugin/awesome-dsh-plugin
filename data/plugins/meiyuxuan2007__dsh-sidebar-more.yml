name: meiyuxuan2007/dsh-sidebar-more
category: ui
description:
  en: 'Fold the left sidebar panel entries into a More menu, freeing height for the workspace and session list; entries can be opened from the menu, restored in one click, and the choice persists across reloads.'
  zh: '把左侧栏的面板入口收进「更多」菜单，给下方工作区与会话列表腾出高度；入口可从菜单打开、一键全部还原，选择跨刷新保留。'
