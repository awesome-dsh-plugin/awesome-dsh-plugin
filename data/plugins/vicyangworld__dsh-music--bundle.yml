description:
  en: 'Music plugin for DeepSeek Harness: scans local libraries, previews tracks online from YouTube Music (~128 kbps AAC; liking a track saves it to the library), recommends from listening history with taste preferences, shows artist pages with Wikipedia intros and cover art, tracks listening stats, imports your NetEase Cloud Music and QQ Music liked lists read-only (phone QR scan) and finds verified sources for them in the background, queues downloads with a status panel, and greets first-time users with a settings page plus a public-domain starter library. Listening history, caches and login state stay local. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 音乐插件：扫描本地曲库、从 YouTube Music 在线试听（约 128 kbps AAC，喜欢才入库）、基于收听历史与口味偏好推荐、歌手页（维基简介与封面）、收听统计，可手机扫码只读导入网易云音乐 / QQ 音乐的「我喜欢」并在后台为导入曲目查找已核实音源，下载队列配右下角状态面板，并为新用户提供设置页与公有领域 starter 曲库。收听历史、缓存与登录态仅存本地。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
