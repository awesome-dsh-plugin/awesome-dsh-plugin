name: good-saltfish/dsh-novel-agent
category: workflow
tarball: https://github.com/good-saltfish/dsh-novel-agent/releases/download/v0.2.1/dsh-novel-agent-0.2.1.tgz
description:
  en: 'Right-sidebar novel studio that treats writing a chapter as a pipeline with checkable artefacts rather than one long prompt: create a project and generate a scaffold (positioning, volume outline, chapter outline, protagonist, golden finger), inspect the exact context pack a chapter will be written from, generate 2-6 parallel candidates for one chapter and keep only the version you pick, then run chapters in sequence with each chapter''s phase written to disk so progress survives an engine restart. Length band, cross-chapter Jaccard similarity and drift ratio are enforced in code instead of asking the model to grade itself, and a rejection comes back as repair evidence for up to two rewrites; AI-fingerprint metrics are reported against a 99-book, 3956-chapter human baseline but deliberately do not block, because the two distributions overlap. Ships 7 agent tools (novel_projects_list, novel_project_create, novel_accept_skeleton, novel_context_pack, novel_chapter_generate, novel_chapters_run, novel_chapter_check). The writing engine is a separate Python package the plugin installs on first use; model calls go through providers already registered in DSH or a custom OpenAI-compatible endpoint.'
  zh: '右栏小说工作台，把「写一章」当成有可核对产物的流水线而不是一段长 prompt：建项目生成骨架（定位、卷纲、细纲、主角、金手指），先看清这一章会拿到什么上下文包，同一章一次生成 2–6 版候选挑中才落盘，再按章连写且每章推进到哪一步都写进磁盘，引擎重启后进度还在。字数区间、跨章 Jaccard 相似度、漂移比写在代码里而不靠模型自评，打回的内容回灌为修复证据，最多重写两次；AI 指纹对照 99 本、3956 章人类基线报告数值但故意不拦，因为两个分布本身重叠。带 7 个 agent 工具（novel_projects_list、novel_project_create、novel_accept_skeleton、novel_context_pack、novel_chapter_generate、novel_chapters_run、novel_chapter_check）。写作引擎是独立的 Python 包，首次使用时由插件自己装上；模型走 DSH 已注册的供应商或自填 OpenAI 兼容端点。'
