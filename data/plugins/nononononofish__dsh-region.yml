name: nononononofish/dsh-region
category: tools
description:
  en: Tired of plugins getting stuck or failing to download? Just install this one — it auto-switches between the China mirror and the official npm source to keep downloads going, and has a panel for manual switching too. That's it!
  zh: 还在为下插件卡住或失败而烦恼么？装它就完事——自动在国内镜像和官方源间换路续下，还带面板能手动切换。没啦！
