description:
  en: "Line-loss allocation record check for DeepSeek Harness: check line-loss allocation records against the Guidelines for Calculating Electric Energy Losses in Power Networks (DL/T 686-2018, GB/T 8170-2008). Flags discrepancies only and makes no conclusive judgment."
  zh: "线损分摊记录核对：依据《电力网电能损耗计算导则》（DL/T 686-2018、GB/T 8170-2008）。仅提示差异，不作出定性结论。"
