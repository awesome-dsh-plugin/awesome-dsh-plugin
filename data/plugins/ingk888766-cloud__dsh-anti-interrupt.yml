url: https://github.com/ingk888766-cloud/dsh-anti-interrupt
name: ingk888766-cloud/dsh-anti-interrupt
category: session
description:
  en: Restores a DSH turn interrupted by a crash or restart and lets it carry on, so you don't have to type continue; on Windows the same switch also turns off the screensaver and the display and sleep timeouts, and puts them back when turned off.
  zh: 回合被崩溃或重启打断后，自动恢复会话并让它继续跑，不用你再补一句「继续」；Windows 上同一个开关还能关掉屏保、关屏和睡眠超时，再点一次恢复原样。
icon: https://raw.githubusercontent.com/ingk888766-cloud/dsh-anti-interrupt/main/assets/icon-180.png