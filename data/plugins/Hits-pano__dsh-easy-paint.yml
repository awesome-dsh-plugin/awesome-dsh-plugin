url: https://github.com/Hits-pano/dsh-easy-paint
name: Hits-pano/dsh-easy-paint
category: tools
description:
  en: 'Generates images through a local ComfyUI instance with three switchable architectures — Qwen-Image, SDXL and Z-Image — covering text-to-image, instruction-based editing, LoRA chains up to five, parameter warnings when settings do not match the selected model, and per-model sampler memory. Its HTTP routes accept only local requests and reject cross-site browser requests.'
  zh: '通过本机 ComfyUI 生成图片，可在 Qwen-Image、SDXL、Z-Image 三套架构间切换，支持文生图、指令式编辑、最多五个 LoRA 串联，参数与所选模型不匹配时给出预警，并能记住每个模型上次使用的采样参数。它的 HTTP 路由只接受本机请求，并拒绝浏览器发起的跨站请求。'
icon: https://raw.githubusercontent.com/Hits-pano/dsh-easy-paint/main/assets/icon-180.png
