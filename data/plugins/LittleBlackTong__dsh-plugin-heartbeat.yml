url: https://github.com/LittleBlackTong/dsh-plugin-heartbeat
name: LittleBlackTong/dsh-plugin-heartbeat
category: workflow
description:
  en: 'Autonomic heartbeat for each root agent: silent pulses diff the session''s todos, Agent Team board and goal against what the last pulse saw, and speak only on a signal — L1 report, L2 ask (ask_user_question), L4 escalate — never starting work. Each message carries a why-now line, an optional one-line physiology signature (time since your last message and how many times it has reached out today) and a compact task snapshot (800-char cap); a dedupe window, quiet hours, a daily budget, refractory/restart cooldowns and persisted vitals keep it quiet, while busy-safe followup injection never stacks. It shares one advisory speech floor with dsh-plugin-memory (~/.dsh/proactive-cooldown.json, 180 s) so the two never talk over each other, stays silent while a child subagent or teammate is still working, and surfaces a "subagents working · N" pill in the conversation header (polling pauses while the tab is hidden). v0.8 adds a diagnostics panel that explains recent quiet pulses and names the current speech-floor holder, plus panel controls for the arbitration window, presence suppression and the physiology line; its settings section carries a stroked heart mark (16×16, stroke 1.3, same spec as dsh-plugin-memory).'
  zh: '给每个根 agent 装一套自主神经心跳：静默拍会 diff 会话的待办 / 团队任务板 / 目标，只有出现信号才开口（L1 汇报 / L2 提问 / L4 升级），只问不做。每条消息带 why-now 行、可选的一行生理签名（距你上次说话多久、今天第几次找你）与紧凑任务快照（800 字符上限）；去重窗口、静默时段、每日预算、不应期 / 重启冷却与持久化生命体征共同限流，忙碌时 followup 注入排队不打断。它与 dsh-plugin-memory 共享一个建议性发言权（~/.dsh/proactive-cooldown.json，默认 180 秒）互不抢话，子 agent / teammate 仍在运行时保持静默，并在会话头部显示「子智能体执行中 · N」胶囊（标签页隐藏时暂停轮询）。v0.8 新增诊断面板（解释最近几次为何没开口并显示当前发言权持有者）与面板内可调的仲裁窗口 / 在场抑制 / 生理签名开关；设置区块带专属描边爱心标记（16×16 / stroke 1.3，与 dsh-plugin-memory 规格一致）。'
