description:
  en: 'Experimental Windows bridge for Codex to supervise DSH Desktop 0.2.1-rc.3 tasks through local MCP, with blocking direction questions, plan checkpoints, review and revision, and named workspace routing. A Windows adaptation of Cryocell77/dsh-desktop-mcp-bridge (MIT); it uses the same package name and loader row, so it cannot be enabled alongside upstream.'
  zh: '实验性 Windows 本机 MCP 桥接，让 Codex 监督 DSH Desktop 0.2.1-rc.3 任务，支持暂停回传方向问题、计划检查点、验收返工和指定工作区归属。基于 Cryocell77/dsh-desktop-mcp-bridge（MIT）的 Windows 适配版；包名与 loader 行相同，不能与上游同时启用。'
