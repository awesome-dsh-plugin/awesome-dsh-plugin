url: https://github.com/Signalight/codex-to-dsh-pet/tree/main/packages/dsh-codex-pet
name: Signalight/codex-to-dsh-pet#dsh-codex-pet
category: fun
description:
  en: 'DSH web-GUI pet runtime that renders any Codex spritesheet-atlas pet (v1/v2) as a draggable overlay: drag/wave/jump, v2 mouse-tracking eyes that follow the active mouse, live agent-status poses, progress bubbles, and an in-GUI atlas importer; ships one original CC BY-NC demo pet (nastya), and user pets live in ~/.dsh/pets.'
  zh: 'DSH 网页 GUI 桌宠运行时：把任意 Codex 精灵图集桌宠（v1/v2）渲染为可拖拽悬浮窗，支持拖拽/挥手/跳跃，v2 桌宠的眼睛实时追踪活动鼠标，随 agent 状态切换姿势、进度气泡与图形界面图集导入；内置一只原创 CC BY-NC 示例桌宠（娜斯佳），用户桌宠存放在 ~/.dsh/pets。'
