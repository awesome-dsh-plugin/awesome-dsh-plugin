url: https://github.com/SonettoGu14/dsh-mcp-status
name: SonettoGu14/dsh-mcp-status
category: ui
description:
  en: 'MCP server panel for the DeepSeek Harness Web GUI: the sidebar lists every @deepseek-ai/dsh-mcp-client row — including rows inserted by other plugins — and derives its connection state from the loader fiber, the mcp__<server>__* tools still registered, a TCP probe of HTTP endpoints and the last connection test; it shows the row''s configuration, enables or disables it by editing only that row of the patch file, reconnects once after a failed attempt, and reports unavailable servers to the agent through a system-prompt note plus a call gate that refuses their tools instead of letting each call fail at the transport.'
  zh: 'DeepSeek Harness Web GUI 的 MCP 服务器面板：侧边栏列出每一个 @deepseek-ai/dsh-mcp-client 行（含其它插件插入的行），用 loader fiber 状态、仍注册的 mcp__<server>__* 工具数、HTTP 端点的 TCP 探活以及最近一次连接测试判断真实连接状态；可展开看该行配置，开关只改补丁文件里对应的一行并触发热重载重连，连接失败后自动再试一次，并把不可用的服务器以 system prompt 摘要 + 调用闸门的方式告知 agent——闸门会拒绝这些服务器的工具调用，而不是让每次调用在传输层失败。'
