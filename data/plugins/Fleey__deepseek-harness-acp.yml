url: https://github.com/Fleey/deepseek-harness-acp
name: Fleey/deepseek-harness-acp
category: model
description:
  en: "Registers external ACP (Agent Client Protocol) agents such as Codex, Claude Code and Gemini CLI as DSH model providers: maps each agent's thought_level options to the reasoning-effort selector, forwards images when the agent advertises promptCapabilities.image, and routes permission requests to DSH's approval dialog; ships an ACP Agents settings page that imports Zed agent_servers JSON and discovers models."
  zh: "把 Codex、Claude Code、Gemini CLI 等外部 ACP（Agent Client Protocol）Agent 注册为 DSH 模型提供方：Agent 的 thought_level 选项映射为推理等级菜单，Agent 声明 promptCapabilities.image 时转发图片，权限请求走 DSH 原生审批框；附带 ACP Agents 设置页，可导入 Zed 的 agent_servers JSON 并发现模型。"
