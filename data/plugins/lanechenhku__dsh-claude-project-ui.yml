description:
  en: 'Claude-style Projects plus Threads for DSH: every thread carries a short project brief, a "项目看板" tab in the right sidebar pane rolls projects, open threads and tasks into one board, and new threads start with the context already loaded.'
  zh: 把 Claude Code 的 Projects + Threads 体验搬进 DSH：每个讨论串自动带上项目短约定，右侧栏「项目看板」页签把项目、进行中的讨论串和任务汇总成一块看板，新讨论串自动接续上下文。
