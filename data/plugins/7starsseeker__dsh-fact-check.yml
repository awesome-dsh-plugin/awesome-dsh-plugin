url: https://github.com/7starsseeker/dsh-fact-check
name: 7starsseeker/dsh-fact-check
category: skill
description:
  en: 'Skill that types the request before it searches: it splits a question into premises, definitions and analysis units, decides which report skeleton fits (verdict, explainer, causal mechanism, comparison, survey map, metric card), confirms the direction and runs a feasibility check, then emits that skeleton instead of forcing every question into a true-false verdict — in Chinese or English. Evidence gathering never trusts model memory: it searches domestic and international ecosystems in parallel, routes each point to the primary-source ladder for its domain (policy, academic, medical, financial, disaster, food safety, science, education, sports, entertainment, judicial, and more), fetches primary pages, grades sources by type, re-searches with debunking keywords, and keeps every statement bound to a full URL and citation position. Three factual judgements can be routed to a TypeSafe Jev (System One) decision model when a key is configured, falling back to the skill''s deterministic rules when it is not; a model verdict can only lower a confidence tier.'
  zh: '先定型再取证的核查与调研技能：把提问拆成前提、定义、分析三类作业单元，判定要出哪种产物（裁决、释义、因果机制、对照、地图、指标卡），与用户确认方向并做可行性分析，再按型输出对应骨架——而不是把所有问题都压成真假判定，中英双语。取证不依赖模型记忆：国内外信息生态并行搜索，按事实范畴（政策、学术、医疗、金融、灾害事故、食品安全、科学常识、教育考试、体育、娱乐名人、司法案件等）选定一手来源阶梯，抓取一手页面并按来源类型分级，再用质疑关键词反查一轮，每条论断都带完整 URL 与引用位置。三类事实判断在配置了密钥时可交给 TypeSafe Jev（System One）决策模型，未配置则回退到内置的确定性规则；模型的判断只能降档、不能升档。'
