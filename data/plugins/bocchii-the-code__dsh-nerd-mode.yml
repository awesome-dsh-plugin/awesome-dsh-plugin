url: https://github.com/bocchii-the-code/dsh-nerd-mode
name: bocchii-the-code/dsh-nerd-mode
category: skill
description:
  en: 'Turns an ordinary conversation into a guided study session, keeping progress and lectures as dated files that survive a restart. A Study tab shows how far you have got and which ideas are still shaky without writing anything, and a Lectures tab lists each course''s lectures as draft, dated, or archived.'
  zh: '把一段普通对话变成有引导的学习，进度和讲义都按日期存成文件，重启后还在。Study 标签页显示学到了哪里、哪些概念还不牢，只读不写。Lectures 标签页按课程列出讲义，标明草稿、已授课或已归档。'
