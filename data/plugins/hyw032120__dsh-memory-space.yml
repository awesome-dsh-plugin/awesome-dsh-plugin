name: hyw032120/dsh-memory-space
category: memory
description:
  en: 'Long-term memory for DeepSeek Harness: a user profile injected into every conversation, candidate memories, on-demand recall, timer-based organizing, and Git sync of the data folder.'
  zh: 把用户画像与长期记忆分层管理：画像全量注入每次对话；成功回合可后台提取候选记忆；候选可提升为正式记忆并按需检索；可定时自动整理；数据目录可作为 git 仓库同步到私有 GitHub 仓库，令牌只存在 DSH 凭据服务里。
