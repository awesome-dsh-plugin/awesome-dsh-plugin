url: https://github.com/tzy-aiy/dsh-edit-last-turn
name: tzy-aiy/dsh-edit-last-turn
category: session
description:
  en: Rewrites a message you already sent and has the model answer the edited text instead — everything after that message is dropped from the conversation by a surface rewrite, a running turn is cancelled first, and a fresh turn starts from the new wording.
  zh: 改写你已经发出的一条消息，让模型改按改写后的内容作答——该条之后的对话通过 surface 重写被折叠掉，正在跑的回合会先取消，然后从新文本重新开一轮。
# optional, GitHub-hosted raster only (png/jpg/jpeg/webp) — SVG is refused.
# Omit it and the storefront falls back to your GitHub avatar.
# icon: https://raw.githubusercontent.com/tzy-aiy/dsh-edit-last-turn/main/assets/icon-180.png
