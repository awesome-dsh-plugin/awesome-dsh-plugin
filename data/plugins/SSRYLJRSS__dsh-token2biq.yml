description:
  en: 'Multi-agent orchestration controller for DSH — tiers, staged receipts, a token ledger and a run panel on top of the official Agent Teams. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 多代理编排控制器：在官方 Agent Teams 之上提供档位、分阶段回执、token 台账与运行面板。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
