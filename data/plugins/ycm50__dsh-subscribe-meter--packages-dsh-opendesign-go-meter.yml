description:
  en: 'Session cost meter forked from dsh-cost-meter, retargeted at OpenDesign Cloud: per-session and per-day cost, a 39-model OpenDesign price catalog, OpenDesign Cloud quotas as rolling 5-hour and 7-day used/total bars read from the official funding-check endpoint, Coding Plan quotas, provider balances, peak/off-peak notices, bilingual UI.'
  zh: 'dsh-cost-meter 的 OpenDesign Cloud 定制版：本会话与当日费用、39 个 OpenDesign 模型价格目录、OpenDesign Cloud 额度（联动官方 funding-check 接口，5 小时 / 7 天两档已用/全部进度条）、Coding Plan 额度、自定义 Provider 余额、峰谷计价提醒，界面中英双语。'
