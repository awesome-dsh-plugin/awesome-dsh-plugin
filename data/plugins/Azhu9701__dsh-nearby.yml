url: https://github.com/Azhu9701/dsh-nearby
name: Azhu9701/dsh-nearby
category: tools
description:
  en: 'Temporary sharing rooms in DSH: hand files, prompt cards and skill packs to people on the same Wi-Fi through a browser link, with nearby auto-discovery and an optional Cloudflare tunnel for remote hosts. Host routes go through DSH''s own access check; the guest page runs on a random LAN port and is reachable by anyone holding the link with its random token.'
  zh: '在 DSH 里开一间临时分享房：同一 Wi-Fi 下的人用浏览器就能收发文件、提示词卡片和技能包；支持附近实例自动发现，远程宿主可选 Cloudflare 隧道。宿主接口走 DSH 自带的访问检查；访客页跑在随机局域网端口上，持有带随机令牌链接的人都能访问。'
icon: https://raw.githubusercontent.com/Azhu9701/dsh-nearby/main/assets/icon-180.png
