url: https://github.com/Wldeinsamkeit/pixel-whale
name: Wldeinsamkeit/pixel-whale
category: fun
description:
  en: 'Pixel Whale: a hand-drawn pixel-art whale pet swimming in a small aquarium in your DSH sidebar. It cruises around, bobs, blinks and blows pixel bubbles; click the water to drop food and watch it swim over to eat (pixel hearts), click the whale to pet it. Pure client-side, zero network, zero config.'
  zh: '像素小鲸鱼桌宠：DSH 侧边栏的小水族箱里住着一只手绘像素鲸鱼，自主巡游、眨眼、吐像素泡泡；点水面投食它会游过去吃掉（冒像素爱心），点它摸摸会开心摇摆。纯前端、零网络、零配置。'
