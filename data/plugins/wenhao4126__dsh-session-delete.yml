url: https://github.com/wenhao4126/dsh-session-delete
name: wenhao4126/dsh-session-delete
category: session
description:
  en: 'Session management for DSH: archive or delete one session, archive/delete all sessions in a workspace, and restore archived sessions from the settings page — archiving backs up workspace metadata and restoring recreates deleted workspace registrations automatically.'
  zh: 'DSH 会话管理：可归档或删除单个会话，工作区行可归档全部、恢复已归档或删除全部会话，设置页可查看/恢复/删除已归档会话；归档时备份工作区信息，恢复时自动恢复原工作区，原工作区被删除时自动重建。'
