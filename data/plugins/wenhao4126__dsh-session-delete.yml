name: wenhao4126/dsh-session-delete
category: session
description:
  en: 'Sidebar session management for DSH: delete one session, archive/delete all sessions in a workspace, and restore archived sessions to their original workspace — recreating deleted workspace registrations from the session project directory.'
  zh: 'DSH 侧边栏会话管理：可删除单个会话，工作区行可归档全部、恢复已归档或删除全部会话；恢复时自动放回原工作区，原工作区被删除时按会话项目目录自动重建。'
