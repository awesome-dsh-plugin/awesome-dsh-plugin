description:
  en: 'Floating glassmorphism task notification HUD for desktop with live session progress, persistent running timer, and high-contrast alerts for approval, user input, and plan review requests. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '桌面端屏幕贴边毛玻璃任务通知流 HUD，实时展示会话进度与运行计时，并在需要审批、填写执行方向或确认计划时弹出常驻强提醒。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'