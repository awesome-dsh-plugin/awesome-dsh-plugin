url: https://github.com/hulibuld/dsh-reading
name: hulibuld/dsh-reading
category: ui
description:
  en: Reads EPUB, MOBI, AZW3, TXT and PDF books in a side panel with pagination, table-of-contents jumping, highlights, notes, bookmarks, full-text search, anchored AI questions, per-chapter distillation, and Legado-compatible book-source search that adds online books chapter by chapter. PDF support is text-based only; scanned or encrypted PDFs are rejected.
  zh: 在侧边面板里读 EPUB、MOBI、AZW3、TXT、PDF 五种格式的书：分页、目录跳转与书内链接跳转、划线记事与书签、全文搜索、带原文锚点的 AI 问答、按章蒸馏，并能导入 Legado 格式书源按章抓取在线书籍。PDF 只支持文字版，扫描件与加密 PDF 会被拒绝。
