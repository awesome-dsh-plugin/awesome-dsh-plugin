url: https://github.com/hulibuld/dsh-reading
name: hulibuld/dsh-reading
category: ui
description:
  en: Reads EPUB, MOBI, AZW3, TXT and PDF books in a side panel with pagination, table-of-contents jumping, highlights, notes, bookmarks, full-text search, anchored AI questions and per-chapter distillation. PDF support is text-based only; scanned or encrypted PDFs are rejected.
  zh: 在侧边面板里读 EPUB、MOBI、AZW3、TXT、PDF 五种格式的书：分页、目录跳转、划线笔记与书签、全文搜索、带原文锚点的 AI 问答，以及按章蒸馏。PDF 仅支持文字版，扫描件与加密 PDF 会被拒绝。
