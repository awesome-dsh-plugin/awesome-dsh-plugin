url: https://github.com/AngelosZou/dsh-multi-folder
name: AngelosZou/dsh-multi-folder
category: tools
description:
  en: 'Secondary working directories for a DSH project: the agent keeps the primary workspace as cwd and gains equal read/write/exec permissions on configured secondary directories, configurable from the session header and the new-session page.'
  zh: 为 DSH 项目提供副工作目录：agent 保持主工作区为 cwd，同时对已配置的副目录获得同等读写/执行权限，可在会话头部与新会话页配置。
