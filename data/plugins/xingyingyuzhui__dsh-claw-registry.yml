name: xingyingyuzhui/dsh-claw-registry
category: session
description:
  en: Registers named Claw agents, isolates them from the official workspace sidebar, and provides settings plus a global new-agent template. Hard deps (install together or single install fails): dsh-claw-policy, dsh-claw-observability, dsh-claw-permissions.
  zh: 登记具名 Claw Agent，与官方工作区侧栏隔离，并提供设置页和全局新建模板。硬依赖（需同装，否则单装会崩）：dsh-claw-policy、dsh-claw-observability、dsh-claw-permissions。
