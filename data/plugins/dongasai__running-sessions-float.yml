url: https://github.com/dongasai/running-sessions-float
name: dongasai/running-sessions-float
category: session
description:
  en: 'Collects the sessions that need you into one dock at the bottom of the web GUI sidebar: running sessions, sessions waiting on an approval, plan review or answer, and finished runs whose result has not been opened yet. Rows are sorted by last update and clicking one switches the main view to that session; it reuses the shipped useSessions and useSessionStatus hooks rather than adding a data source, polls nothing, stores nothing and modifies no session. The header dot pulses while anything is running or waiting and settles to a static dot when every row is only a finished-but-unread reminder; with no such sessions the dock collapses to one quiet line, and a collapsed 56px sidebar shows a 36px badge with the count instead of the list. It registers in the sidebar footer slot, so it is part of the layout and does not overlay the conversation list, leaving the existing footer entries below it.'
  zh: '把需要你处理的会话收进网页端侧栏底部的一块坞：正在跑的、卡在等你审批 / 计划待审 / 等待回答的，以及跑完但结果还没打开过的。按最近更新时间排序，点一行就把主视图切过去；复用官方 useSessions 与 useSessionStatus 两个 Hook，不新增数据源、不轮询、不落盘、不改任何会话。头部状态点在有会话运行或等待时脉冲，只剩「已完成」提醒时收成静止圆点；没有这类会话时收成一行细字，侧栏折叠成 56px 时换成 36px 计数圆片而不是摊开列表。坞注册在侧栏底部动作区，是布局里的真实一块、不盖住对话列表，原有底部入口照旧排在它下面。'
