url: https://github.com/rice-awa/dsh-lan-gateway
name: rice-awa/dsh-lan-gateway
category: remote
description:
  en: "LAN/internet reverse-proxy gateway for the DeepSeek Harness web GUI: keeps dsh on loopback and exposes 0.0.0.0 with default-deny auth (every source must sign in with an HMAC session cookie; passwordless LAN is an explicit opt-in), session revocation, an optional shared upstream-session relay for dsh >= 0.1.2-rc.1, fail-closed startup guards, self-signed or custom TLS, and a Settings card. Includes an insecure-origin UUID shim so workspaces open over plain-HTTP LAN addresses."
  zh: "DeepSeek Harness Web GUI 的局域网/公网反向代理网关：dsh 仍绑定回环，本插件在 0.0.0.0 以默认拒绝模型提供服务（所有来源均须登录并出示 HMAC 会话 Cookie，局域网免密改为显式开关）、支持会话撤销与针对 dsh >= 0.1.2-rc.1 的共享上游会话中继、fail-closed 启动守卫、自签名或自定义 TLS 与官方设置页卡片。自带不安全源 UUID shim，让局域网纯 HTTP 地址也能正常打开工作区。"
