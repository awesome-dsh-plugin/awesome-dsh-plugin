description:
  en: Per-model wire protocol for DeepSeek Harness: compiles model-level protocol intent into legal llm-pi-ai provider routes, probes Chat Completions, Responses and Anthropic Messages with a differential control probe, and hides models no protocol can serve. Mutually exclusive with dsh-gearbox.
  zh: 让 DSH 的每个模型单独选择请求协议：把模型级协议意图编译成合法的 llm-pi-ai 路由，用对照探针实测 Chat Completions、Responses、Anthropic Messages 三种协议，并把任何协议都不可用的模型从选择器隐藏。与 dsh-gearbox 二选一。
