description:
  en: 'Whale Girl light theme for the DSH Web UI. This release fixes the settings entry, conversation paper and sidebar issues, and adds a conversation-only paper control; native --dsw-* token remap, a light paper layer and adjustable glass/wallpaper. Visual identity: 溟月 by 上善无形 → DeepSeek maid ver. by ZipZipPipe; artwork CC BY-NC-SA 4.0, code MIT.'
  zh: '面向 DSH Web UI 的鲸鱼娘亮色主题。本次集中修正了设置入口、对话纸面与侧栏等问题，并新增独立的对话纸面控制；原生 --dsw-* 令牌重映射，轻纸面衬环境壁纸，玻璃/壁纸可调。视觉定型：溟月（上善无形）→ DeepSeek 女仆装（ZipZipPipe）；插画 CC BY-NC-SA 4.0，代码 MIT。'
