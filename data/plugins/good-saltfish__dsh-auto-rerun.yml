url: https://github.com/good-saltfish/dsh-auto-rerun
name: good-saltfish/dsh-auto-rerun
category: model
description:
  en: 'Automatically retries disconnect-class model failures - transport drops, timeouts, rate limits, 5xx - inside the same agent turn by taking over the retry from the host, waits out rate-limit backoffs with capped jittered delays, honors server retry hints, and keeps retrying until success within a time ceiling when enabled. When a route keeps failing it can fall back to a pinned, allowlist-filtered, or catalog-picked alternate model route, with a 30-minute blacklist for dead routes (auth failures, subscription expired, billing) and a stale-assembly guard that keeps retried requests on the switched route. Ships a right-sidebar panel showing retry state, route labels, and incident counters, Chinese and English locale, and memory-only logging by default with an optional settings file.'
  zh: '自动重试断连类模型失败（传输中断、超时、限流、5xx），在同一次智能体回合内接管重试：限流按指数退避等待并尊重服务端重试提示，开启后可在时间天花板内一直重试直到成功。路线持续失败时可自动切换到备选模型路线（可手工固定、白名单过滤或从模型目录挑选），死路（鉴权失败、订阅过期、欠费）拉黑 30 分钟，并有旧装配守卫保证重试请求确实走在新路线上。附右侧栏状态面板（重试状态、路线标签、事故计数），中英双语，默认仅内存日志、可选设置文件。'
tarball: https://github.com/good-saltfish/dsh-auto-rerun/releases/download/v1.8.3/dsh-auto-rerun-1.8.3.tgz
