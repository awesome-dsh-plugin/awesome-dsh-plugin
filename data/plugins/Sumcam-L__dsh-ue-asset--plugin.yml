description:
  en: "Unreal Engine 4/5 (UE4, UE5) asset browser and exporter for Windows x64: browse, preview and export cooked assets from local PAK archives via CUE4Parse, with 3D mesh preview, animation playback and a searchable asset index. Oodle-compressed archives need Epic's oo2core DLL, which is not bundled but can be downloaded from the settings page."
  zh: "虚幻引擎（Unreal Engine 4/5，UE4/UE5）资产浏览器与导出器，仅 Windows x64：通过 CUE4Parse 浏览、预览并导出本地 PAK 归档中的烘焙资产，支持模型 3D 预览、动画播放与可搜索的资产索引。Oodle 压缩的归档需要 Epic 的 oo2core DLL，包内不含，可在设置页一键下载。"
