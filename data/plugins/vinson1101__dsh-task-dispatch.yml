url: https://github.com/vinson1101/dsh-task-dispatch
name: vinson1101/dsh-task-dispatch
category: session
description:
  en: 'Dispatch a task to a real DSH session by workspace path or session id; results land in a persistent task ledger that can be queried without triggering the model. It serves HTTP on 127.0.0.1:7391 and requires a bearer token it generates on first run (kept in ~/.dsh/relay/token), rejects non-loopback Host and foreign Origin, and stores task results as JSON files under ~/.dsh/relay/tasks; an optional notifyUrl receives each finished result.'
  zh: '按工作空间或会话 id 给真实的 DSH 会话派发任务；结果写入持久任务台账，查询时不会触发模型。它在 127.0.0.1:7391 提供 HTTP 接口，首次运行自动生成令牌并要求 Bearer 认证（存放在 ~/.dsh/relay/token），拒绝非回环 Host 与外部 Origin；任务结果以 JSON 文件存在 ~/.dsh/relay/tasks，可选的 notifyUrl 会收到每个完成任务的结果。'
tarball: https://github.com/vinson1101/dsh-task-dispatch/releases/latest/download/dsh-task-dispatch.tgz
