url: https://github.com/SoulZhou/dsh-multi-root-files
name: SoulZhou/dsh-multi-root-files
category: ui
description:
  en: 'Sidebar file tree that covers the session workspace root together with every additional root registered through multi-root-workspace, so sibling checkouts are browsable from one tab. Directory levels load lazily, changed and untracked files carry Git markers, and clicking a file opens its content inline beside the tree. Read-only: it never writes, renames or deletes anything. Needs the dsh-better-sidebar plugin, which serves the directory listings; its own routes (roots, git status/diff, image preview) take absolute paths from the page and have no DSH access check.'
  zh: '侧栏文件树，把会话主目录与 multi-root-workspace 登记的每个附加根放在一起浏览：平级仓库在同一个页签里都能看，目录按需懒加载，改动和未跟踪文件带 Git 标记，点文件在树旁边直接内联预览。纯只读，不会写入、重命名或删除任何文件。需要 dsh-better-sidebar 插件（目录列表走它的路由）；插件自己的路由（根列表、git 状态/diff、图片预览）直接接收页面传来的绝对路径，没有 DSH 的访问检查。'
icon: https://raw.githubusercontent.com/SoulZhou/dsh-multi-root-files/main/assets/icon-512.png
