name: SoulZhou/dsh-multi-root-files
category: ui
description:
  en: 'File explorer tab that lists the session workspace root together with every additional root registered through multi-root-workspace, so sibling checkouts are browsable in one tree; clicking a file previews it inline (line-by-line with git status badges, images, and rendered Markdown with a preview/source toggle), text files can be edited and saved in place, and a right-click offers copy-path and reveal-in-file-manager. The tree and the preview sit side by side with a draggable seam that resizes them from 20% to 80%, remembers the split across restarts and resets on double-click. It registers into the native DSH sidebar and no longer needs dsh-better-sidebar; its own routes (roots, git status/diff, image preview, file write) take absolute paths from the page and have no DSH access check.'
  zh: '文件浏览器页签，把会话主目录与 multi-root-workspace 登记的每个附加根放进同一棵树：平级仓库一键切换浏览；点文件右侧内联预览（逐行源码带 Git 状态徽标、图片直显、Markdown 排版渲染并可切回源码），文本文件可就地编辑保存，右键可复制路径或在系统文件管理器中打开。左右分栏中间那条竖线可以拖动，把文件树与预览的宽度在 20%–80% 之间随意调整，松手记住比例、重启后保留，双击恢复一半。页签挂在 DSH 自带的原生右侧栏里，不再需要 dsh-better-sidebar；插件自己的路由（根列表、git 状态/diff、图片预览、文件写入）直接接收页面传来的绝对路径，没有 DSH 的访问检查。'
