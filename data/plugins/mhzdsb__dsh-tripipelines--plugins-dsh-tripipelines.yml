  en: "Three-tier model collaboration pipeline for DSH: the L1 you pick plans and accepts, long-lived L2 module leads write code, and cheap L3 executors handle tiny tasks, with strict adjacency, quality gates that run assertions, budget guards, and a live GUI board."
