url: https://github.com/Utmotc/dsh-balance-card
name: Utmotc/dsh-balance-card
category: ui
description:
  en: Shows the API balance of the provider behind the current model as a dsh Web sidebar card, with per-package progress bars, currency/credit-aware units, a settings tab, and subscription and credit quota monitoring.
  zh: 在当前会话所用模型的厂商 API 余额，以 dsh Web 侧边栏卡片常驻展示，含每套餐进度条、货币/积分单位区分、设置页，以及订阅与积分额度监测。
