url: https://github.com/LuosuQWQ/dsh-diagram
name: LuosuQWQ/dsh-diagram
category: vision
description:
  en: 'Four model-callable tools that render HTML to PNG, screenshot a page or element, annotate an existing image, and return a style guide, using the installed Chrome or Edge. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '四个模型可调用的工具：HTML 渲染为 PNG、网页或元素截图、给已有图片画框与箭头、读取样式指南，直接使用本机 Chrome 或 Edge。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
