url: https://github.com/regrevia/dsh-mobile-use
name: regrevia/dsh-mobile-use
category: remote
description:
  en: 'Android device workbench inside DSH (30 tools): read the UI text tree with readable role names (Text/Btn/Input/List……), measure animation motion, tap/type/swipe by text, id, ref or candidate index, mirror the screen into the right sidebar, and circle an area to send it back. Screen reading stays model-free — a colour-grid sampler, region diffing and OCR over the live stream mean typical checks cost 100–200 ms (warm frame 37 ms, 1000x600 region 121 ms) instead of a vision call. Process lifetime is bounded: reloads and crashes reclaim stray ffmpeg/recorder children instead of leaking them, and failure receipts only mention a crash that actually happened during the step. Requires adb (Android platform-tools) and ffmpeg on the host; the device-side helpers are bundled, and the OCR fallback is macOS-only.'
  zh: 'DSH 里的安卓真机调试台（30 个工具）：读界面文本树（角色名可读：Text/Btn/Input/List……）、量动效数据、按文字/资源 id/ref/候选序号点按输入滑动，画面推到右栏，圈一处再写一句话回到会话。看屏不走视觉模型——色块采样、区域差异与推流帧 OCR 一起用，常见判断 100–200 ms 出结果（热帧 37 ms，1000×600 区域 121 ms）。进程有边界：重载或崩溃后残留的 ffmpeg/录屏子进程会被回收而不是越积越多，失败回执只提这一步真的发生过的崩溃。需要宿主上的 adb（Android platform-tools）与 ffmpeg；设备端辅助程序随包附带，OCR 兜底仅支持 macOS。'
