url: https://github.com/regrevia/dsh-mobile-use
name: regrevia/dsh-mobile-use
category: remote
description:
  en: 'Android in the sidebar, driven by text instead of screenshots. 30 tools read the real UI tree, tap by text/id/ref, measure animation motion, and mirror the screen into the sidebar where you circle a spot and send it back with one sentence — the host ships the marked-up frame plus the controls inside the circle to the chat. Token cost is the point: a screen check is a 200-600 token text block, not a 1k+ token screenshot (roughly 60-85% fewer tokens), and a warm check costs 100-200 ms of wall clock. Video is raw H.264 straight into WebCodecs — no transcoding — with p50 2 ms host-write to decoded frame over a 26 s run, one decoder, zero dropped frames; it falls back to MSE on its own and ?avc=0 forces the old path. Sound is one switch, off by default and remembered per serial, so the default path pays nothing; when on, audio rides its own socket (48 kHz stereo PCM, measured 22 s / 1047 packets / 0 loss) and closing the window reclaims it too. Nothing runs behind your back: closing the window stops capture at once, the viewer-less host decoder, recorder and device-side server are gone within 3 s, an idle channel is dropped after 90 s, and a request you closed is never reopened by itself. `adb_proc audit` settles who leaked what in one call. Bundled helpers, no extra services; needs adb and ffmpeg on the host.'
  zh: '安卓真机，在右栏，用文字而不是截图驱动。30 个工具直接读界面树、按文字/id/ref 点按、量动效曲线；画面实时推到右栏，圈一处、写一句话，「发送」把带圈的画面连同圈内控件一起回到对话，不用你复述屏幕。省 token 是重点：看一次屏是一段 200–600 token 的文本，不是一张上千 token 的截图（约省 60–85%），热帧判断 100–200 ms 出结果。视频把 scrcpy 的原始 H.264 直接送进 WebCodecs，不转码：26 秒稳态实测宿主写出到解码帧 p50 2 ms、单解码器、丢帧 0；解不了自动退 MSE，`?avc=0` 可强制旧路径对比。声音只有一个开关，默认关、按序列号记住，默认路径不为它付任何代价；打开才多一条音频 socket（48 kHz 立体声 PCM，实测 22 秒 1047 包零丢），关窗一起回收。进程有边界：关窗当场停止采集，没观众的宿主解码器、录屏、设备端 server 3 秒内消失，闲置通道 90 秒自清，你亲手关掉的请求不会再自己弹回来；`adb_proc audit` 一次调用就能定案谁漏了进程。设备端辅助程序随包附带，不需要额外服务；宿主需要 adb 与 ffmpeg。'
