url: https://github.com/regrevia/dsh-mobile-use
name: regrevia/dsh-mobile-use
category: remote
description:
  en: 'Android device workbench inside DSH (30 tools): read the UI text tree with readable role names (Text/Btn/Input/List……), measure animation motion, tap/type/swipe by text, id, ref or candidate index, mirror the screen into the right sidebar, and circle an area to send it back. Screen reading stays model-free — a colour-grid sampler, region diffing and OCR over the live stream mean typical checks cost 100–200 ms (warm frame 37 ms, 1000x600 region 121 ms) instead of a vision call. Process lifetime is bounded end to end: reloads and crashes reclaim stray ffmpeg/recorder children on the host, and a 2.5 s sweep after activation kills the previous generation's device-side scrcpy server and screenrecord by this plugin's own markers, so nothing keeps the encoder busy. Latency at 30 real runs: adb_find p50 74 ms, adb_ui p50 192 ms, adb_state p50 126 ms, warm frame p50 39 ms. Failure receipts only mention a crash that actually happened during the step. Requires adb (Android platform-tools) and ffmpeg on the host; the device-side helpers are bundled, and the OCR fallback is macOS-only.'
  zh: 'DSH 里的安卓真机调试台（30 个工具）：读界面文本树（角色名可读：Text/Btn/Input/List……）、量动效数据、按文字/资源 id/ref/候选序号点按输入滑动，画面推到右栏，圈一处再写一句话回到会话。看屏不走视觉模型——色块采样、区域差异与推流帧 OCR 一起用，常见判断 100–200 ms 出结果（热帧 37 ms，1000×600 区域 121 ms）。进程有边界：重载或崩溃后宿主残留的 ffmpeg/录屏子进程会被回收；插件激活 2.5 s 后再按本插件独占标记清一次设备端上一代的 scrcpy server 与 screenrecord，不留占着编码器的僵尸。真机 30 轮分位数：adb_find p50 74 ms、adb_ui p50 192 ms、adb_state p50 126 ms、推流热帧 p50 39 ms。失败回执只提这一步真的发生过的崩溃。需要宿主上的 adb（Android platform-tools）与 ffmpeg；设备端辅助程序随包附带，OCR 兜底仅支持 macOS。'
