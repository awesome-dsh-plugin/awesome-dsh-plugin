url: https://github.com/regrevia/dsh-mobile-use
name: regrevia/dsh-mobile-use
category: remote
description:
  en: 'Android device workbench inside DSH (30 tools): read the UI text tree with readable role names (Text/Btn/Input/List……), measure animation motion, tap/type/swipe by text, id, ref or candidate index, mirror the screen into the right sidebar, and circle an area to send it back. Screen reading stays model-free — a colour-grid sampler, region diffing and OCR over the live stream mean typical checks cost 100–200 ms (warm frame 37 ms, 1000x600 region 121 ms) instead of a vision call. Process lifetime is bounded end to end: reloads and crashes reclaim stray ffmpeg/recorder children on the host, and a 2.5 s sweep after activation kills the previous generation's device-side scrcpy server and screenrecord by this plugin's own markers, so nothing keeps the encoder busy, and the cleanup before each recording matches only this plugin's own recorder markers and is skipped while a second host on the same machine holds the host lock, so two hosts never kill each other's recorder; a recording the user started themselves is never killed (verified on-device: a decoy process whose command line contains `screenrecord` survives the plugin sweep, while an old blanket kill removed it). Latency at 30 real runs: adb_find p50 74 ms, adb_ui p50 192 ms, adb_state p50 126 ms, warm frame p50 39 ms. When the low-latency channel fails to start, the reason (forward, socket, push) rides along with the receipt instead of hiding in a log. Failure receipts only mention a crash that actually happened during the step. Closing the window or tab tells the host at once, so capture stops immediately instead of waiting out a grace period. Playback catches up with hysteresis — 1.25x only after falling 140 ms behind and back to 1x inside 60 ms — so the rate no longer flips every frame. Closing the window is acknowledged at once, with teardown moved off the response path, and every device only ever runs one capture chain: three seconds after the last viewer leaves, the host decoder, the device recorder and the recorder pid file are gone, and it stays off until the mirror is opened again. The scrcpy control channel is reclaimed as well: three seconds after the window closes with no viewer back, the device-side server and its host adb process are gone (measured: channels 1 to 0, host process count 0); an idle channel is dropped after 90 seconds and lazily rebuilt on the next open, and a request the user closed is never reopened by itself. Status probes are read-only: only an explicit watch request counts as a viewer, so a process that keeps querying state can no longer keep the capture chain alive. Process state is answerable in one call: `adb_proc audit` compares the host's decoders with each device's real recorder/scrcpy count using a read-only `ps` (81 ms idle, 65–115 ms live) and states the verdict when they disagree — multiple recorders, or a host that thinks it is streaming while the device has no recorder. Device-side pid files older than a day are deleted (measured 72 → 0), and a host lock stops a second host on the same machine from reaping the first one's recorder. Per-device caches — tree snapshots, dump queues, resident shells — for a serial no longer in adb's list are pruned within five minutes, while the device in use is never touched. Requires adb (Android platform-tools) and ffmpeg on the host; the device-side helpers are bundled, and the OCR fallback is macOS-only.'
  zh: 'DSH 里的安卓真机调试台（30 个工具）：读界面文本树（角色名可读：Text/Btn/Input/List……）、量动效数据、按文字/资源 id/ref/候选序号点按输入滑动，画面推到右栏，圈一处再写一句话回到会话。看屏不走视觉模型——色块采样、区域差异与推流帧 OCR 一起用，常见判断 100–200 ms 出结果（热帧 37 ms，1000×600 区域 121 ms）。进程有边界：重载或崩溃后宿主残留的 ffmpeg/录屏子进程会被回收；插件激活 2.5 s 后再按本插件独占标记清一次设备端上一代的 scrcpy server 与 screenrecord，不留占着编码器的僵尸；每次开录前的清场也只按本插件自己的 recorder 标记匹配，且同机第二个宿主持锁时跳过清场，两个宿主不会互杀 recorder；用户自己在录的屏也不会被连带杀掉（真机验证：cmdline 含 `screenrecord` 的伪装进程清扫后存活，旧版泛化 pkill 则把它杀掉）。真机 30 轮分位数：adb_find p50 74 ms、adb_ui p50 192 ms、adb_state p50 126 ms、推流热帧 p50 39 ms。低延迟通道起不来时，原因（forward/socket/推送）会跟着回执一起返回，不再只写在日志里。失败回执只提这一步真的发生过的崩溃。关窗或关页当场通知宿主，采集立刻收尾，不再等宽限。追帧带回差：落后 140 ms 才用 1.25× 追、追进 60 ms 才放回 1×，倍速不再每帧来回切。关窗立刻回话、收尾放到下一拍，且每台设备只跑一条采集链：最后一个观众离开 3 秒后宿主解码器、设备录屏与录屏 pid 文件全部消失，且不再自启，直到下次再打开镜像。　scrcpy 控制通道也一起收：关窗 3 秒内没人回来，设备端 server 与宿主 adb 进程都消失（实测 channels 1 → 0、宿主进程计数 0），闲置 90 秒自清、下次开栏懒启动；用户亲手关过的请求不会再自己把右栏弹回来。状态查询只读：只有显式「要看」才算观众，持续查询状态的进程不会再把采集链续活下去。进程对不上账时一次调用就能定案：`adb_proc audit` 用只读的 `ps` 把宿主解码器与每台设备真正的录屏/scrcpy 数量摆在一起（空载 81 ms、活跃 65–115 ms），并直接给结论——多个录屏、或宿主以为在推而设备上没有录屏。设备端隔夜的 pid 文件会清掉（实测 72 → 0），同机第二个宿主有锁，不会去杀第一个正在用的 recorder；换设备或重启模拟器后，按序列号存下的树快照、队列与常驻 shell 会在 5 分钟内核对 adb 列表后清掉，正在用的那台一个字节都不动。需要宿主上的 adb（Android platform-tools）与 ffmpeg；设备端辅助程序随包附带，OCR 兜底仅支持 macOS。'
