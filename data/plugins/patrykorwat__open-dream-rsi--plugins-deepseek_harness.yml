url: https://github.com/patrykorwat/open-dream-rsi/tree/main/plugins/deepseek_harness
name: patrykorwat/open-dream-rsi#deepseek_harness
category: tools
description:
  en: 'Brings the open-dream-rsi (ODR) self-improvement loop to DeepSeek Harness: the LLM stays frozen while everything around it improves — attempts run against a sandbox, only test-passing strategies survive as reusable recipes and lessons, and between runs the system dreams over recorded history at zero API cost; a Sentinel layer watches tool calls, classifies failures and gates the agent before it burns its budget; installable from npm as dsh-open-dream-rsi.'
  zh: '将 open-dream-rsi（ODR）自我改进循环接入 DeepSeek Harness：LLM 保持冻结，改进发生在它周围——尝试在沙箱中运行，只有通过测试的策略沉淀为可复用的配方与经验，任务间歇系统在回放历史中"做梦"、零 API 成本；Sentinel 层监视工具调用、归类失败并在预算将尽时约束 agent；可从 npm 安装 dsh-open-dream-rsi。'
