name: sfunction-guo/dsh-screenshot
category: ui
description:
  en: "Snipping tool for the composer: freeze the screen, drag a region, annotate it, and drop the result into the message box. Windows only; the selector is a bundled WinForms binary (rebuilt from the included C# source if missing) and uses the built-in .NET Framework 4.x."
  zh: "输入框旁的截图标注工具：冻结屏幕、拖框选区、就地标注，完成后直接插入输入框。仅 Windows；选区器为内置 WinForms 程序（缺失时用随包的 C# 源码重建），依赖系统自带 .NET Framework 4.x。"
