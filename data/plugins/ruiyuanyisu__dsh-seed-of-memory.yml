url: https://github.com/ruiyuanyisu/dsh-seed-of-memory
name: ruiyuanyisu/dsh-seed-of-memory
category: memory
description:
  en: 'Local-first memory for DSH — identity root, layered memories, beliefs, an emotion kernel and QQ chat continuity, all in one SQLite file. The QQ chat bridge replies only to the QQ numbers and groups on its allow-list, which is empty by default, so it answers nobody until you fill it in.'
  zh: '本地优先的记忆插件——根身份、分层记忆、认知、情绪内核和 QQ 续聊，全都装在一个 SQLite 里。QQ 聊天桥只回复白名单里的 QQ 号和群，白名单默认为空，填写之前不会回任何人。'