description:
  en: 'DSH 0.2.2 adaptation of photon-hq/dsh-imessage: the same Photon-hosted two-way iMessage channel, fixed for the 0.2.2 host line — settings registration, session-persistence reads, message source kind, listener auto-restart after a cold boot, inbound image and file attachments, and workspace attachment for plugin-created sessions. Installs prebuilt from the release tarball.'
  zh: 'photon-hq/dsh-imessage 的 DSH 0.2.2 适配版：同样是 Photon 托管的双向 iMessage 通道，修好了在 0.2.2 上的六处断层——settings 注册方式、会话持久化读取、消息 source kind、冷启动后 listener 自动恢复、入站图片与文件附件、插件新建会话的工作区挂载。从 release 预构建包安装，无需自行构建。'
