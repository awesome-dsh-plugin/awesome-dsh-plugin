description:
  en: 'DSH 0.2.3 adaptation of photon-hq/dsh-imessage: the same Photon-hosted two-way iMessage channel, running on both the 0.2.2 and 0.2.3 host lines — settings registration, session-persistence reads, message source kind, listener auto-restart after a cold boot, HEIC-to-JPEG conversion for iPhone photos, voice notes, and audio files sent as real voice messages. Declares engines.dsh so 0.2.3-alpha.2 no longer skips it. The setup page is fully localized in Chinese.'
  zh: 'photon-hq/dsh-imessage 的 DSH 0.2.3 适配版：Photon 托管的双向 iMessage 通道，0.2.2 与 0.2.3 两条版本线都能跑——settings 注册方式、会话持久化读取、消息 source kind、冷启动后 listener 自动恢复、iPhone HEIC 转 JPEG、语音条，[音频] 也发成真语音条。已声明 engines.dsh，升级到 0.2.3-alpha.2 不再被跳过。设置页面全中文。'
