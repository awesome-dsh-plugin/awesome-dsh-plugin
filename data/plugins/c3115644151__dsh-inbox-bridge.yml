url: https://github.com/c3115644151/dsh-inbox-bridge
name: c3115644151/dsh-inbox-bridge
category: notify
description:
  en: "Reads the GitHub repositories a Session subscribes to and injects, at turn boundaries, the events that concern it: failed CI on the records it owns, review requests, assigned issues and mentions, open Dependabot and code-scanning alerts, and its own pull requests that conflict with the base branch. Read-only — it never writes to GitHub. Wake is opt-in and reaches only the session responsible for that repository."
  zh: '按会话订阅的 GitHub 仓库取数，在回合边界注入与它相关的事件：自己负责记录的 CI 失败、评审请求、指派给它的 issue 与 @它的评论、开着的依赖与代码告警、以及它与基分支冲突的 PR。只读 GitHub，不代做任何操作；唤醒可选，且只会叫到被指定负责该仓库的那个会话。'
icon: https://raw.githubusercontent.com/c3115644151/dsh-inbox-bridge/main/docs/assets/icon-180.png
