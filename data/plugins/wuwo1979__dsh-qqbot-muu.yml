description:
  en: 'QQ-bot extension pack for DeepSeek Harness. Access is deny-by-default: c2c/group both use care mode, and with the shipped empty lists nobody gets answered at all — the owner adds people/groups (by name in the pet panel, or by OpenID in the config) before the bot replies; allowlist/open/disabled modes remain available and the README says exactly where to fill your OpenID. Two-layer SQLite memory with hippocampal recall, a persona that keeps learning from daily chats, group tiers, local-model quick replies with a single-brain arbiter, TTS outbox, sticker library, an approval-gated video studio, and a four-form desktop pet playable over a token invite link. v0.1.8 removes every hard-coded author-machine path (resolved from the module location at runtime); v0.1.7 adds a pre-publish gate (no runtime data, tokens or account ids in the package; entry syntax and profile dependency form checked; built-in default persona keeps emotion and worldview) and fixes three bugs: local scoring model no longer starves the CPU, the watch channel stops duplicating catch-up messages, and /bot-restart keeps env and retries.'
  zh: 'DeepSeek Harness 的 QQ 机器人扩展包。访问默认拒绝：私聊与群聊都走 care 模式，出厂名单为空时**谁都不会被回复**——主人在桌宠面板按名字加入，或在配置里填 OpenID 之后她才会开口；也支持 allowlist/open/disabled，README 写清了在哪填自己的 OpenID。功能含两层 SQLite 记忆（类海马体召回）、会从日常聊天成长的人格、群分级、本地小模型代答与单脑仲裁、TTS 发件箱、表情包库、主人审核制的视频流水线，以及可通过令牌邀请链接陪玩的四形态桌宠。v0.1.8 去掉全部写死的作者本机路径（运行期从模块位置推导）；v0.1.7 新增发版闸门（包内不带运行期数据、token、写死账号；校验入口语法与 profile 依赖写法；无人物档案时也有内置默认人设，保证情绪与世界观），并修了三处老问题：本地打分小模型不再抢 CPU、小天才通道不再重复补发积压、/bot-restart 保留环境变量并重试。'
