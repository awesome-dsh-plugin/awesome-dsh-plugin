description:
  en: 'Standalone QQ-bot extension pack for DeepSeek Harness — fully independent, no other plugin required. Access is deny-by-default: c2c and group both use care mode, and with the shipped empty lists nobody is answered at all (messages are recorded, not replied); the owner adds people/groups by name in the desktop panel or by full OpenID in the config before the bot speaks, and the README states exactly where to fill that OpenID. allowlist / open / disabled modes remain available. Features: two-layer SQLite memory with hippocampal recall, a persona that keeps learning from daily chats, group tiers, local-model quick replies with a single-brain arbiter, TTS outbox, sticker library, an approval-gated video studio, and a four-form desktop pet playable over a token invite link. First-run defaults are written only where nothing was configured and never overwrite user changes. Requires QQBOT_APPID and QQBOT_SECRET, and Node.js 22.5 or newer. v0.1.9 documents the access defaults; v0.1.8 removes every hard-coded author-machine path (resolved from the module location at runtime); v0.1.7 adds a pre-publish gate (no runtime data, tokens or account ids in the package) and fixes CPU starvation, duplicated watch-channel catch-up, and /bot-restart. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '独立的 QQ 机器人扩展包（DeepSeek Harness 桌面端插件，无需安装其他本体）。访问默认拒绝：私聊与群聊都走 care 模式，出厂名单为空时谁都不会被回复（只记录、不回复）；主人在桌面端面板按名字加入，或在配置里填完整 OpenID 之后她才会开口，README 写清了在哪里填这个 OpenID。也支持 allowlist / open / disabled。功能：两层 SQLite 记忆（类海马体召回）、会从日常聊天里成长的人格、群分级、本地小模型代答与单脑仲裁、TTS 发件箱、表情包库、主人审核制的视频流水线，以及可通过令牌邀请链接陪玩的四形态桌宠。首次运行只往没配过的位置补默认值，已改过的配置一律不覆盖。需设置 QQBOT_APPID 与 QQBOT_SECRET，并要求 Node.js 22.5 或更新版本。v0.1.9 补齐访问默认说明；v0.1.8 去掉全部写死的作者本机路径（运行期从模块位置推导）；v0.1.7 新增发版闸门（包内不带运行期数据、token、写死账号），并修了抢 CPU、小天才重复补发、/bot-restart 三处问题。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
