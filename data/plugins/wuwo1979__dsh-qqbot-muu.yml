description:
  en: 'Standalone QQ-bot extension pack for DeepSeek Harness — fully independent, no other plugin required. Two-layer SQLite memory with hippocampal recall, a persona that keeps learning from daily chats, group tiers, local-model quick replies with a single-brain arbiter, TTS outbox, sticker library, an approval-gated video studio, and a four-form desktop pet (three custom characters plus the stock fish) playable over a public invite link with access-code login, single seat and brute-force protection. Chat bridging is deny-by-default: c2c/group access defaults to a care mode that only responds to the special-cared people and groups of the owner (shared with the persona system, zero extra config); allowlist, open and disabled modes remain available. v0.1.6 makes a fresh install work out of the box: first-run defaults (persistent inbound dedupe, configurable outbound-hook budget, optional default permission preset, extension seeding) are written only where nothing was configured and never overwrite user changes; interview and quiz practice run inside chat with local scoring and configurable transcript retention.'
  zh: '独立的 QQ 机器人扩展包（DeepSeek Harness 桌面端插件，无需安装其他本体）。提供两层 SQLite 记忆（类海马体召回）、会从日常聊天里成长的人格、群分级、本地小模型代答与单脑仲裁、TTS 发件箱、表情包库、主人审核制的视频流水线，以及四形态桌宠（三套自绘形象 + 原生大肥鱼）——可通过带访问码、单席位、防爆破的公网邀请链接远程陪玩，网页端能切形态、发动作、拎起逗她。聊天桥接默认拒绝：私聊/群聊默认 care 模式——只回应主人的「特别关心」名单（与人格体系同源，零额外配置），陌生人无法触发 AI。v0.1.6 起开箱即用：首装只往没配过的位置补默认值（落盘去重、出站扩展预算、可选默认权限档、扩展自动播种），已改过的配置一律不覆盖；聊天里可直接用 /面试 与 /答题 练习，评分全在本地，会话与录音保留策略可配。'
