description:
  en: "A lightweight, native and extensible Windows notification plugin for DSH: on-demand helper startup, sound, native toasts and a taskbar unread badge, covering roughly 90% of routine alert scenarios in our use (an empirical estimate). No resident background service; MIT-licensed, customizable, and maintained for DSH compatibility."
  zh: "轻量、原生、可自我拓展的 Windows DSH 通知插件：按需启动 helper，提供提示音、Windows 原生 toast 与任务栏未读角标；按实际使用经验覆盖约 90% 日常提示场景（经验估测）。无常驻后台，MIT 开源可定制，持续跟进 DSH 兼容。"
