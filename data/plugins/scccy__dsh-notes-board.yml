url: https://github.com/scccy/dsh-notes-board
name: scccy/dsh-notes-board
category: docs
description:
  en: "Decision-note board for DeepSeek Harness: renders every workspace's .agents/notes Markdown into a sidebar board with four views (architecture baseline, timeline, rejected proposals, decision list), and adds five note tools — note_search, note_read, note_write, note_verify, note_skip — plus an end-of-turn hook that asks each code-changing turn to write a note or record an explicit skip. The write-notes-like-deepseek skill ships inside the package and is mounted by the plugin."
  zh: "工程决策笔记看板：把各工作区 .agents/notes 的 Markdown 渲染成侧边栏看板（架构基线、演进时间线、避坑智库、决策清单四个视图），并提供 note_search、note_read、note_write、note_verify、note_skip 五个工具与回合末钩子——改过代码的轮次必须写一篇笔记或记录一次显式跳过；write-notes-like-deepseek 技能随包分发、由插件挂载。"
