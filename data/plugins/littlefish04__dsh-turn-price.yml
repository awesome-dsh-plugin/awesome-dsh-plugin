url: https://github.com/littlefish04/dsh-turn-price
name: littlefish04/dsh-turn-price
category: usage
description:
  en: 'Shows what each completed turn cost in CNY on its own row under the turn, with a click-to-open breakdown naming the tokens per category, the unit rate, the matched price rule and the billing instant; per-model rates are edited on a settings page inside DSH — four token categories plus weekly recurring peak/valley rules with arbitrary multipliers and absolute time-window promo prices that override them. 0.2.3 adds account awareness: it reads the balance or remaining quota of 14 providers (DeepSeek, OpenRouter, Zhipu GLM, Moonshot, MiniMax, Kimi Coding, OpenAI-compatible relays and more) and shows today / this month / this session spend next to it; spend is accumulated in a local ledger (atomic writes, one book per API key, 1-24 month retention, JSON export), and a monthly calendar lets any day be corrected by hand - including days with no balance observation - with an optional note. Usage and rates are computed locally from what the provider reported; balance is read straight from the provider API with your own key, and nothing is sent to a third party.'
  zh: '在每个已完成回合的下方单独一行显示这一轮的花费金额（人民币），点击展开明细，列出各 token 类别的数量、单价、命中的价格规则与计费时刻；单价可在 DSH 设置页里按模型维护，含四类 token 单价、每周循环的峰谷规则（系数自定）与绝对时间区间的限时优惠价。0.2.3 起还能看账户：读取 14 家 provider 的余额或剩余额度（DeepSeek、OpenRouter、智谱 GLM、月之暗面、MiniMax、Kimi Coding、OpenAI 兼容中转站等），在旁边显示今日 / 本月 / 本会话花费；花费记在本机日账里（原子写、按 API key 分本、保留 1-24 个月、可导出 JSON），另有一张按月日历，任何一天都能手动更正（包括没有余额观测的日子）并可加备注。用量与单价都在本机计算，余额用你自己的密钥直接向 provider 接口查询，不经过第三方。'
