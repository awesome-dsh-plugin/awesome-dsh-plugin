description:
  en: Four read-only tools over nine public channels — web, GitHub, V2EX, YouTube, Bilibili, Xueqiu, LinkedIn, Reddit and Twitter — with reach_search, reach_read, reach_run and reach_channels, and per-channel notes on which paths work without a login.
  zh: 用四个只读工具覆盖九个公开渠道——网页、GitHub、V2EX、YouTube、Bilibili、雪球、LinkedIn、Reddit 与 Twitter——提供 reach_search、reach_read、reach_run、reach_channels，并注明每个渠道哪些路径无需登录即可读取。
