url: https://github.com/khglobal/dsh-universe/tree/dev/plugin
name: khglobal/dsh-universe#plugin
category: usage
description:
  en: 'Real-time agent monitor that draws every DSH session, agent and scheduled task across all workspaces as a live pixel city: sessions are buildings, agents are people, with views for failed calls, token use per model, call volume, schedules and agents waiting on you, a timeline replay of the day and a screen-reader list view. Metadata only, no network requests. Published on npm as @khglobal/dsh-universe; source-available licence.'
  zh: '实时代理监控：把所有工作区的 DSH 会话、代理和定时任务画成一座实时像素城市，会话是楼、代理是人；可分别查看失败调用、各模型令牌用量、调用量、定时任务和等你处理的代理，支持按时间线回放当天，并提供读屏友好的列表视图。只读元数据，不发网络请求。npm 包为 @khglobal/dsh-universe；源码可见许可。'
