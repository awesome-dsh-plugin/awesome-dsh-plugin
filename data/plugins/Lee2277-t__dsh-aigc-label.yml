name: Lee2277-t/dsh-aigc-label
category: security
description:
  en: Write and check the AIGC implicit label that Chinese rules require on AI-generated content - the named AIGC property inside an Office file's docProps/custom.xml, carrying Label, ContentProducer and ProduceID. The producer code is never built in, because stamping a file with someone else's code misattributes where it came from.
  zh: 给 docx/xlsx/pptx 写入与查验 AIGC 隐式标识，即 Office 文件 docProps/custom.xml 里那条名为 AIGC 的属性，含 Label、ContentProducer、ProduceID。服务提供者编码不内置，因为把别人的编码写进文件等于把这份内容的来源指向了别的主体。
icon: https://raw.githubusercontent.com/Lee2277-t/dsh-aigc-label/main/assets/icon-180.png