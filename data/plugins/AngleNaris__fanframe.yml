url: https://github.com/AngleNaris/fanframe
name: AngleNaris/fanframe
category: ui
description:
  en: 'FanFrame (繁界, “Fanxing’s realm”) lightly polishes the DeepSeek Harness Desktop UI for a more comfortable everyday experience.'
  zh: '繁界 - 意思是“繁星的域界”，这个插件通过对DSH桌面版的UI界面进行轻度的打磨，带来更舒适的日常交互体验。我为DSH带来了放置图标的统一侧边栏，给对话列表充足的空间，同时避免插件喜欢随意摆放自己的图标造成的混乱。此外，为对话正文增加了染色处理，让文字阅读更轻松愉快。最后，通过冷峻的无圆角风格和大量增加的细微交互动画，增加一些小小的精致感。'
icon: https://raw.githubusercontent.com/AngleNaris/fanframe/main/assets/icon-256.png
