name: baosfeng/my-dsh-plugins#dsh-my-memory
category: memory
description:
  en: 'Memory in global and per-project scopes: memories are injected into the system prompt at session start, a settings panel edits them with confirmation on write, and the agent gets a read-only memory_query tool (npm: `dsh-my-memory`).'
  zh: '全局 / 项目两级记忆：会话开始时把记忆注入系统提示词，设置页面板支持新增 / 修改 / 删除（写操作需确认），并为 agent 提供只读查询工具 memory_query（npm: `dsh-my-memory`）。'
