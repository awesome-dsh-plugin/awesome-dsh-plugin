url: https://github.com/LittleAlety/dsh-team-conductor
name: LittleAlety/dsh-team-conductor
category: agi
description:
  en: 'Control plane for the harness''s own Agent Teams: members are ordinary independent sessions created through the same seam the GUI uses, each with its own model, so they open and continue like any other conversation while a sidecar roster and task board coordinate them. Task entries carry a definition of done, a member''s completion is submitted and waits for the Lead''s review, availability tells idle apart from awaiting-review or a failed last turn, and each member''s session title carries its Lead. delegationEngine=auto uses independent sessions or continuable subagents depending on what the composition provides; on DSH 0.2.2 this is nine tools plus three legacy aliases, since the standard subagent tools now own the old Team names. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 内核 Agent Teams 的控制面：团队成员是与 GUI 同一条缝创建的普通独立会话（各自有模型），能像任何对话一样打开与继续；名册与任务板在侧车里协调它们——任务带完成标准，成员完成后提交并等待 Lead 审议，状态区分空闲 / 待审议 / 上一轮失败，成员会话标题还会带上所属 Lead。delegationEngine=auto 会按组合提供的能力选择独立会话或可续接子代理；在 DSH 0.2.2 上工具面是九个正式工具加三个旧名别名，因为旧 Team 工具名现在归标准子代理工具所有。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
