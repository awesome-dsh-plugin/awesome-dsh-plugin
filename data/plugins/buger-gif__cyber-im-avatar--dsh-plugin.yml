name: buger-gif/cyber-im-avatar#dsh-plugin
category: identity
description:
  en: 'Sidebar IM stand-in for DeepSeek Harness. Reuses your logged-in Feishu/Lark, WeCom and DingTalk CLIs (DingTalk is enabled from the panel) to poll only the chats you watch; an @-mention or a new message wakes the bound DSH session, which reads context, researches and drafts a reply in your voice. Silent by default: it speaks only with new information or when a human clearly asks, and never commits you to meetings, signatures or payments. Each watch has its own draft-approval / auto-send mode and a three-state attention level, new groups are triaged by the agent, progress cards are recalled once the reply goes out (groups opt in separately), watches retire after seven hit-free days, and completed tasks get a two-day wrap-up window. Blocked chats are never fetched, message bodies stay on this machine, and the plugin opens no port of its own. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把「替你值守 IM」做成 DSH 侧边栏的常驻席位：复用本机已登录的飞书/Lark、企业微信、钉钉（需在面板启用）CLI，只拉取加入值守的会话；命中 @我 或新消息才唤醒绑定的 DSH 会话，由它读上下文、调研并按本人语气回复。默认沉默：有增量或真人明确在问才开口；参会、签字、付款这类需要本人到场 / 拍板的事只提醒、不代答。每个值班可单独切换草稿审批 / 全自动发送与关注程度三态，新群由 agent 自动分诊，进度卡发信后自动撤回（群聊需单独开），连续 7 天没有命中自动退役、任务完成后有 2 天观察期。屏蔽的会话永不拉取，消息正文只留本机，插件不开任何端口。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'