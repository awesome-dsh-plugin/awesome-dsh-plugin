name: buger-gif/cyber-im-avatar#dsh-plugin
category: identity
description:
  en: 'Sidebar IM stand-in for DeepSeek Harness. Reuses your logged-in Feishu/Lark, WeCom and DingTalk CLIs (DingTalk is enabled from the panel) to poll only the chats you watch; an @-mention or a new message wakes the bound DSH session, which reads context, researches and drafts a reply in your voice. Each watch has its own draft-approval / auto-send mode and a three-state attention level, and new groups are triaged by the agent. Blocked chats are never fetched, message bodies stay on this machine, and the plugin opens no port of its own.'
  zh: '把「替你值守 IM」做成 DSH 侧边栏的常驻席位：复用本机已登录的飞书/Lark、企业微信、钉钉（需在面板启用）CLI，只拉取加入值守的会话；命中 @我 或新消息才唤醒绑定的 DSH 会话，由它读上下文、调研并按本人语气起草。每个值班可单独切换草稿审批 / 全自动发送与关注程度三态，新群由 agent 自动分诊；屏蔽的会话永不拉取，消息正文只留本机，插件不开任何端口。'
