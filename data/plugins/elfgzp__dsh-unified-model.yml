url: https://github.com/elfgzp/dsh-unified-model
name: elfgzp/dsh-unified-model
category: model
description:
  en: 'Writes one model and reasoning effort into every session at once from a control beside the composer model picker, since the shipped picker only changes the session you are in. Sessions that already match are skipped, subagent sessions follow their parent instead of being written, and the same selection can be pinned as the default for new sessions.'
  zh: '在输入框模型位旁加一个控件，一次把同一个模型与思考程度写进所有会话——官方模型选择器只改当前会话。已一致的会话会跳过，子代理会话跟随父会话而不被单独写入，也可把同一选择钉为新建会话的默认值。'
