url: https://github.com/Xxsttb/dsh-input-optimizer
name: Xxsttb/dsh-input-optimizer
category: ui
description:
  en: 'Adds a four-pointed-star button left of the composer''s model selector that rewrites the unsent draft in place — grammar, wording, punctuation and execution order — preserving code, commands, paths, identifiers, numbers and URLs byte-for-byte, answering nothing and never overwriting text typed while it runs. A pencil under every user message reopens that message for editing without touching the draft; because the Harness session log is append-only, an edit forks the conversation before that message rather than rewriting it. A circular restart icon under every reply asks that one question again in a fresh conversation that carries none of the earlier turns. Both are refused while a turn is still answering, and disabled when the reply used a tool that can leave a trace or when the files the message named have since changed. A right-sidebar memory tree draws the conversation as turns, showing what was actually asked and answered, every answer to one question on its own line labelled original, edited or memory-free, newest first, with arrows that re-read an answer in place; right-clicking jumps to a branch or removes it from the plugin''s own history.'
  zh: '在输入框模型选择器左侧加一个四角星按钮，发送前就地改写尚未发出的草稿——语法、用词、标点与制作顺序——并逐字节保留代码、命令、路径、标识符、数字与 URL；它不回答请求，也不会覆盖改写期间新输入的文本。每条用户消息下的铅笔可在不碰草稿的前提下重新打开该消息编辑；因为 Harness 的会话日志只追加，编辑是在该消息之前派生分支，而不是改写原消息。每条回复下的圆形重启图标会在一个不含此前任何轮次的全新会话里重新问同一个问题。一轮还在作答时两者都不允许；当这条回复用过会留下痕迹的工具，或该消息提到的文件此后被改过时，两者也会被禁用。右侧栏的记忆树把对话按轮次画出来，显示真正被问和被答的内容，同一个问题的每个回答各占一行并标注为原始、编辑所得或无记忆重问，最新的在最上方，箭头在原处换读该回答；右键可跳转到某个分支，或把它从插件自己的历史中移除。'
