description:
  en: 'Registers the Tongdaxin (通达信) MCP market-data service as 13 native DSH tools covering real-time quotes, K-line, option chains, stock screening, F10 financials, news, filings, research reports and macro data, with a shared session that re-initializes automatically when the server expires it.'
  zh: '把通达信 MCP 行情服务注册为 13 个 DSH 原生工具，覆盖实时行情、K 线、期权链、条件选股、F10 财务、新闻公告、研报与宏观数据；共用常驻会话，服务端回收时自动重新握手。'
