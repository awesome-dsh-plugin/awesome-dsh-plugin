description:
  en: 'Subor-style CRT boot animation for DeepSeek Harness: the tube powers on, the pixel logo drops in with a "DeepSeek, endless fun" voice line, then 108 classic FC game windows fill the screen along a snake-like inward spiral, ending in a white flash that fades into the app. Auto-plays, skippable, zero configuration.'
  zh: '小霸王风格的 DSH 开机动画：显像管通电、蓝屏雪花、「小霸王」逐字落下，一句「啊哈，DeepSeek 其乐无穷啊」之后，108 个经典 FC 游戏窗口像贪吃蛇一样铺满全屏，最后闪白渐黑进入应用。自动播放、可跳过、零配置。'

