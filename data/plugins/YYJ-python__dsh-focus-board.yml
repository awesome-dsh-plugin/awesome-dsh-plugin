description:
  en: 'Cross-session task ledger for DeepSeek Harness: one item per request with a step chain, an accordion strip above the composer, unfinished items injected into every step, staleness review with artifact fingerprints, clickable choices that learn repeated decisions, a grant ledger whose four-mode control sits inside every authorization-blocked card, blind-work backfill checklists, and a scheduler that re-judges an item only when a new assistant answer mentions it.'
