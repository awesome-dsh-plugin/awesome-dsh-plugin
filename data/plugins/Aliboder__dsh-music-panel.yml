description:
  en: 'Local + online music player for DeepSeek Harness: multi-root library, NetEase / QQ Music / KuGou / Navidrome, synced playlists and lyrics, audio cache, EBU R128 leveling, 10-band EQ with AutoEQ headphone curves, smart crossfade, in-list search, and tag / cover editing.'
  zh: 'DeepSeek Harness 的本地与在线音乐播放器：多目录曲库、网易云 / QQ 音乐 / 酷狗 / Navidrome、歌单与歌词翻译、音频缓存、音量均衡、10 段均衡器与 AutoEQ 耳机曲线、智能过渡、列表内搜索、标签与封面编辑。'
