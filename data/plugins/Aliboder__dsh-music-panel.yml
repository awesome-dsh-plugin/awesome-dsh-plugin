url: https://github.com/Aliboder/dsh-music-panel
name: Aliboder/dsh-music-panel
category: voice
description:
  en: 'Local + online music player for DeepSeek Harness: multi-root library, NetEase / QQ Music / KuGou / Navidrome, synced playlists and lyrics, audio cache, EBU R128 leveling, 10-band EQ with AutoEQ headphone curves, smart crossfade, in-list search, and tag / cover editing. Online sources keep login cookies and tokens in ~/.dsh/music/providers.json (mode 0600); ticking Save password for Navidrome writes that password there in plain text.'
  zh: 'DeepSeek Harness 的本地与在线音乐播放器：多目录曲库、网易云 / QQ 音乐 / 酷狗 / Navidrome、歌单与歌词翻译、音频缓存、音量均衡、10 段均衡器与 AutoEQ 耳机曲线、智能过渡、列表内搜索、标签与封面编辑。在线音源的登录 Cookie 和令牌保存在 ~/.dsh/music/providers.json（权限 0600）；为 Navidrome 勾选「保存密码」会把密码以明文写进同一文件。'
icon: https://raw.githubusercontent.com/Aliboder/dsh-music-panel/main/docs/screenshots/icon-256.png
