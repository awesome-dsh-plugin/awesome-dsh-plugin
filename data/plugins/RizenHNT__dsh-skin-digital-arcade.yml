name: RizenHNT/dsh-skin-digital-arcade
category: theme
description:
  en: 'Opt-in pixel-neon arcade skin with Fusion Pixel fonts, animated whale-girl icons, custom crosshair and draggable detail windows; preserves light/dark/system themes. v0.3.2 includes local display-name controls, mobile menu improvements and an optional source patch for the arcade home screen, transitions and telemetry HUD.'
  zh: '可选的像素霓虹街机皮肤：Fusion Pixel 字体、鲸鱼娘像素图标、十字准星与可拖动详情窗口，保留浅色/深色/跟随系统。v0.3.2 支持本地自定义称呼并完善手机菜单；完整街机首页、转场与数值 HUD 另附可选源码集成补丁。'
