url: https://github.com/MYCF711/dsh-GOkifu-compact
name: MYCF711/dsh-GOkifu-compact
category: memory
description:
  en: 'Kifu-style context compression for long DSH sessions: each step folds new turns into a DAG (node = position, edge = attempted fix), injects only a ~417-token hot list (2000-edge fixture, L5 tier), and adds failure memory plus position-repetition detection. Each span is summarized exactly once, so what is retained does not decay with the number of compactions.'
  zh: '棋谱式上下文压缩：每步把新回合折进一张 DAG（节点=局面、边=试过的改法），只注入约 417 tokens 的热清单（2000 边合成夹具、L5 降级档）；带失败记忆与局面重复检测。一段历史只摘要一次，保留率不随压缩轮次衰减。'
