url: https://github.com/863683348/dsh-plugin-finance-data
name: 863683348/dsh-plugin-finance-data
category: tools
description:
  en: 'Finance data toolkit for DSH agents: number and currency formatting (incl. Chinese wan/yi units), return and CAGR math, valuation and profitability ratios, PV/FV, risk metrics, and a data-quality checklist.'
  zh: 为 DSH agent 提供金融数据工具包：数字与货币格式化（含中文万/亿单位）、收益与年化计算、估值与盈利比率、现值/终值、风险指标与数据质量清单。
  ja: DSH エージェント向けの金融データツールキット。数値と通貨の整形（万・億の単位にも対応）、リターンと CAGR の計算、バリュエーションと収益性の指標、現在価値/将来価値、リスク指標、データ品質のチェックリストを提供します。
