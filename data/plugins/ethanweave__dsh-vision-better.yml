# awesome-dsh-plugin 条目（dsh-vision-better v1.0.0）。
# 提交：fork awesome-dsh-plugin/awesome-dsh-plugin，把本文件复制为
# data/plugins/ethanweave__dsh-vision-better.yml，并开一个只含此文件的 PR。
# 类别 vision；dsh.bundle 已在 package.json 声明（该仓库 CI 会核对）。

url: https://github.com/ethanweave/dsh-vision-better
name: ethanweave/dsh-vision-better
category: vision
description:
  en: "Vision relay for text-only models: a configurable GLM-compatible vision endpoint analyzes the images you attach in the background and the original model keeps answering in the same session, leaving your message, image, model and history untouched. Requires applying patches/0001-session-image-admission.patch to a stock DSH install (images are rejected before storage otherwise); the repo ships an apply/restore script."
  zh: "为纯文本模型提供的图像识别转发：后台调用你配置的 GLM 兼容视觉接口分析图片，原模型在同一会话继续作答，你的消息、图片、模型与历史全程不变。需先运行仓库自带的 patches/apply-core-patch.cmd 给 DSH 打核心补丁，否则带图消息会在入库前被原版 DSH 拒绝（可用 restore 脚本还原）。"
