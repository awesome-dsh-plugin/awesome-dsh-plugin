description:
  en: "Vision relay for text-only models: a configurable GLM vision endpoint analyzes the images you attach in the background and the original model keeps answering in the same session, leaving your message, image, model and history untouched."
  zh: "为纯文本模型提供的图像识别转发：后台调用你配置的 GLM 视觉接口分析图片，原模型在同一会话继续作答，你的消息、图片、模型与历史全程不变。"
