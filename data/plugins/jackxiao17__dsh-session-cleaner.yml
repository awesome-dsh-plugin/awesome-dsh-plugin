url: https://github.com/jackxiao17/dsh-session-cleaner
name: jackxiao17/dsh-session-cleaner
category: session
description:
  en: 'Adds Delete to the DSH sidebar session menu, moving the session — and its whole descendant tree when it has subagents — into a recycle bin that relocates the directory on disk (an atomic rename, never a copy), plus a sidebar bin panel with title and full-text search, workspace filter, sorting, per-session chat-log viewer, restore and permanent delete. Deleting also clears the workspace slot, the pin, the archive flag and the projection-cache row, so a restore puts the session back at its original sidebar position; permanent deletion also clears the schedules bound to it and removes the emptied project directory. Verified on DeepSeek Harness 0.2.1-rc.2, with a whole-profile residue scan coming back clean.'
  zh: '在侧栏会话菜单中加入「删除」，把会话——带子代理时连同整棵后代树——搬进回收站（目录在磁盘上整体 rename 迁走，原子操作，不做复制），并提供侧栏回收站面板：标题与正文搜索、工作区筛选、排序、查看对话记录、恢复与彻底删除。删除时同时摘掉工作区槽位、置顶与归档标记以及投影缓存行，恢复时把会话放回侧栏原位置；彻底删除时清掉绑定该会话的定时任务并删除空掉的工程目录。已在 DeepSeek Harness 0.2.1-rc.2 上真机验证，删除后全盘无残留。'