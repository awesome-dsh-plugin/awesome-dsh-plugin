description:
  en: 'Three-tier memory (personal, project, session) built on the Hy-Memory engine, with relevant memories injected before each step. Ships seven memory tools (search, add, list, get, update, delete, forget), a settings panel with per-tier lists, editing, change history and duplicate cleanup, real token accounting per write, session summaries written by the engine at session end, and a user profile refreshed from recent memories. Memories can be exported to and imported from MemHub. Needs Python 3.11+ once to install the engine, or uv, which fetches 3.12 itself; uninstalling keeps the stored memories.'
  zh: '基于 Hy-Memory 引擎的三层记忆（个人、项目、会话），每一步之前注入相关记忆。提供七个记忆工具（搜索、新增、列表、读取、更新、删除、遗忘），设置面板可分层浏览、编辑、查看变更历史、清理重复项；按写入实测统计 token；会话结束时由引擎生成会话摘要；并从最近的记忆中汇总用户画像。支持与 MemHub 互导。首次使用需要 Python 3.11+（或 uv，它会自行下载 3.12）安装引擎；卸载不会删除已存记忆。'
