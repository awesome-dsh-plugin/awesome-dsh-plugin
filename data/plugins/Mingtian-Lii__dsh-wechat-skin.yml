url: https://github.com/Mingtian-Lii/dsh-wechat-skin
name: Mingtian-Lii/dsh-wechat-skin
category: theme
description:
  en: 'WeChat-style theme for the DSH Web GUI: green accents and send action, green user bubbles, a soft gray chat canvas, a green sidebar whale, a badge on the current session, a context-usage status dot, and a prominent compaction card.'
  zh: '微信风格主题：微信绿强调色与发送按钮、绿色用户气泡、浅灰聊天画布、绿色鲸鱼图标、当前会话的「当前」徽标，上下文使用率状态点，以及醒目的上下文压缩卡片。'
