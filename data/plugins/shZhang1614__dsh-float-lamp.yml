url: https://github.com/shZhang1614/dsh-float-lamp
name: shZhang1614/dsh-float-lamp
category: ui
description:
  en: "Windows floating status lamp that lives outside the DSH window: a borderless always-on-top card — green running, orange awaiting approval, blue awaiting your input, grey idle, dark grey host offline; hovering lists each session's latest task, drag to move, and the lamp self-extinguishes within seconds when the plugin is switched off."
  zh: "悬浮在 DSH 应用之外的 Windows 状态灯：无边框置顶小卡片——绿灯运行中、橙灯待授权、蓝灯待你交互、灰灯空闲、暗灰宿主离线；悬停逐行列出各会话正在运行的任务，可拖动记忆位置，插件被关闭后数秒内自动熄灭。"
