url: https://github.com/baizhu66018/dsh-pitfall-memory
name: baizhu66018/dsh-pitfall-memory
category: memory
description:
  en: Failure memory for DeepSeek Harness. Captures tool failures as they happen, classifies them with 16 built-in rules into lessons pairing a symptom with a fix, adds session/daily/weekly summaries, and injects a short briefing into later sessions through systemPrompt context. Ships 5 pitfall_ tools and a web settings page.
  zh: 面向 DeepSeek Harness 的失败记忆插件。运行中捕获工具失败，用 16 条内置规则归并成「症状 + 正确做法」的经验，附带会话/天/周三级总结，并通过 systemPrompt context 把简报注入后续会话。提供 5 个 pitfall_ 工具与 Web 设置页。
