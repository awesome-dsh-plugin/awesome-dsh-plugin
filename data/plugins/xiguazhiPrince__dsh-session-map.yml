url: https://github.com/xiguazhiPrince/dsh-session-map
name: xiguazhiPrince/dsh-session-map
category: session
description:
  en: 'Session map: a fork-tree canvas over DSH sessions — a node is a session and the beads under it are that session''s user inputs — opened as a conversation tab, a session-header toggle and two right-side tabs. It starts on the current session''s own tree, growing downward, with wheel pan and Ctrl/⌘-wheel zoom, a global user-input toggle, a subagent-session filter, and a per-session overview of turns, steps, model time, tool time, output tokens and running state.'
  zh: '会话图谱：把 DSH 会话画成一张 fork 树画布——节点是会话，节点下面那串珠子是该会话的用户输入——以对话标签页、会话头部开关和右侧栏两个标签页三个入口打开。默认只铺开当前会话所在的那棵树、自上而下生长，支持滚轮平移与 Ctrl/⌘ 滚轮缩放、一键铺开全部用户输入、隐藏子代理会话，另有一个会话概览页列出轮次、步骤、模型耗时、工具耗时、输出 token 与运行状态。'
