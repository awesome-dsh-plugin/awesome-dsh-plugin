url: https://github.com/xiguazhiPrince/dsh-session-map
name: xiguazhiPrince/dsh-session-map
category: session
description:
  en: 'Session map: a fork-tree canvas over DSH sessions, and a Settings page that clones a Git repository into a new workspace. The canvas is reachable from a session-header toggle and two right-side tabs, and from a conversation tab that is off by default; it starts on the current session''s own tree, growing downward, with wheel pan, Ctrl/⌘-wheel zoom, a subagent-session filter and a per-session overview of turns, steps, model time, tool time, output tokens and running state. The clone page takes a repository address and a remembered parent directory with a native folder picker, offers a per-clone shallow switch (off by default), runs git clone on the host, and registers the cloned directory as a workspace.'
  zh: '会话图谱：把 DSH 会话画成一张 fork 树画布，另在设置里加了一个「从 Git 克隆」页——填仓库地址、选存放目录（会记住上次选择、带原生目录选择器），按需打开浅克隆，克隆完自动添加为工作区。画布可从会话头部开关和右侧栏两个标签页打开，对话标签页默认关闭；默认只铺开当前会话所在的那棵树、自上而下生长，支持滚轮平移与 Ctrl/⌘ 滚轮缩放、隐藏子代理会话，另有一个会话概览页列出轮次、步骤、模型耗时、工具耗时、输出 token 与运行状态。'
