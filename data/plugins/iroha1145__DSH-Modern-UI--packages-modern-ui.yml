name: iroha1145/DSH-Modern-UI#modern-ui
category: theme
description:
  en: 'Replacement web interface for the unmodified official DSH release: collapsible reasoning groups, a turn timeline with adjustable reading width, cards for tool calls, a model and reasoning-effort picker, an Agents view that shows subagents as a tree, optional chart and diagram widgets in answers, light and dark themes, and a phone layout. Installs from npm; uninstalling restores the official interface. An optional jev_presentation_advice tool, enabled only once you save a TypeSafe key, sends up to four recent user messages and a short outline of the planned answer to api.typesafe.ai.'
  zh: '给未改动的官方 DSH 换一套网页界面：思考过程分组折叠、对话轮次时间轴与可调阅读宽度、工具调用卡片、模型与思考强度选择面板、子智能体编队视图、回答里可选的图表与流程图组件、明暗主题和手机布局。从 npm 安装，卸载即恢复官方界面。可选的 jev_presentation_advice 工具只有在你保存 TypeSafe 密钥后才会启用，它会把最近最多四条用户消息和一份简短的回答提纲发送到 api.typesafe.ai。'
tarball: https://github.com/iroha1145/DSH-Modern-UI/releases/latest/download/modern-ui.tgz
