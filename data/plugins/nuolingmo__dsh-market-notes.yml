description:
  en: Writes short plain-Chinese notes for installed dshmarket plugins that have none and shows them on the market cards; hand-written notes are left alone (only entries marked 🤖 may be regenerated with force=ai), and dshmarket is required.
  zh: 给 dshmarket 里还没有备注的插件自动写一句中文说明，显示在市场卡片上；手写备注不会动（只有带 🤖 标记的条目会在 force=ai 时重新生成），使用时需要先装好 dshmarket。
