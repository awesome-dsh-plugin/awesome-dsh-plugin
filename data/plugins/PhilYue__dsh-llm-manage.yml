url: https://github.com/PhilYue/dsh-llm-manage
name: PhilYue/dsh-llm-manage
category: model
description:
  en: 'Model manager for the composer picker: probes a model on demand and keeps the timestamped reason it failed, counts usage from committed assistant messages to rank models by proficiency level, pins, favourites and hides rows, and switches along a failover chain when a turn fails, asking the new model to pick the work back up.'
  zh: '输入框里的模型管理：可按需深度探活模型并记录失败原因与发生时间，从已提交的助手消息统计用量并按熟练度档位排序，支持置顶、收藏与隐藏，某一轮失败时沿后备链换模型并请新模型接着做。'
