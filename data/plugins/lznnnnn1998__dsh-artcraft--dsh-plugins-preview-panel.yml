description:
  en: "A live preview panel for the ArtCraft applications inside the DSH Web GUI: the agent step list, the current render, a filmstrip of earlier steps and a timeline for time-based crafts, fed by the craft plugins' renders."
  zh: "在 DSH Web GUI 内的 ArtCraft 实时预览面板：智能体步骤流、当前渲染、历史步骤胶片条，以及时间轴类应用的时间轴，数据来自各 craft 插件生成的渲染图。"
