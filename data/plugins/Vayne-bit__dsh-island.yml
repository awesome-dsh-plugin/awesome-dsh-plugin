url: https://github.com/Vayne-bit/dsh-island
name: Vayne-bit/dsh-island
category: notify
description:
  en: 'Always-on-top status pill for DSH on Windows: shows each session''s turn state (thinking with a running timer, waiting for approval, done, failed) above every window, and while DSH is in the background it draws a bubble under the pill to approve a tool request (allow once / reject) or answer the agent''s questions without switching back to the app; it declines to intercept whenever DSH is in front or the overlay is hidden, so the official cards still handle those. Sessions can be listed one per row (row count configurable) or folded into a +N badge by priority, the pill collapses to a small dot after a state settles and hides itself while a fullscreen app is in front, clicking brings DSH to the foreground and dragging moves it, and it reuses the Electron build already shipped with DSH Desktop so nothing extra is downloaded. A settings card on the plugin page adjusts scale, mini size, position, layout, row count, hold times, effects, bubble toggles and per-state visibility.'
  zh: 'Windows 上的 DSH 置顶状态胶囊：把每个会话的回合状态（思考并计时、等待审批、完成、失败）浮在所有窗口之上；DSH 在后台时胶囊下方会浮出气泡，可直接批准工具请求（允许一次 / 拒绝）或回答 Agent 的提问，不用切回应用；DSH 在前台或浮层被隐藏时不拦截，仍由官方卡片处理。会话可每行一个纵向排列（行数可调），或按优先级折成 +N 角标；状态结束后缩成小圆点，前台是全屏应用时自动隐藏；点击可把 DSH 拉到前台，拖动可改位置；复用 DSH Desktop 自带的 Electron，不额外下载。插件页里的设置卡片可调缩放、迷你尺寸、位置、布局、行数、收起时间、动效、气泡开关和各状态开关。'
