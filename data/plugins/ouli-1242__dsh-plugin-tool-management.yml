name: ouli-1242/dsh-plugin-tool-management
category: tools
description:
  en: 'MCP and Skills management for DeepSeek Harness in one settings page: enable or disable individual MCP tools, restart servers, create, import and toggle skills across all sources, apply global AGENTS.md presets, and manage archived sessions with retention, restore and conversation import or export.'
  zh: 'DeepSeek Harness 的 MCP 与技能统一管理：在一个设置页里对单个 MCP 工具启停、重启服务，跨来源创建、导入、启停技能，应用全局 AGENTS.md 预设，并管理归档会话——保留期清理、批量恢复、对话导入导出。'
