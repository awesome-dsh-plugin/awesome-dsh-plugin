description:
  en: 'A timer wakes a DSH session to read the GitHub repos and topics you follow, decide which changes are worth your time, and write a dated report while keeping a table of what it already saw. A sidebar panel keeps the run history and the GitHub trending list. Read-only.'
  zh: 到点把会话叫醒，翻你关注的 GitHub 仓库和主题，判断哪些变化值得跟，写成一份日报，顺手记下看过什么；侧边栏能翻历史、看 GitHub 热门榜单。只读，不写 GitHub。
