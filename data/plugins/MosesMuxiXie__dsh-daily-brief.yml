description:
  en: 'Daily briefing plugin for DeepSeek Harness that collects watched X accounts, RSS/Atom/JSON/ICS feeds and arbitrary pages, YouTube and Bilibili updates, Steam news, Minecraft server and status pages, mailboxes (IMAP) and calendars into persona-styled rows. YouTube and Bilibili videos are read past the title: the plugin fetches each video''s real comment count, picks the most-discussed one and puts it on top as a hot-takes card with its highest-liked comments. Built for Windows 10/11: it registers a daily Windows scheduled task (enabled by default, 07:30) that opens the briefing in an Edge/Chrome app window, stores mailbox and cookie credentials with Windows DPAPI, and by default sends item titles (including mail subjects) to the DSH model to polish the wording (set ai.polish to off in config.json to disable).'
  zh: '为 DeepSeek Harness 提供每日简报：汇总关注的 X 账号、RSS/Atom/JSON/ICS 订阅与网页、YouTube 与 Bilibili 更新、Steam 动态、Minecraft 服务器与状态页、邮箱（IMAP）与日历，按人设排版。YouTube 与 Bilibili 不只看标题：会读取每条视频的真实评论数，挑出评论最多的那条放在简报顶部做成「今日热议」卡片，附上点赞最高的几条热评。面向 Windows 10/11：默认注册每日 Windows 计划任务（07:30），到点用 Edge/Chrome 应用窗口弹出简报；邮箱与 Cookie 凭据用 Windows DPAPI 加密保存；默认会把条目标题（含邮件主题）交给 DSH 模型润色文案（在 config.json 里把 ai.polish 设为 off 可关闭）。'
