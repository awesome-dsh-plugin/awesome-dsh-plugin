url: https://github.com/tyouter/dsh-notes
name: tyouter/dsh-notes
category: ui
description:
  en: 'A quiet page for thinking, inside DeepSeek Harness. For people who think by writing. · Minimal writing: typeset as you type — two spaces for a bullet, four for the next level; a suggestion after a pause, TAB accepts it, one Backspace takes it back. · History: every note listed, searched and edited in place, with one-click standard Markdown. · AI board: a data assistant that answers from your own notes and pins the charts it builds.'
  zh: 'DeepSeek Harness 里一张安静的纸，用来思考。给喜欢边写边想的人。 · 极简写：边写边排版——两个空格是项目符号，四个是下一级；停一秒出现建议，TAB 采纳、一次 Backspace 收回。 · 历史记录：笔记可列、可搜、就地编辑，一键复制标准 Markdown。 · AI 看板：数据助手用你自己的笔记回答，并把生成的图表钉在看板上。'
icon: https://raw.githubusercontent.com/tyouter/dsh-notes/main/docs/marketing/icon-180.png
