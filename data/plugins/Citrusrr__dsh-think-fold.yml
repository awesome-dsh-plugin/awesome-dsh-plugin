description:
  en: "The row that is currently running — the official Think row and the official tool cards — expands itself and folds back when it settles; when a turn finishes, its process rows merge into the built-in \"processed\" header with only the final answer left on screen. It dispatches a click on the official disclosure rows instead of drawing its own panel, never overrides rows you opened by hand, and restores the official settings it changed on uninstall."
  zh: '运行中的思考行和工具卡自动展开、结束后自动收起；一轮结束把这一轮的过程行（连同中间的旁白）并进官方内建的「已完成」表头，只留最终回复。只点击官方的折叠行、不自绘面板，你手动开合过的行永不被覆盖，卸载后还原它改过的官方设置。'
