description:
  en: "The row that is currently running — the official Think row and the official tool cards — expands itself and folds back when it settles; when a turn finishes, its process rows merge into the built-in \"processed\" header. It dispatches a click on the official disclosure rows instead of drawing its own panel, never overrides rows you opened by hand, and restores the transcript view level on uninstall."
  zh: '运行中的思考行和工具卡自动展开、结束后自动收起；一轮结束把这一轮的过程行并进官方内建的「已完成」表头。只点击官方的折叠行、不自绘面板，你手动开合过的行永不被覆盖，卸载后还原它改过的会话档位。'
