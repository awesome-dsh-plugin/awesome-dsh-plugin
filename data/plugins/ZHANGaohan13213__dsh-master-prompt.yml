description:
  en: 'Adds a sub-conversation action to any conversation: the main stays in place while native sub-conversations open as tabs in the right sidebar, each carrying a snapshot of a versioned shared prompt. A panel reviews proposals, edits the prompt, and rolls versions back.'
  zh: '在任意会话的输入框工具栏加一个副对话入口：主对话留在左侧，副对话以原生会话标签开在右侧栏，各自带一份可版本化总要求的快照；面板里可以审阅提案、编辑总要求、回滚版本。'
