description:
  en: 'Capture a passing idea, a quick to-do or tomorrow’s plans with a sentence in a conversation or in 随口记, without filling out a form first. When plans change, keep the conversation going to reschedule, complete a task or add and remove tags rather than starting over. Notes, to-dos and events share one local notebook across conversations; navigate events by date and return to your reading position within the same Shanghai day. Supports in-app due reminders and optional WeChat notifications through DSH-IM while the app is running.'
  zh: '灵感一闪、临时待办、明天的安排，在对话里说一句，或打开「随口记」，不用先填表，就能记下来。计划变了？接着说，修改时间、完成待办、增删标签，不必重新来一遍。便签、待办、日程共用一本本机账本，跨对话管理；日程多了，也能按日期定位、找回当天上次浏览的位置。支持应用内到期提醒，并可借助 DSH-IM 在应用运行期间推送微信。'
