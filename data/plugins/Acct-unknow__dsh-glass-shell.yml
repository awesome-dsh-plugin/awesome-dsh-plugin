url: https://github.com/Acct-unknow/dsh-glass-shell
name: Acct-unknow/dsh-glass-shell
category: theme
description:
  en: Glassmorphism skin that turns the sidebar, composer, cards and menus into frosted glass, with adjustable blur, panel opacity and an SVG displacement refraction mode, and a background that can follow the theme, be a solid colour, a two-colour gradient or an uploaded image.
  zh: 毛玻璃换肤：侧边栏、输入卡、卡片与弹层换成磨砂玻璃，模糊、面板透明度与折射强度可调；背景可跟随主题、纯色、双色渐变或上传图片。
