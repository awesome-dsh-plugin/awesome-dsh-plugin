name: HanYu-me/dsh-sider-task-reviewer
category: agi
description:
  en: 'Sider Task Reviewer: another model of your choice (any provider dsh has, with its reasoning effort) reviews the task the current conversation is doing or has done. Review the last turn, the whole conversation or turns N–M; look at the conversation, the files it wrote, or both; quick, or deep, where the reviewer may also read files, list folders and search. Read-only throughout: neither the plugin nor the reviewer ever edits a file or runs a command (no tests, no builds, no git); anything that needs a change or a command run is written as a suggestion for the main conversation to do. Agent-style reviewers such as Antigravity (Gemini through the agy CLI) are run in their read-only plan mode. Each review gives a verdict (pass / doubt / fail) and findings with severity, evidence and a suggestion, saved per conversation and exportable as Markdown. The reviews of one conversation remember each other: each new review is sent with the earlier conclusions and the discussion, so the reviewer stays consistent, and you can discuss the latest review with the reviewer in the panel (its replies can go into the input box). A right-sidebar tab holds the settings and reports; a shield beside the input box reviews the last turn on a left click and puts the suggestions into the input box, and opens a menu on a right click. Findings reach the working model only when you press a button, or in continuous review, which sends them, waits for the fix and reviews again until a review passes or the round limit (5 by default). Optional live review after every turn only reports. Four built-in prompts (work done, derivations, literature surveys, plans) that you can edit, plus your own. Common secrets are hidden before anything is sent. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '任务审查（Sider Task Reviewer）：用你选的另一个模型（dsh 里的任何模型，可选思考强度）审查当前对话正在做或已经做完的任务。范围可选最后一轮、整个对话或第 N–M 轮；内容可选对话、写出的文件或两者；深度分快速和深入（深入时审查模型还可以读文件、列目录、搜索来核实）。全程只读：插件和审查模型都不会修改任何文件，也不运行任何命令（测试、构建、git 都不运行），需要修改或需要运行才能确认的，都写成建议交给主会话去做。Antigravity（通过 agy CLI 运行的 Gemini）这类会自己用工具的审查模型，以只读的 plan 模式运行。每次审查给出结论（通过 / 有疑问 / 有问题）和带严重度、证据位置、建议的问题列表，按对话保存，可导出 Markdown。同一个对话的审查前后连贯：每次审查都带上之前的结论和讨论；也可以点最近一次报告，在面板里和审查 AI 讨论，它的回答可以放进输入框。右侧边栏「任务审查」页签放设置和报告；输入框旁的盾牌左键审查最后一轮并把建议放进输入框，右键打开菜单。审查结果只有你点按钮时才发给主模型；「连续审查」会自动发送、等主对话修改后再审，直到通过或达到轮数上限（默认 5 轮）。可选的实时审查在每轮结束后审查，只提示不打断。内置四个提示词（标准、理论推导、文献与事实、任务计划），都可以修改，也能新建自己的。发送前隐藏常见的密钥和 token。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
