description:
  en: 'Connects DeepSeek Harness to a local SolidWorks install through an MCP server, with a read-only default mode and per-call confirmation for high-risk operations. Windows 10/11 x64 only; needs Python 3.10+ x64 with the packages in requirements.txt (npm run setup builds a local .venv) and a local SolidWorks desktop (README: 2020-2026, verified on 2026) started at least once.'
  zh: '通过 MCP 服务器把 DeepSeek Harness 接入本机 SolidWorks，默认只读模式，高风险操作逐次确认。仅 Windows 10/11 x64；需 Python 3.10+ x64 并装好 requirements.txt 中的依赖（可用 npm run setup 建本地 .venv），且本机已安装并至少启动过一次 SolidWorks 桌面版（README 标称 2020–2026，实机仅验证 2026）。'
