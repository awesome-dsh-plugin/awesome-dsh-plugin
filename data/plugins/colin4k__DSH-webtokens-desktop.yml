url: https://github.com/colin4k/DSH-webtokens-desktop
name: colin4k/DSH-webtokens-desktop
category: model
description:
  en: 'A Desktop 0.2.2-rc.1 adaptation of DSH WebTokens that registers a signed-in Chrome DeepSeek web session as the deepseek-web model in DeepSeek Harness, with tool-call transport, reply validation, a Chrome bridge extension, plus install and rollback scripts. It cannot be installed with the one-line plugin add shown on this page: it needs its own installer (node scripts/install-desktop.mjs, which backs up the whole profile first). Prompts, project content and tool results are sent to the DeepSeek website through your Chrome session; the author has tested it on macOS only.'
  zh: 'DSH WebTokens 的 Desktop 0.2.2-rc.1 适配版：把已登录的 Chrome DeepSeek 网页会话注册为 Harness 的 deepseek-web 模型，提供工具调用传输、回复校验、Chrome 桥接扩展，以及安装与回滚脚本。不能用本页显示的单条 plugin add 命令安装：它需要自己的安装脚本（node scripts/install-desktop.mjs，会先备份整个 profile）。提示词、项目内容和工具结果会经你的 Chrome 会话发往 DeepSeek 网页；作者只在 macOS 上测试过。'
tarball: https://github.com/colin4k/DSH-webtokens-desktop/releases/latest/download/dsh-web-bridge.tgz
