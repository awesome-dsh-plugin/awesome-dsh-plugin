description:
  en: 'macOS 14.2+ only: the macOS counterpart to Lingwuxin/dsh-audio-rail — the DSH conversation rail pulses with whatever the Mac is playing, a real 12-band spectrum that only changes bar length, leaving the host state colours and lengths untouched. Requires the Audio Recording permission on first run. Do not install it alongside dsh-audio-rail: both drive the same rail and register the same /audio-rail/events and /audio-rail/status routes.'
  zh: 'macOS 14.2+ 专享：Lingwuxin/dsh-audio-rail 的 macOS 对应版，让 DSH 会话页右侧的锚点跟着 Mac 播放的音乐律动，12 段真实频谱只改长度，不覆盖宿主的状态颜色与长度。首次运行需授予「音频录制」权限；请勿与 dsh-audio-rail 同装——两者驱动同一处锚点并注册相同的 /audio-rail/events 与 /audio-rail/status 路由。'
