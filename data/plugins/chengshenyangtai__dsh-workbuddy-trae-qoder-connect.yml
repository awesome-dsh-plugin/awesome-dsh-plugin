description:
  en: One plugin that brings WorkBuddy (multi-account and enterprise), Qoder CN and Trae CN or TRAE SOLO CN subscriptions into a single DSH model picker with a shared conversation history, live credit multipliers, per-model reasoning effort and daily check-in.
