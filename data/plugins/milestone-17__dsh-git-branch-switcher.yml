description:
  en: 'A composer chip that shows the current git branch of the session working directory and switches branches from a TRAE-style popup menu: one-click git fetch for remote branches, remote-tracking branches listed separately and checked out as local tracking branches, a create-branch flow that picks the base branch (master by default) and switches the session onto the new branch right away, a push panel that stages any checked subset of the working-tree changes, commits them and pushes with automatic upstream setup, a merge panel with two dropdowns that infers the pull source as the default target, lists conflicting files and offers one-click abort, and a stash panel that sets aside any checked subset of changes, untracked files included, and restores it later with keep or pop. The panels show a loading state instead of a stale "clean tree" message, and the chip stays instant when you switch conversations. The chip hides itself outside git repositories.'
  zh: '在输入框工具行显示当前 git 分支的胶囊按钮，点击弹出 TRAE 风格菜单切换分支：右上角可一键 git fetch 同步远端分支，远端跟踪分支单独分组并可一键检出为本地跟踪分支，底部「＋ 新建分支」可选源分支（默认 master）创建并立即把会话切到新分支，「↑ 推送」可勾选任意一部分改动提交并推送（首推自动建上游），「⇆ 合并」双下拉选择来源与目标（默认推断拉取来源）、冲突时列出文件并可一键放弃合并，「⌸ 暂存」可把勾选的改动（含未跟踪文件）收起来并随时恢复（保留或恢复并删除）。面板首次打开显示加载态，不会误报「工作区干净」，切换会话时胶囊即时出现。非 git 目录下自动隐藏。'
