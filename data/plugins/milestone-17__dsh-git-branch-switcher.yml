url: https://github.com/milestone-17/dsh-git-branch-switcher
name: milestone-17/dsh-git-branch-switcher
category: ui
description:
  en: 'A composer chip that shows the current git branch of the session working directory and switches branches from a TRAE-style popup menu: one-click git fetch for remote branches, remote-tracking branches listed separately and checked out as local tracking branches, and a create-branch flow that picks the base branch (master by default) and switches the session onto the new branch right away. The chip hides itself outside git repositories.'
  zh: '在输入框工具行显示当前 git 分支的胶囊按钮，点击弹出 TRAE 风格菜单切换分支：右上角可一键 git fetch 同步远端分支，远端跟踪分支单独分组并可一键检出为本地跟踪分支，底部「＋ 新建分支」可选源分支（默认 master）创建并立即把会话切到新分支。非 git 目录下自动隐藏。'
icon: https://raw.githubusercontent.com/milestone-17/dsh-git-branch-switcher/master/assets/icon-180.png
