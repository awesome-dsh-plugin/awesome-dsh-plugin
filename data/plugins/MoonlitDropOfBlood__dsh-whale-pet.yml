name: MoonlitDropOfBlood/dsh-whale-pet
category: fun
description:
  en: 'WhaleHarbor desktop pet for DeepSeek Harness: an always-on-top transparent float window hosts a chibi whale-maid built from 13 AI-generated parts and animated as a CSS paper-doll (breathing, blinking, ahoge sway, sweat, hops, tremors), mirroring work state in eight moods — idle, busy, approval, question, error, celebration, nap, and subagent clones — with poke, drag, three sizes, tray toggle, and live stats in the speech bubble. Requires the WhaleHarbor desktop shell (Windows build).'
  zh: '鲸港 WhaleHarbor 大白鲸娘桌面窗宠：13 个 AI 生成零件以 CSS 纸片人方式驱动（呼吸、眨眼、呆毛摇摆、汗滴、蹦跳与抖动），八种状态实时反映 DSH 工作情况——空闲、忙碌、审批、提问、出错、庆祝、打盹、子代理分身——支持戳一戳、拖动、三档尺寸、托盘开关与气泡实时统计。需 WhaleHarbor 桌面壳（当前提供 Windows 构建）。'
