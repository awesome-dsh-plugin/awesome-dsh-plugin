description:
  en: 'Markdown ticket types plus a single-account currency for DSH agents: five wallet tools (list, request, exchange, redeem, templates), approval-gated issuing, md5-bound one-shot tickets with a transaction ledger, and a Web panel in Settings or the right sidebar, with every panel route going through the DSH access check of the host.'
  zh: '给 DSH agent 的票夹：md 模板即票种 + 单账户鲸圆券 + md5 绑定的一次性票据；5 个钱包工具（列模板、查票、要票、自主兑换、核销）+ 审批签发 + 流水账 + 设置页/右侧栏 Web 面板；面板的 HTTP 路由走宿主的 DSH 访问检查。'
