category: market
description:
  en: "Plugin Steward adds a plugin panel to the chat composer for managing the installed DeepSeek Harness plugins: list them, switch them on or off, edit a plugin's settings, hide one plugin's tools or MCP servers from a single conversation, and have the model write short Chinese labels for installed plugins by reading their own README and package files."
  zh: "插件管家：在对话输入框上加入插件面板，用来管理本机已装的 DSH 插件——列出全部插件、全局启停、逐个编辑插件设置、把某个插件的工具或 MCP 服务器只在这一个对话里对模型隐藏，还能让模型读插件自身的 README 与包信息生成中文标签。面板可拖动并记住位置。"
