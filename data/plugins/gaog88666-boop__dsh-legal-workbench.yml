name: gaog88666-boop/dsh-legal-workbench
category: ui
description:
  en: "A right-sidebar workbench for legal practice backed by a folder of Markdown notes: SOP lookup, recordings with live transcription and line-level annotations, an inline glossary, and full-text search. Optional email rules library, Pkulaw points and usage badges. Notes, recordings and annotations stay on the local machine; live transcription needs your own Volcengine key and sends audio to Volcengine."
  zh: "以 Markdown 笔记文件夹为事实源的法律实务工作台：SOP 速查、录音实时转写与逐句批注、可编辑术语表、全文搜索；可选邮件规则库、法宝积分与用量角标。笔记、录音与批注只存本机；实时转写需自备火山引擎密钥，音频会发往火山引擎。"
