url: https://github.com/brantshin/dsh-native-glass
name: brantshin/dsh-native-glass
category: theme
description:
  en: Reveals the real wallpaper and windows behind the main chat area in Anywhere Labs DSH Desktop on macOS, using native glass with adjustable background and panel opacity.
  zh: 在 macOS 的 Anywhere Labs DSH Desktop 中让主聊天区透出真实壁纸和后方窗口，复用原生玻璃材质并支持调整背景与面板不透明度。
