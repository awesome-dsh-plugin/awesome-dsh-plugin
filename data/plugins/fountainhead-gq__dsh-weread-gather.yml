name: fountainhead-gq/dsh-weread-gather
category: ui
description:
  en: "Digital Study: a private WeRead study in the DSH sidebar. The shelf folds into ten categories, and highlights and thoughts page through, copy per item, and export as front-matter Markdown (one file per book or a cross-book batch) into a folder you choose; the whole study backs up and restores as a single JSON bundle. A reading heatmap and a year-switched KPI dashboard sit on top, and search covers shelf, books, highlights and thoughts with type filters and Cmd+K. Reads WeRead through the official agent gateway using your own API key, keeps everything in local JSON and never writes back. Requires DSH >=0.2.2-rc.1."
  zh: "数字书房：把微信读书搬进 DSH 侧栏的私人书房。书架折叠成 10 大类，划线与想法可分页、可单条复制，也能勾选导出成带 front-matter 的 Markdown（一本书一个文件，或跨书批量），存到你指定的目录；整间书房还能一键备份与恢复成一份 JSON。顶部是阅读热力图与可切换年份的统计表盘，书架、书籍、划线、想法都能搜索，支持类型筛选与 Cmd+K。通过官方 agent 网关用你自己的 API Key 读取，全部落在本机 JSON，绝不写回。要求 DSH >=0.2.2-rc.1。"
icon: https://raw.githubusercontent.com/fountainhead-gq/dsh-weread-gather/main/assets/icon.png