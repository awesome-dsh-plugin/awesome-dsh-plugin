url: https://github.com/pearjelly/deep-blend/tree/main/packages/deepblend/bundle
name: pearjelly/deep-blend#bundle
# `#bundle` rather than a prettier `#deepblend`: the gate's own rule is `owner/repo#<last segment of the
# subdirectory the url points at>`, and its example is `…/packages/my-plugin` → `owner/repo#my-plugin`.
# A nicer label would have to come from renaming the directory, which the rest of the repository pins.
category: tools
# The release asset `tools/build-release-tarball.mjs` builds and `gh release` attaches. `latest/download/` plus a
# name with no version in it is what keeps this URL alive across releases; `--check` on that tool fails if a
# version ever appears in the asset name.
tarball: https://github.com/pearjelly/deep-blend/releases/latest/download/deepblend-bundle.tgz
description:
  en: 'Create editable Blender product scenes in DSH. Start from walnut trivet, speaker, cup and lamp recipes or imported models; view saved results on the Lighttable, compare revisions, and adjust dimensions, materials, cameras and lights. Keep trivet cross-slats centered at 52–92 mm spacing and set timber edge bevels from 0 to 1 mm when creating or editing a trivet. Place static models on actual mesh surfaces in one saved operation, then save a complete static view while preserving existing cameras and animation. Repair repeating texture coordinates on planar custom mesh faces while preserving geometry. Preview both recesses of a timber half lap before saving. Arrays and mirrors remain editable. Render images or saved-shot videos and export an editable revision with its assets. English guides cover creation, modeling, photography, recovery and agent tools. Native geometry inspections, immutable revisions and an approval gate help preserve existing work. Supports DSH 0.2.1-rc.1 and the legacy host, with 20 tools for modeling, review and delivery. Beginning with 0.28.0, the workbench and its HTTP routes use the DSH owner session. The 0.28.1 maintenance release fixes the Linux build of the self-contained installer. In 0.29.0, include both named members of a saved timber half lap, preview the UV settings from a saved camera, and save both groups in one revision. In 0.30.0, use an inspected photo as the base color on both members of a saved timber half lap in one save. Each material keeps its own roughness value and other image maps.'
  zh: '在 DSH 中创建可编辑的 Blender 产品场景。从胡桃木格栅垫、音箱、杯与灯具配方或导入模型开始，在光台查看保存结果、比较版本，调整尺寸、材质、相机与灯光。创建或继续修改格栅垫时，可将横条间距设为 52–92 mm 并保持居中，也可设置 0–1 mm 的木条边缘倒角。一次操作将静态模型放到实际网格表面并保存，再另存完整静态取景，保留原相机和动画。逐面修复自定义网格上的重复纹理坐标并保持几何不变。保存半搭接前可预览上下槽口，阵列和镜像参数仍可编辑。渲染图片或分镜影片，也可将一个版本连同素材导出为可编辑副本。提供创建、建模、摄影、恢复与工具契约的英文指南。原生几何检查、不可变历史和审批闸门帮助保留已有作品。适配 DSH 0.2.1-rc.1 并保留旧宿主入口，提供 20 个建模、评审与交付工具。从 0.28.0 起，工作台及其 HTTP 路由使用 DSH 所有者会话。0.28.1 修复独立安装包在 Linux 环境下的构建。0.29.0 支持选中已保存半搭接的两组木条，用已保存相机预览逐面 UV 设置，并一次保存两组修改。 0.30.0 可将已检查的照片作为两组半搭接木条的底色贴图，一次保存。两组材质各自保留粗糙度数值和其他图片贴图。'
