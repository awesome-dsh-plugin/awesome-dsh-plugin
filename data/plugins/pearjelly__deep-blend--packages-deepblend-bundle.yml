url: https://github.com/pearjelly/deep-blend/tree/main/packages/deepblend/bundle
name: pearjelly/deep-blend#bundle
# `#bundle` rather than a prettier `#deepblend`: the gate's own rule is `owner/repo#<last segment of the
# subdirectory the url points at>`, and its example is `…/packages/my-plugin` → `owner/repo#my-plugin`.
# A nicer label would have to come from renaming the directory, which the rest of the repository pins.
category: tools
# The release asset `tools/build-release-tarball.mjs` builds and `gh release` attaches. `latest/download/` plus a
# name with no version in it is what keeps this URL alive across releases; `--check` on that tool fails if a
# version ever appears in the asset name.
tarball: https://github.com/pearjelly/deep-blend/releases/latest/download/deepblend-bundle.tgz
description:
  # Quoted one-line descriptions; keep the canonical text here and project it.
  en: 'Create editable Blender product scenes in DSH. Start from speaker, cup and lamp recipes or imported models; view saved results on the Lighttable, compare revisions, and adjust dimensions, materials, cameras and lights. Place static models on actual mesh surfaces in one saved operation, then save a complete static view while preserving existing cameras and animation. Repair repeating texture coordinates on planar custom mesh faces while preserving geometry. Render images or saved-shot videos and export an editable revision with its assets. Native geometry inspections, immutable revisions and an approval gate help preserve existing work. Supports DSH 0.2.1-rc.1 and the legacy host, with 20 tools for modeling, review and delivery.'
  zh: '在 DSH 中创建可编辑的 Blender 产品场景。从音箱、杯与灯具配方或导入模型开始，在光台查看保存结果、比较版本，调整尺寸、材质、相机与灯光。一次操作将静态模型放到实际网格表面并保存，再另存完整静态取景，保留原相机和动画。逐面修复自定义网格上的重复纹理坐标并保持几何不变。渲染图片或分镜影片，也可将一个版本连同素材导出为可编辑副本。原生几何检查、不可变历史和审批闸门帮助保留已有作品。适配 DSH 0.2.1-rc.1 并保留旧宿主入口，提供 20 个建模、评审与交付工具。'
