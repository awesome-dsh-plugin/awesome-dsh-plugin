url: https://github.com/pearjelly/deep-blend/tree/main/packages/deepblend/bundle
name: pearjelly/deep-blend#bundle
# `#bundle` rather than a prettier `#deepblend`: the gate's own rule is `owner/repo#<last segment of the
# subdirectory the url points at>`, and its example is `…/packages/my-plugin` → `owner/repo#my-plugin`.
# A nicer label would have to come from renaming the directory, which the rest of the repository pins.
category: tools
# The release asset `tools/build-release-tarball.mjs` builds and `gh release` attaches. `latest/download/` plus a
# name with no version in it is what keeps this URL alive across releases; `--check` on that tool fails if a
# version ever appears in the asset name.
tarball: https://github.com/pearjelly/deep-blend/releases/latest/download/deepblend-bundle.tgz
description:
  # Quoted one-line descriptions; keep the canonical text here and project it.
  en: 'Create editable Blender product models in DSH with linked cup dimensions and lamp shade diameter, saved multi-view inspection images with immutable revisions and an approval gate; 18 tools support modeling, previews, visual review and delivery.'
  zh: '在 DSH 中创建可继续编辑的 Blender 产品模型，联动杯尺寸与台灯灯罩直径，返回已保存的多视图检查图并保留不可变历史版本和审批闸门；18 个工具支持建模、预览、视觉评审和交付。'
