url: https://github.com/pearjelly/deep-blend/tree/main/packages/deepblend/bundle
name: pearjelly/deep-blend#bundle
# `#bundle` rather than a prettier `#deepblend`: the gate's own rule is `owner/repo#<last segment of the
# subdirectory the url points at>`, and its example is `…/packages/my-plugin` → `owner/repo#my-plugin`.
# A nicer label would have to come from renaming the directory, which the rest of the repository pins.
category: tools
# The release asset `tools/build-release-tarball.mjs` builds and `gh release` attaches. `latest/download/` plus a
# name with no version in it is what keeps this URL alive across releases; `--check` on that tool fails if a
# version ever appears in the asset name.
tarball: https://github.com/pearjelly/deep-blend/releases/latest/download/deepblend-bundle.tgz
description:
  # Quoted one-line descriptions; keep the canonical text here and project it.
  en: 'Build editable Blender products inside DSH. Start from a walnut trivet, speaker, cup or lamp, or bring an existing model. Resize linked parts, review saved renders, and adjust materials, cameras and lighting. Preview both recesses of a timber half lap, then apply a photo and rebuild both timber groups’ UV maps in one saved version. Place static models on measured mesh surfaces and export a Blender project with its assets. Native geometry inspections, immutable revisions and an approval gate help preserve existing work. Includes 20 tools and English guides for modeling, photography, recovery and delivery. Supports DSH 0.2.1-rc.1 and the legacy host.'
  zh: '在 DSH 中创建可继续编辑的 Blender 产品模型。从胡桃木格栅垫、音箱、杯或台灯配方开始，也可以导入已有模型。联动修改装配尺寸、查看已保存的渲染，并调整材质、相机和灯光。预览木构半搭接的两个槽口，一次保存两组木条的底色照片和重建后的 UV。将静态模型放到实测网格表面，导出带素材的 Blender 工程。原生几何检查、不可变历史和审批闸门帮助保留已有作品。提供 20 个工具，以及建模、摄影、恢复和交付的英文指南。支持 DSH 0.2.1-rc.1 和旧版宿主。'
