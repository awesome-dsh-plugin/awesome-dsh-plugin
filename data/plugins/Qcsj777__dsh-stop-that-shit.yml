url: https://github.com/Qcsj777/dsh-stop-that-shit
name: Qcsj777/dsh-stop-that-shit
category: security
description:
  en: 'Arms an explicit per-session scope contract from a `$stop-that-shit` directive and audits every tool call against it; unarmed it is inert. A DSH bundle wrapping lennney/stop-that-shit (MIT). Do not install it alongside the upstream lennney/stop-that-shit DSH bundle.'
  zh: '用 `$stop-that-shit` 指令显式开启每会话范围契约并逐个工具调用审计；未开启时不干预。基于 lennney/stop-that-shit（MIT）的 DSH 封装。不要与上游 lennney/stop-that-shit 的 DSH bundle 同时安装。'