url: https://github.com/zuwenyin/dsh-plugin-upgrader
name: zuwenyin/dsh-plugin-upgrader
category: market
description:
  en: 'A Versions tab on the Plugins page: one-click upgrades that replace the plugin in place where they can (no uninstall, enabled state preserved, falling back to remove + reinstall with the reason logged when the profile writer lock is busy), live pnpm output with per-step timing and cancel, the full published version history with one-click rollback, every version checked against the running DSH so incompatible ones are marked and blocked, a rollback that installs the old version but cannot activate it reported separately from a lost package, profile manifest writes taken under the harness writer lock with one recoverable journal record per package after a failed upgrade, mirror-gap warnings, and a selectable npm registry saved in the profile.'
  zh: '在「插件」页新增「版本」标签：一键升级，能就地替换时就地替换（不卸载、启用状态保留；拿不到 profile 写入锁时退回卸载再装，并在日志写明走了哪条路），实时显示 pnpm 输出、每步耗时并可取消，列出全部已发布版本并一键回滚，每个版本先与当前运行的 DSH 核对，装不了的标出并禁用按钮，回滚时装回却无法激活的情况与包丢失分开说明，profile manifest 读写走 harness 自己的写入锁，升级失败后按包各留一条可恢复的 journal 记录，标出镜像落后上游的缺口，安装源可选并写进 profile。'
icon: https://raw.githubusercontent.com/zuwenyin/dsh-plugin-upgrader/main/assets/icon-180.png
