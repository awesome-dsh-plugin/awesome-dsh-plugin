url: https://github.com/zuwenyin/dsh-plugin-upgrader
name: zuwenyin/dsh-plugin-upgrader
category: market
description:
  en: 'A Versions tab on the Plugins page: in-place upgrades where it can (no uninstall, enabled state kept, falling back to remove + reinstall when the profile writer lock is busy), live pnpm progress with cancel, the full published version history with one-click rollback, a per-version check against the running DSH, mirror-gap warnings, and a selectable npm registry saved in the profile.'
  zh: '在「插件」页新增「版本」标签：优先原位替换（不卸载、启用状态保留，拿不到 profile 写入锁时退回卸载再装），实时显示 pnpm 进度并可取消，列出全部已发布版本并一键回滚，逐个版本与当前运行的 DSH 做兼容性判断，标出镜像落后上游的缺口，安装源可选并写进 profile。'
icon: https://raw.githubusercontent.com/zuwenyin/dsh-plugin-upgrader/main/assets/icon-180.png
