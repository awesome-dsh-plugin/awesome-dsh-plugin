url: https://github.com/YeYirp/dsh-wechat-kb
name: YeYirp/dsh-wechat-kb
category: remote
description:
  en: 'One plugin holding two halves that share a settings page. The first bridges WeChat desktop on Windows to DSH: a Python side (bridge/wechat_bridge.py, dependencies installed into ~/.dsh/wechat-bridge-venv or a bundled runtime) drives the client through UI Automation, incoming chats are answered by the agent and sent back as real messages with UIA @-mentions, each chat can be bound to its own session, inbound forwarding is fail-closed (with an empty allowlist nothing is forwarded until chats, wxids or the owner are added explicitly), and it adds per-chat diary files, group reply spacing and hourly caps, owner / whitelist / blocklist rules, image understanding through a vision model, and a queued outbox that waits for acknowledgement. The second is a local knowledge base kept in a JSON file with no database, embedding model or API key: PDF, Word, Excel, PowerPoint, image and audio files are imported, images extracted from PDFs are OCR''d through an OpenAI-compatible chat endpoint (on by default, pointed at the local gateway and deepseek-official/deepseek-flash) and stored with the document, and retrieval is keyword scoring over the local store exposed as seven project_knowledge_* tools plus a system-prompt section for answer/review behaviour. Both halves are the upstream plugins dsh-wechat-bridge 1.4.0 (MIT, Yuuyuko-uu / thawline) and dsh-project-knowledge-review 0.5.14, kept as they were apart from the merged entry point and one combined settings page. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '一个插件里放两半，共用一个设置页。前一半把 Windows 上的微信桌面端接进 DSH： 一段 Python 侧（bridge/wechat_bridge.py，依赖装进 ~/.dsh/wechat-bridge-venv 或 自带的运行环境）通过 UI Automation 驱动客户端，来信交给 agent 回答并用 UIA 真 @ 发回去；每个聊天可以绑到自己的会话，入站转发默认拒绝（白名单为空时一条都不转，必须显式加入聊天、wxid 或主人）；另有按聊天分文件的日记、 群回复间隔与每小时上限、主人/白名单/屏蔽名单、走视觉模型的看图，以及等确认的 待发队列。后一半是不用数据库、不用向量模型、不用填 Key 的本地知识库：正文存一个 JSON 文件，可导入 PDF、Word、Excel、PowerPoint、图片和音频，PDF 里抽出的图会经 OpenAI 兼容的 chat 接口做 OCR（默认打开，指向本机网关与 deepseek-official/deepseek-flash）并与正文一起保存；检索是本地关键词打分， 以七个 project_knowledge_* 工具加一段系统提示词的形式提供问答与复习行为。 两半分别是上游 dsh-wechat-bridge 1.4.0（MIT，Yuuyuko-uu / thawline）与 dsh-project-knowledge-review 0.5.14，除合并入口与唯一的一个设置页外保持原样。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
