name: kennethfan/dsh-session-fold
category: session
tarball: https://github.com/kennethfan/dsh-session-fold/releases/latest/download/dsh-session-fold.tgz
description:
  en: 'Folds older oversized tool results into spill files and replaces them with short, deterministic stubs at step boundaries, with no LLM call: the stub keeps the first 200 and last 80 characters plus the sequence number, tool name, line/char/size counts and the original file path, and each fold is a real surface replacement accompanied by compaction/prune shadow pricing so token counts stay honest. Triggers on context pressure at 25% of the model window (falling back to 32768 tokens when the window cannot be resolved) or on five accumulated candidates; the last three turns, error results and rich content are never folded. The original is recovered from the session log rather than the spill file, so /folds, /unfold <seq> and /unfold all keep working after spill cleanup; session_fold_recall lets the model fetch a folded result by sequence number or by keyword, and session_fold_diagnose reports the effective settings. /spill-prune removes orphaned spill directories, preview only unless --apply. A Settings page exposes 12 of the 13 options as draft-then-save fields; they are volatile, so saved changes apply without restarting the plugin.'
  zh: '在 step 边界把较早的超长工具输出折叠为落盘原文加短替身，全程不调用模型：替身保留原文头 200 与尾 80 字符，并附序号、工具名、行数/字符/大小统计与原文路径；每次折叠都是真实的 surface 替换，并紧邻写入 compaction/prune 影子计价，token 统计不虚高。上下文估算达到模型窗口 25%（解析不出窗口时退回 32768 token）或候选积满 5 条即触发；最近 3 轮、错误结果与富内容永不折叠。原文从会话日志恢复而非 spill 文件，因此 spill 被清理后 /folds、/unfold <序号>、/unfold all 依然可用；session_fold_recall 供模型按序号取整条原文或按关键词检索，session_fold_diagnose 输出当前生效配置。/spill-prune 清理无主的 spill 目录，默认只预览，加 --apply 才删。设置页把 13 个配置项中的 12 个暴露为「先改草稿、再点保存」的字段，且为 volatile，保存后无需重启插件。'
