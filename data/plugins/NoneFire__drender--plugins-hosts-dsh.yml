  en: 'DeepSeek Harness tools and a Skill for md-report/1: validate and render Markdown plus declared SQLite/CSV datasets into one offline interactive HTML report or dashboard, with AntV G2 charts (ECharts fallback) and chart/table data and source-SQL views.'
