url: https://github.com/Fuxfantx/dsh-qwen-mode
name: Fuxfantx/dsh-qwen-mode
category: model
description:
  en: 'Qwen mode for DSH: manages local GenieX and Alibaba Cloud QwenCloud providers, normalizes thinking and sampling, detects model capabilities, and shows per-turn latency and decode speed. Its bundle patch replaces the permission plugin''s preset table with reply-only, read-only, workspace-write and danger-full-access (the last two as in stock), so any custom presets are overridden.'
  zh: 'DSH 的 Qwen 模式：管理本机 GenieX 与阿里云百炼 QwenCloud 提供商，归一化思考与采样参数，识别模型能力，并显示每轮首字延迟与解码速度。随包补丁会整体替换权限插件的预设表：新增 reply-only 和 read-only，并照原样重列 workspace-write 与 danger-full-access，已有的自定义预设会被覆盖。'
