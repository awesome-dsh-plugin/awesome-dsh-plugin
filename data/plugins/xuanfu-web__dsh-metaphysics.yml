description:
  en: 'Chinese metaphysics (xuanxue) plugin: eighteen systems in one — eight chart systems (BaZi with 42 shensha, pattern / useful-god and luck scoring; Zi Wei Dou Shu with star brightness, 34 patterns and decade / annual mutagen; LiuYao, MeiHua YiShu, Da Liu Ren, Qi Men Dun Jia, compatibility charts and Tarot) plus ten quick references (almanac, solar–lunar conversion, date selection, bone-weight fortune, Xiao Liu Ren, horoscope, numerology, life-curve, feng shui, name analysis). Ask-driven interpretation, evidence cards, DST correction, all computed locally with networking off by default.'
  zh: '玄学命理排盘：十八套体系一站排盘——八套排盘（八字 42 神煞 + 格局用神与大运流年评分、紫微斗数主星庙旺 + 34 格局 + 大限与流年四化、六爻、梅花易数、大六壬、奇门遁甲、合盘、塔罗）加十套速查（黄历、农历、择日、称骨、小六壬、星座、生命数字、人生K线、风水、起名）。可按所问之事生成解析，带证据卡与置信度，并自动校正 1986–1991 夏令时；纯本地计算、默认不联网。'
