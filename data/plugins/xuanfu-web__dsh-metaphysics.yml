url: https://github.com/xuanfu-web/dsh-metaphysics
name: xuanfu-web/dsh-metaphysics
category: ui
description:
  en: 'Chinese metaphysics (xuanxue) divination panel and agent tool with nineteen systems: eight chart systems (BaZi, Zi Wei Dou Shu, LiuYao, MeiHua, Da Liu Ren, Qi Men Dun Jia, compatibility charts, Tarot) plus eleven quick references (almanac, solar–lunar conversion, date selection, bone-weight fortune, Xiao Liu Ren, horoscope, numerology, life-curve, feng shui, name analysis, an MBTI-style 16-type questionnaire), with ask-driven, report-style interpretation. BaZi adds exact dayun handover dates, annual suiyun hints, "passing-through" (通关), three-book classical cross-reference, four-mausoleum (杂气) month pattern selection and daily "human element" (人元司权); Zi Wei adds 34 patterns, eleven switchable school variants (including an opt-in full 61-star minor-star table that ships the placement verses alongside the chart), chained flying transformations and three-way-four-corner composite flights; LiuYao adds yongshen strength, whole-hexagram per-line strength, hidden-spirit release conditions and response-time clues (应期), while LiuYao and MeiHua quote the received Zhouyi text in full (64 hexagram statements, 384 line statements plus 用九/用六, cross-checked across three editions with variant readings in brackets); feng shui covers eight-mansion and Xuan Kong flying stars; name analysis ships a 1,062-character library with five-grid (五格) numerology and phonetics checks; tarot ships a card-by-card library for all 78 cards (Rider-Waite-Smith base: English name, card-image description, core meaning and astrological correspondence, cross-checked against three published sources — court cards deliberately carry no zodiac because two published mappings conflict, and the chart says so). A classical-source library now backs the readings: 464 indexed citations from 66 classical works, with 584 verifiable quotations including all 120 Qiongtong Baojian pattern extracts; every quote is checked as a literal substring against a 341-page offline source snapshot, variant readings are kept side by side rather than harmonised, modern editorial notes are kept separate from the classical text, and the quotations with their plain-language glosses live only in a standalone citation index page instead of the browser chunks. Every result can carry a reproducible shadow-chart ID (same normalized inputs → same ID; version bumps auto-diff chart fields) plus optional step-by-step deduction traces (rule, inputs, result and source per layer). The browser client ships as a small first-screen entry plus per-tab engine chunks loaded on demand (first-screen gzip ≈ 90KB), while the offline page stays a single file. The DSH panel and the offline page share the same grouped first screen (ask / read a person / pick a date) with recent-used entries and narrow-width folding; charts open with a plain-language conclusion, one-click copy of an ask-ready prompt and saved birth charts, and an unknown birth hour falls back to a three-pillar chart instead of silently assuming midnight. All computed locally; networking is off by default. The npm package also ships an offline single-file page (命理排盘.html): double-click to open, every tab included, no server and no network needed.'
  zh: '玄学命理排盘：十九套体系——八套排盘（八字、紫微斗数、六爻、梅花易数、大六壬、奇门遁甲、合盘、塔罗）加十一套速查（黄历、农历互转、择日、称骨、小六壬、星座、生命数字、人生K线、风水、起名、十六型人格问卷），并可按所问之事生成可读报告；八字含交运日、岁运并临/伏吟反吟、通关、三书对照与杂气月取格/人元司权，紫微含 34 格局、十一类流派开关（含可显式开启的 61 颗杂曜全表，逐颗附安星诀与本盘落宫，诀文按多处独立辑本同表才收、同名异星不合并）、飞星串连与三方四正复合飞化，六爻与梅花含《周易》经文原文（64 卦辞、384 爻辞加用九用六，三本互校、异文括注），六爻含用神旺衰、全卦逐爻旺衰、伏神出伏与应期线索，风水含八宅与玄空飞星，起名含 1062 字库与 998 姓 / 82 复姓的姓氏库（逐姓康熙笔画）、五格剖象与音韵检查，塔罗含 78 张逐张牌义库（RWS 底本，牌面图像、核心义与占星对应经三处公开资料互核；宫廷牌两派映射冲突故不配星座并写明）；另建古籍引文库：66 种典籍、464 条索引（含《穷通宝鉴》120 格在内共 584 条可核验原文），逐句对照 341 页离线底本快照核为子串，异文并列不调和、今人按语与古籍正文分层，原文与白话只放在独立索引页、不进浏览器分块；每张结果可带可复现的影子盘短 ID（同参同 ID、跨版本自动字段 diff）与可选推导链（逐层规则、输入、结果、出处）；浏览器入口只带界面，按 tab 懒加载引擎分块（首屏 gzip 约 90KB），离线页仍是单文件；宿主面板与离线页共用同一套分组首屏（问一件事/看一个人/查日子），带最近用过与窄屏收纳，盘面先给一段人话结论、可一键复制问事提示与保存「我的命盘」，时辰未知改走三柱模式而不静默按子时；纯本地计算，默认不联网。npm 包内另附离线单文件页（命理排盘.html）：双击即开，十九个 tab 齐全，不用起服务、不用联网。'
