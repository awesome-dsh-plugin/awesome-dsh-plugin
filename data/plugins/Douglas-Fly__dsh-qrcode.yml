url: https://github.com/Douglas-Fly/dsh-qrcode
name: Douglas-Fly/dsh-qrcode
category: tools
description:
  en: 'Generates a QR code from any text and reads one back out of a PNG or JPEG. Also scans images sent in a message automatically and adds a select-text button in the Web UI. The QR encoder is built in, and the plugin makes no network requests.'
