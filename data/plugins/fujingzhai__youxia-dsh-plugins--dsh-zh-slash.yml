description:
  en: "Typing the Chinese enumeration comma 、 at the start of the DSH input box opens the native / command menu; the existing filtering, keyboard and mouse handling and argument panels are unchanged, and 、 used mid-sentence is unaffected."
  zh: "在 DSH 输入框开头输入顿号「、」即弹出原生 / 命令菜单；原有中英文筛选、方向键与鼠标操作、参数面板均沿用原生行为，句中顿号与输入法组合过程不改写。"
