url: https://github.com/AKS1st/dsh-cyber-particle
name: AKS1st/dsh-cyber-particle
category: theme
description:
  en: 'Particle-network background overlay for the DSH Web shell: full-screen, click-through, zero runtime dependencies.'
  zh: 为 DSH Web 界面提供粒子网络动态背景：全屏覆盖、点击穿透、零运行时依赖；以及开放事件源：其他插件可注入 notifier 服务（ctx.notifier）并订阅 dsh-notifier/sent 发送事件——复用通知能力而无需耦合；以及身份体系（v0.7）：配对码准入（任意私聊 /pair，首位核销者成为 owner）、复合键绑定、成员角色、空白名单引导态。
  ja: DSH Web シェルの背景に粒子ネットワークを重ねるオーバーレイ。全画面・クリックスルー・実行時依存ゼロです。
