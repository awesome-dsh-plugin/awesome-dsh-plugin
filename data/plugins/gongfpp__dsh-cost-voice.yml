name: 大白饭到账语音播报
category: usage
description:
  en: 'Dabaifan Arrival Voice Announcements speaks the estimated spend per turn with the bundled Dabaifan voice by default; Alipay is optional. Amounts come from dsh-cost-meter or model-price estimates, not payment records. No runtime TTS service.'
  zh: '大白饭到账语音播报：每轮结束默认用内置大白饭语音提醒本轮估算花费，也可切换支付宝；优先读取 dsh-cost-meter，否则按模型单价估算，不是支付通知，无需联网语音服务。'
