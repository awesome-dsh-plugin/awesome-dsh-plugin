name: feely0208/dsh-release-selfcheck
category: security
description:
  en: 'Pre-release checks: artifact inventory, version consistency, platform/architecture correctness, upload filtering and dead links.'
  zh: '软件发布前的自检：产物清单比对（防止把无关文件一起上传）、版本一致性、平台与架构正确性、上传内容过滤、上线前逐链接 404 检查、发布纪律与现场清理。'
