description:
  en: 'Message review and quote chips for conversations: multi-model cross review (code/reply) with severity grading and summaries, review history, and host-persisted preferences.'
  zh: 对话消息审查与引用：多模型并行互审（代码/回复审查、严重度分级、综合汇总）、引用问答胶囊、评审历史与偏好记忆。
  ja: 会話用のメッセージレビューと引用チップ。複数モデルによる相互レビュー（コード/返信）を深刻度の採点と要約つきで行い、レビュー履歴とホスト側に保存される設定を備えます。
