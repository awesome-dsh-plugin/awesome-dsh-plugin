description:
  en: 'Enhanced ACP server for DeepSeek Harness: block & reasoning streaming, usage telemetry, model/effort switching, permission presets, session resume/archive, per-session MCP servers, and Zed file/terminal forwarding.'
  zh: 增强版 ACP 服务器：块级与推理流式、用量遥测、模型/推理强度切换、权限预设、会话恢复/归档、每会话 MCP servers、Zed 文件/终端转发。
  ja: DeepSeek Harness 向けの強化版 ACP サーバー。ブロックと推論のストリーミング、使用量テレメトリ、モデルと推論強度の切り替え、パーミッションのプリセット、セッションの再開/アーカイブ、セッションごとの MCP サーバー、Zed のファイル/ターミナル転送に対応します。
