url: https://github.com/Oxygen640/dsh-plugin-nuaa-search
name: Oxygen640/dsh-plugin-nuaa-search
category: browser
description:
  en: 'Zero-key web search provider for the built-in web_search tool: scrapes Bing China, 360 and SearXNG through a backend fallback chain and returns real URLs with snippets and publish dates. No API key and no settings card are required. SearXNG is used only when you set your own instance URL, and installing this plugin switches web_search to it and turns off the official DeepSeek search row.'
  zh: '免 key 的 web_search 后端：按降级链抓取 Bing 中文站、360 与 SearXNG，返回真实 URL、摘要与发布日期；不需要任何 API key，也没有设置卡片。面向校园网等拿不到官方 key 的环境。SearXNG 仅在配置自有实例地址后才会启用；安装后 web_search 会切换到本插件，并停用官方 DeepSeek 搜索行。'
icon: https://raw.githubusercontent.com/Oxygen640/dsh-plugin-nuaa-search/main/assets/icon-180.jpg
tarball: https://github.com/Oxygen640/dsh-plugin-nuaa-search/releases/latest/download/dsh-plugin-nuaa-search.tgz
