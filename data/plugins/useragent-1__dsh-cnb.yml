description:
  en: 'CNB (cnb.cool) integration: WeChat QR sign-in, repository and environment control, organization usage, and CNB AI gateway wiring. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'CNB（cnb.cool）集成：微信扫码登录、仓库与云原生开发环境管理、组织用量统计，以及 CNB AI 网关接入。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
