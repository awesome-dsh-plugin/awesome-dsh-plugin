url: https://github.com/magicOF2/dsh-schedule
name: magicOF2/dsh-schedule
category: ui
description:
  en: 'Local long-term schedule panel: top-bar "日程" text button, today/week/history month-calendar views with stats, completion checkmarks with per-day history, schedule↔conversation links with click-to-jump, recurring tasks (daily/weekly), optional auto carry-over for unfinished one-time tasks, and dailytask_* agent tools.'
  zh: 本地长期日程面板:顶栏「日程」文字按钮、今天/本周/历史月历统计视图、完成打勾(按天记录历史)、日程↔会话链接点击跳转、重复日程(每天/每周)、一次性日程可选未完成自动顺延,以及 dailytask_* agent 工具。