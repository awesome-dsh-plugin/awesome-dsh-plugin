name: Zoria-Lind/dsh-ecolink#adapter
category: memory
description:
  en: 'DSH side of the dsh-ecolink memory ecosystem — install alongside the companion @zoria-lind/dsh-ecolink-service (npm, local memory-pool server) and the browser extension from the repo''s extension/ directory. Bridges chat.deepseek.com and DeepSeek Harness: the extension harvests DSM-format memory tags and injects recalled memories into web chats, the zero-dependency local service writes a shared memory pool, and this adapter injects memories pre-step and offers /ecolink-push write-back; compression is transactional (staging pool with commit/rollback).'
  zh: 'dsh-ecolink 记忆生态的 dsh 侧组件——配套安装：npm 上的 @zoria-lind/dsh-ecolink-service（本地记忆池服务）与仓库 extension/ 目录的浏览器扩展。打通 chat.deepseek.com 与 DSH：扩展收割 DSM 格式记忆标签并向网页对话注入回忆、零依赖本地服务写入共享记忆池、本 adapter 负责 pre-step 注入与 /ecolink-push 写回；压缩为事务化双池（暂存提交/回滚）。'
