url: https://github.com/Zoria-Lind/dsh-ecolink/tree/main/adapter
name: Zoria-Lind/dsh-ecolink#adapter
category: memory
description:
  en: 'Shares a local memory pool between DeepSeek web chat and DSH, with automatic DSM-tag capture, full-answer saving, named retrieval, and sidebar injection. The optional desktop patch for DSH 0.2.2-rc.1 adds same-window DeepSeek chat, selection-to-memory, and zoom. Chrome/Edge extension is optional and used for external browser chat.'
  zh: '让 DeepSeek 网页与 DSH 共用本地记忆池，支持 DSM 短标签自动入池、保存完整回答、指定条目读取和侧栏注入。可选桌面补丁支持 DSH 0.2.2-rc.1，提供同窗 DeepSeek、划选入池和缩放。Chrome/Edge 扩展供外部浏览器按需安装。'
