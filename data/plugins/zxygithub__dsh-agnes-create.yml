url: https://github.com/zxygithub/dsh-agnes-create
name: zxygithub/dsh-agnes-create
category: vision
description:
  en: 'Sidebar panel for Agnes image and video generation. Images: plain text-to-image, or image-to-image and multi-image composition from up to eight reference images chosen from local files or from results already in the panel, at 1K-4K across eight aspect ratios, with six one-click style presets. Video: agnes-video-2.5-flash at 720p, 4-12 seconds, in three modes that the panel picks for you - plain text, keyframe (first frame, last frame, or both) and reference (up to five images) - plus an optional seed; the task is submitted to the host process, so switching panels, reloading the page and restarting the app all resume it instead of losing the job. The prompt is written into each generated PNG or JPEG and shown again when you hover the result, where one click copies it. Browse the output directory (images and videos on separate tabs) with automatic refresh, copy a path, reveal a file in Finder, or download it; the last 24 generations persist across restarts. Images and videos can also be produced from the chat itself through the agnes_image, agnes_video and agnes_video_status tools. Both the image and the video model can be switched from the panel, with a connection test, and local reference or keyframe images are sent as base64 data URIs so no public image host is needed. Needs an Agnes AI API key saved in a local file (default ~/.agnes-key.txt).'
  zh: '侧边栏 Agnes 出图与出视频面板。出图：纯文生图，或用最多 8 张参考图做图生图 / 多图合成（参考图可从本地文件选，也可直接从面板里已生成的结果中挑），1K/2K/3K/4K、8 种宽高比，另有 6 个一键风格预设。出视频：agnes-video-2.5-flash，720p、4-12 秒，支持纯文本、首帧 / 尾帧关键帧、最多 5 张参考图三种模式（面板自动判断），可选 seed；任务提交给宿主进程推进，切面板、刷新页面、重启应用都能接回进度，不会丢任务。生成时把提示词写进图片本身（PNG iTXt / JPEG COM），鼠标移到结果上就能看到并一键复制。可浏览输出目录（图片与视频分页）并在生成后自动刷新，支持复制路径、在访达中显示、下载；最近 24 条历史重启不丢。图片与视频也能在对话里通过 agnes_image、agnes_video、agnes_video_status 三个工具直接生成。图片与视频模型都可在面板切换并一键测试连接；本地参考图与关键帧以 base64 data URI 直传，不需要公网图床。需要 Agnes AI 平台的 API Key，存放在本地文件中（默认 ~/.agnes-key.txt）。'
