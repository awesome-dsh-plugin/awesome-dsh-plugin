url: https://github.com/zxygithub/dsh-agnes-create
name: zxygithub/dsh-agnes-create
category: vision
description:
  en: 'Sidebar panel for Agnes image and video generation: for images, plain text-to-image or image-to-image and multi-image composition from up to eight reference images — chosen from local files or from results already in the panel — at 1K-4K across eight aspect ratios; for video, agnes-video-2.5-flash at 720p, 4-12 seconds, submitted as an async task and polled with a live percentage. See the result inline as an image or a seekable video, revisit the last eight generations, and repoint the API-key file or output directory from the panel settings without editing code or restarting. Polling backs off on the query endpoint 429 rate limit instead of failing the task, and a 503 queue-full submit retries automatically. Needs an Agnes AI API key saved in a local file (default ~/.agnes-key.txt).'
  zh: '侧边栏 Agnes 出图与出视频面板：出图既可纯文生图，也可用最多 8 张参考图做图生图或多图合成（参考图从本地文件选，或直接从面板里已生成的结果中挑），尺寸 1K/2K/3K/4K、8 种宽高比；出视频用 agnes-video-2.5-flash，720p、4-12 秒，异步任务轮询并显示百分比进度。结果内联展示，图片直出、视频可拖动进度条，最近 8 条可回看；Key 文件路径与输出目录可在面板设置里修改，无需改代码或重启。查询接口 429 限流自动退避而非判任务失败，提交遇 503 队列满自动重试。需要 Agnes AI 平台的 API Key，存放在本地文件中（默认 ~/.agnes-key.txt）。'
