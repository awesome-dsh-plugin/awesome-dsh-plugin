url: https://github.com/GuYou9799/dsh-auth-cookie-sweep
name: GuYou9799/dsh-auth-cookie-sweep
category: security
description:
  en: "Serves a live /auth-cookie-sweep page showing how full the local Host's cookie jar is, how many random-port launches are left before the 431, and repairs the jar in one click; stale dsh-auth-* cookies are expired automatically, and the rescue budget grows to four times the largest jar ever seen, so no profile ever needs a manual cookie wipe."
  zh: "由本地 Host 直接渲染一个 /auth-cookie-sweep 体检页，随时看到 cookie 罐有多满、离 16KB 的 431 还能再启动几次，并一键清理；旧 dsh-auth-* cookie 会自动失效，救援额度还会按历史最大 jar 的 4 倍自动放大，所以任何情况下都不需要手工清 cookie。"
