url: https://github.com/Neptune810/dsh-model-router
name: Neptune810/dsh-model-router
category: model
description:
  en: Keeps a pool of models and routes every agent step to one of them with its reasoning effort set — configured by clicking in the composer, no JSON needed. The router takes over the composer's model cell, so one control shows the session's model and reasoning effort alongside the router's own settings. Three authorization scopes (model / effort / full) where a manual pick only counts in the scope that owns it, and in effort scope the router is bound to the one model you choose. Task presets with per-model weights, vision routing for image steps, session signals (active todo, context pressure, token budget, subagent depth), and an optional semantic task classifier. Thinking stays on, because DeepSeek rejects a thinking-enabled request whose history contains a tool call made with thinking off.
  zh: 维护一个模型池，把每个 agent 步骤路由到池内模型并设置其思考等级——全部在输入栏点选配置，不需要写 JSON。路由面板接管输入栏的模型位置，同一个控件里既有本会话的模型与思考等级，也有路由自身的设置。三种授权范围（模型 / 思考 / 全部）：手动选择只在所属范围内生效；「思考」范围下路由只作用于你选定的那一个模型。另有按任务类型给模型加权的预设、带图任务的视觉分流、会话信号（当前 todo / 上下文压力 / token 预算 / 子 agent 深度），以及可选的语义任务分类。思考等级保持常开，因为 DeepSeek 会拒绝思考关闭时产生的工具调用。
