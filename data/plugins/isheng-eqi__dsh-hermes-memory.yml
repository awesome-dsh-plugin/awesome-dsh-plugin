url: https://github.com/isheng-eqi/dsh-hermes-memory
name: isheng-eqi/dsh-hermes-memory
category: memory
description:
  en: 'Faithful port of the hermes-agent MEMORY.md / USER.md mechanism for DSH: bounded dual-bank memory (2200/1375 chars), a single `memory` tool (add/replace/remove/batch), frozen-snapshot injection per session, nudge reminders, DSH-native JSON storage — zero external dependencies, zero LLM cost.'
  zh: 'DSH 上 hermes-agent 记忆机制的忠实移植（MEMORY.md / USER.md）：有界双记忆库（2200/1375 字符）、单个 memory 工具（add/replace/remove/batch 全有或全无）、每会话冻结快照注入与 nudge 提醒、DSH 原生 JSON 存储——零外部依赖、零 LLM 成本。'
  ja: hermes-agent の MEMORY.md / USER.md の仕組みを DSH へ忠実に移植したもの。上限付きの 2 系統メモリ（2200/1375 文字）、単一の `memory` ツール（add/replace/remove/batch）、セッションごとの凍結スナップショットの注入、書き込みを促すリマインダー、DSH ネイティブの JSON 保存を備えます——外部依存ゼロ、LLM のコストもゼロです。
