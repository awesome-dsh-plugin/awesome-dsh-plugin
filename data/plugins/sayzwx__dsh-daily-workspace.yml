url: https://github.com/sayzwx/dsh-daily-workspace
name: sayzwx/dsh-daily-workspace
category: ui
description:
  en: Adds a user-chosen default workspace for new conversations, lists recent conversations above the workspace groups, and hides the default workspace from the lower groups to avoid duplication.
  zh: 为新会话增加可自定义的默认工作区，在侧栏顶部显示最近对话，并把默认工作区从下方工作区分组中隐藏，避免重复。
