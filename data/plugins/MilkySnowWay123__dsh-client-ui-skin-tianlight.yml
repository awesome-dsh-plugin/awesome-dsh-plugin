description:
  en: 'Tianlight theme/skin for DeepSeek Harness: full-screen video and image wallpapers (bundled 4K video by default) with upload, rotation, URL and ShaderToy GLSL sources; optional WebWallGL scene wallpapers; a local Wallpaper Engine library browser (Steam workshop and projects) that extracts scene previews and records a scene into a 12 s clip at up to 4K, with the container validated before it is used; liquid glass; and a draggable Mint cat companion whose AI chat uses the model configured in DSH, with permission-gated tools, local chat history, per-look action packs, an opt-in autonomous-thinking loop and context-aware replies. Alt+W opens the wallpaper panel; the default appearance ships as a preset that can be restored from the role hub. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 的「天光」主题皮肤：全屏视频/图片壁纸（默认随包 4K 视频），支持上传、轮播、URL 与 ShaderToy GLSL 代码来源；可选 WebWallGL 场景壁纸；可浏览本机 Wallpaper Engine 库（Steam 创意工坊与本地项目），提取场景预览，并把场景录成最高 4K 的 12 秒片段，录制结果先校验容器结构再使用；液态玻璃；以及可拖拽的薄荷猫桌宠——AI 对话使用 DSH 里配置的模型，严格权限的工具调用、本地对话历史、每个形象的动作包、可选「自主思考」与结合上下文的回复；Alt+W 打开壁纸面板，外观默认值随包提供并可在角色中枢一键恢复。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
