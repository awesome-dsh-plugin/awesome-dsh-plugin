url: https://github.com/JayYuen666/dsh-scrapling
name: JayYuen666/dsh-scrapling
category: browser
description:
  en: 'Wraps the Scrapling Python library in up to nineteen model tools, registered by probed capability: real-browser rendering for JavaScript-only pages, CSS/XPath extraction that returns data instead of Markdown, self-healing selectors, reusable login-state sessions, XHR capture, page screenshots, gated browser actions and a domain-scoped crawler with content/sitemap/feed/Shopify modes on the official job backend. It can also replace the built-in web_fetch / web_search, and serve the same tool table over MCP. Requires Python 3.14+ with Scrapling installed; the browser tools also need a Chromium engine for patchright, which an optional CLI installs on macOS arm64 only.'
  zh: '把 Scrapling Python 库包成最多十九个模型工具，按探测到的能力注册：为纯 JavaScript 页面上真实浏览器渲染、用 CSS/XPath 取出结构化数据而不是 Markdown、选择器自愈、可复用的登录态会话、XHR 抓取、页面截图、受部署门禁的浏览器动作，以及在官方作业后端上跑的限定域爬虫（content/sitemap/feed/Shopify 四种模式）。它还能顶替内置的 web_fetch / web_search，并把同一份工具表通过 MCP 端出。需要 Python 3.14+ 且装好 Scrapling；浏览器工具还需要 patchright 的 Chromium 引擎，可选的 CLI 只在 macOS arm64 上装得起来。'
