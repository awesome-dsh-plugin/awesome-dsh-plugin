name: xtt-xt/dsh-custom-tool-studio
category: tools
description:
  en: "Author custom tools in Python from a web page, in chat, or from the dsh-go app's native panels, and register them as DSH tools without a restart; dangerous tools need built-in approval on every run, tools can be grouped into packs, and an optional unlock mode exposes them per conversation. Needs Python 3 on PATH."
  zh: "用 Python 在网页、对话或 dsh-go 手机 App 的原生面板里编写自定义工具，保存后免重启注册成 DSH 工具；危险工具每次执行都走内置审批，工具可分组成包，还可选「解锁模式」按对话逐步放出。需 PATH 中有 Python 3。"
