url: https://github.com/beyondgjc/dsh-agentic-pet
name: beyondgjc/dsh-agentic-pet
category: fun
description:
  en: 'A model-driven desktop pet for dsh, derived from PC2005-cloud/dsh-pet (MIT): a transparent always-on-top companion that follows your agent sessions, races the Web UI to answer approvals and questions, and runs an autonomous inner voice — world-clock and self-scheduled wakes, dreams, and bond-anniversary milestones, speaking through pet_say/pet_do, with lines read aloud through BreezeBlue TTS using your own API key. Memory is a per-pet continuity journal — an append-only hash chain, rotation into an archive, self-written stage summaries, and keyword recall with tag clues — alongside letters, a shared living-room board, pet-to-pet messages, an affection ledger, and an interactions audit that records how every approval and question actually ended. Memory and ledgers live in ~/.dsh/whale598/<petId>/; the settings page adds per-pet switches and a tool-call audit dashboard (all-time / last 30 days). It uses its own /whale598 route and data directory, so it is a separate pet from dsh-pet rather than a replacement for it. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '由模型驱动的 dsh 桌面宠物，派生自 PC2005-cloud/dsh-pet（MIT）：透明置顶的伙伴，跟随你的 agent 会话，会和网页端抢着回答审批与提问，并有自主的内心独白——世界时钟与自排程唤醒、做梦、羁绊纪念日，通过 pet_say/pet_do 说话，台词用你自己的 API Key 经 BreezeBlue TTS 朗读。记忆是每只宠物各自的连续性日志（只追加的哈希链、轮转归档、自写阶段摘要、带标签线索的关键词召回），另有信件、共享客厅看板、宠物间消息、好感账本，以及记录每次审批和提问最终如何结束的互动审计。记忆与账本存放在 ~/.dsh/whale598/<petId>/；设置页提供按宠物的开关和工具调用审计面板。它使用自己的 /whale598 路由和数据目录，是与 dsh-pet 并行的另一只宠物，而不是替代品。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
