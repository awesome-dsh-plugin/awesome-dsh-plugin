name: beyondgjc/dsh-agentic-pet
category: fun
description:
  en: 'A model-driven desktop pet for dsh, derived from PC2005-cloud/dsh-pet (MIT): a transparent always-on-top companion that follows your agent sessions, races the Web UI to answer approvals and questions, and runs an autonomous inner voice — world-clock and self-scheduled wakes, dreams, and bond-anniversary milestones, speaking through pet_say/pet_do, with lines read aloud through BreezeBlue TTS using your own API key. Memory is a per-pet continuity journal — an append-only hash chain, rotation into an archive, self-written stage summaries, and keyword recall with tag clues — alongside letters, a shared living-room board, pet-to-pet messages, an affection ledger, and an interactions audit that records how every approval and question actually ended. Memory and ledgers live in ~/.dsh/whale598/<petId>/; the settings page adds per-pet switches and a tool-call audit dashboard (all-time / last 30 days). It uses its own /whale598 route and data directory, so it is a separate pet from dsh-pet rather than a replacement for it.'
