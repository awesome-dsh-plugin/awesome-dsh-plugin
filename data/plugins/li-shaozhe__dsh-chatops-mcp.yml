url: https://github.com/li-shaozhe/dsh-chatops-mcp
name: li-shaozhe/dsh-chatops-mcp
category: tools
description:
  en: 'DSH plugin: an MCP service manager panel plus an MCP Hub. The panel lists every mcp-client row in the harness - the built-in DingTalk (dws CLI), Feishu (lark-cli) and Feishu Project (official @lark-project/mcp) connectors, connections you add yourself, and rows other plugins wrote - with a per-row tool list, an on/off switch and delete; the Hub carries 21 installable templates (filesystem, git, GitHub, Context7, fetch, Brave, Tavily, Postgres, SQLite, memory, Chrome DevTools, Playwright, Puppeteer, Slack, Notion, Linear, Sentry and more) that pre-fill the add dialog. DingTalk and Feishu reuse the accounts dws and lark-cli are already logged in with; with all three built-ins connected the default set is 140 tools (47 / 45 / 48) under the mcp__dingtalk__ / mcp__feishu__ / mcp__meego__ prefixes. It also ships a searchable catalog of the 1098 dws and 246 lark-cli commands, and refuses to launch MCP subprocesses on a Node older than 18. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 插件：MCP 服务管理面板 + MCP Hub。面板统一列出宿主里每一条 mcp-client 行——内置的钉钉（走 dws CLI）、飞书（走 lark-cli）与飞书项目（走官方 @lark-project/mcp），你自己加的连接，以及别的插件写进来的行——每行可展开工具清单、单独启停、删除；Hub 带 21 个可安装模板（filesystem、git、GitHub、Context7、fetch、Brave、Tavily、Postgres、SQLite、memory、Chrome DevTools、Playwright、Puppeteer、Slack、Notion、Linear、Sentry 等），选中即预填添加弹层。钉钉与飞书复用这两个 CLI 已登录的账号，三条内置都连好后默认注册 140 个工具（47 / 45 / 48），前缀分别是 mcp__dingtalk__ / mcp__feishu__ / mcp__meego__。另带可搜索的 1098 条 dws 与 246 条 lark-cli 命令目录；启动 MCP 子进程时会跳过低于 18 的 Node。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/li-shaozhe/dsh-chatops-mcp/main/assets/icon-180.png
