description:
  en: "Adds the Miaoshou (Meituan CatPaw) desktop client as a DeepSeek Harness model provider. The 12 models mirror the ones the Miaoshou app picker shows, each carrying its credit-cost multiplier; thinking levels are translated into the upstream modelParams; a read-only panel reports available credits and the current plan. Sign-in is a QR link, so the desktop client does not have to be running."
