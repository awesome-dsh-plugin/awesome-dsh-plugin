description:
  en: 'Honor of Kings inspired theme for DeepSeek Harness: an ink night sky with a molten gold sun and corona fan, frosted mirror shards, drifting embers and a three-level motion switch (full / calm / off). Colours come from overridden design tokens, so panels, bubbles, menus and code blocks follow the theme.'
  zh: '王者荣耀「镜 · 炽阳神光」主题：墨色夜空、熔金日轮与光冕、磨砂镜片、飘浮金烬，左下角「镜」徽记可在 神光 / 静谧 / 关闭 三档动效间切换。配色通过覆写设计令牌实现，面板、气泡、菜单与代码块一并跟随。'
