url: https://github.com/domitor-syh/dsh-rollback
name: domitor-syh/dsh-rollback
category: session
description:
  en: TRAE-style conversation rollback — per-turn checkpoints (10-turn sliding window) restore both touched files and truncate model context in place, keeping the same session id. Triggered via model tool, /rollback command, or a per-turn Web button with affected-file diff preview.
  zh: TRAE 式「回退到本轮对话发起前」插件：按轮次建立检查点（10 轮滑动窗口），同时回滚工作区文件与原位截断模型上下文，保持同一 session id。支持模型工具、/rollback 命令、Web 端每轮回退按钮，弹窗列出受影响文件及动作。
