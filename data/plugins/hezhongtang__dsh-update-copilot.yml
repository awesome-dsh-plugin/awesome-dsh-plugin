description:
  en: 'Update copilot for DeepSeek Harness: one scan covers the dsh core, official bundles, and every profile plugin; explains what changed and how risky each update is, then updates only what you confirm.'
  zh: DeepSeek Harness 的更新助手：一次扫描覆盖 dsh 本体、官方 bundle 和每个 profile 的插件，说清改了什么、风险多大，只更新你确认过的那些。
  ja: DeepSeek Harness の更新の相棒。一度のスキャンで dsh 本体、公式バンドル、すべてのプロファイルのプラグインを確認し、何が変わったか、更新のリスクはどの程度かを説明したうえで、あなたが承認したものだけを更新します。
