  en: 'AI PowerPoint (PPT/PPTX) maker: twelve ppt_* tools create, redesign, edit, quality-check and export presentation slides as editable .pptx or PDF, import and patch existing decks, with 30 design systems and a right-sidebar visual workbench.'
