name: 781237194/agile-workbench#dsh-plugin
category: workflow
description:
  en: 'Agile Workbench bundle (npm package: dsh-agile-workbench): one install brings the PM workbench launcher (pm_workbench_open), long-term memory, a controlled browser, web search, image vision, and a read-only safe-search MCP. The workbench mirrors a six-role agile team (PM / product / analyst / developers / tester) with owner-only requirement acceptance, full requirement and defect flows, evidence gates, and session rotation. Windows: the first open bootstraps Node/Electron/app through a PowerShell installer.'
  zh: 'PM工作台套装（npm 包名：dsh-agile-workbench）：一次安装装齐工作台启动器（pm_workbench_open）、跨会话记忆、受控浏览器、联网搜索、图片视觉与只读安全搜索 MCP。工作台对应六角色敏捷团队（项目经理/产品/需求/程序员A/B/测试），需求与缺陷各有完整流程，需求验收只能 Owner 本人，带证据门与会话轮换。Windows 首次打开会通过 PowerShell 安装器准备 Node、Electron 与应用本体。'
icon: https://raw.githubusercontent.com/781237194/agile-workbench/main/assets/pm-workbench.png
