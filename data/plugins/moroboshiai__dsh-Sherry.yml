  en: Repaints DeepSeek Harness in lavender frosted glass — a moonlit key-art wallpaper behind translucent sidebar, conversation and composer surfaces, a draggable lab-coat pet in the bottom-right corner, and a portrait brand mark in place of the top-left logo.
