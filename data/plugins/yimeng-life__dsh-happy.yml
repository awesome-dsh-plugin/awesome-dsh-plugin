description:
  en: "Ten full-canvas animated backgrounds for the DSH conversation pane — starfield, code rain, circuit, sword-fight, cat, girl, fighter jet, racer, snow and bubbles — one random theme per turn, with a text-column veil that keeps the chat readable."
  zh: 给 DSH 对话区加十种整屏动效背景——星空、代码雨、电路、华山论剑、小猫、小女生、飞机大战、赛车、飘雪、肥皂泡；每回合随机一个，正文列有纱罩保证可读。
