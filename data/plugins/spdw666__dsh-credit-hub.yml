description:
  en: 'Native multi-platform accounts and model routing with staggered check-ins, event notifications, and quota forecasts. Nine desktop providers expose tool calling and native reasoning-effort levels; a five-stage model audit checks ordinary chat, streaming, long output, tools, and result roundtrip. Audited against 41 official host tags from 0.1.0-rc.7 through 0.2.3-alpha.2. Its background worker needs a standalone Node >=22.23.3 with node:sqlite (enforced by engines.node); Qwen Office coding additionally needs Python with cryptography and wasmtime. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '原生多平台账号与模型路由管理，支持错峰签到、事件通知与额度预测。九个桌面平台适配器提供工具调用与原生思考档位；五阶段模型审计分别核验普通对话、流式、长文、工具与结果回传。已按 41 个官方宿主 tag（0.1.0-rc.7 至 0.2.3-alpha.2）逐版审计。后台 worker 需独立 Node ≥22.23.3（node:sqlite，已由 engines.node 约束）；千问办公的编码能力另需 Python（cryptography、wasmtime）。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
