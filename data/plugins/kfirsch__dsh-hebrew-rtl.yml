url: https://github.com/kfirsch/dsh-hebrew-rtl
name: kfirsch/dsh-hebrew-rtl
category: ui
description:
  en: 'Hebrew RTL rendering for the web GUI: any line with Hebrew reads right-to-left (messages, GenUI, question cards, the composer and input fields), and RTL-aware Cmd+Left/Right line navigation.'
  zh: '为 Web 界面提供希伯来语 RTL 渲染：任何包含希伯来文的行都从右向左显示（消息、GenUI、提问卡片、输入框与各类输入字段），以及在 RTL 行上方向正确的 Cmd+左/右 行内跳转。'
