url: https://github.com/TINGOD2006/dsh-um-proxy-ondemand
name: TINGOD2006/dsh-um-proxy-ondemand
category: model
description:
  en: "Manages the lifecycle of the local UM GenAI proxy (127.0.0.1:8788) that DSH's um-genai provider talks to: wakes it on demand for llm/stream calls, stops it after an idle period, and reports health plus a read-only status endpoint. Also ships a DSH settings page for port, always-on mode, idle minutes, interpreter and paths, plus the UM account and proxy API key, and a renewal watchdog that logs in to the campus gateway on a hidden Windows desktop when the upstream token expires. It does not contain the proxy itself or produce tokens: the proxy is um_opencode_setup.py, installed separately by the University of Macau campus tooling into ~/.um-opencode."
  zh: "管理 DSH 的 um-genai provider 所連的本機 UM GenAI 反代（127.0.0.1:8788）的生命週期：llm/stream 請求進來時按需喚醒、閒置一段時間後關閉、提供健康檢查與唯讀狀態端點。另附 DSH 設定頁（埠號、常駐模式、閒置分鐘、解譯器與路徑、UM 帳號、代理金鑰），以及在上游 token 過期時於隱藏 Windows 桌面完成校園 gateway 登入的續期看門狗。它不含反代本體、也不產生 token：反代是 um_opencode_setup.py，由澳門大學校內工具另行安裝到 ~/.um-opencode。"
