description:
  en: 'Eight mini-games docked at the bottom of the DeepSeek Harness sidebar: 2048, Tetris, Gomoku, Klotski, Snake, Schulte table, Breakout and Sokoban. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DeepSeek Harness 左侧栏底部常驻八款小游戏：2048、Tetris、五子棋、华容道、贪吃蛇、舒尔特方格、打砖块与推箱子。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
