url: https://github.com/regrevia/dsh-fast-mode
name: regrevia/dsh-fast-mode
category: usage
description:
  en: >-
    DeepSeek Harness's own fast mode: the same model on the same reasoning effort, fewer output
    tokens and usually less wall clock, all prompt-side. Every switch can be turned off on its
    own; by default only the terse-output switch is on. Measured on one machine: 30 task pairs at
    the default trim budget 0.756x wall clock and 21% fewer output tokens; 24 pairs on real
    pallets/click PRs with only the trim switch on 0.805x wall clock and 23% fewer tokens. Some
    tasks get slower — numbers and repro in the repo.
  zh: >-
    DeepSeek Harness 自己的 fast mode：同一个模型、同样的思考强度，只花更少的输出 token，通常也更快，全程提示词侧。每个开关都能单独关掉；默认只开「精简输出」，其余开关默认关。本机实测：默认截短预算下 30 对任务 0.756× 耗时、输出 token −21%；6 个真实 `pallets/click` PR 共 24 对、只开截短开关时 0.805× 耗时、token −23%。不是所有任务都快，少数会变慢——数字与复现见仓库。
icon: https://raw.githubusercontent.com/regrevia/dsh-fast-mode/main/icon.png
