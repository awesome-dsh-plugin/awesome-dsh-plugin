url: https://github.com/regrevia/dsh-fast-mode
name: regrevia/dsh-fast-mode
category: usage
description:
  en: >-
    DeepSeek Harness's own fast mode: the same model on the same reasoning effort, fewer output
    tokens and usually less wall clock, all prompt-side. Every switch ships off and can be turned
    off alone. Measured on one machine against this repo: 30 task pairs at the default trim budget
    0.756x wall clock and 21% fewer output tokens; a smaller task set once showed 0.505x. Some
    tasks get slower — numbers and repro in the repo.
  zh: >-
    DeepSeek Harness 自己的 fast mode：同一个模型、同样的思考强度，只花更少的输出 token，通常也更快，全程提示词侧。开关默认关，每个都能单独关掉。本机 30 对任务：默认截短预算下 0.756× 耗时、输出 token −21%；更小的一组任务上曾出现 0.505×。不是所有任务都快，少数会变慢——数字与复现见仓库。
icon: https://raw.githubusercontent.com/regrevia/dsh-fast-mode/main/icon.png
