url: https://github.com/regrevia/dsh-fast-mode
name: regrevia/dsh-fast-mode
category: usage
description:
  en: >-
    DeepSeek Harness's own fast mode: the same model, half the output, up to twice as fast, with
    switches you combine freely. Prompt-side only — no model swap, no lower reasoning effort, no
    request field written. Measured over 30 complete task pairs: 0.505x wall clock, 42% fewer
    output tokens, 438/438 checks green; benchmark and repro in BENCHMARK.md at
    github.com/regrevia/dsh-fast-mode. A few shapes are slower — 1-5 step repairs, data
    reshaping — so try it once per shape.
  zh: >-
    DeepSeek Harness 自己的 fast mode：同一个模型，只消耗一半的输出，多种开关自由组合，最快快一倍（实测 0.505× 耗时）。全在提示词侧，不换模型、不降思考强度、不写任何请求字段；30 对完整任务实测输出 token −42%、判分 438/438 全绿，benchmark 与复现命令见 github.com/regrevia/dsh-fast-mode 的 BENCHMARK.md。少数任务会变慢——1–5 步小改修、数据整形——按任务形状先试一次。
icon: https://raw.githubusercontent.com/regrevia/dsh-fast-mode/main/icon.png
