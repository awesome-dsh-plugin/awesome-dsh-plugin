url: https://github.com/Eason-22/dsh-autorestart
name: Eason-22/dsh-autorestart
category: session
description:
  en: 'DeepSeek Harness plugin: restart without losing work. It waits until every conversation is idle, restarts the host, and picks the interrupted work back up instead of dying with it; where a supervisor already manages the host it asks that supervisor, and it never starts a second host next to a running one. Every restart is preceded by a snapshot of the configuration and the installed plugins, and that snapshot becomes the known-good backup only after the host comes back up. If the host does not come up, a one-shot watchdog restores the most recent known-good backup - never the snapshot of the failed restart - starts once more, and records the outcome. The last two backups are kept by default (the limit is configurable from 2 to 10); the settings page lists each backup by its time and can roll back to any of them after a confirmation. When the work is done it counts down and powers the machine off. Works on the Windows desktop client, and on a hosted dsh web instance - verified on WSL with systemd; Windows-hosted web, WSL without systemd, and native Linux are untested.'
  zh: '重启不丢工作：等所有对话空闲后自动重启，重启后接着干、不中断；已有守护的机器交给守护重启，绝不双开。每次重启前先把配置和已装插件备份成一份快照，重启成功后这份快照才被标为「已验证可启动」的安全备份；宿主起不来时，由一次性看门狗只还原最近一次验证过的安全备份、再拉起一次，并把结果记录下来——绝不拿刚改坏的那份回滚。默认保留最近两份（可设 2–10 份）；设置页按备份时间逐份列出，可手动回退到任意一份（需二次确认）。所有工作完成后倒数关机，晚上无需人值守。桌面客户端可用；dsh web 托管端已在 WSL（有 systemd）上验证，Windows 上的 web、无 systemd 的 WSL、原生 Linux 尚未验证。'
