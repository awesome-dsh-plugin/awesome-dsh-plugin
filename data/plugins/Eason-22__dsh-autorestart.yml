url: https://github.com/Eason-22/dsh-autorestart
name: Eason-22/dsh-autorestart
category: session
description:
  en: 'DeepSeek Harness plugin: restart without losing work. It waits until every conversation is idle, restarts the host, and picks the interrupted work back up instead of dying with it; where a supervisor already manages the host it asks that supervisor, and it never starts a second host next to a running one. Every restart is preceded by a snapshot of the configuration and the installed plugins, and that snapshot becomes the known-good backup only after the host comes back up. If the host does not come up, a one-shot watchdog restores the most recent known-good backup - never the snapshot of the failed restart - starts once more, and records the outcome. The last three backups are kept; the settings page shows the identity of each backup and can roll back to any of them after a confirmation. When the work is done it counts down and powers the machine off. Works on the Windows desktop client and on a hosted dsh web instance (Windows, WSL, Linux).'
  zh: '重启不丢工作：等所有对话空闲后自动重启，重启后接着干、不中断；已有守护的机器交给守护重启，绝不双开。每次重启前先把配置和已装插件备份成一份快照，重启成功后这份快照才被标为「已验证可启动」的安全备份；宿主起不来时，由一次性看门狗只还原最近一次验证过的安全备份、再拉起一次，并把结果记录下来——绝不拿刚改坏的那份回滚。备份保留最近三份；设置页能看到每份的身份（安全份 / 本次快照），并手动回退到任意一份（需二次确认）。所有工作完成后倒数关机，晚上无需人值守。桌面客户端与 dsh web 托管端（Windows / WSL / Linux）都通用。'
