description:
  en: 'Edit-ready Context Packs for DSH (v0.9.0): code_context returns key source with exact line ranges, inclusion reasons, relationship provenance, Git changes and likely tests under a hard character budget; local indexes stay isolated per repo/worktree and refresh after external edits. Verified with a real DSH Desktop 0.2.0-rc.2 Agent.'
  zh: '面向 DSH 的 Edit-ready Context Packs（v0.9.0）：code_context 在严格字符预算内返回关键源码、准确行号、入选理由、关系来源、Git 变更和相关测试线索；本地索引按仓库/worktree 隔离，外部编辑后自动刷新。已通过真实 DSH Desktop 0.2.0-rc.2 Agent 验证。'
