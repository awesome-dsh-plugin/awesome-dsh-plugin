url: https://github.com/lemonxiny55/dsh-code-index
name: lemonxiny55/dsh-code-index
category: tools
description:
  en: 'Semantic repo index: tree-sitter symbol search across 8 languages (incl. C/C++), a bounded repo map ranked by import-graph PageRank that auto-updates in the system prompt, a function-level call graph via code_refs, and opt-in circular-dependency / orphan-module checks via code_health.'
  zh: '语义仓库索引：基于 tree-sitter 的跨 8 种语言（含 C/C++）符号搜索、注入系统提示词且按 import-graph PageRank 排序的限量自动更新仓库地图，并新增 code_refs 函数级调用图与可选启用的 code_health 环依赖 / 孤儿模块检查。'
