url: https://github.com/yaorenliang/dsh-session-card
name: yaorenliang/dsh-session-card
category: session
description:
  en: 'Three lines per session in the sidebar: the official title, the last question you typed, and a badge line with the agent preset plus whatever is running under that session. The preset rides the snapshot the sidebar already holds, so it costs no extra request, disk read or loop. When there is nothing to show, the row folds back to the official single line.'
  zh: '侧边栏里每个会话三行：官方标题、你最后问的那句话，以及一行徽标——这个会话用的 agent 预设，加上正在跑的子智能体和后台任务。预设取自侧边栏渲染时本就拿着的那份快照，不多发请求、不读磁盘、不新增循环。没有内容可显示时，整行退回官方的单行形态。'
