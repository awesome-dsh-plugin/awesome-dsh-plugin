name: bauerelizabeth07139/opencode-tokenrhythm-image-mcp
category: tools
description:
  en: 'Image generation through TokenRhythm: mounts a no-npm-dependency Python stdio MCP server as mcp__tokenrhythm_image__generate_image, producing images with qwen-image-2.0 or wan2.7-image and saving them to a directory you choose. Needs Python 3.8+ on PATH and TOKENRHYTHM_API_KEY.'
  zh: '用 TokenRhythm 生成图片:把无 npm 依赖的 Python stdio MCP 服务器挂成 mcp__tokenrhythm_image__generate_image,用 qwen-image-2.0 或 wan2.7-image 生成并存到你指定的目录。需 PATH 上有 Python 3.8+ 并设置 TOKENRHYTHM_API_KEY。'
