url: https://github.com/Kanadego/dsh-heartbeat
name: Kanadego/dsh-heartbeat
category: agi
description:
  en: 'An agent that wakes up on its own schedule: by default every 60 minutes, ±20% (48–72). It browses the interests you set, drops what it finds into a local pool of notes, and keeps a profile of what you like. When it has enough worth sharing it hands the session you linked a short package of notes — whether to speak, and which note to use, is that session''s agent''s call in the moment. Quiet hours, busy windows, a daily limit and a cooldown are decided in code; when the answer is no, the decision and expression phases after the gate call no model at all — browsing runs before the gate and is counted separately. Windows, Linux and macOS (Linux and macOS are minimal support).'
  zh: '让 agent 不定期醒来的插件：默认 60 分钟一次，上下浮动 20%（48~72 分钟）。按你设的兴趣范围上网逛逛，看到的东西存进本地素材池，顺手维护一份你的兴趣画像。攒够值得说的，就往你绑定的会话递一份短素材——说不说、说哪条，交给那个会话里的 agent 按眼前处境定。静默时段、忙时窗口、每日上限、冷却都在代码层判；判别说时，闸门之后的决策与表达两相不再调用模型（闲逛相在闸门之前，另算）。支持 Windows、Linux 与 macOS（Linux / macOS 为最小支持）。'
