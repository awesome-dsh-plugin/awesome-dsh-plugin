description:
  en: 'Runs a four-task, 150-point model intelligence benchmark inside DeepSeek Harness (Qin 60, Pompeii 45, Pelican 22.5, Candy 22.5): each selected model × reasoning-effort pair executes every task in its own isolated subagent session, Qin and Pelican are graded by the selected judge model against rubrics, Pompeii and Candy programmatically, and batches keep scores, artifacts and cost. Adds a 0–1000 real-world performance score per model × effort computed from local session logs across seven dimensions (output speed, first-token latency, reasoning speed, tool cadence, tool latency, tool success rate, cache hit), with baseline deltas and controlled speed runs, plus a sidebar page with ranking, performance, history and settings views. Each batch spends real tokens of the candidate and judge models, and candidate subagents get file and bash tools inside an isolated run directory.'
  zh: '在 DeepSeek Harness 内跑四题 150 分模型智商评测（秦始皇 60 / 庞贝 45 / 鹈鹕 22.5 / 糖果 22.5）：每个「模型 × 推理档位」组合在独立子会话中逐题执行，秦始皇与鹈鹕按 rubric 由所选裁判模型打分，庞贝与糖果程序判定，批次保留分数、产物与费用；另按模型 × 推理档位从本地会话日志计算 0–1000 真实性能分（输出速度、首字延迟、思考速度、工具节奏、工具耗时、工具成功率、缓存命中 七个维度），附基线偏差与受控测速，并在侧边栏提供排行、性能、历史与设置四个视图。每个批次都会真实消耗候选模型与裁判模型的 token，候选子会话在隔离的运行目录里可使用文件读写与 bash 工具。'
