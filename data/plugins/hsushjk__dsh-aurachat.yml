url: https://github.com/hsushjk/dsh-aurachat
name: hsushjk/dsh-aurachat
category: identity
description:
  en: 'Hosts the agent as a persona on a self-hosted web page, with owner and guest accounts: a mood value that drifts back toward baseline over time, memory you can read and edit, a sticker library, diary posts that guests can comment on, idle small talk, voice notes, speech recognition and text to speech. The built-in web server listens on 0.0.0.0:2332 by default; create the owner account before exposing the port, and only the owner can add guest accounts.'
  zh: '让 agent 以人设住进自建网页，分主人和客人两种账号：会随着时间回落到平常值的心情、可查看可修改的记忆、表情库、客人能评论的空间动态、闲置搭话、语音条、语音识别与朗读。内置网页服务默认监听 0.0.0.0:2332；对外暴露端口前请先创建主人账号，客人账号只能由主人创建。'
