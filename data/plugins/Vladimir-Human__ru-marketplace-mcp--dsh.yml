description:
  en: '15 Agent Skills and three mutually exclusive MCP rows (compare-mcp, decision-mcp, marketplace-mcp) for 12 Russian and Chinese marketplaces and classifieds: cross-marketplace price comparison and per-source search, product cards, seller details and reviews across Wildberries, Ozon, Yandex Market, Detsky Mir, Avito, AliExpress, Taobao, Megamarket, Lamoda, DNS, Citilink, plus Cian real estate. The 15 skills load on install; the MCP rows stay disabled until RU_MARKETPLACE_MCP_DIR is set.'
  zh: 面向 12 家俄罗斯与中国电商及分类信息平台的 15 个 Agent 技能与三行互斥 MCP 配置（compare-mcp、decision-mcp、marketplace-mcp）：支持跨平台比价，以及 Wildberries、Ozon、Yandex Market、Detsky Mir、Avito、AliExpress（速卖通）、Taobao（淘宝）、Megamarket、Lamoda、DNS、Citilink 的商品搜索、详情卡、卖家信息与评论，外加 Cian 房产搜索。安装后 15 个技能立即可用；MCP 行默认关闭，设置 RU_MARKETPLACE_MCP_DIR 后按需启用。