description:
  en: 'DSH-elysia — shared Markdown memory for every DSH session: persona, requirements, corrections, lessons, methods, requests, sessions, a method library and ingested documents, mirrored to a second disk with version snapshots and a cross-process write lock; entries move between the main file and a searchable archive by hit frequency and repeated emphasis, and retrieval is keyword co-occurrence plus BM25. Ships a skills library (SKILL.md playbooks with optional guarded run.mjs execution), a sticker library that sends a fitting sticker at the right moment, and — new in 1.10 — Memory Packs: a bundled, opt-in character memory (packs/elysia: 61,903-char identity + 2,482-char persona distilled from 1,696 official voice lines and 112,175 dialogue lines). Packs are off by default, back up before writing, only touch identity/persona, and can be uninstalled to restore what was there.'
  zh: '【DSH-elysia】所有会话共用一份 Markdown 记忆，含人设、要求、指正、教训、方法、请求、会话、方法库与导入文档九个分区；双硬盘镜像、历史快照、跨进程写锁，条目按命中频率与重复强调在主文件与可检索归档之间双向流动，检索为关键词共现加 BM25 排序。另含自有技能库（SKILL.md 操作手册，可选带护栏的 run.mjs 执行）、表情包库（按情绪自动分类，在合适时机自动发送），以及 1.10 新增的**记忆包**：插件自带一份可选安装的角色记忆（packs/elysia，61,903 字自我记忆 + 2,482 字人设，源自 1,696 条官方确证语音与 112,175 条剧情台词）。记忆包默认不安装，装前自动备份，只写 identity/persona 两个分区，可卸载恢复原内容。'
