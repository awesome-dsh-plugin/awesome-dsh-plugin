description:
  en: 'Preview FBX, OBJ, glTF, GLB, and STL models plus TGA, EXR, and HDR textures from the current session''s workspace in DSH''s right sidebar. Open a model to orbit, zoom, auto-rotate, switch materials and environments, and play embedded animations.'
  zh: '在 DSH 右侧边栏预览当前会话工作区里的 FBX、OBJ、glTF、GLB、STL 模型，以及 TGA、EXR、HDR 纹理。打开模型即可旋转、缩放、自动旋转、切换材质与环境，并播放内置动画。'
