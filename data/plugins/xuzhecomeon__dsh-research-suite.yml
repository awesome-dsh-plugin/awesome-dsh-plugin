name: xuzhecomeon/dsh-research-suite
category: skill
description:
  en: Research workflow suite that registers 10 domain skills and 12 tools, curates 450 bundled research skills into 103 capability cards with an auditable per-skill ledger, ships 5 execution and verification tools for real R/Python runs, data gates and DOI checks, and takes over research requests automatically through a system-prompt section.
  zh: 科研全流程插件：注册 10 个领域技能与 12 个工具，把随包 450 条科研技能整理成 103 张能力卡并附 444 条可审计的判定账本；新增 5 个执行与核验工具（真跑 R/Python、数据闸门、DOI 核验），通过系统提示段自动接管科研任务。
