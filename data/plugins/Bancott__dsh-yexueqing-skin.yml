url: https://github.com/Bancott/dsh-yexueqing-skin
name: Bancott/dsh-yexueqing-skin
category: theme
description:
  en: "Ye Xueqing (Justice Online) theme skin: two switchable artwork variants (wisteria courtyard / snowy river) rendered as a mask-edged band behind all UI text, bundled LXGW WenKai GB interface font with a toggle, and an exclusive mode that disables other skin plugins while it is on."
  zh: "逆水寒·叶雪青主题皮肤：两个可切换的立绘变体（春庭藤影／雪霁寒江），画面经四边带遮罩置于全部界面文字之下，随包附带霞鹜文楷GB 字体开关，开启独占时自动停用其他皮肤插件。"
