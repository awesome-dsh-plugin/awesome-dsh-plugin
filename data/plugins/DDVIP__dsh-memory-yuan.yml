description:
  en: 'Markdown-file long-term memory for DSH: thirteen tools, L0/L1/L2 prompt injection, review and lint passes, and a console panel with a graph view. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 基于 Markdown 文件的长期记忆：十三个工具、L0/L1/L2 三层注入、体检与结构检查，外加带星图的控制台面板。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
