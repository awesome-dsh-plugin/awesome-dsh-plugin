url: https://github.com/Hao0311/dsh-deferred-approvals
name: Hao0311/dsh-deferred-approvals
category: security
description:
  en: 'Non-blocking approvals and timed questions: permission requests park as pending items while the model keeps working and the approved call can be retried, and ask_user_question runs in timed mode (20 s) through an override of the whole standard agent preset that applies to new sessions after a restart.'
  zh: '非阻塞审批与定时提问：越权请求挂起为待办、模型继续干活、批准后重试；ask_user_question 通过整体覆盖 standard 预设切到 timed 模式（20 秒），重启后仅对新会话生效。'
