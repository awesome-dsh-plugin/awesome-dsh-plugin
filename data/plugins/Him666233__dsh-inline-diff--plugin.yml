description:
  en: 'Inline diff cards for every edit, write and str_replace_editor call: old/new line numbers, character-level highlighting, 57-language detection with a red/green-safe syntax palette, a side-by-side viewer, Read-row line ranges, and a settings page for display style and highlighting.'
