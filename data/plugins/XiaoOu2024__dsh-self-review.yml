url: https://github.com/XiaoOu2024/dsh-self-review
name: XiaoOu2024/dsh-self-review
category: usage
description:
  en: 'Holds every final answer before delivery, has one independent minimal-context model call re-derive and check it, and releases only the verified text; the draft is never shown. Reviewed answers cost one extra model request and appear a few seconds later.'
  zh: '在最终回答送达前先扣住，交给一次独立、最小上下文的模型调用重新推导并校验，只放出校验后的文本，用户看不到草稿。被复核的回答多一次模型请求，文字出现前会多几秒。'
