description:
  en: 'Download pets from petdex.dev and keep one on the desktop, following the DSH session status; the appearance is adjustable and an enterprise WeChat bot can push a notification when the agent needs confirmation or finishes a turn. Desktop mode needs macOS 12+ or Windows 10 1903+; the bundled companion is prebuilt.'
  zh: '从 petdex.dev 下载宠物并常驻桌面，跟随 DSH 会话状态显示；外观可调，Agent 需要确认或一轮结束时可通过企业微信机器人推送通知。桌面模式需要 macOS 12+ 或 Windows 10 1903+，桌面端已随安装包预编译。'
