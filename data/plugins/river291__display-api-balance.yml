url: https://github.com/river291/display-api-balance
name: river291/display-api-balance
category: usage
description:
  en: 'Shows the DeepSeek API-key balance as one ambient stat in the Harness composer row, refreshed every 60 seconds. Click the balance to set a local low-balance threshold; the amount turns red below it. The API key stays in the host and is only sent to api.deepseek.com/user/balance.'
  zh: '在 DeepSeek Harness 输入框下方的统计行里显示 DeepSeek API 余额，每 60 秒自动刷新；点击余额可设置本地低余额阈值，低于阈值时金额变红。API Key 只留在本机 Host，仅用于请求 api.deepseek.com/user/balance。'
