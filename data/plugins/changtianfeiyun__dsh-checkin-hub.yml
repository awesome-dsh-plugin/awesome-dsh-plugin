url: https://github.com/changtianfeiyun/dsh-checkin-hub
name: changtianfeiyun/dsh-checkin-hub
category: usage
description:
  en: 'Sidebar hub for the WorkBuddy, Trae, Qoder and MiniMax Code connect plugins:
    a configurable daily auto check-in (default 10:00, catch-up included) plus one-click
    or per-platform check-in across every pooled account, per-account credit balance
    with today''s state and expiry, a credit-package breakdown, account add/remove,
    and one-click joining the pool for an account that is signed in but not yet enrolled.
    It stores no credential and calls no platform API itself.'
  zh: 侧边栏签到中心，聚合 WorkBuddy、Trae、Qoder、MiniMax Code 四个连接插件：可设定每天几点后自动签到（默认
    10:00，关着应用错过的当天会补签），也可一键或按平台为号池内每个账号签到；逐条展示积分余额、今日签到状态与到期时间，
    可展开积分包明细，支持添加/移除账号，并可一键把已登录但未入池的账号加入号池。插件自身不保存凭证、不直接访问平台
    API。
