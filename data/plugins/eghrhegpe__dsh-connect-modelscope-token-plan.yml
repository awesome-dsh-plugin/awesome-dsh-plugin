category: usage
description:
  en: 'One-tap connect ModelScope language and image-generation models into DSH (off by default), with image recognition and context window filled in automatically. You can also see the free Magicube balance, jump to a model''s info page, and record local call counts, trends and rate-limit events, with a usage pill beside the input box showing the balance and today''s local count. All of it needs only an API key, with no account sign-in.'
  zh: '一键接入魔搭社区的语言、生图模型到 DSH（默认关），自动填入图片识别与上下文窗口；还可查看免费魔粒余额、跳转到模型信息页，记录本地调用计数、趋势、限流事件，输入框旁另有用量胶囊显示余额与今日本地调用次数。上述功能仅需填入 API key，不需要登录账号。'
