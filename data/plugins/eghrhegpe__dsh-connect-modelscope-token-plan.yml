name: eghrhegpe/dsh-connect-modelscope-token-plan
category: usage
description:
  en: 'One-tap connect ModelScope language and image-generation models into DSH, with image recognition and context window filled in automatically (off by default). You can also see the free Magicube balance, jump to a model''s info page, and record local call counts, trends and rate-limit events. All of it needs only an API key, with no account sign-in.'
  zh: '一键接入魔搭社区的语言、生图模型到 DSH ，自动填入图片识别与上下文窗口（默认关）；还可查看免费魔粒余额、跳转到模型信息页，记录本地调用计数、趋势、限流事件。上述功能仅需填入 API key ，不需要登陆账号。'
