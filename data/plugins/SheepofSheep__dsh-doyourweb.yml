url: https://github.com/SheepofSheep/dsh-doyourweb
name: SheepofSheep/dsh-doyourweb
category: browser
description:
  en: 'DoYourWeb 0.2.4 references existing Chrome and Edge tabs, authorized local HTML, and running Windows apps through the DSH sidebar or @. Read scoped snapshots, batch actions, capture screenshots or use available WebMCP tools. Stop the current tab from the extension menu, including during post-navigation verification. Receipts preserve completed and uncertain effects. Start or resume session-bound annotations from the extension menu and add them to the chat draft. Open browser pairing and application approvals from DSH. App control prefers supported MCP or CLI connectors, locks npm dependencies before approval, and falls back to Cua Driver with live checks of the selected window. Background input depends on the app. Requires Chrome or Edge 125+ and manual loading and pairing of the companion MV3 extension.'
  zh: 'DoYourWeb 0.2.4 可通过 DSH 侧栏或 @ 引用已打开的 Chrome / Edge 标签页、已授权的本地 HTML 和运行中的 Windows 应用。支持局部快照、批量操作、截图和调用可用的 WebMCP 工具。可从扩展菜单停止当前标签的操作，包括导航后的验证。回执保留已完成和不确定的效果。通过扩展菜单开启或恢复绑定会话的页面批注，并加入聊天草稿。从 DSH 打开浏览器配对与应用批准页面。应用控制优先使用 MCP 或 CLI，批准前固定 npm 依赖；回退到 Cua Driver 时实时校验所选窗口。后台输入取决于应用。需要 Chrome / Edge 125+，手动加载并配对 MV3 扩展。'
