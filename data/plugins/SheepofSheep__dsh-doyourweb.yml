url: https://github.com/SheepofSheep/dsh-doyourweb
name: SheepofSheep/dsh-doyourweb
category: browser
description:
  en: 'Reference logged-in Chrome/Edge tabs, authorized local HTML and running Windows apps through a searchable native sidebar or @. Open browser candidates and the webpage sidebar refresh when the extension connects, disconnects or changes tabs, including an unchanged search query. Windows application lists skip protected processes with unreadable identity metadata and preserve other running apps. Read scoped snapshots, batch actions, capture screenshots and use available WebMCP tools; supports authorized uploads, drag/drop and opt-in network metadata. Browser actions preserve failure evidence, accept an explicit post-action observation scope and can check one final visible/text/value/URL condition without replaying effects. Expandable context preserves model content; dockable annotations support a session-bound staging queue with edit/delete/restore, and append to chat drafts without sending. App control prefers a matching installed MCP or approved installation, then Cua Driver with text, hotkeys and paged controls; desktop reads present the window once per connection or when recovery is needed. Background input depends on the app. Requires Chrome or Edge 125+ with the companion MV3 extension manually loaded and paired; installing the plugin does not install the extension.'
  zh: '通过可搜索的原生侧栏或 @ 引用已登录的 Chrome / Edge 标签页、已授权的本地 HTML 和运行中的 Windows 应用。扩展连接、断开或标签页变化时，已打开的浏览器候选与网页侧栏自动更新，无需修改搜索词。Windows 应用列表跳过身份信息无法读取的受保护进程，保留其他运行中的应用。读取局部快照、批量操作、截图及调用可用的 WebMCP 工具；支持授权上传、拖放和按需网络元数据。浏览器动作失败后保留执行证据，可显式指定后置观察范围，并在末尾检查一次可见性、文本、输入值或 URL 条件，不自动重放副作用。可展开引用保留模型内容；可收纳批注支持绑定会话的暂存队列与编辑、删除、恢复，加入聊天草稿而不自动发送。应用控制优先匹配的本地 MCP，未安装先询问，无匹配时使用 Cua Driver，支持打字、快捷键及控件分页；桌面读取在连接首次或需要恢复窗口时展示。后台输入取决于应用。需要 Chrome / Edge 125+，手动加载配套 MV3 扩展并配对；插件不会自动安装扩展。'
