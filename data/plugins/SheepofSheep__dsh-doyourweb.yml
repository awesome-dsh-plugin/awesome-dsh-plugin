url: https://github.com/SheepofSheep/dsh-doyourweb
name: SheepofSheep/dsh-doyourweb
category: browser
description:
  en: 'Reference already-open Chrome and Edge tabs with @ mentions in DSH, annotate page elements, reuse login state to read pages, run batched actions, take screenshots and call WebMCP tools through a paired browser extension, and reference running Windows apps with cached icons while controlling them through MCP/CLI tools.'
  zh: '通过 @ 引用已打开的 Chrome / Edge 标签页，标注页面元素，配合浏览器扩展复用登录状态读取页面、批量操作、截图、调用 WebMCP 工具，并通过 @ 引用运行中的 Windows 应用，经 MCP/CLI 工具进行控制。'
