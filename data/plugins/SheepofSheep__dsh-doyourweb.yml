url: https://github.com/SheepofSheep/dsh-doyourweb
name: SheepofSheep/dsh-doyourweb
category: browser
description:
  en: 'Use a native browser sidebar or @ to reference logged-in Chrome/Edge tabs, authorized local HTML and running Windows apps. Read compact snapshots, batch actions, capture screenshots and use available WebMCP tools; supports user-authorized file uploads, same-frame element drag/file drop and opt-in network metadata capture. Page/app context appears as expandable chips; dockable element annotations and selected local diagnostic logs append to chat drafts without sending. App control prefers a matching installed MCP or approved installation, then falls back to Cua Driver with text, hotkeys and paged controls; background input depends on the app.'
  zh: '通过原生浏览器侧栏或 @ 引用已登录的 Chrome / Edge 标签页、已授权的本地 HTML 和运行中的 Windows 应用。读取轻量快照、批量操作、截图并调用可用的 WebMCP 工具；支持用户授权的文件上传、同框元素拖拽及文件投放，以及按需开启的网络元数据捕获。页面和应用上下文以可展开引用展示；可收纳的元素批注及选中的本地诊断日志加入聊天草稿，不自动发送。应用控制优先连接匹配的本地 MCP，未安装先询问，无匹配时使用 Cua Driver，支持打字、快捷键和控件分页；后台输入能力取决于应用。'
