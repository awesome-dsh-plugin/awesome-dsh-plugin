name: matata2017/dsh-codex-hooks
category: workflow
description: {en: "Lifecycle hooks for dsh. Discovers hooks.json from config, plugins and projects, pins each hook's trust to a sha256 fingerprint, runs the approved command hooks on eight dsh events, appends their context, and manages them from a Hooks settings section, a hook button in the composer and the /hooks command.", zh: "为 dsh 提供生命周期钩子。从配置、插件与项目中发现 hooks.json，把每条钩子的信任钉在 sha256 指纹上，在 8 个 dsh 事件上执行已批准的 command 钩子并注入上下文，并通过设置的 Hooks 页面、输入框上的钩子按钮和 /hooks 命令统一管理。"}
