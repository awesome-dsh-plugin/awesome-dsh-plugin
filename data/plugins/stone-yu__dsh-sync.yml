description:
  en: 'Backs up and syncs DSH configuration, model routes, MCP rows, plugin inventory, skills, memory and chosen directories to WebDAV. Each scope can be enabled independently with push or two-way sync; file-based scopes offer a separate confirmed one-shot restore. Uploads are incremental by file content hash, and a two-way conflict keeps both copies instead of merging.'
  zh: 'DSH 备份与同步：支持配置备份、技能备份、记忆备份和自选目录的多端同步。当前使用 WebDAV，每项独立选择上传备份或双向同步，文件类备份支持选择来源并确认覆盖的一次性还原。'
