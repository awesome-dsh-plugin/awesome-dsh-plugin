name: 43aquarius/dsh-auto-continue
category: model
description:
  en: 'Resumes a session interrupted by a model failure by switching to the next healthy entry of a user-configured model chain, then continues the task automatically.'
  zh: '模型请求失败时，按用户配置的模型链切到下一条可用的备选模型，并自动续接被打断的任务。'