name: lznnnnn1998/dsh-artcraft#plugin-gridcraft
category: tools
description:
  en: "Drive GridCraft from the agent: build workbooks, write and evaluate formulas, format ranges, insert charts and tables, and read cells back. Exposes both GridCraft's command ids and its own MCP server, so a workbook can be created and inspected end to end."
  zh: "让智能体驱动 GridCraft：构建工作簿、写入并计算公式、设置区域格式、插入图表与表格，并读回单元格。同时暴露 GridCraft 的命令 id 与自带的 MCP server，可端到端地创建并检查工作簿。"
