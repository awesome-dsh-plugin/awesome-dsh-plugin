name: longgege-cd/dsh-skin-pixel-anime
category: theme
description:
  en: 'Pixel Dynamic Starfield theme: five palettes, four layered text schemes, five pixel fonts including a simplified-Chinese face, square or rounded corners, a rotating pixel starfield with meteors, and a header pixel clock — configured from its own settings tab.'
  zh: '像素动态星空主题：五套配色、四套分层文字方案、五款像素字体（含简体中文像素字体）、方角与圆角可选、旋转像素星空与流星、顶栏像素时钟，均在插件设置页配置。'