name: kleinklein0824/dsh-obsidian-quote#harness-plugin
category: memory
description:
  en: 'Adds a knowledge-base sidebar backed by the separately installed local Obsidian Quote service: select registered vaults or folders, retrieve read-only note excerpts and cited context, extract rules, generate project convention briefs, and view shared citation statistics.'
  zh: '通过需另行安装的本机 Obsidian Quote 服务提供知识库侧栏：选择已登记知识库或文件夹，只读检索笔记片段和带来源的上下文、提取条款、生成项目规范摘要，并查看共享引用统计。'
