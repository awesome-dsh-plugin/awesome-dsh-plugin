url: https://github.com/beiheng127/dsh-dfy-qq
name: beiheng127/dsh-dfy-qq
category: remote
description:
  en: 'QQ chat behaviour layer for DeepSeek Harness over OneBot 11: persona files injected into every turn, a people file keyed by QQ number, sticker picking with probability and pity, optional non-mention replies, sub-personas distilled from group members, and scheduled messages. Enabling the built-in QQ channel accepts private messages from any QQ user and group messages from any group that @s the bot; there is no sender allowlist, so restrict the bot account or keep the channel off.'
  zh: 给 DeepSeek Harness 加一层 QQ 对话行为：人设文件注入每一轮、按 QQ 号认人的群友档案、带概率与大保底的表情包挑选、可选的主动接话、从群友原话蒸馏出的语气子人格，以及定时消息。开启内置 QQ 通道后，任何 QQ 用户私聊机器人、任何群里 @ 机器人都能驱动 Agent；没有发送者白名单，请用群白名单限制或保持通道关闭。
