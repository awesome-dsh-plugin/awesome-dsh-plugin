url: https://github.com/hechenhao9/dsh-goal-loop
name: hechenhao9/dsh-goal-loop
category: workflow
description:
  en: 'Turns done into something checkable - machine-verifiable checks must all pass, then a blind 4-6 dimension rubric scored by someone other than the author must clear 95 with no red lines hit. The review file itself is machine-audited: quotes matched verbatim against the work, scores recomputed from weights, self-signing rejected.'
  zh: '把「做完了」变成能验的事：能用命令验的判据 0 容忍全绿，再由不是作者的人按盲定标准打分过 95 线且不犯红线。判分文件本身由机器审计——引文逐字比对、分数按权重重算、自己给自己盖章直接拒收。'