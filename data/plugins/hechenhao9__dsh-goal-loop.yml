url: https://github.com/hechenhao9/dsh-goal-loop
name: hechenhao9/dsh-goal-loop
category: workflow
description:
  en: 'Turns done into something checkable in three layers - machine-verifiable checks must all pass, a blind 4-6 dimension rubric scored by someone other than the author must clear 95 with no red lines, and a sealed blind prediction is reconciled against the actual score so a drifting rubric gets caught. The review file itself is machine-audited: quotes matched verbatim against the work, scores recomputed from weights, self-signing rejected.'
  zh: '把「做完了」变成能验的事，三层：能用命令验的判据 0 容忍全绿 → 不是作者的人按盲定标准打分过 95 线且不犯红线 → 判分前先封一份盲预测、判完对账，标准偏了能被抓住。判分文件本身由机器审计——引文逐字比对、分数按权重重算、自己给自己盖章直接拒收。'
