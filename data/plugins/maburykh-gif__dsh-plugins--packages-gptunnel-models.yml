description:
  en: "GPTunnel routes in the model picker: the OpenAI-compatible gateway (https://gptunnel.ru/v1) as five sections — text, architecture, design, images and video; the key is read from GPTUNNEL_API_KEY in the credential store. The image and video sections are catalogs only, because GPTunnel generates media through its separate CreativeLab API. A settings card edits shortcodes, creates user-defined sections, and links to the key page (author referral link, disclosed)."
