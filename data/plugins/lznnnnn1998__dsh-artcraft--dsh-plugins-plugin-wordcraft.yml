name: lznnnnn1998/dsh-artcraft#plugin-wordcraft
category: tools
description:
  en: "Drive WordCraft from the agent: create documents, insert and style text, build tables and headers, track changes and comments, then save as DOCX or convert to PDF, ODT, RTF, Markdown and more. Exposes WordCraft's command ids and its MCP server."
  zh: "让智能体驱动 WordCraft：新建文档、插入并排版文字、构建表格与页眉、跟踪修订与批注，并保存为 DOCX 或转换为 PDF、ODT、RTF、Markdown 等。暴露 WordCraft 的命令 id 与自带的 MCP server。"
