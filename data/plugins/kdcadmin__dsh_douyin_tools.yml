url: https://github.com/kdcadmin/dsh_douyin_tools
name: kdcadmin/dsh_douyin_tools
category: tools
description:
  en: 'Douyin assistant plugin: picks a daily round of videos, reads comments, writes a dated report, can like and comment with an @ mention (both off by default), and publishes clips rendered by your own ComfyUI. Windows only; needs Python 3 and a system Chrome, and the first run needs the install-main-dependencies step plus a QR-code login.'
  zh: '抖音助手插件：每天刷一轮视频、读评论、写带日期的日报，可点赞、评论并 @ 你（默认均关闭），还能发布你自己 ComfyUI 出的片子。仅限 Windows；需 Python 3 与系统 Chrome，首次使用要先点「装主依赖」并扫码登录。'
icon: https://raw.githubusercontent.com/kdcadmin/dsh_douyin_tools/main/assets/icon-180.png