  en: Bundles the 32 gis/ skills of opengis-skills (GDAL, QGIS, GeoServer, PostGIS, PROJ, PDAL, GRASS GIS, JTS, GeoPandas, Shapely, CesiumJS, OpenLayers, Leaflet, deck.gl and more) into the DSH skill catalog; only names and descriptions appear up front, and instruction bodies plus reference documents load on demand.
