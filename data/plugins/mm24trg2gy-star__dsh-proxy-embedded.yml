description:
  zh: '粘贴订阅链接即用：插件自带 mihomo 内核，自动起代理并把 DSH 出站（含 web_fetch）接管过去，不用再单独开 Clash。支持 Clash / V2Ray / Shadowrocket / sing-box / Surge 订阅。'
  en: 'Paste a subscription link and go: the plugin ships an embedded mihomo core, starts the proxy and routes DSH outbound traffic (including web_fetch) through it, so no separate Clash client is needed. Supports Clash / V2Ray / Shadowrocket / sing-box / Surge subscriptions.'