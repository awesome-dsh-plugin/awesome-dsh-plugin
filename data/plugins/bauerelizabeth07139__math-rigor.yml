description:
  en: 'Auditable mathematical proving for DeepSeek Harness: a local stdio MCP server with 23 machine-checking tools, a bundled workflow skill, and the /prove and /audit-proof commands. proven, refuted and inconclusive are never conflated, and unproven steps are reported instead of hidden. Needs Python 3.10+ with pip install -r requirements.txt on first run; the 23 tools are unavailable until then.'
  zh: '给 DeepSeek Harness 的可审计数学证明:本地 stdio MCP 服务器(23 个机器校验工具)+ 工作流技能 + /prove、/audit-proof 命令。proven / refuted / inconclusive 绝不混淆,未证明的步骤如实报告而非隐藏。需 Python 3.10+，首次运行要 pip install -r requirements.txt（就绪前 23 个工具不可用）。'
