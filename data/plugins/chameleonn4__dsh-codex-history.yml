description:
  en: 'Install it by asking DSH in one sentence, then it reads your local Codex CLI/Desktop chat history from ~/.codex/sessions and makes it usable inside DeepSeek Harness: a panel under the composer lists sessions with keyword and date filters and one-click import, the codex_history tool lets an agent list, read, search and summarize past conversations, a session whose working directory matches is injected automatically when a new agent starts, new Codex messages arrive as incremental updates in the running conversation, and a shared folder can mirror both Codex and DSH sessions across machines. Read-only — nothing is written back to Codex.'
  zh: '在 DSH 里说一句话就能装上，随后它会读取 ~/.codex/sessions 里的本地 Codex CLI/桌面版聊天记录并在 DeepSeek Harness 里直接使用：输入框下方的面板可列出会话、按关键词与起止日期筛选并一键导入；codex_history 工具让 agent 列出、读取、检索并汇总过往对话；工作目录命中某条 Codex 会话时，新建 agent 会自动注入该会话上下文；Codex 侧出现的新消息会以增量形式推送到进行中的对话；共享目录还能在多台机器之间同步 Codex 与 DSH 的会话记录。只读，不会往 Codex 写回任何内容。'
