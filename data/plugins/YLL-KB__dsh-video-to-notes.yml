url: https://github.com/YLL-KB/dsh-video-to-notes
name: YLL-KB/dsh-video-to-notes
category: skill
description:
  en: 'Turns course, lecture, tutorial, meeting, and talk videos into structured study notes: it extracts the audio track with ffmpeg, transcribes it with Whisper, then writes notes with a chapter outline, emphasis markers, and a quick-reference card.'
  zh: '把课程、讲座、教程、会议、演讲等视频整理成结构化学习笔记：用 ffmpeg 提取音轨、Whisper 语音转文字，再生成带分段大纲、重点标记和速查卡的笔记。'
