name: kvnis/dsh-lazymcp
category: dev
description:
  en: "Lazy MCP client for dsh: caches each server's tool schemas on disk, registers the tools at boot without connecting, and connects only on the first call."
  zh: "dsh 的懒加载 MCP 客户端：把每个 MCP 服务器的工具 schema 缓存到磁盘，启动时不连接即可注册工具，首次调用时才真正连接。"
