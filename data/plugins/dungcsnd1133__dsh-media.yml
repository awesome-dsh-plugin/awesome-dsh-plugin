url: https://github.com/dungcsnd1133/dsh-media
name: dungcsnd1133/dsh-media
category: vision
description:
  en: 'Adds three session tools — create_image and edit_image over GPT Image or Gemini through the TLPro gateway, and speak for text-to-speech through xAI — plus a viewer in the chat UI for the images and audio they produce. Needs your own TLPRO_API_KEY and XAI_API_KEY, and publicOrigin and mediaDir set in the profile config.'
  zh: '增加三个会话工具——经 TLPro 网关调用 GPT Image 或 Gemini 的 create_image、edit_image，以及经 xAI 的文本转语音 speak——并在聊天界面里提供这些图片和音频的查看器。需自备 TLPRO_API_KEY 与 XAI_API_KEY，并在 profile 配置中设置 publicOrigin 与 mediaDir。'
