description:
  en: 'Lists the files a conversation produced, groups them into five kinds, moves the ticked ones into a 3-day trash, and retires the session log on the next launch. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '对话收尾：把一次对话产生的文件分成五类列出，勾选删除的文件先进回收站保留 3 天，下次启动时清掉这个会话的日志。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
