description:
  en: 'Create and hand off sessions, jump between them, and exchange stateful letters through a workspace mailbox. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '建会话、交棒、在会话之间跳转，并用工作区信箱在会话之间来回通信。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
