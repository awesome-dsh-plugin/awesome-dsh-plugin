url: https://github.com/genesis-agents/dsh-deep-insight
name: genesis-agents/dsh-deep-insight
category: workflow
description:
  en: 'Evidence-based research workspaces with archived sources, knowledge graphs, exact citations and exportable reports. Experimental alpha. Needs Node 24.9 or later, uv and Python 3.13, plus a one-time setup step (setup-engine.mjs) that copies the engine and runs a locked uv sync; pnpm must also be allowed to run the build scripts of onnxruntime-node and protobufjs.'
  zh: '提供原始资料归档、知识图谱、精确引文和可导出报告的循证研究工作区。处于 alpha 阶段。需要 Node 24.9 及以上、uv 和 Python 3.13，另有一步必须执行的安装脚本（setup-engine.mjs，复制引擎并按锁文件执行 uv sync）；pnpm 还需允许 onnxruntime-node 与 protobufjs 运行构建脚本。'
