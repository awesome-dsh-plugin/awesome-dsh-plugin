category: session
description:
  en: 'Workspace-scoped DSH migration: package a project''s conversations, files and attachments, restore them on another machine into a chosen root with historical absolute paths rewritten, then re-sync only what changed — re-activated conversations are fast-forwarded on re-import instead of being skipped.'
  zh: '按工作区迁移 DSH：把一个项目的会话、文件与附件打包，在新机器上还原到指定根目录并重写历史绝对路径，之后只增量同步改动的文件；旧机器上重新激活的会话再次导入时会快进追加，不再整条跳过。'
