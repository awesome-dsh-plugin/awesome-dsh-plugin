description:
  en: 'When the agent is busy, fork the session: the new instruction runs immediately in a forked session while the old turn finishes in the background and reports back.'
  zh: 'Agent 忙时自动分叉会话：新指令立刻在新会话里得到响应，旧会话留在后台跑完并把结果回注。'
