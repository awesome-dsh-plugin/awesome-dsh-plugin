  ja: リサーチエージェント一式。監査可能な根拠チェーンを伴う長期ゴール制御、cron によるスケジューリング、複数エージェントの専門家チーム、自己進化する研究メモリ（FTS5 ＋ RRF による想起）、プロジェクト単位のワークスペース、専用のワークスペース UI を備えます。
