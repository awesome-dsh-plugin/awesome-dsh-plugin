url: https://github.com/wang-bool/travel-story-dsh
name: wang-bool/travel-story-dsh
category: workflow
description:
  en: 'Travel-planning agent mode: the full Travel Story app (map, timeline, playback) takes over the DSH page with chat as a floating panel — 18 agent tools for place search, weather, routing and itinerary editing, with live UI-context injection. Place searches go to AMap (Gaode) or LocationIQ, forecasts to Open-Meteo and routes to OSRM, and the map keys sit in $DSH_HOME/travel-agent.config.json; its HTTP route has no DSH access check.'
  zh: '旅行规划 agent 模式：完整 Travel Story 应用（地图/时间线/播放）整页接管 DSH 页面、对话变浮窗——18 个 agent 工具覆盖地点搜索、天气、路线与行程编辑，并注入实时界面上下文。地点搜索会发给高德或 LocationIQ，天气预报发给 Open-Meteo，路线发给 OSRM，地图密钥保存在 $DSH_HOME/travel-agent.config.json；它的 HTTP 路由没有 DSH 的访问检查。'