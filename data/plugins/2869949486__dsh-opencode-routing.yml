category: usage
description:
  en: "OpenCode Go control panel: an account pool that rotates A-to-B when a key runs out or stops authenticating, per-account 5-hour/weekly/monthly allowance, per-model spend with remaining quota, capability tags (image, video, text-only, tools, reasoning), a live OpenCode-vs-official cost comparison, and quota routing that falls back to a DeepSeek official subscription on an upstream limit or degradation, then returns after 10 stable minutes - shown as a current-route banner, a status card and desktop switch notices, in 10 UI languages."
  zh: "OpenCode Go 控制台：账户池在密钥额度耗尽或鉴权失败时自动 A→B 轮替，按账户显示 5 小时/本周/本月额度，按模型显示用量与剩余额度并标出能力（图像、视频、纯文本、工具调用、推理），实时换算走 OpenCode 还是官方直连更划算；额度路由在上游限流或降级时自动切到 DeepSeek 官方订阅、恢复并稳定 10 分钟后切回，页面顶部有当前路由横幅、状态卡与切换通知，支持 10 种界面语言。"
