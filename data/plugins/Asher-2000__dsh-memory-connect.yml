url: https://github.com/Asher-2000/dsh-memory-connect
name: Asher-2000/dsh-memory-connect
category: memory
description:
  en: 'Cross-session memory plugin for DSH (v0.5.0, npm @asherliner/dsh-memory-connect): auto-extraction, SQLite FTS5 indexing, RRF semantic recall injected into the system prompt every turn, scheduled maintenance, LLM-powered consolidation via ctx.llm, context explosion prevention, and global Soul identity via ~/.dsh/soul.md. New in v0.5.0: temporal context graph (valid_from/valid_until/supersedes, append-only corrections via reviseMemory), trust model (recalled history injected as untrusted reference, current instruction always wins), turn-end summarization (auto summary memories). Zero-config install.'
  zh: 跨会话记忆插件（v0.5.0，npm 包 @asherliner/dsh-memory-connect）：自动提取、SQLite FTS5 索引、RRF 语义召回（每轮注入系统提示词）、定时维护、LLM 智能合并（自动接入 ctx.llm）、上下文爆炸防护、全局身份 Soul（~/.dsh/soul.md）。v0.5.0 新增：时态上下文图谱（valid_from/valid_until/supersedes，reviseMemory 追加式修正）、信任模型（历史记忆作为不可信参考注入，当前指令绝对优先）、轮末自动摘要。零配置装完即用。
