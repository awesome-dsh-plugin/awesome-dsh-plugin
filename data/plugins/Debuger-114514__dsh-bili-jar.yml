name: Debuger-114514/dsh-bili-jar
category: fun
description:
  en: 'A whale-maid with a jar, sitting in the corner of your DSH window. She goes exploring on Bilibili for whatever you are into, ranks by like, coin and favourite rate rather than view count, and brings back pickled snacks that suit your taste. When a term runs dry she takes another route. Five picks go into the jar, and she tells you what each video is about. News-type axes keep only the last two weeks; game guides and music have no limit, and each axis decides for itself.'
  zh: '鲸鱼娘带着一个罐子，守在右下角。按照你的兴趣，她会去 B 站探险，按赞币藏率排，给你找一些符合口味的电子榨菜。哪个词搜得少，她换条路再找。回来把五条装进罐子里，然后和你说说这些视频讲了什么。时政这类她只留最近两周，游戏攻略和音乐不限时间，每根轴她自己定。'
