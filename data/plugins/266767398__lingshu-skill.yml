name: 266767398/lingshu-skill 
category: memory
description:
  en: "Lingshu (灵枢) is a brain-inspired persistent memory, persona and growth system for AI coding agents: pure Python standard library, zero dependencies, local-first, requires Python 3.9+. Hippocampus/cortex layered memory with forgetting curves, dream consolidation, fuzzy associative recall, emotion system, persona drift protection, knowledge base, self-authored skills, and a local web panel. Ships as a DSH bundled skill; the separately installable cordis startup-injector plugin auto-injects sessions only when Lingshu is installed at ~/.dsh/skills/lingshu (or brainPy is configured) and Python 3 is available; the optional update check contacts GitHub/Gitee."
  zh: "灵枢（lingshu-skill）：面向 AI 编程助手的类脑持久记忆、人格与成长系统。纯 Python 标准库、零依赖、本地优先，需 Python 3.9+。海马体/皮层分层记忆与遗忘曲线、做梦巩固、模糊联想回忆、情绪系统、人格漂移防护、知识库、技能自编辑，并带本地可视化面板。以 DSH bundled skill 形式安装；仓库另含可单独安装的 cordis 启动注入插件，仅在灵枢已安装到 ~/.dsh/skills/lingshu（或配置 brainPy）且 Python 3 可用时才会自动注入会话；可选的更新检查会访问 GitHub/Gitee."
