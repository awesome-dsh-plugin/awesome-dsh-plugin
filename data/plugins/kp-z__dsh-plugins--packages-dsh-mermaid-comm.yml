url: https://github.com/kp-z/dsh-plugins/tree/main/packages/dsh-mermaid-comm
name: kp-z/dsh-plugins#dsh-mermaid-comm
category: docs
description:
  en: 'Makes the AI default to Mermaid diagrams in development conversations: a composer checkbox controls prompt guidance, mermaid_validate checks syntax, a gate repairs or drops broken diagrams, and a vault versions them. Rendering is provided by dsh-mermaid. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '让 AI 在开发对话里默认用 Mermaid 表达：输入框勾选控制提示词注入，mermaid_validate 校验语法，坏图会被修掉或移除，图库留版本；渲染由 dsh-mermaid 承担。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
