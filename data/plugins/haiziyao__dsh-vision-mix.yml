url: https://github.com/haiziyao/dsh-vision-mix
name: haiziyao/dsh-vision-mix
category: vision
description:
  en: 'Combine text, vision, and image-generation APIs into one Mix model with automatic routing: text-only requests go to the chat model, user images and agent screenshots go to the vision model, follow-ups keep using the same session image, and agents can generate or edit images with session-scoped call history.'
  zh: 把文本、识图和生图 API 组合成一个 Mix 模型并按对话内容自动路由：纯文本走聊天模型，用户图片和 Agent 截图走识图模型，后续可继续追问同一张图；还支持图片生成与编辑及会话级调用记录。
  ja: テキスト、視覚、画像生成の API を 1 つの Mix モデルにまとめ、自動で振り分けます。テキストだけのリクエストはチャットモデルへ、ユーザーの画像やエージェントのスクリーンショットは視覚モデルへ回り、続きの質問では同じセッションの画像を使い続けます。エージェントはセッション単位の呼び出し履歴つきで画像の生成や編集も行えます。
