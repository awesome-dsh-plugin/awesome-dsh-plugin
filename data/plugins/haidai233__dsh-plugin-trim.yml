url: https://github.com/haidai233/dsh-plugin-trim
name: haidai233/dsh-plugin-trim
category: tools
description:
  en: 'Cuts the tool surface for local models only. Every agent is trimmed according to the provider it is actually running on: a provider counts as local when its id is listed in `routes`, when `localProvider` names it, when its baseURL resolves to loopback or a private range, or when the id carries a local/ollama/llama/vllm/sglang marker. For those agents the plugin calls `agent.ctx.tools.restrict({ allow })` with a configurable whitelist and keeps the disposer, so switching a session back to a cloud model lifts that one session and leaves the others alone; the re-plan runs on model-selection events plus one delayed pass 120 ms later, because the projection can land after the event. Nothing is written to config for this. A second, opt-in layer (`auto`) also disables whole plugin entries through `pluginManager.setPluginEnabled` — the same call the settings UI makes — for a configurable entryId list, which is what removes a tool family together with whatever else that plugin injects. A `tool_trim` tool exposes list/status/set/apply/restore to the model, and a panel is served at `GET /api/plugin-trim/panel` from the plugin itself, with ten POST endpoints behind a same-origin check; the panel lists every manageable plugin entry with search and paging, per-tool checkboxes, a provider picker limited to providers that are declared in the profile or currently in use, and a scope switch that keeps cloud sessions untouched by default. Measured on a 12GB laptop GPU running a 27B model with a fully resident 256K cache: the same conversation went from 105 tools / 56,306 prompt tokens / 22.5 tok/s decode to 62 tools / 34,207 / 43.0 after disabling three tool-heavy plugins, and to 14 tools / 12,890 / 66.8 after restricting the whitelist, with prefill rising from 487 to 1,310 tok/s. Trimming the tool surface also removes the skill catalog injection, which is another ~4.3K tokens. Because a locally installed package gets no market card in the DSH sidebar, the panel is served by the plugin itself and the repo ships a Windows launcher that finds the current DSH port instead of hardcoding it.'
  zh: '只给本地模型裁工具面。每个会话按它当前实际使用的 provider 判断：provider id 写在 `routes` 里、`localProvider` 点到它、baseURL 落在回环或私有网段、或者 id 带 local/ollama/llama/vllm/sglang 标记，都算本地。命中的会话走 `agent.ctx.tools.restrict({ allow })` 收到白名单，并保留 disposer —— 所以把一个会话切回云端时只放开那一个，别的会话不受影响；重排挂在模型选择事件上，并在 120 ms 后再补一次，因为选择投影可能比事件晚一拍。这一层不写任何配置。第二层是可选开关 `auto`：按清单用 `pluginManager.setPluginEnabled` 停用整条插件条目（和设置页手点是同一个调用），用来连同插件注入的其它东西一起摘掉。模型侧还有 `tool_trim` 工具（list/status/set/apply/restore）。面板由插件自己提供 `GET /api/plugin-trim/panel`，另有十个 POST 接口并做同源校验：列出全部可管理插件（带搜索与分页）、逐个工具勾选、provider 选择器（只列 profile 里声明过的和当前正在用的）、以及默认勾上的「只对本地会话生效」。实测（12GB 笔记本显卡跑 27B、256K 全驻留）：同一段对话从 105 个工具 / 56,306 prompt token / decode 22.5 tok/s，关掉三个工具重的插件后变成 62 / 34,207 / 43.0，再裁白名单后变成 14 / 12,890 / 66.8，prefill 从 487 升到 1,310 tok/s。裁工具面会连带去掉技能目录注入，又省约 4.3K token。因为本地目录安装的包在 DSH 侧栏拿不到市场卡片，面板由插件自托管，仓库里另带一个会自动找当前 DSH 端口的 Windows 启动器。'
