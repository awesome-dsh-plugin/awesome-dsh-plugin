description:
  en: 'AtomGit plugin bundle for DeepSeek Harness: six built-in AtomGit skills (plan issues, implement issues, review PRs, merge PRs, publish CLI releases, mirror to GitHub) plus ag CLI integration and platform-hosted MCP tools for repos, branches, issues, PRs, and search.'
  zh: AtomGit 插件包：内置六个 AtomGit 技能（Issue 规划、Issue 实现、PR 审查、PR 合并、CLI 版本发布、GitHub 镜像），并集成 ag CLI 与平台托管的 MCP 工具（仓库/分支/Issue/PR/搜索）。
  ja: DeepSeek Harness 向けの AtomGit プラグインバンドル。組み込みの AtomGit スキル 6 種（issue の計画、issue の実装、PR のレビュー、PR のマージ、CLI リリースの公開、GitHub へのミラー）に加え、ag CLI の連携と、リポジトリ・ブランチ・issue・PR・検索を扱うホスト型 MCP ツールを提供します。
