name: yoyococo1234/dsh-drag-graft#chip-restore
category: session
description:
  en: 'Companion to dsh-drag-graft that fixes a rewind side effect: after dsh-rewind refills the composer, a session reference shows up as grey @Title text instead of the native blue chip. This client-only plugin restores it by matching the @Title against the session list by exact-and-unique title (ambiguous or missing titles are skipped, so the wrong conversation is never inserted); full @[title](dsh-session:...) tokens are handled too. Self-references are left untouched, and when host APIs are missing or insertion is rejected the draft is left as-is. Installable alongside the original dsh-drag-graft: both live in the same repository and neither changes the other. Ships with 17 logic tests; browser rendering of the restored chip is not verified in CI and is called out in the README.'
  zh: 'dsh-drag-graft 的配套插件，修一个撤回副作用：dsh-rewind 回填输入框后，会话引用会显示成灰底的 @标题 而不是原生蓝色 chip。这个纯 client 插件按会话列表精确且唯一地反查 @标题 对应的会话并还原成 chip；标题重名或找不到就跳过，绝不插错对话，同时也支持完整的 @[标题](dsh-session:...) token。自引用保持原样；拿不到宿主 API 或插入被拒时草稿原封不动。可和原版 dsh-drag-graft 同时安装：两者同仓库、互不改动。含 17 项逻辑测试；还原后 chip 的浏览器渲染未在 CI 中验证，README 已明确说明。'
icon: https://raw.githubusercontent.com/yoyococo1234/dsh-drag-graft/main/packages/chip-restore/icon.svg
