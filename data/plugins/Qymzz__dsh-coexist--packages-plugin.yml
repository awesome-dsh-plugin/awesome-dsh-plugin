description:
  en: Keep plugins that claim the same tool, command, provider or service; duplicate tools become name__coexistN aliases and conflicts can be scanned and repaired from Settings.
  zh: 让抢同一个工具、命令、provider 或 service 的插件共存；同名工具自动变成 name__coexistN 别名，并可在设置页检查和修复冲突。
