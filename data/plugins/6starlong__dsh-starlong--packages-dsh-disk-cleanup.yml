url: https://github.com/6starlong/dsh-starlong/tree/main/packages/dsh-disk-cleanup
name: 6starlong/dsh-starlong#dsh-disk-cleanup
category: tools
description:
  en: 'Moves Shell temporary files out of the workspace, grants write access to the temp directory, explains where temporary files go via the system prompt, and cleans up expired temporary files and orphaned attachments on a schedule. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '将 Shell 临时文件移出工作区，并补齐对临时目录的写入权限，通过系统提示词说明临时文件落点，再按保留天数清理过期的临时文件和无主附件。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
