name: cccccccccccccy/dsh-syncthing-pair
category: remote
description:
  en: 'Pairs one folder on this Mac with one folder on a remote Mac over SSH and creates the same two-way Syncthing folder on both sides, with a DSH Web panel and an agent tool. Its routes go through the DSH connection access check, so only an authenticated page of the same DSH host can call them.'
  zh: '输入本机与远端 Mac 的两个目录，通过 SSH 在两端创建同一个 Syncthing 双向文件夹；带 DSH 网页面板和 agent 工具。路由经过 DSH 的 connection 访问检查，只有同一 DSH 主机上已认证的页面可以调用。'
