url: https://github.com/mzjqwq/dsh-sidebar-expand-all
name: mzjqwq/dsh-sidebar-expand-all
category: ui
description:
  en: 'Keeps every session in the DSH Desktop sidebar fully expanded by default; the "Expand remaining N sessions" row reveals all hidden sessions at once on a single click, and collapsing returns to exactly 5. Applies equal-length patches to the app.asar workspace client bundle (backup and one-click restore included), so it needs an app restart and a DSH update reverts it.'
  zh: '让 DSH 桌面版侧栏的会话默认全部展开：「展开其余 N 个会话」点一次就展开该工作区所有剩余会话，「收起」严格回到 5 个。通过对 app.asar 内 workspace client bundle 做等长补丁实现（含备份与一键还原），因此需要重启应用，DSH 升级后补丁会被覆盖、需重新应用。'
icon: https://raw.githubusercontent.com/mzjqwq/dsh-sidebar-expand-all/main/assets/icon-180.png
