name: rirtue/dsh-breeze-speak
category: voice
description:
  en: 'Reads each reply aloud through the BreezeBlue / Breeze TTS 2 API. Synthesis starts as soon as the reply first sentence is complete rather than after the whole reply, and the audio is streamed as raw PCM into Web Audio so it plays continuously while it arrives.'
  zh: '通过云端 BreezeBlue / Breeze TTS 2 API 朗读每轮回复：回复的第一句一完整就发起合成、不必等整段说完，音频以 PCM 裸流边收边推给 Web Audio 连续播放。'
