description:
  en: 'Reads each reply aloud through the hosted BreezeBlue / Breeze TTS 2 API: starts synthesis as soon as the first sentence appears and streams raw PCM into Web Audio, so the first sound lands about 0.6s after that sentence instead of 2.1-2.8s.'
  zh: '通过云端 BreezeBlue / Breeze TTS 2 API 朗读每轮回复：第一句一出现就发起合成，把 PCM 裸流边收边推给 Web Audio 连续播放，首声约 0.6 秒到达，而不是 2.1~2.8 秒。'
