url: https://github.com/Delthin/dsh-plugins/tree/main/packages/fast
name: Delthin/dsh-plugins#fast
category: model
description:
  en: 'Switch sessions between Standard and Fast tiers via the model selector or `/fast` command, attaching the `priority` tier to eligible Responses requests and forwarding them to the target endpoint when Fast is enabled. Interactive sessions can toggle tiers on the fly while team roles lock in their tier at launch; once Fast is active alongside required configuration and upstream support, requests are routed with `priority`, with actual speed and billing governed by your provider. It needs provider, source and target URLs filled in; it then runs a loopback proxy that sends matching requests, with their authorization header, to the target URL.'
  zh: '通过模型选择器或 `/fast` 命令在会话中按需切换 Standard 与 Fast 档位，在开启 Fast 时为符合配置的 Responses 请求附带 `priority` 档位并转发至目标端点。交互会话支持随时切换，团队角色则在启动时锁定所用档位；启用 Fast 且完成前置配置与上游接口支持时请求即按 `priority` 档位发送，实际响应速度与计费规则由上游服务商决定。需要先填齐 provider、源地址和目标地址；之后由本地回环代理把匹配的请求连同授权头一起转发到目标地址。'
