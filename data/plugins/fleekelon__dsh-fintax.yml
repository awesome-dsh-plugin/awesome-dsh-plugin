description:
  en: "Chinese cross-border tax & monthly close workbench (v0.9.1): modular zero-dependency, container-query responsive DSH sidebar workbench and settings view (sidebar.panellist, main, settings.section, native dark-theme data-ds-dark-theme support) with interactive showcase at https://fleekelon.github.io/fintax-portal/; zero-token worker-thread BigInt parser (fintax_parse_statement) for 17 channels — 11 sales platforms (Amazon incl. EU locales & 2027 FBA fees, TikTok Shop, Temu, AliExpress, Shopee, Shopify, PayPal, Stripe, SHEIN, Walmart, Lazada) + 6 third-party settlement wallets (WorldFirst, Payoneer, Airwallex, LianLian, PingPong, SUNRATE) — plus Stage 3 domestic corporate bank receipt parsing (CMB/BOC/ICBC/CCB/ABC/BOCOM & generic), supporting CSV/TSV/UTF-16/XLSX/ZIP, Shopify + PayPal/Stripe anti-double-counting, fail-closed 5-key Stage 1->2->3 fund-chain reconciliation (isolating stage3CandidateMatches), session-bound in-memory cacheToken exports (/parse/export), entity+storeScope+month anti-collision archive (dsh-fintax-history-v4) with Q1-Q4 annual summary, tri-region reporting self-check (CN 810 / EU DAC7 / US 1099-K), entity reassignment, and SHA-256 verified UUID-idempotent JSON backup/restore, rolling 12M 75M/5M indicators, and zero-promo Boss HTML / Finance CSV / Annual & 12M trend exports; 14-scenario deterministic tax & reconciliation calculator (fintax_calc, incl. EU EUR 3+2 low-value parcel & PID reverse-pricing, US Type 11 vs 9810 DDP / IEEPA / FIOR, FBA mixed-procurement split, export rebate cancel + battery excise, annual bonus dual-track) with /calc/specs registry; 4 read-only Tencent IMA knowledge-base tools with retry, 60s cache, short-query fallback, and offset pagination (ima_list_kbs, ima_browse, ima_search, ima_read) plus an in-workbench read-only IMA quick-lookup drawer (/ima-quick, strictly 3 plain-text fields <=160 chars); and 4 compliance skills. Raw statements and parse cacheToken stay strictly in memory (never written to disk) via host-authenticated /api/fintax routes (/parse, /parse/export, /calc, /calc/specs, /history, /history/report, /history/annual, /history/reassign, /history/backup, /ima-quick, /status, /credentials, /kbs, /settings); optional redacted KPI summaries archive to ~/.config/ima/fintax_history.json (0600, never raw order rows), and optional write-only IMA credentials/custom FX presets store in ~/.config/ima/ and send exclusively to ima.qq.com; pure ESM with zero runtime or dev dependencies."
  zh: "中国跨境财税与月结核对工作台（v0.9.1）：模块化零依赖、基于 CSS 容器查询自适应且原生适配暗黑主题（data-ds-dark-theme）的 DSH 侧边栏工作台与设置页（sidebar.panellist、main、settings.section），配套互动官网 https://fleekelon.github.io/fintax-portal/；0 Token 独立工作线程 BigInt 解析引擎（fintax_parse_statement）覆盖 17 通道——11 大销售平台（Amazon 含欧陆本地表头与 2027 FBA 新费/TikTok Shop/Temu/速卖通 AliExpress/Shopee/Shopify/PayPal/Stripe/SHEIN/Walmart/Lazada）+ 6 大第三方结汇通道（万里汇 WorldFirst/派安盈 Payoneer/空中云汇 Airwallex/连连国际 LianLian/PingPong/寻汇 SUNRATE）——并新增 Stage 3 国内对公银行回单解析（招行/中行/工行/建行/农行/交行及通用格式），支持 CSV/TSV/UTF-16/XLSX/ZIP、独立站双导入防重、fail-closed 五键三段资金链核销（独立隔离参考级候选）、会话独占纯内存 cacheToken 免重传导出（/parse/export）、按「主体+店铺+账期」防串账归档（dsh-fintax-history-v4，含 Q1–Q4 年度汇总、中欧美三地交卷自检 810/DAC7/1099-K、主体重分配与 SHA-256 校验按 UUID 幂等 JSON 备份恢复）、12 个月 7500 万/500 万滚动监控及默认零推广老板 HTML/财务 CSV/年度与趋势月报导出；14 场景确定性算税工具（fintax_calc，新增欧盟 €3+€2 低值包裹与 PID 反推、美线 Type 11 vs 9810 DDP 与 IEEPA/FIOR、FBA 有票无票混合采购拆单、退税取消与电池消费税冲击、年终奖双轨比选）及 /calc/specs 规格接口；带重试、60 秒只读缓存、热点短词并发补查与 offset 分页的 4 个腾讯 IMA 只读检索工具（ima_list_kbs、ima_browse、ima_search、ima_read）及工作台内置只读 IMA 轻检索侧抽屉（/ima-quick，严格 3 字段纯文本 ≤160 字）；以及 4 项合规自查技能。原始账单与解析 cacheToken 仅驻本地内存（严禁落盘），经宿主 connection 准入校验的 /api/fintax 路由（/parse、/parse/export、/calc、/calc/specs、/history、/history/report、/history/annual、/history/reassign、/history/backup、/ima-quick、/status、/credentials、/kbs、/settings）运行；可选脱敏 KPI 汇总存盘 ~/.config/ima/fintax_history.json（0600，绝不存原始订单行）；可选只写 IMA 凭证与汇率预设仅发送至官方 ima.qq.com；纯 ESM 严格零运行时与开发依赖。"
