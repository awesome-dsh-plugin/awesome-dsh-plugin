url: https://github.com/fleekelon/dsh-fintax
name: fleekelon/dsh-fintax
category: tools
icon: https://raw.githubusercontent.com/fleekelon/dsh-fintax/main/assets/icon-180.png
description:
  en: "Chinese tax and cross-border e-commerce workbench: a DSH sidebar workbench and settings view (sidebar.panellist, main, settings.section), a local BigInt statement parser for 8 platforms/wallets (Amazon, TikTok Shop, Temu, AliExpress, Shopee, Shopify, PayPal, and Stripe) CSV/TSV/UTF-16/XLSX/ZIP exports with multi-currency consolidation, rolling 12-month 75M/5M CNY screening indicators, and HTML/Markdown/CSV report export (fintax_parse_statement), a 10-scenario deterministic tax and reconciliation calculator (fintax_calc), 4 read-only Tencent IMA knowledge-base tools with retry, 60s read cache, and short-query fallback (ima_list_kbs, ima_browse, ima_search, ima_read), and 4 bundled compliance skills. Raw statements are parsed locally in memory via host-authenticated /api/fintax routes (/parse, /calc, /history, /status, /credentials, /kbs, /config); optional monthly KPI-only summaries may be archived locally in ~/.config/ima/fintax_history.json (0600, never raw order rows), and optional IMA credentials from env vars or ~/.config/ima/ are write-only (never echoed back) and sent only to ima.qq.com; pure ESM with zero runtime dependencies."
  zh: "中国财税与跨境电商工作台：提供 DSH 侧边栏独立交互工作台与设置页（sidebar.panellist、main、settings.section）、8 大平台及资金池（Amazon/TikTok Shop/Temu/速卖通 AliExpress/Shopee/Shopify/PayPal/Stripe）CSV/TSV/UTF-16/XLSX/ZIP 原始结算账单本地 BigInt 离线排雷、多币种合并、12 个月 7500 万/500 万滚动初筛与 HTML/Markdown/CSV 导出工具（fintax_parse_statement）、10 场景确定性算税与四层口径桥接工具（fintax_calc）、带重试、60 秒只读缓存与首屏短词并发补查的 4 个腾讯 IMA 知识库只读检索工具（ima_list_kbs、ima_browse、ima_search、ima_read）及 4 项合规自查技能。原始账单仅在本地内存经宿主 connection 准入校验的 /api/fintax 路由（/parse、/calc、/history、/status、/credentials、/kbs、/config）运行；可选的月度脱敏 KPI 汇总本地存盘于 ~/.config/ima/fintax_history.json（0600，绝不存储原始订单行）；可选的 IMA 凭证从环境变量或 ~/.config/ima/ 读取（只写不回传明文）并仅发送至官方 ima.qq.com；纯 ESM 零运行时依赖。"
