description:
  en: "Chinese cross-border tax & monthly close workbench (v0.8.5): container-query responsive DSH sidebar workbench and settings view (sidebar.panellist, main, settings.section) with interactive showcase at https://fleekelon.github.io/fintax-portal/; zero-token worker-thread BigInt parser (fintax_parse_statement) for 11 channels — 8 sales platforms (Amazon, TikTok Shop, Temu, AliExpress, Shopee, Shopify, PayPal, Stripe) + 3 third-party settlement wallets (WorldFirst, Payoneer, Airwallex) — supporting CSV/TSV/UTF-16/XLSX/ZIP, Shopify + PayPal/Stripe anti-double-counting, honest 3-stage fund-chain reconciliation (marking wallet corporate payouts pending bank receipt), sanitized unknown-header diagnostics, persisted custom FX presets, entity+storeScope+month anti-collision archive (dsh-fintax-history-v3), rolling 12M 75M/5M indicators, and zero-promo Boss HTML / Finance CSV / 12M trend exports; 10-scenario deterministic tax & reconciliation calculator (fintax_calc); 4 read-only Tencent IMA knowledge-base tools with retry, 60s cache, and V2.4.1 short-query fallback (ima_list_kbs, ima_browse, ima_search, ima_read); and 4 compliance skills. Raw statements run strictly in memory via host-authenticated /api/fintax routes (/parse, /calc, /history, /history/report, /status, /credentials, /kbs, /settings, /config); optional redacted KPI summaries archive to ~/.config/ima/fintax_history.json (0600, never raw order rows), and optional write-only IMA credentials/custom FX presets store in ~/.config/ima/ and send exclusively to ima.qq.com; pure ESM with zero runtime dependencies."
  zh: "中国跨境财税与月结核对工作台（v0.8.5）：基于 CSS 容器查询自适应的 DSH 侧边栏工作台与设置页（sidebar.panellist、main、settings.section），配套互动官网 https://fleekelon.github.io/fintax-portal/；0 Token 独立工作线程 BigInt 解析引擎（fintax_parse_statement）覆盖 11 通道——8 大销售平台（Amazon/TikTok Shop/Temu/速卖通 AliExpress/Shopee/Shopify/PayPal/Stripe）+ 3 大第三方结汇通道（万里汇 WorldFirst/派安盈 Payoneer/空中云汇 Airwallex）CSV/TSV/UTF-16/XLSX/ZIP，支持独立站双导入防重、三段资金链交叉核对（诚实标注待核银行回单）、脱敏未知表头诊断、自定义汇率持久化、按「主体+店铺+账期」防串账归档（dsh-fintax-history-v3）、12 个月 7500 万/500 万滚动监控及默认零推广老板 HTML/财务 CSV/趋势月报导出；10 场景确定性算税工具（fintax_calc）；带重试、60 秒只读缓存与 V2.4.1 热点短词并发补查的 4 个腾讯 IMA 只读检索工具（ima_list_kbs、ima_browse、ima_search、ima_read）及 4 项合规自查技能。原始账单仅在本地内存经宿主 connection 准入校验的 /api/fintax 路由（/parse、/calc、/history、/history/report、/status、/credentials、/kbs、/settings、/config）运行；可选脱敏 KPI 汇总存盘 ~/.config/ima/fintax_history.json（0600，绝不存原始订单行）；可选只写 IMA 凭证与汇率预设仅发送至官方 ima.qq.com；纯 ESM 零运行时依赖。"
