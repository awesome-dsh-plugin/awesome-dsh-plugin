url: https://github.com/fleekelon/dsh-fintax
name: fleekelon/dsh-fintax
category: tools
icon: https://raw.githubusercontent.com/fleekelon/dsh-fintax/main/assets/icon-180.png
description:
  en: "Chinese tax and cross-border e-commerce workbench: a DSH sidebar workbench and settings view (sidebar.panellist, main, settings.section), a local BigInt statement parser for Amazon, TikTok Shop, Temu, Shopify, and Stripe CSV/TSV/UTF-16/XLSX/ZIP exports with multi-currency consolidation, 75M CNY threshold check, and HTML/Markdown report export (fintax_parse_statement), a 7-scenario deterministic tax calculator (fintax_calc), 4 read-only Tencent IMA knowledge-base tools with retry and 60s read cache (ima_list_kbs, ima_browse, ima_search, ima_read), and 4 bundled compliance skills. Statements and calculator forms run locally in memory via host-authenticated /api/fintax routes (/parse, /calc, /status, /credentials, /kbs, /config); optional IMA credentials are read from environment variables or ~/.config/ima/ (write-only, never echoed back) and sent only to ima.qq.com; pure ESM with zero runtime dependencies."
  zh: "中国财税与跨境电商工作台：提供 DSH 侧边栏独立交互工作台与设置页（sidebar.panellist、main、settings.section）、Amazon/TikTok Shop/Temu/Shopify/Stripe 五大平台 CSV/TSV/UTF-16/XLSX/ZIP 原始结算账单本地 BigInt 离线排雷、多币种合并、7500万小微红线监测与 HTML/Markdown 体检单导出工具（fintax_parse_statement）、7 场景确定性算税与差额桥接工具（fintax_calc）、带重试与 60 秒只读缓存的 4 个腾讯 IMA 知识库只读检索工具（ima_list_kbs、ima_browse、ima_search、ima_read）及 4 项合规自查技能。账单拖入与算税表单仅在本地内存经宿主 connection 准入校验的 /api/fintax 路由（/parse、/calc、/status、/credentials、/kbs、/config）运行；可选的 IMA 凭证从环境变量或 ~/.config/ima/ 读取（只写不回传明文）并仅发送至官方 ima.qq.com；纯 ESM 零运行时依赖。"
