url: https://github.com/NomanLord/dsh-fairy-zzz
name: NomanLord/dsh-fairy-zzz
category: theme
description:
  en: 'Zenless Zone Zero H.D.D skin for the DSH Web UI: boot animation, animated eye core with a usage bubble, time-of-day greeting, automatic light/dark switching with a contrast check, a study-todo card in the sidebar, settings switches for the dsh-mind and neural-memory plugins, a per-session Fairy toolchain that trims which tools the model sees, and optional local GPT-SoVITS voice (URLs, paths and English are never spoken). Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '绝区零 H.D.D 风格的 Fairy Ⅲ 皮肤：开机动画、眼徽核心与用量气泡、按时段问候、深浅色自动切换与对比度校验、侧栏学习代办卡片、设置页里的 dsh-mind / 神经记忆开关、按会话裁剪模型可见工具的 Fairy 工具链，以及可选的本地 GPT-SoVITS 语音（网址 / 路径 / 英文不念）。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/NomanLord/dsh-fairy-zzz/main/assets/icon-180.png
