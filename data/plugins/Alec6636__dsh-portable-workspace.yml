url: https://github.com/Alec6636/dsh-portable-workspace
name: Alec6636/dsh-portable-workspace
category: tools
description:
  en: 'Portable Workspace: (1) 100% off the host disk, with sessions, plugins, projects and logs all on a removable drive or USB stick; work portably, no fear of switching computers or reinstalling the OS. (2) Independent portable web instances, multiple at once, each with its own plugin configuration. (3) Drive-letter-independent detection plus offline use. (4) A password for privacy and against accidental deletion, without encrypting the data (security). (5) One-click reinstall of missing plugins from a list you can prune. (6) Two-way session migration across drives and the local machine, .zip backup/restore, rename. (7) Upgrade-friendly, zero dependencies, works offline. (8) Optional local-login sync. (9) Automatic cleanup of expired stale cookies. Needs DSH and this plugin on each computer; verified on Windows only. The workspace password gates actions inside the plugin and does not encrypt the files, and the optional "sync local login" copies your DeepSeek account credentials onto the drive as plain-text YAML.'
  zh: '移动工作区：① 100% 不落本地， 会话、插件、工程与日志 全放在 移动盘/U盘。便携工作，不惧换电脑、不惧重装系统；②独立便携 web 实例，可多开、独立插件配置环境；③盘符无关识别 + 脱机；④密码防隐私、防误删， 不加密数据（安全）；⑤缺插件一键按清单重装，可剔除的清单；⑥跨盘·本机会话双向迁移 + .zip 备份恢复 + 改名；⑦升级友好、零依赖、离线可用。⑧可选的「同步本机登录」⑨自清理过期失效的cookie。每台电脑都需安装 DSH 和本插件；仅在 Windows 上验证过。工作区密码只限制插件内的操作、并不加密盘上文件；可选的「同步本机登录」会把 DeepSeek 账号凭据以明文 YAML 复制到盘上。'
