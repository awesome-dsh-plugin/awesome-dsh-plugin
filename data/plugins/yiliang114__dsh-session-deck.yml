name: yiliang114/dsh-session-deck
category: session
description:
  en: 'Adds Activity and Favorites views to the DSH sidebar for running, waiting, unread, recent, and natively pinned sessions across workspaces, while preserving the native workspace tree.'
  zh: '在 DSH 侧栏添加 Activity 和 Favorites 视图，跨工作区查看运行中、等待回复、未读、最近及原生置顶会话，并保留原生工作区树。'
