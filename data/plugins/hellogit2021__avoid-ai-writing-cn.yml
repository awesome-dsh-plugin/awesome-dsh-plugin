url: https://github.com/hellogit2021/avoid-ai-writing-cn
name: hellogit2021/avoid-ai-writing-cn
category: tools
description:
  en: 'Chinese writing de-AI plugin (AI-isms / AI writing / humanize): say "去掉AI味" to rewrite text, "写的不错" to auto-learn new AI words into the avoid list. Free from the Zhihu "去AI味写作技巧" community.'
  zh: 中文写作去 AI 味技能插件（AI-isms / AI writing / humanize）：说"去掉AI味"即重写，说"写的不错"自动把新 AI 词汇记入规避表。由知乎圈子"去AI味写作技巧"社区免费提供。
