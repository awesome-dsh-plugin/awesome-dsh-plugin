name: iStarryDust/dsh-ui-liquid-glass
category: theme
description:
  en: 'Refractive liquid-glass skin: custom wallpapers, several tunable refracting glass surfaces, wallpapers that rotate by time of day, four theme colours, a water-drop highlight lens on the selected item, and per-control parameters tuned from the bottom-right panel.'
  zh: '可折射的液态玻璃皮肤 UI：可自定义壁纸、多个可调折射液态玻璃面、随时段轮换的壁纸、四档主题色、选中项带水滴状高亮飞镜、右下可自定义每个控件参数。'