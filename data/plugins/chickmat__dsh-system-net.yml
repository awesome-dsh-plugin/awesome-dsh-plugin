description:
  en: 'Make DSH follow your system network settings: route through the OS proxy and trust its certificate store, so TLS-intercepting accelerators work without environment variables or a restart.'
  zh: 让 DSH 跟随系统网络设置：走系统代理并信任系统证书库，无需环境变量、无需重启。
