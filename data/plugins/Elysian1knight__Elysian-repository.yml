description:
  en: 'A sidebar chat room that brings your already-existing sessions into one room to talk. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '侧栏聊天室：把已经存在的会话叫进同一个屋里说话。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'