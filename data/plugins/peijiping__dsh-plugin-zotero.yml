name: peijiping/dsh-plugin-zotero
category: tools
tarball: https://github.com/peijiping/dsh-plugin-zotero/releases/latest/download/dsh-plugin-zotero.tgz
description:
  en: 'Bring your Zotero library into DSH: browse collections and tags in the sidebar, read PDFs with highlights in place, and cite excerpts, annotations, notes or whole items into the chat so the model works from the source text. The model can also search and organize the library, import papers and attach translations back to items; first use needs the Zotero MCP plugin and the local API enabled.'
  zh: '把 Zotero 文库接进 DSH：右侧栏按分类与标签浏览，双击即在 DSH 内精读 PDF，划词摘录、标注、笔记或整篇文献一键引用进对话，让 AI 基于原文写综述、做对比、提数据；模型也能检索整理文库、导入论文、回挂译文。首次使用需在 Zotero 装集成 MCP 插件并开启本地 API。'
