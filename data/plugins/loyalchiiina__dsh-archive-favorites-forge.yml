url: https://github.com/loyalchiiina/dsh-archive-favorites-forge
name: loyalchiiina/dsh-archive-favorites-forge
category: session
description:
  en: 'Conversation management for DSH: bulk-archive idle conversations (archiving only marks them; by default it also sends their snapshot ledgers to the Windows Recycle Bin, with auto-ticking of timed-out archived rows), permanently delete conversations after confirmation, star the ones worth keeping with batch-unfavourite and size-tier filtering, undo the last reply with a per-turn snapshot, clean up snapshots with a three-tier result and archived files from one panel, and continue a long conversation in a new window via a compact five-section handover brief (current goal + full todo + latest artefact progress + artefact/log paths + next steps) that inherits the original preset by default or lets you pick any preset from a dropdown. Adapts DSH kernel 0.2.2-rc.1. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 对话管理工具箱：按闲置批量归档（归档只做标记，默认顺带把快照账本送进 Windows 回收站，并自动勾选超时的已归档行），确认后可永久删除对话；收藏常看会话并支持多选一键取消收藏、按大小分档筛选；按轮次撤销回复并保留轮次快照；一键清理快照（三档结果：已清/无快照可清/失败）与归档档案；一键新窗口继续对话，把长对话蒸馏成五段精简交接书（当前目的 + 完整 todo + 最新产物进度 + 产物/日志路径 + 你现在要做的），默认继承原对话预设，取消勾选可从全部预设下拉挑选。适配 DSH 内核 0.2.2-rc.1。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
