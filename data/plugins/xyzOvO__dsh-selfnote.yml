description:
  en: 'Self-narrative memory: the model writes short first-person notes to itself (“I” = the agent), kept across sessions and injected each turn within a fixed budget. Separately, recall over your own past conversations with citations, and an optional inverted index that stores tokens and positions only — never the text.'
  zh: '自我叙述库：模型写给自己看的第一人称短句（「我」= agent），跨会话保留，每回合按固定预算注入；与「用户说过的话」分开存、分开注入。另带带出处的历史检索，以及只存词元与位置的倒排索引（不复制正文）。'
