description:
  en: 'Self-narrative memory plus a user profile: the model writes first-person notes to itself (“I” = the agent), while a profile of you is aggregated from approved facts — every line traceable to a fact id, editable and switchable off. Facts fade by use and time (Ebbinghaus-style heat) without ever changing their credibility. Preference-like lines you say are auto-detected as candidates (never auto-approved), with conflicts kept side by side. Recall over past conversations with citations; optional token-only inverted index.'
  zh: '自我叙述 + 用户画像：模型写给自己看的第一人称短句（「我」= agent），另有从已采纳记忆聚合出的「关于你」画像，每句可回溯到具体事实、可手改可关闭。事实按使用与时间衰减（艾宾浩斯式热度），但可信度不随时间变。你说过的长期要求会被自动识别成候选（永不自动采纳），互相冲突的两条会并排留着。附带出处的历史检索，以及只存词元的倒排索引。'
