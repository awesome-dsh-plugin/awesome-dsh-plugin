url: https://github.com/yjnmedia/dsh-skill-order
name: yjnmedia/dsh-skill-order
category: skill
description:
  en: 'Sorts your DSH skills from the settings page: drag rows into the order you want and the plugin rewrites each skill directory name plus the name field in its SKILL.md, so the slash menu follows that order. One icon moves any row straight to position 1, another edits a skill name in place, and rows whose description runs past 20 Chinese characters are flagged before you apply. After a rename it clears the host skill cache and notifies every session, so new names and order show up in the slash menu without restarting DSH; a background fingerprint check every 2 seconds also picks up skills that other tools create, rename or delete. Local-only and offline: it reads and writes only the DSH skills directory and the superpowers skills directory.'
  zh: '在设置页给技能排序：把行拖成要的顺序，应用后插件同步改写每个技能的目录名与 SKILL.md 里的 name，斜杠菜单就按这个顺序排。行尾一个小图标把任意技能直接移到第 1 位，另一个在行内改技能名；简介超过 20 个汉字的行会在应用前标黄提醒。改完清掉宿主技能缓存并通知每个会话，斜杠菜单不用重启 DSH 就能看到新名字与新顺序；后台每 2 秒比对一次技能目录指纹，别的工具新建、改名或删除技能也会自动跟上。纯本地离线运行，只读写 DSH 技能目录与 superpowers 技能目录。'
