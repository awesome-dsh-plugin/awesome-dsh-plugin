url: https://github.com/gem-gti/dsh-scrcpy-mirror
name: gem-gti/dsh-scrcpy-mirror
category: tools
description:
  en: Mirrors an Android phone screen to a Windows PC over USB or Wi-Fi with scrcpy, and exposes start, stop, status, reconnect and screenshot as an agent tool and a /mirror command.
  zh: 用 scrcpy 把安卓手机画面投到 Windows 电脑（USB 或无线），并把启动、停止、状态、重连、截图暴露为智能体工具与 /mirror 命令。
