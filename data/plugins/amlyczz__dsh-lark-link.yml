url: https://github.com/amlyczz/dsh-lark-link
name: amlyczz/dsh-lark-link
category: notify
description:
  en: 'High-reliability Feishu/Lark bridge for DeepSeek Harness: QR one-click auth, card-based commands and intent-confirmation cards, at-least-once zero-loss outbox, media in/out, /doctor session-log ZIP, and a reusable DSH Web GUI that lands sessions in the right workspace.'
  zh: DeepSeek Harness 的高可靠飞书/Lark 桥接：扫码一键认证、卡片化命令与意图确认、at-least-once 零丢失出站队列、多媒体出入站、/doctor 会话日志 ZIP，并复用 DSH Web GUI 把会话归入正确工作区。
  ja: DeepSeek Harness 向けの高信頼な飛書/Lark ブリッジ。QR でのワンクリック認証、カード形式のコマンドと意図確認カード、少なくとも一度は必ず届く送信キュー、メディアの送受信、/doctor によるセッションログの ZIP 化に加え、セッションを正しいワークスペースに着地させる再利用可能な DSH Web GUI を備えます。
