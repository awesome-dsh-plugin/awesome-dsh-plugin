description:
  zh: "DeepSeek Harness 一键 Concise 输出风格开关：结果先行、少废话，工作深浅不变。每轮最终回答开头自动附「摘要」精华卡（划选即复制），卡内文件路径高亮可点（系统默认应用打开），卡底按本回合真实工具产出汇总交付物；按会话独立生效，headless/CLI 同样生效，支持 /concise 命令、style.md 自定义风格与本地 API。"
  en: "One-click Concise output style for DeepSeek Harness: results first, no filler, same work depth. Every final reply opens with a plain-language digest card (select text to copy); file paths inside the card are highlighted and click-to-open with the OS default app, and a deliverables zone lists the files the turn actually produced from real tool outputs. Scoped per session, works in headless/CLI too, with /concise command, style.md overrides and a local API."
