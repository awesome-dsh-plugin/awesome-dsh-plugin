# Listing entry for the awesome-dsh-plugin marketplace.
# adding this file as data/plugins/LR611415__visionforge.yml (owner and repo names
# Fork note: this project is an independent re-implementation/extension of the
# modlens concept (https://github.com/liustack/modlens). It adds image generation
# and editing (Qwen-Image / GLM-Image), a self-written bridge layer, per-engine
# settings cards and paste/recover handling, so it is not a duplicate entry.
url: https://github.com/LR611415/visionforge
name: LR611415/visionforge
category: vision
description:
  en: Vision understanding + image generation/editing for DeepSeek Harness (read images with Qwen/OpenAI/Anthropic/Gemini, generate and edit with Qwen-Image). A rework of liustack/modlens (MIT). Remove @liustack/modlens first — both register the same vision providers and image interception hooks, so co-installation breaks image reading.
  zh: 为 DeepSeek Harness 提供读图与生图/编辑能力（Qwen/OpenAI/Anthropic/Gemini 读图，Qwen-Image 生图与编辑）。基于 liustack/modlens（MIT）改造；请先卸载 @liustack/modlens——两者会注册同一批 vision provider 与图片拦截钩子，并存会导致读图失灵。
