# Listing entry for the awesome-dsh-plugin marketplace.
#
# How to submit: open a PR against https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
# adding this file as data/plugins/LR611415__visionforge.yml (owner and repo names
# must match the GitHub repository exactly). One PR may contain up to 3 entries.
# After merge, the marketplace site (https://awesome-dsh-plugin.com/plugins.json,
# regenerated by CI daily) picks it up automatically.
#
# Fork note: this project is an independent re-implementation/extension of the
# modlens concept (https://github.com/liustack/modlens). It adds image generation
# and editing (Qwen-Image / GLM-Image), a self-written bridge layer, per-engine
# settings cards and paste/recover handling, so it is not a duplicate entry.

url: https://github.com/LR611415/visionforge
name: LR611415/visionforge
category: vision
description:
  en: Vision understanding + image generation/editing for DeepSeek Harness (read images with Qwen/OpenAI/Anthropic/Gemini, generate and edit with Qwen-Image).
  zh: 为 DeepSeek Harness 提供读图与生图/编辑能力（Qwen/OpenAI/Anthropic/Gemini 读图，Qwen-Image 生图与编辑）。
