description:
  en: 'A DeepSeek Harness plugin that adds 小说模式 (Novel Mode) as a selectable entry in the session mode dropdown: an agent preset with a novel-writing persona and the standard tool set, plus 21 runtime skills and a silently materialized .dsh working copy of subagent roles, PowerShell and Python scripts, templates, config and rules for constitution, outline, design, writing, batch and validation.'
  zh: '为 DeepSeek Harness 的会话模式下拉框新增可选「小说模式」：一个带写作 persona 与标准工具集的 Agent 预设，外加 21 个运行时技能，并把子代理角色、PowerShell 与 Python 脚本、模板、配置与规则静默物化到 .dsh/ 目录，供宪法、大纲、设计、写作、批量、校验各阶段使用。'
