description:
  en: 'A DeepSeek Harness plugin that adds a 小说模式 (Novel Mode) button and a /novel command: entering the mode materializes a bundled .dsh working copy of novel-writing skills, subagent roles, PowerShell and Python scripts, templates, config and rules into the current project, then routes the model through the constitution, outline, design, writing, batch and validation stages.'
  zh: '把长篇小说写作流程接入 DeepSeek Harness：新增「小说模式」按钮与 /novel 命令，进入模式时把随包附带的技能、子代理角色、PowerShell 与 Python 脚本、模板、配置与规则物化到当前项目的 .dsh/ 目录，并按宪法、大纲、设计、写作、批量、校验各阶段引导模型。'
