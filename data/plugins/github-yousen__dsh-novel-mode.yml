description:
  en: 'From one idea to a finished, consistency-checked novel: a deterministic writing ENGINE for DeepSeek Harness, not a prompt pack. A JavaScript state machine owns 7 gated stages (constitution, outline, design, writing, validation, batch, export) plus a 15-step serial per-chapter sub-FSM; PowerShell validators decide every gate, so the model cannot skip a stage or assert a PASS. Versioned atomic checkpoints resume at the exact chapter after a restart, 9 subagent workers are evidence-adjudicated in code, and the user sees only quiet structured status: no prompt dumps, no leaked errors, zero bundled credentials.'
  zh: '一个想法到一本校验通过的小说：DeepSeek Harness 的确定性写作引擎，不是提示词包。JavaScript 状态机掌握 7 个硬门禁阶段（宪法、大纲、设计、写作、校验、批量、导出）与 15 步串行单章子状态机；门禁由 PowerShell 校验脚本裁决，模型无法跳阶段或自称 PASS。版本化原子断点可在重启后精确续写第 N 章，9 个子代理由代码按证据裁决，用户只看到安静的结构化状态：不展示提示词、不外泄错误、零内置凭据。'
