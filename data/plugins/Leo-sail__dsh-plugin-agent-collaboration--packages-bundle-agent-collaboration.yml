  en: Persistent Bots and group rooms inside DSH — each Bot keeps its own model, permission preset, workspace and session across restarts; unaddressed messages can be triaged by the room leader, the room accumulates a shared experience card, and every answer is a run in a durable ledger the sidebar panel replays.
