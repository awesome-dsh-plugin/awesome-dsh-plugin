url: https://github.com/berhbro/dsh-cyrene-theme
name: berhbro/dsh-cyrene-theme
category: theme
description:
  en: Pink-and-white frosted-glass skin for the DSH Web GUI, themed after Cyrene from Honkai Star Rail. Also rewrites the agent persona (editable from the sidebar), adds Cyrene reaction stickers, replaces the new-session hero with her, and adds a full-page background picker with enable / pick / rotate / fade. Unofficial non-commercial fan project; Cyrene and related art are (c) miHoYo / HoYoverse, not affiliated or endorsed.
  zh: 把 DSH Web GUI 换成昔涟（《崩坏：星穹铁道》）的粉白渐变毛玻璃主题，附带侧边栏可编辑的人格设定、昔涟表情包、新会话欢迎页形象，以及可开关 / 选图 / 轮换 / 调淡的整页背景图。非官方非商业同人作品；昔涟及相关美术素材版权归米哈游（miHoYo / HoYoverse）所有，与官方无隶属或背书关系。
