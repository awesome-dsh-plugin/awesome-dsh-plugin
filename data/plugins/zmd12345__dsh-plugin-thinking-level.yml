name: zmd12345/dsh-plugin-thinking-level
category: usage
description:
  en: Judges the right reasoning level locally from the current draft and recent turns and switches it in one click; warns when the context grows long and tells apart "new topic" from "same unfinished task" — less overthinking on simple tasks, enough reasoning on hard ones.
  zh: 根据当前任务和最近几轮对话在本地判断合适的推理等级，一键切换；上下文过长时按占用提醒，并区分「换个话题」和「同一件事没做完」给出不同建议：简单任务不过度思考、节省 token，复杂任务给足推理。
