description:
  en: 'Sidebar and conversation typography for the DSH desktop UI: separate Chinese, English and fallback font stacks with installed-font detection, flat font size, column scale, line height and row gap; a two-column icon-rail plus session-list layout with an optional folded rail and hover labels on rail icons; separate content-area and code fonts. Settings live in a collapsible-section panel, and a keep list excludes widgets such as the billing card from font scaling.'
  zh: 'DSH 桌面端的侧栏与对话排版：中英文字体分开设并检测本机是否安装、统一字号、整列缩放、行高行距，可排成图标列 + 会话列两栏、折叠时保留图标栏、图标悬停显示名称，另可单独设对话区与代码字体；设置面板按可折叠分组组织，排除列表里的控件（如计费卡）不跟随缩放。'
