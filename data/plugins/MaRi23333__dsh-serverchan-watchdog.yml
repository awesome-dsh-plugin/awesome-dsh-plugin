description:
  en: 'Unofficial host-side ServerChan notifications for DeepSeek Harness: sends mobile alerts through WeChat (ServerChan Turbo) or the ServerChan³ app when approvals, plan reviews, or questions go unanswered beyond a configurable threshold, even with the browser closed.'
  zh: 'DeepSeek Harness 的第三方 Server酱通知插件：在主机端监控审批、计划评审和问答，超过设定时间仍未处理时通过微信（Server酱 Turbo）或 Server酱³ App 发送手机提醒，无需保持浏览器打开。'
