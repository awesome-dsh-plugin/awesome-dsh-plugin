url: https://github.com/RestRegular/dsh-memory/tree/main/packages/dsh-memory
name: dsh-memory
category: memory
description:
  en: 'Give your agent a memory that actually sticks across sessions — and stays on your machine. Save a conclusion once (a decision, a rule, a workflow, a pitfall); it is recalled automatically on the next session and whenever a relevant task comes up, so you stop re-explaining the same background. Everything is local JSONL with lexical + optional on-device vector search (no embedding service required); the panel installs and manages the vector backend for you. Eight model tools cover saving, search, scope grants, blocking and rule-code hooks; hard rules persist in the system prompt, state memories expire on their own, and superseded conclusions are corrected rather than silently overwritten. A visual panel with tree, 2D and 3D memory graphs makes the memory browsable and editable.'
  zh: '让 Agent 真正记得住——而且只记在本机。结论（决策、规则、流程、踩坑）存一次，下次会话和遇到相关任务时自动召回，不再反复解释同样的背景。全部落地为本地 JSONL，词法检索开箱即用，需要语义检索时可在面板一键装本机向量后端，不联网也能工作。八个模型工具覆盖保存、检索、作用域授权、主动屏蔽与规则代码校验；硬性规则常驻系统提示、临时状态到点自动失效、过时结论用修正链更新而不是悄悄覆盖。可视化面板带记忆树 / 2D / 3D 星图，记忆看得见也改得动。'
