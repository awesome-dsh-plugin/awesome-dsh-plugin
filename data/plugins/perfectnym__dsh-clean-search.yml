name: perfectnym/dsh-clean-search
category: browser
description:
  en: 'Ad-free search home for DSH: official-site-first results with advertisement demotion, company official sites pinned first with stock charts right after (A-share/HK/US), special phone numbers such as 110/12306/95588, weather, and reverse image search. Includes search history, a 6-hour result cache, reader mode and ranking-weight sliders.'
  zh: 'DSH 里的无广告搜索首页：搜索结果官网优先、竞价广告降权；有行情的公司（A 股/港股/美股）官网固定第一条、行情图表紧随其后；支持特殊号码（110/12306/95588）、天气、以图搜图；带搜索历史、结果缓存、阅读模式与排序权重滑杆。'
