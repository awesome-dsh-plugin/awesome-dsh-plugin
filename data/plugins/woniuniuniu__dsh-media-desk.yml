url: https://github.com/woniuniuniu/dsh-media-desk
name: woniuniuniu/dsh-media-desk
category: workflow
description:
  en: 'Content-creator workbench: capture ideas in one line, then turn an idea into a finished piece with a title, a script or article, a cover, illustrations and storyboard frames. Also covers scheduling, stats review from manual entry, CSV or imported account data, and reusable writing styles.'
  zh: 自媒体工作台：一句话记灵感，一键把灵感做成成稿，包括标题、口播脚本或文章、封面、配图和分镜；还有排期、数据复盘（手动录入、CSV 或导入账号数据）和可复用的写作风格。
