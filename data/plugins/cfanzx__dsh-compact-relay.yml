url: https://github.com/cfanzx/dsh-compact-relay
name: cfanzx/dsh-compact-relay
category: session
description:
  zh: 'DeepSeek Harness 输入框上下文状态指示器：按压缩评估状态分段着色，标识建议压缩点、锁定消息位置与 DSH 原生自动压缩线（越线红闪告警）。支持预览后确认压缩（/bc）、生成九段式交接单并自动切换至新会话（/handoff）、锁定消息防压缩（/pin）。可在「设置 → 压缩接力」中配置阈值、配色、原生自动压缩开关，并查看图例与重播首次引导。'
  en: 'Context indicator for the DeepSeek Harness composer. Displays segmented session occupancy, compression points, pinned messages, and the native auto-compaction line (flashes red when crossed). Supports preview-then-confirm compaction (/bc), 9-section session handoff (/handoff), and message pinning (/pin). Configurable thresholds, colors, native auto-compaction toggle, legend, and onboarding replay in Settings → 压缩接力.'
