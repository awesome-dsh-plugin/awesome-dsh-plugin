url: https://github.com/sensen-jo/dsh-plugin-goal-map
name: sensen-jo/dsh-plugin-goal-map
category: session
description:
  en: Goal Map shows a read-only goal-to-plan progress route, session mindmap and step list using reported plan progress, without starting tasks or model calls. For DSH Web 0.2.0-rc.2 only, with Node.js >=24.
  zh: 目标进展图以只读流程图展示目标到计划的进展路线、会话思维导图与步骤列表，按已报告计划计算进度，不启动任务或模型调用。仅支持 DSH Web 0.2.0-rc.2、Node.js >=24。
