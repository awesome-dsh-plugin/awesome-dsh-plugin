name: lispking/dsh-qq-skin
category: theme
description:
  en: "A QQ NT messenger skin for DeepSeek Harness: light and dark share one QQ NT language — clean restrained light mode (brand blue #12B7F5, light-blue bubbles) and a calm blue-gray dark mode (#101822) — applied as reversible token and layout layers that never touch your Light/Dark preference."
  zh: "为 DeepSeek Harness 打造的 QQ NT 皮肤：浅色与深色共用一套 QQ NT 语言——浅色干净克制（品牌蓝 #12B7F5、浅蓝气泡），深色为沉稳蓝灰（#101822）——以可逆的 token 与布局两层实现，不改变你的浅色/深色偏好。"
