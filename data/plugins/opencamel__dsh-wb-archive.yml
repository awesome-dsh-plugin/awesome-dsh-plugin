category: tools
tarball: https://github.com/opencamel/dsh-wb-archive/releases/download/v0.1.0/dsh-wb-archive-0.1.0.tgz
description:
  en: 'A wb_archive tool that turns a single Weibo post link (m.weibo.cn/status/...) into a permanent Markdown snapshot via the 2100laike archive service: long posts are fetched in full, images are re-hosted so they never break, snapshots survive post deletion, and resubmits dedup-hit and return the latest version without spending quota.'
  zh: 'wb_archive 工具：把微博单条链接（m.weibo.cn/status/…）经 2100laike 存档服务转成永久 Markdown 快照——长文取全文、图片转存不裂链、删博后仍可读、重复提交去重秒回不耗额度。'
