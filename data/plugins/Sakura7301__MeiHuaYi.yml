description:
  en: 'Meihua Yishu (plum-blossom) divination for DSH: cast a hexagram from chat or the panel by time, number, character or manual method; read primary, mutual and changed hexagrams, moving line and body/use relations; keep a local journal of readings, omens and study notes.'
  zh: '梅花易数卜卦插件：在聊天里或面板上按时间、数字、一字占、手动指定四种方式起卦，输出主卦、互卦、变卦、动爻与体用生克，并把卦例、外应与学习笔记保存在本机。'
