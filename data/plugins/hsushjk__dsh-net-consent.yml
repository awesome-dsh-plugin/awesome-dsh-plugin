url: https://github.com/hsushjk/dsh-net-consent
name: hsushjk/dsh-net-consent
category: security
description:
  en: 'Gates the session''s own network access behind a consent card: web tools and shell network verbs are allowed once, allowed for the session, or denied, with tool / command / domain / IP allowlists and an audit log. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '会话自身联网的审批闸门：网页工具与命令行联网动作按「放行一次 / 本会话放行 / 拒绝」处理，支持工具 / 命令 / 域名 / IP 白名单与审计日志。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
