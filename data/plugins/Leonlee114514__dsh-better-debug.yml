name: Leonlee114514/dsh-better-debug
category: dev
description:
  en: 'Appends one short user message before the next step when the model is circling: the same path edited three times with no measurement in between, the same normalised tool error returned twice, or two steps since the last write with neither a verify nor a search. A verify clears the edit streak, so convergence that measures every step does not count as circling; after a present call the gate sleeps until the next write. Verification comes from four tool names (`ops_bash`, `lsp_diagnostics`, `verify`, `run_tests`) and searching from eight; each signal fires once per turn, only after a new write or error, and never in subagent sessions. Ships the `stuck-gate` skill at bundled rank 600 (a user-level copy at 400 overrides its wording) plus a read-only gain panel at `/better-debug` counting firings, sessions covered and whether the next tool call changed class. It does not estimate tokens saved.'
  zh: '模型打转时，在下一步之前追加一条简短用户消息：同一路径在两次测量之间连续改了三次、归一化后的同一工具报错第二次出现、或最后一次写入后过了两步却既没验证也没搜。一次测量会把连续编辑计数清零，所以每步都有测量的收敛不算打转；`present` 交付后闸门休眠到下一次写入。验证按四个工具名识别（`ops_bash`、`lsp_diagnostics`、`verify`、`run_tests`），搜索按八个识别；每条信号每回合最多一次、必须出现新的写入或报错，子会话跳过。自带 `stuck-gate` 技能（bundled rank 600，用户级 400 的同名技能可覆盖措辞），并附只读增益面板 `/better-debug`：数触发次数、覆盖会话、下一条工具调用是否换了类别。不估算省下的 token。'
