name: Leonlee114514/dsh-better-debug
category: dev
description:
  en: 'Appends one short user message before the next step when the model is circling: the same absolute path written three times with no measurement landing in between, the same error episode (tool, target and normalised fingerprint) returning twice, or a write followed by two steps with no measurement — the last one only arms, and the message lands before the next write rather than interrupting reading. A measurement has two states: intent is judged from the tool arguments at call time, and the write streak is cleared only when the result comes back, only for that command directory. A failed test still counts, because it yields the line that is wrong. Hard measurements are `lsp_diagnostics`, `verify`, `run_tests` and `run_test`; `ops_bash`, `bash`, `shell` and `pwsh` count only when the command matches a measurement pattern, so `ls` no longer launders a blind edit streak. Signals fire once per episode, re-arm after a real measurement, and are capped per turn; a successful `present` sleeps the gate until the next write, and subagent sessions are skipped. Generated paths (build output, lock files, logs) are excluded. Error targets are read out of real `file:///` ESM stacks, so two different files never collapse into one episode, and `cd <dir> && cmd` counts as a measurement of that directory rather than its parent. Ships the `stuck-gate` skill at bundled rank 600 (a user-level copy at 400 overrides its wording) plus a read-only observation panel at `/better-debug` reporting firings, sessions covered, the first action after each message across six classes, and how many measurement loops actually closed. The log defaults to `$DSH_HOME/logs/better-debug.log` and is created on first write, so the panel has data right after install. Optional host services are subscribed dynamically, so a host without them still loads the gate. It does not estimate tokens saved, and it does not claim the message caused the change. The panel banner counts only the failures after the most recent load (`log.current`), so one old mount failure no longer reads as "currently disabled".'
  zh: 模型打转时，在下一步之前追加一条简短用户消息：同一绝对路径连续写了三次而中间没有任何测量落地、同一个错误 episode（工具、目标、归一化指纹）第二次出现、或一次写入后过了两步仍无测量——第三种只先上膛，消息在**下一次写入之前**才落，不打断阅读。测量拆成两态：调用时按工具参数判意图，结果回来了才清零，且只清与该命令目录相关的文件。失败的测试同样算测量，因为它给出了错在哪一行。硬测量是 `lsp_diagnostics`、`verify`、`run_tests`、`run_test`；`ops_bash`、`bash`、`shell`、`pwsh` 只有命令命中测量模式才算，所以 `ls` 不再能洗白盲改计数。每条信号每个 episode 一次，真测量后重新武装，每回合有总预算；`present` 成功后闸门休眠到下一次写入；子会话跳过。生成物（构建产物、锁文件、日志）不计入；错误目标能从真实的 `file:///` ESM 栈里读出来，两个不同文件不会塌成同一个 episode；`cd <目录> && 命令` 算那个目录的测量，不再算成它的父目录。自带 `stuck-gate` 技能（bundled rank 600，用户级 400 的同名技能可覆盖措辞），并附只读观测面板 `/better-debug`：数触发次数、覆盖会话、每条消息之后第一个动作的六类分布、以及真正闭合的测量回路数量。日志默认写 `$DSH_HOME/logs/better-debug.log` 并在首次写入时创建，装完面板就有数据。可选宿主服务走动态订阅，缺少它们的宿主也能正常加载。不估算省下的 token，也不声称这条消息导致了改变。面板横幅只数最近一次加载之后的失败（`log.current`），历史里挂过一次不会再显示成「当前被关闭」。
