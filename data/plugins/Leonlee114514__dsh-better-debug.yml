name: Leonlee114514/dsh-better-debug
category: dev
description:
  en: 'Appends one short user message before the next step when the model is circling: the same absolute path written three times with no measurement landing in between, the same error episode (tool, target and normalised fingerprint) returning twice, or a write followed by two steps with no measurement — the last one only arms, and the message lands before the next write rather than interrupting reading. A measurement has two states: intent is judged from the tool arguments at call time, and the write streak is cleared only when the result comes back, only for that command directory. A failed test still counts, because it yields the line that is wrong. Hard measurements are `lsp_diagnostics`, `verify`, `run_tests` and `run_test`; `ops_bash`, `bash`, `shell` and `pwsh` count only when the command matches a measurement pattern, so `ls` no longer launders a blind edit streak. Signals fire once per episode, re-arm after a real measurement, and are capped per turn; a successful `present` sleeps the gate until the next write, and subagent sessions are skipped. Generated paths (build output, lock files, logs) are excluded. Error targets are read out of real `file:///` ESM stacks, so two different files never collapse into one episode, and `cd <dir> && cmd` counts as a measurement of that directory rather than its parent. Ships the `stuck-gate` skill at bundled rank 600 (a user-level copy at 400 overrides its wording) plus a read-only observation panel at `/better-debug` reporting firings, sessions covered, the first action after each message across six classes, and how many measurement loops actually closed. The log defaults to `$DSH_HOME/logs/better-debug.log` and is created on first write, so the panel has data right after install. Optional host services are subscribed dynamically, so a host without them still loads the gate. It does not estimate tokens saved, and it does not claim the message caused the change. The panel banner counts only the failures after the most recent load (`log.current`), so one old mount failure no longer reads as "currently disabled". Test suites wait for log conditions instead of fixed delays (test-only change in 0.2.5). The panel carries its own light and dark palettes and reads the host document to pick one, so it follows the app theme inside an iframe instead of falling back to a dark one. Its HTTP routes have no DSH access check, so a web page open in your browser could call them. 0.3.1 makes the strategy-layer judgements hold on healthy work: the patch chain compares the set of failing sites instead of only counting rounds, so sweeping a shrinking lint backlog or fixing independent files one by one no longer reads as a chain, and a wording that drifted from the evidence is gone; error targets are read from ten compiler dialects (tsc, cargo, pytest, go, webpack, mypy, C# and Windows backslash paths) instead of ESM stacks alone, so unrelated projects never share a family, and an error with no readable path is left out of family accounting rather than pooled into one anonymous family; oscillation muting is per loop, so one loop going quiet no longer re-arms another; and a search only immunizes the fingerprints that existed before it. Seven counter-examples were added first and each failed on 0.3.0 before passing here. 0.3.2 closes the six state-machine gaps a deep review found in 0.3.1. A failed measurement (`isError:false`, non-zero exit) now gets its own repeat episode, so one identical failure unchanged for eight rounds is no longer complete silence; those episodes only accumulate on consecutive failures, because `fail → green → same fail` is an oscillation and belongs to O. Search immunity became a count baseline instead of a lifetime exemption. The patch chain clears on an unchanged failure set rather than merely pausing, and `movedSite` compares against every target seen this turn, so `A→B→A→B` no longer resets the chain each round. Oscillation identity is the failure-item set, so an unrelated warning line no longer hides the same failure. M moved ahead of the generic idempotence early-return — the moment it is most needed (reminded, then no writes and no new errors) was exactly what the idempotence check swallowed. Test count 73 → 79. 0.3.3 closes four defects a second deep review found in 0.3.2. Failure identity was treating source positions as semantic: the fingerprint covered the whole "path + location + message" line, so editing one line turned the same error into a new one and broke both the patch chain and the shrink test. It is now structured — the path and the locator that immediately follows it are cut away, the remaining message is fingerprinted, and numbers inside the message stay semantic, because `case-1` and `case-2` must not merge. Python frames were being read as the failure itself: only JS `at ...` lines were excluded, so two different assertions sharing a frame collapsed into one failure and healthy TDD was read as oscillation. Frames now contribute the target only, the exception message is always merged into the set, and the echoed source line under a frame is recognised structurally and skipped. O compared whole-set equality, so `{A}→{A,B}→{A,C}` never fired; it now keeps the last four failure sets and treats an item intersection as a recurrence. Failed measurements did not advance the idempotence state, so the second reminder in `fail → remind → fail to threshold` was swallowed as "nothing changed" — a monotonic `failSeq` now moves on every recorded failure. Test count 79 → 89. Third review (0.3.4) fixed five parse-layer defects that all came from the same gap: the previous rounds kept adding one regex per observed shape instead of classifying the line first. A bare filename in the repository root (`a.ts(12,9)`) yielded no target, so a one-line shift produced a brand-new failure; absolute paths were truncated at the first space (`C:/work/My Project/src/a.ts` became `c:/work/my`); webpack''s space-separated location range (`./src/index.js 5:0-20`) was not stripped; any line carrying a path joined the failure set, so an ESLint `warning` whose variable name changed every round made P report "another failure repaired" while the error was byte-identical; and pytest''s `> assert ...` source echo became a shared item, making O read healthy TDD as "the old failure is back". Lines are now classified before they may join the set: only `error` counts, frames contribute a target only, the `E` line is the diagnostic itself, `>`/`<` and indented lines inside a frame block are echoes, and warning columns and aggregate summaries never enter. The severity test looks only at the leading column, never at the body, so a real `AssertionError: warning total mismatch` still counts. Test count 89 -> 102 with a 13-assertion group covering bare filenames, spaced paths (plus the reverse case that an error message following a path must not be swallowed into the target), webpack locators, ESLint warnings both ways, and pytest echoes; against 0.3.3 these are red 9 of 102.'
  zh: '模型打转时，在下一步之前追加一条简短用户消息：同一绝对路径连续写了三次而中间没有任何测量落地、同一个错误 episode（工具、目标、归一化指纹）第二次出现、或一次写入后过了两步仍无测量——第三种只先上膛，消息在**下一次写入之前**才落，不打断阅读。测量拆成两态：调用时按工具参数判意图，结果回来了才清零，且只清与该命令目录相关的文件。失败的测试同样算测量，因为它给出了错在哪一行。硬测量是 `lsp_diagnostics`、`verify`、`run_tests`、`run_test`；`ops_bash`、`bash`、`shell`、`pwsh` 只有命令命中测量模式才算，所以 `ls` 不再能洗白盲改计数。每条信号每个 episode 一次，真测量后重新武装，每回合有总预算；`present` 成功后闸门休眠到下一次写入；子会话跳过。生成物（构建产物、锁文件、日志）不计入；错误目标能从真实的 `file:///` ESM 栈里读出来，两个不同文件不会塌成同一个 episode；`cd <目录> && 命令` 算那个目录的测量，不再算成它的父目录。自带 `stuck-gate` 技能（bundled rank 600，用户级 400 的同名技能可覆盖措辞），并附只读观测面板 `/better-debug`：数触发次数、覆盖会话、每条消息之后第一个动作的六类分布、以及真正闭合的测量回路数量。日志默认写 `$DSH_HOME/logs/better-debug.log` 并在首次写入时创建，装完面板就有数据。可选宿主服务走动态订阅，缺少它们的宿主也能正常加载。不估算省下的 token，也不声称这条消息导致了改变。面板横幅只数最近一次加载之后的失败（`log.current`），历史里挂过一次不会再显示成「当前被关闭」。测试读日志改成等条件、不等固定时长（0.2.5 只有测试改动，行为不变）。 面板自带亮/暗两套调色板，并读宿主文档来选，因此在 iframe 里也能跟随应用主题，不会退回深色。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。0.3.1 让方案层三条判据在健康的工作上不再误报：补丁链改成比较**失败条目集合**而不是只数轮次，所以「lint 一批错越修越少」和「逐个修互不相干的文件」都不再算成补丁链，同时删掉了与证据不符的那句措辞；错误目标改为认十种编译器方言（tsc、cargo、pytest、go、webpack、mypy、C# 与 Windows 反斜杠路径），不再只认 ESM 栈，所以不相干的项目永远不会落进同一族，而读不出路径的报错直接不进族、不再汇成一个匿名族；振荡的静音按回路记，一条回路安静下来不会再重新武装另一条；搜索只对搜索之前出现的指纹免疫。七条反例先写、在 0.3.0 上全部失败，修复后才通过。 0.3.2 补上深审在 0.3.1 里查出的六处状态机缺口。失败的测量（`isError:false`、退出码非零）现在单独记重复 episode，于是「同一个失败一字未变地重复八轮」不再全程沉默；这类 episode 只在连续失败时累加，因为「失败→绿→同一失败」是振荡、归 O 管。搜索免疫改成计数基线，不再是一次搜索终生免责。补丁链在失败集合一字未变时清零而不只是暂停，`movedSite` 改比本 turn 见过的所有目标，`A→B→A→B` 不再每轮清零。振荡的身份改用失败条目集合，一行无关 warning 不再把同一失败藏起来。M 移到通用幂等提前返回之前——它最该说话的时刻（提醒过、随后既没写入也没新错误）恰好被幂等闸吞掉。用例数 73 → 79。 0.3.3 修掉第二轮深审在 0.3.2 上找出的四个缺陷。失败身份把源位置当成了语义：指纹覆盖「路径 + 位置 + 消息」整行，编辑一行就让同一个错误变成新错误，补丁链与收缩判断同时失真；现在改成结构化——先切掉路径与紧跟其后的位置，剩余消息再取指纹，消息里的数字保留语义，因为 `case-1` 与 `case-2` 绝不能合并。Python 栈帧被当成了失败本体：原先只排除 JS 的 `at ...` 行，两个不同断言共用栈帧就塌成同一条失败，健康 TDD 反过来被判成振荡；现在栈帧只贡献目标，异常消息一律并入集合，紧跟栈帧的源码回显行按结构识别并跳过。O 比较整集合相等，于是 `{A}→{A,B}→{A,C}` 永远不响；现在保留最近四次失败集合，条目有交集即算复发。失败测量不推进幂等状态，`失败 → 提醒 → 再失败到阈值` 里的第二次提醒被当成「什么都没变」挡掉；新增单调 `failSeq`。用例数 79 → 89。 第三轮深审（0.3.4）修掉五处解析层缺陷，它们出自同一个缺口：前两轮一直在给具体形态补正则，而没有先给行分类。根目录裸文件名 `a.ts(12,9)` 抽不出目标，行号一漂就成了新失败；绝对路径遇空格被截断（`C:/work/My Project/src/a.ts` 变成 `c:/work/my`）；webpack 的空格分隔位置范围 `./src/index.js 5:0-20` 没被剥掉；任何含路径的行都进失败集合，于是 ESLint 的 warning 变量名每轮在变、错误本身一字未动，P 却说「修出了下一个错误」；pytest 的 `> assert …` 源码回显成了公共条目，O 因此把健康 TDD 读成「旧失败回来了」。现在一行先分类再决定是否进集合：只有 error 算失败，栈帧只贡献目标，`E` 行是诊断本体，`>`/`<` 与栈帧块内的缩进行是回显，warning 列与聚合汇总一律不进；严重级别只看行首那一列、不看正文，所以 `AssertionError: warning total mismatch` 这种真失败仍然算数。用例 89 → 102，新增 13 条覆盖裸文件名、带空格路径（含反例：路径后的错误消息不得被吃进目标）、webpack 位置、ESLint warning 正反两面、pytest 回显；这组在 0.3.3 上红 9 条。'
