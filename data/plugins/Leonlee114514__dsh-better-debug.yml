name: Leonlee114514/dsh-better-debug
category: dev
description:
  en: 'Counts three measurable signs of circling — the same absolute file path written three times, the same normalised tool error returned twice, or two steps since the last write with neither a verify nor a search — and appends one short user message before the next step asking for a red-capable feedback loop, a search on the exact error, and one variable at a time. Verification is recognised from four tool names (`ops_bash`, `lsp_diagnostics`, `verify`, `run_tests`), searching from eight (`web_search`, `research`, `advanced_search`, `multi_search`, `platform_search`, `domain_search`, `cache_search`, `video_search`). Each signal fires at most once per turn and only after a new write or error, is silenced for the whole turn when the user says not to search, and is skipped in subagent sessions. Ships the `stuck-gate` skill through `inject: ["skills"]` at bundled rank 600, so your own copy at user rank 400 overrides its wording without touching code. Also ships a read-only gain panel at `/better-debug` (and in Settings): firings, sessions covered and the signal mix are counted line by line from the log, and an `outcome` line records which of four classes the next tool call fell into after each reminder, so "did the model change course" is measured rather than estimated. It deliberately does not estimate tokens saved.'
  zh: '统计三种可测量的打转迹象——同一绝对路径被写第三次、归一化后的同一工具报错第二次出现、最后一次写入后过了两步却既没验证也没搜——并在下一步之前追加一条简短的用户消息，要求先建一条能变红的反馈回路、用报错原文搜一次、一次只动一个变量。验证类按四个工具名识别（`ops_bash`、`lsp_diagnostics`、`verify`、`run_tests`），搜索类按八个识别（`web_search`、`research`、`advanced_search`、`multi_search`、`platform_search`、`domain_search`、`cache_search`、`video_search`）。每条信号每回合最多触发一次且必须出现新的写入或报错，用户说别搜时整回合静音，子会话跳过。通过 `inject: ["skills"]` 以 bundled rank 600 附带 `stuck-gate` 技能，因此你自己放在用户级 rank 400 的同名技能可在不改代码的情况下替换其措辞。另自带一块只读增益面板（`/better-debug`，也出现在设置页）：触发次数、覆盖会话与信号分布逐行数自日志，并用一行 `outcome` 记录每次提醒之后那条工具调用落在四个分类中的哪一类，所以「模型有没有换动作」是数出来的而不是估的。它刻意不估算省下的 token 数。'
