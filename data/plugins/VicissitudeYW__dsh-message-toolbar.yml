url: https://github.com/VicissitudeYW/dsh-message-toolbar
name: VicissitudeYW/dsh-message-toolbar
category: ui
description:
  en: 'Adds a chat toolbar for in-session regeneration with the same or a different model, continuing from a chosen answer, message editing and deletion, and bilingual translation. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '为对话添加消息工具栏，支持在当前会话内使用原模型或其他模型重答、选择历史回答继续对话、编辑或删除消息，以及双语翻译。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
