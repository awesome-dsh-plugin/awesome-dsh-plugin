url: https://github.com/kiligzzz/dsh-agent-dispatch
name: kiligzzz/dsh-agent-dispatch
category: tools
description:
  en: 'User-defined agents with automatic routing, model failover, and squad orchestration for DeepSeek Harness. Ships eight model tools (agent_dispatch / agent_followup / agent_list / agent_squad / agent_squad_continue / agent_squad_upsert / agent_import_skill / agent_upsert), checkpoint pausing for per-stage confirmation in squads (agent_squad returns paused:true; resume with agent_squad_continue), a native right-tab main panel (Overview / Agents / Squads / History), a floating action ball, and a / trigger Agent menu. No built-in agents — create your own via the panel, import them from skills, or upsert them programmatically without restarting. Subagent lifecycle events are wired for real outcome tracking; dispatches.jsonl rotates at 2000 lines.'
  zh: 'DeepSeek Harness 用户自定义 agent + 自动路由 + 小队编排插件。提供八个模型工具（agent_dispatch / agent_followup / agent_list / agent_squad / agent_squad_continue / agent_squad_upsert / agent_import_skill / agent_upsert），小队支持 checkpoint 停等（某步骤产出后 agent_squad 返回 paused:true，用户确认后 agent_squad_continue 续跑，适配「每阶段产出停等确认」流程），原生右 tab「Agent 调度」主面板（总览 / Agent / 小队 / 历史），悬浮活动球，`/` 触发器 Agent 候选菜单。不含内置 agent——可通过面板自建、从 skill 导入，或用 agent_upsert 工具免重启增改。订阅 subagent/end 事件补全真实结局，决策日志 2000 行自动轮转。'
