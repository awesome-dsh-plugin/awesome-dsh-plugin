description:
  en: 'User-defined agents with automatic routing, model failover, and squad orchestration: five model tools (agent_dispatch / agent_followup / agent_list / agent_squad / agent_import_skill), no built-in agents, a native right-tab panel (Overview / Agents / Squads / History), and a floating action ball with eight color tones.'
  zh: '自定义 Agent + 自动路由 + 小队编排：五个模型工具（agent_dispatch / agent_followup / agent_list / agent_squad / agent_import_skill），无内置 Agent，原生右 tab 主面板（总览 / Agent / 小队 / 历史）与八种色调悬浮活动球。'
