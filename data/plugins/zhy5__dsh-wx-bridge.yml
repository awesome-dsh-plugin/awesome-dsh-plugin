url: https://github.com/zhy5/dsh-wx-bridge
name: zhy5/dsh-wx-bridge
category: remote
description:
  en: 'Drive your local DSH from WeChat: a self-hosted iLink bridge over a persistent ACP session (context lives in DSH and is resumable), phone conversations grouped into the desktop workspace, with image recognition, file messages (Excel/Word/PDF, parsed by the agent itself) and voice transcripts. Tool approvals are pushed to WeChat as a card - reply approve/reject to answer them, so the channel defaults to workspace-write instead of full access. Agents can push messages back to your phone on their own via a bundled CLI, and the bridge ships with its own keeper (single-instance lock, heartbeat, tree-detached self-heal). Access defaults to strict (only registered devices are served).'
  zh: '手机微信驱动本机 DSH：自建 iLink 桥 + 常驻 ACP 原生会话（上下文归 DSH、可 resume），手机会话自动登记进桌面工作区；支持图片识别、直接发文件（Excel/Word/PDF，由会话里的 agent 自行解析）与语音转写。工具审批以卡片形式推到微信，回「批准 / 拒绝」即可应答——因此手机通道默认权限预设是 workspace-write 而非完全访问。内置 CLI 让会话里的 agent 主动往你手机推消息；桥自带 keeper（单实例锁 + 心跳判活 + 脱树自愈）。准入默认 strict（只服务已登记设备）。'
