name: 2869949486/dsh-opencode-quota-router
category: model
description:
  en: "Routes DeepSeek models in dsh through an OpenCode Go subscription and falls back to the DeepSeek account per model when that model's allowance runs out; a plan-wide fallback covers bad credentials."
  zh: "让 dsh 里的 DeepSeek 模型优先走 OpenCode Go 套餐额度，额度耗尽时只把该模型切回 DeepSeek 账户，其它模型继续用套餐；凭证异常等整体失败时整体回退。"
