url: https://github.com/ccfeeling/dsh-host-file-explorer
name: ccfeeling/dsh-host-file-explorer
category: ui
description:
  en: 'Left-sidebar panel that browses the filesystem of the machine the Harness runs on: directory listings with sizes and modification times, a summary of the open folder (files, folders, total size, largest file types), text and image previews, file downloads, file uploads by file picker or drag and drop, folder creation, and exporting a listing as CSV or JSON. The panel speaks twelve languages. Reads and writes run with the privileges of the account that runs the Harness.'
  zh: '左侧边栏面板，浏览运行 Harness 的宿主机文件系统：带大小与修改时间的目录列表、当前目录摘要（文件数、文件夹数、总大小、占用最多的文件类型）、文本与图片预览、文件下载、以选择文件或拖拽方式上传文件、新建文件夹，以及把目录列表导出为 CSV 或 JSON。面板支持十二种语言。读写操作使用运行 Harness 的账户权限。'
icon: https://raw.githubusercontent.com/ccfeeling/dsh-host-file-explorer/main/assets/icon-180.png
