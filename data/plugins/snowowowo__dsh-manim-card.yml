url: https://github.com/snowowowo/dsh-manim-card
name: snowowowo/dsh-manim-card
category: ui
description:
  en: Adds a manim_card tool that renders Manim Python into a playable animation card in the chat stream; the code runs in the browser on a bundled runtime, so no local Python is needed, and video export goes through the local Manim CLI when installed or frame by frame in the browser otherwise.
  zh: 新增 manim_card 工具，把 Manim Python 渲染为聊天流中可播放的动画卡片；代码经随包分发的运行时在浏览器内执行，本机无需安装 Python；导出视频时，本机装了 Manim 就走 CLI 渲染，否则在浏览器内逐帧导出。
