url: https://github.com/weiplwei/DeepSeek-chan-sleep-shutdown
name: weiplwei/DeepSeek-chan-sleep-shutdown
category: workflow
description:
  en: 'Windows only: a night-and-moon themed floating button (a sleepy DeepSeek-chan whale mascot, awake/sleeping artwork) in the bottom-right corner arms the plugin — click it to power the machine off once every root Agent session has gone idle, and click it again to disarm. The button is draggable (position remembered in localStorage), automatically dodges other plugins'' corner popups, and survives the frontend re-rendering it away. When the batch finishes a 60 s cancellable countdown starts (configurable 10–600 s) with the remaining seconds on the button and a matching banner: clicking Cancel runs shutdown /a and disarms the mode, and any new session starting during the countdown aborts it. A right-click menu on the button switches the shutdown condition between only-on-success and shutdown-regardless, persisted across restarts in $DSH_HOME/deepseek-chan-sleep-shutdown.json. Zero runtime dependencies.'
  zh: '仅 Windows：右下角一枚深夜月亮主题的悬浮按钮（会打瞌睡的 DeepSeek-chan 鲸鱼娘形象，清醒/睡觉两套图），点一下即开启——当所有 root 会话全部空闲后自动关机，再点一下关闭。按钮可拖动（位置记在 localStorage），会自动避让其他插件的角落弹窗，前端重渲染把它冲掉也会自动挂回。批次结束后进入 60 秒可取消倒计时（可设 10–600 秒），按钮上显示剩余秒数并弹出同款横幅：点「取消关机」执行 shutdown /a 并退出模式，倒计时期间任何新会话启动也会中止。按钮右键可在「仅成功时关机」与「无论成败都关机」之间切换，选择持久化在 $DSH_HOME/deepseek-chan-sleep-shutdown.json，DSH 重启后保持。零运行时依赖。'
