url: https://github.com/feiertu/dsh-input-rewriter
name: feiertu/dsh-input-rewriter
category: session
description:
  en: Type normally; about two seconds after you pause, it rewrites your draft into a clearer, first-person version more likely to get a good answer, leaving pasted code, links and long text untouched, marking missing details as placeholders instead of guessing, and keeping multi-part questions numbered.
  zh: 你只管正常打字，停下约两秒，它就把你刚写的话改写成更清晰、以第一人称表达的版本，更容易得到好答案；贴进来的代码、网址、长文原样不动，缺的信息用占位符标出而不乱猜，一次问几件事也一件不漏、排好顺序。
