url: https://github.com/goodboys155/dsh-github-radar
name: goodboys155/dsh-github-radar
category: ui
description:
  en: 'Right-sidebar GitHub panel with four rising-repository lists — created within 2 days, 7 days, 30 days, and 20k+ stars still pushed — where the first three are ranked by star velocity (stars per day) rather than total stars, so repositories that gained traction fast surface above older ones with more stars. Each row shows the repository name, its own description, language, the stars-per-day rate and up to two topics, and links to the repository. A keyword search box queries the GitHub Search API directly, debounced and IME-aware so a Chinese or Japanese composition costs one request instead of one per keystroke. Reads the public GitHub Search API anonymously: no token, no login, no account, nothing else contacted. Lists cache for 30 minutes and search results for 5; outbound requests go direct first and fall back to a listening local proxy port only if direct fails.'
  zh: '右侧栏 GitHub 面板，四个升起中的仓库榜：最近 2 天新建、最近 7 天、最近 30 天，以及两万星以上且近期仍在推送的老牌项目；前三个按星标增速（星/天）而非星标总数排序，让刚起量的项目排在攒了很久的项目前面。每行显示仓库名、仓库自带描述、语言、每日涨星速度与最多两个话题，整行链接到仓库页。另有搜索框直接查 GitHub Search API，带防抖并识别输入法组词——中文或日文拼音打字过程中只发一次请求，不是每敲一个字母发一次。数据取自公开的 GitHub Search API，匿名访问：不需要 token、不需要登录、不读账号，也不访问其它任何域名。四个榜缓存 30 分钟，搜索结果缓存 5 分钟；请求优先直连，直连失败才回退到确实在监听的本机代理端口。'
icon: https://raw.githubusercontent.com/goodboys155/dsh-github-radar/main/assets/icon-180.png
