url: https://github.com/cup319/dsh-mmpl
name: cup319/dsh-mmpl
category: memory
description:
  en: 'Memory Palace MCP plugin: DuckDB vector memory, skill library, forgetting curve, and a local-server supervisor for the @cup319/mmpl MCP server. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '记忆宫殿 MCP 插件：DuckDB 向量记忆、技能库、遗忘曲线，并为 @cup319/mmpl MCP 服务器提供本地进程监督。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
