name: Lawrencezeng818/dsh-plugin-bwm-friend
category: ui
description:
  en: 'Digital-human workbench skin for the DSH web UI: an idle avatar video loops beside an embedded, unchanged native DSH conversation view, with an optional voice mode. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH Web UI 的数字人工作台外壳：空闲数字人视频在会话旁循环播放，嵌入式复用原生 DSH 视图不改动业务流，语音为可选。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
