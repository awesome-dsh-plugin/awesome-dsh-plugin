url: https://github.com/kangtsang/dsh-worktree-space
name: kangtsang/dsh-worktree-space
category: git
description:
  en: "Worktree Space: Creates an isolated workspace per task with Git worktrees for multiple repositories. Agents work in parallel without interference. On completion, it merges branches, removes worktrees, and archives documents."
  zh: "Worktree Space：为每个任务创建一个可包含多个仓库worktree的独立工作目录进行任务隔离，各Agent在自己独立的工作目录里并行工作处理任务改动互不干扰，结束任务时合并分支、移除worktree工作目录、归档文档。"
