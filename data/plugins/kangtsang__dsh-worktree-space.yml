url: https://github.com/kangtsang/dsh-worktree-space
name: kangtsang/dsh-worktree-space
category: git
description:
  en: Worktree Space gives each task its own workspace directory, with Git worktrees for one or more repositories in parallel and isolated from each other; finishing merges the branches back, removes the worktrees and files the task's documents.
  zh: Worktree Space：为每个任务建立独立的工作空间目录，多仓、跨仓并行——每个仓库各开一份 Git 工作树（worktree）互相隔离；结束任务时把各分支合并回去、移除工作树并归档任务文档。
