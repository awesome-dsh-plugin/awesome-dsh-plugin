url: https://github.com/Vncntvx/dsh-zotero
name: Vncntvx/dsh-zotero
category: tools
description:
  en: 'Let agents search, read, and cite your local Zotero library: find papers, view notes and annotations, pull evidence by question, open the source document, and generate citations.'
  zh: 让 Agent 搜索、阅读并引用本地 Zotero 文献库：找文献、查看笔记与批注、按问题取证、打开原文、生成引用。
  ja: エージェントがローカルの Zotero ライブラリを検索・閲覧・引用できるようにします。論文を探し、ノートと注釈を見て、問いに応じた根拠を取り出し、原文を開き、引用を生成します。
