  en: "Model-linked AI personas and desktop pet for DSH, with shared world lore, separate editable memories, task animations, usage statistics, optional AI diaries and idle-time diary consolidation. The native pet window is Windows x64 only; sleep consolidation spends tokens in the background. Before installing or updating, close the visible desktop pet and notification bubble by choosing Close All (全部关闭) in the context menu; otherwise, files in use may cause installation to fail."
  zh: "随 DSH 当前模型切换的 AI 角色人设与桌宠，支持共享世界观、独立可编辑记忆、任务动画、工作统计、可选 AI 日记及空闲时日记整理。原生桌宠窗口仅 Windows x64；睡眠整理会在后台调用模型并消耗 token。安装或更新前，请先关闭桌面上已显示的桌宠和提示气泡（右键菜单选择『全部关闭』），否则可能因文件占用导致安装失败。"
