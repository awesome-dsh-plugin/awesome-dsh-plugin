url: https://github.com/HighToward/dsh-skill-manager
name: HighToward/dsh-skill-manager
category: skill
description:
  en: 'Skill manager panel for DeepSeek Harness: scans the six workspace and user-level skill roots, files every skill into fifteen built-in type cards (and any types you create yourself), and lets you move a skill between types without editing its files. A model you pick writes a one-sentence Simplified Chinese description for each skill, and can draw the icon for a custom type from the type name and the skills placed in it. Also reports which skills name each other in their bodies, and checks installed versions against SkillHub and upstream git sources.'
  zh: 'DeepSeek Harness 的技能管理面板：扫描工作区与用户级共六个技能根目录，把全部技能归进十五个内置类型卡片（也可自建类型），并能在不改动技能文件的前提下把技能改归到别的类型。可选指定模型为每个技能写一句中文说明，也能根据类型名与该类型下的技能为自建类型画图标；另外给出技能之间的正文引用关系，并用 SkillHub 与上游 git 源检查已安装版本。'
icon: https://raw.githubusercontent.com/HighToward/dsh-skill-manager/main/docs/icon-256.png
