description:
  en: 'Local cross-session memory for DeepSeek Harness: plain text, zero dependencies, no vectors, no network. Injects three short cards (core / rules / state, 400/400/300 chars), plus people- and group-linked facts, a record book (subject | attribute | state), diary and auto-summaries. It also acts on its own: dated agreements come back on time, an opening table registers ''things to do later'' from chat and ignores greetings, and memos/notes carry provenance so you can tell verified facts from hearsay. Everything stays in your home directory; the plugin ships a panel, session-scoped suppression, backups and a self-check tool. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '给 DeepSeek Harness 的本地跨会话记忆，纯文本、零依赖、不调向量、不联网。每轮注入三张卡（核心／规则／状态，400／400／300 字），外加按人名提示的关系、记录册（主词｜副词｜状态）、日记与自动摘要。会主动做事：写进去的约定自动挂日期、到点播报；幕表从对话里登记「以后要做的事」，寒暄句自动屏蔽。数据全在本地家目录；条目可挂图片与音频（按内容哈希存），带面板、会话级屏蔽与删除、备份与自检工具。面板 HTTP 路由已校验来源（Host 必须回环、Origin 必须同源），浏览器里其它网页调用会被拒绝。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
