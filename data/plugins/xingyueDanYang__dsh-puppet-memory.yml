description:
  en: 'Cross-session memory for DeepSeek Harness: a three-tier store (behavior notes, deep details, session archive) plus a 600-character core card injected every step, work/companion/learning state lines, multi-person and multi-group records with visibility partitions, session-scoped suppression or deletion of memory fragments, summaries and fact candidates that can route to a separate model, and backup plus self-check tools. Data is plain text under the home directory, and entries can carry images and audio stored by content hash. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '给 DeepSeek Harness 的本地跨会话记忆，纯文本、零依赖、不调向量、不联网。每轮注入三张卡（核心／规则／状态，400／400／300 字），外加按人名提示的关系、记录册（主词｜副词｜状态）、日记与自动摘要。会主动做事：写进去的约定自动挂日期、到点播报；幕表从对话里登记「以后要做的事」，寒暄句自动屏蔽。数据全在本地家目录；条目可挂图片与音频（按内容哈希存），带面板、会话级屏蔽与删除、备份与自检工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
