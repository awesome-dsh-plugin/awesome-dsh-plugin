description:
  en: 'Simulated FX trading arena played against an algorithmic whale-chan opponent: a live canvas candlestick chart over five instruments (EUR/USD, GBP/USD, USD/JPY, gold, and Whale/TOKEN, her own coin she never shorts), selectable leverage (10x to 500x), selectable round length (90s to 500s), a timed mode that settles on equity and a goal mode where the first to reach $20M wins and any forced liquidation loses; margin, spread and a 15% maintenance line are modeled, prices are a local random walk with occasional news shocks, and nothing touches the network or real money.'
  zh: '和大肥鱼（鲸鲸）对打的 FX 模拟盘：Canvas 实时 K 线，五个品种（欧美、镑美、美日、黄金，以及鲸元/TOKEN——她自己的币，她绝不做空），可选杠杆 10x~500x、局时 90s~500s；计时赛按权益定胜负，另有「重生之久留美归来」目标模式，先摸到 2000 万赢、被强平直接输。保证金、点差、15% 维持线都有建模；行情是本地随机游走加偶发消息冲击，全程零联网、零真钱。'
