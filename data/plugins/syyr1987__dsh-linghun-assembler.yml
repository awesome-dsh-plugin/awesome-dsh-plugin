name: syyr1987/dsh-linghun-assembler
category: memory
description:
  en: 'Retrieval-side memory team for dsh-linghun: a five-step cognitive loop (judge, fetch, assemble, be judged, calibrate) carried by role-based sub-agents, combining BM25 retrieval, temporal material, and LLM assembly to inject a useful material pack into the main agent. Works with dsh-linghun.'
  zh: 'dsh-linghun 的记忆提取侧·认知循环团队：判断→捞取→组装→被判定→校准五步闭环，由判官/史官/辩手/编辑/书记角色化子智能体承载，BM25 检索 + 时序素材 + LLM 组装「有用素材包」注入主智能体。与 dsh-linghun 组合使用。'
