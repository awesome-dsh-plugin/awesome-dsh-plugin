url: https://github.com/Threadripper123/dsh-plugin-credential-vault
name: Threadripper123/dsh-plugin-credential-vault
category: security
description:
  en: 'A DPAPI-backed credential vault that keeps tokens out of sessions and logs and injects them into connectors by reference. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 凭据保险箱：加密保存 token 与密钥，按引用注入连接器，避免明文进入会话与日志。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
