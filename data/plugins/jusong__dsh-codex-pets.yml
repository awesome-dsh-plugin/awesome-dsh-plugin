description:
  en: "macOS always-on-top desktop pet for DSH Desktop: a bundled DeepSeek whale sprite with Codex-compatible skins; install many pets from codex-pets.net or import from local Codex in Settings; a recent-session ball; right-click New Session and a configurable global shortcut (default Command+Option+N) for a new-session ask box."
  zh: "DSH Desktop 的 macOS 置顶桌宠：内置 DeepSeek 鲸鱼精灵图，兼容 Codex 宠格式，可在设置页从 codex-pets.net 安装大量线上宠物或从本机 Codex 导入，脚下有最近会话球；右键「新会话」与可配置全局快捷键（默认 Command+Option+N）可打开新会话输入框。"
