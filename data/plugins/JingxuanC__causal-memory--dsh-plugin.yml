name: JingxuanC/causal-memory#dsh-plugin
category: memory
description:
  en: 'Causal memory for the agent: records decision→outcome edges in a local SQLite store, mounts 16 clean-named tools from the causal-memory MCP binary, and injects a prompt section on when to consult past lessons. Requires the causal-memory binary: pip install causal-memory, or a prebuilt binary from GitHub Releases.'
  zh: '因果记忆插件：把决策→结果的因果边存入本地 SQLite，将 causal-memory MCP 二进制的 16 个工具以干净命名挂载，并注入提示模型何时查阅过往经验的系统提示段。需要 causal-memory 二进制：pip install causal-memory，或从 GitHub Releases 下载预编译版本。'
