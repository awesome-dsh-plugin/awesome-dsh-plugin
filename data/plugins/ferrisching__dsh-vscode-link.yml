url: https://github.com/ferrisching/dsh-vscode-link
name: ferrisching/dsh-vscode-link
category: ui
description:
  en: 'Connects DeepSeek Harness to VS Code: approvals and questions answered in native notifications and QuickPick, an ide_context tool fed by the active file, diagnostics and selection, selection to composer, and a sidebar with the live transcript, workspace-scoped session picker, model and permission controls.'
  zh: '把 DSH 接进 VS Code：用原生通知与 QuickPick 回答审批和提问，ide_context 工具读取当前文件、诊断与选区，选区可插入 DSH 输入框，侧边栏提供实时转录、按工作区限定的会话列表以及模型与权限控制。'
