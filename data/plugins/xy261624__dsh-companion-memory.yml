url: https://github.com/xy261624/dsh-companion-memory
name: xy261624/dsh-companion-memory
category: memory
description:
  en: 'Long-term memory written by the character itself. A sorting plugin watches the workspace and, once conversations have been quiet past a threshold, opens its own session to run the bundled extraction script and turn the recent exchanges into memory files; a heartbeat plugin later re-opens sessions on a probability curve that rises with the time since the last exchange, with quiet hours and a random delay. Ships the memory templates, the sorting guide and the extraction script.'
  zh: '由角色自己写成的长期记忆。整理插件盯着工作区，会话静默超过阈值后自己开会话，跑包里的提取脚本，把最近的对话整理进记忆文件；心跳插件之后按概率曲线重新开会话，间隔越久概率越高，带静默时段和随机延迟。附记忆文件模板、整理流程和提取脚本。'