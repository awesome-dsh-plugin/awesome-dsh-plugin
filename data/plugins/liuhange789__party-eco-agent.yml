url: https://github.com/liuhange789/party-eco-agent
name: liuhange789/party-eco-agent
category: tools
description:
  en: 'Lightweight rule-based tools for street-level industry ecosystem work (party-building scenario): format enterprise profile cards, match supply and demand by category and quantity, normalize policy record fields (no raw-text parsing), and map grievance priority to an assignee role and estimated days. Calls no external systems.'
  zh: '面向党建引领街道产业生态场景的轻量规则工具：生成企业画像卡片、按品类与数量匹配供需、规整政策记录字段（不解析原文）、按优先级给出诉求处理人角色与预计天数；不调用任何外部系统。'
