url: https://github.com/Yituojuanjuana/dsh-skill-hub
name: Yituojuanjuana/dsh-skill-hub
category: skill
description:
  en: 'In-GUI skill hub for DeepSeek Harness that tracks per-skill call counts (day / week / total) and success rate from a local ledger, audits imported skill content at install time, detects local edits against synced source snapshots, organises skills into a restorable trash, and offers a flat project-workspace view; evolution proposals can be applied into a project workspace after manual review. It uses the same package name (dsh-skill-hub) and mount id (skill-hub) as cheshireez/dsh-skill-hub, hoshino114/dsh-skill-hub and amd47802574/dsh-skill-hub, so only one of the four can be installed.'
  zh: 'DSH Web GUI 技能中枢：基于本地账本记录每个技能的日/周/总调用量与成功率，导入时做内容安全审计，同步来源后检测本地改动，支持可恢复的回收站与项目工作区平铺视图；技能进化提案经人工审核后可落地到对应项目工作区。包名 dsh-skill-hub 和挂载 id skill-hub 与 cheshireez、hoshino114、amd47802574 三个同名项目相同，四者只能安装一个。'