description:
  en: 'Host-side control plane for DeepSeek Harness: a read-only mother, workspace essences and disposable forked dsh-Web children with stock or accelerated cores, a shared decision inbox, restart guard, audit ledger, and pre-publish/install/deploy gates. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 的宿主控制面：只读母体、元主与可丢弃的分身 dsh-Web（支持官方核或加速核）、共享决策收件箱、重启守卫、审计账本，以及发布、安装、部署前置门禁。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'