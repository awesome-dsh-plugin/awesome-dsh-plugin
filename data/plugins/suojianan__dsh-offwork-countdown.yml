url: https://github.com/suojianan/dsh-offwork-countdown
name: suojianan/dsh-offwork-countdown
category: wsl
description:
  en: 'Windows desktop companion: installs and launches a semi-transparent, always-on-top off-work countdown widget. It counts down to the configured end time, keeps counting overtime, shows rest days, remembers its position and opacity, and provides a tray menu plus Ctrl+Alt+D click-through. Windows 10/11 x64 only; the widget is a separate desktop process, not a Harness page panel. The bundled OffWorkCountdown.exe is an unsigned prebuilt .NET Framework 4.8 binary (source in source.zip) that the plugin starts when DSH loads and stops on unload. It uses the same package name as wungjyan/dsh-offwork-countdown and ZydFirst/dsh-offwork-countdown, so only one of the three can be installed in a profile.'
  zh: 'Windows 桌面伴随插件：安装后启动一个半透明、始终置顶的下班倒计时小窗。支持上下班时间、加班计时、周末休息、位置与透明度记忆、托盘菜单和 Ctrl+Alt+D 鼠标穿透；仅支持 64 位 Windows 10/11。小窗是独立的桌面进程，不是 Harness 页面内的面板。随包的 OffWorkCountdown.exe 是未签名的预构建 .NET Framework 4.8 程序（源码在 source.zip），插件在 DSH 加载时启动它、卸载时停止。与 wungjyan/dsh-offwork-countdown、ZydFirst/dsh-offwork-countdown 同包名，同一个 profile 里三者只能装一个。'
icon: https://raw.githubusercontent.com/suojianan/dsh-offwork-countdown/main/icon.png
