description:
  en: Scans the local sessions when DeepSeek Harness starts and continues the ones that ended abnormally (crash, network loss, timeout, or the app quitting), while never continuing a session the user stopped on purpose, and keeps a ledger of what it did and why.
  zh: 桌面版启动后扫描本机会话，把因崩溃、断网、超时或应用退出而异常中断的会话自动继续；用户主动停掉的会话永不继续，并留一份账目记录扫了谁、续了谁、为什么跳过。
