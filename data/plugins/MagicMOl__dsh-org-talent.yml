description:
  en: 'Organization-wide employee matching in the DSH sidebar: project progress with embedded outcomes, alerts, product acceptance and duplicate guards; editable talent profiles and drag-to-team org chart; one best team match with a persistent base team that adds only necessary members; one-paste feedback; project memo; requirement pool; per-project DSH conversations; capability advice and skill research.'
  zh: 'DSH 左侧栏的组织人才匹配：项目进度内嵌成果与预警、产品验收与重复开发拦截；人才库可编辑、组织架构支持拖拽调队；匹配只给一组最佳团队，并可配置基础团队，基础成员不足时才新增；粘贴反馈智能拆分、项目备忘录、需求池、项目对话与培养建议。'
