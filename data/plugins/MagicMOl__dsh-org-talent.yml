description:
  en: 'Organization-wide employee matching in the DSH sidebar: a project guide with searchable progress, outcomes, recent projects and synced alerts; a desktop memo per project that can feed feedback; direct feedback from project progress; a requirement pool; a workspace with one DSH conversation per project; a talent pool; an org chart; team matching; capability advice and skill research.'
  zh: 'DSH 左侧栏的组织人才匹配：项目导览包含可检索的项目进度、项目成果、近期项目与同步预警；每个项目有桌面备忘录并可直接记入反馈；项目进度可直接记录反馈；另有需求池、按项目创建的 DSH 对话工作区、人才库、组织架构、团队匹配与能力培养建议。'
