description:
  en: 'Organization-wide employee matching in the DSH sidebar: searchable progress, outcomes, recent projects and synced alerts; one-paste feedback parsed locally into outcomes, blockers, difficulties and changes; a desktop memo per project; a requirement pool; one DSH conversation per project; a talent pool; an org chart; team matching; capability advice and skill research.'
  zh: 'DSH 左侧栏的组织人才匹配：可检索的项目进度、成果、近期项目与同步预警；粘贴一段反馈即可本地智能拆分成果、卡点、难点与变更点；每个项目有桌面备忘录；另有需求池、按项目创建的 DSH 对话工作区、人才库、组织架构、团队匹配与能力培养建议。'
