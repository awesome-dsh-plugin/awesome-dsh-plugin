description:
  en: 'Organization-wide employee matching in the DSH sidebar: a project guide with progress and blocker/difficulty/change alerts, a reusable requirement pool that feeds the current need or a project, a workspace that turns a project into member tasks and opens the project conversation in DSH, a searchable talent pool, an org chart, team recommendations, capability advice, skill research and project feedback.'
  zh: 'DSH 左侧栏的组织人才匹配：在「项目导览」查看项目进度、阶段成果与卡点/难点/变更点预警；用「需求池」复用需求并引用到当前需求或项目；在「工作区」把项目拆成成员任务，点击任务在 DSH 左侧工作区创建或打开项目对话并发送任务信息；在「人才库」整合员工；另有组织架构、全组织团队匹配、能力培养建议、技能检索与项目反馈。'
