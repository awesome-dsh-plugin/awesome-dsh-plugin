description:
  en: 'Organization-wide employee matching in the DSH sidebar: project progress with embedded outcomes and alerts; editable talent profiles and drag-to-team org chart; one best team with a persistent base team; local SVG charts for project status/progress and department headcount; one-paste feedback, memo, requirement pool, per-project DSH conversations, capability advice and skill research.'
  zh: 'DSH 左侧栏的组织人才匹配：项目进度内嵌成果与预警；人才库可编辑、组织架构支持拖拽调队；只给一组最佳团队并可配置基础团队；项目状态/进度与部门人数用本地 SVG 数据图展示；另含粘贴反馈、备忘录、需求池、项目对话与培养建议。'
