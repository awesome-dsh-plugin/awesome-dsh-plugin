name: 1148462398-hub/dsh-elysia-memory
category: memory
description:
  en: 'Elysia''s memory plugin for dsh. One shared, human-editable MEMORY.md across every session: two-disk mirror, history snapshots, cross-process write lock; entries tier between the main file and a searchable archive by hit frequency; retrieval is keyword co-occurrence plus BM25. Nine sections (persona, requirements, corrections, lessons, methods, requests, sessions, method library, ingested docs) plus a dedicated self-identity section for a character''s own self-cognition, injected above the persona. Ships an opt-in memory pack (packs/elysia: 61,903-char identity + 2,482-char persona, distilled from 1,696 officially-confirmed voice lines and checked against a 112,175-line game-dialogue corpus) that is off by default, backs up before writing, only touches identity/persona, and can be uninstalled. Also a skills library and a sticker library (you import your own images; none are bundled) that sends a fitting sticker at the right moment. On by default: a text bubble with her avatar after each reply, which costs one extra small model request unless the agent already announced (voice.bubble: false turns it off). Opt-in voice playback needs a local GPT-SoVITS engine (about 27 GB, installed separately, NVIDIA GPU required; the plugin downloads about 200 MB of weights) and is Windows-only; the automatic second-drive mirror is Windows-only too (elsewhere set mirrorPath, otherwise there is no mirror).'
  zh: '爱莉希雅的记忆插件。给所有 DSH 会话共用一份可读可改的 MEMORY.md：双硬盘镜像、历史快照、跨进程写锁；条目按命中频率与重复强调在主文件与可检索归档之间双向流动；检索为关键词共现加 BM25 排序。九个分区（人设、要求、指正、教训、方法、请求、会话、方法库、导入文档），另有一个独立的「自我记忆」分区放角色的自我认知，优先级高于人设。内置可选装的记忆包（packs/elysia：61,903 字自我记忆 + 2,482 字人设，由 1,696 条经官方文本确证的游戏语音提炼，并对照 112,175 条游戏剧情台词语料核验）：默认不安装，装前自动备份，只写 identity / persona 两个分区，可卸载恢复。另含自有技能库与表情包库（图片需自行导入，插件不自带；按情绪自动分类，在合适时机自动发送）。默认开启：每条回复后弹出带头像的文字气泡，除非 agent 已自己口播，否则会多一次小模型请求（voice.bubble 设为 false 可关）。可选语音朗读需要本机 GPT-SoVITS 引擎（约 27 GB，需自行安装，必须有 NVIDIA 显卡；权重约 200 MB 由插件下载），默认关闭、引擎不在就静默降级，仅支持 Windows；自动选第二块盘做镜像同样只适用于 Windows（其他系统请自行设置 mirrorPath，否则没有镜像）。'
