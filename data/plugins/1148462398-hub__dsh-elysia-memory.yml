description:
  en: 'Elysia''s memory plugin for dsh (npm package: dsh-elysia-memory). One shared, human-editable MEMORY.md across every session: two-disk mirror, history snapshots, cross-process write lock; entries tier between the main file and a searchable archive by hit frequency; retrieval is keyword co-occurrence plus BM25. Nine sections plus a dedicated self-identity section for a character''s own self-cognition, injected above the persona. Ships an opt-in memory pack (packs/elysia: 61,903-char identity + 2,482-char persona, measured from 1,696 officially-confirmed voice lines and 112,175 dialogue lines — not hand-written) that is off by default, backs up before writing, only touches identity/persona, and can be uninstalled. Also opt-in streaming voice narration through a local GPT-SoVITS engine (sentence by sentence as the model generates, off by default, silent degradation when absent), a skills library, and a sticker library.'
  zh: '爱莉希雅的记忆插件（npm 包名 dsh-elysia-memory）。给所有 DSH 会话共用一份可读可改的 MEMORY.md：双硬盘镜像、历史快照、跨进程写锁；条目按命中频率与重复强调在主文件与可检索归档之间双向流动；检索为关键词共现加 BM25 排序。九个分区，另有一个独立的「自我记忆」分区放角色的自我认知，优先级高于人设。内置可选装的记忆包（packs/elysia：61,903 字自我记忆 + 2,482 字人设）——这份记忆不是手写的设定集，是从 1,696 条经官方文本确证的游戏语音里统计出来的：句尾「呢」390 次、问句占 52.1%、平均句长 25.5 字。默认不安装，装前自动备份，只写 identity / persona 两个分区，可卸载恢复。另含流式语音朗读（本机 GPT-SoVITS 引擎，边生成边念，默认关闭）、自有技能库与表情包库。'
