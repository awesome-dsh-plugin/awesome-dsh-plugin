url: https://github.com/qishuilalala/dsh-voice-mode
name: qishuilalala/dsh-voice-mode
category: voice
description:
  en: 'Full-duplex voice mode for the Web UI: toggle (2-second pause auto-send) or hold-to-talk mic gestures with zipformer2 streaming ASR into an editable draft, optional wake word, sentence-by-sentence Edge TTS read-aloud with a live caption, and speaking interrupts playback and the running turn (barge-in). No API key.'
  zh: 'Web UI 全双工语音对话：会话内开启（按钮或 `Ctrl+Shift+V`），支持持续聆听（停顿自动发送）与按住说话两种手势，zipformer2 流式识别入可编辑草稿，可选唤醒词；最终答复按句流式 Edge TTS 朗读并显示实时字幕，开口即打断播放与正在运行的回合（barge-in），无需 API key。'
