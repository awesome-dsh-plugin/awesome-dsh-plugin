url: https://github.com/heiyedehen/dsh-self-clock
name: heiyedehen/dsh-self-clock
category: tools
description:
  en: 'Heartbeat: the agent sets its own alarm clock — when it is due, it gets one quiet line in the same conversation, never cutting into what you are saying. It checks whether you are mid-sentence first and waits if you are. Besides fixed alarms it can hold "things to look at later": they stay until they really fire. Comes with a settings panel; everything survives a restart.'
  zh: '鱼的心跳：让智能体给自己上闹钟——到点就在同一段对话里留一句轻提示，不会打断你；它会先看你是否正在说话，正在说话就等下一次。除了固定闹钟，也能记下「等会儿该看一眼的事」，没叫成会留着。带设置面板，重启不丢。'
