url: https://github.com/Hemuchuan/dsh-bilingual
name: Hemuchuan/dsh-bilingual
category: ui
description:
  en: "Adds a per-paragraph bilingual view to assistant replies in the DeepSeek Harness desktop app: each Chinese paragraph gets an English translation underneath and each English paragraph gets a Chinese one underneath, behind a session-header toggle; code, tables and formulas stay untranslated. Translations come from the DeepSeek API (the plugin reuses DSH's saved DEEPSEEK_API_KEY, or a key you paste in its settings), so it needs network access and each uncached paragraph is a billable request."
  zh: "给 DeepSeek Harness 桌面端的助手回复加逐段双语对照：中文段落下补英文、英文段落下补中文，会话头部有开关；代码、表格和公式不翻译。译文由 DeepSeek API 生成（插件复用 DSH 已保存的 DEEPSEEK_API_KEY，也可在设置里粘贴 Key），需要联网，每段未命中缓存的文本都会产生一次计费请求。"
