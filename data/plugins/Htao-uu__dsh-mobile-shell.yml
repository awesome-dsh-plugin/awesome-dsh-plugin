url: https://github.com/Htao-uu/dsh-mobile-shell
name: Htao-uu/dsh-mobile-shell
category: ui
description:
  en: "DeepSeek App-style mobile shell for the DSH Web UI with drawer navigation, app-like composer and settings; best paired with the dsh-android app, which supplies the native Android back key (standalone use works but is not recommended)."
  zh: "为 DSH Web UI 提供接近 DeepSeek App 的移动端壳层：抽屉导航、App 风格输入与设置；Android 返回键需搭配 dsh-android App（单独安装也能用，但作者不建议且可能有 bug）。"
