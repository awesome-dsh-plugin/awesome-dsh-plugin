url: https://github.com/leaforbook/dsh-mcp-lazy
name: leaforbook/dsh-mcp-lazy
category: tools
description:
  en: dsh-mcp-lazy is a token-saving MCP lazy-loading, dynamic tool-loading, MCP tool management, on-demand tools, and Tool Router / MCP router plugin for DeepSeek Harness (DSH). It addresses oversized tool catalogs, persistent tool schemas, context bloat, and wasted tokens when many MCPs are installed. The plugin automatically discovers and takes over compatible DSH MCPs, leaving only a shared router in the cold state and using automatic MCP routing, on-demand tool loading, and progressive schema disclosure to reveal only the server needed by the current conversation. Tools are hidden again at turn end for token savings and context optimization. MCPs with nonstandard names, collisions, incomplete catalogs, missing DSH capabilities, or uncertain runtime state are not taken over and keep their original behavior. Any routing or restriction uncertainty fails open and restores tool visibility, while the original MCP continues to own execution, permissions, attachments, retries, and process lifecycle. Explicit lazy servers also support lazy connections, warm reuse, bounded reconnection, stdio, and Streamable HTTP.
  zh: dsh-mcp-lazy 是一款面向 DeepSeek Harness（DSH）的 MCP懒加载、动态加载工具、MCP工具管理与 Tool Router（工具路由/MCP路由）插件，适合同时安装多个 MCP 的场景，主要解决 MCP工具太多、工具目录过长、工具Schema常驻引起的上下文膨胀和 Token浪费。MCP 的工具名称、说明和参数会随模型请求进入上下文；插件会自动发现并接管符合条件的 DSH MCP，在冷态只保留共享路由，当前会话需要某个 MCP 时再执行 MCP自动路由、自动加载工具和 Schema按需披露，轮次结束后重新隐藏，实现按需加载MCP工具、减少Token占用、节省Token和上下文优化。自动接管只适用于命名规范、无冲突、目录完整且能按会话安全隐藏和恢复的 MCP；命名异常、工具重名、目录不完整、DSH能力不足或状态不确定的 MCP 不接管并保持原样。路由或隐藏出现不确定性时，插件会恢复原工具可见性；第三方 MCP 的执行、权限、附件、重试和进程生命周期仍由原插件负责，不会为了 Token优化让工具消失或改变原有使用方式。需要用到时才连接 MCP 的场景还可启用连接层懒加载，并使用连接保温、有限重连、stdio 和 Streamable HTTP。
