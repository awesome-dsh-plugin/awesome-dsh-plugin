description:
  en: "Browser plugin for DSH (浏览器): Codex-style native browser control in your signed-in Chrome, with smooth virtual-cursor feedback, semantic page reads, form filling, screenshots and handoff; setup from the Browser sidebar."
  zh: "DSH 浏览器插件（Browser）：以 Codex 浏览器操作为体验参考，直接使用已登录的 Chrome 浏览器，平滑虚拟鼠标，支持页面读取、填表、截图与控制交还；安装后从侧栏「浏览器」完成配置。"
