description:
  en: 'StrataGate gives DeepSeek Harness evolving, local-first long-term memory for user preferences, project decisions, conversations, and tool results across sessions; it layers history with user-tunable time decay, reinforces memories through real answer use, organizes its knowledge graph into dynamic semantic communities, and keeps recalled evidence traceable to its original messages.'
  zh: 'StrataGate 为 DeepSeek Harness 自动构建持续演化、本地优先的长期记忆：跨会话承接用户偏好、项目决策、历史对话和工具结果，通过用户可调的时间衰减分层沉淀历史，按真实回答使用强化记忆，将知识图谱动态组织为语义节点群，并让召回证据可追溯到原始消息。'
