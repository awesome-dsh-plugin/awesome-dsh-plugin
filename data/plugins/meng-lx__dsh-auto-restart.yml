url: https://github.com/meng-lx/dsh-auto-restart
name: meng-lx/dsh-auto-restart
category: session
description:
  en: 'Restart initiated by the agent itself, not by a button. The agent calls one tool, then the plugin takes over: it waits until every agent and background job on the host is idle, runs a visible ten-second countdown that a click, a scroll, or a key press cancels, then restarts DSH and wakes the original session so the agent carries on from its last sentence. No button, no manual entry: the tool is the only way in. Works on the official desktop app and the official web client; third-party shells are not supported out of the box.'
  zh: '由 agent 自己发起的重启，不是按钮。agent 调一个工具，之后由插件接管：等这台机器上所有 agent 与后台任务都空闲，走完十秒可见倒计时（点一下鼠标、滚一下滚轮、按任意键都会取消），再重启 DSH，并唤醒原会话让 agent 接着说下去。没有按钮、没有手动入口——工具是唯一入口。官方桌面端与官方网页端均已适配，第三方壳不在默认支持范围内。'