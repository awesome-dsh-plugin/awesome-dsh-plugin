url: https://github.com/meng-lx/dsh-auto-restart
name: meng-lx/dsh-auto-restart
category: session
description:
  en: 'Restart initiated by the agent itself, not by a button. The agent calls one tool; the plugin then waits until every agent and background job on the host is idle, runs a visible ten-second countdown that any mouse or key press cancels, restarts DSH, and wakes the original session so the agent carries on from its last sentence. No button, no manual entry: the tool is the only way in. Windows only.'
  zh: '由 agent 自己发起的重启，不是按钮。agent 调一个工具，之后由插件接管：等这台机器上所有 agent 与后台任务都空闲，走完十秒可见倒计时（任何鼠标或按键都会取消），再重启 DSH，并唤醒原会话让 agent 接着说下去。没有按钮、没有手动入口——工具是唯一入口。仅限 Windows。'