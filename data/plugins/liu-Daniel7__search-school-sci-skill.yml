url: https://github.com/liu-Daniel7/search-school-sci-skill
name: liu-Daniel7/search-school-sci-skill
category: skill
description:
  en: 'Measures one university department''s research output: matches author affiliation strings against a college''s known name variants (detecting same-named departments at other universities), backfills papers that only name the university by faculty author IDs, classifies each paper by journal tier (CAS partition with Top flag, JCR quartile, CCF, Chinese core via a CNKI export merger), splits staff from student first authors, and writes a workbook with a dashboard sheet, a filterable paper list, a teacher-by-direction matrix and per-teacher statistics. Student authorship is inferred from affiliation and staff lists, not verified against enrolment records.'
  zh: '统计某一所大学某个学院（二级单位）的科研产出：按作者单位串匹配学院的各种英文写法（并检测其他高校的同名院系），对只写到校名一级的论文用教师作者 ID 反查补全，再按期刊层级分类（中科院分区含 Top 标记、JCR 分区、CCF、经知网导出合并的中文核心），区分教师与学生一作，输出含看板页、可筛选论文清单、教师-方向矩阵和教师个人统计的工作簿。学生身份由单位与教师名单推定，未与学籍核对。'
