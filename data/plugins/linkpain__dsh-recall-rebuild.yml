url: https://github.com/linkpain/dsh-recall-rebuild
name: linkpain/dsh-recall-rebuild
category: memory
description:
  en: 'Reconstructive recall enhancer for DeepSeek Harness: reads the memory stores of existing memory plugins (16 built-in adapters incl. dsh-prime-memory, dsh-mnemon, dsh-loci and dsh-memory-palace), fuses multiple stores with RRF in auto mode, and before each model step rebuilds retrieved memory fragments into contextual, emotionally-toned recollections instead of raw-text injection. Ships a Memory Sea visualization panel that draws memories as a deep-space point cloud - dots are memories, lines are associations - with one-click switching between raw and consolidated sources.'
  zh: '重建式回忆增强插件：只读现有记忆插件的记忆库（内置 16 种主流记忆源适配，含 dsh-prime-memory、dsh-mnemon、dsh-loci、dsh-memory-palace 等），auto 模式下多库 RRF 融合，在模型步骤前把检索到的记忆碎片「重建」为带语境与情绪的回忆片段再注入，替代生硬的原文注入。附带「记忆识海」可视化面板：把记忆画成深空点云（点是记忆、线是联想），原始记忆 / 巩固记忆双数据源一键切换。'
