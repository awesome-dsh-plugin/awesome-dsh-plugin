description:
  en: 'Fork of FeatherHunter/dsh-prompt with draggable custom template ordering — drag the handle in Settings to reorder custom prompts (saved to the host); preset ordering unchanged. Do not install alongside upstream dsh-prompt: both register the same UI and /_dsh/dsh-prompt/ route.'
  zh: 'FeatherHunter/dsh-prompt 的分支版，支持自定义模板拖拽排序：设置页拖动 ⠿ 手柄即可调整顺序并自动保存；预制模板顺序不变。不能与原版 dsh-prompt 同装：两者注册同一套界面与 /_dsh/dsh-prompt/ 路由。'
