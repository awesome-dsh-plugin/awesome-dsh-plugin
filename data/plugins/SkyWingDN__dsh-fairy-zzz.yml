url: https://github.com/SkyWingDN/dsh-fairy-zzz
name: SkyWingDN/dsh-fairy-zzz
category: theme
description:
  en: 'Third-party remake of the Fairy / Zenless Zone Zero H.D.D theme for the DSH Web UI, published as its own npm package (@sky_wing_dn/dsh-fairy-zzz). It started from AssassinVIX/fairy-zzz-plugin (MIT), but since v1.1.0 the rendering, layout, voice and skin layers have been largely rewritten: Wire-Net Terminal host skin, always-on fee dock (balance, today spend, peak/off-peak countdown), one-click self-update, split voice/appearance settings, dockable eye badge with usage bubble, bundled Anton title font, and optional local GPT-SoVITS narration; eye artwork comes from Chengzhibense/Fairy-DSH (Apache-2.0). What still comes directly from upstream is only the plugin skeleton, the H.D.D skin concept, the boot video/audio and five base greeting recordings. Install this package or the upstream one, not both.'
  zh: 'Fairy Ⅲ /《绝区零》H.D.D 主题的第三方重制版（独立 npm 包 @sky_wing_dn/dsh-fairy-zzz）。起点是 AssassinVIX/fairy-zzz-plugin（MIT），但 v1.1.0 起渲染、定位、语音、皮肤等主要模块已重写：Wire-Net Terminal 宿主皮肤、常驻电费坞（余额、今日花费、峰谷倒计时）、一键自更新、语音/外观设置、可停靠眼徽与用量气泡、内置 Anton 标题字体、可选本地 GPT-SoVITS 朗读；眼徽美术来自 Chengzhibense/Fairy-DSH（Apache-2.0）。仍直接沿用上游的只有插件骨架、H.D.D 皮肤概念、开机视频与开场音效、5 条基础问候录音。与上游包二选一安装，不要同时装。'
icon: https://raw.githubusercontent.com/SkyWingDN/dsh-fairy-zzz/main/assets/icon-180.png
