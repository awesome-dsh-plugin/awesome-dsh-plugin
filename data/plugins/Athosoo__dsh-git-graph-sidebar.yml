description:
  en: 'Built on dsh-better-sidebar: the repository graph is a tab inside that sidebar, and this plugin still loads without it - install dsh-better-sidebar to see the tab. Forked from @linxin666/dsh-client-ui-git-graph 0.4.8, which linxin666 develops in zhu1090093659/dsh-web. Both halves own the /git route prefix, so this plugin and the upstream one cannot be installed at the same time - pick one. It discovers the Git repositories up to three levels below the workspace directory (at most 200, skipping node_modules, dist, build, out, coverage, target, vendor and dot-directories), lists them as a tree with branch, head, dirty-file and conflict counts, and draws the selected repository commit graph as an SVG lane canvas with curved cross-lane edges, merge diamonds, ref badges, row zoom and a pinned commit card. The tab writes to the repository: the Initialize Git repository button runs git init, and the conventions picker writes a GIT_CONVENTIONS.md document into the repository (or a workspace-wide .dsh/GIT_CONVENTIONS.md that nested repositories inherit) from six frameworks - Conventional Commits, GitHub Flow, Git Flow, Trunk-based, Conventional Branch, GitLab Flow. The host injects that document into the system prompt before every model step and flags the last 20 commit messages that break the rules the document states - subject length, type prefix, Chinese, English or mixed language, lowercase, trailing period and imperative mood, plus an optional AI attribution policy (ai: required / optional / forbidden) that reads the message trailers, so Assisted-by and Co-authored-by count as attribution while ai: forbidden only rejects AI-specific trailers. When the workspace document, the document of the checked repository and the documents of its parent directories disagree, the panel and the injected prompt both name every disagreement and the agent is told to ask before changing anything; one click then merges them into the workspace .dsh/GIT_CONVENTIONS.md, keeps the union of the machine-checkable rules, leaves a timestamped .bak copy of every rewritten file and replaces the absorbed repository documents with pointers to the workspace one. With the agentTool option enabled the host also registers a git_conventions tool, so a model step can run the same check and stage the same merge. The same graph can also open as a page in the main area of the conversation, opt-in and closable from the tab, beside the views the host ships. The composer branch chip, interactive graph dialog and worktree manager of the upstream plugin are carried over unchanged.'
  zh: '依托 dsh-better-sidebar：仓库图谱是那个侧边栏里的一页，没装它插件照常加载，装上才会出现这一页。分叉自 @linxin666/dsh-client-ui-git-graph 0.4.8（上游开发仓库为 zhu1090093659/dsh-web）。两者都占用 /git 路由前缀，不能同时安装，只能二选一。它会发现工作区目录往下三层以内的 Git 仓库（最多 200 个，跳过 node_modules、dist、build、out、coverage、target、vendor 与点目录），按树状列出并显示分支、head、脏文件数与冲突数，把选中仓库的提交图渲染成 SVG 泳道画布（跨泳道曲线、合并菱形、ref 徽章、行缩放与可固定的提交详情卡）。它会写入仓库：「初始化 Git 仓库」按钮会执行 git init，规范选择器会把 GIT_CONVENTIONS.md 写进仓库（或写一份工作区级的 .dsh/GIT_CONVENTIONS.md 供子仓库继承），内容来自六套框架——约定式提交、GitHub Flow、Git Flow、主干开发、约定式分支、GitLab Flow。host 会在每个模型步骤前把该文档注入 system prompt，并按文档自己声明的规则标出最近 20 条提交信息里不符合的那些——标题长度、类型前缀、中文/英文/混排、小写开头、结尾句号与祈使句，另有一项可选的 AI 署名政策（ai: required / optional / forbidden），读的是提交正文里的 trailer，所以 Assisted-by 与 Co-authored-by 都算署名，ai: forbidden 只拦 AI 专用 trailer。当工作区文档、被检查仓库的文档与它上级目录里的文档互相矛盾时，面板与注入的提示都会逐条列出冲突，并要求智能体先问再改；确认后一键整合进工作区的 .dsh/GIT_CONVENTIONS.md，保留各文档可机器校验规则的并集，被改写过的文件都留一份带时间戳的 .bak，被并入的仓库文档改成指向工作区文档的指针。开启 agentTool 选项后 host 还会注册 git_conventions 工具，模型步骤可以跑同一套检测，并把同一套合并先出成计划。同一张图谱还可以从页签里打开（可选、可随时关闭），作为对话主区域里内置视图旁边的一页。同时保留了上游插件的输入框分支徽章、交互式提交图对话框与 worktree 管理器。'
