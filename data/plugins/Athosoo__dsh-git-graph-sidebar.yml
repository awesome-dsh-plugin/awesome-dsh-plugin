description:
  en: 'A repository graph tab for dsh-better-sidebar, forked from @linxin666/dsh-client-ui-git-graph 0.4.8, which linxin666 develops in zhu1090093659/dsh-web. Both halves own the /git route prefix, so this plugin and the upstream one cannot be installed at the same time - pick one. It discovers the Git repositories up to three levels below the workspace directory (at most 200, skipping node_modules, dist, build, out, coverage, target, vendor and dot-directories), lists them as a tree with branch, head, dirty-file and conflict counts, and draws the selected repository commit graph as an SVG lane canvas with curved cross-lane edges, merge diamonds, ref badges, row zoom and a pinned commit card. The tab writes to the repository: the Initialize Git repository button runs git init, and the conventions picker writes a GIT_CONVENTIONS.md document into the repository (or a workspace-wide .dsh/GIT_CONVENTIONS.md that nested repositories inherit) from six frameworks - Conventional Commits, GitHub Flow, Git Flow, Trunk-based, Conventional Branch, GitLab Flow. The host injects that document into the system prompt before every model step and flags the last 20 commit subjects that break the rules the document itself states; Chinese, English and mixed subjects are all accepted, and an optional strict mode writes strict: true. The composer branch chip, interactive graph dialog and worktree manager of the upstream plugin are carried over unchanged.'
  zh: '给 dsh-better-sidebar 用的仓库图谱页，分叉自 @linxin666/dsh-client-ui-git-graph 0.4.8（上游开发仓库为 zhu1090093659/dsh-web）。两者都占用 /git 路由前缀，不能同时安装，只能二选一。它会发现工作区目录往下三层以内的 Git 仓库（最多 200 个，跳过 node_modules、dist、build、out、coverage、target、vendor 与点目录），按树状列出并显示分支、head、脏文件数与冲突数，把选中仓库的提交图渲染成 SVG 泳道画布（跨泳道曲线、合并菱形、ref 徽章、行缩放与可固定的提交详情卡）。它会写入仓库：「初始化 Git 仓库」按钮会执行 git init，规范选择器会把 GIT_CONVENTIONS.md 写进仓库（或写一份工作区级的 .dsh/GIT_CONVENTIONS.md 供子仓库继承），内容来自六套框架——约定式提交、GitHub Flow、Git Flow、主干开发、约定式分支、GitLab Flow。host 会在每个模型步骤前把该文档注入 system prompt，并按文档自己声明的规则标出最近 20 个提交里不符合的那些；中文、英文与中英混排的标题都接受，可选的强约束模式会写入 strict: true。同时保留了上游插件的输入框分支徽章、交互式提交图对话框与 worktree 管理器。'
