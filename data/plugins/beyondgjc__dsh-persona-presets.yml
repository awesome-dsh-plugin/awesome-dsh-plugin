name: beyondgjc/dsh-persona-presets
category: ui
description:
  en: 'Three custom agent presets, one editable character card each, with three built-in personas out of the box; import SillyTavern character-card PNGs or md/txt/json setting files, and the settings section handles naming, editing, and card-image display — edits apply on the next turn with no restart.'
  zh: 三个自定义 agent 预设，每槽一张可编辑角色卡——开箱自带鲸鱼娘/病娇/小满三张预制人设，支持导入 SillyTavern 生态角色卡 PNG 或 md/txt/json 设定文档；设置页「角色卡」区块可取名、编辑、展示卡面图，保存后下一回合生效，无需重启。
