description:
  en: Full-screen boot splash that covers DSH's loading card before the first paint, plays a seven-beat compass sequence, and hands off to the app. Clicking anywhere skips to the release beat.
  zh: 全屏启动动画：在 DSH 画出加载卡之前接住首帧，播完七段罗盘序列后交接给主界面；点按屏幕任意处可直接进入主界面。
