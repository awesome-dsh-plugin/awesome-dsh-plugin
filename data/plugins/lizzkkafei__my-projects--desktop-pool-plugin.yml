description:
  en: "A 3D eight-ball pool table opened from a DSH session: a 9ft tournament bed with three-stage friction physics so draw, follow and side spin are computed rather than scripted, WPA rules against an AI opponent, and fully procedural art and Web Audio sound."
  zh: "从 DSH 会话打开的三维美式 8 球球台：9ft 比赛台，三段式摩擦物理让低杆、高杆与左右塞都是算出来的而非预设动画，按 WPA 规则与 AI 对手对局，画面与音效全部由代码生成。"
