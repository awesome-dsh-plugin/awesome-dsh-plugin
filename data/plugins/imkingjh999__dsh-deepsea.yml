url: https://github.com/imkingjh999/dsh-deepsea
name: imkingjh999/dsh-deepsea
category: fun
description:
  en: Turns session context into a deep-sea moyu (slack-off) game in a floating window — your hand sinks as context grows, touch a fish and server-rolled dice decide the mint of a holographic collectible card across five oceans, with a fish pond and a GitHub-linked leaderboard.
  zh: 把会话 context 变成浮窗深海摸鱼：context 越长手沉得越深，摸到鱼后服务端掷骰定胜负，中卡铸造镭射收藏卡，五大洋摸鱼、鱼池养成、GitHub 绑定全球排行榜。
