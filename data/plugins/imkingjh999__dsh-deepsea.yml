name: imkingjh999/dsh-deepsea
category: fun
description:
  en: Turns session context into a deep-sea fishing game in a floating window — the claw sinks as context grows, server-rolled dice decide the catch, and wins mint holographic Water Margin 108 cards across five oceans, with a fish pond and a GitHub-linked leaderboard.
  zh: 把会话 context 变成浮窗深海垂钓：context 越长爪沉得越深，服务端掷骰定胜负，中卡铸造水浒 108 将镭射卡，五大洋垂钓、鱼池养成、GitHub 绑定全球排行榜。
