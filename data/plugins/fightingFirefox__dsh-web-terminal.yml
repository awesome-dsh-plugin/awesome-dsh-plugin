url: https://github.com/fightingFirefox/dsh-web-terminal
name: fightingFirefox/dsh-web-terminal
category: ui
description:
  en: "Claude-styled terminal panel for the DSH web GUI: agent shell commands run in a persistent real PTY with a genuine prompt, echo and exit codes, auto-open in the right sidebar and are scoped per conversation; optional live_terminal_* tools for reading, searching and screenshotting. Fork of Lancang-hzau/dsh-live-terminal (MIT); it shares its live_terminal_* tools and right-sidebar panel, so do not install it together with the upstream plugin in the same profile."
  zh: "DSH 网页版的 Claude 风格终端面板：agent 的 shell 命令跑在常驻真终端里（真提示符、真回显、真退出码），右侧栏自动弹出并按会话隔离；可选 live_terminal_* 工具用于读取、搜索与截屏。本项目是 Lancang-hzau/dsh-live-terminal（MIT）的衍生版，沿用同一套 live_terminal_* 工具与右侧栏面板，不能与上游插件装在同一 profile。"
icon: https://raw.githubusercontent.com/fightingFirefox/dsh-web-terminal/main/docs/icon-180.png
