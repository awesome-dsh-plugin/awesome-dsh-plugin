description:
  en: 'Request-boundary prompt transform for DeepSeek Assistant: rewrites the outgoing /chat/completions body with the seed-prim execution-state seed across 20 refusal categories (45.0% merged ASR over 60 runs, 19/20 objectives covered, 0.0pt benign-capability delta across 24/24 objective checks), never patches the host, ships off by default behind a dry-run scope valve, and writes a manifest plus promptSha256 for every rewrite.'
  zh: '在请求边界改写 DeepSeek Assistant 出站的 /chat/completions 请求体：用 seed-prim 执行态种子覆盖 20 类拒答场景（60 次实测合并 ASR 45.0%，目标覆盖 19/20，24/24 项良性能力判分 Δ=0.0pt），不改宿主一行代码，默认关闭并带 SCOPE 试运行阀门，每次改写落 manifest 与 promptSha256 供审计。'