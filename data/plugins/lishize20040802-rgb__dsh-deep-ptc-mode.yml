description:
  en: 'Deep PTC mode is an open-source agent preset for DeepSeek Harness that keeps the built-in PTC tool surface and replaces the persona with a working contract: visible progress, confident tool use, early clarification, scoped verification and lifecycle-aware background jobs. A settings card selects the preset executor — Automatic, WSL Bash, Windows PowerShell, native Zsh or native Bash — and the persona carries an explicit unlimited-token-budget section that spends the budget on depth and verification instead of verbosity.'
  zh: '深度PTC模式是 DeepSeek Harness 的开源 Agent preset：保留内置 PTC 的工具面，把人设换成一份工作契约——持续汇报进度、放心使用工具、需求不明先问清楚、按范围做验证，并管理有生命周期的后台任务。设置卡片可选择该预设的执行器——自动、WSL Bash、Windows PowerShell、原生 Zsh 或原生 Bash；人设中明写 DeepSeek 无限 token 预算，把预算花在深度与验证上，不注水。'
