name: lishize20040802-rgb/dsh-deep-ptc-mode
category: workflow
icon: https://raw.githubusercontent.com/lishize20040802-rgb/dsh-deep-ptc-mode/main/assets/icon.png
description:
  en: 'Deep PTC mode is an open-source agent preset for DeepSeek Harness that keeps the built-in PTC tool surface and replaces the persona with a working contract: a DeepSeek identity and unlimited-token-budget instruction so the model does not skip reads, commands or checks to save tokens; long commands run as background jobs so the model never sleeps while waiting, stays reachable to new messages and is woken when a job finishes; planning by estimated size (internal up to 5 minutes, shown without approval up to 20, approval required beyond); and asking about unclear intent instead of guessing. A settings card selects the preset executor — Automatic, WSL Bash, Windows PowerShell, native Zsh or native Bash.'
  zh: '深度PTC模式是 DeepSeek Harness 的开源 Agent preset：保留内置 PTC 的工具面，把人设换成一份工作契约——写明 DeepSeek 身份与无限 token 预算，要求不为省 token 跳过读取、命令和验证；耗时命令放后台 job，模型不休眠等待、可随时接收新消息，job 完成后自动唤醒；按预计耗时分档计划（5 分钟内直接做，5–20 分钟告知计划但不等审批，超过 20 分钟需批准）；意图不清时先提问而不是猜测。设置卡片可选择该预设的执行器——自动、WSL Bash、Windows PowerShell、原生 Zsh 或原生 Bash。'
