name: lishize20040802-rgb/dsh-deep-ptc-mode
category: workflow
icon: https://raw.githubusercontent.com/lishize20040802-rgb/dsh-deep-ptc-mode/main/assets/icon.png
description:
  en: 'Deep PTC mode is an open-source agent preset for DeepSeek Harness that derives its preset from the official PTC declaration shipped by the installed Harness and inherits upstream composition changes, so an official PTC update — including removed or renamed modules — does not break existing sessions. It adds a working contract: plan by estimated size (work directly up to 5 minutes, show a plan without waiting for approval up to 20, ask for approval beyond), and ask about unclear intent instead of guessing. Waiting is bounded in code by wrapping the official shell, job and question tools: foreground commands move to background jobs after 30 s (configurable), a steered user message ends the current wait so the model reads it, foreground pauses over 5 s and long timers in run_code are refused, and questions run in timed mode. Cards face both the user and the model: a question card carries any number of questions, and answers reach the model with question and option ids plus the labels the user saw; the task brief files the goals, constraints and acceptance criteria from the user''s messages and verifies each acceptance item as soon as its work finishes; a workspace project-cards file keeps project rules, implemented features and completed tasks that people and other tools can read. Deep sleep mode drives unattended runs through host goal rounds, a side panel shows the execution environment, subagents, background jobs, output files, SSH connections and tool state, and a settings card selects the preset executor — Automatic, WSL Bash, Windows PowerShell, native Zsh or native Bash. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '深度 PTC 模式是 DeepSeek Harness 的开源 Agent preset：它在加载时从已安装 Harness 声明的官方 PTC 预设派生组成，并继承上游变更，因此官方对 PTC 的增删改（包括移除或改名的模块）不会破坏已有会话。它加入一份工作契约：按预计耗时分档（5 分钟内直接做，5–20 分钟告知计划但不等审批，超过 20 分钟需批准），意图不清时先提问而不是猜测。等待由代码限制：包装官方的命令、job 与提问工具，前台命令超过 30 秒（可配置）自动转为后台 job，用户插入消息时立即结束当前等待让模型读到消息，前台超过 5 秒的暂停和 run_code 中的长定时器被拒绝，提问采用限时模式。卡片同时面向人和模型：提问卡每张可带任意多道题，回答带问题与选项 id、以及用户看到的选项文字送达模型；任务卡把用户消息里的目标、约束与验收标准整理成条目，并在每项工作完成时立即核对对应验收；工作区的特点卡片文件保存项目规则、已实现功能与已完成任务，人和其它工具都能直接阅读。深度睡眠模式由宿主 goal 轮次驱动无人值守运行；侧边栏显示执行环境、子代理、后台任务、输出文件、SSH 连接与工具状态；设置卡片可选择预设执行器——自动、WSL Bash、Windows PowerShell、原生 Zsh 或原生 Bash。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
