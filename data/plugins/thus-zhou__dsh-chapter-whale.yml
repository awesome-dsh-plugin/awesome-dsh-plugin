description:
  en: 'Windows x64 DSH workbench for scheduled, unattended novel writing and Fanqie publishing, with Liquid Glass UI, schedule buffer, continuity/style precheck, reader feedback, and optional free-quota models. First start downloads a pinned Python and browser runtime (about 274 MB) from GitHub into %LOCALAPPDATA%\ChapterWhale; publishing signs in to your Fanqie writer account.'
  zh: '码章鲸：Windows x64 无人值守小说写作与番茄发布工作台，含液态玻璃界面、排期缓冲、连续性与风格预检、读者反馈及部分免费模型渠道。首次启动会从 GitHub 下载固定版本的 Python 与浏览器运行时（约 274 MB）到 %LOCALAPPDATA%\ChapterWhale；发布需要登录你的番茄作家账号。'
