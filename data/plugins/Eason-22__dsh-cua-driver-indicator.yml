url: https://github.com/Eason-22/dsh-cua-driver-indicator
name: Eason-22/dsh-cua-driver-indicator
category: tools
description:
  en: "Visibility layer for DSH's built-in Cua Driver computer-control channel: a top banner names the controlling session and its goal, Esc truly stops the agent, and when the official channel is missing it asks whether to install it and can install it in one click. Windows only."
  zh: "给 DSH 官方内置的 Cua Driver 电脑控制通道加一层可见提示：顶部横幅显示是哪个会话、基于什么目标在控制电脑，按 Esc 真正停止；官方通道没装时还会弹窗询问是否安装，并支持一键安装。仅支持 Windows。"
icon: https://raw.githubusercontent.com/Eason-22/dsh-cua-driver-indicator/main/assets/icon-180.png