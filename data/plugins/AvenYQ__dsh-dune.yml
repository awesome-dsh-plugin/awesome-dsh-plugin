description:
  en: 'Tactile warm-paper skin for DeepSeek Harness: seven built-in palettes plus AI-designed themes, tight typography, spring sidebar motion, switchable streaming-text reveal and comet caret, per-workspace icons, and draggable sidebar entries with a "More" tray.'
  zh: '暖纸质感的 DSH 皮肤：七套内置配色外加 AI 生成主题，克制的字号与字重，侧栏回弹动效，逐字浮现与彗星光标可开关，工作区自定义图标，侧栏入口可拖动排序、也能收进「更多」。'
