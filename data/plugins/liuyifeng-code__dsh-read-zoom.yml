url: https://github.com/liuyifeng-code/dsh-read-zoom
name: liuyifeng-code/dsh-read-zoom
category: ui
description:
  en: "Adds a fixed enlarge button to every DeepSeek Harness answer's action row and opens that answer in a two-pane reading view: a turn list with prompt summaries plus a composer on the left, the selected prompt and answer zoomed 80-300% on the right, and failed or over-wide formulas tamed for math, physics and chemistry."
  zh: "在每条回答的操作行（用量图标左边）常驻一个放大按钮，点开进入两栏阅读视图：左栏是带提问摘要的轮次列表和输入框（只填入不自动发送），右栏按 80%–300% 缩放显示选中的提问与回答，并对渲染失败或超宽的公式做降级与自适应，适合看数学、物理、化学长文。"
tarball: https://github.com/liuyifeng-code/dsh-read-zoom/releases/download/v0.3.0/dsh-read-zoom-0.3.0.tgz
