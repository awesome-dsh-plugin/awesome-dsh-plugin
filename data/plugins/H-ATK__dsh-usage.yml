name: H-ATK/dsh-usage
category: usage
description:
  en: 'Usage, token, cache, and cost statistics for DeepSeek Harness, with workspace and model breakdowns, per-turn history, price references, and CSV/Excel export. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 使用量与费用统计：按工作区、模型和渠道拆分 Token 与消费，包含逐轮记录、价格表以及 CSV/Excel 导出。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'