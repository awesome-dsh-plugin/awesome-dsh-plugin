url: https://github.com/6shenhonghong9/dsh-startup-screen
name: 6shenhonghong9/dsh-startup-screen
category: ui

description:
  en: 'Rhine Lab-style boot animation for DeepSeek Harness: six acts from a black title plate through irradiated white-out to a warm dossier panel, five access-authorization steps (the first two can wait for a click or Enter, and Esc skips), real-voice recordings for the first five lines, and a settings page that switches between warm-light and dark themes and live-edits 33 playback, identity, voice and visual options.'
  zh: '莱茵生命风格的 DeepSeek Harness 启动动画：黑幕标识 → 过曝洗白 → 暖白档案底板 → 五步访问授权（前两步可设为等点击/回车，Esc 可跳过）→ 色散揭幕，前五句为真声台词；设置页提供暖白/暗色两套主题，并可实时调整播放、身份、语音与视觉等 33 项参数。'

