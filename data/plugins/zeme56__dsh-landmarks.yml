description:
  en: Adds a sidebar entry that opens a full-screen 3D gallery of four procedural landmark models — the Eiffel Tower, the Great Wall, the Forbidden City and the Taj Mahal — plus a second entry with five quiet rooms.
  zh: 左侧边栏加一个全屏 3D 展厅，看四座程序化建模的地标——埃菲尔铁塔、长城、紫禁城、泰姬陵——另带一个「五间安静的屋子」入口。
