name: 778672151/dsh-session-turn-eta
category: ui
description:
  en: 'Live progress bar under the composer with a percentage and an estimated time left for the current DeepSeek Harness turn; the estimate re-anchors as the turn runs and never reads 100% until the turn ends, and the bar turns red when the turn fails or is interrupted.'
  zh: 在输入框下方显示当前这一轮 DeepSeek Harness 任务的实时进度条、百分比与预计剩余时间；估计随轮次实时重锚，任务失败或中断时进度条变红。
