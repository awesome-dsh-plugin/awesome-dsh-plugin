url: https://github.com/wangjianghu/dsh-composer-lists
name: wangjianghu/dsh-composer-lists
category: ui
description:
  en: 'Ordered and unordered list editing in the DSH composer: automatic numbering and renumbering, marker-aware caret moves, level promotion, a natural blank-line flow, and an undoable AI prompt-polish button. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '输入框有序/无序列表编排：自动续号与重排、标记感知的光标移动、层级升降、自然的空行编排，以及可撤销的 AI 提示词优化按钮。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
