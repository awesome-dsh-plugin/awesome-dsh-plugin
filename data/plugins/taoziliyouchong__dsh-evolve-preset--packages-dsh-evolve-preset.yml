url: https://github.com/taoziliyouchong/dsh-evolve-preset/tree/main/packages/dsh-evolve-preset
name: taoziliyouchong/dsh-evolve-preset#dsh-evolve-preset
category: workflow
description:
  en: 'An agent preset that adds a working mode to DeepSeek Harness: the mode text has the model analyze requirements and plan before acting, open a gate document, and reply in a fixed three-block shape. The task tree and session-start profile injection are separate companion packages in the same repository, installed from a clone with scripts/install.mjs; only the term dictionary (dsh-term-dict) comes with this package, and without the task tree the model writes its own alignment bar. Needs DSH 0.2.1-alpha.1 or later.'
  zh: '给 DeepSeek Harness 增加一个工作模式的 agent preset：模式正文要求模型动手前做需求分析与计划、建关卡文档，回复固定三块。任务树与开场画像注入是同仓库的独立配套包，需克隆仓库后用 scripts/install.mjs 装；装本包只会自动带上术语字典（dsh-term-dict），没有任务树时由模型自己写对齐栏。需要 DSH 0.2.1-alpha.1 及以上。'
