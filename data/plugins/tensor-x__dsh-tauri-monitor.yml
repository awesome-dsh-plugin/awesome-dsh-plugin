url: https://github.com/tensor-x/dsh-tauri-monitor
name: tensor-x/dsh-tauri-monitor
category: workflow
description:
  zh: "DSH Desktop 监控插件：通用 HTTP 轮询规则引擎。定时轮询任意接口（可多步骤、变量提取、JS 条件表达式），条件命中才唤醒一个可见的 agent 会话执行任务；未命中零模型调用、零 token 消耗。内置 PMP bug 监控模板（待处理/重新打开的指派 bug 自动开工），也支持自定义任意接口。规则通过导航栏 GUI 面板配置：新建/编辑/启停/测试/立即触发/执行记录，与定时任务插件同款交互体验。"
  en: "Monitor plugin for DSH Desktop: a generic HTTP polling rule engine. Poll any endpoint on schedule (multi-step, variable extraction, JS condition expressions); when conditions hit, wake a visible agent session to act — zero model calls otherwise. Ships a PMP bug template (auto-work on newly assigned open/reopened bugs) plus fully custom rules. Configure everything in a sidebar GUI panel: create/edit/pause/test/fire-now/run history, same UX as the built-in scheduler plugin."
