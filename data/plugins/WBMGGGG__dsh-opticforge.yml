url: https://github.com/WBMGGGG/dsh-opticforge
name: WBMGGGG/dsh-opticforge
category: tools
description:
  en: 'Optical engineering knowledge base. 34 sections, 264 entries: 248 citable fact entries with source attribution plus 16 declared gaps. Foundations (geometric optics, interference and diffraction, polarization, lasers, radiometry and colorimetry, thin films, detection and noise, spectroscopy, interferometry, materials and fabrication), engineering systems (opto-mechanics and alignment, tolerancing and uncertainty, thermal optics, spectral and radiometric calibration, inspection and image processing, COMSOL multiphysics, SolidWorks), frontier topics (metasurfaces and DOEs, photonic integration, quantum optics, hyperspectral imaging, laser triangulation/confocal/lidar). Three tools: section catalogue, BM25 search echoing matched terms and total matches, full-entry retrieval. Zero runtime dependencies, no network access; uncovered topics are reported honestly instead of guessed.'
  zh: '光学工程知识库。34 个板块 264 条条目：248 条带来源的可引用事实条目，另有 16 条明示缺口。基础理论（几何光学、干涉衍射、偏振、激光、辐射度与色度、薄膜、探测与噪声、光谱学、干涉计量、材料工艺）、工程系统（光机装调、公差与不确定度、热光学、光谱与辐射定标、检测与图像处理、COMSOL、SolidWorks）、前沿交叉（超表面与 DOE、光子集成、量子光学、高光谱、激光三角/共焦/激光雷达）。三个工具：板块目录、BM25 检索（回显命中词与命中总数）、整条取用。零运行时依赖、不联网；未覆盖主题如实告知，不编造。'
