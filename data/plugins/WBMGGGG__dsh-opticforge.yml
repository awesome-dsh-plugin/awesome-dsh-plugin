url: https://github.com/WBMGGGG/dsh-opticforge
name: WBMGGGG/dsh-opticforge
category: tools
description:
  en: 'Optical-engineering task assistant. Give it a concrete problem and it returns a staged execution package: a brief with up to three clarifying questions, knowledge-base evidence with chunk IDs and sources, capability routing to local Skills, MCP servers and tools, a per-step plan with actions and fallbacks, targeted search queries, acceptance checks and a Markdown handoff. A pre-delivery checker validates citations, unsupported quantities, assumptions and declared gaps. Evidence layer: 40 sections, 324 source-attributed entries, 308 citable; 16 declared gaps, with only A03, C01 and E01 still missing verbatim standard or white-paper text. Five tools, zero runtime dependencies, no network access; it plans and verifies, it does not execute actions.'
  zh: '光学工程任务辅助。给出一个具体问题，返回可执行的作战包：目标简报与最多三条澄清问题、带 chunk_id 与来源的知识库证据、到本地 Skill/MCP/工具的能力路由、每步动作与降级方案、定向检索词、验收清单和 Markdown handoff；交付前用自检工具核对引用、数量依据、假设与缺口。证据层为 40 个板块 324 条带来源条目，308 条可引用，16 条明示缺口，仅 A03、C01、E01 仍缺原始标准或白皮书条文。共五个工具，零运行时依赖、不联网；它只做规划与自检，不执行动作。'
