name: WBMGGGG/dsh-opticforge
category: tools
description:
  en: 'Optical engineering knowledge base and calculators. Nine sections, 67 entries (51 cited fact entries, 16 declared gaps) covering confocal chromatic sensing, spectrometer assembly, tolerance analysis, DOE gratings, photodiodes and metrology standards. BM25 search echoes matched terms and gap notes; five calculators print formula, substitution and result with units.'
  zh: '光学工程知识库与计算器。9 个板块 67 条条目（51 条带来源事实、16 条明示缺口），覆盖共焦色散、光谱仪搭建、公差分析、DOE 光栅、光电二极管与计量标准。BM25 检索回显命中词并注明缺口；5 个计算器输出公式、代入过程与带单位的结果。'