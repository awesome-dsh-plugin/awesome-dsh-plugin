url: https://github.com/WBMGGGG/dsh-opticforge
name: WBMGGGG/dsh-opticforge
category: tools
description:
  en: 'KB-first optical-engineering task assistant. opticforge_assist aligns a concrete problem with the 40-section / 324-entry knowledge base before any web search. In 3.1.0 it activates up to three task playbooks, fuses their required dimensions (16 playbooks, 98 dimension declarations), retrieves evidence per dimension, and returns a dimension-by-source coverage matrix, a gated plan with dimension IDs and cross-check steps, formula cards and acceptance checks. web_gate allows external search only for declared KB gaps, standard versions, vendor parameters or price timeliness. opticforge_verify checks KB alignment, present-only citations, dimension evidence, cross-relations, source tiering, KB conflicts and 30-day freshness, and reports an adoption gate. Includes 308 concept cards, 6 generic dimensions, 19 formula cards and the opticforge-task DSH Skill. 308 entries are citable; 16 declared gaps remain, limited to A03, C01 and E01 verbatim sources. Five tools, zero runtime dependencies, no calculator, no network access and no action execution by the plugin.'
  zh: 'KB-first 光学工程任务辅助。opticforge_assist 在任何联网检索之前，先把具体问题与 40 个板块、324 条知识库对齐。3.1.0 最多激活 3 个任务剧本，融合其必需维度（16 张主题卡、98 条维度声明），按维度分别取证，并返回“维度×来源”覆盖矩阵、带 dimension_id 与交叉复核步骤的门禁计划、公式卡与验收清单。web_gate 仅在 KB 缺口、标准版本、厂商参数或价格时效条件下放行外部检索。opticforge_verify 检查 KB 对齐、仅引用 present 条目、维度证据、交叉关系、来源分级、KB 冲突与 30 天时效，并给出采信闸门结论。包含 308 张概念卡、6 个通用维度、19 张公式卡与 opticforge-task DSH Skill；308 条可引用，16 条明示缺口仍限于 A03、C01、E01 的原始条文。共五个工具，零运行时依赖、无计算器；插件不联网、不执行动作。'
