url: https://github.com/WBMGGGG/dsh-opticforge
name: WBMGGGG/dsh-opticforge
category: tools
description:
  en: 'Optical engineering knowledge base. 40 sections, 324 entries: 308 citable fact entries with source attribution plus 16 declared gaps. Foundations (geometric optics, interference and diffraction, polarization, lasers, radiometry, thin films, detection and noise, spectroscopy, interferometry, materials), engineering systems (opto-mechanics, tolerancing, thermal optics, spectral calibration, inspection, COMSOL, SolidWorks), frontier topics (metasurfaces, photonic integration, quantum optics, hyperspectral imaging, lidar), and scenario sections: aberration judgement, physical optics and transfer functions, optical testing, design workflow, hyperspectral pushbroom and snapshot systems, Czerny-Turner / Offner / Littrow spectrometer design. Three tools: section catalogue, BM25 search echoing matched terms and total matches, full-entry retrieval. Zero runtime dependencies, no network access; uncovered topics are reported honestly instead of guessed.'
  zh: '光学工程知识库。40 个板块 324 条条目：308 条带来源的可引用事实条目，另有 16 条明示缺口。基础理论（几何光学、干涉衍射、偏振、激光、辐射度、薄膜、探测与噪声、光谱学、干涉计量、材料工艺）、工程系统（光机装调、公差、热光学、光谱定标、检测、COMSOL、SolidWorks）、前沿交叉（超表面、光子集成、量子光学、高光谱、激光雷达），以及场景深化：像差判读、物理光学与传递函数、光学检测、设计流程、高光谱推扫/快照、Czerny-Turner 与 Offner/Littrow 分光系统设计。三个工具：板块目录、BM25 检索（回显命中词与命中总数）、整条取用。零运行时依赖、不联网；未覆盖主题如实告知，不编造。'
