url: https://github.com/WBMGGGG/dsh-opticforge
name: WBMGGGG/dsh-opticforge
category: tools
description:
  en: 'KB-first optical-engineering task assistant. opticforge_assist aligns a concrete problem with the 40-section / 324-entry knowledge base before any web search, then returns a gated execution plan with chunk-ID evidence, local Skill/MCP/tool routing, formula cards and acceptance checks. web_gate allows external search only for declared KB gaps, standard versions, vendor parameters or price timeliness. opticforge_verify checks KB alignment, citations, external-source dates and details, formula_id and calculation traces. Includes 19 formula cards and the opticforge-task DSH Skill. 308 entries are citable; 16 declared gaps remain, limited to A03, C01 and E01 verbatim sources. Five tools, zero runtime dependencies, no calculator, no network access and no action execution by the plugin.'
  zh: 'KB-first 光学工程任务辅助。opticforge_assist 在任何联网检索之前，先把具体问题与 40 个板块、324 条知识库对齐，再返回带 chunk_id 证据、本地 Skill/MCP/工具路由、公式卡与验收清单的门禁执行计划。web_gate 仅在 KB 缺口、标准版本、厂商参数或价格时效条件下放行外部检索。opticforge_verify 检查 KB 对齐、引用、外部来源日期与细节、formula_id 和计算轨迹。包含 19 张公式卡与 opticforge-task DSH Skill；308 条可引用，16 条明示缺口仍限于 A03、C01、E01 的原始条文。共五个工具，零运行时依赖、无计算器；插件不联网、不执行动作。'
