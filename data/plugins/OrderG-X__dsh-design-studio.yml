description:
  en: "Design workbench in the right sidebar. When the model builds web pages, app screens, posters, slides or emails, each HTML file shows up as a screen on a canvas inside a device frame and refreshes when the file changes; local dev servers are proxied with hot reload intact. Click an element or drag a region to put its selector, source file and styles into the composer. It can extract a brand design system from your website or project (colors by role, fonts, type scale, radius, shadows, buttons, inputs and cards) and use it for every new design. The model adds a few tweak sliders to each design (spacing, radius, brand color, layout variants) that update all screens live and write back to the stylesheet in one click. A finished design can be turned into React, Vue, Next.js or plain HTML code, with each built screen diffed pixel by pixel against the design. Also has a design tokens panel, nine style presets, a style panel (font size, colors, radius, padding and more) that writes back to the HTML or hands the change to the model together with the CSS rule and line behind each property, versions saved before and after each turn with drag-to-compare and restore, export to images, PDF and PPTX (links between screens stay clickable), a LAN QR link for viewing on a phone, link arrows and a click-through demo mode, a multi-size view, in-place text editing, reference-image palettes, and a design check (overflowing, clipped or overlapping text, contrast, tap target size and more). Bundles a ui-design skill and six tools: preview_page opens a preview; check_design measures every screen at real sizes in a hidden local Chrome or Edge (bars covering content, script errors, missing assets, dead links; CSS file and line for contrast and font-size issues; cropped screenshots of serious problems); look_design hands real screenshots to the model; extract_design_system builds a design system from a site or project; handoff_design writes a handoff pack (screenshots, routes, tokens, shared components); compare_design diffs the built local page against the design and marks what differs. Adds a Design mode for new sessions (Standard mode's tools plus the skill, the six tools and a design persona); each part has its own switch on the Plugins page. When DSH is opened from a phone or another computer, local-file designs are bundled into a sandboxed frame so they still show."
  zh: "右侧栏的设计工作台。模型做网页、App 界面、海报、幻灯片、邮件时，每个 HTML 文件在画布上显示为一屏，套设备外框，文件一改就刷新；本地开发服务器经代理接入，热更新照常。点一个元素或框一块区域，选择器、源文件和样式就整理进输入框。能从你的官网或项目里提取品牌设计系统（按角色的配色、字体、字号阶梯、圆角、阴影，按钮、输入框、卡片的样子），以后做新设计都照它来；模型给每套设计配几个专属调节滑块（留白、圆角、主色、版式几选一），拖动时所有屏一起变，一键写回样式；做好的设计能转成 React / Vue / Next.js / 纯 HTML 代码，每屏做完和设计稿逐像素对比。另有设计变量面板、九套风格卡、调样式面板（字号、颜色、圆角、内边距等，可以写回 HTML，或连同每项由哪条 CSS 规则、在第几行决定一起交给模型）、每轮对话前后自动存版本（拖动对比、回到某一版）、导出图片 / PDF / PPTX（屏和屏之间的跳转照样能点）、局域网扫码在手机上看、页面跳转箭头和点击演示、多尺寸并排、预览里直接改字、参考图取色，以及设计体检（文字超出、截断、叠在一起，对比度、点击区大小等）。自带 ui-design 技能和六个工具：preview_page 打开预览；check_design 在本机一个看不见的 Chrome / Edge 里按真实尺寸量每一屏（顶栏底栏压住内容、脚本报错、资源没载到、死链；对比度和字号问题写明 CSS 文件和行号；严重问题附局部截图）；look_design 把真实截图交给模型；extract_design_system 从网站或项目提取设计系统；handoff_design 写交接包（每屏截图、路由、设计变量、该抽的组件）；compare_design 把做出来的本机页面和设计稿逐像素比，标出差在哪。新会话可以选「设计模式」（标准模式的工具，加上这个技能、这六个工具和做设计的人设），各部分在插件页里各有开关。从手机或别的电脑打开 DSH 时，本地 HTML 做的设计打包进沙盒框里，照样能看。"
