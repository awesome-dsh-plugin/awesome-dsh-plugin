description:
  en: "Design workbench in the right sidebar. When the model builds web pages, app screens, posters, slides or emails, each HTML file shows up as a screen on a canvas inside a device frame and refreshes when the file changes; local dev servers are proxied with hot reload intact. Click an element or drag a region to put its selector, source file and styles into the composer. Also has a design tokens panel, versions saved before and after each turn with drag-to-compare and restore, image export, a LAN QR link for viewing on a phone, link arrows and a click-through demo mode, a multi-size view, in-place text editing, reference-image palettes, and a bundled ui-design skill plus a preview_page tool. Adds a Design mode for new sessions (Standard mode's tools plus the skill, the preview tool and a design persona); the studio, automatic previews, the tool and skill in other modes, and the Design mode each have their own switch on the Plugins page."
  zh: "右侧栏的设计工作台。模型做网页、App 界面、海报、幻灯片、邮件时，每个 HTML 文件在画布上显示为一屏，套设备外框，文件一改就刷新；本地开发服务器经代理接入，热更新照常。点一个元素或框一块区域，选择器、源文件和样式就整理进输入框。另有设计变量面板、每轮对话前后自动存版本（拖动对比、回到某一版）、导出图片、局域网扫码在手机上看、页面跳转箭头和点击演示、多尺寸并排、预览里直接改字、参考图取色，并自带 ui-design 技能和 preview_page 工具。新会话可以选「设计模式」（标准模式的工具，加上这个技能、预览工具和做设计的人设）；工作台、自动打开预览、其他模式里的工具和技能、设计模式，在插件页里各有开关。"
