description:
  en: "Design workbench in the right sidebar. Its tools sit in floating groups at the canvas corners and a bottom dock with text labels, and a home screen offers one prompt box, recent designs and large template cards. When the home screen's style is Auto, the plugin picks a style card that fits the subject and hands its colors and fonts to the model; your own words, a chosen card, a reference image or a default brand design system take precedence. Each design gets its own folder. When the model builds web pages, app screens, desktop app windows, WeChat mini programs, posters, slides or emails, each HTML file shows up as a screen on a canvas inside a device frame and refreshes when the file changes; while the model writes a page, the sidebar grows with it and a few cursors draw boxes, fill colors and type where it is writing, with a timer in the status bar; local dev servers are proxied with hot reload intact, and an existing HTML file or folder opens by browsing or by dragging it into the sidebar (desktop app). A design library gathers every design you made in any session, your saved inspiration (reference images, URLs, style cards) and a design market of shared templates, design systems and style cards (16 templates, 3 design systems and 20 style cards to start; search, filters, full-size screens and a live view; an offline copy ships with the plugin): start from one in a click, or share your own design to the market after a personal-data scan and an offline design check. Mini program screens get the WeChat capsule in the top-right corner, which turns white over a dark top bar, and the design check flags text and buttons hidden under it. App and mini program screens follow platform layout (status and nav bars, a tab bar of 2 to 5 items, safe areas), desktop app screens get macOS traffic lights or Windows caption buttons, and the design check flags content under the Dynamic Island, the home indicator or the window buttons. Click an element or drag a region to put its selector, source file and styles into the composer, or draw on the preview (pen, highlighter, arrow, box, circle, text) and hand the marked-up screenshot to the model; picks, markup and style changes appear in the composer as small chips while the model still gets the full text. It can extract a brand design system from your website or project (colors by role, fonts, type scale, radius, shadows, buttons, inputs and cards) and use it for every new design. The model adds a few tweak sliders to each design (spacing, radius, brand color, layout variants) that update all screens live and write back to the stylesheet in one click. A finished design can be turned into React, Vue, Next.js or plain HTML code, or for mini programs into uni-app or native WeChat code; existing uni-app (including HBuilderX projects without package.json), Taro and native mini program projects are recognized so new pages go straight in, and each built screen is diffed pixel by pixel against the design. Also has a design tokens panel, twenty style presets (each a live sample screen you can open full size), a style panel (font size, colors, radius, padding and more) that writes back to the HTML or hands the change to the model together with the CSS rule and line behind each property, versions saved before and after each turn with drag-to-compare and restore, export to images, PDF and PPTX (links between screens stay clickable), a LAN QR link for viewing on a phone, link arrows and a click-through try-it mode, a multi-size view, in-place text editing, reference-image palettes, and a design check (overflowing, clipped or overlapping text, contrast, tap target size and more). Bundles a ui-design skill and six tools: preview_page opens a preview; check_design measures every screen at real sizes in a hidden local Chrome or Edge (bars covering content, script errors, missing assets, dead links; CSS file and line for contrast and font-size issues; cropped screenshots of serious problems); look_design hands real screenshots to the model; extract_design_system builds a design system from a site or project; handoff_design writes a handoff pack (screenshots, routes, tokens, shared components); compare_design diffs the built local page against the design and marks what differs. Adds a Design mode for new sessions (Standard mode's tools plus the skill, the six tools and a design persona); each part has its own switch on the Plugins page. When DSH is opened from a phone or another computer, local-file designs are bundled into a sandboxed frame so they still show."
  zh: "右侧栏的设计工作台。工具放在画布四角的浮块和底部工具坞里，按钮都带字；首页一个大输入框直接发，下面是最近的设计和模板大图。首页风格选「自动」时，插件按题材挑一张风格卡，把配色和字体交给模型；你在话里说了风格、手选了风格卡、放了参考图，或者有默认的品牌设计系统，就照你的来。每套设计一个文件夹。模型做网页、App 界面、桌面软件窗口、微信小程序、海报、幻灯片、邮件时，每个 HTML 文件在画布上显示为一屏，套设备外框，文件一改就刷新；模型写页面时右侧栏跟着一段段长出来，几只鼠标在写到的地方拖框、刷色、打字，顶上状态条带计时；本地开发服务器经代理接入，热更新照常；已有的 HTML 文件或文件夹，点「浏览…」或拖进右侧栏就能打开（桌面版）。设计库里有你在各个会话做过的所有设计、收的灵感（参考图、网址、风格卡），还有设计市场：大家分享的模板、设计系统和风格卡（首批 16 套模板、3 套设计系统、20 张风格卡，能搜、能筛、看大图、实时看，插件自带离线目录），点一下就能拿来接着改；自己做的设计查过个人信息、断网体检后也能分享到市场。小程序屏画上微信右上角的胶囊，顶栏是深色时胶囊自动变白，设计体检会查出被胶囊挡住的字和按钮。App 和小程序按平台规矩画（状态栏、导航栏、2–5 项底部标签栏、安全区），桌面软件画上 Mac 红绿灯或 Windows 窗口按钮，体检会查出伸进灵动岛、底部横条或压在窗口按钮上的内容。点一个元素或框一块区域，选择器、源文件和样式就整理进输入框；也能直接在预览上画（画笔、荧光笔、箭头、方框、圆圈、文字），把叠上标注的截图交给模型。点选、标注、调样式放进输入框都是一个小标签，模型照样拿到完整内容。能从你的官网或项目里提取品牌设计系统（按角色的配色、字体、字号阶梯、圆角、阴影，按钮、输入框、卡片的样子），以后做新设计都照它来；模型给每套设计配几个专属调节滑块（留白、圆角、主色、版式几选一），拖动时所有屏一起变，一键写回样式；做好的设计能转成 React / Vue / Next.js / 纯 HTML 代码，小程序能转成 uni-app 或微信原生小程序代码；认得出现有的 uni-app（包括 HBuilderX 建的、没有 package.json 的）、Taro 和原生小程序项目，新页面直接加进去；每屏做完和设计稿逐像素对比。另有设计变量面板、二十套风格卡（每张都是画好的一小屏样板，能点开看原大）、调样式面板（字号、颜色、圆角、内边距等，可以写回 HTML，或连同每项由哪条 CSS 规则、在第几行决定一起交给模型）、每轮对话前后自动存版本（拖动对比、回到某一版）、导出图片 / PDF / PPTX（屏和屏之间的跳转照样能点）、局域网扫码在手机上看、页面跳转箭头和点击试用、多尺寸并排、预览里直接改字、参考图取色，以及设计体检（文字超出、截断、叠在一起，对比度、点击区大小等）。自带 ui-design 技能和六个工具：preview_page 打开预览；check_design 在本机一个看不见的 Chrome / Edge 里按真实尺寸量每一屏（顶栏底栏压住内容、脚本报错、资源没载到、死链；对比度和字号问题写明 CSS 文件和行号；严重问题附局部截图）；look_design 把真实截图交给模型；extract_design_system 从网站或项目提取设计系统；handoff_design 写交接包（每屏截图、路由、设计变量、该抽的组件）；compare_design 把做出来的本机页面和设计稿逐像素比，标出差在哪。新会话可以选「设计模式」（标准模式的工具，加上这个技能、这六个工具和做设计的人设），各部分在插件页里各有开关。从手机或别的电脑打开 DSH 时，本地 HTML 做的设计打包进沙盒框里，照样能看。"
