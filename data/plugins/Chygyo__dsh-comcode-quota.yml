description:
  en: 'Command Code credit monitor for the sidebar: 5-hour, weekly and monthly windows with remaining credit, reset countdown and burn-rate projection, a 75-model price calculator, per-model usage breakdown, and this billing period''s token and request totals. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
