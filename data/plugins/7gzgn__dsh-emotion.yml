url: "https://github.com/7gzgn/dsh-emotion"
name: "dsh-emotion"
category: identity
description:
  en: "Give your agent an external emotion state machine: a few axes (0-100) that drift over time and move when you speak to it. Each turn the plugin injects which band you are in plus which tags you may use. The numbers belong to the plugin — the model cannot read, recompute or argue with them, it only speaks from inside them. Default config is empty: no preset persona."
  zh: "把 AI 的情绪搬到模型外面：几条情绪轴各 0-100，按你说的话加减、随时间自己漂移，每轮把「现在处在哪一档 + 可用标签」注入系统提示。数值只由插件维护，模型自己算不出来也改不了——它只能带着这个状态说话。默认空配置，一个轴都不替你定。"
