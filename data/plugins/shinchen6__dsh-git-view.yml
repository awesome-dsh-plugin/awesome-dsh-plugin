description:
  en: 'Git tab in the DeepSeek Harness conversation view: reviews every repository in the session working directory and commits each on its own, with change groups, whole-file / changes-only / side-by-side diffs, in-panel editing, and a push button that lists every commit it would publish.'
  zh: 'DeepSeek Harness 对话页里的 Git 标签页：列出会话工作目录下的每个仓库并各自独立提交，变更分组，整个文件 / 只看变动 / 并排三种差异看法，面板内直接编辑保存，以及推送前逐一列出将要发布的提交。'
