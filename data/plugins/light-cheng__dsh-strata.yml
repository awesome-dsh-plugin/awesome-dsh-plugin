url: https://github.com/light-cheng/dsh-strata
name: light-cheng/dsh-strata
category: session
description:
  en: 'Layered context management: at each turn end older tool output becomes a deterministic card, the model can fold older ranges into its own summaries in up to three tiers (compress), and every original is archived locally for decompress and search_context. Works alongside DSH-Mem0: superseded runtime-context snapshots (such as recalled memories) are never archived, carded or folded, and are replaced by a one-line placeholder at turn end when the prompt cache is already broken, when the saving outweighs the cache miss, or above 75% of the window; a strataBudget service (pressure, allowance, countTokens) and a strata/fold-landed event are provided for other context plugins; strata_status warns when DSH''s automatic compaction is off or its official summary keeps failing.'
  zh: '分层上下文管理：每轮结束时把较早的工具输出替换成确定性卡片；模型可以用 compress 把较早的范围折叠成自己写的摘要，最多三级；所有原文都存在本地，可用 decompress 和 search_context 取回。可与 DSH-Mem0 同时使用：过期的运行时上下文快照（比如召回的记忆）不存档、不切卡、不折叠；在前缀缓存已经失效、清理的收益超过缓存损失，或上下文超过窗口 75% 时，于轮末换成一行占位；为其他上下文插件提供 strataBudget 服务（pressure、allowance、countTokens）和 strata/fold-landed 事件；DSH 自动压缩没有启用、或官方摘要连续失败时，strata_status 会给出警告。'
