url: https://github.com/mkiea/qq-integration
name: mkiea/qq-integration
category: remote
description:
  en: 'Derivative of cheesehaqi/dsh-qq-onebot-bridge with the same package name, so the two cannot be installed together. Bridges a personal QQ account into DeepSeek Harness over OneBot 11: private and group messages become per-conversation agent sessions and replies are sent back to QQ. Ships a reverse WebSocket server, allowlists (empty = deny all), @ parsing, image and SILK voice handling, and a separate local console on 127.0.0.1:8880 with the decision trace, offline replay, event injection, a read-only preflight and host/Waylay start-stop controls. Needs a separate OneBot v11 implementation (a third-party unofficial QQ client): the default, Waylay, injects into the official Windows QQ.exe (Windows 10/11 x64 only) and is distributed as a separate release archive, not bundled in this repo. botQqAllowed and replayGuardEnabled are edited in DSH Settings > QQ助手, and the replay guard is armed automatically when the logged-in account changes.'
  zh: '基于 cheesehaqi/dsh-qq-onebot-bridge 的衍生版，包名相同，不能与上游同装。通过 OneBot 11 把个人 QQ 接入 DeepSeek Harness：私聊与群聊消息按会话转为 agent 请求，回复发回 QQ。内置反向 WebSocket 服务端、白名单（空名单即全部拒绝）、群内 @ 解析、图片与 SILK 语音处理；另有独立的本地控制台（127.0.0.1:8880），可查看决策链、离线回放、注入事件、做只读体检，并启停 DSH 宿主与 Waylay。需另配 OneBot v11 实现（第三方非官方 QQ 客户端）：默认的 Waylay 注入官方 Windows 版 QQ.exe（仅限 Windows 10/11 x64），并作为单独的发行件提供，不打包在本仓库；botQqAllowed 与 replayGuardEnabled 在 DSH「设置 > QQ助手」面板修改，登录号变化时会自动武装消息重放守卫。'
