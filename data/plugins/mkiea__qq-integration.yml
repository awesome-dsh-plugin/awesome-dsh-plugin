url: https://github.com/mkiea/qq-integration
name: mkiea/qq-integration
category: remote
description:
  en: 'Bridges a personal QQ account into DeepSeek Harness over OneBot 11: private and group messages become per-conversation agent sessions and replies are sent back to QQ. Ships a reverse WebSocket server, allowlists, @ parsing, image and SILK voice handling, and a separate local console on 127.0.0.1:8880 that exposes the decision trace, offline replay, event injection, a read-only preflight, and host/Waylay start-stop controls. The Waylay runtime is distributed as a separate release archive rather than bundled in this repo; botQqAllowed and replayGuardEnabled are editable in the console, and the replay guard is armed automatically when the logged-in account changes.'
  zh: '把个人 QQ 通过 OneBot 11 接进 DeepSeek Harness：私聊与群聊消息按会话转为 agent 请求，回复发回 QQ。内置反向 WebSocket 服务端、白名单、群内 @ 解析、图片与 SILK 语音处理；另有独立的本地控制台（127.0.0.1:8880），可查看决策链、离线回放、注入事件、做只读体检，并启停 DSH 宿主与 Waylay。Waylay 运行时作为单独的发行件提供，不打包在本仓库；botQqAllowed 与 replayGuardEnabled 等配置可在面板修改，登录号变化时会自动武装消息重放守卫。'
