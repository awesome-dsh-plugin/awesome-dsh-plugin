description:
  en: 'Move one DeepSeek Harness conversation to another workspace from the session menu or the command line: it rewrites the session log, the workspace membership and the projection cache together, verifies the result and keeps backups.'
  zh: '在会话菜单或命令行里把一个 DeepSeek Harness 对话搬到另一个工作区：同步改写会话日志、工作区成员表与投影缓存，搬完读回校验并保留备份。'