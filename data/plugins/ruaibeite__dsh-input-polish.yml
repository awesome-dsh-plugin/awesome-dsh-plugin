url: https://github.com/ruaibeite/dsh-input-polish
name: ruaibeite/dsh-input-polish
category: ui
description:
  en: 'A polish button in the composer trailing controls that rewrites the draft in place with the model. Context is matched by topic, not by recency: anchors from the draft (paths, identifiers, quoted text, CJK bigrams) pick the earlier messages about the same task, so a session that interleaves several tasks does not leak another task goal or files into the rewrite — and the prompt explicitly lets the model ignore the extract when it does not fit. The result goes back through the same undo-able editor path a human edit uses. Drafts holding reference chips (@file, folder, session) or a claimed /command, and drafts mid-submission, disable the button instead of silently dropping references.'
  zh: '输入框右下工具区里的 ✨ 按钮，把草稿原地改写成更清楚的请求。上下文按话题挑而不按时间取：从草稿里抽锚点（文件路径、标识符、引号文字、中文二字词），在最近消息里挑同一话题的几条，所以一个会话里夹着多个任务时不会把别的任务的目标或文件带进改写结果；提示词也明确允许模型在上下文不像时完全忽略它。改写走与人工编辑同一条可撤销路径，⌘Z 即可还原。草稿里有引用 chip（@文件、文件夹、会话）或已认领的 /命令、以及正在提交时，按钮禁用 —— 宁可不动，也不悄悄丢掉引用。'
