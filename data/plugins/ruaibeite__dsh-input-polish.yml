url: https://github.com/ruaibeite/dsh-input-polish
name: ruaibeite/dsh-input-polish
category: ui
description:
  en: 'A polish button in the composer trailing controls that rewrites the draft in place with the model: it reads what you typed plus the last few messages of the conversation, and writes the clearer version back through the same undo-able editor path a human edit uses. Drafts holding reference chips (@file, folder, session) or a claimed /command, and drafts mid-submission, disable the button instead of silently dropping references. Uses the conversation own model route; no keys, no config, no extra sandbox permission.'
  zh: '输入框右下工具区里的 ✨ 按钮：把你写的草稿和最近几条消息一起交给模型，改写后的版本原地写回编辑器（与人工编辑同一条可撤销路径，⌘Z 即可还原）。草稿里有引用 chip（@文件、文件夹、会话）或已认领的 /命令、以及正在提交时，按钮禁用 —— 宁可不动，也不悄悄丢掉引用。沿用会话当前的模型路由，不需要额外密钥、配置或权限放宽。'
