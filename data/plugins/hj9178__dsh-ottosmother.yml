description:
  zh: "给模型一份私人词表：用户写「滚木」时按「没有」理解，写「棍母」时按「不存在」理解；模型要表达「没有 / 不存在」时，自己判断是否用这两个词把整句改写得自然通顺，而不是机械替换。插件只注册一个 system prompt 段落，不改写用户输入与模型输出。"
  en: 'Gives the model a private glossary: it reads 「滚木」 as "none" and 「棍母」 as "doesn''t exist", and when it needs to say "there is none" it decides on its own whether to phrase the whole sentence naturally with those words instead of mechanically swapping tokens. Registers a single system-prompt section; user input and model output pass through untouched.'
