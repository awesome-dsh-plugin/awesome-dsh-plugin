description:
  zh: '给模型一份私密黑话词表：用户写「滚木」按「没有」理解、写「棍母」按「不存在」理解；模型要表达这些含义时，自己判断是否用词表里的词把整句组织得自然通顺。只注入一个 system prompt 段落，不改写输入输出；词表存在 glossary.yml 里可自由扩展，并提供提醒强度选项。'
  en: 'Gives the model a private glossary: reads 「滚木」 as "none" and 「棍母」 as "doesn''t exist", and decides on its own whether to phrase a sentence with those words when expressing that meaning. Registers one system-prompt section and rewrites nothing; the word list lives in glossary.yml and is extensible, with a reminder-strength option.'
