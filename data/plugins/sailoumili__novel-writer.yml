description:
  en: 'Installs a multi-agent novel-writing preset for DeepSeek Harness: one conductor agent dispatches five specialized subagents — world-building, plotting, character management, prose writing, and QA review.'
  zh: '为 DeepSeek Harness 安装一个多智能体小说创作预设：一个统筹队长派单五个专职子代理——架构世界、策划剧情、管理人物、执笔写文、质检复核。'
  ja: DeepSeek Harness 向けのマルチエージェント小説執筆プリセットを導入します。1 体の指揮エージェントが、世界観構築・プロット・キャラクター管理・執筆・品質レビューの 5 種の専門サブエージェントに指示を出します。
