url: https://github.com/Bainianzzz/dsh-bg-switcher
name: Bainianzzz/dsh-bg-switcher
category: theme
description:
  en: Adds a Background button above Settings in the sidebar foot that fills the window with one of six preset wallpapers, the theme default, or a custom image URL, remembered across reloads.
  zh: 在侧边栏底部「设置」上方加一个「背景」按钮，可用 6 个预设壁纸、主题默认或自定义图片地址铺满窗口，并记住选择。
