url: https://github.com/lildanger/dsh-skin-win2000
name: lildanger/dsh-skin-win2000
category: theme
description:
  en: 'Windows 2000 desktop skin for the DSH Web GUI: metric-accurate grey chrome, two-tone gradient title bars, 1px bevels, square corners, 16px scrollbars, and the pixel font it renders with served by its own host route.'
  zh: '给 DSH Web GUI 换上 Windows 2000 桌面外观：按度量表还原的灰色控件、双色渐变标题栏、1px 立体边框、直角、16px 滚动条，以及由插件自身路由提供的点阵字体。'
