url: https://github.com/58fly/dsh-language-guard
name: 58fly/dsh-language-guard
category: identity
description:
  en: 'Locks the model''s reasoning and reply language to a chosen target language (Simplified Chinese by default) with system-prompt sections at the head, middle and tail of the prompt, offering three strength levels, an auto mode that follows the DSH interface language, and a settings panel plus a sidebar quick switch.'
  zh: '把模型的思考过程与回复语言锁定为指定语言（默认简体中文）：在 system prompt 首、中、尾注入约束段落，提供基础、强化、周期三档强度，可跟随 DSH 界面语言自动选择，并带设置页配置卡片与侧栏快速切换。'
