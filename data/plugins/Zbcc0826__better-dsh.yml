url: https://github.com/Zbcc0826/better-dsh
name: Zbcc0826/better-dsh
category: tools
description:
  en: "A local DeepSeek Harness plugin (package `dsh-friction-drive`, repository `Zbcc0826/better-dsh`, not published to npm). It records tool failures, same-argument retries, and results with truncation markers in the current session. Once crossed, the next direct call does not run and waits for the user to choose via `friction_choose`, and the user can also pause the session. Replacement tools and compiled procedures are installed only after user approval, while original tool definitions stay unchanged. `dsh-friction-drive` registers only these 10 tools: `friction_status`, `friction_choose`, `friction_pause`, `propose_quality_loop`, `record_quality_critique`, `record_quality_plan`, `propose_tool_goal`, `apply_tool_change`, `restore_tool_definition`, and `propose_compiled_procedure`. The same bundle also installs `dsh-friction-demo`, which registers 3 sample tools (`ledger_lookup`, `fx_convert`, `window_overlap`); they are sample tools only, not a ledger product. This repository is Zbcc0826/better-dsh, not pgmi-builds/better-dsh."
  zh: "DeepSeek Harness 本地插件（包名 `dsh-friction-drive`，仓库 `Zbcc0826/better-dsh`，不发布到 npm）。插件记录当前会话里工具的失败、同参数重试和带截断标记的结果；过线后下一次直接调用不执行，等待用户通过 `friction_choose` 选择，也可由用户暂停当前会话。替代工具和沉淀程序只在用户同意后安装，原工具定义不改。`dsh-friction-drive` 只注册这 10 个工具：`friction_status`、`friction_choose`、`friction_pause`、`propose_quality_loop`、`record_quality_critique`、`record_quality_plan`、`propose_tool_goal`、`apply_tool_change`、`restore_tool_definition`、`propose_compiled_procedure`。同一个 bundle 还会装上 `dsh-friction-demo`，注册 3 个示例工具：`ledger_lookup`、`fx_convert`、`window_overlap`，它们只是示例，不是账本产品。这个仓库是 Zbcc0826/better-dsh，不是 pgmi-builds/better-dsh。"
