url: https://github.com/QIRSHENG/dsh-tray-restart
name: QIRSHENG/dsh-tray-restart
category: ui
description:
  en: 'Adds Restart App and Host and Reload Page items to the Windows system tray of the official DSH desktop app by patching app.asar in place, and re-applies that patch after each desktop update. Official DSH desktop app 0.2.x on Windows only.'
  zh: '给官方桌面端的 Windows 系统托盘加「重启应用与 Host」和「刷新页面」两项（原位修改 app.asar），并在桌面端每次更新覆盖后自动重打补丁。仅 Windows 官方桌面端 0.2.x。'
