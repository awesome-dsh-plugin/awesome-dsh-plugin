url: https://github.com/niszhum/dsh-compact-codex
name: niszhum/dsh-compact-codex
category: session
description:
  en: 'Replaces the dsh compaction backend with a Codex-style window reset: the checkpoint is a handoff assembled from the session log by code, not a model-written summary, so a reset costs no summarization calls. A task ledger with a two-check gate keeps intent, next steps and the files still in play across resets, and a new_context tool lets the model reset on its own. Re-declares the four built-in agent presets (standard, ptc, minimal, cordis) exactly as shipped in dsh 0.2.2-rc.1, so re-run sync-presets.mjs after a dsh upgrade; idle cache keepalive is on by default and sends real requests that use quota (keepalive: false turns it off).'
  zh: '以代码从会话日志拼出的交接信息替换 dsh 的压缩后端，采用 Codex 风格的换窗方式：检查点不经过模型摘要，换窗不产生摘要调用。任务账本与换窗前两道门槛让意图、下一步与仍在改动的文件跨窗口留存，模型也可以用 new_context 工具自行换窗。整份重述四个内置 agent preset（与 dsh 0.2.2-rc.1 官方版本一致，升级 dsh 后需重跑 sync-presets.mjs）；空闲缓存保活默认开启，会发真实请求消耗额度（keepalive: false 可关）。'
