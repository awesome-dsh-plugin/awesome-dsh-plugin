url: https://github.com/kinmat-A/dsh-theme-switch
name: kinmat-A/dsh-theme-switch
category: market
description:
  en: 'One-click skin switching for DSH Web settings: auto-detects installed themes, keeps exactly one active at a time, and falls back to the official look when all are off. Changes apply instantly and survive restarts.'
  zh: DSH 主题切换：自动检测已安装的皮肤/主题，在设置页一键互斥切换，全部停用时回退官方默认外观，切换即时生效并跨重启保留。
  ja: DSH Web の設定からワンクリックでスキンを切り替え。インストール済みのテーマを自動検出し、常に 1 つだけを有効に保ち、すべて無効にすると公式の見た目に戻ります。変更は即座に反映され、再起動後も保たれます。
