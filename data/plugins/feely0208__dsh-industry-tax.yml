name: feely0208/dsh-industry-tax
category: security
description:
  en: 'Keyword-rule scan of a project directory for tax-industry compliance gaps ahead of regulatory audits: accounting voucher and ledger retention set under 30 years, invoice-title lines with no taxpayer ID, tax data leaving China with no security assessment or standard contract mentioned, and e-invoice lines with no verification or de-duplication mentioned, with rule sources kept in rules/.'
  zh: '稽查前对项目目录做财税行业专项体检（关键词规则扫描）：会计凭证与账簿保存期配置低于 30 年、开票信息缺纳税人识别号、税务数据出境未提及安全评估或标准合同、电子发票未提及验真或查重，规则出处保留在 rules/。'