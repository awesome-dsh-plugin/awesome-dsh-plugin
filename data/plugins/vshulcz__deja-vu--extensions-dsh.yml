url: https://github.com/vshulcz/deja-vu/tree/main/extensions/dsh
name: vshulcz/deja-vu#extensions/dsh
category: memory
description:
  en: 'Cross-session memory and context recovery across forty-five other coding agents (45+) on this machine, reading session files they already wrote before install (Claude Code, Codex, Cursor, Windsurf, Trae, Antigravity, VS Code Copilot Chat, opencode, OpenClaw, Hermes, Kimi, Qoder, Cline, Zed, Magpie and more): six tools (deja_recall, deja_session, deja_blame, deja_fix, deja_how, deja_remember), a /deja command, and optional automatic recall injected into runtime context. Local BM25 CLI/MCP index, no LLM, no embeddings, no network (dsh plugin --profile web add dsh-deja).'
  zh: '跨会话长期记忆与上下文恢复：读取本机上其他四十五个（45+）编程智能体已经写下的会话文件，支持安装前历史找回与中断恢复（Claude Code、Codex、Cursor、Windsurf、Trae、Antigravity、VS Code Copilot Chat、opencode、OpenClaw、Hermes、Kimi、Qoder、Cline、Zed、Magpie 等）：提供 deja_recall、deja_session、deja_blame、deja_fix、deja_how、deja_remember 六个工具与 /deja 命令，并可选地把召回结果加入运行时上下文。共享本地 BM25 CLI/MCP 索引，不用大模型，不用向量嵌入，不联网（dsh plugin --profile web add dsh-deja）。'
