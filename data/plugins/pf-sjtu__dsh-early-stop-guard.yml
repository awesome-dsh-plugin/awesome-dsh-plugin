url: https://github.com/pf-sjtu/dsh-early-stop-guard
name: pf-sjtu/dsh-early-stop-guard
category: agi
description:
  en: 'Keeps a DSH agent turn open when the model ends it by narrating work it has not done: on agent/turn-stopping the guard replays the turn log and classifies the trailing message with regexes — in the default mode wait / ask / done / gray end the turn with no model call, and only a promise of pending work reaches the judge — then has a judge chain of four dialects (System One three-question noul, OpenAI-compatible, OpenAI Decisions, or the session LLM) rule on whether the turn is really over, and steers the same turn with agent.steer when it is not.'
  zh: '模型叙述了「接下来要做什么」却什么都没做就结束回合时，保住 DSH 的 agent 回合：插件在 agent/turn-stopping 回放该回合日志，用正则分类末条消息——默认模式下 wait / ask / done / gray 直接结束回合、不调模型，只有承诺了未完成工作的消息才交给裁判——再由四种裁判方言组成的链（System One 三题 noul、OpenAI 兼容、OpenAI Decisions 或当前会话 LLM）判定回合是否真的结束，未结束就用 agent.steer 推进同一回合。'
