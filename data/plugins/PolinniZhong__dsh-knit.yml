url: https://github.com/PolinniZhong/dsh-knit
name: PolinniZhong/dsh-knit
category: docs
description:
  en: "Task-aware workspace context retrieval and lifecycle tracking for AI coding agents. Knit finds, organizes and tracks the workspace context the current task actually needs: it scans the documents, source files, images and video that already exist anywhere in the session workspace and ranks them in the DSH sidebar by relevance to the current conversation — local IDF-weighted string matching over title, summary and body, with no model calls and no network. A rank number on the left shows where each item sits in the whole ordering, and the list is split into three tiers that state a reading order — primary (look here first), supporting (it backs the answer), related (background) — with the reason each row was picked shown beside it. Since v0.19 source code is a first-class citizen alongside Markdown: common .js/.ts/.py extensions go through the same retrieval, the same tiers and the same read evidence, and one click opens an in-place code preview with line numbers. The same Context Pack is exposed to the agent as a knit_docs tool. v0.16–v0.18 added the layer after that: attribution is frozen at the moment of reading, so the panel can answer 'of the things it ranked, did the agent actually read them, and did the workspace change afterwards?'. It is not a recent-files list and not a code browser — it answers which things in this project are worth looking at first for the task at hand, and what happened to them after they were read. Fully local, deterministic, nothing leaves the machine."
  zh: "面向 AI Coding Agent 的任务感知工作区上下文检索与生命周期追踪。Knit 把当前任务真正需要的工作区上下文找出来、组织好，并持续追踪：它扫描会话工作区里已有的文档、源码、图片与视频，在本地按与当前对话的相关性排序（标题、摘要、正文上带 IDF 加权的字符串匹配，零模型调用、零网络）。列表左边是这一项在整份排序里的名次，并分成三层给出阅读顺序 —— 主要上下文（该先看的）、辅助上下文（支撑的）、相关上下文（背景），逐条标出入选理由。v0.19 起源码与 Markdown 一样是一等公民：常见的 .js/.ts/.py 等后缀进入同一套检索、同一套分层、同一套读取证据，点一行即可就地看带行号的代码预览。同一份 Context Pack 也作为 knit_docs 工具交给 agent。v0.16–v0.18 补的是再往后那一层：归因在读发生那一刻冻结，所以面板能回答「排出来的这些，agent 到底读了没有、读完工作区变没变」。它既不是「更聪明的最近文件列表」，也不是代码浏览器 —— 它回答的是「当前这个任务，项目里哪些东西最值得先看，以及看过之后事情变成了什么样」。纯本地、确定性，内容不出本机。"
