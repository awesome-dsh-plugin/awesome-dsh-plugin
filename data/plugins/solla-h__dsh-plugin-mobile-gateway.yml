url: https://github.com/solla-h/dsh-plugin-mobile-gateway
name: solla-h/dsh-plugin-mobile-gateway
category: remote
description:
  en: 'Mobile gateway plugin that pairs DSH Mobile App with a self-hosted DeepSeek Harness host over an authenticated WebSocket. Fork of Clarklevis1995/dsh-plugin-mobile-gateway (same package name, install only one) that adds an optional encrypted address book deployed to your own Cloudflare account as a Worker with wrangler, an experimental WebRTC P2P transport, and a public-DoH fallback for its endpoint check.'
  zh: '让 DSH Mobile App 通过认证的 WebSocket 与自托管 DeepSeek Harness 宿主配对的手机网关插件。Clarklevis1995/dsh-plugin-mobile-gateway 的分支（包名相同，只能装其中一个），新增可选的加密地址簿（用 wrangler 部署成你自己 Cloudflare 账号下的 Worker）、实验性的 WebRTC P2P 传输，以及端点检查时回退到公共 DoH。'
