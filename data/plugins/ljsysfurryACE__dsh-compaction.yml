name: ljsysfurryACE/dsh-compaction
category: memory
description:
  en: Compaction backend replacing LLM summarization with a deterministic semantic extractor (keeps code/paths/commands, drops chatter) plus 28.4x KV-compression accounting.
  zh: 压缩后端：用确定性语义提取器替换 LLM 摘要（保留代码/路径/命令，剔除闲聊），附带 28.4x KV 压缩记账。
  ja: コンパクションのバックエンドを、LLM による要約から決定論的な意味抽出（コード/パス/コマンドは残し、雑談は落とす）に置き換えます。28.4 倍の KV 圧縮の計上も行います。
