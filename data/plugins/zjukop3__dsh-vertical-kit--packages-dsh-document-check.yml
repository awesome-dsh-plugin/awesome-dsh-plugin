name: 'zjukop3/dsh-vertical-kit#dsh-document-check'
category: 'docs'
description:
  en: 'One agent tool, 31 document checks: the model verifies a document it produced against a genre''s structural rules before delivering it, and gets findings with rule ids and line numbers instead of a document a person has to re-read. The 31 checks existed only as HTTP endpoints — a person had to remember to POST, and an agent had no reason to; a tool is the layer a model can see and decide to call, which is what makes "check it before you hand it over" something that can actually happen. One tool rather than 31, because twenty-seven definitions crowd the prompt and a model cannot tell adr_check from spec_doc_check in its first ten minutes: the genre choice stays in the document it just wrote. It carries no rules of its own, calls each check''s exported linter directly, runs locally with no network, no model calls and no port, and answers in 59 ms for all 31 checks measured on 2026-11-23. At most 25 findings per call, with truncation stated, because a checker that dumps two hundred findings into the context gets switched off. Structural only: it says an ADR has a consequences section, never that the consequence is acceptable. The HTTP routes the sibling checks register have no DSH access check, so a web page open in your browser could call them.'
  zh: '一条 agent 工具，31 个文档检查：模型在交付前把写好的文档按文体自查一遍，拿回带规则名和行号的发现，而不是把文件交给人再读一遍。这 31 个检查原来只有 HTTP 端点——人得记得去 POST，agent 没有理由调用；工具是模型能自己看见、自己决定调用的那一层，所以「交付前先查一遍」这件事才可能真的发生。做成一条而不是 31 条：27 条定义会挤占上下文，而模型在前十分钟里分不清 adr_check 与 spec_doc_check——genre 留在它刚写完的那份文档里选。它自己不带规则，直接调每个检查导出的判定函数；本地跑，不联网、不调模型、不占端口，2026-11-23 实测 31 个检查全跑一遍共 59 毫秒。每次最多回 25 条并显式标注截断——把两百条灌进上下文的检查器会被关掉。只判结构：它说这份 ADR 有「后果」段，从不说这个后果可以接受。兄弟检查注册的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
