description:
  en: "Stores oversized image attachments byte-for-byte as generic files and hands the model their saved paths, instead of rejecting the whole prompt over the per-side vision limit."
  zh: "超过视觉单边上限的图片不再让整条消息被拒收：按原始字节存为普通文件，把保存路径交给模型自行查看或转换。"
