url: https://github.com/dolacmeo/dsh-restart-and-update
name: dolacmeo/dsh-restart-and-update
category: market
description:
  en: 'Sidebar plugin updates with publish dates: each update pins an exact version and re-reads the installed manifest to confirm it landed, and updates whose new code needs a full relaunch are counted on a restart button — whose replacement process is started through WMI so it inherits no console. The full relaunch is Windows desktop only; the in-page GUI reload works on any platform.'
  zh: '在侧栏更新插件并显示发布时间：锁定精确版本，装完回读磁盘清单确认已到位；需要完全重启才生效的更新会计到重启按钮上，而完全重启经 WMI 拉起替代进程，新进程不继承任何控制台。完全重启仅在 Windows 桌面端可用，页面内 GUI 重载各平台都能用。'
