url: https://github.com/yhm138/dsh-btw
name: yhm138/dsh-btw
category: ui
description:
  en: 'Antigravity-style /btw side questions for DSH: during a task, one question starts a disposable forked child agent with the full tool set, answers in Markdown inside its own right-Sidebar tab (with tool calls and follow-ups), and leaves the main conversation and its model context untouched. Follow-up history is rebuilt from the session log, so it survives a plugin reload.'
  zh: 'DSH 的 Antigravity 风格 /btw 侧问：任务进行中问一句，由一个临时 fork 的子 agent 带着完整工具去查证，答案以 Markdown 呈现在右侧栏自己的页签里（可追问、可查看工具调用），主对话与模型上下文完全不受影响；追问历史从会话日志重建，插件重载后仍能接上。'
icon: https://raw.githubusercontent.com/yhm138/dsh-btw/main/assets/icon-180.png
