url: https://github.com/yhm138/dsh-btw
name: yhm138/dsh-btw
category: ui
description:
  en: 'Antigravity-style /btw side questions for DSH: during a task, one question starts a disposable forked child agent with the full tool set, answers in its own right-Sidebar tab (tool calls and permission prompts included), and leaves the main conversation and its model context untouched.'
  zh: 'DSH 的 Antigravity 风格 /btw 侧问：任务进行中问一句，由一个临时 fork 的子 agent 带着完整工具在右侧栏自己的页签里作答（工具调用与审批都在那里），主对话与模型上下文完全不受影响。'
icon: https://raw.githubusercontent.com/yhm138/dsh-btw/main/assets/icon-180.png
