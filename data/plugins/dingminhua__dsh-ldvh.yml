description:
  en: 'A DSH-native AI collaboration governance framework: spec-and-fact backed recall, controlled fact writes, and Git-guarded commits. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 原生 AI 协作与治理框架：以规范与事实为据的双源召回、受控事实写入与 Git 守护提交。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
