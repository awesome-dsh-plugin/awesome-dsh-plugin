url: https://github.com/logghT/dsh-today-eat
name: logghT/dsh-today-eat
category: usage
description:
  en: 'A diet assistant for DSH: taste and nutrition profile, nine goal/scene meal phases with subgoals, meal reminders, nearby restaurant search, 1,000 locally-authored recipes with shopping lists, weekly planning, and a local meal log. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 饮食管家：口味与营养档案、九种目标/场景饮食阶段与子目标、饭点提醒、附近餐厅搜索、1000 道本地原创菜谱与采买清单、周计划，以及只存本机的饮食记录。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/logghT/dsh-today-eat/main/assets/icon.png
