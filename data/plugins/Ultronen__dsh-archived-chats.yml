name: Ultronen/dsh-archived-chats
category: session
description:
  en: 'Session Archive for DeepSeek Harness safely bulk-archives eligible workspace conversations, groups archived chats by workspace with full-text search and native read-only preview, and adds tags, notes, ZIP backup and restore, a snapshot-protected Recycle Bin, storage accounting, preview-first Recycle Bin retention, read-only session lineage, and access to preserved legacy recovery data; all data stays local.'
  zh: 'DeepSeek Harness 会话档案：安全批量归档工作区中符合条件的会话，按工作区浏览和全文搜索归档聊天，提供原生只读预览、标签备注、ZIP 备份恢复、带保护快照的回收站、空间分账、预览优先的回收站保留策略、只读会话血缘和已有旧版数据恢复入口；所有数据留在本机。'
