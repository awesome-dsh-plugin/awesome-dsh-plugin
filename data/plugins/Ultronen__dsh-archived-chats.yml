url: https://github.com/Ultronen/dsh-archived-chats
name: Ultronen/dsh-archived-chats
category: session
description:
  en: 'Session Archive for DeepSeek Harness: browse archived chats by workspace, full-text search conversation content, and natively preview messages, tool activity, and stored images read-only; manage tags and notes, and export JSON + Markdown ZIP backups with preview-first import restore. History keeps validated versions after archive and before recycle for read-only preview, restore-as-copy, confirmed deletion, or clear-history. A snapshot-protected Recycle Bin offers undo, two-tier restore, and explicit permanent deletion. Storage accounting separates archived/recycled sessions and protection snapshots, flagging unavailable bytes and repeated snapshot attachments; preview-first retention plans history count, snapshot age/quota, and recycle age with separate save/apply. Read-only session lineage shows forks/subagent trees and relationship diagnostics. All data stays local.'
  zh: 'DeepSeek Harness 会话档案：按工作区浏览归档聊天、全文搜索对话正文，并以原生只读预览展示消息、工具活动与已存储图片；支持标签备注，以及 JSON + Markdown ZIP 备份导出和预览优先的导入恢复。历史版本会在归档后、移入回收站前保存已验证版本，可只读预览、恢复为副本、确认单条删除或清空历史。带保护快照的回收站支持撤销、两级恢复和明确永久删除。空间分账区分归档/回收会话与保护快照，标出无法统计项和重复快照附件；预览优先的保留策略按历史数、快照年龄/容量和回收站年龄规划，保存与执行分离。只读会话血缘展示分叉/子代理树及关系诊断。所有数据留在本机。'
