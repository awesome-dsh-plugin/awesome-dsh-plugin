description:
  en: 'Manage archived and unarchived chats with search, previews, tags and notes, workspace archiving, ZIP backups, selected actions, global recycling, Recycle Bin recovery, storage and retention, origins and branches, and automatic residual chat checks.'
  zh: '管理已归档与未归档会话，支持搜索、预览、标签备注、工作区归档、ZIP 备份、选择操作、全局回收、回收站恢复、空间与保留策略、来源分支和自动残留会话检查。'
