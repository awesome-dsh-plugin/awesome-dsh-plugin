description:
  en: 'Search and manage archived and unarchived chats with read-only previews, tags and notes, workspace archiving, ZIP backups, origins and branches, manual residual-chat checks and automatic update checks. Retains legacy Recycle Bin recovery without automatic cleanup.'
  zh: '管理已归档与未归档会话，支持搜索、只读预览、标签备注、工作区归档、ZIP 备份、来源分支、手动残留会话检查和自动检查更新；保留旧回收记录恢复，停用自动清理。'
