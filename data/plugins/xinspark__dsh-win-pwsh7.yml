url: https://github.com/xinspark/dsh-win-pwsh7
name: xinspark/dsh-win-pwsh7
category: dev
description:
  en: Reports which PowerShell the DSH pwsh executor actually runs (enabled rows only; version-numbered Store paths are never recommended as pins), and installs a Store-managed PowerShell 7 through a scripted Store-page click or the manual Store path. Allows the pwsh tool only when the live executor resolves PowerShell 7+, and when dsh-ops is installed keeps the native pwsh beside ops_bash by enabling Compatibility and hiding duplicate official tools. Native status card and configuration switch in the Web UI; Windows only, no runtime dependencies.
  zh: 报告 DSH 的 pwsh 执行器实际运行的 PowerShell（只认启用中的行，带版本号的商店路径不会被推荐为 pin），并通过脚本点击商店页面或手动商店路径安装由商店管理的 PowerShell 7。只有实际执行器解析到 PowerShell 7+ 时才放行 pwsh 工具；检测到 dsh-ops 时启用其 Compatibility 模式，保留原生 pwsh 与 ops_bash 并存，并隐藏重复的官方工具。Web 界面提供原生状态卡片和配置开关；仅 Windows，零运行时依赖。
