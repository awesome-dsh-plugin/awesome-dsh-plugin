url: https://github.com/xinspark/dsh-win-pwsh7
name: xinspark/dsh-win-pwsh7
category: dev
description:
  en: Reports which PowerShell the DSH pwsh executor actually runs (enabled rows only; version-numbered Store paths are never recommended as pins), and installs a Store-managed PowerShell 7 through a scripted Store-page click or the manual Store path. Allows the pwsh tool only when the live executor resolves PowerShell 7+, with two host tools and a prompt section plus a native status card and overridePath configuration in the Web UI; Windows only, no runtime dependencies.
  zh: 报告 DSH 的 pwsh 执行器实际运行的 PowerShell（只认启用中的行，带版本号的商店路径不会被推荐为 pin），并通过脚本点击商店页面或手动商店路径安装由商店管理的 PowerShell 7。只有实际执行器解析到 PowerShell 7+ 时才放行 pwsh 工具；宿主侧两个工具加提示词区段，Web 界面是原生状态卡片与 overridePath 配置；仅 Windows，零运行时依赖。
