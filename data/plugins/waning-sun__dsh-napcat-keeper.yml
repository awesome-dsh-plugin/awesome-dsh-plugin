url: https://github.com/waning-sun/dsh-napcat-keeper
name: waning-sun/dsh-napcat-keeper
category: tools
description:
  en: 'Keeps the NapCat QQ backend alive next to DSH: probes the OneBot 11 HTTP port at startup, launches NapCat when the port does not answer, then rechecks every 45 seconds, kills duplicate process chains, hides the console window, can create a logon scheduled task when a task name is set, and adds a settings page plus napcat_status, napcat_restart and napcat_dedupe tools. Optionally remembers the QQ password, behind a risk confirmation, so an expired fast-login token can be renewed without scanning a QR code. Windows only; without that scheduled task the launched QQ exits together with DSH.'
  zh: '让 NapCat 这个 QQ 后端跟着 DSH 一起活着：启动时探测 OneBot 11 的 HTTP 端口，连不上就拉起 NapCat，之后每 45 秒复查、清掉重复的进程链、隐藏控制台窗口、可在填写任务名后创建登录计划任务，并提供设置页以及 napcat_status、napcat_restart、napcat_dedupe 三个工具。可选记住 QQ 密码（默认关闭，开启前需确认风险），让失效的快速登录令牌不用扫码也能自己续上。仅 Windows；不建计划任务时，拉起的 QQ 会随 DSH 一起退出。'