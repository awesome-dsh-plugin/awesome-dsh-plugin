description:
  en: 'Cost governance for DeepSeek Harness: aggregated token/cost metering per model, session and day, session/daily/monthly budget caps with threshold alerts (webhook + desktop notification), alert/block/degrade over-limit policies, carbon footprint estimation, per-model latency benchmarks, a Settings budget tab, and the /budget command.'
  zh: 'DSH 成本治理：按模型/会话/日聚合 token 与成本计量，会话/日/月预算上限与阈值告警（webhook + 桌面通知），alert/block/degrade 三种超限策略，碳足迹估算与分模型延迟基准，设置页预算页签与 /budget 命令。'
