description:
  en: 'Black-box GUI testing for DeepSeek Harness: an AI tester drives a real Windows virtual machine using only screenshots and mouse/keyboard, so its verdicts rest on pixels instead of logs or source code. Ships the dsh-vm-tester plugin with seven vm_* tools (status, screenshot, click, type, key, basic key, wait), a reverse-tunnel guest agent for Windows, and run verification scripts.'
  zh: '面向 DeepSeek Harness 的黑盒 GUI 测试：AI 测试员只靠截图与键鼠操作真实 Windows 虚拟机，判定必须由像素支撑，而不是读日志或源码。包含 dsh-vm-tester 插件的七个 vm_* 工具（状态、截图、点击、输入、按键、普通键、等待）、Windows 虚拟机内的反向隧道代理，以及运行体检与围观脚本。'
