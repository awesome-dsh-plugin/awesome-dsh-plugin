url: https://github.com/Vhow123/dsh-prompt-forge
name: Vhow123/dsh-prompt-forge
category: ui
description:
  en: 'Image-generation prompt workshop in the sidebar panel list, working in three directions that share one result. Idea to prompt: pick a target dialect, a style and an aspect, write one rough sentence, and a chat model returns an 11-field shot breakdown that the plugin stitches into the syntax that dialect actually accepts — six dialects (natural English, natural Chinese, GPT-Image, Midjourney, Stable Diffusion, nano-banana), 18 style presets, negative prompts, filler-word stripping and local history. Image to prompt: drop a reference image and a vision model reverse-engineers the same fields. Prompt to prompt: type one line such as "light turns to dusk" and only the named fields are rewritten, everything else is copied verbatim. Prompt to image: the result card can render a preview through a locally installed image-generation plugin. The first two directions are also exposed as the `optimize_image_prompt` and `patch_image_prompt` agent tools. Renders can pick the image channel and model, one of eight aspect sizes or follow-the-aspect, and quality at 1K/2K/4K; a preview opens into a lightbox with pointer-centred wheel zoom from 20% to 800%, drag-to-pan, double-click reset and one-click save. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '侧边栏面板里的生图提示词工坊，三个方向共用同一份结果。想法→词：选好目标方言、视觉风格与画幅，写一句人话，对话模型输出 11 字段的画面拆解，插件再拼成该方言真正认的语法——六种方言（自然英文、自然中文、GPT-Image、Midjourney、Stable Diffusion、nano-banana）、18 种风格预设、负向提示词、废词清理与本地历史。图→词：拖一张参考图进去，视觉模型反推出同一套字段。词→改词：写一句「光线换成黄昏」，只重写被点名的字段，其余逐字保留。词→图：结果卡片可调用本机已装的生图插件直接出预览图。前两个方向同时以 `optimize_image_prompt` 与 `patch_image_prompt` 智能体工具提供。出预览图时可选出图渠道与模型、八个比例或跟随画幅、清晰度 1K/2K/4K；点开大图支持以指针为中心的滚轮缩放（20%–800%）、拖动平移、双击复位与一键保存。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
