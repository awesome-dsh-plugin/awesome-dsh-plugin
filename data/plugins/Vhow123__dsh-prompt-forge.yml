url: https://github.com/Vhow123/dsh-prompt-forge
name: Vhow123/dsh-prompt-forge
category: ui
description:
  en: 'Image-generation prompt workshop in the sidebar panel list, working in four directions that share one result. Idea to prompt: pick a target dialect, a style and an aspect, write one rough sentence, and a chat model returns an 11-field shot breakdown that the plugin stitches into the syntax that dialect actually accepts — six dialects (natural English, natural Chinese, GPT-Image, Midjourney, Stable Diffusion, nano-banana), 18 style presets, negative prompts, filler-word stripping and local history. Image to prompt: drop a reference image and a vision model reverse-engineers the same fields. Prompt to prompt: type one line such as light turns to dusk and only the named fields are rewritten, everything else is copied verbatim. Prompt to image: the result card, or the panel itself before any optimization has run, renders through a locally installed image-generation plugin or through an OpenAI-compatible endpoint you add in the panel, whose key stays on disk and is never echoed back to the browser; with a main image attached it posts to /images/edits and carries up to four extra references, with only text it posts to /images/generations. A reference library of 4,345 Chinese-labelled entries — 1,439 poses with matching depth maps, 1,407 outfits, 1,499 portraits — is searched and faceted by pose system, angle, category, season, hair length and hairstyle, paged 24 at a time, and the entries you pick are injected into the prompt as binding constraints. Renders can pick the image channel and model, one of eight aspect sizes or follow-the-aspect, and quality at 1K/2K/4K; a preview opens into a lightbox with pointer-centred wheel zoom from 20% to 800%, drag-to-pan, double-click reset and one-click save. The first two directions and the library are also exposed as the optimize_image_prompt, patch_image_prompt and search_reference_gallery agent tools. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '侧边栏面板里的生图提示词工坊，四个方向共用同一份结果。想法→词：选好目标方言、视觉风格与画幅，写一句人话，对话模型输出 11 字段的画面拆解，插件再拼成该方言真正认的语法——六种方言（自然英文、自然中文、GPT-Image、Midjourney、Stable Diffusion、nano-banana）、18 种风格预设、负向提示词、废词清理与本地历史。图→词：拖一张参考图进去，视觉模型反推出同一套字段。词→改词：写一句「光线换成黄昏」，只重写被点名的字段，其余逐字保留。词→图：结果卡片、甚至一次优化都没跑过的面板本身，都能经本机已装的生图插件出图，也能经你在面板里自填的 OpenAI 兼容端点出图，密钥落盘保存、不回传给浏览器；带主图时走 /images/edits 并最多附带四张参考图，只有文字时走 /images/generations。另有 4,345 条中文标注的参考库——1,439 条姿势（配同源深度图）、1,407 套服装、1,499 位人像——可按姿势体系、角度、分类、季节、发长与发型分面检索，每次翻 24 条，选中的条目会作为硬约束注入提示词。出预览图时可选出图渠道与模型、八个比例或跟随画幅、清晰度 1K/2K/4K；点开大图支持以指针为中心的滚轮缩放（20%–800%）、拖动平移、双击复位与一键保存。前两个方向与参考库同时以 optimize_image_prompt、patch_image_prompt 与 search_reference_gallery 三个智能体工具提供。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
