name: reygreen1/dsh-theme-phantom-blade-zero
category: theme
description:
  en: 'An ink-and-blood theme for the DSH Web GUI after 影之刃零 (Phantom Blade Zero): a light and a dark palette, the key art as the conversation canvas, drifting maple leaves, rain, and a palette switch above the composer.'
  zh: '把 DSH Web GUI 换成水墨武侠观感的主题（取材自《影之刃零》）：素笺/墨夜两套配色、主视觉作为画布、飘落的枫叶、细雨，以及输入框上方的配色切换控件。'
icon: https://raw.githubusercontent.com/reygreen1/dsh-theme-phantom-blade-zero/main/assets/icon-180.png
