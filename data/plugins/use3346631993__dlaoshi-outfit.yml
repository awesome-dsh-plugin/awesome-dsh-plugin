category: fun
description:
  en: 'Maid-outfit desktop pet for the DeepSeek Harness web GUI: four expressions that follow the turn (thinking / success / failure), free dragging with remembered position, click-to-cycle, a bottom-right standee that reports each turn''s token usage and think latency with its own balance bubble, a chat wallpaper, a liquid-glass composer, and a single switch in Settings to turn the whole look off.'
  zh: '二次元男版女仆桌宠：四种表情跟随对话状态（思考/成功/失败），可自由拖拽并记住位置，点击切换表情；右下角立牌每轮显示 token 消耗与思考时间，点击有 q 弹、气泡膜音效与独立余额气泡；另附聊天背景壁纸、液态玻璃输入框，设置里一个开关即可整体关闭。'
