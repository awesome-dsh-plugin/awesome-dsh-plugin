description:
  zh: "DSH 的 IM 联合桥：整合社区同类插件（xmanrui/dsh-im、MichengAI/dsh-im-connect）能力合集的独立实现——用 11 个即时通讯平台（12 个渠道适配器，企微含机器人与自建应用两档）驱动宿主会话——微信（官方 iLink 扫码绑定）、飞书（长连接+流式卡片，可选语音档）、Telegram、Discord、企微智能机器人与自建应用（回调验签）、钉钉（stream+AI Card）、QQ 官方机器人、Slack（Socket Mode）、WhatsApp（Baileys）、Matrix、iMessage（仅 macOS）。跨版本窄腰在 0.1.2→0.2.1 宿主间能力探测自适配设置面 gen1/gen2/gen3（禁版本号分支）；IM 内 24 命令面板、工具审批与交互提问原聊天闭环（默认拒绝、发起者限定、5 分钟超时）、图片/文件输入（宿主元数据判视觉）、产物文件回传、投递日志限额补发（结果不明绝不重发）、主动投递与碎片续写。secret 单向入凭据库，永不回显。npm 包名：`dsh-im-union`。"
  en: "Union IM bridge for DSH — an independent implementation uniting the capability sets of community peer plugins (xmanrui/dsh-im, MichengAI/dsh-im-connect). Drive your agent session from 12 channel adapters across 11 messengers — WeChat (official iLink QR bind), Feishu/Lark (long-connection + streaming cards, optional voice tier), Telegram, Discord, WeCom intelligent bot & self-built app, DingTalk stream + AI Card, QQ official bot, Slack Socket Mode, WhatsApp (Baileys), Matrix, iMessage (macOS). Cross-version narrow waist auto-adapts settings gen1/gen2/gen3 across hosts 0.1.2→0.2.1 with capability probing only (never version branches); in-chat 24-command panel, tool-approval & question loops answered in the originating chat (deny-by-default, initiator-only, 5-min expiry), image/file input with host-metadata vision gating, deliverable file return, delivery log with bounded retry (uncertain never re-sent), proactive delivery and fragment composition. Secrets are one-way into the vault and never echoed back. npm: `dsh-im-union`."
