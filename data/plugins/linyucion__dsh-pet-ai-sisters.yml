url: https://github.com/linyucion/dsh-pet-ai-sisters
name: linyucion/dsh-pet-ai-sisters
category: fun
description:
  en: 'Chibi desk-pet pack for `dsh-pet`: ships 16 AI-model personas, each with 17 transparent 24 fps VP9 WebM animations (272 clips total), 4 reaction PNG stickers (64 total), an avatar and a preset config. On enable, syncs the selected `pets` roster (`all`, `wave1`, `wave2` or a comma-separated list) into `$DSH_HOME/dsh-pet/pet/` (fetching four SHA-512-verified `@linyucion/dsh-pet-ai-sisters-pack-*` tarballs from npmmirror / npmjs in the background when installed from the lightweight npm bundle) with a `.ai-sisters-manifest.json` version stamp while preserving user-modified `display`, `size`, `position` and toggle fields in `<id>-config.json`, then calls `/dsh-pet-7340/reload`. Registers five right-click menu actions via `/dsh-pet-7340/menu/item` — foreground-window top perch (Win32 `GetForegroundWindow` bounds on Windows, fixed fallback elsewhere), two-pet paired-line skit, folder peek, screen-glass knock and cloud nap — and unregisters them when disabled.'
  zh: '面向 `dsh-pet` 的 Q 版桌宠扩展包：内置 16 位 AI 模型拟人角色，每位含 17 段 24fps VP9 透明通道 WebM 动画（共 272 段）、4 张表情贴纸（共 64 张）、头像与预设配置。启用时按 `pets` 配置（`all`、`wave1`、`wave2` 或逗号分隔列表）同步至 `$DSH_HOME/dsh-pet/pet/`（从轻量 npm 包安装时后台拉取并校验四个 SHA-512 固化的 `@linyucion/dsh-pet-ai-sisters-pack-*` 媒体分包）并写入 `.ai-sisters-manifest.json` 版本戳，升级时保留 `<id>-config.json` 中已修改的显示、尺寸、坐标与开关项，随后调用 `/dsh-pet-7340/reload` 热重载；同时经 `/dsh-pet-7340/menu/item` 挂载五项右键互动菜单（前台窗口顶晃脚、双人台词小剧场、文件夹探头、敲屏幕玻璃、抱云朵小憩），停用时自动注销。'
icon: https://raw.githubusercontent.com/linyucion/dsh-pet-ai-sisters/main/icon.png
