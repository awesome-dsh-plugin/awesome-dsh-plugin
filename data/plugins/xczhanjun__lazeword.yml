url: https://github.com/xczhanjun/lazeword
name: xczhanjun/lazeword
category: fun
description:
  en: 'A cozy offline vocabulary trainer for the whole family: 1094 curated words, spaced repetition, 6 quiz types, spelling games and a lazy large-screen mode; opens as a sidebar panel and also runs standalone as one HTML file.'
  zh: 舒服的离线背单词全家桶：1094 个精选单词、间隔重复、6 种题型、拼写游戏和躺着背大字模式；侧边栏面板打开，也可作为单个 HTML 文件独立运行。
  ja: 家族みんなで使えるオフラインの単語トレーナー。厳選 1094 語、間隔反復、6 種類のクイズ、スペリングゲーム、大画面向けのゆったりモードを収録。サイドバーのパネルとして開けるほか、単体の HTML ファイルとしても動きます。
