name: OverDustD7/dsh-experience-recall
category: memory
description:
  en: "Finds lessons recorded in earlier projects and uses an Ollama-compatible model to judge whether to inject a short note before the next agent step. Reads the dsh-mnemon store; the optional mnemon CLI adds semantic retrieval."
  zh: "从以往项目的记忆中查找相关经验，由 Ollama 兼容模型判断是否在下一步前插入简短提示。读取 dsh-mnemon 记忆库；可选的 mnemon CLI 提供语义检索。"
