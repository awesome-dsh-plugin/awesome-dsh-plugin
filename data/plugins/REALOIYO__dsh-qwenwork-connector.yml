name: REALOIYO/dsh-qwenwork-connector
category: model
description:
  en: 'Unofficial QwenWork (千问办公) model provider for DSH, adapted from dsh-magpie-connect and magpie (MIT): device-code sign-in and request signing live inside the plugin, so no desktop client or forwarding process is needed. Requires an active QwenWork plan and DSH 0.2.x.'
  zh: '非官方的千问办公（QwenWork）模型 provider，改编自 dsh-magpie-connect 与 magpie（MIT）：设备码登录与请求签名均在插件内实现，不需要桌面客户端或本地转发进程。需有效的千问办公套餐，DSH 0.2.x。'
