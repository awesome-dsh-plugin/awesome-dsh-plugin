url: https://github.com/REALOIYO/dsh-qwenwork-connector
name: REALOIYO/dsh-qwenwork-connector
category: model
description:
  en: Registers QwenWork (千问办公) models as a DSH provider with the device-code sign-in and request signing implemented inside the plugin, so no desktop client or local forwarding process is needed.
  zh: 把千问办公（QwenWork）的模型注册为 DSH provider，设备码登录与请求签名均在插件内实现，不需要桌面客户端或本地转发进程。
