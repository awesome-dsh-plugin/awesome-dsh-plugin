description:
  en: Adds Blue Archive style click and touch effects plus a cursor trail to the DSH Web GUI, with theme color, scale, opacity, glow, speed and on/off switches on a Click FX page in Settings.
  zh: 为 DSH Web 界面添加蔚蓝档案风格的点击/触摸特效与鼠标拖尾，并在设置的 Click FX 页提供主题色、大小、不透明度、辉光、速度与开关。
