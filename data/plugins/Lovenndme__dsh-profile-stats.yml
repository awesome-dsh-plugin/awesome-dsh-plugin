url: https://github.com/Lovenndme/dsh-profile-stats
name: Lovenndme/dsh-profile-stats
category: usage
description:
  en: 'A personal usage profile page in the DSH sidebar. Five headline numbers (cumulative tokens, today''s tokens, longest task, longest and current active-day streaks), a 12-month activity heatmap with daily / weekly / cumulative scopes, a Cache Lens that splits every token into cache hits, uncached input and output as a segmented bar (with a zoom into the uncached split), a stacked bar chart of tokens over time grouped by model family (version plus tier, so vendor-specific ids and unversioned aliases collapse correctly), and a per-provider split for today or all time. A page-level range (all / today / 7 days / 30 days) drives the token figures. Everything is folded from this machine''s own session logs through ctx.sessionQuery. The only outbound request is a six-hourly read of this package''s own version from the npm registry, used by the in-panel update button — no telemetry, no credentials, nothing uploaded.'
  zh: 'DSH 侧栏的个人用量主页：五个核心数字（累计 Token、今日 Token、最长任务用时、最长/当前连续活跃天数）、近 12 个月活动热力图（每天/每周/累计总量三档）、把每个 Token 拆成「缓存命中 / 未缓存输入 / 输出」的分段占比条 Cache Lens（可放大查看未缓存内部构成）、按模型家族（版本 + 档位，自动归并不同供应商写法与无版本别名）堆叠的时间柱状图，以及按供应商的今日/累计分类。页面级时间范围（全部/今日/7 天/30 天）驱动上述用量数字。全部由本机会话日志经 ctx.sessionQuery 折叠而来；唯一的外发请求是每 6 小时读一次本包自己在 npm 上的版本号（供面板内的更新按钮使用），不上报数据、不碰凭据。'