url: https://github.com/Lovenndme/dsh-profile-stats
name: Lovenndme/dsh-profile-stats
category: usage
description:
  en: 'A personal usage profile page in the DSH sidebar, folded from this machine''s own session logs through ctx.sessionQuery. A range switch in the header (today, this week, this month, all time or custom dates) drives the first number, the token stats, the projects and the provider split: five headline numbers (tokens in that range with a trend and the change against the previous period, its spend, longest task, the active-day streak with the best one, today''s cache hit rate), a 12-month activity grid in daily / weekly / running-total views, a stacked model-family chart by day, week or month with its own switch (version and tier stay apart, and vendor-specific ids collapse correctly), a token-stats ring chart of where the tokens went (system prompt, tool definitions, user messages, injected context, skills, tool calls, reasoning, answers), a per-provider split with each route''s own hit rate, tokens per working directory, and spend priced at list price, a per-provider discount or a monthly plan (the pricing settings stay on this machine). The selected range exports as CSV or JSON. The only outbound request is a six-hourly read of this package''s own version from npm for the in-panel update button - no telemetry, no credentials, nothing uploaded.'
  zh: 'DSH 侧栏的个人用量主页，数据全部由本机会话日志经 ctx.sessionQuery 折叠而来。页头的时间范围开关（今日、本周、本月、累计或自定义日期）驱动第一个数字、Token 统计、项目和供应商分类：五个核心数字（该范围用量带趋势与环比、该范围花费、最长任务用时、连续活跃天数及历史最佳、今日缓存命中率）、近 12 个月活动图（每天 / 每周 / 累计三档）、模型家族堆叠柱（按日 / 周 / 月分组，有独立的切换，版本与档位分开，不同供应商写法会正确归并）、按系统提示词 / 工具定义 / 用户消息 / 注入内容 / 技能注入 / 工具调用 / 模型思考 / 模型回复拆分的 Token 统计环形图、带各自命中率的供应商分类、按工作目录统计的用量，以及按官方定价、折扣或包月套餐估算的花费（定价设置只保存在本机）。所选范围可导出 CSV 或 JSON。唯一的外发请求是每 6 小时读一次本包在 npm 上的版本号（供面板内的更新按钮使用），不上报数据、不碰凭据。'