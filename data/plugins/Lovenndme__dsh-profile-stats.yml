url: https://github.com/Lovenndme/dsh-profile-stats
name: Lovenndme/dsh-profile-stats
category: usage
description:
  en: 'A personal usage profile page in the DSH sidebar, folded from this machine''s own session logs through ctx.sessionQuery. One range switch in the header (7 / 30 / 90 days or all time) drives the page: five headline numbers (tokens in that range with a trend line and the change against the previous period, today''s tokens, longest task, longest and current active-day streaks), a 12-month activity grid in daily / weekly / running-total views, a stacked model-family chart for the same range by day, week or month (version and tier stay apart, and vendor-specific ids collapse correctly), a Cache Lens that shows the cache hit rate and splits tokens into cache hits, uncached input and output with a zoom into the uncached part, and a per-provider split with each route''s own hit rate. The selected range exports as CSV or JSON. The only outbound request is a six-hourly read of this package''s own version from npm for the in-panel update button - no telemetry, no credentials, nothing uploaded.'
  zh: 'DSH 侧栏的个人用量主页，数据全部由本机会话日志经 ctx.sessionQuery 折叠而来。页头的时间范围开关（近 7 / 30 / 90 天或累计）驱动全页：五个核心数字（该范围用量带趋势线与环比、今日用量、最长任务用时、最长/当前连续活跃天数）、近 12 个月活动图（每天 / 每周 / 累计三档）、同范围的模型家族堆叠柱（按日 / 周 / 月分组，版本与档位分开，不同供应商写法会正确归并）、显示缓存命中率并把 Token 拆成「缓存命中 / 未缓存输入 / 输出」且可放大查看非缓存构成的 Cache Lens，以及带各自命中率的供应商分类。所选范围可导出 CSV 或 JSON。唯一的外发请求是每 6 小时读一次本包在 npm 上的版本号（供面板内的更新按钮使用），不上报数据、不碰凭据。'