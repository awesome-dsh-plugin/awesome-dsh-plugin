url: https://github.com/Lovenndme/dsh-profile-stats
name: Lovenndme/dsh-profile-stats
category: usage
description:
  en: 'A personal usage profile page in the DSH sidebar, folded from this machine''s own session logs through ctx.sessionQuery. Five headline numbers (tokens with a small trend and the change against the previous period, spend, longest task, the active-day streak with your best, today''s cache hit rate), a 12-month activity grid in daily / weekly / running-total views, a model-family chart by day, week or month as stacked columns or a share pie (version and tier stay apart, and vendor-specific ids collapse correctly), a token-stats ring chart of where the tokens went (system prompt, tool definitions, user messages, injected context, skills, tool calls, reasoning, answers), tokens and spend per project with the subagent share, and a per-provider split with each route''s own hit rate and spend. A range switch in the header (today, this week, this month, all time or custom dates) drives the token and spend numbers, the token stats, the projects and the providers, and the selected range exports as CSV or JSON. Spend is priced at bundled list prices (peak and off-peak hours for DeepSeek direct); each provider can be set to list price, a discount, a monthly plan or not counted, stored only on this machine. The only outbound request is a six-hourly read of this package''s own version from npm for the in-panel update button - no telemetry, no credentials, nothing uploaded.'
  zh: 'DSH 侧栏的个人用量主页，数据全部由本机会话日志经 ctx.sessionQuery 折叠而来。包括五个核心数字（用量带小趋势与环比、花费、最长任务用时、连续活跃天数及最长纪录、今日缓存命中率）、近 12 个月活动图（每天 / 每周 / 累计三档）、按日 / 周 / 月分组的模型家族图（堆叠柱看用量、饼图看占比，版本与档位分开，不同供应商写法会正确归并）、按系统提示词 / 工具定义 / 用户消息 / 注入内容 / 技能注入 / 工具调用 / 模型思考 / 模型回复拆分的 Token 统计环形图、按工作目录拆分用量与花费并标出子代理占比的项目，以及带各自命中率与花费的供应商分类。页头的时间范围开关（本日 / 本周 / 本月 / 累计 / 自定义日期）驱动用量与花费数字、Token 统计、项目和供应商分类，所选范围可导出 CSV 或 JSON。花费按内置的官方价折算（直连 DeepSeek 分高峰、空闲时段），每家供应商可设成官方价、倍率、包月或不计入，设置只存在本机。唯一的外发请求是每 6 小时读一次本包在 npm 上的版本号（供面板内的更新按钮使用），不上报数据、不碰凭据。'