description:
  en: 'Unifies every DSH extensibility seam behind one declarative DSL: a runtime `fabric` service, `fabric_extend`/`fabric_inspect` tools, and a capability-graph settings page.'
  zh: 用一套声明式 DSL 统一 DSH 的所有可扩展接缝：提供 `fabric` 运行时服务、`fabric_extend`/`fabric_inspect` 工具，以及能力图谱设置页。
  ja: DSH のあらゆる拡張点を 1 つの宣言的 DSL の裏にまとめます。実行時の `fabric` サービス、`fabric_extend`/`fabric_inspect` ツール、機能グラフの設定ページを提供します。
