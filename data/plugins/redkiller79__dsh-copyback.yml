description:
  zh: "把本机剪贴板复制过的文字留成可回看的历史：copyback_search 按关键词或日期查找并返回预览，copyback_copy 把选中条目重新写入系统剪贴板，copyback_manage 置顶、删除、清空或暂停记录。守护进程只监听 127.0.0.1，密码管理器等敏感剪贴板标记自动跳过，Windows 默认只记前台主动复制，数据以本地 JSON 存储。需要 Python 3。"
  en: "Keeps a recallable history of copied text on this machine: copyback_search finds entries by keyword or date and returns previews, copyback_copy writes a chosen entry back to the system clipboard, and copyback_manage pins, deletes, clears or pauses recording. The daemon listens on 127.0.0.1 only, skips secret clipboard markers from password managers, records only foreground copy actions on Windows by default, and stores data as local JSON. Requires Python 3."
