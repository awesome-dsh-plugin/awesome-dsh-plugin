name: yayuqianhuang/dsh-video-to-knowledge
category: tools
description:
  en: "Compile a video link into timestamped Markdown knowledge cards with back-links to the exact moment. Requires your own Python 3.10+ and yt-dlp (ffmpeg + faster-whisper only for videos without subtitles; Bilibili login cookies for members-only subtitles)."
  zh: "把视频链接编译成带时间戳、可回跳原片时刻的 Markdown 知识卡。需自备 Python 3.10+ 与 yt-dlp（无字幕视频另需 ffmpeg + faster-whisper，B 站会员字幕需登录 cookie）。"
