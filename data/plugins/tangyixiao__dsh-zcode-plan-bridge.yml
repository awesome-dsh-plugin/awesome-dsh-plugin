url: https://github.com/tangyixiao/dsh-zcode-plan-bridge
name: tangyixiao/dsh-zcode-plan-bridge
category: model
description:
  en: 'Relays the ZCode CLI agent into DeepSeek Harness as a model provider. A resident app-server session streams each turn, and the model catalogue is read from the CLI at runtime, so context windows, image support and provider routes follow the installed CLI and account. Security: the current main branch switches to yolo and auto-approves permission requests without confirmation; a deny-by-default policy with an explicit full-auto opt-in is pending in plugin PR #1. DSH approval UI does not mediate this separate app-server process.'
  zh: '把 ZCode CLI agent 接入 DeepSeek Harness 作为模型提供方。常驻 app-server 会话逐回合流式转发，模型清单从 CLI 实时读取。安全提示：当前 main 分支会切到 yolo 并自动批准权限请求，不会弹确认；默认拒绝、全自动需显式启用的修复正在插件 PR #1 等待合并。DSH 自带的审批界面不会介入这个独立 app-server 进程。'
