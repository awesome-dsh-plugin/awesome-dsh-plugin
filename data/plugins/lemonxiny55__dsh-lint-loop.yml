description:
  en: 'Change-aware quality loop for DSH: fast lint feedback and safe regression-only repair, bounded completion checks for lint deltas, TypeScript and impacted Vitest/Jest tests, and a Quality Receipt that separates new regressions from historical debt.'
  zh: '面向 DSH 的变更感知质量闭环：编辑后快速 lint 反馈与仅针对新增问题的安全修复，完成前有界验证 lint 增量、TypeScript 和受影响的 Vitest/Jest 测试，并生成区分新增回归与历史债务的 Quality Receipt。'
