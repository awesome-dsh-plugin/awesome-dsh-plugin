description:
  en: Regression-aware lint repair for DeepSeek Harness; fixes only lint regressions introduced or changed in the current Agent turn, re-lints with a bounded loop, and ignores pre-existing findings.
  zh: 面向 DeepSeek Harness 的回归感知 lint 修复，只处理 Agent 本轮引入或改变的问题，在有界循环内重新 lint，并忽略历史问题。
