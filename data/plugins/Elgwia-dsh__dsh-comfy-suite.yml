url: https://github.com/Elgwia-dsh/dsh-comfy-suite
name: Elgwia-dsh/dsh-comfy-suite
category: vision
description:
  en: 'Merges three MIT ComfyUI plugins into one bundle: workflow library, local image generation and editing (draw, inpaint, outpaint, character, upscale) through a local ComfyUI, plus a service launcher, gallery, style library and prompt wardrobe. Personal merge project, not the upstream version. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把三个 MIT 许可的 ComfyUI 插件合并成一个 bundle：工作流库、经本机 ComfyUI 的本地出图与修图（出图、局部重绘、扩图、捏人、放大），外加服务启停、作品库、风格库与提示词衣柜。个人整合项目，非上游官方版本。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'