url: https://github.com/zx-yk/dsh-codex-adapter
name: zx-yk/dsh-codex-adapter
category: agi
description:
  en: 'Dispatch tasks from Claude Code and Codex to DSH agents as native subagents with live progress, tier policy and failure escalation. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '从 Claude Code / Codex 把任务派发给 DSH 智能体，作为原生子代理并实时显示进度，支持档位策略与失败升级。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
