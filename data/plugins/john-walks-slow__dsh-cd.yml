url: https://github.com/john-walks-slow/dsh-cd
name: john-walks-slow/dsh-cd
category: tools
description:
  en: 'In-session cd for DeepSeek Harness: re-base relative paths on the fly (the file tools and the bash/pwsh default workdir follow) or move the session to another workspace for real — a `cd {"workspace": true}` call or the user''s `/cd <directory>` command relocates the session''s stored log, sandbox root, AGENTS.md and skill discovery and sidebar grouping. Per-session, persisted across restarts, without moving the session for a plain re-base.'
  zh: '会话内 cd：即时切换相对路径基准（文件工具与 bash / pwsh 默认工作目录跟随），或把会话真正搬到另一个工作区——`cd {"workspace": true}` 或用户命令 `/cd <目录>` 会迁移会话日志存储位置、沙箱根、AGENTS.md 与 skills 发现根以及侧边栏分组；按会话隔离、跨重启恢复，单纯换基准时不动会话身份。'
