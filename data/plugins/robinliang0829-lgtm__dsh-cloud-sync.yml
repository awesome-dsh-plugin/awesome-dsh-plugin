name: robinliang0829-lgtm/dsh-cloud-sync
category: session
description:
  en: "Ship OpenTelemetry GenAI observability and multi-device cloud state sync from one DSH bundle. It reuses and replaces the standalone @loongsuite/dsh-plugin (traces + metrics for sessions, agent loop, LLM and tool lifecycle; do not install both — disable or remove the upstream plugin first), and adds a WebSocket client that pushes full session event logs (header + snapshotEvents) to a relay you run so different local DSH instances share state. On connect it pulls and rebuilds the other devices' sessions automatically (cross-device resume). The sync client itself has zero third-party runtime dependencies; a small Node.js relay is included in the repo. The local /cloud-sync/* HTTP routes (status, sessions, config, resync, delete) have no origin or loopback check, and the bundled relay accepts unauthenticated connections unless AUTH_TOKEN is set — keep the DSH web port off untrusted networks and run the relay with a token."
  zh: "一个 DSH bundle 同时提供 OpenTelemetry GenAI 可观测性与多设备云端状态同步：复用并替换独立的 @loongsuite/dsh-plugin（为会话、Agent 循环、LLM 与工具生命周期产出 trace/metric；不要与上游同装，先禁用或移除它），并新增 WebSocket 客户端把完整会话事件日志（header + snapshotEvents）推送到自建中继，让不同本地端的 DSH 状态互通；连接时自动拉回并重建其他设备的会话（跨设备续接）。同步客户端本体零第三方运行时依赖；仓库内附带一个小型 Node.js 中继。本机的 `/cloud-sync/*` HTTP 路由（status、sessions、config、resync、delete）没有同源/回环校验，随包中继在未设置 AUTH_TOKEN 时不鉴权——请勿把 DSH Web 端口暴露到不受信任的网络，并给中继配置 token。"
