description:
  zh: "项目级记忆，核心是台账：台账的结构由 AI 按项目类型自行决定，插件只负责检测、注入、回写、归档与 Git 配合。记忆按语义分开放 —— 活跃台账是当前状态、回合流水只追加、关键决策/目标树/经验教训各是一卡一文件（另有卡片目录的多维索引表），根本原则只有用户本人能改。压缩方式只有一种（分流后压缩）：压缩前先让 AI 把这一段分成三个桶 —— 留上下文的压缩后逐字注回、以后要查的落进项目 _stash/、已被取代的丢掉。对话建在装着多个项目的总工作区上时，可以把它锁定到某个子项目（锁记在插件自己的家，跨重启保持；不在你的项目里留任何标记）。另有活动日志 L0–L4，其中 L4 逐字存档用户原话（不注入上下文，可按需查）。每次压缩前把用户原话、报错原文、改过哪些文件落盘成一份逐字胶囊，重启后仍能取到（素材与胶囊分别落盘、跨重启保留）；再用交接单让新会话接上上一次的工作。21 个工具、12 个子命令、39 项设置（其中一项可切换「以设置面板为准 / 以项目清单为准」）；纯本地运行，零运行时依赖。"
  en: "Project-level memory built around a ledger whose structure the AI designs per project; the plugin only handles detection, injection, write-back, archiving and git. Memories are split by meaning: the active ledger holds current state, the turn journal is append-only, and decisions, the goal tree and lessons are one-card-per-file (with a multi-dimension index over the card folders); the fundamental principles file can be changed only by the user. There is a single compaction mode: before compacting, the AI sorts the work into three buckets - what must stay in context and is re-injected verbatim, what is written to the project's _stash/ for later lookup, and what is dropped. When a conversation is opened in a container workspace holding several projects, it can be locked to one sub-project (the lock lives in the plugin's own home and survives restarts; it leaves no marker in your project). Also an activity log with five levels, where L4 stores the user's own words verbatim (never injected, queryable on demand). Before each compaction a verbatim capsule (user quotes, raw errors, changed files) is written to disk, and both the capsule and its source material survive a restart; a handoff document lets a new conversation resume the previous one. 21 tools, 12 subcommands, 39 settings (one of them switches whether the settings panel or each project's manifest wins). Runs locally, no runtime dependencies."
