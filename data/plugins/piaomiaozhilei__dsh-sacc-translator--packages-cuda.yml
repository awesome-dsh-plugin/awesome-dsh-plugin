  en: Windows x64 translator with a dedicated sidebar entry and Workbench / Chat interface, side-by-side text and document translation, screen-region translation, recent history, and host model selection, voice input and preview. CUDA document OCR with CPU fallback; screen OCR uses CPU.
  zh: 翻译 CUDA：Windows x64 专属翻译界面，侧栏独立入口，支持工作台／聊天切换、原文与译文双栏、尽量保留原格式的文档翻译、屏幕框选翻译及最近记录，复用宿主模型、语音输入与预览。文档 OCR 支持 CUDA 加速，无兼容 GPU 时回退 CPU；屏幕 OCR 使用 CPU。
