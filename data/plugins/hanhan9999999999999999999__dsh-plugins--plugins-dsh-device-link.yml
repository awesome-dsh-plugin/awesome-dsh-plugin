description:
  en: Pairs two DSH machines from the settings page and pushes plugins, skills, rules, config and conversation sessions to the other machine in one click, with a dry-run preview and a severity-tagged report before anything is written.
  zh: 在设置页把两台 DSH 配对，一键把插件、技能、规则、配置和会话同步到另一台电脑；写入前先出 dry-run 预览与分级报告。
