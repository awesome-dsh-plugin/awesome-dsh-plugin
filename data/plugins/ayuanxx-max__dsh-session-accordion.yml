url: https://github.com/ayuanxx-max/dsh-session-accordion
name: ayuanxx-max/dsh-session-accordion
category: ui
description:
  en: 'Chat history accordion: every turn folds into one row (time pill + question summary), only the newest turn stays open, and a new turn or a session switch resets to it. 3.2 adds a single-state render path with one DOM write point, a pin drawn as a CSS background mark instead of an injected button (so virtualized rows never leave duplicate pins), hover preview, a persistent search button that is closed by default (Enter jumps to the next match, Esc restores), per-session pin memory, day separators, a fork badge, bilingual copy with aria labels, and a fully event-driven build with no timers or animation frames.'
  zh: '会话历史折叠：每轮对话压成一行（时间胶囊 + 提问摘要），只保留最新一轮展开，新轮次到达或切换会话都回到最新一轮。3.2 起：单一状态渲染、唯一 DOM 写入点；图钉改为 CSS 背景图（不插入按钮，虚拟列表回收不留重影）；悬停预览；搜索默认关闭（Enter 跳命中、Esc 还原）；钉住与展开按会话记忆；日期吸头与分叉徽标；中英文案 + aria；纯事件驱动，无定时器与动画帧。'
