description:
  en: 'Tool runtime for DSH: bash, PowerShell 7 and Rust file, search and batch tools with batched OPS-PTC calls, plus opt-in Windows desktop and browser computer use driven by the UI Automation tree and the CDP accessibility tree, a sidebar console and usage statistics.'
