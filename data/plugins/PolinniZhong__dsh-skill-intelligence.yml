url: https://github.com/PolinniZhong/dsh-skill-intelligence
name: PolinniZhong/dsh-skill-intelligence
category: skill
description:
  en: "Read-only Skill inspector for DeepSeek Harness. It shows which Skills a conversation actually loaded — from observed loading evidence only — and which Skills the current environment can discover, and gives each Skill a detail page that keeps its declaration apart from its run: the body split into structure, declared workflow and progressive disclosure, the run logic read from local receipts, and the per-step evidence behind each claim. Evidence is never promoted into a conclusion — a step with no observed evidence is reported as such, not as executed or not executed — and the run's instruction hash is shown beside the current definition as match, mismatch or unavailable. It also reads the body, offers a Chinese reading version, and can clone a Skill into a local copy. It never writes back to the source Skill and never runs its scripts."
  zh: "面向 DeepSeek Harness 的只读 Skill 检视器。它显示一次对话实际加载过哪些 Skill（只凭观测到的加载证据）、当前环境又能发现哪些 Skill，并为每个 Skill 提供一页详情，把「声明」与「这次运行」分开：正文按结构、声明流程、渐进披露拆开，运行逻辑只从本机收据读，每一步附上它自己的证据。证据不会被升格成结论——没有观测到证据的一步就照实写成「暂无足够证据」，而不是「已执行」或「未执行」；本次运行收到的指令哈希与当前定义哈希并列给出 match、mismatch 或 unavailable。此外提供正文阅读、中文阅读版，以及把一份 Skill 复刻成本机副本。它不改写源 Skill，也不执行源里的脚本。"
