name: SpaceRelay/dsh-subagent-control#human-wait
category: dev
description:
  en: Keeps the 120-second PTC run limit from expiring while DSH waits for your answer, plan review or approval, so a slow reply does not end the run as a timeout.
  zh: DSH 等你的回答、审阅计划或批准请求时暂停 PTC 的 120 秒运行限时，回得慢也不会被当成超时中断。
