name: greenballyjq/dsh-deepseek-chat-history-import
category: session
description:
  en: 'Imports DeepSeek web chat history into DeepSeek Harness as resumable sessions, with official ZIP/JSON, split conversations, browser records, JSONL, merge/dedupe, branch selection, summaries and cost estimates. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把 DeepSeek 网页端聊天历史导入 DeepSeek Harness，支持官方 ZIP/JSON、拆分文件、浏览器记录、JSONL、多文件合并去重、版本选择、摘要与费用预估。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
