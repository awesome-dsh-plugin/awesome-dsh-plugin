url: https://github.com/GinoXiang/dsh-dailyboard
name: GinoXiang/dsh-dailyboard
category: ui
description:
  en: 'DailyBoard — a daily work task board for the DSH Web GUI with a one-month calendar of colored timeline bars and day tasks, a daily checklist, a seven-day week view with completion checkboxes and drag-to-reschedule, a draggable 24-hour day timeline, ordered per-day subtasks, weekly and every-N-days recurring tasks with per-occurrence result records, a long-term progress view opened from the calendar header, per-day completion for long-term tasks, tasks that can be marked “For others” by choosing one of the added recipients (shown as note + email), a collapsible daily email reminder that can be pushed to WeChat and can remind other people such as partners or relatives (each extra recipient has an email, a note and its own send time), AI task extraction from natural language with smart date parsing (single dates become day tasks, “this week/month” starts from today, Enter extracts, indented lines become visible subtasks that can be promoted), completion rewards on the calendar (completed days turn solid green with a large check, plus “N days this month · X-day streak” stats), and CSV export with an auto-generated records.csv mirror, and a specific-day all-day strip that lets long-term tasks be dragged onto the 24-hour timeline to create draggable scheduled blocks. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DailyBoard 是 DSH Web GUI 的日常工作任务板：单月日历（彩色时间条 + 当天任务）、日常清单、七天周视图（勾选完成、可拖动改期）与可拖拽的 24 小时时间轴，支持按天记录的有序子任务、按周几或每隔几天的周期任务及每次出现的结果记录、从日历标题栏打开的长期任务进展视图、长期任务按天完成标记、可从已添加的其他收件邮箱中选择（显示备注与邮箱）的「给他人」任务、可推到微信并提醒他人（如合作伙伴或亲属）的每日邮件提醒（每个其他收件邮箱可填备注和单独发送时间）、能识别日期并把单日任务归为当天任务、本周/本月从今天算起、回车即可识别的 AI 提取（缩进行作为子任务，预览中可见并可转为独立任务或删除）、完成日整段变绿 + 大对勾的日历完成激励与「本月完成 N 天 · 连续 X 天」统计，以及 CSV 导出与自动生成的 records.csv 镜像，还有可在「具体当天」把长期任务拖到 24 小时时间轴上生成可拖动时段的排期功能。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
tarball: https://github.com/GinoXiang/dsh-dailyboard/releases/latest/download/dsh-dailyboard.tgz
