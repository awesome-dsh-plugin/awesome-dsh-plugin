url: https://github.com/GinoXiang/dsh-dailyboard
name: GinoXiang/dsh-dailyboard
category: ui
description:
  en: 'DailyBoard — a daily work task board for the DSH Web GUI with a one-month calendar of colored timeline bars and day tasks, a daily checklist, a seven-day week view with completion checkboxes and drag-to-reschedule, a draggable 24-hour day timeline, ordered per-day subtasks, weekly and every-N-days recurring tasks with per-occurrence result records, a long-term progress view opened from the calendar header, per-day completion for long-term tasks, a collapsible daily email reminder for any mailbox, and AI extraction of tasks from natural language.'
  zh: 'DailyBoard 是 DSH Web GUI 的日常工作任务板：单月日历（彩色时间条 + 当天任务）、日常清单、七天周视图（勾选完成、可拖动改期）与可拖拽的 24 小时时间轴，支持按天记录的有序子任务、按周几或每隔几天的周期任务及每次出现的结果记录、从日历标题栏打开的长期任务进展视图、长期任务按天完成标记、任意邮箱的每日邮件提醒，以及 AI 自然语言提取任务。'
tarball: https://github.com/GinoXiang/dsh-dailyboard/releases/latest/download/dsh-dailyboard.tgz