description:
  en: "Turns the promises a chat quietly drops into an interest-bearing ledger: every “later” becomes a card, older ones rank higher, and each card jumps back to the conversation where it was said."
  zh: "把聊天里被顺口搁置的“回头再说”记成一份带利息的账本：每句承诺是一张卡，搁得越久排名越靠前，点一下回到当初那句话所在的会话。"
