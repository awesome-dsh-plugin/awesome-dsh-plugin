url: https://github.com/furkancak1r/dsh-composer-plus
name: furkancak1r/dsh-composer-plus
category: ui
description:
  en: 'Composer and sidebar helpers in one plugin, each switchable in Settings: a git Changes panel (uncommitted / unstaged / staged / branch diffs), Turn rollback (chat only, or chat and files), Project memory (notes per project that later chats read, off by default), a Task board (kanban board of chats by their live state), Remote computers (open the dsh of another Mac over Tailscale in the same window, off by default), Quote from file preview, Untangle codebase (a /untangle-codebase skill), Report an issue (the default model drafts a Composer Plus GitHub issue), One-click Continue, Auto Review "Allow for this chat", Project status, 11 extra UI languages and Automatic updates from GitHub releases.'
  zh: '一个插件集成多项输入框与侧边栏增强，均可在设置中单独开关：git 改动面板（未提交 / 未暂存 / 已暂存 / 分支差异）、回合回退（仅对话，或对话和文件）、项目记忆（按项目保存笔记，后续对话会读取，默认关闭）、任务看板（按实时状态排列对话的看板）、远程电脑（通过 Tailscale 在同一窗口中打开另一台 Mac 的 dsh，默认关闭）、从文件预览中引用、理清代码库（/untangle-codebase 技能）、报告问题（由默认模型起草 Composer Plus 的 GitHub issue）、一键继续、Auto Review「本对话内允许」、项目状态、11 种额外界面语言，以及从 GitHub Releases 自动更新。'
