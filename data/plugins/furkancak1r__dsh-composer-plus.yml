url: https://github.com/furkancak1r/dsh-composer-plus
name: furkancak1r/dsh-composer-plus
category: ui
description:
  en: 'Composer and sidebar helpers in one plugin, each switchable in Settings: a git Changes panel (uncommitted / unstaged / staged / branch diffs), Turn rollback (chat only, or chat and files), Project memory (notes per project that later chats read, off by default), a Task board (kanban board of chats by their live state), Assistant (one lasting chat that sets reminders with dsh scheduled tasks and reads your other chats; it changes a chat only after your approval; off by default), Remote computers (the dsh of another Mac over Tailscale in the same window, off by default), One-click Continue, Auto Review "Allow for this chat", 11 extra UI languages and Automatic updates from GitHub releases.'
  zh: '一个插件集成多项输入框与侧边栏增强，均可在设置中单独开关：git 改动面板（未提交 / 未暂存 / 已暂存 / 分支差异）、回合回退（仅对话，或对话和文件）、项目记忆（按项目保存笔记，后续对话会读取，默认关闭）、任务看板（按实时状态排列对话的看板）、助理（一个长期保留的对话，用 dsh 定时任务设置提醒并读取其他对话；只有在你批准后才会更改对话，默认关闭）、远程电脑（通过 Tailscale 在同一窗口中打开另一台 Mac 的 dsh，默认关闭）、一键继续、Auto Review「本对话内允许」、11 种额外界面语言，以及从 GitHub Releases 自动更新。'
