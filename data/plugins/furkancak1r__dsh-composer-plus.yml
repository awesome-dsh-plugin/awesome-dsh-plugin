url: https://github.com/furkancak1r/dsh-composer-plus
name: furkancak1r/dsh-composer-plus
category: ui
description:
  en: 'Composer and sidebar helpers in one plugin, each switchable in Settings: a git Changes panel, Turn rollback, Resume after an AIProxy outage, Advisor model (the agent asks another model that you choose for advice, off by default), Project memory (notes per project that later chats read, off by default), Assistant (one lasting chat named Damon that sets reminders with dsh scheduled tasks and reads your other chats; it changes a chat only after an approval) with an Assistant status panel (one card list, a canvas view and a Decisions dialog), Codex dark theme (off by default), Remote computers (another Mac''s dsh over Tailscale, off by default), 11 extra UI languages and Automatic updates.'
  zh: '一个插件集成多项输入框与侧边栏增强，均可在设置中单独开关：git 改动面板、回合回退、AIProxy 中断后继续、顾问模型（智能体向你选择的另一个模型征求建议，默认关闭）、项目记忆（按项目保存笔记，后续对话会读取，默认关闭）、助理（一个名为 Damon 的长期保留的对话，用 dsh 定时任务设置提醒并读取其他对话；只有在获得批准后才会更改对话）及助理状态面板（一个卡片列表、画布视图和“决定”对话框）、Codex 深色主题（默认关闭）、远程电脑（通过 Tailscale 打开另一台 Mac 的 dsh，默认关闭）、11 种额外界面语言和自动更新。'
