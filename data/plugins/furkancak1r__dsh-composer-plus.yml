url: https://github.com/furkancak1r/dsh-composer-plus
name: furkancak1r/dsh-composer-plus
category: ui
description:
  en: 'Composer and sidebar helpers in one plugin, each switchable in Settings: a git Changes panel (uncommitted / unstaged / staged / branch diffs), Turn rollback (chat only, or chat and files), Project memory (notes per project that later chats read, off by default), a Task board (kanban board of chats by their live state), Input history (↑/↓), Shift+Tab plan mode, One-click Continue after a stopped or failed turn, Queue drag-and-drop, Copy session link, Auto Review "Allow for this chat", Project status markers with Active projects first, Background notifications, 11 extra UI languages and Automatic updates from GitHub releases through the plugin manager.'
  zh: '一个插件集成多项输入框与侧边栏增强，均可在设置中单独开关：git 改动面板（未提交 / 未暂存 / 已暂存 / 分支差异）、回合回退（仅对话，或对话和文件）、项目记忆（按项目保存笔记，后续对话会读取，默认关闭）、任务看板（按实时状态排列对话的看板）、输入历史（↑/↓）、Shift+Tab 计划模式、对话中断或失败后一键继续、队列拖拽排序、复制会话链接、Auto Review「本对话内允许」、项目状态标记与活跃项目置顶、后台通知、11 种额外界面语言，以及通过插件管理器从 GitHub Releases 自动更新。'
