description:
  en: "Six-line I Ching (Liu Yao) casting and reading for DeepSeek Harness: coin or yarrow casting, a full chart (eight palaces, stems-branches, six relatives and spirits, hidden lines, void, month/day influence, moving-line changes), a verdict and timing from the useful god, the Zhouyi text, plus a sidebar panel and three agent tools."
  zh: "六爻纳甲解卦：铜钱或蓍草起卦，八宫世应、纳甲六亲、六神、伏神、旬空、月建日辰与动变，按用神旺衰断吉凶、定应期，并附《周易》经传原文；含侧栏面板与三个 agent 工具。"
