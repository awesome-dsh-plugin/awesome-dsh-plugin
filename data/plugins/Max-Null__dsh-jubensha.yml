name: Max-Null/dsh-jubensha
category: fun
description:
  en: "Solo murder-mystery (jubensha) in a session tab: the AI hosts the game and plays every other seat, each knowing only its own role book, while the player's seat stays yours — with a stage bar, a per-seat timeline, a clue page and a reveal that unseals the truth only at the end."
  zh: "一个人的剧本杀：AI 当主持人，AI 填满其余的椅子（各自只知道自己的角色本），留一个位子给你 —— 带阶段条、按座位归集的时间线与搜证页，而真相到复盘才解封。"
