description:
  en: Deletes a DSH session from the session menu, and lists the workspace files that session touched so you choose which ones to remove with it.
  zh: 在会话菜单里删除 DSH 会话，并列出该会话碰过的工作区文件，由你勾选哪些一起删掉。
