  },
  "install": "dsh plugin --profile web add github:jerfo0/dsh-plugin-meiju-english",
  "icon": "https://raw.githubusercontent.com/jerfo0/dsh-plugin-meiju-english/main/plugin/icon.svg",
  "screenshots": ["https://raw.githubusercontent.com/jerfo0/dsh-plugin-meiju-english/main/docs/screenshots/main.png"],
  "capabilities": ["shell", "fs-write", "fs-read", "network"]
}
