name: PerryLink/dsh-auto-review
category: workflow
description:
  en: 'Second-model auto-review on the approval answerer chain: a read-only reviewer subagent returns structured allow/deny verdicts with reasons, fail-closed by default.'
  zh: 审批链上的第二模型自动审查：只读审查子代理返回带理由的 allow/deny 结构化裁决，默认 fail-closed。
  ja: 承認応答チェーンに 2 つ目のモデルによる自動レビューを追加。読み取り専用のレビュアーサブエージェントが理由つきの構造化された許可/拒否の判定を返します。既定はフェイルクローズです。
