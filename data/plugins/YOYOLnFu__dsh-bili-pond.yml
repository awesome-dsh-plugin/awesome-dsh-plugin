url: https://github.com/YOYOLnFu/dsh-bili-pond
name: YOYOLnFu/dsh-bili-pond
category: notify
description:
  en: 'Let the Blue Big Fat Fish browse Bilibili for you: it comments on your behalf, DMs you interesting finds, writes a diary, and keeps a memory for long-term summaries. It filters videos to your taste, creates Markdown digests, and can watch comments and reply for you. In Circle Mode, it replies only inside threads explicitly invited by the video uploader in a top-level comment — ordinary viewer requests do not count, and it never starts a new top-level comment. Commenting, DMs, auto-run, and comment watch are off by default. Needs Node 22, DSH 0.1.7-rc.1+, a signed-in Bilibili account, a model route and Python.'
  zh: '让蓝色大肥鱼替你刷 B 站：帮你评论，把发现的有趣内容私信给你，还会写下日记；它也有记忆，能长期总结。视频按你的口味筛选并生成 Markdown 日报，也能守着评论区替你回话。开启「圈地自萌」后，它只回视频 UP 主本人主动邀请的楼中楼，普通观众喊话不算，绝不自己起新楼；评论、私信、自动运行和守护默认关闭。需 Node 22、DSH 0.1.7-rc.1+、已登录的 B 站账号、模型线路与 Python。'
