description:
  en: 'Task experience-memory workbench, 9 dream_* tools and dream-protocol skill: extracts candidate lessons with source provenance after tasks, queues them for manual review (J/K/A/D shortcuts), recalls adopted lessons in relevant tasks, and previews or rolls back AGENTS.md rule changes; capture and recall have separate switches, with 5 switchable workbench themes.'
  zh: '任务经验记忆工作台、9 个 dream_* 工具与 dream-protocol 技能：任务后提取带来源证据的候选经验，在待审阅队列核对范围与例外后手动采纳（支持 J/K/A/D 快捷键），在相关任务中召回已采纳经验，并支持 AGENTS.md 规则差异预览与回滚；整理与召回独立开关，内置 5 套工作台主题。'
