url: https://github.com/zz12hui/dsh-local-writing-suite
name: zz12hui/dsh-local-writing-suite
category: skill
description:
  en: Adds two audit tools and four skills for Chinese medium-to-long texts (fiction among them) and document review — seven-dimension AI-flavor scoring with line-numbered blocking findings, plus file-backed continuity state for long manuscripts. Do not install with the older dsh-deai-audit from the same author, which registers the same tool names.
  zh: 提供两个审查工具与四个技能，覆盖中长文本（例如小说）与文档审稿：七维 AI 味打分、带行号的阻断项，以及落盘的长篇连续性状态。不要与同作者的旧版 dsh-deai-audit 同装，二者注册同名工具。
