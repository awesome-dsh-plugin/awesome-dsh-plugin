name: yuna78/dsh-slayer
category: workflow
description:
  en: "Two DSH delegation presets — a fixed 8-seat crew, or up to 3 day-rate temps by convention — with call-time guards that refuse the other shape's delegation tools. The 8-seat preset additionally needs @deepseek-ai/dsh-experimental-agent-team-profile in the profile's dsh.profile.bundles; without it that preset has no team tools and degrades to solo work."
  zh: "给 DSH 装两条干活形态——8 个固定工位的终身奴，或按约定一次最多点 3 个的日结奴；跨形态调用会在调用时被 guard 拒绝。8 工位形态还需在 profile 的 dsh.profile.bundles 里挂 @deepseek-ai/dsh-experimental-agent-team-profile，否则该形态没有 Team 工具、会降级为单人作业。"
