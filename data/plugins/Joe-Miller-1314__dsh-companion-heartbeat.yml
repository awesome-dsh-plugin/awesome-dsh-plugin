url: https://github.com/Joe-Miller-1314/dsh-companion-heartbeat
name: Joe-Miller-1314/dsh-companion-heartbeat
category: identity
description:
  en: 'Decision-based heartbeat for AI companions: three needs drift while the persona is away and cool down on a reply, and the plugin turns that into "speak now" or "stay quiet" instead of a fixed timer. It delivers the decision through a JSON file, WeChatAgent, or dsh-im, and keeps a whitelist of chats the persona is allowed to reach out to.'
  zh: '给陪伴型人格装一颗心跳：三条需求在没人说话时缓慢累积、被回话后回落，插件据此判断此刻该不该主动开口，而不是走固定定时器；决定交给 JSON 文件、WeChatAgent 或 dsh-im，并维护一份"只惦记这些人"的名单。'
