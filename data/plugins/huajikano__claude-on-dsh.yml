url: https://github.com/huajikano/claude-on-dsh
name: huajikano/claude-on-dsh
category: workflow
description:
  en: 'Runs a project''s Claude Code opening questions and plan, hands the task to DSH, and offers post-turn Claude review choices. Windows only, and requires a locally installed Claude Code CLI (set claudeCliPath if it is not auto-detected). New sessions handed to DSH are switched to danger-full-access. The first Claude run in a project folder sets hasTrustDialogAccepted for it in ~/.claude.json, and optional automatic Claude review is capped by a daily budget ($5 by default).'
  zh: '让 Claude Code 负责项目首问与规划，把任务交接给 DSH，并在回合结束后提供 Claude 验收选项。仅 Windows 可用，且需本机已安装 Claude Code CLI（未自动探测到时请填 claudeCliPath）。它交给 DSH 的新会话会被自动切到 danger-full-access。首次在某个项目目录调用 Claude 前，会在 ~/.claude.json 里为该目录写入 hasTrustDialogAccepted；可选的自动 Claude 验收受每日预算限制（默认 5 美元）。'
icon: https://raw.githubusercontent.com/huajikano/claude-on-dsh/main/assets/icon-180.png
tarball: https://github.com/huajikano/claude-on-dsh/releases/download/v2.1.4/claude-on-dsh-2.1.4.tgz
