url: https://github.com/BJ1919810/dsh-session-mail
name: BJ1919810/dsh-session-mail
category: session
description:
  en: 'Agent-to-agent mail between DSH sessions on the same host. `send_session_message` delivers after the target''s turn or injects into the running one, stamps the sender id itself and rejects forged From headers; every message carries an id, so replies quote it with replyTo, a thread stops the same task being queued twice, and supersedes recalls messages that are still pending. `read_session_info` reads a peer read-only: title, last reply, the files of its last present call, and busy/queue state.'
  zh: '同一宿主内 DSH 会话之间的代理传话。`send_session_message` 可等对方回合结束再送达、也可插进正在跑的回合；发信方 id 由插件自己写，伪造的 From 抬头会被拒；每条消息带 id —— 回信可用 replyTo 引用、thread 防止同一件事排队两次、supersedes 撤回尚未投递的旧消息。`read_session_info` 只读地看对方：标题、最后一轮回复、最后一次 present 的文件、以及忙闲与队列深度。'
