name: zhangyong0010/dsh-oneshot
category: market
description:
  en: 'Plugin updater with an automatic parallel scan on opening its left-sidebar panel. Installs verified GitHub targets or newer registry versions, checks the installed result, and shows one card per operation in a separate history view. Checks DSH compatibility before replacement and attempts verified recovery after a failed GitHub update. Includes a dsh_oneshot_update agent tool.'
  zh: '从左侧面板打开即并行扫描版本的插件更新器。安装已核验的 GitHub 目标或注册源新版本，更新后核对本地结果，并在独立日志页按每次操作展示一张卡片。替换前检查 DSH 兼容性，GitHub 更新失败后尝试恢复并核对原版。内置 dsh_oneshot_update Agent 工具。'
icon: https://raw.githubusercontent.com/zhangyong0010/dsh-oneshot/main/assets/icon-180.png
