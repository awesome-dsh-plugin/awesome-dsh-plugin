url: https://github.com/836157055/dsh-teleagent-pool
name: 836157055/dsh-teleagent-pool
category: model
description:
  en: 'Registers two LLM account pools as model providers: TeleAgent (China Telecom TeleAI; paste a token once) with a daily 09:00 UTC+8 full-pool check-in — currently check-in, balances and model listing only, since its chat is blocked by the client signing key — and AutoClaw (Zhipu desktop, Windows), whose tokens are decrypted from the local DPAPI-protected credential store and whose chat streams through the desktop bridge. Both pools report credit balances and model catalogs; quota-triggered failover across local desktop instances is automatic, while switching the AutoClaw account is an opt-in setting (off by default). Panels ship in settings and the left sidebar.'
  zh: '把两个 LLM 账号池注册为模型提供方：TeleAgent（中国电信天翼 AI 星辰超级智能体，需手工粘贴一次 token）支持每天 09:00（UTC+8）全量自动签到，目前提供签到、余额与模型目录，对话仍被客户端签名密钥挡住；AutoClaw（智谱桌面端，Windows）的 token 由本机 DPAPI 保护的凭据解出，对话经桌面端桥接流式返回。两个号池都能查询积分余额与模型目录；额度耗尽时会自动在本地桌面端实例之间转移，切换 AutoClaw 账号则需在设置中开启（默认关闭）。设置页与左侧边栏均有面板。'
