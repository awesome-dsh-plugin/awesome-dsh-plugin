url: https://github.com/kenryu42/cc-safety-net
name: kenryu42/cc-safety-net
category: security
description:
  en: Pre-execution guard that blocks destructive Git and filesystem commands and access to secrets such as SSH keys and .env files before a tool call runs.
  zh: 执行前守卫，在工具调用运行前拦截破坏性 Git 与文件系统命令，以及对 SSH 密钥、.env 等机密文件的访问。
