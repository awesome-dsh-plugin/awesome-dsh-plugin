url: https://github.com/STARDUSTLC666/dsh-email
name: STARDUSTLC666/dsh-email
category: notify
icon: https://raw.githubusercontent.com/STARDUSTLC666/dsh-email/main/assets/plugin-icon.webp
description:
  en: 'Email workbench and 16 email_* tools for IMAP/POP3/SMTP, Google/Outlook OAuth and AgentMail: browse mail and attachments with remote images blocked by default, manage custom IMAP folders, review drafts before approved immediate or scheduled sending, and opt into tasks from authorized senders. Includes multi-account presets, 5 workbench themes and a 4-step setup guide; Outlook device-code login uses a built-in community client with a clientId override. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '邮件工作台与 16 个 email_* 工具：支持 IMAP/POP3/SMTP、Google/Outlook OAuth 与 AgentMail，默认拦截远程追踪图，可浏览邮件及附件、管理自建 IMAP 文件夹、核对草稿后审批立即或定时发送，按需开启授权发件人的邮件任务；含多账号预设、5 套工作台主题及 4 步引导，Outlook 设备码登录内置社区客户端并可用自有 clientId 覆盖。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
