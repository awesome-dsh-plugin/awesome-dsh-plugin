description:
  en: 'Email workbench and 16 email_* tools over IMAP/POP3/SMTP, Google/Outlook OAuth and AgentMail (QQ, 163, Tencent Exmail and custom server presets): browse mail and attachments with remote images blocked by default, manage custom IMAP folders, review HTML/text drafts before immediate or scheduled send, and optionally run workspace tasks from authorized senders; 5 switchable workbench themes.'
  zh: '邮件工作台与 16 个 email_* 工具：支持 IMAP/POP3/SMTP、Google/Outlook OAuth、AgentMail 及 QQ/163/腾讯企业邮/自定义服务器预设；默认拦截远程追踪图，支持附件下载、自建 IMAP 文件夹管理、HTML/纯文本草稿核对后立即或定时发送、发信审批门、默认关闭的授权邮件任务及 5 套工作台主题。'
