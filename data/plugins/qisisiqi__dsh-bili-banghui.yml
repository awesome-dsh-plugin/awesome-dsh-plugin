url: https://github.com/qisisiqi/dsh-bili-banghui
name: qisisiqi/dsh-bili-banghui
category: workflow
description:
  en: A Bilibili reply inbox that groups replies to you by person and thread, drafts three options based on the other person's tone, and posts only after you confirm. Credentials, persona and API key stay in a local data folder.
  zh: B站回复收件箱：把「回复我的」按人与楼层聚合成会话，AI 按对方态度出三条候选，确认后才发出；凭证、人设与 API Key 只存本地 data 目录。
