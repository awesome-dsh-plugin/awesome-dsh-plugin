The plugin is a Bilibili reply inbox: it pulls "replies to me", groups them by person and thread, shows the thread with the original post, drafts three options after classifying the other person's tone (agree / friendly / neutral / argumentative / hostile), and sends only after a confirmation dialog. It keeps credentials, persona and API key in a local `data/` folder and never uploads them. Built-in 62 Bilibili emoji; no runtime dependencies beyond Node/DSH.
