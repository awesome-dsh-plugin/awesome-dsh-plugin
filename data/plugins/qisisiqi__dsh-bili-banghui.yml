name: qisisiqi/dsh-bili-banghui
category: workflow
description:
  en: 'Tired of the daft replies on Bilibili? This plugin answers them for you: it groups the replies you got by person and thread into conversations, lines up the original comment, their reply and yours on one screen, and when you tap the AI reply button it first reads whether the other person is agreeing, chatting or picking a fight (it will not argue back at someone friendly), then offers three options you can edit into your own voice. Nothing goes out until you confirm, and every send is logged. Sign-in, persona and the model API key live under the avatar menu in the top-right corner; credentials stay in your local data folder.'
