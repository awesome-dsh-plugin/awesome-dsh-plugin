description:
  en: 'Cleanup Mode agent preset for DSH: read-only scans of leftovers (including duplicate detection), a manifest before anything is deleted, trash-first removal only after confirmation, and a per-session audit log.'
  zh: 'DSH 清理模式 agent 预设：只读扫描残留（含重复文件检测），删除前先出清单，确认后优先移入回收站，并按会话写审计记录。'
