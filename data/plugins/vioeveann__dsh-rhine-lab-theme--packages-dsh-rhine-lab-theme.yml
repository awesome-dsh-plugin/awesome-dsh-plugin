description:
  en: 'A maintained rebuild of the Rhine Lab theme: two skins (cream/graphite and a lighter variant), a header lockup, a grid-only background with the central animated watermark removed, and user bubbles that hug their text. Plain CSS and local SVG, no network access at runtime.'
  zh: '莱茵生命主题的独立维护分支：两套皮肤（奶油白/石墨黑与明色变体）、顶栏标志、去掉中央动态水印的纯网格背景、贴内容宽度的用户气泡。纯 CSS 与本地 SVG，运行时不联网。'
