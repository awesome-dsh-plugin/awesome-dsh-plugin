url: https://github.com/daimingxing/dsh-reload
name: daimingxing/dsh-reload
category: dev
description:
  zh: '给 DSH 插件开发准备三件事：重载文件有改动的插件、重载办不到的改动就重启客户端、模型能自己触发热重载。重载走 DSH 自带的路径，没碰过的插件继续运行。重启从客户端外部发起，所以被替换的正是客户端也能完成，有会话或后台任务在跑时拒绝。轻量：不带参数、不添加上下文、按钮默认不出现。'
  en: 'Three things for DSH plugin development: reload the plugins whose files changed, restart the client when a reload cannot apply a change, and let the model trigger a reload itself. Reload uses DSH''s own path, so untouched plugins keep running. Restart starts outside the client, so it completes even when the client is what gets replaced, and refuses while a session or job runs. Lightweight: no parameters, no added context, buttons off by default.'
