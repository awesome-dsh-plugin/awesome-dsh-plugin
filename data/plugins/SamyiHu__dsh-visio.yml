url: https://github.com/SamyiHu/dsh-visio
name: SamyiHu/dsh-visio
category: docs
description:
  en: 'Open and edit Visio (.vsdx) drawings in a DSH panel: live SVG preview, shapes, swimlanes and connectors with side-midpoint routing and no-through-shape checks, .vssx stencil import, layout audit, and a visio tool so the agent can read and modify the drawing. Python stdlib engine, no Visio or Office needed; Python 3.9+ on PATH, Pillow for PNG export and snapshots. Requires Python 3 on PATH.'
  zh: '在 DSH 面板里打开和编辑 Visio（.vsdx）图纸：实时 SVG 预览，图形、泳道与连接线（侧面中点走线、禁止穿过图形）编辑，支持 .vssx 模具导入与布局检查，另有 visio 工具供 Agent 直接读写图纸。引擎为 Python 标准库，无需安装 Visio 或 Office；需要 PATH 中有 Python 3.9+，PNG 导出与快照另需 Pillow。需要 PATH 里有 Python 3。'
