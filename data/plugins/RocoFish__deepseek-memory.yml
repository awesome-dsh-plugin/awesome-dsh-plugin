url: https://github.com/RocoFish/deepseek-memory
name: RocoFish/deepseek-memory
category: memory
description:
  en: Long-term memory for dsh with defense-in-depth hardening. Two tiers (project `.dsh-memory/` and user `$DSH_HOME/memory/`), each a plain hand-editable JSON file with bounded entries and tags. Writes are atomic (unique temp file + rename, previous revision kept in a bounded history/) and serialized across processes by a per-tier lock with stale reclaim; a disk-revision check refuses lost updates instead of silently overwriting another writer. Memory text is wrapped in explicit untrusted-data boundaries (forged wrappers stripped on write) to blunt prompt injection from remembered content, load-time validation rejects out-of-bounds stores, and symlink escapes out of the tier directory are refused with MEMORY_STORE_ESCAPE. No content-heuristic filtering and no confirmation step, so headless auto-consolidation stays intact. Install: dsh plugin --profile web add github:RocoFish/deepseek-memory
  zh: 带纵深加固的 dsh 长期记忆插件。两层存储（项目级 `.dsh-memory/` 与用户级 `$DSH_HOME/memory/`），每层就是一个可手改、可 diff 的纯 JSON 文件，条目与标签均有上限。写入原子（唯一临时文件 + rename，旧版本进入有上限的 history/ 备份），跨进程由带过期回收的 per-tier 锁串行化；磁盘 revision 校验拒绝丢失更新，绝不静默覆盖其他写入者。记忆文本以显式 untrusted-data 边界包装（伪造包装标签写入时剥除）以削弱记忆内容中的提示注入，加载时校验拒绝越界存储，tier 目录外的符号链接逃逸以 MEMORY_STORE_ESCAPE 拒绝。不做内容启发式过滤、不加确认步骤，无头自动巩固流程不受影响。安装：dsh plugin --profile web add github:RocoFish/deepseek-memory
