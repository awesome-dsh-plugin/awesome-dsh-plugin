description:
  zh: "论文伴读工作台：文献库 + PDF 阅读器 + 教练式伴读。回答必带页码，点页码跳回 PDF 并高亮闪烁对应原文；选中即问不打断阅读；自带「严格师傅」preset——定阅读计划、逐节带读、出题批改，成绩跨会话累积；阅读器滚动 ↔ 单页翻页双模式（键盘翻页/页码跳转），右栏全屏可用；文献库专题与论文改名删除（转录/译文/学习档案连带迁移）、PDF 路径一键复制、译文 PDF 一键导出；原文 ↔ 纯中文原地切换（babeldoc 零预装）。本地转录检索，文档不出本机。"
  en: "Paper reading workbench: library + PDF reader + tutor-style companion. Answers cite clickable page numbers that jump back to the PDF and flash the exact passage; select-to-ask without leaving the paper; bundled strict-tutor preset (reading plan, section coaching, graded quizzes tracked across sessions); reader with continuous-scroll and single-page modes (keyboard paging, page jump), rightbar-fullscreen safe; rename/delete topics and papers (transcripts, translations and study records move along), one-click path copy and translated-PDF export; in-place original ↔ Chinese toggle (babeldoc, zero preinstall). Local transcription and search — documents never leave your machine."
