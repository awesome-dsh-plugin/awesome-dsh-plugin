name: GGboya/dsh-paper-reader
category: docs
description:
  zh: "论文伴读工作台：文献库 + PDF 阅读器 + 教练式伴读。回答必带页码，点页码跳回 PDF 并高亮闪烁对应原文；选中即问不打断阅读；自带「严格师傅」preset——定阅读计划、逐节带读、出题批改，成绩跨会话累积；配置 MinerU（本地自建免注册 / mineru.net 云端 token 二选一）后：扫描版 PDF 可读可伴读、公式可点引用（点一下即得 LaTeX 源码进对话）、公式可检索（QK^T 直接命中），∑ 面板按页浏览全文公式；可选嵌入端点语义召回，大白话提问命中术语段落。文献库专题/论文改名删除——删除走 .trash 回收站可恢复、非空专题批量清空一次确认；阅读器滚动 ↔ 单页翻页双模式、右栏全屏可用、PDF 路径一键复制、译文 PDF 一键导出；原文 ↔ 纯中文原地切换（babeldoc 零预装）。默认本地转录检索，文档不出本机；仅当启用云端 MinerU、嵌入端点或翻译端点时，对应文本才会发往你配置的服务。"
  en: "Paper reading workbench: library + PDF reader + tutor-style companion. Answers cite clickable page numbers that jump back and flash the exact passage; select-to-ask without leaving the paper; bundled strict-tutor preset (reading plan, section coaching, graded quizzes tracked across sessions). With MinerU configured (self-hosted, no signup / mineru.net cloud token): scanned PDFs become readable, formulas become click-citable (one click sends the LaTeX source into the chat) and searchable (QK^T hits directly), plus a per-page formula panel; optional embeddings endpoint adds semantic recall for plain-language questions. Rename/delete topics and papers — deletes go to a recoverable .trash with a batch-clear flow for non-empty topics; reader with scroll/single-page modes, rightbar-fullscreen safe, one-click path copy and translated-PDF export; in-place original ↔ Chinese toggle (babeldoc, zero preinstall). Transcription and search run locally by default — documents never leave your machine; only when cloud MinerU, an embeddings endpoint, or a translation endpoint is enabled does the corresponding text go to the service you configure."
tarball: https://github.com/GGboya/dsh-paper-reader/releases/latest/download/dsh-paper-reader.tgz
