url: https://github.com/che0911/dsh-bilingual-description
name: che0911/dsh-bilingual-description
category: tools
description:
  en: 'Blocks tool calls whose description argument is not written in both Chinese and English: adds a system-prompt section stating the 中文:“…” 英文:“…” format and a tool guard that rejects English-only calls before they run. Scoped to shell tools by default, configurable to every tool.'
  zh: '拦截 description 参数没有同时写中文和英文的工具调用：加一段说明「中文:“…” 英文:“…”」格式的系统提示，并在执行前用工具守卫拒绝只写英文的调用。默认只作用于命令行类工具，可配置为全部工具。'
icon: https://raw.githubusercontent.com/che0911/dsh-bilingual-description/main/assets/icon-180.png
