description:
  en: 'Live Android device pane next to your DSH conversation: scrcpy H.264 streaming, agent taps verified by screenshots and a UI tree, and screenshots / recordings / debug evidence saved into one host directory. Debug sessions keep segmented video, full logcat and per-action frames. Emulators and USB phones, human+agent co-operation, loopback-only. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 对话旁打开 Android 设备实时画面：scrcpy H.264 串流，agent 可点按操作并用截图与控件树自证，截图 / 录屏 / 调试证据统一存进你指定的电脑目录；调试会话自带分段视频、全量 logcat 与逐动作前后帧。模拟器与 USB 真机通吃，人机共屏，仅限本机回环。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
