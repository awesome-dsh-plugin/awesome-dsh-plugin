url: https://github.com/binskyz/dsh-yunpa
name: binskyz/dsh-yunpa
category: browser
description:
  en: "Local encrypted credential vault (DPAPI-wrapped AES-256-GCM) plus a headless-Chrome login keeper: 31 agent tools log a site in once, keep the session on disk, and fetch login-walled pages (Tieba, NGA, Pixiv, one book site) with per-floor post extraction. The live page mirrors into a draggable, collapsible right-edge dock where clicks, typing and scrolling replay over CDP, so a captcha can be solved without a separate browser window; Edge's saved passwords migrate by driving Edge's own autofill instead of reading its store. Ships a one-command installer that repairs the DSH profile registration and a 13-check self-test."
  zh: "本地加密凭据库（DPAPI 包裹的 AES-256-GCM）配无头 Chrome 登录态保管：31 个 agent 工具登录一次即可把会话存到本机，之后抓登录墙内的页面（贴吧、NGA、Pixiv、书屋）并逐楼层提取正文。页面实时镜像到可拖动、可收起的右边缘抽屉，点击、打字、滚动经 CDP 回放，验证码不必再开独立浏览器窗口；迁移 Edge 已存密码时驱动 Edge 自己的自动填充，而不是直接读它的密码库。另附一条命令修复 DSH profile 登记的安装器，以及 13 项自检。"
