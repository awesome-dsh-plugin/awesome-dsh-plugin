name: yingqi-studio/dsh-material-library
category: session
description:
  en: 'Material library for dsh: collect a folder, file or note from a conversation, keep it in real folders with tags, browse it Finder-style, reopen the source chat''s output in one click. Ships a materials_archive tool plus auto-filing rules: file a task''s deliverable once, and every later scheduled run files the new documents by itself.'
  zh: 'dsh 材料库：把对话里产出的目录、文件或笔记收进真实文件夹并打标签，按 Finder 方式浏览，点一下跳回原始会话。内置 materials_archive 工具与自动归档规则：手动收过一次某任务的成品，之后每次定时任务跑完都会自动把新成品收进同一个文件夹。'
icon: https://raw.githubusercontent.com/yingqi-studio/dsh-material-library/main/docs/three-pane.png
