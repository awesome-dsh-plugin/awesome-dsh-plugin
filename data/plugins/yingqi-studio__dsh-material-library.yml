description:
  en: 'Material library for dsh: collect a folder, file or note from a conversation, keep it in real folders with tags, browse it Finder-style, reopen the source chat''s output in one click — plus a materials_archive tool so a scheduled task files its own output.'
  zh: 'dsh 材料库：把对话里产出的目录、文件或笔记收进真实文件夹并打标签，按 Finder 方式浏览，点一下跳回原始会话；另有 materials_archive 工具，定时任务可以自己把产出归档进库。'
