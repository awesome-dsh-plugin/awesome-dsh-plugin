name: maburykh-gif/dsh-plugins#tool-turbo
category: model
description:
  en: 'Port of Electricitysheep/dsh-tool-turbo to DSH 0.2.2-rc.1: after each tool round it picks reasoningEffort for the next step from the finished assistant message — at least 75% cheap calls lower the effort, a largest argument of 3200+ characters raises it, otherwise the choice is left alone — and restores the user selection at the final answer or turn end. Only reasoningEffort changes; provider and model stay, and effort levels are read from the provider catalogue instead of being hardcoded. MIT, upstream attribution kept in NOTICE.'
  zh: 'Electricitysheep/dsh-tool-turbo 的 DSH 0.2.2-rc.1 移植：每轮工具调用结束后，根据已完成的 assistant 消息为下一步选择 reasoningEffort——低价调用占比 ≥75% 时降低，最大参数 ≥3200 字符时提高，其余情况不动；最终回答或回合结束时恢复用户原来的选择。只改 reasoningEffort，provider 与模型不变，档位来自 provider 目录而非硬编码。MIT，NOTICE 保留上游署名。'
