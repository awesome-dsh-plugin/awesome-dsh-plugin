url: https://github.com/cayan0x/Lume
name: cayan0x/Lume
category: tools
description:
  zh: "DSH Desktop 人设与记忆插件：从聊天记录、小说、剧本或设定文档蒸馏角色；支持长期与临时记忆、风格学习、认可语料、人设切换纠偏、记忆星图和角色卡导入导出。任务侧仅保留轻量工作纪律，不再注入计划、台账或动态提醒。"
  en: "A persona and memory plugin for DSH Desktop. Distill characters from chats, novels, scripts, or character sheets; keep long-term and temporary memories, learn style corrections and approved replies, detect persona leakage after switching, visualize memories, and import or export persona cards. Task guidance is reduced to one lightweight fixed discipline with no plans, ledgers, or dynamic reminders."
