url: https://github.com/asots/dsh-longsession
name: asots/dsh-longsession
category: ui
description:
  en: 'Adds a reversible “Compact page” toggle to the session header with a light/dark status dot: it unloads the history already rendered by the page and keeps the last two turns, then shows “Page compacted”; clicking again restores the saved window. A restore keeps auto-compaction off for the rest of that session; thresholds and request caps live on Settings → Long session.'
  zh: '在会话标题栏添加带深浅色状态圆点的可逆「精简页面」开关：未精简时点击卸载页面已渲染的旧历史、只保留最近两轮，按钮变为「已精简页面」；再点还原之前的窗口。手动还原后本会话不再自动精简；阈值与请求上限在 设置 → 长会话。'
