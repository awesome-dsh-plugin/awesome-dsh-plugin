url: https://github.com/wyk4447/dsh-diff-review
name: wyk4447/dsh-diff-review
category: security
icon: https://raw.githubusercontent.com/wyk4447/dsh-diff-review/main/assets/icon-256.png
description:
  en: 'Pre-execution review gate for file writes, edits and deletions: the tool call is held before it runs, a right-sidebar panel shows the computed diff (unified, or source versus result side by side), and nothing is written until Accept is clicked; pwsh commands that create, overwrite or delete files through a literal path are held the same way, and a command whose target is only known at runtime shows its raw command line instead of a diff. A command touching several files is held once and reviewed as one tab per file. What a diff cannot express is reported instead — a binary file or source map shows its byte sizes, and a change that only touched line endings or indentation says so. Accepted changes are kept as snapshots and can be restored from a history view, and tools without a dedicated adapter are judged by their arguments: a path plus a mutating verb is held, a read is not.'
  zh: '写入前的审查闸门：write、edit 与删除操作在执行前被挂起，右侧边栏展示算好的 diff（统一视图或原文/新文并排），点「接受」才真正落盘；pwsh 里通过字面路径创建、覆盖、删除文件的命令同样挂起，目标在运行时才确定的命令则展示原始命令行而非 diff。一条命令动了多个文件时只挂起一次，面板里按文件逐格切换查看。算不出 diff 的改动改为报告可知的信息：二进制文件与 sourcemap 显示字节数，只改了换行符或缩进的变更直接说明。已接受的改动留有快照，可在「历史」里还原；插件没有专门适配的工具按参数判定，点名了路径又带改动动词才拦，读操作不拦。'
