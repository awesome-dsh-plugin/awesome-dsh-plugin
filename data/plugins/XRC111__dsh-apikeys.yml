url: https://github.com/XRC111/dsh-apikeys
name: XRC111/dsh-apikeys
category: tools
description:
  en: 'A credential proxy for outbound API calls: keeps keys for GitHub, Cloudflare, Vercel, npm, Docker Hub, Hugging Face and custom platforms, and calls them from the Host so the model never holds the key. apikey_call takes a path rather than a URL, pinning the host to the platform definition; apikey_platforms lists accounts without values; apikey_key gets, sets or clears one; apikey_upload sends multipart with a file read from disk, bounded by an allowlist. Supports five auth shapes (bearer, custom header, x-api-key, basic, query string). Optional layers, each off by default or preserving existing behaviour: an AES-256-GCM vault with a scrypt-derived key and an authenticated header, a SHA-256 hash chain over credential operations that records no key values, response redaction of the key actually used, and per-platform failover on 401/403/429. Ships a CLI (list, verify, audit, call) that reads the same vault without the harness.'
  zh: '出站 API 调用的凭证代理：把 GitHub、Cloudflare、Vercel、npm、Docker Hub、Hugging Face 与自定义平台的 Key 存起来，并由 Host 侧发起调用，模型始终不持有 Key。apikey_call 的参数是路径而非 URL，主机由平台定义固定；apikey_platforms 列出账号但不返回值；apikey_key 读取、写入或清除单个 Key；apikey_upload 从白名单目录读取本地文件发 multipart。支持五种认证方式（Bearer、自定义头、x-api-key、Basic、查询串）。可选层默认关闭或不改变既有行为：用 scrypt 派生密钥、头部参与认证的 AES-256-GCM 加密保管库，只记录凭证操作、不记录任何 Key 值的 SHA-256 哈希链，针对本次实际所用 Key 的响应脱敏，以及按平台在 401/403/429 时故障转移。附带 CLI（list、verify、audit、call），无需 harness 即可读同一个保管库。'
