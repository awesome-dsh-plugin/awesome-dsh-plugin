url: https://github.com/StarterMonk/dsh-adhd-session-mode
name: StarterMonk/dsh-adhd-session-mode
category: skill
description:
  en: 'DeepSeek Harness port of the ayghri/i-have-adhd ruleset. One system-prompt section makes replies action-first with numbered steps, restated state and concrete time estimates. The mode is a property of one session rather than a global setting — switch it with /i-have-adhd on|off, or by typing "stop adhd mode" — and its state is folded from that session''s log, so it survives resume and fork. A badge below the composer shows the current session''s state.'
  zh: 'ayghri/i-have-adhd 规则集在 DeepSeek Harness 上的移植。一个系统提示词区段让回复行动先行、步骤编号、复述进度、时间估算用真实单位。模式是单个会话的属性而非全局设置——用 /i-have-adhd on|off 切换，也可以直接打字说 "stop adhd mode"——状态由该会话的日志折叠得出，因此 resume 与 fork 之后依然正确。输入框下方的徽标显示当前会话的状态。'
