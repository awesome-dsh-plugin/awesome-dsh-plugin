  en: '340-entry code-animation style library, 8 prompt templates and 5 renderable code templates in a sidebar panel, plus agent tools (awkit_search / awkit_get_style / awkit_render_template) so the model can pick a style and render a template during a turn; content ships inside the package, no extra download.'
