description:
  en: 'DSH Agentrix supports coordinator-led direct or delegated work, configured worker models, independent review, and requirement-linked verification evidence and acceptance records. Version 1.8.3 supports DSH 0.2.2-rc.1 and rc.3 activation contracts, tabbed live progress, and distinct current and historical decisions. Verified on Windows with PowerShell 7 (pwsh) and Git; other systems are untested.'
  zh: 'DSH Agentrix 由主控决定直接执行或委派，支持配置执行模型、独立审查与按需求证据验收。1.8.3 兼容 DSH 0.2.2-rc.1 和 rc.3 的启动接口，用多页签展示实时进度、消息和判断，并区分当前与历史记录。仅在 Windows + PowerShell 7（pwsh）+ Git 环境验证，其他系统未验证。'
