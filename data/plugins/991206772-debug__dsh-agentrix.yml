category: workflow
description:
  en: 'DSH Agentrix supports coordinator-led direct or delegated work, configured worker models, dispatch-time coordinator models for independent review, progress and request usage tracking, registered requirements linked to verification evidence, and a read-only acceptance view that distinguishes plan completion from request coverage. Verified only on Windows with PowerShell 7 (pwsh) and Git; other systems are untested.'
  zh: 'DSH Agentrix 由主控决定直接执行或委派，执行者使用配置模型，独立审查沿用分发者模型；展示进度和需求用量，将登记需求关联到验证证据，并在只读验收页区分计划验收与需求覆盖。目前仅在 Windows + PowerShell 7（pwsh）+ Git 环境验证，其他系统未验证。'
