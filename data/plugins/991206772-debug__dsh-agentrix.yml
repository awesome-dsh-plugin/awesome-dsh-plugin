description:
  en: 'DSH Agentrix lets the coordinator choose direct work or delegate to a configured execution model, tracks progress and request usage, and requires evidence-based acceptance for delegated tasks. Independent reviews use the coordinator model recorded at dispatch. Verified only on Windows with PowerShell 7 (pwsh) and Git; other systems are untested.'
  zh: 'DSH Agentrix 由主控判断直接执行或委派，执行者使用配置模型，独立审查沿用分发者模型；展示执行进度、需求用量，托管任务按证据验收。目前仅在 Windows + PowerShell 7（pwsh）+ Git 环境验证，其他系统未验证。'
