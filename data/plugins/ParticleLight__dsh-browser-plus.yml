category: browser
tarball: https://github.com/ParticleLight/dsh-browser-plus/releases/download/v0.5.0/dsh-browser-plus-0.5.0.tgz
description:
  en: 'Visible Electron browser for DSH with one shared BrowserWindow, isolated task views, explicit human-Agent handoff, snapshot-reference and native navigation tools, operation trails, demand-driven page thumbnails, and keyed session recovery for reliable tab switching and closing. v0.5.0 adds dialog control (accept, dismiss, or inspect alert, confirm and prompt), console and network diagnostics, device emulation, statement bodies in browser_execute, filtered snapshots, and an explicit refusal when a coordinate click lands outside the viewport.'
  zh: '面向 DSH 的可见 Electron 浏览器：共享一个 BrowserWindow，提供隔离任务视图、显式人机交接、快照引用与原生导航工具、操作轨迹、按需页面缩略图，以及 keyed session 恢复，确保标签页切换和关闭可靠。v0.5.0 新增：对话框控制（接受/拒绝/查看 alert、confirm、prompt）、控制台与网络诊断、设备模拟、browser_execute 支持语句体、快照可过滤，以及坐标点击落在视口外时明确报错。'
