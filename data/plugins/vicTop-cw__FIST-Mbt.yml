description:
  en: 'FIST commander task orchestration as an MCP server: seven-state task lifecycle, hierarchical decomposition, DAG scheduling, self-driving loops and Omega verification, all in one SQLite ledger. Ships a prebuilt CLI, so installing it needs no build step. Requires Node 24+.'
