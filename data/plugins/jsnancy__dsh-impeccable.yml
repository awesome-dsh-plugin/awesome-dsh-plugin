url: https://github.com/jsnancy/dsh-impeccable
name: jsnancy/dsh-impeccable
category: ui
description:
  en: 'Design review desk in the sidebar. The impeccable skill ships inside the plugin, so it works out of the box: type a page path or URL in the field at the top, or pick one of the recent pages, and one click runs 62 deterministic rules (no model calls, no API key). Findings are grouped by problem with file and line, and each one has a link that opens a session with the file and the fix. All 24 skill commands become one-click prompts that copy themselves or start a new conversation, and the whole panel switches between Chinese and English and between auto, light and dark themes, remembering both choices. The detection engine (about 21 MB) is downloaded once in the background on first load; until then the panel says what is happening instead of offering a scan that cannot run.'
  zh: '侧栏里的设计校审台。impeccable 技能随插件自带，装上就能用：顶部输入框填路径或网址，或直接从最近改过的页面里挑一个，点一下就跑 62 条确定性规则（不调模型、不用 API key）。问题按类型分组，每处都标出文件和行号，点「让 AI 帮我改」直接带着问题开新对话；24 条技能命令变成点一下就复制、或直接开新对话的提示词。整个面板可切中英文，也可在自动/浅色/深色之间切换，两个选择都会记住。检测引擎（约 21 MB）首次加载时在后台下载一次，没下完前面板会说明状态，而不是给一个跑不起来的扫描框。'
