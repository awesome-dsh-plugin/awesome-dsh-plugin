name: 01NGVI-QINGYI/no-ai-style
category: skill
description:
  en: 'Prose-editing skill for academic and professional writing. The composer offers three modes: Check — review and suggest without editing, with a verdict when readiness is asked; Polish — improve the wording while keeping the meaning, facts and citations; Draft — draft from the supplied material without adding facts.'
  zh: '学术与专业写作润色技能，输入框三选一：检查——只检查并给建议；询问能否提交时补充结论，不改原文。润色——改善表达，保留原意、事实和引用。起草——根据现有材料起草，不补充材料外的事实。'
