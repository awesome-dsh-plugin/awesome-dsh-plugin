url: https://github.com/xswt442-cmd/dsh-treekeeper
name: xswt442-cmd/dsh-treekeeper
category: dev
description:
  en: 'Windows process-tree reconciler for a DSH host: samples the process tree and the job ledger; attributes each process to the job that created it; reports unattributed and orphaned processes; a whole tree can be killed only after re-checking attribution and creation time.'
  zh: 'DSH 宿主的 Windows 进程树核对：采样宿主进程树与任务账本；把每个进程归属到创建它的任务；标出未归属与孤儿进程；只有在复核归属与创建时间后才可终止整棵树。'
