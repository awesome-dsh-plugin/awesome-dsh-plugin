url: https://github.com/ltayshark0637/dsh-Shutdown-Guard
name: ltayshark0637/dsh-Shutdown-Guard
category: ui
description:
  en: 'Adds a sidebar card to DeepSeek Harness that runs a chosen action once every task finishes and the card is armed — shut down, restart, sleep, hibernate, lock, sign out, or a script you uploaded to its shared library; it holds back with a stated reason while background jobs, errored sessions or a manual interruption are still in play. Verified on Windows, macOS and Linux.'
  zh: '在 DeepSeek Harness 侧边栏加一张卡片：武装后等所有任务结束执行你选的动作——关机、重启、睡眠、休眠、锁屏、注销，或运行你上传到共享脚本库里的脚本；后台任务在跑、本批次有会话报错、或你手动中断过，都会按条件暂缓并说明原因。Windows、macOS、Linux 三平台均已真机验证。'
