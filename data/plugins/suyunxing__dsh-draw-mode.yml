url: https://github.com/suyunxing/dsh-draw-mode
name: suyunxing/dsh-draw-mode
category: tools
description:
  en: "Connects a ComfyUI server to the agent through five draw_* tools (status, workflows, models, generate, reverse), a bundled workflow library for Anima, Krea 2 and Qwen-Image 2.1 with LoRA injection, and a sidebar panel reporting the bridge state. Every path is configuration: server address, ComfyUI install directory, models root, extra workflow directory, a checkpoint-name map and the output folder, so it works against a remote or already-running ComfyUI without any local paths. The bundled workflows still need the checkpoints and custom nodes listed in the README; headless auto-start and idle shutdown are opt-in and off by default."
  zh: "把 ComfyUI 接给 agent：五个 draw_* 工具（状态、工作流、模型、生图、反推）、Anima / Krea 2 / Qwen-Image 2.1 三族工作流库与 LoRA 注入、显示桥接状态的侧栏面板。所有路径都可配置：服务地址、ComfyUI 安装目录、模型根目录、额外工作流目录、检查点文件名映射、出图目录，因此对着远程或已经开着的 ComfyUI 也能用，不必配任何本机路径。内置工作流仍需 README 列出的检查点与自定义节点；无头自动启停与空闲关闭默认关闭，需自行开启。"
icon: https://raw.githubusercontent.com/suyunxing/dsh-draw-mode/main/icon-180.png
