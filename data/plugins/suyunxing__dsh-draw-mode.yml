url: https://github.com/suyunxing/dsh-draw-mode
name: suyunxing/dsh-draw-mode
category: tools
description:
  en: "Connects a local ComfyUI server to the agent through five draw_* tools (status, workflows, models, generate, reverse), a bundled workflow library for Anima, Krea 2 and Qwen-Image 2.1 with LoRA injection, and a sidebar panel reporting the bridge state. The bundled workflows need the specific checkpoints and custom nodes listed in the README, and headless auto-start with idle shutdown is opt-in and off by default."
  zh: "把本机 ComfyUI 接给 agent：五个 draw_* 工具（状态、工作流、模型、生图、反推）、Anima / Krea 2 / Qwen-Image 2.1 三族工作流库与 LoRA 注入、显示桥接状态的侧栏面板。工作流依赖 README 列出的具体检查点与自定义节点；无头自动启停默认关闭，需自行开启。"
icon: https://raw.githubusercontent.com/suyunxing/dsh-draw-mode/main/icon-180.png
