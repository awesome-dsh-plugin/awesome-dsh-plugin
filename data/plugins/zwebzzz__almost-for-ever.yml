url: https://github.com/zwebzzz/almost-for-ever
name: zwebzzz/almost-for-ever
category: memory
description:
  en: 'Derives the index from your Markdown memory files on every turn instead of keeping a hand-written index table, so renames, splits and deletions never leave a stale entry. Retrieval ranks by library tags, section tags, title tokens and body text, then injects the matching line ranges rather than whole files. Writing is model-proposed and user-confirmed through a sticky note; entries are appended after the target section''s format is detected. The visual memory atlas places AGENTS.md at the center of size- and color-weighted library cards, with cross-library full-text search, a section reader, entry and section editing, version-conflict protection, snapshot undo, empty-directory starter templates, and appearance controls. Reads and writes only local memory files and AGENTS.md.'
  zh: '每轮从你的 Markdown 记忆文件现场派生索引，不维护手写索引表，所以改名、拆库、删库都不会留下指向虚空的旧条目。检索按库标签、章节标签、标题词与正文多维排序，注入命中的行号区间而不是整篇文件。模型提议的写入仍需你在便利贴上确认，落盘前探测目标章节格式。可视化馆藏地图以 AGENTS.md 为中心，库卡按体量调整大小与颜色浓度，支持跨库全文检索、章节阅读、条目与章节增删修改、版本冲突保护、快照撤销、空目录起手模板和外观调整。数据只读写本机记忆库与 AGENTS.md。'
