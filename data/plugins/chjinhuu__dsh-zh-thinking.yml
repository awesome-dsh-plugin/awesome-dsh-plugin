description:
  en: Injects a Chinese-thinking reminder around the system prompt and the per-step runtime snapshot, so the agent reasons in Simplified Chinese instead of drifting back to English as the transcript grows.
  zh: 把中文思考提醒注入系统提示与每一步重建的运行时快照，让模型的推理全程用简体中文，不会随着会话变长漂回英文。
