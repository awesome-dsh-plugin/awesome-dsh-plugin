name: feolhn/dsh-palace
category: memory
description:
  en: Memory Palace, a reading workspace that places books (PDF, EPUB), Bilibili video courses and notes on a grid, tracks reading progress, keeps excerpts, thoughts and mistakes, and saves AI chat summaries as notes.
  zh: Memory Palace 读书插件：把书（PDF、EPUB）、B 站视频课和笔记放进格子宫殿，记录读书进度、摘录、想法和错题，并把 AI 对话总结存成灵感。
