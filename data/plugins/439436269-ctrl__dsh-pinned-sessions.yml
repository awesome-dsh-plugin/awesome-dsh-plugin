description:
  en: 'A pinned group above the workspace browser: pinned sessions from every workspace in one collapsible, searchable list, plus pinned Workspaces that unfold their own sessions in place, with a pin entry in the workspace row menu.'
  zh: '侧栏「工作区」上方的一个置顶分组：跨工作区汇总置顶会话，可折叠、可就地搜索；置顶的工作区行点一下就地展开它自己的会话，工作区行右键菜单里也能置顶。'
