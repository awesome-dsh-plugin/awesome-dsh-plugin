url: https://github.com/PerryLink/dsh-draw
name: PerryLink/dsh-draw
category: vision
description:
  en: 'Unified static-image generation router for DeepSeek Harness: one image_generate tool with standard parameters, config-driven OpenAI-compatible engine routing (OpenAI Images, Zhipu CogView, any compatible endpoint) with health-aware fallback, durable workspace attachment results, per-session quota accounting, an in-conversation result card, and a Plugins settings panel storing API keys as credential references.'
  zh: '统一静态图像生成路由：一个 image_generate 工具、标准参数、配置驱动的 OpenAI 兼容引擎路由（OpenAI Images、智谱 CogView 及任意兼容端点）带健康感知回退，结果落工作区附件存储，会话级配额记账，会话内结果卡片 + 设置面板（API 密钥仅存凭据引用）。'
