url: https://github.com/ChongYuGit/dsh-rider-mcp
name: ChongYuGit/dsh-rider-mcp
category: dev
description:
  en: Connects DeepSeek Harness to the MCP server built into JetBrains Rider, adding a per-session project picker, a connection badge and the mcp__rider__* tools. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 把 DeepSeek Harness 接到 JetBrains Rider 内置的 MCP server，并给每个会话一个项目选择器、一个连接徽标和 mcp__rider__* 工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
icon: https://raw.githubusercontent.com/ChongYuGit/dsh-rider-mcp/main/assets/icon-180.png
