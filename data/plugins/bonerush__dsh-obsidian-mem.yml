url: https://github.com/bonerush/dsh-obsidian-mem
name: bonerush/dsh-obsidian-mem
category: memory
description:
  en: 'Project documents and long-term memory as plain Markdown in a dedicated Obsidian vault: six mem_* tools (search, read, write, log, brief, admin), one budgeted recall injection at the first step of a session, and automatic distillation of completed turns. Obsidian does not need to be running, and the vault stays readable with the plugin uninstalled.'
  zh: '把项目文档与长期记忆以纯 Markdown 存进专用 Obsidian 仓库：六个 mem_* 工具（search / read / write / log / brief / admin）、会话第一步的一次带预算召回注入，以及已完成回合的自动蒸馏。Obsidian 无需运行，卸载插件后仓库内容照常可读。'
