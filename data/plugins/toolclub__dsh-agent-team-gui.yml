url: https://github.com/toolclub/dsh-agent-team-gui
name: toolclub/dsh-agent-team-gui
category: workflow
description:
  en: Persistent multi-model squads configured in Settings and selected in the Composer, with per-member model and tool policies. By default the lead Agent completes simple work itself and delegates only when the saved squad is needed; delegated work runs as a bounded DAG with optional review and repair. Run Center tracks retries and per-member tokens from official Harness usage events.
  zh: 持久化多模型小队在 Settings 中配置、从 Composer 选择，并支持逐成员模型与工具策略。默认由主 Agent 自行完成简单任务，需要已保存的小队时才派工；派工按有界 DAG 执行，并可进行有限的审核与返工。Run Center 展示重试和基于 Harness 官方 usage 事件的逐成员 token 用量。
tarball: https://github.com/toolclub/dsh-agent-team-gui/releases/download/v1.3.0/dsh-agent-team-gui-1.3.0.tgz
