name: toolclub/dsh-agent-team-gui
category: workflow
description:
  en: Persistent multi-model agent squads that collaborate on ordinary sends, with per-agent primary and fallback model/tool policies, per-project defaults, and a run centre showing plans, retries, and provider-reported token usage.
  zh: 持久化多模型 Agent 小队，可在普通发送中协作：逐成员配置主用与回退的模型/工具策略，支持按项目设默认，运行中心展示计划、重试与厂商上报的 token 用量。
