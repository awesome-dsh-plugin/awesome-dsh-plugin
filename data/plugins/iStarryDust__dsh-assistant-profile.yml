description:
  en: 'Agent persona and memory: every new session carries a global persona (name, style, language, prompt) that can be edited or saved as variants; a cross-session memory can be edited in settings or distilled from a chat with one click.'
  zh: 'Agent人格与记忆：每个新会话都带着一份全局人格（名称、风格、语言、人格提示词），可自行定义/另存；另有一份跨会话的助理记忆，可在设置里编辑，也能从聊天记录一键提炼。'
