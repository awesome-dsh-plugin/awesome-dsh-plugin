url: https://github.com/d0ublecl1ck/dsh-session-radar
name: d0ublecl1ck/dsh-session-radar
category: session
description:
  en: 'Sidebar unread / waiting / status hub for DSH Web: a bell jumps to the next unread session, a shortcut walks sessions waiting for input, and ⌘⇧, / ⌘⇧. step back and forward through the conversations you have visited; one overlay lists unread and pending sessions side by side; a six-metric readout at the sidebar foot makes every icon a button that jumps to the next session of that kind; a host-side ledger keeps the account across restarts, so an unread session keeps its green row dot after a restart, and a startup dialog offers to re-send a continue message to sessions whose turn was cut off.'
  zh: 'DSH Web 侧边栏的未读、待办与状态读数中枢：铃铛按顺序定位未读会话，快捷键依次走到正在等你输入的会话，⌘⇧, / ⌘⇧. 在访问过的对话之间前后切换；另有总览把未读与待决策会话分两区铺开；底部一行六项会话状态读数，每个图标都能点，点了跳到下一个同类会话；账本落在 host 半边，重启也不丢——未读会话重启后仍然显示行内绿色小标，启动时还会把上次被切断的会话列成清单，一键重发续跑消息。'
