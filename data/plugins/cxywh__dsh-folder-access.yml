url: https://github.com/cxywh/dsh-folder-access
name: cxywh/dsh-folder-access
category: security
description:
  en: 'Adds a folder button to the composer: pick any local directory and the agent may then write inside it in this conversation. The grant is injected into the model runtime context right away, so it never has to ask for the path or be reminded. Its HTTP routes pass DSH''s own admission (Host/Origin fence plus an authenticated browser peer) before acting.'
  zh: '在输入框左侧加一个文件夹按钮：选中本地目录后，当前对话即可在其中读写。授权会立刻注入模型的运行时上下文，模型无需追问路径，也不必由你提醒。它的 HTTP 路由先过 DSH 自带的准入校验（Host/Origin 围栏 + 已认证的浏览器 Peer）才会执行。'
icon: https://raw.githubusercontent.com/cxywh/dsh-folder-access/main/assets/icon-180.png
