url: https://github.com/sleepwalk2887/transproof-dsh-plugin
name: sleepwalk2887/transproof-dsh-plugin
category: tools
description:
  en: 'TransProof translation proofreader for DeepSeek Harness: full web UI (AI translation needs your own model API key or a local Ollama endpoint) plus a local, non-networked run-local-check agent tool. First install requires GitHub access (mainland China users may need a proxy); later updates go through npm + npmmirror mirror, no proxy needed.'
  zh: '译校助手 TransProof 的 DSH 插件：内置完整网页界面，支持 AI 翻译（需自备模型 API Key 或本地 Ollama 端点）、三段流水线校对、术语与专名核验、批量体检改错与一键交付报告；网页版与插件内置同一套界面，另提供一个不联网、不调模型的本地体检 Agent 工具。首次安装需联网 GitHub（国内用户请先开代理）；已安装后更新走 npm + npmmirror 国内镜像，无需代理。'