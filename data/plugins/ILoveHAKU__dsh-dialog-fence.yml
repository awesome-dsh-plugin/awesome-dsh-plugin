name: ILoveHAKU/dsh-dialog-fence
category: dev
description:
  en: 'Per-conversation behavioral rule fence for DeepSeek Harness: rules live in one JSON file, are edited from a Settings page or the conversation panel, and are injected as a single runtime-context section at a fixed order so the system prompt prefix stays stable.'
  zh: '给每个对话加一道行为围栏：规则存在一个 JSON 文件里，可在设置页或对话面板里编辑，作为一段固定顺序的运行时上下文注入，不重写系统提示词前缀。'
