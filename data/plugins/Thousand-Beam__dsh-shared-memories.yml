description:
  zh: DSH 共享记忆插件。将长期记忆、人格、技能与用户画像以日志记录，并通过 Git 快照在多个设备之间同步。提供投毒检测、销毁语义、并发写入检测与 doctor 自检命令。
  en: 'Shared-memory plugin for DSH. Records long-term memories, persona, skills, and user profile as journaled entries and synchronizes them across devices via Git snapshots. Includes poison detection, destruction semantics, concurrent-write detection, and a doctor self-check.'
