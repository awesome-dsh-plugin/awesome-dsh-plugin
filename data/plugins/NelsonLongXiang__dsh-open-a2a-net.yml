url: https://github.com/NelsonLongXiang/dsh-open-a2a-net
name: NelsonLongXiang/dsh-open-a2a-net
category: remote
description:
  en: Superagent teams turn requests into scoped tickets with member assignment, progress reports and owner decision cards; the A2A network connects sessions across linked hosts with signed discovery and receipt tracking. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 用 Superagent 团队受理需求、分派工单、跟踪进展，并通过决策卡交由属主选择；A2A 底座支持签名节点发现、已链接主机间协作和回执追踪。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
