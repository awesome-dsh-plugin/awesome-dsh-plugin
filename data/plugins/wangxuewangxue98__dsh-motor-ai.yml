url: https://github.com/wangxuewangxue98/dsh-motor-ai
name: wangxuewangxue98/dsh-motor-ai
category: tools
description:
  zh: "电机电磁设计 AI 插件完整版：在 L0 毫秒级广筛之上补齐 L1（Ansys RMxprt）与 L2（Motor-CAD）精算层，形成 需求解析 → 参数识别 → 候选矩阵 → L0 预筛 → L1/L2 精算校核 的端到端设计链；与 dsh-motor-ai-l0 互斥，安装前请先卸载 l0，共享核心 @wangxue98/dsh-motor-ai-core 随包自动安装；L1 另需本机安装 Ansys AEDT（RMxprt），L2 另需本机安装 Motor-CAD。完整版采用 PolyForm Noncommercial 许可，L1/L2 需激活码。默认开启遥测：按工具聚合的使用次数和作者称已脱敏的设计经验样本会回传到作者在 wangxuewangxue98.deno.net 的服务器，故障协助还可上传故障报告；可在插件配置里用 telemetryEnabled、designExperienceUpload、faultAssistEnabled 关闭。"
  en: "Full edition of the motor-design AI plugin for DeepSeek Harness: adds the L1 (Ansys RMxprt) and L2 (Motor-CAD) precision layers on top of the L0 millisecond-level broad filter, completing an end-to-end chain from requirement parsing to parameter identification, candidate matrix, L0 pre-screening and L1/L2 verification. Mutually exclusive with dsh-motor-ai-l0 (uninstall l0 first); the shared core @wangxue98/dsh-motor-ai-core installs automatically. L1 needs Ansys AEDT (RMxprt) and L2 needs Motor-CAD installed locally. Distributed under the PolyForm Noncommercial licence; L1/L2 require an activation code. Telemetry is on by default: per-tool usage counts and design-experience samples that the author describes as desensitized are sent to the author's server at wangxuewangxue98.deno.net, and fault assistance can upload fault reports; switch them off with telemetryEnabled, designExperienceUpload and faultAssistEnabled in the plugin config."
