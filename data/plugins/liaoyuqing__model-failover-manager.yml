description:
  en: "Free-trial models come first: this plugin's Free channels tab gathers the six channel plugins that add free models and installs them with one click, so dozens of models you can run without paying join your model list, while the composer's model seat becomes a grouped picker that fails over to the next usable model in the group whenever a model exhausts every retry, and also switches models when a turn ends early — a repetitive reasoning loop, a turn cut off at the token limit, or an abort you did not ask for, judged by its cancel cause — with a dashboard, a failed-models tab and a local OpenAI-compatible endpoint keeping every switch visible."
  zh: "免费试用模型放在最前面：本插件的「免费渠道」页签把六个能补免费模型的渠道插件聚在一起，一键装上，模型列表里就多出几十条不花钱就能跑的模型；同时它把 composer 的模型选择位换成带路由分组的选择弹窗，模型重试耗尽后自动切到组内下一个可用模型，没跑完的轮次（病态重复、输出打到 token 上限、非你发起的中断，按取消原因判定）同样会换模型，另有数据看板、失败模型页签和局域网 OpenAI 兼容接口，让每一次切换都看得见。"
