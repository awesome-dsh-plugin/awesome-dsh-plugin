description:
  en: Signs a zhilian site account in from the settings page, mints one key per group it reuses on reconnects, and registers the models with the protocol each family needs, so chat, responses and messages routes all work without hand-made keys. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 在设置页一键授权智连站点账号，按分组自动创建或复用专用 Key，并按模型家族注册正确的协议路由，无需手动建 Key。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
