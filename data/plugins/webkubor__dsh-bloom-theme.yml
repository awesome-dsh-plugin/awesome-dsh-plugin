url: https://github.com/webkubor/dsh-bloom-theme
name: webkubor/dsh-bloom-theme
category: theme
description:
  en: 'Bloom Morandi theme: nine variants (mist, cinnabar, petal, ripple, sage, stone, lapis, amber, aurora) built on OKLCH so light and dark stay perceptually even, switchable from the top bar, with all 18 foreground/background pairs measured at WCAG AA or better.'
  zh: 'Bloom 莫兰迪主题：九款变体（雾蓝 mist、朱砂 cinnabar、花瓣 petal、涟漪 ripple、鼠尾草 sage、暖石 stone、青金 lapis、琥珀 amber、极光 aurora）基于 OKLCH 调色，明暗切换不跳变，顶栏一键切换，18 组「主色 + 底色」实测全部达到 WCAG AA。'
