url: https://github.com/webkubor/dsh-bloom-theme
name: webkubor/dsh-bloom-theme
category: theme
description:
  en: 'Bloom Morandi theme: ten variants (mist, cinnabar, petal, ripple, sage, stone, lapis, amber, aurora, lavender) built on OKLCH so light and dark stay perceptually even, with frosted-glass panels (translucent fill + backdrop blur + glass edge), light/dark adaptive across all variants, top-bar one-click switch, palette-tuned micro-animations, and all 20 foreground/background pairs measured at WCAG AA or better.'
  zh: 'Bloom 莫兰迪主题：十款变体（黛蓝 mist、朱砂 cinnabar、桃夭 petal、天青 ripple、竹青 sage、赭石 stone、青金 lapis、琥珀 amber、落霞 aurora、青莲 lavender）基于 OKLCH 调色、明暗自适应，磨砂玻璃面板（半透 + backdrop 模糊 + 玻璃边缘），顶栏一键切换，统一克制微动效，20 组「主色 + 底色」实测全部达到 WCAG AA。'
