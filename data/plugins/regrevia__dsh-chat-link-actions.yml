url: https://github.com/regrevia/dsh-chat-link-actions
name: regrevia/dsh-chat-link-actions
category: ui
description:
  en: >-
    Right-click any attachment or path in the transcript and hand it to your own action: send it to a WeChat contact, open it in Chrome, or anything else you configure — one right-click, anything you want. Ships with quote-into-composer, reveal in the OS file manager, copy path and Send to…, and lets you add your own entries (command, open with, shortcut, link, PowerShell). Menus are drawn in the app's own style, never the system one.
  zh: >-
    对话里的附件和路径，右键就是你自己的入口：发给微信好友、用谷歌浏览器打开，或者你想到的任何处理——一个右键，做你想做的任何事。开箱带引用回输入框、在文件管理器里定位、复制路径、发送到…，再往下自己加一条入口（命令、打开方式、快捷指令、链接、PowerShell）。菜单跟着 App 的深浅色和圆角走，不是系统弹窗。
icon: https://raw.githubusercontent.com/regrevia/dsh-chat-link-actions/main/icon.png
