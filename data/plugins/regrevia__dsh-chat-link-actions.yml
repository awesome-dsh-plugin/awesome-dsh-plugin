url: https://github.com/regrevia/dsh-chat-link-actions
name: dsh-chat-link-actions
category: ui
description:
  en: "Right-click a file, link or image in the transcript: quote it back into the composer as the same reference chip a drag-drop makes, reveal it in the OS file manager, or send it to another app. The send list is yours: one line per entry in a plain text editor, and each entry opens the system panel where you pick the app."
  zh: "对话里的文件、链接、图片右键就有动作：引用回输入框插成和拖文件一样的芯片、在文件管理器里直接选中，或者发到别的 App。发到哪儿由你的清单决定：在编辑器里一行一个入口，点一下就弹系统面板挑 App。"
icon: https://raw.githubusercontent.com/regrevia/dsh-chat-link-actions/main/icon.png
