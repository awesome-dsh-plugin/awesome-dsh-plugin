description:
  en: 'Sidebar panel for local git repositories: tags as a version timeline with the files and commits each tag brought, a disk health and SMART column beside it, LAN git sharing over Smart HTTP, and a card that binds a repo to GitHub for one-click pushes. It renders snapshots produced by the user own PowerShell scripts and ships the routes that run them.'
