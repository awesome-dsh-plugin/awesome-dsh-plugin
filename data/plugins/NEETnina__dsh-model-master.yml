  en: 'Model selector for the DSH composer that keeps the native button and menu and takes over only when the small dropdown would open: search across providers, probe any model with a real streaming request to measure TTFT and TPS, and browse a leaderboard of up to 100 rows built from OpenRouter''s catalogue, where clicking a row searches local channels of that name.'
