name: mario841859784/dsh-expert-orchestrator
category: workflow
description:
  en: "Multi-agent orchestration agent preset for DeepSeek Harness: one chief orchestrator that never implements itself — it triages every request, has a PM expert plan the work, and delegates implementation to domain experts via a merged expert roster (list and summon tools), scheduling parallel work through a dependency-DAG taskboard and a file-based message bus, with delivery gated by an independent review. Ships 11 core experts; more expert teams (Agency agents EN/ZH, classic collections) are one-click downloads from the settings page over dual GitHub/CDN channels with sha256 verification. Published on npm as dsh-expert-orchestrator (requires DSH >= 0.1.7-alpha.2)."
  zh: "多智能体编排 agent preset：首席编排者不亲自实施——先分诊、请 PM 专家规划、经合并专家花名册（召唤工具）把实施委派给领域专家，依赖 DAG 任务板与落盘消息总线调度并行协作，交付前经独立评审门禁。出厂内置 11 位核心专家；更多专家团（Agency agents 中英文、classic 集合）可在设置页一键下载，走 GitHub/CDN 双通道并经 sha256 验签。npm 包名 dsh-expert-orchestrator（要求 DSH >= 0.1.7-alpha.2）。"
