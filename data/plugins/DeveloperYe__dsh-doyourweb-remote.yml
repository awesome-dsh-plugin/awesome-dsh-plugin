url: https://github.com/DeveloperYe/dsh-doyourweb-remote
name: DeveloperYe/dsh-doyourweb-remote
category: browser
description:
  en: 'Fork of SheepofSheep/dsh-doyourweb that puts the browser on another machine: the MV3 extension dials out to this plugin over TLS, so DSH reads and acts on a remote Chrome or Edge rather than a local one. It also generates ready-paired extension packages for the current configuration, adds tab open and close tools, writes annotation detail to a file instead of pasting it into the chat, and shows a checklist naming which part of a remote setup is misconfigured. Interfaces with no DOM at all are reachable too: canvas games, canvas maps and hand-drawn widgets take coordinate clicks, drags and wheel input that glide, pause and hold like a person''s, and the viewport is checked before every action so a stale coordinate is refused rather than clicked blindly. It reuses the same browser-tabs plugin id as the upstream, so do not install both in the same profile. Requires Chrome or Edge 125+ and an unpacked MV3 extension loaded manually on the browser machine; the plugin does not install the extension. With tls: true, trust the generated ca.crt as a root certificate there. The extension gives the model access to the tabs and signed-in sessions of the browser it is paired with. The bridge listens on 127.0.0.1 by default; a non-loopback bind needs remote: true, and the extension pairs with a token confirmed by the user.'
  zh: 'SheepofSheep/dsh-doyourweb 的 fork，把浏览器放到另一台机器：MV3 扩展主动经 TLS 出站连接插件，DSH 因此能读取并操作远程的 Chrome/Edge，而不限于本机浏览器。此外按当前配置生成已配对的扩展包、新增开/关标签页工具、把批注明细落盘而不是塞进聊天，并提供远程接入自检表指出配置哪一环不对。完全没有 DOM 的界面也能操作：canvas 游戏、canvas 地图与自绘控件可用坐标点击、拖拽与滚轮驱动，事件像人一样滑行—停顿—按下—保持，且每次动作前校验视口尺寸，坐标过期时直接拒绝而不是点偏。 它与上游共用同一个 browser-tabs 插件 id，不能与 SheepofSheep/dsh-doyourweb 同装。需要 Chrome/Edge 125+，并在浏览器所在机器手动加载解包的 MV3 扩展（插件不会自动安装）；走 TLS 时还要把生成的 ca.crt 装进受信任的根证书颁发机构。扩展让模型能访问所配对浏览器里的标签页与已登录会话。桥接默认只监听 127.0.0.1，非回环地址需要 remote: true，扩展用经用户确认的令牌配对。'
icon: https://raw.githubusercontent.com/DeveloperYe/dsh-doyourweb-remote/main/extension/icons/icon-128.png
