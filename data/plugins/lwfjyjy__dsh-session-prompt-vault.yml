description:
  en: 'Adds a prompt library button at the left of the input box: manage prompts (add, edit, delete, search, groups), insert with one click or Enter/Tab, save prompt combinations, and sync over WebDAV.'
  zh: '在输入框左侧新增提示词库按钮：弹窗管理提示词（增删改查、分组），一键或回车/Tab 插入，支持组合预设与 WebDAV 同步。'
