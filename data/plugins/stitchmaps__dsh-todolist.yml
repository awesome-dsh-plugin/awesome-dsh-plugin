url: https://github.com/stitchmaps/dsh-todolist
name: stitchmaps/dsh-todolist
category: workflow
description:
  en: 'To-do list panel for DeepSeek Harness: collapsible large task cards with hour-precision due times, per-task reminder lead times, and reminders pushed to DingTalk through a group robot webhook or an enterprise-app work notice. Each task can bind to a workspace session and jump to it on click.'
  zh: 'DSH 待办清单面板：可折叠大卡片任务，截止时间精确到小时，可按任务设置提前提醒，并通过钉钉群机器人 Webhook 或企业应用工作通知推送；任务可绑定工作区会话，点击直达。'
icon: https://raw.githubusercontent.com/stitchmaps/dsh-todolist/main/assets/icon-180.png
