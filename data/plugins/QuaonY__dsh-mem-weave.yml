url: https://github.com/QuaonY/dsh-mem-weave
name: QuaonY/dsh-mem-weave
category: memory
description:
  en: 'MemWeave — long-term memory and a persona editor for DeepSeek Harness (DSH). Seven memory layers with per-layer half-life and a decay floor feed three capped injection sections (persona, first-turn snapshot, per-turn delta plus recall); recall fuses FTS5/BM25, embeddings and links with RRF. Writes pass source detection, dedupe/merge and conflict freezing, are audited and can be undone for 24 hours; credentials are blocked and sensitive fields redacted before injection. 22 weave_* tools, nine settings pages, promise and anniversary reminders, one local SQLite file, no runtime dependencies.'
  zh: '忆织 MemWeave —— 面向 DeepSeek Harness（DSH）的长期记忆与人格编辑器。七层记忆各带半衰期与衰减下限，注入分三段、各自限额（人格、会话首轮快照、每轮增量与召回）；召回把 FTS5/BM25、向量与链接三路用 RRF 融合。写入先过来源检测、去重合并与冲突冻结，全程审计、24 小时内可撤销；密钥写入即拦，敏感字段注入前脱敏。另有 22 个 weave_* 工具、九个设置页面、约定与纪念日提醒，数据在本机一个 SQLite 文件里，无运行时依赖。'
