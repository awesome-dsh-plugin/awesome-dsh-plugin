name: junarch/voice_for_dsh#voice-for-dsh
category: voice
icon: https://raw.githubusercontent.com/junarch/voice_for_dsh/main/assets/icon-180.png
description:
  en: 'Reads each reply aloud in natural spoken language, summarizing structured content such as tables and code blocks, with an adjustable script length — from detailed narration close to the source length down to a minimal briefing. Engines: system TTS, the DeepSeek TTS API, Doubao (dialects and expressive delivery), or the local Kokoro model, which synthesizes offline in-process. It also provides three session sounds — a repeating tone while the agent works, a completion tone at the end of a turn, and a question tone when it needs your answer; built-in tones can be switched and custom audio uploaded, with files kept on the local machine.'
  zh: '用自然语言播报每轮回答，自动总结结构化内容（如表格和代码块），播报长度可调，支持接近原文长度的详细播报与极简播报。朗读引擎可选系统朗读、DeepSeek 官方 TTS、豆包（支持方言与情绪演绎）或本地 Kokoro（本机离线合成）。另提供三种会话提示音：工作音（处理期间循环播放）、完成音（本轮结束）、提问音（等待回答）；内置音色可切换，也支持上传自定义音频，素材仅保存在本机。'