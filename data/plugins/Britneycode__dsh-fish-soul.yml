url: https://github.com/Britneycode/dsh-fish-soul
name: Britneycode/dsh-fish-soul
category: identity
description:
  en: 'A single-character agent that lives across QQ (via SnowLuma / OneBot 11), Bilibili and Douyin (the Douyin channel needs an always-on Windows desktop): persona cards with slowly evolving traits, per-person memory with Ebbinghaus decay and correction, a virtual clock driving a daily routine, proactive messages, auto-extracted memories, and a ten-tab settings panel covering retrieval, persona, routine, memory inspection, channels, habits, models and usage. QQ groups are deny-by-default: a group is answered only when it is on the allowlist or allGroups is explicitly switched on, and it still has to @-mention the bot. Private chats answer QQ friends only. Bilibili/Douyin auto-reply is off by default, limited to the owner, allowlist and mutual follows on Bilibili, and to the owner and allowlist on Douyin unless reply-to-everyone is explicitly enabled.'
  zh: '活在 QQ（经 SnowLuma / OneBot 11）、B站、抖音（抖音通道需一台常开的 Windows 桌面）三端的单角色智能体：人格卡与慢慢长出来的人格、按人隔离的记忆（艾宾浩斯衰减、可纠正、聊完自动记）、虚拟时钟驱动的作息与主动开口；设置面板共十个标签，覆盖检索、人格、自走、记忆检视、三端通道、习惯、模型与用量。QQ 群默认拒绝：只有列进群白名单、或显式打开「所有群」的群才会被回应，且仍需 @ 它；私聊只回 QQ 好友。B站 / 抖音自动回复默认关闭：B站只回主人、白名单与互关，抖音只回主人与白名单（「回所有人」需另行打开）。'