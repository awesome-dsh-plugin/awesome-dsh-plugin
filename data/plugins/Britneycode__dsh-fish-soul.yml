description:
  en: 'A single-character agent that lives across QQ, Bilibili and Douyin: persona cards with evolving traits, per-person memory with Ebbinghaus decay and correction, a virtual clock driving a daily routine, proactive messages, auto-extracted memories, forgettable via a tool, optional web search, and a settings page with 16 tabs.'
