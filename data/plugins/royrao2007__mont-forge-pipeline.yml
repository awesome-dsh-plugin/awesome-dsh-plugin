description:
  en: 'Registers 45 software engineering workflow skills plus 11 callable pipeline tools (spec, plan, build, verify, review, ship, plus assess, catalog, skill, standup, incident) for the full path from requirements to release. Merges addyosmani/agent-skills (25) and mattpocock/skills (19), both MIT.'
  zh: '注册 45 个软件工程工作流技能，并提供 11 个可调用的流水线工具（spec、plan、build、verify、review、ship，另有 assess、catalog、skill、standup、incident），覆盖从需求到发布的完整路径。合并自 addyosmani/agent-skills（25 个）与 mattpocock/skills（19 个），均 MIT。'
