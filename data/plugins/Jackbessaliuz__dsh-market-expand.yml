url: https://github.com/Jackbessaliuz/dsh-market-expand
name: Jackbessaliuz/dsh-market-expand
category: market
description:
  en: 'Companion for the DSH plugin market: batch-updates every installed npm plugin after DSH quits and relaunches it, rolls back the plugins an update broke when the next boot fails, and checks updates plus keeps snapshots for local link plugins.'
  zh: 'DSH 插件市场的补丁层：一键批量更新所有已装 npm 插件（退出 DSH 后自动完成并重新打开），启动失败时自动回退肇事插件，并为本地 link 插件提供更新检测与快照回滚。'
