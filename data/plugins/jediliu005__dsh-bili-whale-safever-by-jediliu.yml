name: jediliu005/dsh-bili-whale-safever-by-jediliu
category: tools
description:
  en: 'Bilibili companion for DSH (MIT fork of Alterssss/dsh-bili-whale; do not install alongside the upstream — both register the same `/dsh-bili/` settings routes and share `~/.dsh/bili-whale.config.json`): wakes on a schedule, reads videos through subtitles, danmaku, hot comments and covers, writes two diaries, and shares at most one pick per wake by commenting on the video and @-mentioning the owner (daily quota 3; DM when `share.via=dm`). Inbound DMs, commenter names, summary requests and live danmaku are normalized and scanned for injected instructions before they reach the model; only the owner DM channel can carry an authorization prefix. Since 0.5.0 every outbound message first passes a secrets gate: absolute paths, token prefixes, Bearer values, 32+ hex strings and user:pass URLs are blocked before sending; a hit reports the category, a masked fragment and three legal paths (edit the text, owner authorization, stop and ask), and each authorized exception is logged with time and signer. Since 0.5.1 it also follows watching and comment rules: preferences.minSeconds (default 20 seconds) keeps too-short videos out of the candidate list and holds each pick long enough before it is cut; night.minLiked keeps looking through disliked videos until enough liked ones are seen; comment.dailyLimit caps autonomous comments per day; comment.autoReplyOwner decides whether an owner comment is answered immediately; comment.replyMode defaults to draft, so replies to other viewers are drafted for the owner to approve (direct sends them).'
  zh: 'DSH 的 B 站养鱼插件（Alterssss/dsh-bili-whale 的 MIT 分叉；不要与上游 dsh-bili-whale 同装——两者注册同一套 `/dsh-bili/` 设置路由并共用 `~/.dsh/bili-whale.config.json`）：按作息自己醒来，靠字幕、弹幕、热评与封面读懂视频，写两本日记，每次醒来最多以评论区 @ 主人的方式分享一条（每日额度 3；`share.via=dm` 时走私信）。私信正文、来信人、总结请求与直播弹幕在进模型前会归一化并扫描可疑指令；只有主人私信通道能携带授权前缀。0.5.0 起每条出站消息先过机密闸：绝对路径、令牌前缀、Bearer、32 位以上十六进制与 user:pass 形式 URL 在发送前拦截；命中时给出类别、打码片段与三条合法路径（改内容、口令授权、停手找人），每次口令授权放行都记录时间与签字人。0.5.1 起还会按看片与评论规矩做事：preferences.minSeconds（默认 20 秒）把过短视频挡在候选外，也保证每条至少看够这么久再决定砍不砍；night.minLiked 让它在连续遇到不喜欢的视频时继续看，直到感兴趣条数够；comment.dailyLimit 限制每天自主评论条数；comment.autoReplyOwner 决定主人评论是否直接回；comment.replyMode 默认 draft，回复其他人只起草稿等主人批（direct 才直接发）。'
