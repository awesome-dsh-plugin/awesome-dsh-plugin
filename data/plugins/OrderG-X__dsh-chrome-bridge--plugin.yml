name: OrderG-X/dsh-chrome-bridge#plugin
category: browser
tarball: https://github.com/OrderG-X/dsh-chrome-bridge/releases/latest/download/dsh-chrome-bridge.tgz
description:
  en: "Controls the Chrome you are already logged into: the model clicks, types, fills in forms, reads pages, takes screenshots and downloads files in your real tabs, including inside same-origin iframes. Runs on macOS, Windows and Linux; needs Chrome 116+ and Node 18+. Works over native messaging and chrome.debugger instead of a listening port. Ships 12 browser_* tools and a cb CLI, dispatches real CDP input events, draws an on-page cursor that also appears in screenshots, and adds a toolbar panel with live status, the controlled tabs and a pause switch. browser_download saves a link, an element's target or a URL with the site's login cookies (following redirects, keeping the server's file name) to the Downloads folder or the session's working directory; cross-origin iframes are named in the snapshot but not entered. The native host and the MV3 extension travel inside this tarball: on first load the plugin copies them into place and writes the native-messaging registration itself, so there is no clone, no install.sh and no python3 - the one step left is adding the extension to Chrome: install DSH Bridge from the Chrome Web Store (https://chromewebstore.google.com/detail/bippcbbbipppmhjkjomgdnjbooecbimo, no Developer mode), or load the bundled unpacked copy at chrome://extensions (the plugin opens that page and puts the folder on the clipboard for you). Until then the tools fail loudly with those steps. On Windows the registration goes into the registry (for Chrome and Edge) and the host talks over a named pipe. A daily CI run on GitHub's macOS, Windows and Linux machines installs the plugin, loads the extension into a real Chrome and reads a page through the browser_* tools."
  zh: "操作你已经登录的 Chrome：模型在你真实的标签页里点击、打字、填表、读网页、截图、下载文件，同源 iframe 里的内容也能读能点。支持 macOS、Windows、Linux；需要 Chrome 116+ 与 Node 18+。走 native messaging 与 chrome.debugger，不开监听端口。提供 12 个 browser_* 原生工具和一个 cb 命令行，发送真实 CDP 输入事件，绘制会出现在截图里的页内光标，并带一个工具栏面板（连接状态、正在控制的标签页、暂停开关）。browser_download 带着这个网站的登录 Cookie 下载链接、元素指向的文件或网址（跟随跳转、用服务器给的文件名），存进「下载」文件夹或会话的工作目录；跨站 iframe 只在快照里标出来，不进去读。宿主（原生宿主 + MV3 扩展）随本 tarball 一起发：插件首次加载时自己把它们落盘并写好 native messaging 注册，不用 clone 仓库、不用 install.sh、不用 python3——只剩把扩展装进 Chrome：从 Chrome 应用商店装 DSH Bridge（https://chromewebstore.google.com/detail/bippcbbbipppmhjkjomgdnjbooecbimo，不用开发者模式），或者到 chrome://extensions 加载自带的已解压扩展（插件会替你打开那个页面并把文件夹放进剪贴板）。没装好之前，工具会带着这几步明确报错。Windows 上注册写进注册表（Chrome 和 Edge 都写），宿主走命名管道。每天在 GitHub 的 macOS / Windows / Linux 机器上自动跑一遍：装插件、把扩展加载进真 Chrome、用 browser_* 工具读一个网页。"
