  en: 'Claim WorkBuddy (CodeBuddy CN / WorkBuddy global) daily check-in credits and benefit bonuses from a composer-dock card and an agent tool, using the official web OAuth login — no desktop client or third-party plugin needed. If another WorkBuddy plugin has already saved a login in ~/.dsh/workbuddy-vault, it reuses that login instead of asking you to sign in again.'
