url: https://github.com/most-silence/dsh-record
name: most-silence/dsh-record
category: voice
tarball: https://github.com/most-silence/dsh-record/releases/latest/download/dsh-record.tgz
description:
  en: "Adds a composer microphone button that records audio as MP3 (default), WAV, or WebM and attaches it to the current prompt as a conversation file attachment. The format and the recording directory (follow the current workspace or a custom folder) are configured on the plugin's own detail page under Settings > Plugins; recordings are written to disk through a same-origin-guarded host route with name sanitizing and traversal rejection."
  zh: 在输入框加一个麦克风按钮，录音按 MP3（默认）、WAV 或 WebM 编码，并自动作为会话附件挂进当前 Prompt。文件格式与录音目录（跟随当前项目空间，或自定义文件夹）都在「设置 → 插件」里该插件自己的详情页配置；录音经同源守卫的宿主路由落盘，文件名清洗并拒绝路径穿越。
