  en: 'Web application developer workbench: scaffolds Nuxt apps from four design-system templates with sign-in and SQLite, shows a live preview beside the chat, lets you click an element to point the agent at it, imports Excel and CSV rows, and restores checkpoints.'
  zh: '网页应用开发工作台：从四套设计体系模板生成自带登录和 SQLite 的 Nuxt 应用，在对话旁实时预览，可点选预览中的元素交给 Agent 修改，可导入 Excel 与 CSV 数据，并能恢复到任一检查点。'
