url: https://github.com/jakehemmerle/dsh-speed
name: jakehemmerle/dsh-speed
category: model
description:
  en: 'Adds a Speed setting (Standard, Fast, Ultrafast) for OpenAI and Codex models. In dsh web it appears in the Model / Effort menu; in dst the /speed command opens a picker or sets the speed directly, and the current speed shows in the bottom bar. The choice is kept per session, provider and model and is sent as the request service tier.'
