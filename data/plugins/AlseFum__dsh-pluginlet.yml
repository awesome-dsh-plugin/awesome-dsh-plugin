url: https://github.com/AlseFum/dsh-pluginlet
name: AlseFum/dsh-pluginlet
category: ui
description:
  en: Turns every .pluginlet file in a repo into its own sandboxed Conversation View tab, gated by a capability grant bound to the file content hash.
  zh: 把仓库里每个 .pluginlet 文件变成一个独立的沙箱会话视图标签页，权限按内容哈希绑定。
