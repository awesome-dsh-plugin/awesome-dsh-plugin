name: dryw/dsh-egm
category: workflow
description:
  en: 'Design-review gate for DeepSeek Harness, a DSH port of Google''s Elephant-Goldfish Model: a context-rich Elephant session drafts the design, then fresh, zero-context, read-only Goldfish reviewers stress-test it before implementation. Registers the `egm` plugin id; install one EGM bundle per profile.'
  zh: '面向 DeepSeek Harness 的设计评审闸门，移植自 Google 的 Elephant-Goldfish Model：具备完整上下文的“大象”起草设计，再由零上下文的只读“金鱼”评审者严格审查，通过后才进入实现。注册的插件 id 为 `egm`，同一 profile 请只安装一个 EGM 插件。'
