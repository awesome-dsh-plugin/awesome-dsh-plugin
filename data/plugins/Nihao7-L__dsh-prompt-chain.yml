description:
  en: ⚡ One-click prompt enhance in the DSH composer. Still short? Keep going for up to 5 rounds; 🕐 every round is auto-saved, one click to roll back; ↩️ the result syncs back to the composer, with a line diff for every change; 🎨 6 read-only built-in presets plus up to 3 of your own, 🪄 button icon and 📍 position are all yours to tweak.
  zh: ⚡ DSH 输入框一键增强提示词（prompt），嫌短？继续生成往下扩，最多 5 轮；🕐 每轮自动存档，点一下就退回上一版 ↩️ 结果同步回输入框，改哪几个字逐行对比标给你看 🎨 内置 6 套只读方案、自建最多 3 套、🪄 按钮图标、📍 按键位置，全按你的习惯改。
