url: https://github.com/BoltBlue121/dsh-moss-draw/tree/main/plugin
name: 'BoltBlue121/dsh-moss-draw#plugin'
category: tools
description:
  en: 'Adds seven `art_*` agent tools plus a right-sidebar drawing workbench (series, pages, revisions, regions, camera blockout) that submits ComfyUI graphs to a ComfyUI instance you host, for MOSS/K2 text-to-image, inpaint, character references, region editing and Qwen-Image edits, with up to four caller LoRAs stacked per request. Requires a local checkout and one adapter step: after a marketplace install, run `install/adapt.mjs` (or use `install/install.ps1` on Windows) to replace the `__MOSS_*__` placeholders with an absolute `workspaceRoot` and a ComfyUI origin; until then the Host refuses to load the preset with `MOSS_CONFIG_*`.'
  zh: '给 Agent 增加 7 个 art_* 工具和一个右侧栏绘图工作台（系列、页、修订、区域、相机体块），把工作流提交到你自建的 ComfyUI：MOSS/K2 文生图、局部重绘、角色参考、区域编辑与 Qwen 图像编辑，单次请求可叠加最多 4 个自备 LoRA。需要本机仓库执行一次适配：市场安装后运行 `install/adapt.mjs`（Windows 可用 `install/install.ps1`）把 `__MOSS_*__` 占位符替换为绝对的 `workspaceRoot` 与 ComfyUI 地址，否则 Host 会以 `MOSS_CONFIG_*` 拒绝加载预设。'
