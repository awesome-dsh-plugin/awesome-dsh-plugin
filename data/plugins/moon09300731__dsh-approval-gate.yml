url: https://github.com/moon09300731/dsh-approval-gate
name: moon09300731/dsh-approval-gate
category: security
description:
  en: 'Risk-gated approval automation for DeepSeek Harness: flash pre-classifies whether a write/command is irreversible — safe operations are auto-approved, dangerous ones are escalated to human approval (fail-safe). Includes file-diff review with one-click revert, and session-scoped diff snapshots that can be cleared per session.'
  zh: 'DeepSeek Harness 自动审批门控：Flash 预判写入/命令是否不可回补，安全操作自动批准、危险操作转人工（fail-safe）。另含文件改动对比（unified diff）与一键撤销，以及按会话隔离的快照管理。'
