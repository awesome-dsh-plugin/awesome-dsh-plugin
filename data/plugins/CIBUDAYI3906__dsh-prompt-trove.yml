url: https://github.com/CIBUDAYI3906/dsh-prompt-trove
name: CIBUDAYI3906/dsh-prompt-trove
category: ui
description:
  en: 'Composer prompt library: reusable global and per-project prompts are stored as Markdown files and appended to the draft on click or @ mention; the global library works out of the box, while project groups appear only after "config.root" is set in the profile patch.'
  zh: '输入框常用提示词库：全局与项目两层的 Markdown 提示词，点一下或 @ 触发追加进草稿、不覆盖已写内容；全局库装好即用，项目库需在 profile 的 cordis.patch.yml 里给该插件配 config.root 后才会出现。'
icon: https://raw.githubusercontent.com/CIBUDAYI3906/dsh-prompt-trove/main/icon.png
