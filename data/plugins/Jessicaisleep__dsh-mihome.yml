url: https://github.com/Jessicaisleep/dsh-mihome
name: Jessicaisleep/dsh-mihome
category: tools
description:
  en: 'A whole-home smart-home workbench grown out of a Mi Home plugin. Registers 13 agent tools: Mi Home cloud login, device list, device spec, property read/write, Mi Home scenes and sensors, plus LAN/BLE scanning, whole-home inventory, per-device capabilities, control, admin-page reading, custom scenes and a capability catalog. Backends: Home Assistant entities, Tuya LAN, Shelly, classic TP-Link Kasa, Yeelight, Philips Hue, Tasmota/WLED, local miIO, ONVIF/DLNA, and router, switch, ONT and NAS admin pages. A sidebar workbench shows device tiles, detail pages, scenes and consumable gauges. Controls follow the capabilities a device actually reports; protocols that are not implemented stay discovery-only or read-only rather than guessing write commands. Needs Python 3.12 with a virtualenv built from requirements.txt, and requirements-optional.txt for mDNS, Tuya and BLE. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '从米家插件扩展而来的全屋智能工作台。注册 13 个 agent 工具：米家云端登录、设备列表、设备规格、属性读写、米家场景与传感器，以及局域网与蓝牙扫描、全屋设备清单、单台设备能力、控制、管理页读取、自定义场景与能力项目录。接入方式包括 Home Assistant 实体、Tuya 局域网、Shelly、传统 TP-Link Kasa、Yeelight、Philips Hue、Tasmota/WLED、miIO 本地、ONVIF/DLNA，以及路由器、交换机、光猫与 NAS 的管理页。侧栏工作台提供设备磁贴、详情页、场景列表与耗材余量；控制项按设备实际报告的能力生成，未实现的协议只做发现或读取，不猜写入命令。需要 Python 3.12 并按 requirements.txt 自建虚拟环境，mDNS、Tuya 与蓝牙另需 requirements-optional.txt。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
