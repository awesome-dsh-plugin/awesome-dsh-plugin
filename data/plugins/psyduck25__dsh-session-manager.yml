name: psyduck25/dsh-session-manager
category: session
icon: https://raw.githubusercontent.com/psyduck25/dsh-session-manager/main/assets/icon-180.png
description:
  en: 'Delete one session at a time from Settings instead of deleting the whole workspace: every session is listed by workspace with a lock toggle and a delete button, deletion lands in a recycle bin after a second confirm, and the session log is moved out of the sessions directory so the row leaves the sidebar rather than greyed out. Deletion of a locked session is refused by the Host, not just disabled in the UI. Recoverable for a configurable window of 0-720 hours; expired entries are deleted for real, logs included. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在「设置」里逐个删除会话，不必连整个工作区一起删：所有会话按工作区列出，每行带锁定和删除；删除要二次确认后进入删除缓冲站，且日志被移出会话目录，所以那一行是真正消失而不是变灰留在原地。被锁定的会话由宿主拒绝删除，不只是界面上禁用。缓冲期内可回档，窗口 0–720 小时可配；到期连同日志一起真正删除。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'