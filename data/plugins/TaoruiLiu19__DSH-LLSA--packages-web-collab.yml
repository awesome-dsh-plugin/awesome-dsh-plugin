name: TaoruiLiu19/DSH-LLSA#web-collab
category: workflow
description:
  en: 'Opt-in web consultation for DeepSeek Harness tasks: paste the material and a first-pass review, let a sub-agent check one specific doubt against a web chat, and keep the verification with the agent. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 任务的按需网页咨询：贴入资料与初审建议，子 Agent 可就一个具体疑点问一次网页对话，核验仍由 Agent 负责。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'