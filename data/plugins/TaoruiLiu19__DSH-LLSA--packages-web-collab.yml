description:
  en: 'Opt-in web consultation for DeepSeek Harness tasks: paste the material and a first-pass review, let a sub-agent check one specific doubt against a web chat, and keep the verification with the agent. Every HTTP route now goes through the DSH connection fence (Host/Origin admission plus an authenticated live peer).'
  zh: 'DeepSeek Harness 任务的按需网页咨询：贴入资料与初审建议，子 Agent 可就一个具体疑点问一次网页对话，核验仍由 Agent 负责。所有 HTTP 路由现在都先过 DSH 的连接栅栏（Host/Origin 准入 + 已认证的活动 Peer）。'