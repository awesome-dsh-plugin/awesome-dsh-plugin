description:
  en: Registers the github-push skill so every session follows one fixed commit-and-push flow, with a pre-flight secret scan, an abuse-resistant retry policy, and local-proxy discovery when github.com is unreachable directly.
  zh: 注册 github-push 技能，让每个会话都走同一套提交推送流程，带推送前密钥扫描、防滥用重试策略，以及直连不通时的本地代理自动探测。
