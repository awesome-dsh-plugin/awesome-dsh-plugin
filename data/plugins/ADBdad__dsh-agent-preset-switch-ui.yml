url: https://github.com/ADBdad/dsh-agent-preset-switch-ui
name: ADBdad/dsh-agent-preset-switch-ui
category: ui
description:
  en: 'Adds a clickable agent-preset switcher to the DSH session header; switching takes effect for the current session immediately, with its own engine and no dependency on other plugins. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 会话标题栏加一个可点击的 Agent 预设切换器，切换对当前会话立即生效；自带切换引擎，不依赖其它插件。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
