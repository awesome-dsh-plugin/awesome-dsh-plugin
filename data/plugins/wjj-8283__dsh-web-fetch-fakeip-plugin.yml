url: https://github.com/wjj-8283/dsh-web-fetch-fakeip-plugin
name: wjj-8283/dsh-web-fetch-fakeip-plugin
category: browser
description:
  en: "Makes the built-in web_fetch tool work when Clash / mihomo runs in TUN mode with fake-ip: it lets the fake-ip address ranges (198.18.0.0/15, fdfe:dcba:9876::/64, 2001:2::/48) past the public-address check that otherwise rejects them, while loopback, private and link-local addresses stay blocked as before. Works with no proxy environment variables and no Clash changes."
  zh: "让内置 web_fetch 在 Clash / mihomo 以 TUN + fake-ip 模式运行时正常工作：只放行 fake-ip 地址段（198.18.0.0/15、fdfe:dcba:9876::/64、2001:2::/48）通过公网地址校验，回环、内网与链路本地地址仍照旧拦截。无需设置代理环境变量，也无需改动 Clash。"
