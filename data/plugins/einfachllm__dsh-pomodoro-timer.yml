url: https://github.com/einfachllm/dsh-pomodoro-timer
name: einfachllm/dsh-pomodoro-timer
category: ui
description:
  en: 'Pomodoro focus timer docked under the composer with long-break cycles, daily focus tracking, phase-change signals, and agent tools that read and control the timer. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '停靠在输入框下方的番茄钟，支持长休息循环、每日专注统计、阶段切换提醒，以及供 Agent 读取和控制计时器的工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
