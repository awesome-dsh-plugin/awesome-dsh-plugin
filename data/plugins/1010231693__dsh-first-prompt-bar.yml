description:
  en: 'Pins the first prompt you sent in the current session in a scroll-proof bar above the conversation, with one-click copy, a collapsible panel listing every prompt you sent, and eight switchable looks you can pick from inside the panel.'
  zh: '把你在每个会话发的第一条提示词常驻显示、一键复制，可展开面板查看本会话发过的全部提示词，另带八套可在面板里即时切换的外观。'
