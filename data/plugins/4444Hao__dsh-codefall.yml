description:
  en: 'Adds a Matrix-inspired digital-rain startup animation for DeepSeek Harness, a rectangular light portal that opens to both sides, optional replay when the desktop window reopens, and a green UI theme with adjustable hue.'
  zh: '为 DeepSeek Harness 添加黑客帝国风格的数字雨开屏动画、向两侧展开的矩形光门、可选的窗口恢复重播，以及可调色相的绿色界面主题。'
