description:
  en: 'Two halves with one account store: a left-panel GitHub repositories viewer that is read-only by construction (three GET endpoints, every non-GET refused with 405 before routing, request body never read, tokens never leave the host), and a github-manager skill exposing exactly two tools — github_accounts and github_api — so the agent does the writing. Sign-in is GitHub Device Flow, and the store self-invalidates on mtime so a token added later is picked up without a restart.'
  zh: '同一个账户库的两半：左侧「GitHub 仓库」面板是结构性只读（只有三个 GET 端点，任何非 GET 在路由前直接 405，请求体从不读取，令牌不出宿主），以及一个 github-manager 技能，只暴露两个工具 —— github_accounts 与 github_api —— 写入动作交给 Agent。登录走 GitHub Device Flow，账户库按 mtime 自动失效，后加进来的令牌无需重启即可生效。'
