description:
  en: 'Per-session workflow presets: switching one sets each disk skill to full, first-sentence or hidden in the model catalog, hides chosen global tools, adds a system-prompt persona section, applies a permission preset, and can insert the preset''s prompt template into the composer. A right-side panel switches presets and rewrites the draft prompt; a rewrite never writes back to a preset.'
  zh: '按会话切换工作流预设：一次切换决定每个磁盘技能在模型目录里的档位（完整 / 只留首句 / 隐藏）、隐藏哪些全局工具、追加的人格段落、切换时套用的权限预设，并可把该预设的提示词模板填进输入框。右侧小窗负责切换预设与改写草稿提示词，改写结果不会写回预设。'
