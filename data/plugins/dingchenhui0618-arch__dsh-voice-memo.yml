url: https://github.com/dingchenhui0618-arch/dsh-voice-memo
name: dingchenhui0618-arch/dsh-voice-memo
category: voice
description:
  en: 'Dictation that ends up in the repository instead of the chat log: hold the button (or import a WAV), and the plugin archives voice-memos/<id>/ with audio.wav, a rendered waveform.png, memo.md (frontmatter, per-segment timestamps, ready-to-paste quote blocks) and meta.json. Audio is resampled to 16 kHz mono in the browser before it is sent. Transcription stays local — the harness speechToText service with silence-split windows, or a command worker such as faster-whisper — and when no engine is available the memo is still filed with an explicit status and reason rather than a fabricated transcript. Ships a conversation-view 口述 tab with click-to-seek playback and per-segment quote copy, three agent tools (voice_memo_save / voice_memo_list / voice_memo_read) and HTTP routes. Zero runtime dependencies, 52 node:test cases, real screenshots in docs/.'
  zh: '把口述变成仓库里的归档，而不是聊天里一闪而过的转写：按住说话（或导入 WAV）后，插件把 audio.wav、渲染好的 waveform.png、memo.md（frontmatter、逐段时码、可直接粘贴的引用块）与 meta.json 落到 voice-memos/<id>/。音频先在浏览器里重采样成 16 kHz 单声道再上传。转写全部本地完成——DSH 的 speechToText 服务（静音切窗补时间戳）或 faster-whisper 这类命令 worker；没有可用引擎时仍然归档，并写明状态与原因，绝不编造文本。带会话视图的「口述」Tab：点波形定位播放、逐段复制引用；另有三个 agent 工具（voice_memo_save / voice_memo_list / voice_memo_read）与 HTTP 路由。零运行时依赖，52 个 node:test 用例，docs/ 里有真实运行截图。'
