description:
  en: 'Inline autocomplete in the composer: pause after half a sentence and the session''s own model finishes it in faint grey behind a small Tab key cap; Tab accepts, Escape or further typing dismisses. On phones, tap the grey text instead.'
  zh: 输入框行内自动补全：写完半句停一下，当前会话所用的模型就用淡灰字把后半句补完，灰字后跟一个很淡的 Tab 键帽提示收下；Esc 或继续打字即丢弃。手机上直接点灰字收下。
