url: https://github.com/alvinhuang0509-design/dsh-connect-teleagent
name: alvinhuang0509-design/dsh-connect-teleagent
category: model
description:
  en: 'TeleAgent (China Telecom TeleAI "Stellar" agent) model provider for DeepSeek Harness with the working v1 gateway signing: two-round HMAC-SHA256 keyed by the login JWT signature segment, which fixes the 40104 rejections the older local-v1 signing produced. Signs in through a dedicated browser window over the DevTools protocol — the plugin intercepts the login callback the same way the official desktop app does, so nothing has to be copied by hand — and also accepts a pasted token. Ships points balance, daily check-in, an in-composer account chip, and a configurable context window (100K by default, 16K–2M, since the gateway declares no catalogue and the official client ships one shared 100K preset for all three tiers). Cannot be installed alongside anye-99/dsh-codearts-auth: both register the same teleagent provider, and this plugin reuses its credentials and derives its SSE/tool-call parsing from it.'
  zh: '中国电信天翼 AI「星辰超级智能体」(TeleAgent) 模型 provider，使用可用的 v1 云网关签名：以登录 JWT 签名段为密钥的两轮 HMAC-SHA256，修复旧版 local-v1 签名导致的 40104 拒绝。登录走独立浏览器窗口 + DevTools 协议——插件按官方桌面端同样的方式截获登录回调，无需手工复制任何内容，也可改用手动粘贴 token。提供积分余额、每日签到、输入框内账号条，以及可配置的上下文窗口（默认 100K，可设 16K–2M；网关无模型目录，官方客户端三档共享一份 100K 预置）。与 anye-99/dsh-codearts-auth 不能同装——两者注册同一个 teleagent provider；本插件复用其凭据，通用 SSE/工具调用解析亦取自该插件。'
