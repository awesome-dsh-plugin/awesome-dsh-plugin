url: https://github.com/baitouwuya/dsh-super-cards
name: baitouwuya/dsh-super-cards
category: ui
icon: https://raw.githubusercontent.com/baitouwuya/dsh-super-cards/main/docs/assets/zh/hero.png
description:
  en: 'Native UI cards instead of Markdown: the assistant calls render_ui and the answer renders as a card in the conversation — 29 block types (metrics, tables, charts, timelines, kanban, flow charts, clickable actions), a content auto-layout mode, four placements (inline, process, dock board above the composer, turn-tail next-step card), a schema-backed settings form, and an optional automatic next-step card. Cards are rebuilt from the recorded tool arguments, so they survive replay and fork; 253 offline tests, no build step.'
  zh: '用原生 UI 卡片代替 Markdown 回答：模型调用 render_ui，答案直接渲染成对话里的卡片——29 种区块（指标、表格、图表、时间线、看板、流程图、可点击按钮）、content 自动排版模式、四种落位（正文内联、过程折叠区、输入框上方看板、回合尾卡）、原生设置表单，以及可选的自动「下一步」卡片。卡片按会话日志里的调用参数重建，回放与 fork 后仍在；253 个离线测试，无构建步骤。'
