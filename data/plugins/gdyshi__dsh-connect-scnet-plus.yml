url: https://github.com/gdyshi/dsh-connect-scnet-plus
name: gdyshi/dsh-connect-scnet-plus
category: model
description:
  en: 'Connects the models of the SCNet (超算互联网) Computing Service desktop client to DSH, adding a per-model switches tab on the plugin page and adapting the transcript to whichever pi-ai generation the profile resolves. Reuses the API key the SCNet client cached under ~/.sclaw (or SCNET_API_KEY, or a key set in the plugin config) and sends chats to api.scnet.cn through a loopback proxy; it depends on SCNet''s unofficial client interface, which may change, and use is subject to SCNet''s terms.'
  zh: '把本机 SCNet（超算互联网）计算服务客户端已登录的模型接入 DSH，插件页提供逐模型开关标签页，并按 profile 实际解析到的 pi-ai 世代自动适配 transcript 形状。沿用 SCNet 客户端缓存在 ~/.sclaw 下的 API Key（也可用 SCNET_API_KEY 或插件配置里填的 Key），经本机回环代理把对话发往 api.scnet.cn；依赖 SCNet 客户端的非官方接口，上游调整后可能失效，使用受 SCNet 服务条款约束。'
tarball: https://github.com/gdyshi/dsh-connect-scnet-plus/releases/download/v0.1.2/dsh-connect-scnet-plus-0.1.2.tgz