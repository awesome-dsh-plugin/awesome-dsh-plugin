name: SoulZhou/dsh-multi-root-changes
category: git
description:
  en: 'Git tab that covers the session workspace root together with every additional root registered through multi-root-workspace, so sibling checkouts appear as separate sections with their own branch, ahead/behind, line counts, directory tree and commit history. Clicking a file opens its unified diff (or whole content, for untracked files), Markdown files render as a formatted preview with a source toggle, and text files can be edited and saved in place. The list and the diff sit side by side with a draggable seam that resizes them from 20% to 80%, remembers the split across restarts and resets on double-click. Each section has a commit box that commits only the checked files (`git add -- <files>` + `git commit -- <files>`), drafts the message automatically when left empty, and offers commit, push and commit+push; the toolbar keeps a repository picker, scoped refresh, per-file checkboxes, and a font-size control that scales the whole panel. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'Git 页签，把会话主目录与 multi-root-workspace 登记的每个附加根放在一起展示：平级仓库各自一节，带自己的分支、ahead/behind、增删行数、目录树与提交历史。点文件看 unified diff（未跟踪文件显示全文），Markdown 文件默认排版渲染、可切回 diff/源码，文本文件可就地编辑保存。改动列表与右侧 diff 之间那条竖线可以拖动，把两侧宽度在 20%–80% 之间随意调整，松手记住比例、重启后保留，双击恢复一半。每节带提交框，只提交已勾选的文件（`git add -- <files>` + `git commit -- <files>`），信息留空自动 AI 生成，支持提交、推送与提交+推送；工具栏保留仓库切换、按范围刷新、逐文件勾选，以及等比缩放整个面板的字体大小设置。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
