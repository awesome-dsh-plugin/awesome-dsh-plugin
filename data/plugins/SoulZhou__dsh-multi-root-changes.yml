url: https://github.com/SoulZhou/dsh-multi-root-changes
name: SoulZhou/dsh-multi-root-changes
category: git
description:
  en: 'Git tab that covers the session workspace root together with every additional root registered through multi-root-workspace, so sibling checkouts appear as separate sections with their own branch, ahead/behind, line counts, directory tree and commit history. Clicking a file opens its unified diff (or whole content, for untracked files), and Markdown files render as a formatted preview with a source toggle. Each section has a commit box that commits only the checked files (`git add -- <files>` + `git commit -- <files>`), drafts the message automatically when left empty, and offers commit, push and commit+push; the toolbar keeps a repository picker, scoped refresh, per-file checkboxes, and a font-size control that scales the whole panel.'
  zh: 'Git 页签，把会话主目录与 multi-root-workspace 登记的每个附加根放在一起展示：平级仓库各自一节，带自己的分支、ahead/behind、增删行数、目录树与提交历史。点文件看 unified diff（未跟踪文件显示全文），Markdown 文件默认排版渲染、可切回 diff/源码。每节带提交框，只提交已勾选的文件（`git add -- <files>` + `git commit -- <files>`），信息留空自动 AI 生成，支持提交、推送与提交+推送；工具栏保留仓库切换、按范围刷新、逐文件勾选，以及等比缩放整个面板的字体大小设置。'
icon: https://raw.githubusercontent.com/SoulZhou/dsh-multi-root-changes/main/assets/icon-512.png
