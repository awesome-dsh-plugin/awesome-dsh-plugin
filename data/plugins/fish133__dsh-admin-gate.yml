url: https://github.com/fish133/dsh-admin-gate
name: fish133/dsh-admin-gate
category: security
description:
  en: 'Password gate in front of the DeepSeek Harness web UI: admins sign in with a password stored only as a scrypt salted hash, and guests enter without one but are held to an allowlist of /api endpoints and agent tools; several admin accounts may exist, each with its own password; three modes (admin-only, guest, open), and closing guest entry drops every guest already inside; conversation ownership is recorded per sessionId so each account sees only its own conversations, with list and search filtering rather than refusing so "exists but you cannot see it" never leaks. The gate is enforced on the host, not in the page: connection.admit, admitConnection and authorizeIndex decide who a visitor is and issue a Peer carrying that identity, connection/request answers 401 or 403, WebSocket streams are checked when they open, tools.guard() keeps guest-triggered agent turns inside the tool allowlist, and the gate page at /admin-gate is mounted outside /api so it does not need the harness cookie. Five failed logins within ten minutes lock the door for five minutes, and state is written to a temporary file and renamed so an interrupted write cannot leave a half-written JSON. The default allowlists deliberately exclude session/prompt and the read, bash and write tools, since those run as the owner. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness Web UI 前的密码闸门：管理员用密码进入（密码只存 scrypt 加盐哈希），访客免密码进入但被限制在 /api 端点与 agent 工具的白名单内；可建多个管理员账号、各自独立密码；三种模式（admin-only、guest、open），关闭访客入口时在场的访客会被立刻踢掉；对话按 sessionId 记录归属，每个账号只看得到自己开的那些，列表与搜索采取筛掉而非报错，因此不会泄露「存在但你看不到」。闸门落在 host 侧而不是页面里：connection.admit、admitConnection、authorizeIndex 决定来访者是谁并发出带身份标记的 Peer，connection/request 回答 401 或 403，WebSocket 流在打开时校验，tools.guard() 把访客触发的 agent 回合限制在工具白名单内，闸门页 /admin-gate 挂在 /api 之外所以不依赖 harness 的 cookie。十分钟内错五次密码锁五分钟；状态先写临时文件再 rename，写到一半断电也不会留下半个 JSON。默认名单刻意不含 session/prompt 与 read、bash、write 三个工具，因为它们是以主人身份执行的。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
