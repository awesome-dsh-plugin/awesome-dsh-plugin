description:
  en: 'Short-drama script production workbench: four deterministic local tools (episode/scene/dialogue audit with soft-ending, static-opening, scene-reuse and hook-quota checks; five-dimension weighted scoring with external calibration; 40-episode project scaffold; and the v2.0 workflow playbook). No model calls.'
  zh: '短剧剧本生产工作台：四个确定性本地工具（集/场/台词审计，含软收尾、静场开场、场景复用、钩子配额检查；五维加权评分与外评校准；40 集项目脚手架；v2.0 工作流程技法库），不调用模型。'
