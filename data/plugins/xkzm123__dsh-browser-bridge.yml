url: https://github.com/xkzm123/dsh-browser-bridge
name: xkzm123/dsh-browser-bridge
category: browser
description:
  en: 'Operate the Edge or Chrome window that is already open, without restarting it and without closing it: choose a window once, reuse a tab that already shows the URL, read page text or DOM state, click by accessible name or visible text, type, scroll, wait for content and batch steps. 20 tools over UI Automation, SendInput and an optional Tampermonkey bridge. Windows only.'
  zh: '操控已经打开的 Edge 或 Chrome 窗口，不重启也不关闭它：一次选定窗口、已打开的网址直接复用标签页、读页面文本或 DOM 状态、按可访问名或可见文字点击、输入、滚动、等待内容、多步合批。20 个工具，基于 UI Automation、SendInput 与可选的篡改猴桥。仅 Windows。'
