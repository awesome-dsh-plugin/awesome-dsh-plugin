url: https://github.com/yumonai/dsh-theme-wanderer
name: yumonai/dsh-theme-wanderer
category: theme
description:
  en: 'Wanderer (Genshin) theme: bundled 1080p video wallpaper (HTTP Range), liquid-glass panels, glass composer toggle, star dust, gold frame, light/dark, self-check. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '《原神》流浪者主题：包内自带 1080p 动态视频壁纸（HTTP Range）、液态玻璃面板、输入框玻璃可开关、星尘与鎏金卷轴、浅深色自适应、自检。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/yumonai/dsh-theme-wanderer/main/docs/icon-180.png
