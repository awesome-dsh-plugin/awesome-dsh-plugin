description:
  en: 'Genshin Impact Wanderer theme: a bundled 1080p video wallpaper served over HTTP Range, liquid-glass sidebar and secondary panels, a lightly translucent conversation column, a toggleable glass composer, star dust, gold-framed scroll decorations, light/dark adaptation, and a self-check panel in Settings.'
  zh: '《原神》流浪者主题：插件内自带 1080p 动态视频壁纸（HTTP Range 播放）、侧栏与次级面板液态玻璃、主对话列轻透、输入框玻璃可开关、星尘与鎏金卷轴装饰、浅深色自适应，设置页带自检面板。'
