url: https://github.com/ruaruaTon/dsh-agent-tree
name: ruaruaTon/dsh-agent-tree
category: workflow
description:
      en: 'Agent lineage tree panel for DeepSeek Harness: renders the Lead-to-member-to-grandchild hierarchy as a live org-chart tree, with team focus, real-time status dots and an optional model-routing center. Aliases: inline rename for team members AND native subagent/grandchild nodes (stored in a separate overlay file, team state untouched). Auto task briefs: team members show their latest task with a status mark, native subagents extract the dispatch prompt from session logs. Batch grouping and filtering: multiple dispatch rounds cluster into labeled batch blocks you can filter down to. Three-step selector: view (session tree / teams) -> target -> batch. The model-routing center needs the optional dsh-plugin-subagent-director plugin; everything else works without it.'
      zh: '代际树面板：把 Lead→成员→孙代理 的多层代理关系画成实时组织树，含团队焦点、真状态点、模型路由中心（需可选的 subagent-director 插件）。别名系统：团队成员与原生 subagent 子/孙节点均可行内改名，别名独立存储、不改团队真源。自动任务简介：成员默认显示「名字 · 任务简介（状态符）」，原生子/孙代理自动从会话日志提取派发 prompt 作为简介。批次分组与过滤：多轮派发按时间自动聚类成批次区块，可只看单批。三段式选择：视图（会话树/团队）→ 目标 → 批次。'
