url: https://github.com/tinqiao-oss/engramory/tree/master/adapters/dsh/plugin
name: dsh-engramory
category: memory
description:
  en: 'The Engramory curated-memory discipline as an installable plugin ([npm: dsh-engramory](https://www.npmjs.com/package/dsh-engramory)): a deterministic 200-line / 25 KB cap on the `MEMORY.md` index via `ctx.tools.guard()` — growth denied, a shrinking rewrite always passes — plus the protocol registered as a runtime skill. The store is plain markdown, one file per fact, shared with Claude Code, Codex, Kiro, and OpenClaw.'
  zh: '把 Engramory 策展式记忆纪律做成可安装插件（[npm: dsh-engramory](https://www.npmjs.com/package/dsh-engramory)）：通过 `ctx.tools.guard()` 对 `MEMORY.md` 索引施加确定性的 200 行 / 25KB 上限（增长即拒、缩小的重写一律放行），并把协议注册为运行时 skill。记忆库是纯 markdown、一条事实一个文件，与 Claude Code、Codex、Kiro、OpenClaw 共用。'
  ja: 'Engramory の厳選メモリ運用をインストール可能なプラグインにしたもの（[npm: dsh-engramory](https://www.npmjs.com/package/dsh-engramory)）。`ctx.tools.guard()` により `MEMORY.md` の索引を 200 行 / 25 KB に決定論的に制限し（増やす変更は拒否、縮める書き換えは常に通過）、その運用規約を実行時スキルとして登録します。保存先は 1 つの事実につき 1 ファイルのプレーンな Markdown で、Claude Code、Codex、Kiro、OpenClaw と共有できます。'
