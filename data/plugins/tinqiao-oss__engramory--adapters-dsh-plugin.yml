name: tinqiao-oss/engramory#plugin
category: memory
description:
  en: 'Long-term memory for DeepSeek Harness kept as plain markdown, one fact per file. Every step the `MEMORY.md` index (the project store if there is one, plus a global store under `$DSH_HOME`) goes into the runtime context, so recall does not wait for a file read. The index has a hard cap, 200 lines / 25 KB by default, enforced by `ctx.tools.guard()`: a write that grows an over-cap index is denied, a rewrite that shrinks it passes. A read-only sidebar Memory page lists the notes by type. The plugin never writes memories on its own. An experimental companion mode adds note types for a persona''s own life. The same store also works with Claude Code, Codex, Kiro and OpenClaw.'
  zh: '给 DeepSeek Harness 的长期记忆，以纯 markdown 保存，一条事实一个文件。每一步都把索引 `MEMORY.md`（有项目库时含项目库，另加 `$DSH_HOME` 下的全局库）放进运行时上下文，召回不用等模型去读文件。索引有硬上限，默认 200 行 / 25KB，由 `ctx.tools.guard()` 强制执行：让已超限的索引变大的写入被拒绝，缩小它的重写一律放行。左侧栏有只读的「记忆」页，按类型列出笔记。插件不会自行写入记忆。实验性的大肥鱼模式为人设角色加了记录它自己人生的笔记类型。同一个记忆库也可供 Claude Code、Codex、Kiro、OpenClaw 使用。'
