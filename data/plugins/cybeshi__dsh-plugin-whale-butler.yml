url: https://github.com/cybeshi/dsh-plugin-whale-butler
name: cybeshi/dsh-plugin-whale-butler
category: tools
description:
  en: A local-first ledger for DSH. Record an expense or income from one sentence or a screenshot, with accounts, categories, refunds, installments, loans, debts and offline HTML charts. Data stays in local JSONL files.
  zh: 说人话就能记的本地账本。一句话或一张截图记一笔收支，支持账户、类别、退款、分期、债权、债务和离线 HTML 图表；账本存在本地 JSONL 文件里。
