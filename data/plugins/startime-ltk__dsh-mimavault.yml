url: https://github.com/startime-ltk/dsh-mimavault
name: startime-ltk/dsh-mimavault
category: security
description:
  en: Bridges DSH to the local MimaVault password manager with six tools for metadata search, entry lookup, clipboard copy, TOTP codes, password generation and domain-restricted API calls.
  zh: 把本机 MimaVault 密码库接入 DSH，提供 6 个工具用于元数据检索、条目读取、剪贴板复制、动态验证码、口令生成与域名受限的 API 调用。
