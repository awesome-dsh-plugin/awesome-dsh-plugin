url: https://github.com/baidada1020/dsh-go-phone
name: baidada1020/dsh-go-phone
category: remote
description:
  en: 'Adds a sidebar button that opens the DSH web engine running on an Android phone as a full-screen overlay inside the desktop Harness, over an adb port forward and a local gateway that signs the engine auth cookie.'
  zh: '在侧边栏加一个按钮，点开就是手机上 DSH Go 引擎的完整界面：走 adb 端口转发，由本地网关自动完成引擎鉴权。'
