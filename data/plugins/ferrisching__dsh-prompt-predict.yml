url: https://github.com/ferrisching/dsh-prompt-predict
name: ferrisching/dsh-prompt-predict
category: ui
description:
  en: 'Predicts the user''s next prompt after each assistant reply and shows it as gray ghost text inside the composer; Tab accepts it, ↓ generates the next suggestion, ↑ returns to the previous one, and Esc dismisses it. Each assistant reply triggers an extra call to the session''s model, carrying the most recent user and assistant text.'
  zh: '助手回复结束后预测用户的下一句话，以灰色 ghost text 浮在输入框里；Tab 采纳、↓ 生成下一条、↑ 回到上一条、Esc 忽略。每次助手回复后会额外调用一次会话所用的模型，带上最近的用户与助手文本。'
