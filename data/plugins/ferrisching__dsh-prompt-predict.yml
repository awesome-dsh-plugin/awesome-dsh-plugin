url: https://github.com/ferrisching/dsh-prompt-predict
name: ferrisching/dsh-prompt-predict
category: ui
description:
  en: Predicts the user's next prompt after each assistant reply and shows it as gray ghost text inside the composer; Tab accepts it, ↓ generates the next suggestion, ↑ returns to the previous one, and Esc dismisses it.
  zh: 助手回复结束后预测用户的下一句话，以灰色 ghost text 浮在输入框里；Tab 采纳、↓ 生成下一条、↑ 回到上一条、Esc 忽略。
