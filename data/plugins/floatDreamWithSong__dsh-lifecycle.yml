url: https://github.com/floatDreamWithSong/dsh-lifecycle
name: floatDreamWithSong/dsh-lifecycle
category: security
description:
  en: 'Refresh after installation: HTTP 401 means sign-in is required, not connection failure. Initial setup publicly displays a temporary password; initialize in a trusted network and change it immediately. Web-profile lock screen with password/OTP/Passkey, persistent sessions and custom wallpapers; Harness power controls and npm updates on Linux/macOS/Windows 11 require the bundled systemd/launchd/Task Scheduler controller. Electron Desktop is not supported. Stopping interrupts the managed process tree. Auth kernel adapted from xbzbing/dsh-auth-gateway (MIT); do not co-install, both own the web gateway port.'
  zh: '安装后务必刷新页面：HTTP 401 表示需要登录，并非连接失败。首次设置页公开展示临时密码，请在受控网络立即改密。提供 Web profile 锁屏、密码／OTP／Passkey、持久化登录与自定义壁纸，以及 Linux/macOS/Windows 11 的 Harness 电源管理和 npm 更新（需安装随包提供的 systemd/launchd/任务计划程序控制服务）。暂不支持 Electron Desktop；停止会中断托管进程树。认证内核改编自 xbzbing/dsh-auth-gateway（MIT），不能与其同装：两者都占用 Web 网关端口。'
