url: https://github.com/floatDreamWithSong/dsh-lifecycle
name: floatDreamWithSong/dsh-lifecycle
category: security
description:
  en: 'Web-profile lock screen with password/OTP/Passkey, persistent sessions and custom wallpapers; Harness power controls and npm updates on Linux/macOS/Windows 11 (requires the bundled systemd/launchd/Task Scheduler controller). Refresh after installation; HTTP 401 means sign-in is required. Initial setup shows a temporary password publicly: initialize in a trusted network and change it immediately. Electron Desktop is not supported. Stopping interrupts the managed process tree. Auth kernel adapted from xbzbing/dsh-auth-gateway (MIT); do not co-install, both own the web gateway port.'
  zh: 'Web profile 锁屏、密码／OTP／Passkey、持久化登录与自定义壁纸，支持 Linux/macOS/Windows 11 的 Harness 电源管理及 npm 更新（需安装随包提供的 systemd/launchd/任务计划程序控制服务）。安装后务必刷新，HTTP 401 表示需要登录；首次设置页公开显示临时密码，请在受控网络立即改密。暂不支持 Electron Desktop；停止会中断托管进程树。认证内核改编自 xbzbing/dsh-auth-gateway（MIT），不能与其同装：两者都占用 Web 网关端口。'
