url: https://github.com/floatDreamWithSong/dsh-lifecycle
name: floatDreamWithSong/dsh-lifecycle
category: security
description:
  en: 'IMPORTANT: refresh immediately after installation or open /login. An old page showing connection failure or HTTP 401 needs sign-in, not reinstalling; it may be unable to load the plugin notice. Windows 11 Web users can enable background power services from the Power menu without a terminal. Initial setup displays a temporary password on the page, never in terminal logs; initialize in a trusted network and change it immediately. Web-profile lock screen with password/OTP/Passkey, persistent sessions and custom wallpapers. Linux/macOS power controls need the bundled systemd/launchd controller; npm updates require a dedicated managed install, never a shared/global prefix. Electron Desktop is not supported. Stopping interrupts active tasks. Auth kernel adapted from xbzbing/dsh-auth-gateway (MIT); do not co-install, both own the web gateway port.'
  zh: '【安装后立即刷新页面或打开 /login】旧页面显示「无法连接」或 HTTP 401 表示尚未登录，并非安装失败；此时可能连插件弹窗都加载不到，请手动刷新，不要反复重装。Windows 11 Web 用户可在「电源 → 启用电源控制」一键配置后台服务，无需终端。初始密码仅在首次设置页展示，终端不打印；请在受控网络立即改密。支持 Web 锁屏、密码／OTP／Passkey、持久登录和自定义壁纸。Linux/macOS 电源功能需部署随包提供的 systemd/launchd 服务；npm 自动更新仅适用于独立托管安装，不替换源码、全局或共享目录。暂不支持 Electron Desktop；停止会中断运行任务。认证内核改编自 xbzbing/dsh-auth-gateway（MIT），两者不能同装，均占用 Web 网关端口。'
