name: chen1pengvincent/dsh-archived-manager
category: session
description:
  en: "Searches archived sessions, restores them with DSH's native unarchive, and supports bulk cleanup with a recoverable quarantine, configurable retention, and a preview before permanent deletion."
  zh: "检索已归档会话，支持原生取消归档、批量清理、可恢复隔离区和自定义保留期限，并在彻底删除前预览。"
