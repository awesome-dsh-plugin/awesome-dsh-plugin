description:
  en: "Searches archived DSH sessions, restores them to the sidebar, and supports bulk cleanup with a recoverable Recently Deleted area, configurable retention, and a preview before permanent deletion."
  zh: "检索 DSH 已归档会话、还原到侧边栏，并支持批量清理、可恢复的「最近删除」、可配置的保留期限和彻底删除前预览。"
