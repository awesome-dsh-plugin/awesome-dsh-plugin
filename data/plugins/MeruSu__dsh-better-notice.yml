url: https://github.com/MeruSu/dsh-better-notice
name: MeruSu/dsh-better-notice
category: notify
description:
  en: "Shows which session is waiting for you where you already look: a seat in the conversation tab row, a state glyph on each sidebar row, a pill in the Windows title bar, and per-state sounds and popout images."
  zh: 把「哪个会话在等我」显示在你本来就会看的地方：对话页签行一个座位、侧栏每行一个状态图标、Windows 标题栏一个胶囊，状态变化时还有声音与弹出图。
