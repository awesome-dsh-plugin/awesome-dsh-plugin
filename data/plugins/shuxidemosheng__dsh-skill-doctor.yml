url: https://github.com/shuxidemosheng/dsh-skill-doctor
name: shuxidemosheng/dsh-skill-doctor
category: skill
description:
  en: 'Diagnoses why a skill never gets picked by the model, whether a plugin is really in use, and whether skills and plugins conflict with each other; every finding comes with a diagnosis, checkups are archived so a re-check shows the difference before and after; unfamiliar plugins get a security review before install, with a plugin allowlist and a diff between the new and old versions; Claude Code / Codex / ZCode skill directories can be mounted and reused; a live panel shows which skill the model is reading and which tools it calls, with a cross-session tally of skills that were never used.'
  zh: '诊断技能为什么没被模型使用、插件是否真的被使用、技能与插件之间是否互相冲突；每条问题给出诊断方法，同时保存病历，复诊时对比前后差异；装陌生插件前会进行安全审查，同时设置插件白名单，也能对比新旧版本的区别；把 Claude Code / Codex / ZCode 的技能挂进来复用；面板上实时显示模型正在读哪个技能、调什么工具，并跨会话统计哪些技能从没被用过。'
icon: https://raw.githubusercontent.com/shuxidemosheng/dsh-skill-doctor/main/docs/images/icon-180.png
