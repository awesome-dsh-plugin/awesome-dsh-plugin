url: https://github.com/shangyunqiang1/DSH_Eplan
name: shangyunqiang1/DSH_Eplan
category: tools
description:
  en: 'EPLAN Electric P8 automation for DeepSeek Harness (Windows): a bundled eplan-mcp server drives the running P8 2025 instance through the EPLAN Remote Client interface, a settings page sets the EPLAN install root, and five skills cover connection and safety, C# scripting, documentation lookup, EEC Pro development and setup. Five offline SQLite documentation indexes (P8 2025 API reference, P8 2025 platform help, P8 2026, P8 2027, EEC Pro 2026) answer questions without network access, but they are not shipped in the repository: download the release zip or build them with the included scripts; the P8 2026 and P8 2027 rows ship disabled. Requires EPLAN P8 2025 with Remote Client access enabled and Python 3.12+ with mcp and pythonnet (run scripts\setup.ps1 once). A version panel records releases and applies a newer one from the repository.'
  zh: 'DeepSeek Harness 的 EPLAN Electric P8 自动化插件（仅 Windows）：内置 eplan-mcp 通过 EPLAN Remote Client 接口驱动正在运行的 P8 2025，设置页配置 EPLAN 安装根目录，五个技能覆盖连接与安全、C# 脚本、文档查阅、EEC Pro 开发与安装排错。五套离线 SQLite 文档索引（P8 2025 API 参考、P8 2025 平台帮助、P8 2026、P8 2027、EEC Pro 2026）可在断网状态下检索，但索引不随仓库提供：需下载 Release 里的索引压缩包，或用自带脚本自行构建；2026 与 2027 两行默认关闭。需已安装 EPLAN P8 2025 并开启 Remote Client 远程访问，以及带 mcp 与 pythonnet 的 Python 3.12+（先运行一次 scripts\setup.ps1）。版本面板记录发布历史，并可从仓库直接更新到较新版本。'
