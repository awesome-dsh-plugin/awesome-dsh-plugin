name: HuiHui-Small/dsh-outlook-bridge
category: notify
description:
  en: 'Adds an Outlook mailbox and calendar to DeepSeek Harness, with unread badges and AI-assisted email drafts. New sign-ins require your own Microsoft Entra application client ID and open in the DeepSeek Harness embedded browser. It requests read/write access to mail (including sending), calendar and To Do. Mail text goes to your configured model for the AI features; the welcome-page weather calls Open-Meteo, and BigDataCloud if you use your location.'
  zh: '在 DeepSeek 助理中接入 Outlook 邮箱和日历，支持未读角标与 AI 邮件草稿。新授权需要在设置中填写自己的 Microsoft Entra 应用客户端 ID，微软登录页在 DeepSeek Harness 内置浏览器中打开。申请的权限包括邮件读写与发信、日历和 To Do 读写。AI 功能会把邮件内容交给你配置的模型；欢迎页天气会请求 Open-Meteo，使用当前位置时还会请求 BigDataCloud。'
tarball: https://github.com/HuiHui-Small/dsh-outlook-bridge/releases/download/v0.4.1/dsh-outlook-bridge-0.4.1.tgz
