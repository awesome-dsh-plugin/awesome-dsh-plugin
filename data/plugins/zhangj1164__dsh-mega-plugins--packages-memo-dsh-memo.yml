url: https://github.com/zhangj1164/dsh-mega-plugins/tree/main/packages/memo/dsh-memo
name: zhangj1164/dsh-mega-plugins#dsh-memo
category: memory
description:
  en: "Week-keyed personal memo service: stores entries in ISO-week tables, resolves week/month/quarter/year navigation from one period calendar, archives quarters, runs AI analysis and Markdown report export, summarizes archived DSH sessions into the week as one entry per session in the language and at the length the reader picks, requires an explicit force flag to edit a past week, and turns one suite-wide telemetry failure analysis into a GitHub issue report."
  zh: "按 ISO 周组织的个人备忘服务：条目按周存储，周/月/季/年四种视图由同一份周期日历解析，支持按季度归档，提供 AI 分析与 Markdown 报告导出，并能按读者所选语言与长度把 DSH 已归档会话总结进对应周、每个会话一条，修改非当前周需要显式确认，也能把整条插件套件的遥测失败分析整理成一份 GitHub issue 报告。"
