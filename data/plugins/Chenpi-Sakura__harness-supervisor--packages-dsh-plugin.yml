url: https://github.com/Chenpi-Sakura/harness-supervisor/tree/main/packages/dsh-plugin
name: Chenpi-Sakura/harness-supervisor#dsh-harness-supervisor
category: workflow
description:
  en: 'Delegate DSH tasks to independent Pi, Qoder and MiniMax Code workers through session-scoped MCP, with persistent sessions and a shared WebUI for results, events, approvals and cancellation. By default the Qoder and MiniMax Code workers run with every tool approval bypassed (change it with HARNESS_SUPERVISOR_QODER_PERMISSION_MODE and HARNESS_SUPERVISOR_MCODE_PERMISSION_MODE); DSH workers default to workspace-write with approval.'
  zh: '通过按会话限定的 MCP，将 DSH 任务委派给独立的 Pi、Qoder 和 MiniMax Code Worker，支持持续会话，并提供查看结果、轨迹、审批和取消任务的共用 WebUI。默认情况下 Qoder 和 MiniMax Code 的 Worker 会绕过所有工具审批（用 HARNESS_SUPERVISOR_QODER_PERMISSION_MODE 和 HARNESS_SUPERVISOR_MCODE_PERMISSION_MODE 修改）；DSH Worker 默认是 workspace-write 加审批。'
