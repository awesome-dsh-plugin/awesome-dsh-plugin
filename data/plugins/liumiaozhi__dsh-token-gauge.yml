  en: 'Sidebar token gauge for DeepSeek Harness: live output-speed dial, current-session and today token totals, estimated spend from DeepSeek list prices with half price off-peak, and a 70-100% cache-hit dial, with single- and dual-gauge layouts and four skins.'
