  en: 'Use natural language in DeepSeek Harness to read, create and edit Figma designs, with components and variables, native motion, screenshots and asset exports, capability checks, document reconnection and built-in guides. Local mode does not consume the official Figma MCP call quota. Needs Figma Desktop with the generated companion plugin imported.'
