description:
  en: "Read, create and edit native Figma UI with DSH: screenshot comparison, design references, components and variables, motion, assets and scoped recovery. Local companion by default, with official MCP connections retained. Requires Figma Desktop and the generated companion."
  zh: "让 DSH 用自然语言读取、创建和编辑 Figma UI，支持参考图比对、设计参考、组件与变量、动效、素材和局部恢复。默认走本地配套插件，保留官方 MCP 接入；需 Figma 桌面版并导入 DSH 生成的配套插件。"
