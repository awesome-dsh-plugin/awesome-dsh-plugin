url: https://github.com/ssamurias/dsh-fish
name: ssamurias/dsh-fish
category: fun
description:
  en: 'A pet fish living in the DSH settings page whose personality is grown from events instead of configured: four stages and three bottlenecks advance by elapsed days and real conversation, she browses Bilibili through a self-written client with no third-party libraries, keeps an append-only event log as the only source of truth, writes a diary she is not shown, and starts accumulating a stance list only after all four stages finish. Zero runtime dependencies.'
  zh: '住在 DSH 设置页里的一条鱼，人格由事件长出来而不是配置出来：四个阶段与三道瓶颈按天数与真实对话推进，她用一个自己写的、不依赖第三方库的客户端刷 B 站，事件流只追加、是唯一真相源，会写不给自己看的日记，四个阶段全部走完之后才开始攒「立场清单」。没有任何运行时依赖。'
