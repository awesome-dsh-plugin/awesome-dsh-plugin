url: https://github.com/xsnnnnnn/dsh-endurance-coach
name: xsnnnnnn/dsh-endurance-coach
category: skill
description:
  en: 'Endurance-coaching skill bundle that defaults to Intervals.icu for training data (activities, intervals, streams, training load, HRV, resting heart rate, sleep in-bed hours, eFTP) and uses COROS only for training-plan read/write and for fields Intervals.icu lacks (sleep score, recovery score), with iGPSPORT as a fallback for ride details. It turns that data into readiness gating, VDOT pace and heart-rate zones, periodized weekly plans, session reviews, race-day pacing and fueling, and weather-adjusted workouts. The bundle registers the endurance-coach skill in the profile, ships deterministic helper scripts, reads an athlete profile created by its init script, and requires the agent to state when data is unavailable instead of inventing it.'
  zh: '耐力训练决策技能包：默认从 Intervals.icu 取训练数据（活动、分圈、秒流、训练负荷、HRV、静息心率、睡眠在床时长、eFTP），COROS 只负责训练计划读写与 ICU 缺的字段（睡眠评分、恢复分），iGPSPORT 兜底骑行明细；据此做恢复闸门、VDOT 配速与心率区间、周期化周计划、单次复盘、赛前配速与补给、按天气修正训练。插件在 profile 里注册 endurance-coach 技能，内置确定性计算脚本，读取初始化脚本生成的运动员档案，并强制「取不到数据就如实说明、不得编造」。'
icon: https://raw.githubusercontent.com/xsnnnnnn/dsh-endurance-coach/main/assets/icon.png
