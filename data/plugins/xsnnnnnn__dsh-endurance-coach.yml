name: xsnnnnnn/dsh-endurance-coach
category: skill
description:
  en: 'Endurance-coaching skill bundle that reads its training data from COROS only, through the separately installed dsh-coros MCP plugin: runs, rides with head-unit power, training plans, sleep and HRV, recovery and training load. It turns them into readiness gating, VDOT pace and heart-rate zones, periodized weekly plans written back to the COROS plan after confirmation, session reviews, race-day pacing and fueling, and weather-adjusted workouts. Weather comes from Open-Meteo, with air quality anchored to official monitoring-station observations (aqicn) instead of raw model values and graded as China AQI at the actual training window, so a model overestimate no longer cancels an outdoor session. A trail-running module adds event demand analysis, weekly vertical guardrails, uphill and downhill sessions, and hourly fueling. Ships deterministic helper scripts (VDOT, readiness, nutrition, weather, trail) that need Python 3.10+ and no third-party packages, and requires the agent to say when data is unavailable instead of inventing it.'
  zh: '以 COROS 为唯一数据源的耐力训练决策技能包（数据来自另行安装的 dsh-coros MCP 插件：跑步、含码表功率的骑行、训练计划、睡眠与 HRV、恢复分与训练负荷）。它把这些数据变成可执行决策：恢复闸门、VDOT 配速与心率区间、周期化周计划（确认后写回 COROS 计划）、单次复盘、赛前配速与补给、按天气修正训练。天气取自 Open-Meteo，空气质量改用官方监测站实测（aqicn）锚定、模型只贡献逐小时形状，判级用中国 AQI 并看实际训练时段，避免模型高估导致误取消户外课。新增越野跑模块：赛事需求分析、周爬升护栏、上坡与下坡专项课、按小时的越野补给。插件在 profile 注册 endurance-coach 技能，内置确定性脚本（VDOT、恢复判定、补给、天气、越野 km-effort），只需 Python 3.10+ 与标准库；取不到数据时要求如实说明、不得编造。'
