description:
  en: 'Workout logging plugin: fitness_log tool (log, history, stats, weekly plans) plus a left-rail schedule panel with week strip, streak, one-tap check-in and 4x8@60 quick entry, all data in local SQLite.'
  zh: '训练记录插件：fitness_log 工具（记录、历史、统计、每周计划）加左侧栏日程画报——周历条、连续打卡、一键打卡与 4x8@60 快速记录，数据全部存本地 SQLite。'
