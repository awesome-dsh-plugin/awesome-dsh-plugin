url: https://github.com/czk200518-hash/dsh-tlogs
name: czk200518-hash/dsh-tlogs
category: usage
description:
  en: "Token usage meter in the DSH sidebar footer that runs both data sources at once rather than picking one: the DeepSeek platform account's usage and cost endpoints, which cover every device on the account but only the official channel, and local session logs, which cover this machine in real time across every provider but carry no cost. The two are merged per day — the official channel takes the larger figure, since one call is recorded by both, and providers the platform cannot see are added on top. History is backfilled month by month from the platform, providers are classified by channel rather than model name, days follow the platform's UTC boundary, and no token has to be pasted because the platform figures reuse the DSH account you are already signed in to. Totals appear as all-time, current-project, today, week, month, last-7 and last-30 in a compact bar, an expand panel and a detail modal with calendar, chart, model, provider, year, month and day tabs."
  zh: "DSH 侧边栏页脚的 Token 用量组件，同时跑两路数据源而不是二选一：DeepSeek 平台账号的用量/金额接口（账号全部设备、仅官方通道），本机会话日志（仅本机、含所有供应商、实时、无金额）。两路逐日合并——官方通道取较大值（同一次调用两路都会记），平台看不到的供应商再叠加；历史月份从平台回补，供应商按通道而非模型名判定，日桶跟随平台口径（UTC）；平台数字默认复用 DSH 已登录账号，不用粘贴 token。数字出现在紧凑条、展开面板，以及含日历/图表/模型/供应商/年/月/当月按天页签的详细数据弹窗，口径为总消耗/当前项目/今日/当周/当月/近 7 天/近 30 天。"
