url: https://github.com/Ayowait/dsh-usage-insights
name: Ayowait/dsh-usage-insights
category: usage
description:
  en: 'A Usage page in DSH settings that folds every model call into a local ledger and reports requests, tokens, and estimated cost by day, route, and model, with editable unit prices and CSV export.'
  zh: '在 DSH 设置里加一页「用量查询」：把每次模型调用记进本地账本，按天、接口、模型汇总请求数、Token 与费用估算，支持单价修改与 CSV 导出。'
