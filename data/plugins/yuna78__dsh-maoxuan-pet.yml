  en: "A floating whale-girl pet in the DSH web GUI: every hour it takes one article from a bundled 33-essay corpus of Mao Zedong's selected works and puts a cited line with its source link, one of six business angles (customer, project, organisation, cash flow, decision, self-discipline) and a one-line nudge for a founder into a bubble capped at 200 characters. Ships the maoxuan-pet preset and a maoxuan-vademecum skill over the same corpus, four poses, quiet hours and a daily cap."
