name: 439436269-ctrl/dsh-sticky-notes
category: ui
description:
  en: 'Adds a tiled board of colour-coded sticky notes to the sidebar: per-row density, pins, search and colour filters, a trash with restore, Markdown export, and note_* tools that read and write the same notes.'
  zh: '在左侧栏加一面可平铺的彩色便签墙：每行 2–5 个或自适应、置顶、搜索与颜色筛选、带恢复的回收站、Markdown 导出；四个 note_* 工具读写同一批便签。'
