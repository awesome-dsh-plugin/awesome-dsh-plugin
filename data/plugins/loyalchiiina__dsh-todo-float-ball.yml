url: https://github.com/loyalchiiina/dsh-todo-float-ball
name: loyalchiiina/dsh-todo-float-ball
category: ui
description:
  en: 'Draggable floating ball that shows the current DSH session todo checklist live — done/total on its face (capsule mode also shows the running task title) plus a matching progress ring. Click to expand or fold the full list, right-click to switch capsule mode, and state colours mark in-progress (pulsing), done, pending and empty. Replaced plans are archived as history rows that can be hidden one by one, cleared and restored instead of counting towards progress, and other sessions can be pinned side by side. Data comes from the runtime sessions projection first with the official todo panel as a fallback, so the full list survives even when the official strip is collapsed. Text colour can be forced to auto, black or white, the ball snaps back to the bottom-right corner on demand, and it stays draggable right up to the top edge of the window. 130 shared skins — including two official dark and light skins that follow the client light/dark theme automatically, plus a per-ball sync switch so each ball either follows the shared skin or keeps its own — with Shadow DOM style isolation and position remembered per profile, identical on desktop and web.'
  zh: '常驻可拖动悬浮球实时显示当前会话的 todo 清单：球面显示完成数/总数（胶囊模式另显示进行中任务名），外环进度环同步百分比；点击展开或收起完整清单，右键切胶囊模式，状态用颜色区分（进行中橙色脉动、完成绿、待办蓝、无清单灰）。被替换的旧计划自动归档成历史行（可逐行隐藏、批量清理、一键恢复），不再计入进度；其他会话可固定并排查看。数据以 runtime 的 sessions 投影为准，官方 todo 面板仅作兜底——所以官方计划条收起时球上仍是完整清单。文字颜色可强制为自动/黑/白，球被拖走后可一键归位到右下角，拖到窗口最顶部也照样能拖。130 款共享皮肤——含两款随客户端深/浅主题自动切换的官方深色与浅色皮肤，另有每球独立的同步开关，可跟随共享皮肤或保留自己的皮肤——Shadow DOM 样式隔离，位置按 profile 记忆，桌面端与网页端表现一致。'
