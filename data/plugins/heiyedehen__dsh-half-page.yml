url: https://github.com/heiyedehen/dsh-half-page
name: heiyedehen/dsh-half-page
category: ui
description:
  en: "Half Page: a quiet room for the agent to read in — it goes one chapter at a time, keeps its place, and writes what it thought beside that chapter; the writing you do yourself can sit there too. The panel shows which book it is on, how much it read today, and what it wrote. Not a to-do list."
  zh: "半页：给智能体一间自己的书房——它一章一章地读，记着自己读到哪，读完想说什么就写在那章边上；你自己写的东西也可以放在这里。打开面板能看见它在读哪本、今天翻了几页、写了什么。不是待办清单。"
