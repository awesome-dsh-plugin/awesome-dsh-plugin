url: https://github.com/dyrcjqlgcj/dsh-hindsight-local
name: dyrcjqlgcj/dsh-hindsight-local
category: memory
description:
  en: "Runs Hindsight long-term memory on your own machine: after a one-time uvx --from hindsight-embed@latest hindsight-embed profile create server setup (~450 MB of Python dependencies) and with your own LLM key, the plugin manages the local memory server itself (health probe, start, stop, logs), registers ten hindsight_local_* tools for status, page search, page read, recall, remember and reflect, injects a knowledge-page index once per session, writes each finished turn back into the bank, and extracts facts with your own LLM key. Do not enable it alongside the official @vectorize-io/hindsight-coding-agents plugin: both read the same bank and would inject duplicate context. At session end it writes a handoff snapshot that the next session injects as previous progress. The data directory is configurable (dataDir) and scripts/relocate.mjs moves an existing install to another drive, creating directory junctions where the server hard-codes its paths."
  zh: "把 Hindsight 长期记忆放到自己的机器上跑：先用 uvx --from hindsight-embed@latest hindsight-embed profile create 做一次性服务安装（约 450 MB Python 依赖）并自备 LLM key，之后插件自己管理本地记忆服务（探活、启动、停止、看日志），注册 10 个 hindsight_local_* 工具（状态、页面检索、读页、召回、写入、反思），每场会话开始时注入一次知识页索引、轮次结束把对话片段写回记忆库，抽取用你自己的 LLM key。不要与官方 @vectorize-io/hindsight-coding-agents 插件同时启用：两者读同一个记忆库，会重复注入上下文。会话结束时写一份收尾快照，下一场会话注入成「上次进度」。数据目录可配置（dataDir），scripts/relocate.mjs 能把已有数据搬到别的盘（服务写死的位置用目录联接解决）。"
