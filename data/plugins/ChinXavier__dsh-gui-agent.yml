name: ChinXavier/dsh-gui-agent
category: tools
icon: https://raw.githubusercontent.com/ChinXavier/dsh-gui-agent/main/assets/icon-180.png
description:
  en: 'Windows mouse and keyboard agent control for DSH: a session-scoped toggle in the composer that registers nine tools for screenshots, mouse and keyboard input, window switching, UI Automation lookup, window-to-account mapping, a prompt queue and download collection. Input is native Win32 SendInput and defaults to human-like pacing - bezier cursor paths with overshoot correction, real VK keystrokes, log-normal typing with occasional typo corrections and a pause before each click - with realistic, fast and custom (0.2-8x) speed presets. Windows only.'
  zh: 鼠标键盘代理操作 · 真人模拟。为 DSH 输入框加一个按会话生效的开关，开启后注册 9 个工具：截屏、鼠标点击与拖拽、键盘输入、窗口切换、UI Automation 控件定位、窗口与账号映射、批量 prompt 队列、下载收集。输入走原生 Win32 SendInput，默认拟真节奏——贝塞尔光标轨迹与末端过冲回拉、真实 VK 击键、对数正态字符间隔并偶发打错重打、点击前犹豫——并提供仿真 / 便捷 / 自定义（0.2–8 倍）三档。仅 Windows。
