url: https://github.com/Larrtroffen/dsh-workspace-folders
name: Larrtroffen/dsh-workspace-folders
category: ui
description:
  en: 'Folder organization for the DeepSeek Harness sidebar: display-only Workspace folders (drag a Workspace onto a folder block to file it, nest and re-order folders, collapse with counts), durable per-Workspace nested Session folders, per-row icons chosen from 40 host icons or 48 emoji, and a Workspace-level "archive all sessions" cleanup. A fork of WSNMM3/dsh-session-keeper (MIT, itself derived from ht719/dsh-session-categories); it replaces the sidebar.workspaces region, so do not install it alongside the upstream plugins.'
  zh: '给 DeepSeek Harness 侧边栏加原生手感的文件夹组织：纯显示的工作区文件夹（把工作区拖到文件夹整块区域即可归档、嵌套、排序、折叠），每个工作区独立且持久化的多层会话文件夹，40 个原生图标 + 48 个 Emoji 的逐行图标自定义，以及工作区级"一键归档全部空闲会话"。本插件是 WSNMM3/dsh-session-keeper（MIT，源自 ht719/dsh-session-categories）的分叉，会替换 sidebar.workspaces 区域，不能与上游插件同时安装。'
icon: https://raw.githubusercontent.com/Larrtroffen/dsh-workspace-folders/main/icon-96.png
