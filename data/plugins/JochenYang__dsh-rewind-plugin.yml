name: JochenYang/dsh-rewind-plugin
category: session
description:
  en: 'Recall a message you already sent: it leaves the model context, the recalled turns disappear from the transcript, its text returns to the composer, and the files it displaced wait in a quarantine you can review.'
  zh: '撤回已发送的消息：该消息退出模型上下文、被撤回的回合从对话界面消失、原文回到输入框，被它移走的文件留在可查看的隔离区。'
