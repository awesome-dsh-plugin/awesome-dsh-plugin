url: https://github.com/chenvinc/dsh-task-settle-notify
name: chenvinc/dsh-task-settle-notify
category: notify
icon: https://raw.githubusercontent.com/chenvinc/dsh-task-settle-notify/main/docs/assets/icon-512.png
description:
  en: Notifies the DSH session that started a task-board card when that card settles, queueing the title, outcome, duration and next step into that session; successes merge inside a configurable window (30 seconds by default) and failures are sent at once.
  zh: 任务看板卡片结算后，把标题、成败、耗时与下一步排队送进发起该卡的那个 DSH 会话；成功卡按可配置的窗口合并（默认 30 秒），失败卡立即发送。
