description:
  en: Project autopilot for DSH 0.2.1-rc.2 and 0.2.1-rc.3, with scoped authorization, independent verification, editable memories and companion chat, including automatic installation of the compatible desktop pet fork. The bundled pet is a fork of takboo/dsh-coopanion (AGPL-3.0-or-later); do not install the upstream pet alongside it.
