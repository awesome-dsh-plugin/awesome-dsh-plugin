url: https://github.com/saltfish060/dsh-opendesign-quota
name: saltfish060/dsh-opendesign-quota
category: usage
description:
  en: 'OpenDesign (AMR) quota in a composer pill and detail panel: the Design Plan 5-hour and 7-day windows with remaining percentage, exact credits, reset time, today token total and the two most recent calls. The 7-day window also reports whether the current rate reaches the reset, measured from that window''s own start. Settings choose what the pill shows — one window or both, ring, dot or nothing — and both off hides the pill. Reads the vendor console over a local controlKey or a browser session collected in a temporary Chrome window after you sign in.'
  zh: '在 DSH 输入框旁显示 OpenDesign（AMR）额度：胶囊加详情面板，给出 Design Plan 的 5 小时与 7 天窗口剩余百分比、精确数额、重置时间、今日 token 和最近两次调用。7 天窗口还会推算按当前速度能否撑到重置，速度从该窗口自己的起点算起。设置页可选胶囊显示哪个窗口、要不要显示圆环或圆点，两者都关时胶囊整体隐藏。读数走本机 controlKey，或在你登录后从临时 Chrome 窗口取浏览器会话。'
