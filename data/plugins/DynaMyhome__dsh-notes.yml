name: DynaMyhome/dsh-notes
category: docs
description:
  en: 'Notes workspace in the right sidebar: a notes tree beside a live-preview Markdown editor with tabs, split panes, outline and trash, over plain .md files and a thin per-workspace index. Agents organize it through one `knowledge` tool; `embed` fences render an interactive HTML page in a sandboxed iframe (scripts run, no network).'
  zh: '右侧栏的笔记工作区：笔记树 + 实时预览的 Markdown 编辑器（标签 / 分屏 / 大纲 / 回收站），笔记是普通 .md 文件，索引是按工作区的薄映射，Agent 侧只用一个 `knowledge` 工具整理；`embed` 围栏把可交互网页演示嵌进笔记（沙箱 iframe，脚本可跑、断网、拿不到宿主）。'