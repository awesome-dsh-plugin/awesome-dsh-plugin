description:
  en: 'Embed mode for the DeepSeek Harness web GUI: hides the sidebar, adds an in-frame top bar (workspace and session pickers, new session, font scale), auto-connects the workspace named in the obVault parameter, and accepts the launch token so the GUI can run inside a cross-site iframe.'
  zh: '为 DSH Web GUI 提供嵌入模式：隐藏侧栏，在页面内加顶栏（工作区/会话切换、新建会话、字号），按 obVault 参数自动接入工作区，并支持用启动 token 认证，以便嵌入跨站 iframe。'
