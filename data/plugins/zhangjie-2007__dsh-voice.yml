url: https://github.com/zhangjie-2007/dsh-voice
name: zhangjie-2007/dsh-voice
category: notify
description:
  en: 'Speaks a cue for DeepSeek Harness on Windows, synthesized with a Microsoft Edge neural voice and replayed from a local cache. Ten moments: an agent turn ends normally, the agent needs you to choose (a question, a plan approval, or a permission request), a new conversation starts (a time-of-day greeting), the turn errors, you interrupt it, a deliverable is produced, a background job settles, a goal is completed, a compaction finishes, and a first-round acknowledgement. A small bubble in the lower-left corner mutes and unmutes every cue with one click, with its own toggle chime. Subagent turns and goal-driven continuation rounds stay silent; the desktop SAPI voice is the offline fallback.'
  zh: 'Windows 上的 DeepSeek Harness 语音提示，用微软 Edge 神经语音合成、缓存在本地播放，共 10 种时机：一轮对话正常结束、需要你做选择（提问／批准计划／权限确认）、开始新对话（按系统时间问候）、回合出错、被你打断、产出文件、后台任务跑完、goal 达成、上下文压缩完成、新对话第一轮应一声。页面左下角的小悬浮泡点一下就能把所有播报静音或恢复（自带开关音效）。子代理回合和 goal 仍在续跑的回合不播报；网络不可用时回退到系统自带的 SAPI 语音。'
