url: https://github.com/keminoco-beep/dsh-session-delete
name: keminoco-beep/dsh-session-delete
category: session
description:
  en: 'Delete DSH conversations and workspace folders from context menus, including live sessions, without restarting DSH. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '从右键菜单彻底删除 DSH 会话和工作区文件夹；运行中的会话无需重启 DSH 即可删除。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
