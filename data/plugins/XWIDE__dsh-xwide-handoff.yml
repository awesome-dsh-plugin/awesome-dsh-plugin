url: https://github.com/XWIDE/dsh-xwide-handoff
name: XWIDE/dsh-xwide-handoff
category: session
description:
  en: 'Generates a structured handoff card so a near-full conversation continues in a fresh zero-context session: /handoff writes the card, numbers the new title per conversation line, pins it to the top of the sidebar, prepares the new session once the context nears its threshold, and can run /handoff automatically at a configurable threshold (50-95 percent, default 90).'
  zh: '用 /handoff 生成交接卡，让快满的对话在全新零上下文会话里接着跑：标题按会话线自动编号、卡片在侧栏置顶、接近阈值时自动备好新会话，也能按可配置阈值（50-95%，默认 90%）自动执行 /handoff。'