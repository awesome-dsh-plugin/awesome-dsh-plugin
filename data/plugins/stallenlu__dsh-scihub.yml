name: stallenlu/dsh-scihub
category: tools
tarball: https://github.com/stallenlu/dsh-scihub/releases/download/v0.6.1/dsh-scihub-0.6.1.tgz
description:
  en: 'Adds eighteen tools: scihub_pdf / scihub_batch fetch papers by DOI or article URL from Sci-Hub; libgen_search / libgen_download search Library Genesis by keyword and fetch a file by MD5 keeping its real extension (pdf / epub / djvu); nine zlib_* tools give native Z-Library EAPI access (status / search / get_book / download / profile / saved / history / check_domains / delete_history) with credentials read only from environment variables; four zlib_meta_* tools read, look up (Open Library / Google Books), preview and atomically commit EPUB/PDF metadata. Files get human-readable names via a configurable fileNameTemplate and atomic no-overwrite writes. All requests support an HTTP/HTTPS CONNECT proxy. Batches run with bounded parallelism, skip dead mirrors, and reject truncated or verification-wall responses; scihub_refresh_mirrors self-heals the mirror list. EAPI protocol based on heartleo/zlib (MIT); UNOFFICIAL, not affiliated with or endorsed by Z-Library.'
  zh: '为 DSH 注册十八个工具：scihub_pdf / scihub_batch 按 DOI 或文章 URL 经 Sci-Hub 镜像下载论文；libgen_search / libgen_download 用关键词检索 Library Genesis 并按 MD5 下载，保留 pdf / epub / djvu 等真实扩展名；九个 zlib_* 工具原生访问 Z-Library EAPI（status / search / get_book / download / profile / saved / history / check_domains / delete_history），凭据只从环境变量读取；四个 zlib_meta_* 工具读取、查源（Open Library / Google Books）、预览并原子写入 EPUB/PDF 内嵌元数据。文件按可配置的 fileNameTemplate 生成人类可读名，原子写入、同名不覆盖。所有请求支持 HTTP/HTTPS CONNECT 代理。批量有界并发、跳过死镜像、拒绝截断文件与人机验证页；scihub_refresh_mirrors 重测候选镜像并写回可用项实现自愈。EAPI 协议参考 heartleo/zlib（MIT）；非官方实现，与 Z-Library 无隶属或背书关系。'
