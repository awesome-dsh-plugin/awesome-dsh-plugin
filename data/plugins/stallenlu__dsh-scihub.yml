name: stallenlu/dsh-scihub
category: tools
tarball: https://github.com/stallenlu/dsh-scihub/releases/download/v0.5.2/dsh-scihub-0.5.2.tgz
description:
  en: 'Adds four tools: scihub_pdf / scihub_batch fetch papers by DOI or article URL from Sci-Hub, reporting per-DOI status honestly; libgen_search / libgen_download search Library Genesis by keyword and fetch a file by MD5, keeping its real extension (pdf / epub / djvu). Files are named from citation metadata via a configurable fileNameTemplate and written atomically without overwriting. All requests support an HTTP/HTTPS CONNECT proxy (config.proxy or env vars, with NO_PROXY). Batches run with bounded parallelism, skip dead mirrors, and reject truncated or verification-wall responses.'
  zh: '为 DSH 注册四个工具：scihub_pdf / scihub_batch 按 DOI 或文章 URL 经 Sci-Hub 镜像下载论文并逐条如实返回状态；libgen_search / libgen_download 用关键词检索 Library Genesis 并按 MD5 下载，保留 pdf / epub / djvu 等真实扩展名。文件按引用元数据经可配置的 fileNameTemplate 生成人类可读名，原子写入、同名不覆盖。所有请求支持 HTTP/HTTPS CONNECT 代理（config.proxy 或环境变量，尊重 NO_PROXY）。批量有界并发、跳过死镜像，并拒绝截断文件与人机验证页。'
