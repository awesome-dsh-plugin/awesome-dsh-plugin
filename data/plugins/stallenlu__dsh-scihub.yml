name: stallenlu/dsh-scihub
category: tools
tarball: https://github.com/stallenlu/dsh-scihub/releases/download/v0.6.0/dsh-scihub-0.6.0.tgz
description:
  en: 'Adds 14 tools across Sci-Hub, LibGen and Z-Library. scihub_pdf / scihub_batch fetch papers by DOI or article URL; libgen_search / libgen_download search by keyword and fetch by MD5 keeping the real extension (pdf / epub / djvu); nine zlib_* tools (status/search/get_book/download/profile/saved/history/check_domains/delete_history) use native Z-Library EAPI with credentials read only from environment variables. Files are named from metadata via fileNameTemplate and written atomically without overwriting. Supports an HTTP/HTTPS CONNECT proxy, bounded-parallel batches, dead-mirror skipping, self-healing mirror refresh, and rejects truncated or verification-wall responses. Z-Library support is based on heartleo/zlib (MIT): an unofficial, unaffiliated implementation.'
  zh: '提供覆盖 Sci-Hub、LibGen 与 Z-Library 的 14 个工具：scihub_pdf / scihub_batch 按 DOI 或文章 URL 抓取论文；libgen_search / libgen_download 用关键词检索并按 MD5 下载、保留 pdf / epub / djvu 等真实扩展名；九个 zlib_* 工具（status/search/get_book/download/profile/saved/history/check_domains/delete_history）以原生 Z-Library EAPI 实现，凭据仅从环境变量读取。文件按元数据经 fileNameTemplate 生成人类可读名，原子写入、同名不覆盖；支持 HTTP/HTTPS CONNECT 代理、批量有界并发、跳过死镜像、镜像自愈，并拒绝截断文件与人机验证页。Z-Library 能力基于 heartleo/zlib（MIT），为非官方、无隶属关系的实现。'
