url: https://github.com/SivanCola/dsh-note
name: SivanCola/dsh-note
category: ui
description:
  en: 'Local-first Markdown notebook: a two-pane layout (folder tree or list, plus editor) with the view menu in the list header, split live preview, tags, stars and pins, a vault-wide todo centre that writes ticks back to the file, full-text search, a workspace-scoped notes tab in the right sidebar, session-to-note deposit, insert a note into a conversation, save an answer as a note, links back to the originating answer, vault-directory and text-size settings, and four note_* tools. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '本地 Markdown 笔记库：两栏布局（目录树或列表 + 编辑器，视图菜单收在列表头）、分栏实时预览、标签、收藏与置顶、聚合全库复选框并回写文件的待办中心、全文搜索、右侧栏工作区笔记、会话沉淀成笔记、把笔记插入对话、把回答保存为笔记、跳回来源回答的链接、笔记库目录与字号设置，以及四个 note_* 工具。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
