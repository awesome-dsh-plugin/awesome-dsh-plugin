url: https://github.com/Lee2277-t/dsh-font-subset
name: Lee2277-t/dsh-font-subset
category: tools
description:
  en: Cut a font down to the characters a page actually uses, and report the characters the font lacks. A 9 MB Chinese font becomes 2.5 KB for a small page; missing glyphs are surfaced before they turn into tofu boxes after the cut.
  zh: 按实际用到的字裁剪字体，并报告字体里缺哪些字。9 MB 的中文字体对一个小页面只要 2.5 KB；缺字在裁剪之后变成豆腐块之前就被指出来。
icon: https://raw.githubusercontent.com/Lee2277-t/dsh-font-subset/main/assets/icon-180.png