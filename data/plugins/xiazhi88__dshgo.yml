url: https://github.com/xiazhi88/dshgo
name: xiazhi88/dshgo
category: remote
description:
  en: 'Exposes the loopback-only dsh web on a LAN port so other devices can reach it, with an optional access password that browsers type in and the Android app unlocks with biometrics. Adds a LAN-access settings page with QR codes, and inlines dsh-web-mobile (MIT, attribution kept) for the mobile layout. The same repository ships an Android client.'
  zh: '把只监听 127.0.0.1 的 dsh web 转发到局域网端口，供其他设备访问；可选访问密码——浏览器输入，Android App 用指纹或面部解锁。新增带二维码的「局域网访问」设置页，并内联 dsh-web-mobile（MIT，保留署名）提供移动端布局。同一仓库还带一个 Android 客户端。'
