description:
  en: 'Editable prompt shortcuts beside the DSH composer: save the prompts and phrases you retype as buttons, then send the preset text or insert it into the draft, and reorder, move, or resize them. Text-only: runs no host commands and never overwrites an existing draft; a button can also read the previous message, the draft, or the selection when clicked, and ask you to fill in {{name}} slots before it runs.'
  zh: 'DSH 输入框旁的可编辑提示词快捷按钮：把反复重打的提示词、常用语存成按钮，点一下发送预设文字或只填入草稿；可排序、换位置、调大小。纯文字动作，不执行宿主命令；有草稿时不覆盖；按钮还能在点击时现读上一条消息、当前草稿或选区，带 {{名字}} 的会先让你填再执行。'
