url: https://github.com/chenjrastro-tech/github-release-download-acceleration
name: chenjrastro-tech/github-release-download-acceleration
category: skill
description:
  en: 'Windows PowerShell 5.1 skill for downloading large GitHub release assets: it first read-only probes the host (listening local proxy ports, system proxy and env vars, an installed Clash Verge core and its config, curl version), measures KB/s of four routes in parallel (existing proxy, headless-spawned core, public mirrors, direct), runs a short time-boxed concurrency ladder on the winner, then downloads the asset in parallel curl byte ranges and verifies the byte count plus SHA256 against the release digest. Skips the ladder when the asset is under 100 MB or a single connection already reaches 3 MB/s, because concurrency only pays off when a single connection is throttled: measured 6.3x on a throttled node (1,234 to 7,759 KB/s) but 0.72x on a fast one (5,829 vs 4,175 KB/s). Needs no aria2 or 7z, never changes the system proxy, never asks the user for ports or concurrency, reports ASSET_NOT_FOUND with the real candidate names instead of silently picking a different file, and degrades to a size-only check with DOWNLOAD_SIZE_OK_NO_DIGEST when a release predates digests.'
  zh: '在 Windows PowerShell 5.1 上下载 GitHub Release 大资产的技能：先只读自检宿主环境（在监听的本地代理端口、系统代理与环境变量、已安装的 Clash Verge 内核及其配置、curl 版本），四条路线（现有代理 / 无头拉起内核 / 公共镜像 / 直连）并行实测 KB/s，在胜出路线上做限时并发阶梯，再用 curl 多段 range 并发下载，并按 release 的 digest 校验字节数与 SHA256。资产小于 100 MB 或单连接已到 3 MB/s 时直接跳过阶梯——并发只在「单连接被限速」时才有收益：实测限速节点 6.3×（1,234 → 7,759 KB/s），节点不限速时反而是 0.72×（单流 5,829 vs 16 段 4,175 KB/s）。不要求预装 aria2/7z，不改系统代理，不向用户索要端口或并发数；资产名对不上会报 ASSET_NOT_FOUND 并列出真实候选，绝不静默换文件；老 release 没有 digest 时降级为 DOWNLOAD_SIZE_OK_NO_DIGEST。'
