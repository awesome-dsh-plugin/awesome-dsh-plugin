url: https://github.com/daoyan2142/dsh-plugin-git-sync
name: daoyan2142/dsh-plugin-git-sync
category: dev                     # Development & Runtime

description:
  en: 'Packs the third-party plugins installed in a DSH profile into tarballs and pushes them to a GitHub or Gitee repository; another machine pulls the manifest, compares versions and installs only what is missing or out of date. Needs a personal access token with write access to that repository (kept in the DSH credentials service); the tarballs contain each plugin''s installed source, so use a private repository.'
  zh: '把 DSH 配置档里已安装的第三方插件连同源码打包成 tarball 推送到 GitHub 或 Gitee 仓库；另一台电脑拉取清单、比对版本，只安装缺失或过期的插件。需要对该仓库有写权限的个人访问令牌（存于 DSH 凭据服务）；压缩包含各插件已安装的源码，建议使用私有仓库。'

# Storefront tile: a GitHub-hosted raster image, drawn at ~96 px.
icon: https://raw.githubusercontent.com/daoyan2142/dsh-plugin-git-sync/main/assets/icon.png

