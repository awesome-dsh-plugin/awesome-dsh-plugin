url: https://github.com/windrover/dsh-prompt-optimizer
name: windrover/dsh-prompt-optimizer
category: ui
description:
  en: 'A prompt optimizer for the conversation input tool row: pick a category (Basic / Context / Image) and a template, then the optimize button rewrites the draft in place, with cancel, elapsed time, token usage and one-click undo. Ships 15 templates — task-instruction rewriting with hard result-side constraints, step planning, safety-research framing for reverse-engineering requests, system-prompt role cards, and text-to-image / image-to-image prompt rewriting. Context templates read the last turns of the current session for coreference resolution. The host half registers two loopback-only routes and calls the harness model service instead of any API directly; a settings section exposes nine fields (provider and model override, reasoning effort, temperature, output-token cap, timeout, input-length and context budgets). Output guards check that user-written constraints survive and that no new method-side constraints are invented, and warn rather than auto-retry. Adapted for dsh 0.2.0-rc.2.'
  zh: '给对话输入框工具行加一个提示词优化器：选类别（基础 / 上下文 / 图像）与模板，点优化按钮即原地改写草稿——可取消、显示耗时与 token 用量、支持一键还原。内置 15 个模板：带硬约束的任务指令改写、需求步骤化规划、逆向/安全研究语境改写、系统提示词角色卡、文生图与图生图提示词改写。上下文类模板会读取当前会话最近若干轮对话用于消歧。宿主半身注册两个仅限本机回环的路由，并通过宿主模型服务调用，不直连任何 API；设置分区提供九项配置（提供方与模型覆盖、推理强度、温度、输出 token 上限、超时、输入长度与上下文预算）。输出守卫会检查用户明写的约束是否保留、以及是否凭空多出方法侧约束，只告警不自动重试。适配 dsh 0.2.0-rc.2。'
