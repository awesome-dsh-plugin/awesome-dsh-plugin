url: https://github.com/windrover/dsh-prompt-optimizer
name: windrover/dsh-prompt-optimizer
category: ui
description:
  en: 'A prompt optimizer in the composer input tool row: pick a category and a template, then ✨ rewrites the draft in place with one-click undo. Pick from the Basic, Context and Image categories; you can cancel a run, and it shows elapsed time and token usage. Ships 15 templates covering task-instruction rewriting, step planning, safety-research framing, system-prompt role cards, and text-to-image / image-to-image prompts; context templates read the recent turns of the session for coreference resolution. Calls go through the host model service, and a settings section exposes the model and the budgets. Output guards check that user-written constraints survive, warning rather than auto-retrying. Adapted for dsh 0.1.7 and 0.2.'
  zh: '给对话输入框工具行加一个提示词优化器：选类别（基础 / 上下文 / 图像）与模板，点 ✨ 即原地改写草稿，支持一键还原。可取消，并显示耗时与 token 用量。内置 15 个模板，覆盖任务指令改写、需求步骤化规划、逆向/安全研究语境与系统提示词角色卡，以及文生图与图生图提示词。上下文类模板会读取当前会话最近几轮用于消歧。调用走宿主模型服务，设置分区可调模型与各项预算；输出守卫会核对用户明写的约束是否保留，只告警不自动重试。适配 dsh 0.1.7 与 0.2 系列。'
