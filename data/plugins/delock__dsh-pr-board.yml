url: https://github.com/delock/dsh-pr-board
name: delock/dsh-pr-board
category: git
description:
  en: 'Maintainer and developer PR board for the DSH sidebar: a five-state review queue (waiting on me / waiting on author / ready to merge / merged / inbox), a three-column issue board, and a global view of the PRs you authored (my move / waiting on others / merged), with CI rollup badges, an inactivity filter, and one click per card to open or start the matching review conversation.'
  zh: 'DSH 侧边栏的维护者 + 开发者 PR 看板：五状态评审队列（等我 / 等作者 / 可合并 / 已合并 / 待分诊）、三列 issue 看板、跨仓库跟踪自己 PR 的 mine 视图（我的回合 / 等别人 / 已合并），附 CI 汇总徽章与不活跃过滤，点卡片一键打开或新建对应的评审会话。'
