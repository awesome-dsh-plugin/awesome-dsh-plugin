url: https://github.com/godchen520/dsh-web-search-bing
name: godchen520/dsh-web-search-bing
category: browser
description:
  en: 'Bing-backed web search provider for the built-in web_search tool: prefers Bing''s RSS feed with the public cn.bing.com HTML page as fallback, no API key, reachable from mainland China, and keeps searches off the model''s own search quota. Endpoint, result count and result language configurable; targets DSH 0.2.x (also works on 0.1.7+).'
  zh: 为内置 web_search 工具提供 Bing 搜索源：优先解析 Bing 的 RSS 输出，以 cn.bing.com 公开 HTML 结果页作为兜底，无需 API Key，国内可直连，搜索不再消耗模型自带的搜索额度。端点、结果数量与结果语言可配置；适配 DSH 0.2.x（0.1.7+ 亦可用）。
