description:
  en: 'Actively maintained fork of dsh-memory-evolve (upstream last pushed 2026-10-29): cross-session long-term memory plus background self-evolution for DeepSeek Harness — five-track memory (memory, user, key, project, daily), git-branch awareness, in-turn self-review, skill self-evolution and skill manager, four-track to-dos, COI scheduling, session broadcast, session search, prompt manager and scratch notes. Pure plugin, zero core modifications, zero runtime dependencies. On top of upstream 44b6b3e it adds Windows fixes (git child-process tree cleanup, canvas private-key path blocking, hidden consoles), a repeatable test suite with CI on Windows and Linux, and 15 merged upstream community pull requests with their authors credited. Its HTTP routes are not admitted through the DSH built-in access layer, so they are guarded by the plugin itself since v0.5.0: same-origin check, JSON-only writes, DNS-rebinding guard, loopback-only default. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '活跃维护中的 dsh-memory-evolve 分支（上游最后提交于 2026-10-29）：为 DeepSeek Harness 带来「跨会话长期记忆 + 后台自我进化」——五轨记忆（memory / user / key / project / daily）· git 分支感知 · 回合内自我审查 · 技能自我进化与技能管理器 · 四轨待办 · COI 调度 · 会话广播 · 会话搜索 · 提示词管理器 · 临时信息便签。纯插件实现、零核心修改、零运行时依赖。在上游基础上补齐 Windows 修复（git 子进程树清理、画板私钥路径拦截、隐藏控制台）、可重复测试与 Windows/Linux 双平台 CI，并合并了 15 个上游社区 PR（提交里保留原作者署名）。它的 HTTP 路由未走 DSH 内置的准入层，因此自 v0.5.0 起由插件自带同源守卫：同源校验、仅接受 JSON、DNS rebinding 防护、默认只允许本机回环。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
