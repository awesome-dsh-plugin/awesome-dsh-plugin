url: https://github.com/gosutry/dsh-persona-select/tree/main/packages/dsh-persona-select
name: gosutry/dsh-persona-select#dsh-persona-select
category: identity
description:
  en: Injects the persona text into the system prompt and the history conversation into the context, with a settings manager and a persona picker in the conversation view. "Make it pure chat" sends only the conversation to the model, blocking the DSH host's other non-conversation token injections and keeping only this plugin's injections when the feature is on and a persona is selected.
  zh: 把人设正文注入系统提示词、把历史对话注入上下文，带设置页与对话页人设选择器。“一键为纯聊天”功能实现仅与模型输入对话，屏蔽 DSH 宿主侧的其它非对话 token 注入，功能开启并选择人设时，仅保留本插件注入。
