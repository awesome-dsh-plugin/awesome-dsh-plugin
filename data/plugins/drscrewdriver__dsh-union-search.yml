url: https://github.com/drscrewdriver/dsh-union-search
name: drscrewdriver/dsh-union-search
category: browser
description:
  en: 'Union web search for DSH (consolidated successor of community dsh-free-search): 28 engines across three tiers — keyless free (Bing/DuckDuckGo/AnySearch/SearXNG multi-instance union, plus Exa/Tavily/Keenable/Firecrawl/Parallel keyless modes), paid-with-key (Zhihu/Perplexity/Serply/DeepSeek official/You.com/Baidu/Kimi/Aliyun/Doubao/Zhipu/Bocha/Metaso), and model built-in search (OpenAI/Gemini/Claude/Grok, explicit opt-in only) — with auto smart routing, per-engine enable/disable & fallback priority, parallel top-3 merge, multi_search, failure-aware fallback, a toggle to block the system built-in search, time filtering, platform search, web_fetch and a web settings UI. Experimental free advance_fetch: whole-page GFM-Markdown or CSS-selector/fields structured extraction with no API key and no per-call billing; fetch identity configurable (custom User-Agent, Referer, per-domain cookies attached only on domain match, never leaked across cross-domain redirects). Hosts 0.1.0-rc.2 through 0.2.1-rc.2 (17-tag exact engines.dsh enum; the rc.2 search-provider takeover goes through volatile config pinning after capability probing, never version branches). Paid engines need your own API keys (optional; free engines work keyless). npm: @drscrewdriver/dsh-union-search and bare dsh-union-search.'
  zh: DSH 的联合联网搜索（社区 dsh-free-search 的整合后继）：28 个引擎分三档——免 key 免费（Bing/DuckDuckGo/AnySearch/SearXNG 多实例联合，Exa/Tavily/Keenable/Firecrawl/Parallel 免 key 模式）、凭 key 付费（知乎/Perplexity/Serply/DeepSeek 官方/You.com/百度/Kimi/阿里云/豆包/智谱/博查/Metaso）、模型内置搜索（OpenAI/Gemini/Claude/Grok，仅显式勾选）——配自动智能路由、逐引擎开关与回退优先级、并行 top-3 融合、multi_search 跨源工具、失败感知回退、屏蔽系统内置搜索开关、时间过滤、平台搜索、web_fetch 与网页设置界面。实验性·免费 advance_fetch：整页 GFM-Markdown 或 CSS 选择器/字段结构化抽取，零 key 零按次计费；抓取身份可配（自定义 UA、Referer、按域 cookie——仅在域名匹配时附带、跨域重定向绝不外流）。宿主 0.1.0-rc.2→0.2.1-rc.2 共 17 个 rc 精确枚举（rc.2 的搜索接管经能力探测后走 volatile 配置钉选，禁版本号分支）。付费引擎需自备 API key（可选，免费引擎开箱即用）。npm：@drscrewdriver/dsh-union-search 与裸名 dsh-union-search 双发。
