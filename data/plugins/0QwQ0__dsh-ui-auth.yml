description:
  en: 'Authentication gate for the DeepSeek Harness Web UI: login covers pages, /api, /plugins and WebSocket upgrades; PBKDF2 password hashing, HttpOnly SameSite session cookies, IP-based login lockout, a user-management settings panel (users edit their own profile, admins add or remove users and reset passwords), admin-only model and API-key configuration guards, per-user isolation on the REST and list APIs (WebSocket event streams are not filtered per user — see the README''s known-limits section before exposing this publicly), and a fail-closed gateway.'
  zh: 'DeepSeek Harness Web UI 认证网关：登录门禁覆盖页面、/api、/plugins 与 WebSocket 升级；PBKDF2 口令哈希、HttpOnly SameSite 会话 Cookie、按源 IP 登录锁定；设置面板内置用户管理（普通用户仅可修改本人资料与密码，管理员可新增/删除用户、重置密码、调整角色）；模型配置与 API Key 仅管理员可修改；REST 与列表接口按用户隔离（WebSocket 事件流不按用户过滤——公网部署前请阅读 README 的已知边界章节）；存储故障时保持 fail-closed。'
