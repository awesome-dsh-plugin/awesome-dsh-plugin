name: zjukop3/dsh-verify-kit
category: tools
description:
  en: 'Five deterministic checks for deliverables an agent produced and a person is about to accept: hash manifests, citation numbering, document shape, table integrity, and number consistency. Each is one CLI verb with exit codes a pipeline can gate on.'
  zh: 'Agent 已经产出结果、人准备验收前的五个确定性检查：文件哈希清单、引用编号、文档结构、表格行列、数字写法。每个都是单个命令，出口码可接 CI，离线可跑。'
icon: https://raw.githubusercontent.com/zjukop3/dsh-verify-kit/main/assets/icon-180.png
