name: lyp88997/dsh-browser-service
category: browser
tarball: https://github.com/lyp88997/dsh-browser-service/releases/latest/download/dsh-browser-service.tgz
description:
  en: 'Adds the full browser tool surface to DSH (the 33 browser_* tools) by wiring the ctx.browser seam to a self-hosted headless Chromium over CDP: a single-instance daemon bound to 127.0.0.1 with Bearer-token auth, a request-path whitelist and WebSocket-endpoint rewriting, for hosts with no GUI libraries, no Electron and no root.'
  zh: '为 DSH 挂出完整的浏览器工具面（33 个 browser_* 工具）：把 ctx.browser 接缝接到自管的 headless Chromium（经 127.0.0.1 上的单例 CDP 守护进程，带 Bearer token 鉴权、请求路径白名单与 WebSocket 地址改写），适合没有 GUI 库、没有 Electron、没有 root 的机器。'
