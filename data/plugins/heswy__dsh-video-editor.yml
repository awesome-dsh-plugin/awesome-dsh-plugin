url: https://github.com/heswy/dsh-video-editor
name: heswy/dsh-video-editor
category: tools
description:
  en: AI video creation and editing inside DeepSeek Harness, with conversation-driven revisions, multitrack timelines, audio waveforms, and MP4 export. Requires Node 22, FFmpeg and Chrome; audio generation calls a Qianwen MaaS endpoint only after you add an API key.
  zh: 在 DeepSeek Harness 内通过对话生成与续改视频，支持多轨剪辑、音频波形和 MP4 导出。需要 Node 22、FFmpeg 与 Chrome；音频生成只有在你填入 API key 后才会调用千问 MaaS 接口。
