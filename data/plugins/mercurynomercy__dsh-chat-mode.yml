url: https://github.com/mercurynomercy/dsh-chat-mode
name: mercurynomercy/dsh-chat-mode
category: ui
description:
  en: Adds a Chat entry to the DSH sidebar for project-free chats that use DSH's own sign-in and models, limited to web search, images and files dragged into the chat.
  zh: 在 DSH 侧栏加一个「聊天」入口，不用选项目，直接用 DSH 自己的登录和模型聊天，模型只能联网搜索、看图和读拖进来的附件。
