  en: 'Lets the agent drive the Chrome tab you @-mention — 12 tools for tabs, snapshots, clicking, typing, keys, scrolling, dragging and screenshots, with input sent as real CDP events so pages see isTrusted true and a pointer drawn inside the page.'
  zh: '用 @ 提及真实 Chrome 标签页直接读写——12 个工具覆盖标签页、快照、点击、输入、按键、滚动、拖拽与截图；输入以真实 CDP 事件投递，页面看到的 isTrusted 为真，并在页面内画出指针。'
