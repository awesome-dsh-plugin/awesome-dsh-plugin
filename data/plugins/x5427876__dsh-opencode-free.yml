description:
  en: "Free OpenCode Zen models in DeepSeek Harness, anonymous by default with an optional Zen key. The catalogue is read from Zen's official model list at runtime, and anonymous requests are adapted to the free tier's request checks, documented with dated measurements."
  zh: "在 DeepSeek Harness 中使用免费的 OpenCode Zen 模型：默认匿名，可选填 Zen key；模型表在运行时从 Zen 官方列表读取，匿名请求会按免费档校验做适配，并有带日期的实测记录。"
