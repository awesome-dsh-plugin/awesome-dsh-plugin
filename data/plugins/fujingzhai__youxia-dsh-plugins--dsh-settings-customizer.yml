description:
  en: "Overrides the order, names and icons of DeepSeek Harness settings navigation entries from a personal profile configuration, without patching other plugins. Shipped defaults contain no rules, so the interface is unchanged until configured."
  zh: "用个人配置覆盖 DeepSeek Harness 设置导航的顺序、名称与图标，不修改其他插件源码；公共默认不含任何规则，未配置时界面不变。"
