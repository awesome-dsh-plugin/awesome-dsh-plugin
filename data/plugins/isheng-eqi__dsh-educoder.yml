url: https://github.com/isheng-eqi/dsh-educoder
name: isheng-eqi/dsh-educoder
category: tools
description:
  en: 'Finishes 头歌 (EduCoder) homework over the platform JSON API, with no browser automation. educoder_sweep scans every course for homeworks that still have unfinished challenges — complete homeworks are skipped without reading a single challenge, so a full-account scan costs no model tokens — and can finish them; multiple-choice challenges also cost no model tokens, because the platform returns the answer key in any submission response, while code challenges are generated by the model, uploaded with evaluate:0 and graded once per challenge, then retried using the error report the platform returns. Three tools: educoder_sweep, educoder_homework, educoder_account.'
  zh: '走头歌（EduCoder）平台 JSON API 完成作业，无浏览器自动化。educoder_sweep 扫描所有课程中仍有未通过关卡的作业——已完成的作业直接跳过、一个关卡都不读，因此全量扫描不消耗模型 token——并可一次做完；选择题同样零 token，因为平台会在任意一次提交的响应里回吐标准答案；代码题由模型生成，以 evaluate:0 上传后每关只触发一次评测，再按平台返回的报错重试。三个工具：educoder_sweep、educoder_homework、educoder_account。'
