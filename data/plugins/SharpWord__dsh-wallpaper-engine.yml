url: https://github.com/SharpWord/dsh-wallpaper-engine
name: SharpWord/dsh-wallpaper-engine
category: theme
description:
  en: Windows only, needs Wallpaper Engine installed. Puts Wallpaper Engine wallpapers behind the Harness window, following the active one or a pinned pick, with translucent panels, per-block blur and wallpaper-matched text contrast.
  zh: 仅 Windows，需先装 Wallpaper Engine。把 Wallpaper Engine 壁纸放到 Harness 窗口背后，可跟随当前壁纸或从壁纸库固定一张，面板半透明、分块模糊、字色自动跟随壁纸。
