description:
  en: Floating card showing your real position P&L (今日盈亏), Shanghai Composite Index, and intraday chart, auto-synced from the Tonghuashun investment-ledger — no manual watchlist setup.
  zh: 悬浮卡片，自动同步同花顺投资账本的真实持仓盈亏，显示今日盈亏、上证指数和当日走势图，无需手动添加股票。
  ja: 実際の持ち高の損益（今日盈亏）、上海総合指数、日中チャートを表示するフローティングカード。同花順の取引台帳から自動同期するため、ウォッチリストの手入力は不要です。
