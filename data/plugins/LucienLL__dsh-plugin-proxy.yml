description:
  en: "Global proxy for DeepSeek Harness: route agent tools, model requests and web fetches through the Windows system proxy or a custom address with one persistent toggle, an editable settings card, and agent-visible proxy status."
  zh: "DeepSeek Harness 全局代理插件：通过 Windows 系统代理或自定义地址统一代理模型请求与工具流量，主界面常驻开关，且 Agent 在对话中实时感知代理状态。"
