url: https://github.com/Jessicaisleep/dsh-wm-toolkit
name: Jessicaisleep/dsh-wm-toolkit
category: session
description:
  en: 'Session and message surgery in one plugin: recall or edit prompts and replies (reasoning included), regenerate from the original prompt, delete any turn at the model-context level, and archive, delete, move or migrate sessions across workspaces. Targets DSH 0.1.5 and 0.2.x, verified on 0.2.1-rc.3. A combined fork of three MIT plugins (dsh-message-recall from Jipcon/DSH-plugins, dsh-session-manager from hkkz9522, dsh-delete-turn from DDDMUC) with added reply editing, regeneration and workspace migration. Do not enable it together with those plugins or other session movers or message deleters.'
  zh: '一个插件做会话与消息手术：撤回或编辑指令/回复（连思考过程一起改）、用原提问重新生成、按模型上下文级删除任意一条，以及会话归档、删除、跨工作区移动与工作区迁移。面向 DSH 0.1.5 / 0.2.x，已在 0.2.1-rc.3 实测。由三个 MIT 插件分叉合并而成（Jipcon/DSH-plugins 的 dsh-message-recall、hkkz9522 的 dsh-session-manager、DDDMUC 的 dsh-delete-turn），新增编辑回复、重新生成与工作区迁移。不要与这些插件或其它会话移动、消息删除类插件同时启用。'
