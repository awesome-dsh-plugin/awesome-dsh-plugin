description:
  en: 'Use your local WallpaperMachine library as the DeepSeek Harness background on macOS, with live Scene wallpapers rendered by WebWallGL and Video or Image wallpapers played directly behind the chat. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把 macOS 上 WallpaperMachine 的壁纸库接入 DeepSeek Harness：场景壁纸由 WebWallGL 实时渲染，视频与图片直接作为聊天背景播放。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
