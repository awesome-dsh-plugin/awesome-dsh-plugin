url: https://github.com/tedcriss/dsh-matlab
name: tedcriss/dsh-matlab
category: tools
description:
  en: 'Adds the MathWorks MATLAB Agentic Toolkit skills and the MATLAB MCP Server tools to DeepSeek Harness. Needs a local MATLAB R2021a or later. By default (autoProvision) it downloads the MathWorks MCP Server and clones the toolkit on first use, and MathWorks telemetry stays on unless disableTelemetry is set.'
  zh: '把 MathWorks 的 MATLAB Agentic Toolkit 技能与 MATLAB MCP Server 工具接入 DeepSeek Harness。需要本机 MATLAB R2021a 及以上。默认（autoProvision）首次使用时会下载 MathWorks MCP Server 并克隆工具包；除非设置 disableTelemetry，否则 MathWorks 遥测保持开启。'
