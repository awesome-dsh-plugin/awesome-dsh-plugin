name: tangyixiao/dsh-version-manager
category: market
description:
  en: "Inspect plugins and Skills in the running DSH profile, preview updates, record verifiable snapshots and offer recovery only when replay evidence is available. Version 0.1.8 provides a scrollable inventory, previewed batch npm updates and explicit migration of verified local archives to npm. Requires Node 22+ and DSH 0.2.2-rc.1 or a later declared-compatible host. Restoring a plugin version does not restore configuration, its complete dependency tree or agent presets. Its HTTP routes first require the synchronous connection.requestRejection Host/Origin policy, then connection.admit owner admission; missing, throwing, malformed or asynchronous checks fail closed. Version 0.1.9 has been verified with DSH 0.2.2-rc.5."
  zh: "在运行中的 DSH profile 中查看插件与 Skill，预览更新、记录可核验快照，并仅在具备回放证据时提供恢复。0.1.8 支持列表滚动、批量 npm 更新预览，以及核验本地包后显式迁移到 npm。需 Node 22+ 与 DSH 0.2.2-rc.1 或声明兼容的后续宿主；恢复插件版本不等于恢复配置、完整依赖树或 agent 预设。HTTP 路由先执行同步 connection.requestRejection 宿主请求策略，再经 connection.admit 验证 owner；检查缺失、抛错、畸形或异步返回时均拒绝访问。 0.1.9 已在 DSH 0.2.2-rc.5 验证。"
