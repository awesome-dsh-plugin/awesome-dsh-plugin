  en: 'Trading workbench for DeepSeek Harness: an AI decision chain with a per-day round archive, Demo execution and risk views, backed by a local Python trading service that bootstraps itself on first run. GitHub v0.1.1+ checks every HTTP route through DSH request admission; npm 0.1.0 does not include this fix.'
