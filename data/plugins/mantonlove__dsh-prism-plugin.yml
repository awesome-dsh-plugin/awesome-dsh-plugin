description:
  en: 'DSH Background adds custom photo or GIF wallpapers to the DSH Web interface, lets you choose which images join the carousel and drag to reorder them, and tunes glass, typography, accent colors, aurora, six presets, and portable themes. Needs DSH 0.2.2-rc.1 or later.'
