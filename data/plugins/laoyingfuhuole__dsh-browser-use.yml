description:
  en: 'Background browser automation for DSH: one Electron host gives each conversation its own window, with shared login state, CDP input, snapshot refs and no focus stealing.'
  zh: '面向 DSH 的后台浏览器自动化插件：一个 Electron host 为每个对话分配独立窗口，共享登录状态，支持 CDP 输入与快照 ref，不抢焦点。'
