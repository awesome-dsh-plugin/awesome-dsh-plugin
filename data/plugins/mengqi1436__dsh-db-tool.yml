url: https://github.com/mengqi1436/dsh-db-tool
name: mengqi1436/dsh-db-tool
category: tools
description:
  en: "Chat-operated multi-database admin plugin for DeepSeek Harness: query and manage MySQL, PostgreSQL, GaussDB, MongoDB, Redis, Oracle, DM and SQLite from the conversation with project-scoped ro/rw grants, a sidebar management panel, schema browsing and data preview, and confirmation-gated dangerous operations."
  zh: "DeepSeek Harness 社区插件：在对话中直接管理多数据库（MySQL、PostgreSQL、GaussDB、MongoDB、Redis、Oracle、达梦、SQLite），支持项目级 ro/rw 授权、侧边栏管理面板、结构浏览与数据预览，危险操作需确认后执行。"
