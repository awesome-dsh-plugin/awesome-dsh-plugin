url: https://github.com/magicbaobaoli/c-disk-cleaner
name: magicbaobaoli/c-disk-cleaner
category: tools
icon: https://raw.githubusercontent.com/magicbaobaoli/c-disk-cleaner/main/assets/icon-180.png
description:
  en: A draggable trash-can button that stays pinned in the corner of DSH and cleans rebuildable caches (uv, npm, pnpm, pip, DSH logs and thumbnails) on one click, freeing C: space whenever you want; shows red glow while cleaning, turns green with five blinks when done, and keeps cleaning in the background if you close the panel.
  zh: 一个常驻在 DSH 右上角、可拖到任意位置的小垃圾桶按钮，随时一键清掉可安全重建的缓存（uv、npm、pnpm、pip、DSH 日志与缩略图）释放 C 盘空间；清理时按钮亮红光，完成转绿光并闪 5 下，关掉面板也会在后台清完再弹回来告诉你结果。
