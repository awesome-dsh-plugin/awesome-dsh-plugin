url: https://github.com/Lovepeace-art/dsh-android-phone
name: Lovepeace-art/dsh-android-phone
category: tools
description:
  en: "Mirrors a USB-connected Android phone in the DSH sidebar and drives it over scrcpy's control protocol: 12 agent tools for tap/swipe/type/keys, multi-frame scroll-and-stitch long screenshots, and agent-first control that hands over the moment a human touches the phone. Ships its own adb and scrcpy-server. Windows 10/11 only; the live sidebar mirror additionally requires dsh-better-sidebar."
  zh: "在 DSH 侧栏实时显示 USB 连接的安卓手机，并通过 scrcpy 控制协议直接操作手机：12 个 agent 工具（点按/滑动/输入/按键）、多帧滚动拼接的长截图，以及「默认交给 agent、人一碰手机就立刻交出控制权」的控制权模型。自带 adb 与 scrcpy-server。仅 Windows 10/11；侧栏实时镜像还需 dsh-better-sidebar。"