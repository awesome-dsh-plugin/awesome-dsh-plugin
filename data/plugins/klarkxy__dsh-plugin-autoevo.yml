url: https://github.com/klarkxy/dsh-plugin-autoevo
name: klarkxy/dsh-plugin-autoevo
category: tools
description:
  en: 'Search-first capability workflow for DSH agents (v1.0.0): reuse local tools or review exact-source plugins before installation, adapt or create capabilities in managed source work, and use receipts that distinguish installed, loaded, activated, and verified states; version tools cover rollback, adoption, and upstream updates.'
  zh: 'AutoEvo v1.0.0 为 DSH Agent 提供 Search-first 能力工作流：优先复用本地工具或审查精确来源插件后再安装；可在受管源码中改造或新建能力；回执区分 installed、loaded、activated、verified，版本工具支持回滚、领养与上游更新。'
