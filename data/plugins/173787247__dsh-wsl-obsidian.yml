url: https://github.com/173787247/dsh-wsl-obsidian
name: 173787247/dsh-wsl-obsidian
category: wsl
description:
  en: 'Bridges a WSL dsh agent to a Windows Obsidian vault on NTFS: status/list/search/read/write/append, wikilink resolve, write/append require confirm=true, plus obsidian:// open. Keep the vault under /mnt/<drive>/; Linux-disk vaults via \\wsl$ are unreliable.'
  zh: '把 WSL 里的 dsh agent 接到 Windows NTFS 上的 Obsidian vault：status/list/search/read/write/append、wikilink 解析、写操作需 confirm=true，并用 obsidian:// 打开。vault 请放在 /mnt/<盘符>/；Linux 盘经 \\wsl$ 不可靠。'
