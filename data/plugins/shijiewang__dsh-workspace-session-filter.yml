description:
  en: 'Four filter chips on their own row at the foot of the sidebar: running sessions, sessions waiting for your approval, plan review or answer, sessions with something unread (a turn that finished unseen, or newer activity the panel was not opened on), and sessions updated since local midnight. Each chip counts its matches and opens a popover listing them grouped by workspace, where a row opens the session. The row ends with a DeepSeek service status dot (green operational, yellow partial degradation, red open incident, grey when the feed is unreachable) that subscribes to the status Atom feed once a minute with an ETag conditional request and shows the current finding, the last refresh time and the three newest incidents on hover; clicking it opens status.deepseek.com. A separate panel adds an all-sessions chip and a more menu for the last day, three days, week or thirty days.'
  zh: '侧边栏底部独占一行的四个筛选 chip：正在运行、在等你确认（审批、计划审阅、待回答）、有未读内容（跑完没看，或最近有更新但没打开过）、以及本地零点之后有更新的今日会话，各自带当前数量；点开就在上方按工作区分组列出命中会话，点行直接打开。同一行行尾还有一颗 DeepSeek 服务状态灯（绿=正常、黄=部分异常、红=有进行中的故障、灰=取不到），它每分钟带 ETag 条件订阅一次 status.deepseek.com 的 Atom feed，悬浮显示当前结论、状态更新时间与最近三次故障，点击打开状态页。另有完整面板，多一个「全部」chip 和「更多」菜单，可按最近一天、三天、一周、三十天筛选。'
