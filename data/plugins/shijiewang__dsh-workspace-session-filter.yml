description:
  en: 'Four filter chips on their own row at the foot of the sidebar, each carrying its match count beside the label: running sessions, sessions waiting for your approval, plan review or answer, sessions with something unread (a turn that finished unseen, or newer activity the panel was not opened on), and sessions updated since local midnight. A chip opens a popover listing its matches grouped by workspace, and a row opens the session. The row ends with a DeepSeek service status dot (green operational, yellow partial degradation or maintenance, red open incident, grey when the feed is unreachable) that subscribes to the status Atom feed once a minute with an ETag conditional request and shows the current finding, the refresh time and the three newest incidents on hover; clicking it opens status.deepseek.com. A separate panel adds an all-sessions chip, a more menu for the last day, three days, week or thirty days, and a manage mode that searches sessions by title or path, multi-selects them, lists the Markdown digests it wrote to the session-digests folder of the DSH data directory in a resizable, full-screenable right-hand column that previews them in place, and either moves the selected session directories to sessions/.trash or deletes them permanently after writing the digest and asking for a second, explicit confirmation. The session you have open cannot be selected. Every panel row also carries a star (shown on hover, filled once starred) and the panel adds a favourites tab that lists only starred sessions, so a long list can be triaged without adding another chip to the sidebar foot.'
  zh: '侧边栏底部独占一行的四个筛选 chip，命中数量跟在按钮文字后面：正在运行、在等你确认（审批、计划审阅、待回答）、有未读内容（跑完没看，或最近有更新但没打开过）、以及本地零点之后有更新的今日会话。点开就在上方按工作区分组列出命中会话，点行直接打开。同一行行尾还有一颗 DeepSeek 服务状态灯（绿=正常、黄=部分异常或维护中、红=有进行中的故障、灰=取不到），它每分钟带 ETag 条件订阅一次 status.deepseek.com 的 Atom feed，悬浮显示当前结论、状态更新时间与最近三次故障，点击打开状态页。另有完整面板：多一个「全部」chip、「更多」菜单（最近一天、三天、一周、三十天），以及「管理」态——按标题或路径搜索、多选、右侧栏可列出并就地预览已导出的 Markdown 摘要（栏宽可拖动、可全屏），既能先导出摘要再把会话目录移入本地回收站，也能在二次确认后永久删除；当前打开的会话不会被勾选。面板里每行右侧还有一颗星（悬停显形，标星常亮），筛选行的「收藏」标签只列出标星会话，长列表可以靠它归档而不必再往侧栏底部加维度。'
