url: https://github.com/yusufameri/dsh-t3-session-ui
name: yusufameri/dsh-t3-session-ui
category: ui
description:
  en: 'Session-context surfaces ported from T3 Code: a session-row hover card showing machine, git branch, model, agent preset, approval policy and context usage, a status pill covering pending approval, awaiting input, working, error and subagent work, a provider chip, a per-session header strip, a lineage breadcrumb, and a context-window ring whose panel can run compaction.'
  zh: '移植 T3 Code 的会话上下文界面：会话行悬浮卡显示机器、Git 分支、模型、代理预设、审批策略与上下文用量，状态标签覆盖待审批、等待输入、运行中、错误与子代理工作，另有提供方标记、会话头部信息条、血缘面包屑，以及可展开并触发压缩的上下文窗口圆环。'
