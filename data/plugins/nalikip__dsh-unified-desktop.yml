url: https://github.com/nalikip/dsh-unified-desktop
name: nalikip/dsh-unified-desktop
category: tools
description:
  en: 'One MCP tool surface over two Windows desktop-automation backends (dsh-computer-use-win and windows-mcp): merges their 44 tools into 29 by dropping 10 duplicates, 4 dangerous ones (PowerShell, Registry, FileSystem, Process) and 1 tool-management entry, and blocks dangerous calls before forwarding through a reversibility-graded guard.'
  zh: '把 dsh-computer-use-win 与 windows-mcp 两个 Windows 桌面自动化后端合成一个 MCP 工具面：44 个后端工具去重为 29 个（去掉 10 个重复、4 个危险工具 PowerShell/Registry/FileSystem/Process、1 个工具管理入口），并在转发前用按可逆性分级的守卫拦截危险调用。'
