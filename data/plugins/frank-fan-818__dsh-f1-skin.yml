name: frank-fan-818/dsh-f1-skin
category: theme
description:
  en: 'F1 race-control skin: four team themes (Red Bull, Ferrari, McLaren, Mercedes) with broadcast racing-photo backdrops, all 79 DSH design tokens overridden per team in light and dark, a native settings page for team, photo strength, text surface, blur and motion, per-team custom wallpapers, and a master switch that restores the native DSH appearance without uninstalling.'
  zh: 'F1 赛事控制主题：红牛 / 法拉利 / 迈凯伦 / 梅奔四套车队主题配转播赛车摄影背景，按车队覆盖 DSH 全部 79 个设计变量并跟随浅色 / 深色，在原生设置页切换车队并调节背景强度、文字衬底、模糊与动效，支持按车队上传自定义壁纸，另有一个不经卸载即可恢复 DSH 原生外观的总开关。'
