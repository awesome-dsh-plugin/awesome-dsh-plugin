url: https://github.com/Nero0427/dsh-wb-memory
name: Nero0427/dsh-wb-memory
category: memory
description:
  en: Renders WorkBuddy SOUL, USER, MEMORY and topic Markdown files from an existing ~/.workbuddy/user-*-personal directory into the DeepSeek Harness system prompt, with a byte budget and a settings page; the profile's AGENTS.md loader must be disabled first.
  zh: 把 WorkBuddy 的 SOUL / USER / MEMORY / topics（需已有 ~/.workbuddy/user-*-personal 目录）渲染进 DeepSeek Harness 的 system prompt，带字节预算与设置页；需先在 profile 中停用 AGENTS.md 加载器。
