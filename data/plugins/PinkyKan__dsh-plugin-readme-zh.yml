url: https://github.com/PinkyKan/dsh-plugin-readme-zh
name: PinkyKan/dsh-plugin-readme-zh
category: docs
description:
  en: "Translate installed plugins' documentation into Simplified Chinese: README sections are translated with a persistent section-level cache, and an opt-in metaSidecars mode (off by default) writes a locale/zh.json sidecar for each Plugins list row so the list can render Chinese natively."
  zh: "把已安装插件的文档翻译成简体中文：README 按章节翻译并持久缓存；另有默认关闭的可选 metaSidecars 模式，会为每条插件列表行写入 locale/zh.json 侧文件，让列表原生渲染中文。"
