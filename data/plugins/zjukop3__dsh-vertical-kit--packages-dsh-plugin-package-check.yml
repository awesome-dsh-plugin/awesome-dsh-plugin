name: 'zjukop3/dsh-vertical-kit#dsh-plugin-package-check'
category: 'dev'
description:
  en: 'Check that a DSH plugin package is installable and findable before you publish it. The catalog most common rejection is a package.json that declares only dsh.client — that alone is not installable, and dsh plugin add fails. The quieter failure this check earns its place with: everything declared, the patch file present, but files drops the patch, so the package runs locally and breaks for everyone who installs it. Fifteen rules, all decidable from the package directory: dsh.bundle.patch declared and present, the patch mounting this package or one of its declared dependencies, files not dropping the patch or docs/DETAIL.md, engines.dsh, a bin key equal to the package name so npx does not 404, a README with an install line, and the locale and icon that decide whether the plugin card shows a title or stays blank. No network, no running your code, no registry. Calibrated on seven plugins other people wrote that happen to be installed here, plus this kit own thirty packages — and it found that twenty-seven of them had blank cards and no install command in their README. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '发布前确认一个 DSH 插件包「装得上、找得到」。目录收录第一号打回理由是 package.json 只声明了 dsh.client——那样装不上；更隐蔽的一种是都声明了、patch 文件也在，但 files 没把它打进 tarball，于是本地能跑、发出去装不上，这个检查就是为它而写。十五条规则全部只看包目录：dsh.bundle.patch 声明了且在、patch 挂的是自己或自己声明的依赖、files 没漏掉 patch 或 docs/DETAIL.md、engines.dsh、bin 里有一个键等于包名（否则 npx 会 404）、README 里有安装命令、以及决定插件卡片是否有标题的 locale 与图标。不联网、不执行包代码、不读 registry。校准语料是这台机器上别人写的七个插件加本仓库自己的三十个包——它查出其中二十七个卡片是空白的、README 里也没有安装命令。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: 'https://raw.githubusercontent.com/zjukop3/dsh-vertical-kit/main/assets/icon-180.png'
