url: https://github.com/SMSMy/dsh-arabic
name: SMSMy/dsh-arabic
category: ui
description:
  en: 'Bidi-safe RTL rendering for mixed Arabic and English text, a full Arabic interface pack (3,307 strings) registered through the DSH locale service, and three thmanyah cuts — Sans for the interface, Serif Text for reading, Serif Display for headings — placed behind whatever font the app itself is set to.'
  zh: '让 DSH 界面说阿拉伯语：混合阿拉伯文与英文的双向文本排版，通过 DSH 官方语言服务注册完整阿拉伯语界面包（3,307 条），并内置三款 thmanyah 字体（界面 Sans、正文 Serif Text、标题 Serif Display），置于应用自身字体设置之后。'
