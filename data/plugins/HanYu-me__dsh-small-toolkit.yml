name: HanYu-me/dsh-small-toolkit
category: notify
description:
  en: 'Two small macOS features in one plugin. keepAwake stops the system, and by default the display, from sleeping while dsh runs (caffeinate tied to the host process); a switch lets the display sleep and the screen lock as usual while the system stays awake, so tasks keep running behind the lock. taskNotify posts a system notification when a top-level conversation finishes its turn, with the outcome (completed, error, blocked, output cap) and the duration; clicking the notification brings DeepSeek Harness forward. Click-to-focus needs Xcode Command Line Tools to build the notifier; without the toolchain the notification still appears but clicking it opens Script Editor. Subagents and Agent Teams members never notify, and a stop you pressed is silent by default. You can choose which workspaces and conversations notify. Both features can be switched off separately; the settings are on the dsh Plugins page and apply without a restart. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '一个插件里的两个 macOS 小功能。keepAwake：dsh 运行期间不让系统休眠，默认屏幕也常亮（caffeinate 跟随宿主进程，dsh 退出即解除）；打开「允许息屏和锁屏」后，屏幕照常熄灭、自动锁屏，系统仍不休眠，锁屏后任务继续运行。taskNotify：主对话一轮结束时发系统通知，写明结果（完成、出错、被拦截、输出达到上限）和用时；点击通知会切回 DeepSeek Harness。点击切回需要 Xcode Command Line Tools 构建通知助手；没有工具链时仍会提醒，但点击打开的是「脚本编辑器」。子智能体和 Agent Teams 成员不提醒，你手动停止的任务默认不提醒。可以按工作区和对话选择哪些要提醒。两个功能可以分别关闭；设置在 dsh 的插件页，改动立即生效。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
