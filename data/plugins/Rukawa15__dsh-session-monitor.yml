description:
  en: 'Read-only monitor for local DSH sessions: live task board, per-session tails, blocking reply wait, Markdown export, and optional IM push via dsh-im. Requires Python 3 with the zstandard package; IM push additionally needs the dsh-im plugin.'
  zh: '只读的本机 DSH 会话监视器：实时任务看板、会话事件尾随、阻塞等待回复、Markdown 导出，可选配合 dsh-im 推送 IM。需要 Python 3 与 zstandard 库；IM 推送需另装 dsh-im。'
