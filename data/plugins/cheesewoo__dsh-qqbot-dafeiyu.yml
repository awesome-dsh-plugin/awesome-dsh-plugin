url: https://github.com/cheesewoo/dsh-qqbot-dafeiyu
name: cheesewoo/dsh-qqbot-dafeiyu
category: identity
description:
  en: 'Connects a QQ Bot to DeepSeek Harness with per-peer sessions, group mention and keyword triggers, image generation and voice replies. Access defaults to OPEN for both direct and group chats, and an empty allowlist means everyone — set access.c2cMode / access.groupMode to allowlist (or disabled) before exposing the bot; IM input can run tools on the host.'
  zh: '让 QQ 机器人接入 DeepSeek Harness：按会话隔离、群聊 @ 与关键词触发、生图与语音回复。私聊与群聊默认开放，白名单为空即放行所有人——对外暴露机器人前请把 access.c2cMode / access.groupMode 改成 allowlist（或 disabled）；IM 输入可在宿主机上执行工具。'
