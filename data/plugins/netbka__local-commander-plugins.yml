url: https://github.com/netbka/local-commander-plugins
name: netbka/local-commander-plugins
category: remote
description:
  en: Connects DeepSeek Harness to the hosted Local Commander MCP server at localcmd.app via mcp-remote with browser sign-in, to read files and Git, run the checks you approve and check local services on your Windows computers. Requires a Local Commander account and the paired agent running on the Windows PC.
  zh: 通过 mcp-remote 把 DeepSeek Harness 接到 localcmd.app 上托管的 Local Commander MCP 服务（浏览器登录），在你的 Windows 电脑上读文件、查 Git、执行你批准的检查并探测本地服务。需 Local Commander 账号，且配对的 agent 要跑在那台 Windows 电脑上。
tarball: https://github.com/netbka/local-commander-plugins/releases/download/v1.0.0/local-commander-dsh-1.0.0.tgz
