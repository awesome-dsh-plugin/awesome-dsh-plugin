url: https://github.com/DrizzleGig/dsh-novel-comment
name: DrizzleGig/dsh-novel-comment
category: workflow
description:
  en: 'You know the story too well to read it like a reader does. Here a room of AI readers with their own tastes reads your draft as it stands, gives one to five stars with chapter and paragraph comments, follows or drops the book, and remembers only what it has read; their disagreements become your edit signals, and their taste profiles keep growing with every chapter.'
  zh: '你太熟悉自己的故事，很难再像读者那样读它。这里有一屋子口味各异的 AI 读者：只读到你现在写到的那一章，按自己的喜好打 1–5 星、写章评和段评，追更或弃书；他们的分歧就是你的修改信号，口味档案会随着每一章慢慢长成。'