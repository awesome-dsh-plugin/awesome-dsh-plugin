description:
  zh: "大肥鱼语音：让 DSH 网页桌宠开口说话。碎碎念气泡出现时自动朗读，左键点气泡朗读内容，右键/长按再读一遍，点桌宠回应「主人，小鱼在这呢」等互动台词。默认音色为本地离线复刻的「鱼鱼酱」，另有「鱼鱼姐（实验版）」，都不需要 API Key，音色包按需下载（约 58MB，国内加速线路）；自动朗读可设最小间隔（不限/30 秒/60 秒/3 分钟），同一 DSH 实例下多页面只由一个页面出声。插件本体约 35KB，推理在 worker 线程，不修改 dsh-pet 的任何文件。"
  en: "Big Fish Voice: makes the DSH web desktop pet speak. Whisper bubbles are read aloud automatically, left-clicking a bubble reads it, right-click/long-press reads it again, and clicking the pet replies with lines like 「主人，小鱼在这呢」. Default voice is a local offline replica of 鱼鱼酱; 鱼鱼姐 (experimental) is also included — no API key needed, voice packs download on demand (~58MB, China-accessible mirrors). Auto-reading can be throttled (unlimited / 30s / 60s / 3min); within one DSH instance only one page plays audio. About 35KB package, inference in a worker thread, no dsh-pet files modified."
