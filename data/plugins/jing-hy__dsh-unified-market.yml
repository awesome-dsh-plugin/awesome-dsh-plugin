url: https://github.com/jing-hy/dsh-unified-market
name: jing-hy/dsh-unified-market
category: market
description:
  en: 'Unified plugin marketplace that aggregates the curated catalog, the GitHub dsh-plugin ecosystem and the npm registry into one storefront, with source whitelisting, conflict pre-checks, trial-boot install verification, background update checks and .dshpack feature-pack management.'
  zh: '统一插件市场：把精选目录、GitHub dsh-plugin 生态与 npm registry 三源聚合为一个入口，提供来源白名单、冲突预检、试装安装验证、后台更新检测与功能包（.dshpack）管理。'
