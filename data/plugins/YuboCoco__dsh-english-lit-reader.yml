name: YuboCoco/dsh-english-lit-reader
category: ui
icon: https://raw.githubusercontent.com/YuboCoco/dsh-english-lit-reader/main/docs/icon-180.png
description:
  en: 'English paper reader inside DeepSeek Harness: drag in a PDF and select a sentence to get its translation in the card column beside the page, with the model called only when you press Translate. Produces a six-section Chinese analysis (overview, problem and prior methods, technical approach, experimental setup and results, limitations, reproducibility), reading the whole paper in one call when the selected model can fit it and otherwise taking complete excerpt notes first. Resolves the bibliography in three stages: the original entries appear immediately, then Chinese titles, then links found through Crossref and OpenAlex, where a DOI or arXiv id printed in the entry is used directly, "not found" is written instead of a guessed link, and rate-limited lookups are reported separately as temporarily failed with a retry. Explains a selected figure together with its nearby caption when the model accepts images, typesets and explains a formula through KaTeX, explains a selected term against its own sentence and the paper text and keeps it as a glossary entry, records highlights and annotations as two independent kinds that do not overwrite each other, and searches inside the document. Nine interface tones (four light, five dark) plus seven paper colours are applied as a darken-blended layer above the page canvas, so only the white sheet is recoloured and text, figures and tables keep their own colours. Function cards can be reordered, detached and resized; one, two and three page layouts, zoom with Ctrl+wheel, two-way panning, fullscreen, and a per-paper recent list kept in IndexedDB. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '装在 DeepSeek Harness 里的英文文献阅读器：拖入 PDF，选中句子即可在页面旁的功能卡片里得到译文，点「翻译」才调用模型。按「论文概览 / 研究问题与已有方法 / 技术方案 / 实验设置与结果 / 局限与适用范围 / 复现与可借鉴之处」六段生成中文分析，模型上下文装得下时一次读完全文，装不下就先完整分段记笔记再汇总。参考文献分三步：先立刻显示切好的原文条目，再补中文标题，最后逐条查地址（原文印了 DOI / arXiv 号就直接给链，「查不到」就写未找到而不猜链接，被限流的单独标为暂时失败并可一键重试）。能结合图注解释框选的插图（需要支持图像输入的模型）、用 KaTeX 排版并解释公式、结合所在句与论文原文解释选中术语并收进术语表、把高亮与批注记成两条互不覆盖的独立记录，并支持文内搜索。九套界面配色（四浅五深）与七种页面配色叠在画布之上做 darken 混合，只改白纸，文字、图片与表格保持原色。功能卡片可改顺序、拖出浮动、拖动边缘改大小；单页 / 双页 / 三页布局、Ctrl+滚轮缩放、双向拖动、全屏，以及按论文保存在 IndexedDB 的近期阅读列表。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
