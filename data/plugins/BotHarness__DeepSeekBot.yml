description:
  en: 'Tobs (formerly DeepSeekBot): a personal bot team with persistent Git-backed memory per bot, group chat and task delegation, scheduled tasks, a bot marketplace, and bridges to Slack, Discord, Feishu/Lark, QQ and WeChat.'
