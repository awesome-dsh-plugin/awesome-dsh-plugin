url: https://github.com/HimLeoing/dsh-progress
name: HimLeoing/dsh-progress
category: ui
description:
  en: 'Code can Vibe, progress must be Visible. No guess, less stress. See progress you can assess. Make project progress visible with local algorithms, optional AI assistance, task checklists, and subagent tracking. View overall progress, subagent activity, current operations, and estimated time remaining in a draggable panel. Supports DeepSeek Harness Web and Desktop. Requires Harness ≥0.2.2-rc.1 and Node.js ≥24.9.0. Local estimates require no additional model requests. AI assistance is off by default; enabling it incurs charges from the selected model provider. Probe usage and estimated costs are available in the panel.'
  zh: '代码可以 Vibe，进度必须 Visible。 No guess, less stress. See progress you can assess. 通过本地算法、可选 AI 辅助、任务清单与子代理追踪，让项目进程清晰可见。在可拖动的进度面板中，查看总体进度、子代理进展、当前执行操作与预估剩余时间。 支持 DeepSeek Harness Web端与Desktop端。需要 Harness ≥0.2.2-rc.1、Node.js ≥24.9.0。 本地估算无需额外模型请求。AI 辅助默认关闭，开启后会产生所用模型提供方的调用费用，可在面板内查看探针用量与估算费用。'
tarball: https://github.com/HimLeoing/dsh-progress/releases/download/v0.1.1-rc3/dsh-progress-0.1.1-rc3.tgz
