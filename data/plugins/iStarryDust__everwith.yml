url: https://github.com/iStarryDust/everwith
name: iStarryDust/everwith
category: identity
description:
  en: 'Gives a chat persona a persistent inner state: 40 emotions with half-lives, nine drives, and memories that fade over days, re-rendered into the system prompt every turn. Replies can be split across several messages, spoken through DeepSeek TTS or Xiaomi MiMo, dictated by local speech recognition, and a background timer can glance at the screen. Exposes 4 tools.'
  zh: '给对话角色一层持续的内在状态：40 种带半衰期的情绪、九个驱动、会随时间淡去的记忆，每轮重新渲染进系统提示词。回复能拆成几条发出，能念出声（DeepSeek TTS / 小米 MiMo），也能听人说话（本地识别），后台还会隔一阵看一眼屏幕。提供 4 个工具。'
icon: https://raw.githubusercontent.com/iStarryDust/everwith/main/assets/icon-180.png
