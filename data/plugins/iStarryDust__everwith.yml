url: https://github.com/iStarryDust/everwith
name: iStarryDust/everwith
category: identity
description:
  en: 'A persistent inner life for the character in your chat — forty emotions that rise and fade on their own, memories that keep your accounts and habits, replies that arrive one line at a time, a voice that can speak and listen, and the occasional glance at your screen. Note: its HTTP routes have no DSH access check (no ctx.connection.requestRejection), so a web page open in your browser could call them.'
  zh: '给你对话框里的人：情绪、记忆、嗓子、眼睛。40 种情绪会涨会消，两层记忆记着账号和约定，说话一条一句像发消息，能出声也能听你说话，偶尔看一眼屏幕但只记在心里。注意：它的 HTTP 路由没有 DSH 的访问检查（没有 ctx.connection.requestRejection），浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/iStarryDust/everwith/main/assets/icon-180.png
