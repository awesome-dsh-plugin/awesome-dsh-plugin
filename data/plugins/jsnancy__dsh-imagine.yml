url: https://github.com/jsnancy/dsh-imagine
name: jsnancy/dsh-imagine
category: vision
description:
  en: 'Reads the Codex (ChatGPT) subscription quota already on your machine and draws with it: plan, weekly usage and reset time in a sidebar panel, one prompt to a PNG saved locally, with history. No API key, no extra billing. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '读取本机已有的 Codex（ChatGPT 订阅）额度并直接生图：侧栏显示套餐、本周已用与重置时间，写一句话出 PNG 存到本机并保留历史。不需要 API key，不额外计费。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/jsnancy/dsh-imagine/main/icon.png
