name: SillyMeo-1/dont-guess-ask
category: agi
description:
  en: When a requirement was never stated, the agent puts the 2-5 readings it inferred into the composer's choice card and waits for a pick instead of guessing and running ahead. Also adds a standing rule and a three-level how-often-to-ask setting.
  zh: 需求没明说时，先把推断出的 2–5 种读法摆进输入区的选择框让你挑，再动手；另附一条常驻规则和三档「问多勤」设置。
