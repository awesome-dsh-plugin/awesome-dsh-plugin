name: wxddegithub/dsh-connect-deveco
category: model
description:
  en: 'DSH bundle that auto-registers the DevEco Code GLM provider and manages the local opencode-deveco proxy — status chip, start/stop/restart, Huawei login/logout and a watchdog. Unofficial; personal study use only. HTTP routes are guarded by DSH requestRejection (browser pages cannot call them).'
  zh: '自动注册 DevEco Code GLM provider 并管理本地 opencode-deveco 代理的 DSH 插件，提供状态胶囊、启停/重启、华为登录登出与看门狗。非官方插件，仅供个人学习研究。HTTP 路由经 DSH requestRejection 校验，网页无法调用。'
icon: https://raw.githubusercontent.com/wxddegithub/dsh-connect-deveco/main/assets/icon-180.png