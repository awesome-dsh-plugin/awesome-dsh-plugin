# 生成命令：node market/prep-catalog-entry.mjs --owner BlueOcean3214 --repo dsh-handoff-session
url: https://github.com/BlueOcean3214/dsh-handoff-session
name: BlueOcean3214/dsh-handoff-session
category: session
description:
  en: 'Pressure-aware session handoff for DeepSeek Harness: writes a handoff doc before a long session degrades, then continues in a fresh session in the same workspace. Subagents are snapshotted, still-running ones are interrupted, and unfinished tasks are handed to fresh subagents; a session without subagents simply gets the normal handoff. A status pip and its label shade from green to blue to amber to red as pressure rises.'
  zh: 为 DeepSeek Harness 提供会话交接：长会话降智前自动写交接文档，并在同一工作目录开新会话继续；子智能体随交接迁移——仍在运行的先打断，未完成的任务写进续接提示交给新子智能体接手；没有子智能体时就是一次普通交接。输入框下方常驻压力提示，状态点与文字颜色随压力从绿 → 蓝 → 琥珀 → 红逐级变化。
icon: https://raw.githubusercontent.com/BlueOcean3214/dsh-handoff-session/main/assets/icon-180.png
