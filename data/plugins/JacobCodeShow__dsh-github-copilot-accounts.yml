description:
  en: 'Multi-account manager for GitHub Copilot in DSH: device-code sign-in for GitHub.com and GitHub Enterprise Cloud tenants on `*.ghe.com`, one-click account switching, per-account plan and AI credits display, and a preset Copilot provider route with first-login model catalog fallback.'
