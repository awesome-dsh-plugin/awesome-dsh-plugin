url: 'https://github.com/SouthM/dsh-nanshan-market-publish'
name: SouthM/dsh-nanshan-market-publish
category: market
description:
  en: 'Scans DSH components under development on this machine (or folders you add) and walks you through two independent tracks from the official contributing.md: pushing the code to GitHub, and opening the market listing PR. It checks the dsh.bundle manifest, the one-day repository age, the dsh-plugin topic, the category and the description rules, then writes data/plugins/<owner>__<repo>.yml. Open Nansh. Its HTTP routes have no DSH access check, and they can push code and open pull requests on GitHub with the token you give it.'
  zh: '扫描本机正在开发的 DSH 组件（也可以手动添加组件文件夹），按官方 contributing.md 的要求分两条互相独立的轨道引导：把代码提交到 GitHub，以及向插件市场提收录 PR。逐项检查 dsh.bundle、仓库满 1 天、dsh-plugin topic、分类与描述规范，并生成 data/plugins/<owner>__<repo>.yml。在左侧栏点「插件市场发布助手」进入。需要连接一个有 public_repo 权限的 GitHub Token，Token 保存在 DSH 凭据服务里，PR 会用你自己的账号提交。它的 HTTP 路由没有 DSH 的访问检查，而这些路由可以用你提供的令牌向 GitHub 推送代码并创建 PR。'
