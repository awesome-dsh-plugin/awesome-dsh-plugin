url: https://github.com/ShallBay/dsh-bridge-browser
name: ShallBay/dsh-bridge-browser
tarball: https://github.com/ShallBay/dsh-bridge-browser/releases/latest/download/dsh-bridge-browser.tgz
category: browser
description:
  en: 'Lets DSH drive the Chrome tab you are already browsing, no vision needed: the page reaches the model as structured text with a numbered element list, and clicks, typing, key presses, scrolling, tab handling and navigation wait for your confirmation in the extension side panel while password and payment-card fields stay masked. Fifteen browser_* tools cover snapshot, text, tab list, open, follow, click, type, press, scroll, wait, navigate, back, close, forward and reload. A repack of the bridge plugin from omdsh-dev/dsh-browser, published to npm so it installs with `dsh plugin add`: the peer ranges the host checks are widened so the install is not refused as incompatible, the bundled extension also probes the DSH Desktop host port 19387 so no bridge address has to be typed, and a script copies the extension to a fixed directory so a profile switch or reinstall cannot break it. The prebuilt release tarball carries the plugin and the built MV3 extension. Upstream: https://github.com/omdsh-dev/dsh-browser.'
  zh: '让 DSH 直接操控你当前正在浏览的 Chrome 标签页，无需视觉能力：页面以带编号元素清单的结构化文本交给模型；点击、输入、按键、滚动、标签页操作与导航都会在扩展侧边栏等你确认，密码与支付卡字段保持掩码。15 个 browser_* 工具覆盖 snapshot、文本读取、标签页列举/打开/跟随、点击、输入、按键、滚动、等待、导航、后退、关闭、前进与刷新。本项目是 omdsh-dev/dsh-browser 桥接插件的再打包版，发布到 npm，可直接 `dsh plugin add` 安装：放宽了宿主安装时校验的 peer 范围，避免被判为版本不兼容；随包的扩展额外探测 DSH 桌面端宿主端口 19387，因此无需手填桥接地址；并附带脚本把扩展复制到固定目录，避免切换 profile 或重装后扩展失效。预构建 Release tarball 内含插件本体与已构建的 MV3 扩展。上游：https://github.com/omdsh-dev/dsh-browser。'
