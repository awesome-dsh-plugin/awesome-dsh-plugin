  en: 'Multi-device remote access for DeepSeek Harness: continue an active session from your phone, tablet, browser, or another computer over an end-to-end encrypted channel (Noise IK + adaptive relay/WebRTC transport), with device authorization and ApiProxy-only remote capabilities — no shell, remote desktop, or file access.'
