url: https://github.com/Anmulzhao/DSH-AGINT
name: Anmulzhao/DSH-AGINT
category: agi
description:
  en: 'Self-evolving agent framework on DeepSeek Harness (dsh): 40 Cordis plugins and 4 presets covering memory, reflection, gates, metrics and an auditable evolution loop. Not a one-command install. Clone the repo and run install/install.sh --profile=web (needs bash, Node 20+, python3, DSH 0.1.7-rc.1 or newer with an initialized profile), then restart.'
  zh: '基于 DeepSeek Harness 的自进化智能体框架：40 个 Cordis 插件、4 套 preset，含记忆、反思、门禁、度量与可审计的进化闭环。不是一条命令装完。需克隆仓库并运行 install/install.sh --profile=web（依赖 bash、Node 20+、python3、DSH 0.1.7-rc.1 及以上且目标 profile 已初始化），装完重启。'
icon: https://raw.githubusercontent.com/Anmulzhao/DSH-AGINT/main/docs/assets/brand/png/agint-icon-256.png
