description:
  en: 'Desktop pet for DSH: a draggable cat, golden retriever or capybara floating on the overlay — tap to charge energy, blinking and emotes, naps, synthesized WebAudio sounds and particle effects. Import your own pet as a photo (2.5D cutout) or a GLB model (real 3D turntable rendered with three.js), resize it from 30% to 300%, and keep every bit of data on the local machine.'
  zh: 'DSH 桌面灵宠：可拖动的布偶猫 / 金毛 / 水豚浮在整屏浮层上，轻叩蓄能、眨眼表情、打盹、WebAudio 合成音效与粒子；支持导入自己的照片（2.5D 立绘）或 GLB 模型（three.js 真 3D 转台），大小 30%–300% 无级调节，数据全部只存本机。'
