name: xiao0o0/dsh-docs-manager
category: docs
description:
  en: 'Markdown document manager panel: one card row per folder, rich-text editing saved as Markdown, search, pin, sort, and capture from chat. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'Markdown 文档管理面板：一个目录一行卡片墙，富文本编辑并保存为 Markdown，支持搜索、置顶、排序与从会话一键记录。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/xiao0o0/dsh-docs-manager/main/assets/icon-180.png
