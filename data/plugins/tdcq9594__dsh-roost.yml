url: https://github.com/tdcq9594/dsh-roost
name: tdcq9594/dsh-roost
category: remote
description:
  en: 'Hosts QQ chats as DeepSeek Harness sessions: one QQ conversation maps to one DSH session that survives restarts, per-speaker tool permissions, three-layer memory with nightly consolidation, optional QQ-number binding that ties openids to QQ numbers so memories survive a bot or AppID change (binding is voluntary, never required, and never guessed from nicknames), four-section personas, context compaction, a ten-page sidebar panel, and a setup wizard that installs the Roost kernel and ai-chat plugin. Anyone in a paired QQ group can chat with the bot by default; only the owner gets the full local toolset.'
  zh: '把 QQ 会话接进 DeepSeek Harness：一个 QQ 会话对应一个 DSH 会话、重启后映射保留，按说话人分档收放本地工具，三层记忆（事实 / 日记 / 图谱）+ 凌晨巩固，可选的 QQ 号绑定把 openid 对上 QQ 号 / 群号，换机器人（换 AppID）后旧记忆照样读得到（绑定完全自愿、非必需，昵称候选只提示不自动绑），人格四段式，上下文压缩，侧栏十页面板，接入向导会自动装好 Roost 内核与 ai-chat 插件。接好的 QQ 群里任何人都能和机器人聊天；只有主人拿得到完整的本地工具。'
