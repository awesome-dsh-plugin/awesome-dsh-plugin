url: https://github.com/nanhua3839/dsh-hykb-scroll
name: nanhua3839/dsh-hykb-scroll
category: fun
description:
  en: 'A second 好游快爆 (3839) account that lives in the plugin host. When the owner''s main account @-mentions it, it reads the thread and posts an AI-written reply back into the floor — either from the message center''s mention feed (no ids to configure) or from sections and threads it was told to watch, with scan interval, @ detection mode and a per-round read/reply budget in Settings. On its own clock it also scans boards, scores threads, deep-reads the top few and writes a Chinese daily digest to ~/.dsh/hykb-work/digest-<date>.md, then wakes its own DSH session so it actually reads the digest and picks what to tell the owner. Six-card settings page (Settings → 刷快爆) with QR-code login, persona and AI endpoint; every outbound write shares one hourly/daily budget plus a write cooldown, and threads and floors already handled are de-duplicated in seen.json. Cookies stay in ~/.hykb-ai/credentials.json, config in ~/.dsh/hykb-scroll.config.json. It logs in with the second account''s cookies, kept in ~/.hykb-ai/credentials.json, and posts under that account on a public forum; automatic replies to your @-mentions run once started, while auto-posting, auto-replying to high-score threads and auto-liking are off by default, so check the forum''s rules on automated accounts.'
  zh: '在插件宿主里养一个好游快爆（3839）小号：大号 @ 它，它读完帖子用 AI 写一句回复发回楼中楼——@ 从消息中心的「@我的」通知收（不用配任何 id），也可以盯指定板块与帖子；扫描间隔、@ 的判定方式、每轮最多读几帖回几条都在设置页里。它还有自己的时钟：到点扫板块、给帖子打分、深读前几帖，写一份中文日报到 ~/.dsh/hykb-work/digest-<日期>.md，然后叫醒自己的 DSH 会话，让她真的读到日报、挑出要跟主人说的话。六张卡的设置页（设置 → 刷快爆），含扫码登录、人设与 AI 接口；所有出网写操作共用一份每小时/每天额度加写冷却，处理过的帖子与楼层按 seen.json 去重。cookie 在 ~/.hykb-ai/credentials.json，配置在 ~/.dsh/hykb-scroll.config.json。它用小号的 cookie 登录（保存在 ~/.hykb-ai/credentials.json），并以该账号在公开论坛发言；启动后会自动回复 @ 你的通知，而自动发帖、自动回复高分帖和自动点赞默认关闭，请先确认论坛对自动化账号的规定。'
