url: https://github.com/carlslin/dsh-skill-eval
name: carlslin/dsh-skill-eval
category: skill
description:
  en: Scores every skill 0-100 from real execution telemetry (load success, follow-up tool errors, user corrections, ignored loads and cost) with 95% confidence intervals, turns that evidence into fixes the agent can act on, and copies one skill's current issues from the board as a ready-to-paste Markdown repair task.
  zh: 用真实执行遥测（加载成败、后续工具报错、用户纠正、被忽略与成本）给每个技能打 0-100 分并附 95% 置信区间，把证据转成 agent 可直接执行的修复建议，并支持从看板把单个技能的当前问题一键复制成可粘贴的 Markdown 修复任务。
