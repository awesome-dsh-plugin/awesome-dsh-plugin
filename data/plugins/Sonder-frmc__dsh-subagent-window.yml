url: https://github.com/Sonder-frmc/dsh-subagent-window
name: Sonder-frmc/dsh-subagent-window
category: ui
description:
  en: Floats a DSH subagent's conversation as a draggable window inside the DSH web client, so you can keep the main conversation visible while reading, messaging, confirming permissions or stopping that subagent.
  zh: 把 DSH 子智能体对话浮成网页客户端内可拖动的窗口，主对话保持可见，可查看、发消息、确认权限或停止子智能体。
