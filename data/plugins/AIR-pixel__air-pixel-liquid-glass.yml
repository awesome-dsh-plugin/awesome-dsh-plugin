url: https://github.com/AIR-pixel/air-pixel-liquid-glass
name: AIR-pixel/air-pixel-liquid-glass
category: theme
description:
  en: A configurable Liquid Glass theme for DeepSeek Harness with translucent surfaces, wallpaper, desktop transparency, window blur, custom cursors, click ripples, and per-side conversation contrast controls.
  zh: 为 DeepSeek Harness 提供可配置的液态玻璃主题，包含半透明界面、壁纸、桌面透出、窗口模糊、自定义光标、点击涟漪和消息辨识选项。
