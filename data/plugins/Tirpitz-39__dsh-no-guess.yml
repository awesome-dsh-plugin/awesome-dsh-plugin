name: Tirpitz-39/dsh-no-guess
category: security
description:
  en: Blocks the first tool call when the model's own reasoning admits it is guessing the user's intent, and forces a clarifying question instead.
  zh: 模型思考里承认在猜用户意图时，拦下工具调用，强制先问清「要干什么 + 要怎么干」。