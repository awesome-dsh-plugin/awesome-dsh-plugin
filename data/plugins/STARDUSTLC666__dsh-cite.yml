description:
  en: 'Three-column citation workbench and 6 cite_* tools (lookup/format/bibtex/check/batch/health): local DOI/BibTeX import preview with duplicate and missing-field checks, Crossref DOI verification and empty-field backfill with diff view, GB/T 7714 / APA / MLA / Chicago formatting, BibTeX and raw-source JSON backup export, and 5 switchable workbench themes.'
  zh: '三栏引文工作台与 6 个 cite_* 工具（lookup/format/bibtex/check/batch/health）：支持 DOI/BibTeX 本地导入去重与缺项预览、Crossref 真实性核查与空字段差异补全、GB/T 7714 / APA / MLA / Chicago 排版复制、BibTeX 与含原始来源的 JSON 备份导出及 5 套工作台主题。'
