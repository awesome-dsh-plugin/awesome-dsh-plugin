url: https://github.com/Rosmeowtis/dsh-aria2-rpc
name: Rosmeowtis/dsh-aria2-rpc
category: tools
tarball: https://github.com/Rosmeowtis/dsh-aria2-rpc/releases/latest/download/dsh-aria2-rpc.tgz
description:
  en: 'Controls an existing aria2 JSON-RPC service from DSH with four tools: submit a single HTTP/HTTPS link (optional directory, filename, checksum, per-task proxy), read one task, list tasks, and pause/resume/cancel. A task it submitted that finishes or fails reports back to the session that started it. A settings page holds host, port, secret and timeout, with a connection test that does not save or create anything; it never bundles, starts or manages aria2 itself. It does not gate submissions by access mode: aria2_download and aria2_control work in every mode, with authorization left to the normal DSH tool policy; a mutation whose result is unknown returns a GID to query instead of being retried automatically.'
  zh: '连接已有的 aria2 JSON-RPC 服务，提供四个工具：提交单文件直链（可选保存目录、文件名、校验和、任务级代理）、读任务状态、列任务、暂停/恢复/取消；由它提交的任务完成或失败时，回报给发起它的会话。设置页保存主机、端口、密钥与超时，并带一个不保存配置、不创建任务的连接测试；不自带、不启动、不管理 aria2。它不按访问模式拦截提交：aria2_download 与 aria2_control 在各模式下都可用，授权沿用 DSH 常规工具策略；结果未知的修改请求返回可查询的 GID，不会自动重试。'
