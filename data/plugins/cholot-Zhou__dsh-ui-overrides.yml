description:
  en: File-based CSS overrides for the DeepSeek Harness Web UI — edit ~/.dsh/ui-overrides.css and reload to restyle any plugin's elements, for example making the quote bar fully opaque.
  zh: 基于本地 CSS 文件的界面覆盖——编辑 ~/.dsh/ui-overrides.css 并刷新，即可改任意插件元素的外观，例如让引用浮层完全不透明。
