url: https://github.com/zrrrrrrr77/dsh-print-screen
name: zrrrrrrr77/dsh-print-screen
category: ui
description:
  en: 'Scissors button in the DSH composer: freeze, drag a region, crop into your prompt. Ctrl+Alt+1 hides DSH; Shift+Ctrl+Alt+1 and Shift+click keep it visible. All monitors supported. Repeated shots: hold Ctrl+Alt and click "1". Saved by default to the current session folder with a second-level timestamp; two copies by default (session folder + DSH''s attachment library), reducible to the session folder only. Deleting them with a conversation needs a change in the "Delete Conversation" plugin.'
  zh: '方便大家直接截屏的提示词框快捷按钮。拉完范围框后直接截屏。支持多屏幕。“Ctrl+Alt+1”一起按，自动隐藏DSH窗口截屏；同时按住“Shift+Ctrl+Alt+1”，不隐藏DSH截屏；“shift+点击按钮”不隐藏窗口。反复截屏：“按住Ctrl+Alt，反复点击”1“”。截图默认保存到当前会话文件夹，文件名为秒级时间戳。！默认保存2份：当前对话文件夹+DSH自身附件库。（节约空间可修改成只保存到当前会话文件夹，会话选择引用文件）删除对话同时删除保存图片需要自行去其他“删除对话”插件中修改。'
