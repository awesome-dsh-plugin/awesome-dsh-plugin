url: https://github.com/zrrrrrrr77/dsh-print-screen
name: zrrrrrrr77/dsh-print-screen
category: ui
description:
  en: 'DSH prompt-box screenshot shortcut button — makes it easy for anyone to capture the screen directly. After dragging out a selection box, the screenshot is taken immediately. Multiple monitors are supported. Press Ctrl+Alt+1 together: DSH automatically hides, then the screenshot is taken. Hold Shift+Ctrl+Alt+1: the screenshot is taken without hiding DSH. Shift+click the button: the screenshot is taken without hiding the window. Repeated screenshots: hold Ctrl+Alt and repeatedly click "1". Screenshots are saved by default to the current session folder, with the filename being a second-level timestamp. ! By default, two copies are saved: the current conversation folder + DSH''s own attachment library. (To save space, this can be changed to save only to the current session folder; the conversation can then select and reference the file.) Deleting a conversation while also deleting the saved images requires you to make the change yourself in the other "Delete Conversation" plugin.'
  zh: '方便大家直接截屏的DSH提示词框截图快捷按钮。拉完范围框后直接截屏。支持多屏幕。“Ctrl+Alt+1”一起按，自动隐藏DSH窗口截屏；同时按住“Shift+Ctrl+Alt+1”，不隐藏DSH截屏；“shift+点击按钮”不隐藏窗口。反复截屏：“按住Ctrl+Alt，反复点击”1“”。截图默认保存到当前会话文件夹，文件名为秒级时间戳。！默认保存2份：当前对话文件夹+DSH自身附件库。（节约空间可修改成只保存到当前会话文件夹，会话选择引用文件）删除对话同时删除保存图片需要自行去其他“删除对话”插件中修改。'
