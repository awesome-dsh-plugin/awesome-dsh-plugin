name: 27painter/dsh-sw-cad
category: tools
icon: https://raw.githubusercontent.com/27painter/dsh-sw-cad/main/assets/icon-180.png
description:
  en: 'Registers two MCP servers that drive the installed AutoCAD and SolidWorks desktop apps over COM, plus two on-demand skills and a delivery check. Windows only, Python 3.11+; the pinned upstream servers install themselves on first load, and only the sides whose CAD application is registered get a row. Both servers advertise search entry tools rather than their full catalogs (2 and 3 tools), taking the schemas loaded before the first request from 83,732 to 365 tokens and from 23,411 to 474. dsh-sw-cad deliver reads what a job produced -- DXF dimension entities, units, sheet size, stated scale, PDF text layer, STEP schema and bounding box -- and exits non-zero when it does not hold up; its half-delivery profile also requires fits, material grades and surface finish to come from a bundled standards table.'
  zh: '注册两个 MCP 服务器，在 Windows 上通过 COM 驱动本机安装的 AutoCAD 与 SolidWorks，另附两个按需技能和一个交付检查。仅 Windows，需要 Python 3.11+；首次加载时自动安装钉死版本的上游服务器，并且只给真正装了的 CAD 应用注册对应的那一行。两个服务器都只广告检索入口而非完整工具表（分别 2 个和 3 个），首次请求前加载的工具定义从 83,732 降到 365 token、从 23,411 降到 474。收尾可用 dsh-sw-cad deliver 读回本次产出的文件——DXF 的尺寸实体、单位、图幅、比例、PDF 文字层、STEP 的 schema 与包围盒——判定不过就返回非零；半交付模式另外要求配合、材料牌号与表面处理取自仓库内置的取值表。'
