url: https://github.com/27painter/dsh-sw-cad
name: 27painter/dsh-sw-cad
category: tools
icon: https://raw.githubusercontent.com/27painter/dsh-sw-cad/main/assets/icon-180.png
description:
  en: Registers two MCP servers that drive the installed AutoCAD and SolidWorks desktop apps over COM, plus two on-demand skills. Windows only, Python 3.11+; the pinned upstream servers install themselves on first load, and only the sides whose CAD application is registered get a row. Each server advertises two meta-tools instead of its full catalog (a discovery shim here for SolidWorks, upstream DISCOVERY_MODE=search for AutoCAD), taking the schemas loaded before the first request from 23,404 to 256 tokens and from 83,732 to 365 respectively.
  zh: 注册两个 MCP 服务器，在 Windows 上通过 COM 驱动本机安装的 AutoCAD 与 SolidWorks，另附两个按需技能。仅 Windows，需要 Python 3.11+；首次加载时自动安装钉死版本的上游服务器，并且只给真正装了的 CAD 应用注册对应的那一行。两者都只广告两个元工具而非完整工具表（SolidWorks 用本仓库的 discovery 垫片，AutoCAD 用上游 DISCOVERY_MODE=search），首次请求前加载的工具定义分别从 23,404 降到 256 token、从 83,732 降到 365 token。
