url: https://github.com/kagurazakayashi/dsh-delete-session
name: kagurazakayashi/dsh-delete-session
category: session
description:
  en: Adds a Delete session item to the sidebar session-row menu; the confirmation mode is configurable (click again, confirm in a dialog, or delete immediately) and a session that is running a task is refused.
  zh: 在侧边栏会话行菜单中加入「删除会话」项，确认方式可配置（再次点击、对话框确认或直接删除），正在执行任务的会话会被拒绝删除。
