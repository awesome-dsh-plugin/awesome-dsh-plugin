url: https://github.com/llifco/dsh-plugin-reverse-proxy
name: llifco/dsh-plugin-reverse-proxy
category: remote
description:
  en: "LAN access plugin for the DSH Web UI: a built-in reverse proxy that forwards a LAN port to 127.0.0.1:3080 with Host/Origin rewriting and token-free login. Listens on 127.0.0.1 by default; exposing it to the LAN requires an explicit switch with a security confirmation. The listening port is editable, and the settings page keeps a list of recent client IPs with an optional blacklist (one-click block, 403 page, cannot block the device you are using) plus a reset command that restores defaults. Known limitation: one tab per browser (upstream identity model); other devices or a private window are unaffected. QQ group: 1065464637. If this plugin helps you, a star is appreciated."
  zh: "DSH Web 界面局域网访问插件：内置反向代理，把局域网端口转发到 127.0.0.1:3080 并改写 Host/Origin、免 Token 登录。默认只监听本机，开放到局域网需显式开启开关并通过安全确认；端口可自定义，带访问 IP 列表与黑名单（可一键拉黑、403 拦截、防止把自己锁在门外）、以及一条恢复默认的重置命令。已知限制：受官方身份模型约束，同一浏览器同时只能开一个标签页，其他设备或无痕窗口不受影响。交流群（QQ）1065464637，问题与建议都欢迎；如果它帮到了你，请点个 Star 支持一下。"
icon: https://raw.githubusercontent.com/llifco/dsh-plugin-reverse-proxy/main/assets/logo.jpg
