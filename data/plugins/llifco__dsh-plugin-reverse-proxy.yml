url: https://github.com/llifco/dsh-plugin-reverse-proxy
name: llifco/dsh-plugin-reverse-proxy
category: remote
description:
  en: "Reverse proxy for the DSH Web UI that forwards a LAN port to 127.0.0.1:3080 with Host/Origin rewriting and token-free login. Listens on 127.0.0.1 by default; exposing it to the LAN requires an explicit switch with a security confirmation, and the listening port is editable. Known limitation: one tab per browser (upstream identity model); other devices or a private window are unaffected."
  zh: "DSH Web 界面反向代理：把局域网端口转发到 127.0.0.1:3080，改写 Host/Origin 并免 Token 登录。默认只监听本机，要开放到局域网需显式开启开关并通过安全确认，端口也可自定义。已知限制：受官方身份模型约束，同一浏览器同时只能开一个标签页，其他设备或无痕窗口不受影响。"
icon: https://raw.githubusercontent.com/llifco/dsh-plugin-reverse-proxy/main/assets/logo.jpg
