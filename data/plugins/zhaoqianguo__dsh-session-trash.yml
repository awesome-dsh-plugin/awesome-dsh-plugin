url: https://github.com/zhaoqianguo/dsh-session-trash
name: zhaoqianguo/dsh-session-trash
category: session
description:
  en: 'Adds a recoverable trash bin for DeepSeek Harness sessions: right-click delete, restore, permanent purge, configurable retention with automatic expiry, batch restore and purge, capacity stats for bin / archived / active sessions, archive takeover that can unarchive or move archived sessions into the bin, and 10 agent tools. Entries are deleted permanently after 30 days by default, and the agent tools can purge entries or empty the bin.'
  zh: '给 DSH 加上可恢复的会话回收站：右键删除、恢复、彻底删除、按保留天数自动到期清理、批量恢复与批量彻底删除、回收站/归档/活动会话的容量统计、接管归档会话（取消归档或移入回收站），并附带 10 个 agent 工具。回收站条目默认保留 30 天，到期后永久删除；agent 工具也可以彻底删除条目或清空回收站。'
