url: https://github.com/super0plant/dsh-plugin-game-time
name: super0plant/dsh-plugin-game-time
category: fun
description:
  en: 'Per-game playtime tracker for Windows: a game timer that follows each game''s running process, charting daily, weekly, monthly and all-time game stats and playtime stats. Data stays on this machine. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 侧边栏里做游戏时长统计与游戏计时：按运行进程记录每款游戏的游玩时长，出今日 / 本周 / 本月 / 累计的游戏统计和时长统计图，数据只留在本机。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/super0plant/dsh-plugin-game-time/main/assets/icon-180.png
