name: zjl1989-li/dsh-harness-zh
category: tools
description:
  en: 'Chinese localization for DeepSeek Harness: translates all system prompts, tool descriptions, and runtime contexts into Chinese at runtime via the system-prompt/assemble waterfall (1788 entries, zero source modification, uninstall restores English).'
  zh: DeepSeek Harness 中文汉化插件：通过 system-prompt/assemble 瀑布钩子在运行时把全部系统提示词、工具描述与运行时上下文翻译成中文（1788 条译文，零源码修改，卸载即还原英文）。
  ja: DeepSeek Harness の中国語ローカライズ。system-prompt/assemble の連鎖を通じて、すべてのシステムプロンプト、ツールの説明、実行時の文脈を実行時に中国語へ翻訳します（1788 項目、ソースの改変なし、アンインストールで英語に戻ります）。
