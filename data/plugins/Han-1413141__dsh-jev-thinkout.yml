description:
  en: "Shows JeV-selected task plans, progress updates and stage summaries in DSH chat, with native translation or lightweight summaries. Requires a JeV key; the Jev service is called externally and may bill. and hierarchical serial/parallel task flows."
  zh: "通过 JeV 筛选并外显思考中的任务规划、进展和阶段小结，支持轻量摘要、DSH 原生翻译（需 JeV Key，会外部调用 Jev 服务并可能计费）及父子任务、串并行流程图。"
