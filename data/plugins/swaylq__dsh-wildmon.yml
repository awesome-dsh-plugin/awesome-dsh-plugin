name: swaylq/dsh-wildmon
category: fun
description:
  en: 'Pokemon-style catch-em-all: your real work is the tall grass — turns, tool calls and errors spawn wild encounters; throw balls, fill a 28-slot dex, walk a team of six. Zero tokens, invisible to the model.'
  zh: 宝可梦式捕捉收集：真实工作就是草丛 —— 回合、工具调用、报错刷出野外遭遇；投球捕捉、集 28 格图鉴、带 6 只队伍。零 token，模型完全看不见。
  ja: ポケモン風のコレクションゲーム。実際の作業が草むらになり、ターン、ツール呼び出し、エラーが野生の遭遇を生みます。ボールを投げ、28 枠の図鑑を埋め、6 体のパーティを連れて歩きます。トークン消費はゼロで、モデルからは見えません。
