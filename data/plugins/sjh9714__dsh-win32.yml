name: sjh9714/dsh-win32
category: dev
description:
  en: Adds native Windows shell and Workspace Write sandbox presets to DeepSeek Harness without WSL, including busybox-w32 for sandboxed sessions, Git Bash for unrestricted sessions, legacy text decoding, and setup diagnostics.
  zh: 为 DeepSeek Harness 添加原生 Windows shell 与 Workspace Write 沙箱预设，无需 WSL；沙箱会话使用 busybox-w32，非受限会话使用 Git Bash，并提供旧编码读取与安装诊断。
