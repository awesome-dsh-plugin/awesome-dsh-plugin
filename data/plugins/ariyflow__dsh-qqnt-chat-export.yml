url: https://github.com/ariyflow/dsh-qqnt-chat-export
name: ariyflow/dsh-qqnt-chat-export
category: tools
description:
  en: 'Reads the local NTQQ (QQ 9.9.x) message database on Windows and Linux and exports group and private chat history to txt, csv, json, md, html or sqlite. Ships ten model tools — qqnt_status, qqnt_extract_key, qqnt_list_groups, qqnt_list_chats, qqnt_search, qqnt_export_group, qqnt_export_chat, qqnt_export_batch, plus qqnt_ask and qqnt_recall for retrieval with citations over an optional OCR, voice and embedding pipeline — and a local web UI on 127.0.0.1:46728 with an incremental SQLite index, six views (chats, export, statistics, ask, settings, models and components), a background job queue, sender redaction, media bundling, per-day splitting, export presets and AES-256 password ZIPs. OCR, speech-to-text and embeddings install into the plugin''s own virtualenv on demand; retrieval returns spans and citations and leaves the answer to the host model. Needs python3 with sqlcipher3 (the settings page can create a private virtualenv), and the database key is read from the running, logged-in QQ client.'
  zh: '读取 Windows / Linux 本机 NTQQ（QQ 9.9.x）消息库，把群聊与私聊的聊天记录导出成 txt、csv、json、md、html 或 sqlite。包含十个模型工具：qqnt_status、qqnt_extract_key、qqnt_list_groups、qqnt_list_chats、qqnt_search、qqnt_export_group、qqnt_export_chat、qqnt_export_batch，以及做检索问答与时间线回顾的 qqnt_ask、qqnt_recall（可选截图识别 / 语音转写 / 向量检索，返回片段与引用，答案交给宿主模型）。127.0.0.1:46728 上的本地网页界面有六个视图：会话、导出、统计、问答、设置、模型与组件，另有后台任务队列、昵称 / QQ 脱敏、媒体打包、按天分文件、导出预设与 AES-256 密码压缩包。OCR、语音与嵌入组件按需装进插件自己的虚拟环境。需要带 sqlcipher3 的 python3（设置页可一键创建独立虚拟环境），数据库密钥从正在登录的 QQ 客户端内存中读取。'
