url: https://github.com/ariyflow/dsh-qqnt-chat-export
name: ariyflow/dsh-qqnt-chat-export
category: tools
description:
  en: 'Reads the local NTQQ (QQ 9.9.x) message database on Windows and Linux and exports group and private chat history to txt, csv, json, md, html or sqlite. Ships sixteen model tools: qqnt_status and qqnt_doctor for environment and blocker checks, qqnt_extract_key, qqnt_index to build or inspect the sidecar index, qqnt_list_groups, qqnt_list_chats, qqnt_search, qqnt_stats for totals and monthly counts, qqnt_export_group, qqnt_export_chat and qqnt_export_batch (a chat can be named the way the user says it, and ambiguity refuses instead of guessing), qqnt_jobs for OCR, speech-to-text, chunking and model downloads, qqnt_media for a chat''s downloaded images, qqnt_storage for disk usage and allow-listed cleanup, and qqnt_ask plus qqnt_recall for retrieval with citations. The local web UI on 127.0.0.1:46728 adds an incremental SQLite index, six views (chats, export, statistics, ask, settings, models), a task panel, a single-pane layout on narrow screens, sender redaction, media bundling, per-day splitting, export presets and AES-256 password ZIPs; OCR, speech and embedding components install into the plugin''s own virtualenv on demand. Needs python3 with sqlcipher3 (the settings page can create a private virtualenv), and the database key is read from the running, logged-in QQ client.'
  zh: '读取 Windows / Linux 本机 NTQQ（QQ 9.9.x）消息库，把群聊与私聊的聊天记录导出成 txt、csv、json、md、html 或 sqlite。包含十六个模型工具：qqnt_status 与 qqnt_doctor（环境体检与排障）、qqnt_extract_key、qqnt_index（建立或查看侧车索引）、qqnt_list_groups、qqnt_list_chats、qqnt_search、qqnt_stats（总量与月度统计）、qqnt_export_group、qqnt_export_chat、qqnt_export_batch（可以直接用用户说的名字指代会话，重名时不猜、返回候选）、qqnt_jobs（截图识别 / 语音转写 / 分块与嵌入 / 下载模型）、qqnt_media（取一个会话已下载的图片）、qqnt_storage（磁盘占用与白名单清理），以及做检索问答与时间线回顾的 qqnt_ask、qqnt_recall。127.0.0.1:46728 上的本地网页界面有六个视图：会话、导出、统计、问答、设置、模型与组件，另有任务面板、窄屏单栏布局、昵称 / QQ 脱敏、媒体打包、按天分文件、导出预设与 AES-256 密码压缩包；OCR、语音与嵌入组件按需装进插件自己的虚拟环境。需要带 sqlcipher3 的 python3（设置页可一键创建独立虚拟环境），数据库密钥从正在登录的 QQ 客户端内存中读取。'
