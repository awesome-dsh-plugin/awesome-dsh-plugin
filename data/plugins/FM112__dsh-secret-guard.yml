url: https://github.com/FM112/dsh-secret-guard
name: FM112/dsh-secret-guard
category: security
description:
  en: 'Denies tool calls and shell commands that reference credential files before they run, then redacts API keys, JWTs, private-key blocks and connection-string passwords from tool results before the model sees them.'
  zh: '在工具调用和 shell 命令引用凭据文件时于执行前拒绝，并在结果回传模型前脱敏 API 密钥、JWT、私钥块与连接串密码。'
