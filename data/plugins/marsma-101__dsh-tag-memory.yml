url: https://github.com/marsma-101/dsh-tag-memory
name: marsma-101/dsh-tag-memory
category: memory
description:
  en: 'Tag-based long-term memory for dsh agents: entries live in a plain 9-column CSV you can open and edit by hand, with three JSONL ledgers recording every write, read and tidy plus an automatic backup before any library change. Project and agent are filled by the program from the session working directory and the bound identity, so the model only decides free tags and must ask the user for a name on first use in an unbound session. Recall hard-filters on project, agent and status before scoring, so other agents entries are invisible by isolation rather than by low score, then applies two vetoes (entry ratio above 0.5, query ratio at least 0.15) so a passing score still cannot return noise. A stability ladder promotes an entry to stable only after three verified uses with no wrong answer, and any wrong demotes it to volatile. 10 tools, a web UI for browsing and editing, no network calls, no embeddings, no API keys.'
  zh: '给 dsh 智能体的标签化长期记忆：条目存在一份可直接用编辑器打开修改的 9 列 CSV 里，写入、读取、整理三本 JSONL 台账记录每一次操作，改库前自动备份。项目与智能体由程序从会话工作目录和已绑定身份填充，模型只决定自由标签，未绑定身份的会话首次使用时必须向用户询问名字。召回先按项目、智能体、状态硬筛再打分，跨智能体条目靠隔离不可见而非分数低，另有两道否决（条目命中率须大于 0.5、query 命中率须不低于 0.15），过线也不会返回噪声。稳定性阶梯需三次验证通过且无错答才升为稳定，出现错答即降为易变。10 个工具、可浏览与编辑的网页界面，无网络请求、无向量、无 API 密钥。'
