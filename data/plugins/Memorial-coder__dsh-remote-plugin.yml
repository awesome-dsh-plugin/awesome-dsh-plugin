# awesome-dsh-plugin 收录条目:Memorial-coder/dsh-remote-plugin
# 复制到 awesome-dsh-plugin 仓库的 data/plugins/ 下,文件名保持 Memorial-coder__dsh-remote-plugin.yml
url: https://github.com/Memorial-coder/dsh-remote-plugin
name: Memorial-coder/dsh-remote-plugin
category: remote
description:
  en: 'Tunnels the local DSH web panel to a phone or the internet through frp, with QR pairing, TOTP 2FA, device management and an IP blacklist. Windows 10/11 only (macOS/Linux need your own matching frpc); the default hosted mode needs a free account at remote.ymzcc.com and relays traffic through that server, and Windows Defender may block the bundled frpc.exe until you run the included fix script.'
  zh: '通过 frp 隧道把本机 DSH Web 面板暴露到手机或外网，带扫码配对、TOTP 两步验证、设备管理与 IP 黑名单。仅支持 Windows 10/11（macOS/Linux 需自备同版本 frpc）；默认官方托管需在 remote.ymzcc.com 免费注册账号、流量经该服务器中转；Windows Defender 可能拦截包内 frpc.exe，需先运行附带的 fix-antivirus 脚本。'
# 市场卡片图标:GitHub 托管的正方形位图(180x180)
icon: https://raw.githubusercontent.com/Memorial-coder/dsh-remote-plugin/main/browserctl_pwa/icon-180.png
# 预构建 tarball:GitHub Release 托管的 .tgz,资产名不带版本号,配合 latest/download/ 不会 404
tarball: https://github.com/Memorial-coder/dsh-remote-plugin/releases/latest/download/dsh-remote-plugin.tgz
