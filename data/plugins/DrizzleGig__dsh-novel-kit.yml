url: https://github.com/DrizzleGig/dsh-novel-kit
name: DrizzleGig/dsh-novel-kit
category: workflow
description:
  en: 'Settings you cannot find, and by the time you are deep into the story you have forgotten what came before; plot, memory, and reference material scattered across too many tools. Now they live in one complete novel workbench. Manage the work from the desk and focus on writing in the manuscript; use Decisions to steer the plot, Memory to keep the people and the changes in your story, Style to organize the writing you love, Fanfic to manage the original work and your own story settings, and Reference to hold your writing handbook and research. It covers the needs of drafting, writing, and maintaining a long story. Whether original or fan fiction, you will find your own creative space here. The story is yours to decide; the work is yours to hold.'
  zh: '设定翻不到，写到后面忘了前面，剧情、记忆、资料散落在一堆工具里，现在，把它们放进一张完整的小说工作台。从书桌管理作品，在正文中专心写作；用决策掌握剧情走向，用记忆留住人物与故事的变化，用风格整理你喜欢的写法，用同人管理原著与本作设定，再用资料收好创作手册和参考内容。覆盖从构思、写作到长篇维护的创作需要。无论原创还是同人，都能在这里找到自己的创作空间。故事由你决定，作品由你掌握。'
