url: https://github.com/CAT0998/dsh-ai-cursor
name: CAT0998/dsh-ai-cursor
category: tools
description:
  en: A second, agent-owned cursor with a floating control panel for opacity, colour, size, badge and a permission ladder only a human can raise. It never moves the real pointer. Windows 10 (2004 or newer) only — the overlay is a Win32 program with no macOS or Linux fallback.
  zh: 给 AI 的第二只光标加一个浮动控制面板，可调透明度、颜色、大小与提示显隐，并按只能由人提高的权限等级限制它；从不移动你的真实鼠标指针。仅支持 Windows 10 2004 及以上——浮层是 Win32 程序，macOS 与 Linux 没有实现。
tarball: https://github.com/CAT0998/dsh-ai-cursor/releases/latest/download/dsh-ai-cursor.tgz
