name: SISCHOI/daruma#dsh-daruma
category: model
description:
  en: 'Automatic failover and backup channels for flaky LLM subscriptions: rides after the in-box retry, trips a self-healing circuit breaker on repeated 429/5xx or terminal errors, and switches the next request to another channel in your chain. Failovers and give-ups land in a durable JSONL audit log and as inline chat rows; a web panel picks the backup manually.'
  zh: 'LLM 订阅抽风时的自动故障转移与备用渠道：在内置重试放弃后接管，对连续 429/5xx 或终止性错误跳闸自愈断路器，把下一个请求切到链上的其他渠道。切换与放弃决策落盘为可审计的 JSONL 日志并显示为会话内提示行；Web 面板手动挑选备用渠道。'
