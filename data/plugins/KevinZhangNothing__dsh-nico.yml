description:
  en: 'Hold right-Cmd and talk: local SenseVoice STT, a fixed headless DSH session rotated by voice or the overlay button, streaming CosyVoice2 TTS with emotion voices, and an optional Live2D whale-girl overlay that lists what the session is doing — plus screen awareness, hands-free mode and a hotword correction table.'
