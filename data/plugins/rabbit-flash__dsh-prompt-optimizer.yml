url: https://github.com/rabbit-flash/dsh-prompt-optimizer
name: rabbit-flash/dsh-prompt-optimizer
category: ui
description:
  en: 'Rewrites the composer draft with the session''s own model and shows an estimated before/after prompt quality score across six dimensions. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '用当前会话模型重写输入框草稿，并给出优化前后六维提示词质量估分对比。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
