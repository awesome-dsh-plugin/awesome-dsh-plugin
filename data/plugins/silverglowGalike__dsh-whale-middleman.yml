url: https://github.com/silverglowGalike/dsh-whale-middleman
name: silverglowGalike/dsh-whale-middleman
category: workflow
description:
  en: 'A middle layer for semi-automated work in DeepSeek Harness: the main session records the design interview and risks, splits the converged design into dependency-tracked draft tickets, and after manual approval in the panel dispatches each ready ticket to a separate session; child sessions return a self-assessment, and only a done report unlocks successors.'
  zh: 'DSH 中台：主会话记录设计盘问与风险，把收敛后的设计拆成带依赖的草稿工单，在面板中人工批准后把就绪工单派给独立子会话；子会话交回自评与汇报，只有 done 会解锁后继工单。'
