url: https://github.com/huajikano/dsh-gatekeeper
name: huajikano/dsh-gatekeeper
category: session
description:
  en: 'Inspects the model''s streamed reply before it is committed and either discards it or holds it for review when it reads as a refusal, so that text does not stay in the session context. Detection combines built-in phrase rules (an opening refusal, a capability denial, policy wording, first-person intent, refusals quoted in reasoning) with a plain-text word list and optional regular expressions. Interception can sit at the llm/stream waterfall, at the HTTP fetch layer before encryption (not TLS decryption, and it cannot tell which session a call belongs to), at both, or in a preview mode that shows a transient preview while the original chunks stay in memory until the whole reply has been checked. The same plugin also guards tool calls on tools/pre-execute: a command that deletes a drive, filesystem or user-profile root, formats or repartitions a volume, empties the Recycle Bin, fetches and executes a remote script, or writes to a raw device is denied, and a recursive delete outside build directories is recorded by default. Each tier can be set to deny, ask, record, or off, and the disk guard has its own switch. Both halves are heuristics: they can miss phrasings, the disk guard sees the arguments of a call rather than what a running script does, and they fail open.'
  zh: '在模型的拒绝性回复提交进会话之前检查并处理：丢弃或暂存待你放行，避免这段文字留在会话上下文里。判定用内置短语规则（开头拒绝语、能力否认、政策措辞、第一人称拒绝意图、思考中引用的拒绝句）加自定义词库与可选正则。拦截位置可在 llm/stream、加密前的 HTTP fetch 层（不是 TLS 解密，也拿不到调用属于哪个会话）、两者同时，或「实时预览」模式——原始 chunk 先留在内存，整段输出检查通过后才提交。同一个插件还在 tools/pre-execute 上守工具调用：删除盘符根、文件系统根或用户目录，格式化或重新分区，清空回收站，下载即执行，写裸设备这类命令会被拒绝；构建目录之外的递归删除默认只记录。两档都可设为拒绝、先问我、记录或不处理，磁盘保护另有总开关。两部分都是启发式规则：可能漏掉某些说法；磁盘保护只看得到调用参数，看不到正在运行的脚本内部；出错时一律放行。'
