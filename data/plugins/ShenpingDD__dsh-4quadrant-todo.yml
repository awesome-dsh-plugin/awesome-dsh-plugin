name: ShenpingDD/dsh-4quadrant-todo
category: ui
description:
  en: 'Four-quadrant todo board for the desktop sidebar: drag between quadrants, due dates, reminders, per-workspace stats and optional Feishu sync. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '桌面侧栏的四象限待办看板：象限间拖拽、截止时间与提醒、按工作区统计，可选飞书同步。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/ShenpingDD/dsh-4quadrant-todo/main/assets/icon-180.png
