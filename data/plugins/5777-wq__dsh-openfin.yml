description:
  en: 'Native DeepSeek Harness surfaces for markets and finance education: a full page with live A-share and global quotes (11 indices, commodities, crypto and FX), a market-cap heatmap of up to 96 A-share industry sectors, movers and market news, plus 25 plain-language articles and a 293-term glossary; and a floating, draggable, translucent quote card with a searchable instrument picker (the eleven built-in quotes plus any A-share, HK or US stock by name or code, e.g. Kweichow Moutai), selectable opacity, and a boss key that hides the card and the optional always-on-top desktop window instantly. The plugin Host half fetches public quotes server-side, so no API key and no browser CORS workaround are needed. The plugin Host half fetches public quotes server-side, so no API key and no browser CORS workaround are needed.'
  zh: 'DSH 原生行情与金融科普界面：整页包含 A股与全球行情（11 个指数/商品/加密/外汇标的）、最多 96 个 A股行业板块的市值热力图、异动榜、财经快讯，以及 25 篇白话金融文章与 293 条词典；另有一张可拖动、可调透明度的悬浮行情卡：内置 11 个标的之外，还能按名称或代码搜索任意 A股/港股/美股（如贵州茅台）加入自选，并带一个让悬浮卡与桌面置顶小窗瞬间隐藏的防老板快捷键。行情由插件 Host 半场在服务端抓取，不需要 API key，也没有浏览器 CORS 问题。'
