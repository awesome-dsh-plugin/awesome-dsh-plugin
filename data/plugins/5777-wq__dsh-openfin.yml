description:
  en: 'Native DeepSeek Harness surfaces for markets and finance education: a full page with live A-share and global quotes (11 indices, commodities, crypto and FX), a market-cap heatmap of up to 96 A-share industry sectors, movers and market news, plus 25 plain-language articles and a 293-term glossary; and a floating, draggable, translucent quote card with selectable instruments and opacity that can also run as an always-on-top desktop window. The plugin Host half fetches public quotes server-side, so no API key and no browser CORS workaround are needed.'
  zh: 'DSH 原生行情与金融科普界面：整页包含 A股与全球行情（11 个指数/商品/加密/外汇标的）、最多 96 个 A股行业板块的市值热力图、异动榜、财经快讯，以及 25 篇白话金融文章与 293 条词典；另有一张可拖动、可调透明度的悬浮行情卡，可切换显示品种，也能作为桌面置顶小窗常驻。行情由插件 Host 半场在服务端抓取，不需要 API key，也没有浏览器 CORS 问题。'
