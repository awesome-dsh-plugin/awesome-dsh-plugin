url: https://github.com/ZhongqiXiao/dsh-visual-annotator
name: ZhongqiXiao/dsh-visual-annotator
category: browser
description:
  en: Annotate elements on real Chrome and Edge pages, then send selectors, comments and screenshots to the agent for visual front-end editing. Published on npm — install with `dsh plugin --profile web add dsh-visual-annotator` or `dsh plugin --profile desktop add dsh-visual-annotator`.
  zh: 在真实 Chrome/Edge 页面上拾取、标注、评论并截图元素，把定位、评论与截图一并交给 agent 做前端可视化修改。已发布 npm——`dsh plugin --profile web add dsh-visual-annotator` 或 `dsh plugin --profile desktop add dsh-visual-annotator` 一键安装。
icon: https://raw.githubusercontent.com/ZhongqiXiao/dsh-visual-annotator/main/assets/icon-180.png
tarball: https://github.com/ZhongqiXiao/dsh-visual-annotator/releases/latest/download/dsh-visual-annotator.tgz
