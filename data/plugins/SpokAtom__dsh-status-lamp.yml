description:
  zh: '侧栏会话行状态灯：空闲蓝点、挂起灰空心（手动标记，或 5 天无对话自动）、归档灰实心；「视图选项 → 筛选会话」第一项可一键隐藏归档与挂起。原生待审批、进行中、有新结果灯保持不变。'
  en: 'Sidebar session-row status lamp: blue dot for idle, hollow ring for parked (manual, or automatic after 5 days without conversation), solid grey dot for archived; the first item under View options → Filter sessions hides archived and parked sessions. Native pending, running and unread lamps stay unchanged.'
