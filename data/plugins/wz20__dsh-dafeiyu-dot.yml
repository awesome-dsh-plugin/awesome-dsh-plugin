name: wz20/dsh-dafeiyu-dot
category: fun
description:
  en: "A whale companion with configurable roles, emotional speech through local TTS, persistent file-based memory, QQ messaging, and half-duplex voice calls. QQ requires a NapCatQQ-compatible OneBot v11 gateway, and the emotional voice requires a local VoiceStudio + audio.cpp + Breeze TTS 2 stack (or a compatible TTS API); FFmpeg is needed for non-1x speech speed."
  zh: "提供角色配置、本地情绪语音、文件持久记忆、QQ 消息与半双工语音通话的鲸鱼娘陪伴插件。QQ 需搭配兼容 OneBot v11 的 NapCatQQ 网关；情绪语音需本地 VoiceStudio + audio.cpp + Breeze TTS 2 链路（或兼容 TTS API），非 1 倍语速时还需 FFmpeg。"
