url: https://github.com/xswt442-cmd/dsh-instance-manager
name: xswt442-cmd/dsh-instance-manager
category: dev
description:
  en: 'DSH instance manager: lists local dsh web instances on each port (port, PID, uptime, live sessions, memory, version); starts an instance on a free or named port; stops one or all through the exit of each instance; a peer can be configured to list instances on other machines.'
  zh: 'DSH 实例管理器：列出各端口上的本机 dsh web 实例（端口、PID、运行时长、活动会话数、内存、版本）；可在空闲或指定端口启动新实例；通过实例自身的退出来停止单个或全部实例；可配置 peer 以列出其他机器上的实例。'
