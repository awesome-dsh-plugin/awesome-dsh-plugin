name: sanqiPanax/dsh-sticker-board
category: ui
description:
  en: 'Fridge-magnet quick-task stickers docked above the composer: one-click sends a preloaded prompt into the current session, grouped long-term/short-term.'
  zh: 输入框上方的冰箱贴纸栏：把常用任务（科技新闻、GitHub 推荐等）做成贴纸，点击即向当前会话发送预置 prompt 并执行，按长期/短期分组。
  ja: コンポーザーの上に置く、冷蔵庫のマグネットのようなクイックタスクのステッカー。ワンクリックで用意しておいたプロンプトを現在のセッションに送れ、長期用と短期用にグループ分けできます。
