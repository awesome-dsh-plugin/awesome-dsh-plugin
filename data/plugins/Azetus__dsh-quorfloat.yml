url: https://github.com/Azetus/dsh-quorfloat
name: Azetus/dsh-quorfloat
category: ui
description:
  en: 'System-level desktop floating-window plugin for DeepSeek Harness (DSH): a global hotkey opens a floating window; the plugin supports workspace and session switching, approval and follow-up handling, and export of its own diagnostic logs for plugin troubleshooting.'
  zh: 'DeepSeek Harness（DSH）的系统级桌面悬浮窗插件：按下全局快捷键即可呼出桌面悬浮窗口，支持工作区与会话切换、审批与追问处理，以及插件自身的诊断日志导出。'
