url: https://github.com/huziouziou/dsh-paper-lens
name: huziouziou/dsh-paper-lens
category: docs
description:
  en: >-
    Paper Lens adds a PDF reading sidebar to DeepSeek Harness: select text to
    translate it in 10 languages, quote passages into the chat, annotate, and
    optionally translate with a local llama.cpp model.
  zh: >-
    Paper Lens 在 DeepSeek Harness 右侧边栏打开 PDF：划词翻译（10 种语言）、把选中的段落引用进对话、批注，并支持本地 llama.cpp 模型翻译。
