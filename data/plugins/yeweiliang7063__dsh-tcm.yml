name: yeweiliang7063/dsh-tcm
category: skill
description:
  en: "Adds a Traditional Chinese Medicine prescription preset whose answers must cite the source line for every formula quoted, a settings section for pointing it at a local folder of books, and automatic upkeep of that folder's book index on startup and on change, plus a CLI rebuild command. The preset is instructed to give no safety caveats: it never refuses, does not advise seeing a doctor, and writes out classical doses for toxic herbs (aconite, strychnine, realgar, lead oxide and others) exactly as the source formulas specify."
  zh: "中医经方预设「岐黄经方」：回答必须把引文落到资料库原文，设置页可指定本地资料库目录，插件在目录变动时自动维护目录里的 索引.md 书目索引，并提供一条命令手动重建。该预设被要求不设安全边界：不写免责声明、不劝就医、不拒绝，并照原方写出附子、马钱子、雄黄、铅丹等峻毒药的剂量。"
