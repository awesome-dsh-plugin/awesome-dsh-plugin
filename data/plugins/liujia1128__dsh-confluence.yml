description:
  en: 'Read, search, create, update, move, and delete Confluence pages, comments, attachments, and content properties through 29 typed tools, plus a settings page for the site, credentials, and write approval. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '用 29 个类型化工具读写 Confluence 页面、评论、附件与内容属性，并提供设置页配置站点、凭据与写权限审批。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
