name: Jason-KK-kk/classics-guide
category: skill
description:
  en: 'Classics-reading companion skill for Confucian, Buddhist and Daoist texts: a 30-lesson curriculum with spaced retrieval review, 29 guided readings, a bundled library of 23 full-text files, and a sage-dialogue mode that answers "how would X see my situation" with labeled hypothetical answers and one small action. Quotes only from the bundled texts or user-provided originals.'
  zh: '儒释道经典陪读技能：三十次课表配间隔检索复习，二十九篇精讲，内置 23 个全本原文文件；对谈模式按圣贤内核推演"某某会怎么看我这件事"，标拟答并落一步行动。引文只出自内置原文或用户提供的原文。'