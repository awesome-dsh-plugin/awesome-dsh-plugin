description:
  en: Global and per-session prompt templates in a right-side panel — insert into the draft or send now, edit, promote session templates to global, with SQLite persistence via the built-in node:sqlite.
  zh: 右侧面板中的全局与会话级提示词模板——插入草稿或立即发送、编辑、会话模板提升为全局，SQLite 持久化走内置的 node:sqlite。
