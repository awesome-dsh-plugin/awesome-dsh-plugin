url: https://github.com/Mr54233/dsh-restart-now
name: Mr54233/dsh-restart-now
category: dev
description:
  en: 'One-click restart (or close-only) for the DSH desktop client from six entries: a sidebar panel, the sidebar footer, the conversation header, a Windows title-bar menu item, a Settings → General row, and the /restart slash command. The five UI entries can be toggled individually; the slash command is always available. Before stopping, the helper verifies the target process identity and can wait for running tasks (plugin installs are hard-blocked). Settings save live with an official toast, a read-only preflight snapshot shows what a restart would affect, and results land in a receipt. Windows and macOS.'
  zh: 'DSH 桌面版一键重启（含仅关闭），六个入口：侧栏面板、侧栏底部、会话标题栏、Windows 顶部菜单项、设置 → 通用行、斜杠命令 /restart；五个界面入口可逐项开关，斜杠命令始终可用。停止前助手核验目标进程身份，可等待进行中的任务（插件安装中硬拦）；设置实时保存并有官方 toast 反馈，只读预检可查看重启将影响的状态，结果写成回执。支持 Windows 与 macOS。'
