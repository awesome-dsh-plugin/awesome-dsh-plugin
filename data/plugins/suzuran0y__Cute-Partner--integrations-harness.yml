name: 'suzuran0y/Cute-Partner#cute-partner'
category: fun
description:
  en: 'Brings Harness conversations and tasks into a Live2D character on the Windows desktop, with drawer-based memory. The desktop app includes the whale girl 哦鲸鲸 as its default character. The modular design supports optional voice components for voice conversations and custom character voices.'
  zh: '把 Harness 的对话和任务交互集成到 Windows 桌面上的 Live2D 角色中，采用抽屉式记忆设计。桌面程序默认搭载大肥鱼「哦鲸鲸」。角色功能采用模块化设计，语音组件按需安装，支持语音交流和自定义角色音色。'
icon: 'https://raw.githubusercontent.com/suzuran0y/Cute-Partner/f42e49a6ab6c24a747dc6b35e44cf8f613297d85/apps/desktop/assets/character-icon.png'
