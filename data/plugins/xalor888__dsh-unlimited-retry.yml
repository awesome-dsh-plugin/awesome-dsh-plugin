url: https://github.com/xalor888/dsh-unlimited-retry
name: xalor888/dsh-unlimited-retry
category: model
description:
  en: 'Retries a model request that no other recovery layer claimed, but only for the failure codes the Harness itself declares retryable, with an exponential backoff ceiling and a hard per-turn cap, never retrying a cancellation; the policy is editable from a Settings panel.'
  zh: '只对 Harness 自己认定可重试的错误码，重试没有其它恢复层接手的模型请求；退避有上限、每轮有硬上限，且永不重试取消；策略可在设置面板中编辑。'
icon: https://raw.githubusercontent.com/xalor888/dsh-unlimited-retry/master/assets/icon-180.png
