url: https://github.com/xalor888/dsh-unlimited-retry
name: xalor888/dsh-unlimited-retry
category: model
description:
  en: 'Retries a model request that no other recovery layer claimed, but only for failures that can clear: the codes the Harness itself declares retryable, plus an unfamiliar code whose message shows a transient condition. Exponential backoff with a ceiling and a hard per-turn cap; never retries a cancellation; the policy and every refusal are visible in a Settings panel.'
  zh: '只对「可能恢复」的失败重试没有其它恢复层接手的模型请求：Harness 自己认定可重试的错误码，以及信息显示为瞬时故障的陌生错误码。退避有上限、每轮有硬上限，永不重试取消；策略与每一次拒绝都在设置面板中可见。'
icon: https://raw.githubusercontent.com/xalor888/dsh-unlimited-retry/master/assets/icon-180.png
