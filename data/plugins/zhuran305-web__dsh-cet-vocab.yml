description:
  en: 'CET-4/CET-6 vocabulary trainer in a draggable, minimizable floating window: 5,805 words bundled from ECDICT; flip cards graded known/fuzzy/unknown and multiple-choice quizzes with look-alike distractors; Ebbinghaus spaced repetition; configurable daily quota; online human US/UK pronunciation with offline TTS fallback; an ambient "loop reading" mode (word / word+meaning / word→meaning→word, with example sentences from a dictionary API + Tatoeba). v0.2.4 adds a "Cut" action that moves mastered words into a low-frequency maintenance pool with 15/30/60-day checks and recall instead of deleting them, a maintenance-check badge, and a UI polish pass (design tokens, fewer borders, consistent focus/press feedback, reduced-motion support). Progress and window geometry stay in the browser profile and survive updates.'
  zh: '四六级背单词悬浮窗：窗口可拖动、可最小化并记住位置；内嵌 ECDICT 提取的 5805 词；翻卡三键评分与形近词干扰的选择题；艾宾浩斯间隔复习、到期复习与加练；每日新词数可调；在线真人美/英发音，断网回落本地 TTS；另有「循环朗读」（只读单词/词+翻译/词→译→词，例句来自词典 API 与 Tatoeba 语料双渠道）。v0.2.4 新增「斩单词」（斩掉的词转入低频维护池，按 15/30/60 天抽查并可召回，不删除不毕业）、维护抽查角标，以及界面精修（设计令牌统一、减少重复边框、统一焦点与按压反馈、支持减少动态效果）。进度与窗口位置保存在浏览器配置里，更新不会覆盖。'
