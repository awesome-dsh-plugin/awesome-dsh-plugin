url: https://github.com/Manbaout-08/dsh-purge
name: Manbaout-08/dsh-purge
category: session
description:
  en: 'Adds permanent delete to the session menu: removes the session log files from disk, or deletes a whole workspace together with all of its sessions through the host registry. Also ships a /purge command. Unrelated to the prompt-patching dsh-purge plugins also listed here, but it uses the same dsh-purge row id and /purge command, so do not install both.'
  zh: '在会话菜单中加入彻底删除：把会话日志文件从磁盘移除，或经宿主注册表删除整个工作区及其全部会话；另提供 /purge 命令。与本列表中其他同名 dsh-purge（提示词补丁类）插件无关，但使用相同的 dsh-purge 行 id 和 /purge 命令，请勿同装。'
