description:
  en: 'Code security workbench and 10 secure_* tools: scan files, directories or Git diffs with deterministic rules and secret entropy checks, audit dependency manifests offline or via OSV, inspect redacted evidence, re-verify fixes on the same scope, export Markdown/SARIF reports, and optionally connect Betterleaks, Semgrep CE or OSV-Scanner; 5 switchable workbench themes.'
  zh: '代码安全工作台与 10 个 secure_* 工具：对文件、目录或 Git 改动执行确定性规则与密钥熵检查，支持依赖清单离线或 OSV 漏洞审计、脱敏证据查看、同范围修复复查与 Markdown/SARIF 报告导出，可选接入 Betterleaks / Semgrep CE / OSV-Scanner，内置 5 套工作台主题。'
