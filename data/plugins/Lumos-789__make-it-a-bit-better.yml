description:
  en: 'Autonomous product-polish loop skill: every round opens a fresh brainstorm from 3 forced perspectives, picks one small angle capped at ≤3 files and ≈100 lines, implements it, verifies with the repo''s own tests, build or lint, and commits it as a single round commit; the round is logged to a per-project ledger that a bundled checker validates, ideas too big for one round go to an icebox, and unpicked small ones wait in a backlog. A red check ships nothing — the round commit is reverted immediately so the failed diff stays in history. Git mode needs the repository root; non-git directories or single files are polished only in the opt-in no-git mode, backed up instead of committed. No MCP server, no runtime dependencies; the checker needs Node 18.13+. Requires DSH 0.2.1-rc.2 or newer, below 0.3.0.'
  zh: '自主产品打磨循环技能：每轮强制开一轮全新三视角头脑风暴，选一个 ≤3 文件 / ≈100 行的小角度实现，用仓库自身的测试、构建或 lint 验证后以单个 commit 提交；轮次记入项目内 ledger（自带校验器每轮核对），一轮装不下的好想法进 icebox，没被选中的小候选进待选池。检查红灯不发版——先提交再立即 revert，失败 diff 留在历史。git 模式要求仓根目录；非 git 目录或单个文件仅在点名开启的 no-git 模式下打磨，以备份代替 commit。无 MCP 服务、无运行时依赖；校验器需要 Node 18.13+。要求 DSH 0.2.1-rc.2 或更新、低于 0.3.0。'
