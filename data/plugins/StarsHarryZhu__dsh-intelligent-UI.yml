url: https://github.com/StarsHarryZhu/dsh-intelligent-UI
name: StarsHarryZhu/dsh-intelligent-UI
category: ui
description:
  en: 'Interactive cards in replies, built from a fixed catalog of 27 components (sliders, inputs, tables, charts, function plots, typeset formulas, quiz buttons, an animation player): controls recompute in the browser without another model call, the model never writes HTML or JavaScript, and a calculus engine (integrals, derivatives, limits, sums, roots, Taylor polynomials) plus a bundled skill guide the model. Needs DeepSeek Harness >= 0.2.1-alpha.1.'
  zh: '渐进式交互：回复里的可交互卡片，由 27 个固定组件搭成（滑块、输入框、表格、图表、函数图像、公式排版、答题按钮、动画播放器）。调节控件在浏览器内重算、不再调用模型，模型不写任何 HTML 或 JavaScript；内置微积分引擎（定积分、导数、极限、求和、求根、泰勒多项式）和一个教模型用法的技能。需要 DeepSeek Harness >= 0.2.1-alpha.1'
