description:
  en: 'Requirement-driven dsh plugin discovery and environment recipes: plugin_guide matches natural-language needs to a curated plugin directory with reasons and install commands; recipe installs whole setups (通知全家桶, 安全审计套装...) from bundled community bundles with ordered plans.'
  zh: 需求型插件导购与环境配方：plugin_guide 按自然语言需求语义匹配精选插件并给出理由与安装命令；recipe 一键安装整套社区配方（通知全家桶、安全审计套装等），带有序安装计划。
  ja: 要望起点の dsh プラグイン探索と環境レシピ。plugin_guide が自然言語の要望を厳選プラグイン一覧に突き合わせ、理由とインストールコマンドを提示します。recipe は同梱のコミュニティバンドル（通知全家桶、安全审计套装 など）から環境一式を手順どおりに導入します。
