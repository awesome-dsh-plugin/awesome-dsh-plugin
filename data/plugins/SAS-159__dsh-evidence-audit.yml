name: SAS-159/dsh-evidence-audit
category: session
description:
  en: 'Checks the agent’s own claims against the tool output saved in the same session: each sentence carrying a path, a number with a unit, inline code or a URL is graded supported, partial or no evidence, with the anchors it could not find listed. Coverage shows on the composer pill. Heuristic and local — no LLM call, no receipt log, nothing uploaded.'
  zh: '把 Agent 的结论对回同一会话里工具真实返回的内容：含路径、带单位数字、行内代码或 URL 的句子被判定为有据 / 部分有据 / 无据，并列出找不到的锚点。覆盖率显示在输入框胶囊上。纯本地启发式匹配，不调模型、不是日志存证、不上传任何内容。'
icon: https://raw.githubusercontent.com/SAS-159/dsh-evidence-audit/main/assets/icon-180.png
