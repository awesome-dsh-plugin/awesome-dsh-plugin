name: morning-start/dsh-plugin-creator
category: dev
description:
  en: 'Adds a plugin-development toolkit to Creator mode: scaffold a plugin from a template, structural, privacy and security checks, project-declared rules, isolated sandboxes, browser-driven UI assertions, and release readiness with a sandbox rehearsal.'
  zh: '在创造模式中加入插件开发工具链：按模板起插件包、结构与隐私安全检查、项目自定义规则、隔离沙盒、浏览器驱动的 UI 断言，以及带沙盒演练的发版检查。'
