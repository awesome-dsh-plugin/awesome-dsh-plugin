description:
  en: "Polza.ai routes in the model picker: one OpenAI-compatible gateway (https://polza.ai/api/v1) declared as five sections — text, architecture, design, images and video; the key is read from POLZA_AI_API_KEY in the credential store. A settings card edits each section's shortcode, creates user-defined sections as extra provider routes, and links to the key page (author referral link, disclosed)."
