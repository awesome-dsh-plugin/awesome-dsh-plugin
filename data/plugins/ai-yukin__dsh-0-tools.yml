description:
  en: 'One-click free-model setup for DSH web, built for coding beginners: one-click installer for Windows (install.bat) and macOS/Linux (install.sh, v1.7.0+); Zhipu GLM free text + image models, plus the OpenRouter free model pool (one key, ~27 dynamically-updated free models auto-picked, retired ones auto-routed-around); bottom-left setup hint hides once any free model is connected; real-time DeepSeek peak/off-peak pricing reminder; bundled beginner help center.'
  zh: DSH Web 小白零门槛零费用套件：一键安装支持 Windows（install.bat）和 macOS/Linux（install.sh，v1.7.0 起）；一键接入智谱双免费模型（文本+图片）及 OpenRouter 免费模型池（一个 Key 通吃约 27 款动态更新的免费模型，自动挑选、下架自动绕开）；接入任一免费模型后左下角配置提示自动隐藏；含 DeepSeek 计价时段提醒、内置新手帮助中心。
