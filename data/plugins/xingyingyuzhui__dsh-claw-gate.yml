url: https://github.com/xingyingyuzhui/dsh-claw-gate
name: xingyingyuzhui/dsh-claw-gate
category: security
description:
  en: Claw tool gate with one-shot approval and audit. Workspace sessions are not filtered by this plugin. Hard deps (install together or single install fails): dsh-claw-permissions, dsh-claw-observability.
  zh: Claw 工具闸，含一次性审批与审计。工作区会话不受本插件过滤。硬依赖（需同装，否则单装会崩）：dsh-claw-permissions、dsh-claw-observability。
