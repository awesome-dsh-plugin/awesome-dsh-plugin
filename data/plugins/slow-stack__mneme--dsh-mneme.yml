name: slow-stack/mneme#dsh-mneme
category: memory
description:
  en: "Your AI assistant remembers you. Long-term memory that never leaves your machine: every session is distilled into a local database, with a Markdown copy you can open and edit by hand. While you are away it tidies up after itself — merging duplicates and freezing contradictions until you decide. Every memory keeps its provenance: which conversation it came from, when it changed, who touched it. It also remembers how a moment felt and what was in a picture, and other plugins can write their own memories in through an API. Ten tools, an MCP server, a CLI, and a memory panel you can browse and search."
  zh: "你的 AI 助手会记得你。跨会话长期记忆，全部存在你自己的电脑上：每段对话自动整理成本地数据库，旁边配一份你能直接打开、直接改的 Markdown。你不在的时候它自己整理——重复的合并，互相矛盾的先冻住，等你回来裁决。每条记忆都带着来历：从哪句话来的、什么时候改过、被谁动过。它也记得某件事当时你的情绪，记得一张图里有什么；别的插件想把记忆写进来，走 API 就行。附 10 个工具、一个 MCP 服务端、一个命令行，还有一块能翻能搜的记忆面板。"
