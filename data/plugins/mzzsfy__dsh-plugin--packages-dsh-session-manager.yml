url: https://github.com/mzzsfy/dsh-plugin/tree/main/packages/dsh-session-manager
name: mzzsfy/dsh-plugin#dsh-session-manager
category: session
description:
  en: 'Session lifecycle: auto-archives sessions older than a configurable threshold (the check interval is configurable too), and an archive panel lists archived sessions for unarchive or deletion; deletion moves the session artifacts to the OS recycle bin, falls back to a plugin-managed quarantine directory where no recycle bin is available, and a ledger re-attaches a session whose artifacts were restored.'
  zh: '会话生命周期:按可配置阈值与检查周期自动归档超期会话,归档面板支持取消归档与删除;删除把会话产物移入系统回收站,无回收站的环境降级到插件回收区,台账可把已还原的会话重新挂载。'
icon: https://raw.githubusercontent.com/mzzsfy/dsh-plugin/main/assets/icons/png/dsh-session-manager.png