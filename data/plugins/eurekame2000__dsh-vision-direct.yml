url: https://github.com/eurekame2000/dsh-vision-direct
name: eurekame2000/dsh-vision-direct
category: vision
description:
  en: 'Self-contained vision for text-only DSH models: registers its own vision_read_image tool (verbatim OCR, reading-order layout, semantics, uncertainty), turns pasted images into local file paths through a capture-phase paste channel with rolling storage, and optionally exposes a loopback OpenAI/Anthropic-compatible endpoint for local clients. Talks to your own upstream directly, with no external vision CLI and no runtime dependency. Its settings/paste/image routes run the host''s own connection admission check (connection.requestRejection) on top of a loopback and same-origin fence, so requests that do not come from the app are refused; the optional gateway is a separate listener bound to 127.0.0.1 only.'
  zh: '给 DSH 的纯文本模型自带一双眼睛：注册自己的 vision_read_image 工具（逐字 OCR、阅读顺序版面、语义、不确定项），粘贴图片在捕获阶段转成本机路径并滚动保留最近若干张，另可选给本机客户端暴露一个 OpenAI/Anthropic 兼容端点；直接连接你自己的上游，不依赖任何外部视觉 CLI，也没有运行时依赖。设置、粘贴、读图几条路由在做任何事之前都先过宿主自己的连接准入检查（connection.requestRejection），再加上插件自建的回环与同源栅栏，不是应用本身发出的请求一律拒绝；可选的网关是另一个只绑定 127.0.0.1 的监听端口。'
