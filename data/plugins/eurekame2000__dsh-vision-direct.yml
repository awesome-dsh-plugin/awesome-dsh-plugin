url: https://github.com/eurekame2000/dsh-vision-direct
name: eurekame2000/dsh-vision-direct
category: vision
description:
  en: 'Self-contained vision for text-only DSH models: registers its own vision_read_image tool (verbatim OCR, reading-order layout, semantics, uncertainty), turns pasted images into local file paths through a capture-phase paste channel with rolling storage, and optionally exposes a loopback OpenAI/Anthropic-compatible endpoint. Talks to your own upstream directly, with no external vision CLI and no runtime dependency. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '给 DSH 的纯文本模型自带一双眼睛：注册自己的 vision_read_image 工具（逐字 OCR、阅读顺序版面、语义、不确定项），粘贴图片在捕获阶段转成本机路径并滚动保留最近若干张，另可选暴露一个本机 OpenAI/Anthropic 兼容端点；直接连接你自己的上游，不依赖任何外部视觉 CLI，也没有运行时依赖。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
