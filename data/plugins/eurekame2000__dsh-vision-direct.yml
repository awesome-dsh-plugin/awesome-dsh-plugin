url: https://github.com/eurekame2000/dsh-vision-direct
name: eurekame2000/dsh-vision-direct
category: vision
description:
  en: 'Self-contained vision for text-only DSH models: registers its own vision_read_image tool (verbatim OCR, reading-order layout, semantics, uncertainty), turns pasted images into local file paths through a capture-phase paste channel with rolling storage, and optionally exposes a loopback OpenAI/Anthropic-compatible endpoint. Talks to your own upstream directly, with no external vision CLI and no runtime dependency. Every HTTP route runs DSH''s own connection admission check before doing any work, so requests that are not from the app itself are refused.'
  zh: '给 DSH 的纯文本模型自带一双眼睛：注册自己的 vision_read_image 工具（逐字 OCR、阅读顺序版面、语义、不确定项），粘贴图片在捕获阶段转成本机路径并滚动保留最近若干张，另可选暴露一个本机 OpenAI/Anthropic 兼容端点；直接连接你自己的上游，不依赖任何外部视觉 CLI，也没有运行时依赖。每条 HTTP 路由在做任何事之前都会过 DSH 自己的连接准入检查，不是应用本身发出的请求一律拒绝。'
