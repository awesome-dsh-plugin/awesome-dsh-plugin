url: https://github.com/ZZR-rui-997/dsh-skills-workbench
name: ZZR-rui-997/dsh-skills-workbench
category: ui
description:
  en: >-
    A Skills workbench in the left sidebar: list the skills you own, switch model and user
    invocation with one click, search names, descriptions and bodies, check SKILL.md against the
    spec and fix what can be repaired safely, edit in place, create, import a folder or a .zip,
    move between user, agents and project roots, tag, and delete into a restorable trash. Switches
    are written back to SKILL.md frontmatter and the filesystem watcher reloads them without a
    restart; bundled and plugin-provided skills stay read-only and out of the list.
  zh: >-
    左侧栏的「技能」工作台：列出你自己安装或编写的技能，一键切换模型调用与用户调用，按名称/描述/正文全文搜索，
    按 SKILL.md 规范检查并修复可安全修的部分，就地编辑，新建，导入文件夹或 .zip，在用户/通用/项目三个根之间移动，
    打标签，删除进可恢复的回收站。开关写回 SKILL.md 的 frontmatter，文件监听会自动重载、无需重启；
    系统自带与插件提供的技能保持只读、不出现在列表里。
icon: https://raw.githubusercontent.com/ZZR-rui-997/dsh-skills-workbench/main/icon.png