url: "https://github.com/Wahwayhale/dsh-connect-doubao"
name: "Wahwayhale/dsh-connect-doubao"
category: model
description:
  en: 'Connects a Doubao account to DeepSeek Harness as a model provider after a single browser QR sign-in — the model list read live from the Doubao client menu (twelve entries, each with its billing multiplier and its own thinking-level ladder), the 「工作任务」 task-mode models that spend the paid membership quota, deep thinking on by default, Seedream image generation that prefers the original file over the watermarked variant, and a live quota panel covering the 5-hour, weekly and activity-grant windows, showing what is LEFT rather than what is used. Windows x64 only, since the session is sealed with DPAPI.'
  zh: '浏览器扫码登录一次即可把豆包账号接入 DeepSeek Harness：模型清单直接读豆包客户端菜单（十二条，每条带自己的倍率与思考档位）、「工作任务」模型（走会员付费额度）、默认开启的深度思考、Seedream 生图（优先取无水印原图），以及一块实时额度看板，涵盖 5 小时、周与活动赠送额度，显示「还剩多少」而不是「已用多少」。仅 Windows x64：会话用 DPAPI 密封在本机。'
icon: https://raw.githubusercontent.com/Wahwayhale/dsh-connect-doubao/main/docs/assets/dsh-connect-doubao-icon.png
