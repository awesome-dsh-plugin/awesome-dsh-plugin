description:
  en: "Native, instant region-screenshot button for the DeepSeek Harness composer: one click freezes the screen, a WeChat-style overlay (gray mask, green selection) appears, and the cropped PNG is inserted into the current draft. No ms-screenclip, about 10 ms per drag frame, and it coexists with voice input."
  zh: "输入框里的原生秒开截屏按钮：点一下冻结全屏，微信风格选区浮层（灰色遮罩、绿色边框），确认后截图自动插入当前会话草稿。不调用系统截图浮层，拖动约 10ms/帧，与语音输入并排共存。"
