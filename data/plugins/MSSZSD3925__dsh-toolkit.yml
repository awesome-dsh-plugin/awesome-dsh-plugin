url: https://github.com/MSSZSD3925/dsh-toolkit
name: MSSZSD3925/dsh-toolkit
category: tools
description:
  en: "Five DSH utilities in one plugin: drive existing sessions over QQ (needs an OneBot 11 implementation such as NapCat running alongside), ask another session a question with a context guard, pause the running turn, restart DSH on Windows with optional auto-resume (via the install-restart.ps1 scheduled task), and inject peak-hour token discipline."
  zh: "五个 DSH 小功能合一个插件：用 QQ 远程驾驶已有会话（需本机另跑 OneBot 11 实现，如 NapCat）、向另一个会话提问（带上下文守卫）、界面暂停按钮、在 Windows 上重启 DSH 并可选自动续跑（依赖 install-restart.ps1 创建的计划任务）、贵时段纪律注入。"
tarball: https://github.com/MSSZSD3925/dsh-toolkit/releases/download/v0.4.1/dsh-toolkit-0.4.1.tgz
