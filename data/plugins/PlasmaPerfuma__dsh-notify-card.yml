url: https://github.com/PlasmaPerfuma/dsh-notify-card
name: PlasmaPerfuma/dsh-notify-card
category: notify
description:
  en: Floating approval window for DeepSeek Harness that appears when you leave the app and hands the request back to the native card when you return. Windows-only (WPF via PowerShell). Independent fork of zeta987/dsh-notify-zeta (MIT); do not run alongside the upstream.
  zh: DeepSeek Harness 的独立审批浮窗：离开应用时弹出，切回时把请求交还原生卡片。仅 Windows（WPF/PowerShell）；独立分支自 zeta987/dsh-notify-zeta（MIT），不能与上游同时运行。
