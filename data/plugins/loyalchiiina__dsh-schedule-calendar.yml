url: https://github.com/loyalchiiina/dsh-schedule-calendar
name: loyalchiiina/dsh-schedule-calendar
category: ui
description:
  en: 'Schedule assistant in one panel: today plan, calendar, to-dos, weather, an almanac and horoscope block you can switch off, a daily check-in, and automatic daily and weekly reports built from what you actually finished. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '日程助手一个面板搞定：今日安排、日历、待办、天气，可开关的黄历与星座运势，每日签到攒运气，并按实际完成情况自动生成日报与周报。适配 DSH 内核 0.2.2-rc.1。'
