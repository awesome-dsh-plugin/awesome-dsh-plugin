url: https://github.com/loyalchiiina/dsh-schedule-calendar
name: loyalchiiina/dsh-schedule-calendar
category: ui
description:
  en: 'Sidebar schedule assistant for dsh-better-sidebar (required: the tab registers through it; DSH 0.2.2+): a today view with city weather refreshed at 8:30 / 12:00 / 17:30, an almanac and a collapsible horoscope block; a lunar month calendar whose cells let the wallpaper show through; events and to-dos; daily and weekly reports and a daily check-in; per-person rest-day schemes with an off-work countdown. A multi-account mail client for QQ Mail and Foxmail (@qq.com / @foxmail.com, both using imap.qq.com / smtp.qq.com and an app password): IMAP receive + SMTP send, seven tabs, search, star / spam / trash with restore, read-unread state, drafts, group send with a per-mail interval, and attachments in both directions — clickable links in message bodies open in the system browser. Reminders (sitting / water / eye-care / music) appear as in-app capsules floating above the whole DSH client with adjustable dwell time (3-60 s) and position, optional Windows notifications and a manual preview button. A rotating wallpaper appearance (sequential or shuffled), adjustable opacity and frosted glass, and adjustable text colour. Data stays local and is never uploaded. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '给 dsh-better-sidebar 用的侧边栏日程助手（必须先装该插件；需 DSH 0.2.2+）：今日一屏（天气每天 8:30 / 12:00 / 17:30 定点刷新、黄历、可折叠星座运势）；农历月历（格子可透出壁纸）；日程与待办；日报周报与每日签到；按人设置班制与上下班倒计时。多账号邮箱客户端，支持 QQ 邮箱与 Foxmail 邮箱（@qq.com / @foxmail.com，同一套 imap.qq.com / smtp.qq.com，授权码登录）：IMAP 收信 + SMTP 发信、七个页签、搜索、星标 / 垃圾 / 垃圾箱（可还原）/ 已读未读、草稿箱、可按间隔群发、附件双向收发，正文网址可直接用系统浏览器打开。久坐 / 喝水 / 护眼 / 听音乐提醒以界面内「胶囊」浮在整个 DSH 界面之上，停留秒数（3~60 秒）与位置可调，可选同时推 Windows 通知，并支持手动预览。壁纸轮播（顺序或随机洗牌）、透明度与磨砂、界面文字颜色均可调。数据全部本地保存，不上传云端。适配 DSH 内核 0.2.2-rc.1。'
