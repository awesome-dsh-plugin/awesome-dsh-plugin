url: https://github.com/loyalchiiina/dsh-schedule-calendar
name: loyalchiiina/dsh-schedule-calendar
category: ui
description:
  en: 'Sidebar schedule assistant for dsh-better-sidebar (that plugin is required — the tab is registered through it): multi-city weather, Chinese almanac, lunar calendar, schedules and reminders, todos, daily and weekly reports, zodiac horoscope, check-in buffs, and per-person rest-day work schedules.'
  zh: '给 dsh-better-sidebar 用的侧边栏日程助手（必须先装该插件，标签页由它注册）：多城市天气、黄历、农历日历、日程提醒、待办、日报周报、星座运势、好运签到，以及按人设置的休息日班制。'