url: https://github.com/mengnanxyyyy/dsh-markdown-xyy
name: 对话快速阅读（dsh-markdown-xyy）
category: theme
description:
  en: 'Chat text in DSH reads flat by default — headings, quotes, emphasis, code and tables all sit at one level, so long conversations are hard to scan. This lightweight theme plugin pulls those layers apart with color and typography: 4 built-in themes with light and dark variants that follow the system, your own theme as a CSS file dropped into a folder, and a built-in editor with syntax highlighting and save-time validation — the choice survives reloads and new tabs. Colors and Markdown hierarchy only — fonts and message spacing stay with DSH. Also ships a version-history panel. Windows and DSH Desktop supported.'
  zh: 原生对话是「平」的：标题、引述、重点、代码与表格挤在同一层，长对话读得慢、效率低。本插件以轻量级主题拉开这些元素的层次与配色，让对话内容扫一眼就能抓到主线——4 套内置主题（浅/深双档，随系统切换）；往 ~/.dsh/web-themes-xyy 放一个 CSS 就是新主题，或用内置编辑器（语法高亮 + 保存校验）直接改，选中主题刷新与新标签页后仍在。只调配色与 Markdown 排版，字体与消息间距仍交给 DSH。附版本台账面板；支持 Windows 与 DSH Desktop。
