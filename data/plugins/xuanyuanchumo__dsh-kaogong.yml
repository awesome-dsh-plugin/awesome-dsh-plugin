url: https://github.com/xuanyuanchumo/dsh-kaogong
name: xuanyuanchumo/dsh-kaogong
category: tools
description:
  en: 'Offline civil-service exam study panel integrating 16 upstream open-source question banks with SRS wrong-book, mock exams, essay grading, an interactive knowledge graph and whitebox observability. It also ships a HuaSheng-13 methodology library (25 documents) with BM25 search. The npm package ships no question-bank or corpus data: after install, the required set (about 360 MB) is cloned from the question-bank manager (all 16 upstream repos are about 2.2 GB).'
  zh: '离线公务员备考学习面板，整合 16 个上游开源题库，提供 SRS 错题本、整卷模考、申论离线评改、可交互知识图谱与白盒可观测，并内置花生十三体系方法论库（25 篇语料）与 BM25 检索。npm 包不含题库与语料数据：安装后需在题库管理里克隆必选包（约 360 MB，16 个上游仓库全量约 2.2 GB）。'
icon: https://raw.githubusercontent.com/xuanyuanchumo/dsh-kaogong/main/assets/icon-180.png