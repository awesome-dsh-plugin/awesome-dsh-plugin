description:
  en: 'Token and cost dashboard for DeepSeek Harness: 8 providers, with subscription quotas (GLM / Kimi / OpenCode Go / Command Code), balances and budgets; third-party-API-key endpoints (custom, relay, local OpenAI-compatible) are tracked too, and unpriced models never show as zero. Backs up to local JSON.'
