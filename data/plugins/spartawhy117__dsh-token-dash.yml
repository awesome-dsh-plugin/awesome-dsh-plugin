name: spartawhy117/dsh-token-dash
category: usage
description:
  en: 'Token and cost dashboard for DeepSeek Harness: per-provider budgets, subscription quotas (GLM / Kimi Coding) and account balances, with a composer pill, a popover and a full dashboard showing time-range cost, real tokens, cache hit rate and usage trend; works with any custom or local OpenAI-compatible provider, never prices an unpriced model as zero, and backs up to local JSON.'
  zh: 'DSH Token 与费用看板：按供应商查看预算、订阅配额（GLM / Kimi Coding）与账户余额，输入框旁 Pill + 浮层 + 整页看板三处展示时间范围的费用、真实 Tokens、缓存命中率与用量趋势；支持自建 / 中转 / 本地等任意 OpenAI 兼容供应商，未定价模型不会按 0 元计，可导出 / 导入本地 JSON 备份。'
