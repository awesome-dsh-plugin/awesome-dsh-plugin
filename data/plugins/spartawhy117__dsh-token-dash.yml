name: spartawhy117/dsh-token-dash
category: usage
description:
  en: 'Token and cost dashboard for DeepSeek Harness: 8 providers out of the box, with per-provider budgets, subscription quotas (GLM / Kimi / OpenCode Go / Command Code) and account balances; cost and real Tokens, cache hit rate and usage trends appear in a Pill, a floating panel and the full dashboard, and cost trends compare on two axes; third-party-API-key endpoints (custom, relay, local OpenAI-compatible) are tracked too, unpriced models never show as zero, and data backs up to local JSON.'
  zh: 'DSH Token 与费用看板：8 家供应商开箱即用，按供应商查看预算、订阅配额（GLM / Kimi / OpenCode Go / Command Code）与账户余额；Pill、浮层、整页三处呈现费用与真实 Tokens、缓存命中率与用量趋势，成本趋势双轴对比；填第三方 API Key 的自建 / 中转 / 本地 OpenAI 兼容服务同样能记账，未定价模型不按 0 元计，可导出 / 导入本地 JSON 备份。'
