name: feng-yifan/dsh-plugins#dsh-enter-plan-mode
category: tools
description:
  en: 'Enter-plan-mode tool: gives the model a callable `dsh_enter_plan_mode_enter_plan_mode` that switches the current session into plan mode, pairing with the built-in `exit_plan_mode` for a plan-then-review loop.'
  zh: '进入计划模式工具：给模型一个可调用的 `dsh_enter_plan_mode_enter_plan_mode`，把当前会话切进计划模式，与内置的 `exit_plan_mode` 配对，形成“先规划、后评审”的闭环。'
