name: lucky8197/dsh-code-smell
category: dev
description:
  en: 'Code smell radar: statically scans TODO/FIXME debt, stub implementations, long lines, oversized files and duplicated blocks, with severity-sorted read-only fix suggestions.'
  zh: 代码气味雷达：静态扫描 TODO/FIXME 债务、未实现桩、超长行、大文件与重复代码块，按严重度输出修复建议，全程只读。
  ja: コードの臭いのレーダー。TODO/FIXME の負債、仮実装、長すぎる行、肥大化したファイル、重複ブロックを静的にスキャンし、深刻度順の読み取り専用の修正提案を出します。
