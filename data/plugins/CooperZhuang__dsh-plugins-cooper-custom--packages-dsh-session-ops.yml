name: CooperZhuang/dsh-plugins-cooper-custom#dsh-session-ops
category: session
description:
  en: 'Session operations for DeepSeek Harness: really delete persisted sessions (workspace, archive and subagent filters; running-session guards) and move sessions between workspaces (log relocation, header.cwd rewrite, workspace registry follow). Ships the shared session-store library.'
  zh: 'DeepSeek Harness 的会话运维：真正删除持久化会话（工作区、归档、子代理过滤；运行中会话守卫），并在工作区之间搬迁会话（日志迁移、header.cwd 改写、workspace 注册表跟随）。内含共享的会话存储库。'
