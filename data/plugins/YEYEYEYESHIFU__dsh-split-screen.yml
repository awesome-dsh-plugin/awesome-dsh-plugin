url: https://github.com/YEYEYEYESHIFU/dsh-split-screen
name: YEYEYEYESHIFU/dsh-split-screen
category: ui
description:
  en: 'Split-screen workspace for the DeepSeek Harness web GUI - chat with several agents side by side in panes that look and behave exactly like the stock conversation: drag-to-split, live sessions with queued messages and in-pane ask_user/approval cards, per-pane view tabs (Chat/Trajectory/plugin views), a compact TUI composer mode (Alt+T) and pane-focus shortcuts. Requires DSH 0.1.5+.'
  zh: DeepSeek Harness 网页端分屏工作区 - 多个会话并排聊天，面板观感与原生对话完全一致：拖拽分屏、实时会话（排队消息、面板内 ask_user/审批卡片）、面板内视图标签（Chat/Trajectory/插件视图）、Alt+T 紧凑 TUI 输入模式与面板焦点快捷键。需要 DSH 0.1.5+。