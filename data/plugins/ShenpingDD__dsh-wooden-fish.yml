description:
  en: 'A clickable wooden-fish desktop pet for the DeepSeek Harness web GUI. Click to knock; counts per day with a calendar heatmap of your streaks in settings. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '为 DeepSeek Harness Web 界面打造的电子木鱼桌宠。点击敲击、按天计数，设置页以日历热力图展示每日敲击与连续天数。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
