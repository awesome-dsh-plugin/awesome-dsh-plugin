url: https://github.com/mrzturn/dsh-switchman
name: mrzturn/dsh-switchman
category: session
description:
  en: 'Sessions and messages (`session`): the plugin operates on the live conversation — injects a dispatch protocol into the session prompt (delegation by default across six model pools with optional intent routing, optional Agent Teams collaboration, and tiered verification with independent review for larger changes), manages the context watermark (automatic folding, protected recent messages, persisted fold state, and watermark-triggered handoff) so long sessions stay within the context budget and token spend tracks the work instead of the length of the chat, and renders a session header badge with a Host/Client settings page; token tracking (`usage`, no bill calculation), read-only MySQL/Redis checks and doc skills (`skill`), and tool-call safeguards (`dev`) round it out. Every capability serves the session and its messages. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '会话与消息（session）：插件直接作用于进行中的会话——向会话提示词注入调度规程（默认委派，六大模型派发池与可选意图路由；可选 Agent Teams 协作；分级验证，较大改动交独立复审），管理上下文水位（自动折叠、近期消息保护、折叠状态持久化、水位触发交接），让长会话不撑爆上下文、token 开销随工作量而非聊天时长增长；渲染会话头部徽标与 Host/Client 设置页；另含 token 用量统计（usage，不计账单）、MySQL/Redis 只读核验与文档技能（skill）、工具调用保护（dev）。所有能力均服务于会话与消息。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
