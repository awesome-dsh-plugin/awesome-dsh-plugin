url: https://github.com/mrzturn/dsh-switchman
name: mrzturn/dsh-switchman
category: agi
description:
  en: 'Old conversation is folded into short summaries by a side model before the window fills (on-disk ledger survives restarts and re-anchors after host compaction), so long sessions stop getting more expensive every turn — one real full-day session: 6 folds replaced 209 old messages and the live context stayed in the tens of thousands of tokens. The session model picks the model per subtask across six pools (economy/mechanical/main/hard/vision/review); or pick Auto and a small intent classifier routes each message itself, switching only past a confidence threshold to keep prompt caches warm. A three-line watermark ends in an automatic four-step handover (fork backup, handover doc, compact, wake) without losing in-flight subagents; /ctx-pause, /ctx-resume and /ctx-handover keep it manual when wanted. Optional Agent Teams mode adds teammates and a shared task board; /vision gives text-only models eyes via the vision pool; tiered verification sends bigger diffs to a tester plus an independent reviewer. Settings UI, READMEs and language preferences cover the same 11 languages. Bundles three skills: read-only MySQL/Redis verification, commit-message generation, and a requirements/design document convention.'
  zh: '旧对话在窗口塞满前由侧模型自动折成短摘要（折叠账本写在磁盘上、重启不丢、宿主压缩后自动重锚），长会话不再越聊越贵——一个真实整天的会话：6 次折叠换掉 209 条旧消息，模型实际背着的上下文始终停在几万 token。会话模型自己给子任务选模型，六个派发池（轻量/机械/主力/高难/多模态/复审）；也可以选「自动（意图识别）」，小分类模型逐条决定交给谁，置信度不足不切换、护住提示词缓存。三条水位线到顶自动四步交接（fork 备份、交接文档、压缩、唤醒续跑），跑着的子智能体不丢；/ctx-pause、/ctx-resume、/ctx-handover 随时手动接管。可选 Agent Teams 模式带来常驻队友与共享任务板；/vision 让纯文本模型看图；分级验证给大改动配 tester 和独立复审。设置界面、README 与语言偏好覆盖同一套 11 种语言。内置三个技能：MySQL/Redis 只读核验、commit 文案生成、需求与设计文档规范。'
