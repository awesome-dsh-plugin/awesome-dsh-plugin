url: https://github.com/yjnmedia/dsh-expert-role
name: yjnmedia/dsh-expert-role
category: skill
description:
  en: 'Expert Library (also called Expert Role or Private Think Tank). Turns research material into loadable expert skills: each expert is a folder with SKILL.md, a manifest and references; only its name and one-line description sit in the skill catalog until the model loads it, so a large corpus stays out of the context. Material is organized into eight categories with two-level browsing. Ships two experts (library guide, DSH plugin) that are copied into the library on first start, fill-only and never overwriting yours. 14 tools create experts, move material in, find documents, plan and record research, dispatch steps to child sessions or open a standalone workspace. Retrieval uses a small local embedding model by default, falls back to keyword matching when it is missing, and can be downloaded from the settings panel; the library folder can live on any drive. The gap list shows which questions went unanswered; agreeing to research one sends it to the matching category session, and the result is checked for how many files were added and whether they are registered. A panel shows call history, session activity and each expert''s maturity score. It reads and writes files under the expert root; its HTTP routes accept local, host-admitted requests only (`connection.admit`); research and dispatch reuse or create sessions and spend tokens.'
  zh: '专家库（别名：专家角色、私人智库）。把调研资料变成可加载的专家技能：每位专家是一个目录（SKILL.md + 清单 + references），平时只占技能目录里一行名字和简介，模型要用时才读正文，大库不必一次进上下文。资料按八类归档、两级浏览；自带「专家库说明书」与「插件开发」两个专家，首次启动复制进资料库，只补缺、不覆盖你已有的。14 个工具：建专家、搬入资料、查资料、排调研计划、记进度、派子会话并行查、开独立工作区。检索默认用本地小向量模型，没装模型时自动降级关键词匹配，设置页可一键下载；资料目录能换到任意盘；缺口清单列出哪些问题没答上，点「同意去查」就投进对应大类的会话去补，跑完自动核对补了几份、三表登记齐没齐；面板显示调用记录、会话动态与每位专家的成熟度。它会读写专家库目录下的文件；HTTP 接口只接受本机请求，并通过宿主的准入校验（`connection.admit`）；调研与派发会复用或新建会话、消耗用量。'
