name: yjnmedia/dsh-expert-role
category: skill
description:
  en: 'Expert Library (also called Expert Role or Private Think Tank). Domain knowledge libraries for agents: each expert is a folder with SKILL.md, a manifest and references; only its name and one-line description sit in the skill catalog until the model loads it, so a large corpus stays out of the context. Ships two experts (design, DSH plugin) that are copied into the library on first start, fill-only and never overwriting yours. 12 tools create experts, move material in, find documents, plan and record research, dispatch steps to child sessions or open a standalone workspace. A gap list shows which questions went unanswered, a five-star maturity score uses structure, coverage, content, freshness and research closure (the fifth star also needs real usage), and a panel shows per session which expert was loaded and which file was read. It reads and writes files under the expert root; its HTTP routes accept local requests only; dispatching steps or opening a workspace creates child sessions and spends tokens.'
  zh: '专家库（别名：专家角色、私人智库）。把调研资料变成可加载的专家技能：每位专家是一个目录（SKILL.md + 清单 + references），平时只占技能目录里一行名字和简介，模型真要用时才读正文，大库不必一次进上下文。装完自带两个专家（设计、DSH 插件），首次启动复制进资料库，只补缺、不覆盖你已有的。12 个工具：建专家、搬入资料、查资料、排调研计划、记进度、派子会话并行查、开独立工作区。缺口清单列出哪些问题没答上；五星成熟度看结构、覆盖、内容、新鲜度、调研闭环，第五星还要求真实使用过；面板按会话显示哪次加载了哪位专家、读了哪个文件。它会读写专家库目录下的文件；HTTP 接口只接受本机请求；派发与工作区会新建子会话、消耗用量。'
