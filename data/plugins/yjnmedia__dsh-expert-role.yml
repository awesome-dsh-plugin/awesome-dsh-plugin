url: https://github.com/yjnmedia/dsh-expert-role
name: yjnmedia/dsh-expert-role
category: skill
description:
  en: 'Turns research folders into loadable expert skills. Each expert is a directory with SKILL.md, a manifest and references; only its name and one-line description sit in the skill catalog until the model loads it. Ships 12 tools for creating experts, ingesting and finding material, planning research, dispatching child sessions and opening a standalone workspace, plus a panel that shows per session which expert was loaded and which file was read, read from a local trace file. The five-star maturity score uses structure, coverage, content, freshness and research closure; the fifth star also requires real usage.'
  zh: '把一个文件夹的调研资料变成可加载的专家技能。每位专家是一个目录（SKILL.md + 清单 + references），平时只占技能目录里一行名字和简介，模型真要用时才读正文。带 12 个工具：建专家、搬入资料、查资料、排调研计划、派子会话、开独立工作区等；面板按会话列出「哪次加载了哪位专家、读了哪个文件」，读的是本地 trace 文件。五星成熟度由结构、覆盖、内容、新鲜度、调研闭环算分，第五星还要求真实使用过。'
