url: https://github.com/tonyZ1987/DSH-H.D.D-skin
name: tonyZ1987/DSH-H.D.D-skin
category: theme
description:
  zh: '把 DSH Web 界面换成《绝区零》H.D.D 空洞深潜系统的深蓝终端：侧栏与输入框整体换装。插件含一个只读的宿主半边与前端皮肤；关掉即回 DSH 原生白底。'
  en: 'Turns the DSH web UI into the H.D.D Hollow Deep Dive terminal from Zenless Zone Zero: the sidebar and composer are reskinned. Ships a small read-only host half plus the web skin; switch it off and DSH returns to its native light UI.'
