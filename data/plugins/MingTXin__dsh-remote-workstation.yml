url: https://github.com/MingTXin/dsh-remote-workstation
name: MingTXin/dsh-remote-workstation
category: remote
description:
  en: 'Remote workspaces for DeepSeek Harness: pick an SSH host in the sidebar, mount a server directory over SFTP as a workspace, then read, write and edit those files with the normal file tools. Remote watch is polled so the file tree refreshes, image/binary previews work through byte-range reads, and remote_exec, remote_search and remote_git give agents the remote shell, search and git queries. An opt-in patch routes the agent''s own bash/pwsh commands to the server. Every remote write and command follows the session sandbox mode and approval policy, and hosts are managed by the plugin itself (password, key or SSH agent).'
  zh: '给 DeepSeek Harness 用的远程工作区：在侧栏选 SSH 主机，通过 SFTP 把服务器目录挂载成工作区，随后用普通文件工具直接读写远端文件；远端 watch 用轮询实现（文件树自动刷新），图片/二进制预览走字节区间读取，remote_exec / remote_search / remote_git 分别提供远端命令、搜索与 git 查询；可选补丁把 agent 自己的 bash/pwsh 命令也路由到服务器；远端写入与命令都遵循会话的 sandbox 模式与审批策略；主机凭据由插件自带的「主机」库维护（密码、私钥或 SSH agent）。'
