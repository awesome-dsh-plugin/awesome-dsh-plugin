description:
  en: 'China Mobile Cloud Drive (139) inside DSH: browse, upload, download and move files, plus 12 model tools. Its /api/dsh-mcloud routes check Host and Origin before acting, so a web page in your browser cannot drive the signed-in cloud drive.'
  zh: '中国移动云盘（139）接入 DSH：浏览、上传、下载、转移网盘文件，并提供 12 个模型工具。它的 /api/dsh-mcloud 路由会校验 Host 与 Origin，浏览器里打开的网页无法驱动已登录的云盘。'