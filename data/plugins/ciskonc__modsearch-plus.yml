url: https://github.com/ciskonc/modsearch-plus
name: ciskonc/modsearch-plus
category: browser
description:
  en: 'Fork of liustack/modsearch: a web-search bridge for text-only agents that adds MiniMax engines and a Zhipu engine (coding-plan MCP or balance REST, one engine with a channel setting) to a parallel multi-engine chain with per-engine failover, health lights and a Plugins-page settings card.'
  zh: 'liustack/modsearch 的分支：为纯文本模型的 agent 桥接网页搜索，在并行多引擎链上新增 MiniMax 引擎与智谱引擎（编程套餐 MCP 或余额 REST，一个引擎用通道设置切换），带逐引擎故障转移、健康状态灯与插件页设置卡片。'
