description:
  en: 'Focus-aware session notifications: silent while you watch the session, an in-app card when the page is focused elsewhere, a system notification when it is unfocused.'
  zh: '按焦点分流的会话通知：回合结束与授权、提问时——看着即静默，看别处弹页内卡片，失焦才发系统通知。'
