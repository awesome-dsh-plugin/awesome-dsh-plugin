name: FlyingCharon/dsh-hear
category: voice
description:
  en: 'Gives a text-only agent an ear: a local audio model says what was said and how it sounded, checked against measured pitch, energy and pauses, with optional QQ voice watching.'
  zh: '给纯文本 agent 一副耳朵：本地音频模型先说讲了什么、怎么说，再用基频、能量、停顿去核对；可选 QQ 语音监听。'
