url: https://github.com/soffits/dsh-oidc
name: soffits/dsh-oidc
category: identity
description:
  en: 'OpenID Connect sign-in for the DSH Web UI with any provider, either behind a reverse proxy (forward auth in Caddy, nginx or Traefik) or as its own gateway in front of DSH. Admits several people by subject, verified email, group or claim, lists and revokes signed-in sessions in Settings, and can keep sessions across restarts. Maintained fork of Senti100/dsh-oidc.'
