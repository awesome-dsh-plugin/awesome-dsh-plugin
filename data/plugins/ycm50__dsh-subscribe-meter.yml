url: https://github.com/ycm50/dsh-subscribe-meter
name: ycm50/dsh-subscribe-meter
category: usage
description:
  en: 'Session cost meter forked from dsh-cost-meter, retargeted at Command Code GOAT: per-session and per-day cost, built-in 90+ model price catalog with automatic matching, GOAT subscription quotas (5-hour / weekly / monthly pool) as used/total bars, Coding Plan quotas, custom provider balances, peak/off-peak pricing notices, bilingual UI. It provides service:cost-meter like Han-1413141/dsh-cost-meter and the other dsh-subscribe-meter variants, so install only one cost meter: it replaces dsh-cost-meter rather than running alongside it.'
  zh: 'dsh-cost-meter 的 Command Code GOAT 定制版：本会话与当日费用、内置 90+ 模型价格目录与自动匹配、GOAT 订阅额度（5 小时 / 周 / 月度池，已用/全部 进度条）、Coding Plan 额度、自定义 Provider 余额、峰谷计价提醒，界面中英双语。 它与 Han-1413141/dsh-cost-meter 及同仓库其它变体提供同一个 service:cost-meter，只能装一个费用统计插件：本条目替代 dsh-cost-meter 安装，不能与上游同装。'
