url: https://github.com/a-molecule-of-ATP/dsh-bandizip
name: a-molecule-of-ATP/dsh-bandizip
category: tools
description:
  en: 'Wraps the installed Bandizip console tool (bz.exe) as nine semantic tools — list, extract, create, compress, decompress, check, detect, diff and convert. Extraction checks zip-slip, a declared-size ceiling and symlink entries before writing; a create can verify itself by unpacking again.'
  zh: '把本机已安装的 Bandizip 命令行（bz.exe）封装成九个语义化工具——列表、解压、打包、压缩、解压单文件、校验、识别格式、比较、转换。解压前检查路径穿越、声明体积上限与符号链接；打包可要求解回来逐文件核对。'
icon: https://raw.githubusercontent.com/a-molecule-of-ATP/dsh-bandizip/main/assets/icon-180.png
