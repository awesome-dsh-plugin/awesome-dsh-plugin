description:
  en: 'Git panel for the DSH right sidebar: staging, commits, branch switching, fetch/pull/push, worktrees, a Cursor-style commit graph and GitHub pull requests (the GitHub card needs a GitHub token). It drives the system git binary, so the panel and the terminal always agree.'
  zh: 'DSH 右侧栏 Git 面板：暂存、提交、切换分支、fetch/pull/push、工作树、Cursor 风格提交图与 GitHub PR（GitHub 卡片需要 GitHub 令牌）。直接调用系统 git，面板与终端状态保持一致。'
