url: https://github.com/EternalNight996/memory-eternal
name: EternalNight996/memory-eternal
category: memory
description:
  zh: "给 AI 一个不会忘、可审核、可量化的长期记忆：对话结束自动沉淀知识卡，人工审核后才进主库（三库分离 + 不可变审计日志）；召回走 SQLite FTS5 + BM25，零模型调用，实测 p50 2.3ms（2,321 张卡）；一个库接入 DSH / Claude Code / Codex / Cursor 与任意 MCP 客户端，零外部依赖。"
  en: "A long-term memory your AI cannot silently corrupt: conversations distill into cards, and nothing reaches recall until a human approves it (three-store gate + immutable audit log). Recall runs on SQLite FTS5 + BM25 with zero model calls, measured p50 2.3ms over 2,321 cards. One vault for DSH, Claude Code, Codex, Cursor and any MCP client; zero external dependencies."
icon: https://raw.githubusercontent.com/EternalNight996/memory-eternal/main/assets/icon-180.png
