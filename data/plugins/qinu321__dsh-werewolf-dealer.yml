url: https://github.com/qinu321/dsh-werewolf-dealer
name: qinu321/dsh-werewolf-dealer
category: fun
description:
  en: 'Runs one-night werewolf games inside DSH: deterministic dealing, night order, card swaps, voting and settlement, with a room UI and private night prompts. It vendors modified copies of baixianger/dsh-chat and baixianger/dsh-bridge; uninstall those two first, because enabling both registers the same dshChat/dshBridge services.'
  zh: 在 DSH 里组织《新版一夜狼人杀》：确定性发牌、夜序、换卡、投票与结算，自带房间界面与夜间私聊提示。包内是 baixianger/dsh-chat 与 baixianger/dsh-bridge 的修改版快照；请先卸载这两个上游插件，同时启用会重复注册 dshChat / dshBridge 服务。
