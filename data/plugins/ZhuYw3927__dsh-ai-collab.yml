name: ZhuYw3927/dsh-ai-collab
category: tools
description:
  en: 'Gives every AI tool in a repository one shared project memory: an append-only .ai/ work log, a current-state snapshot, and a zoned AGENTS.md whose user zone automation never overwrites. Global disciplines become switchable modules, project rules are inlined into AGENTS.md section 8, .ai/SESSION_BOOT.md briefs a new session before it starts, and every write is lock-protected and atomic. The project root keeps only AGENTS.md plus the rendered HTML; task lists, plans and the cross-project dashboard regenerate automatically on every tool call and for resumed sessions. Task lists and the cross-project dashboard are self-contained dark HTML pages that switch to cards on narrow screens, and placeholder blockers such as "none" are no longer counted as blockers. Windows only. Visual introduction: https://zhuyw3927.github.io/dsh-ai-collab/'
  zh: '给仓库里的各个 AI 工具共用一份项目记忆：只追加的 .ai/ 工作日志、当前状态快照，以及自动化永不覆盖用户区的分区 AGENTS.md。全局纪律拆成可独立开关的模块，项目纪律内联进 AGENTS.md §8；.ai/SESSION_BOOT.md 让新会话开场即接手；写入有跨进程锁与原子替换保护。项目根只保留 AGENTS.md 与渲染好的 HTML；任务清单、执行计划与跨项目仪表盘会在每次工具调用及恢复会话时自动重新生成；两者都是自包含的深色 HTML，窄屏自动降级为卡片，状态里的“无”等占位不再计入阻塞。当前仅支持 Windows。图文介绍：https://zhuyw3927.github.io/dsh-ai-collab/'
