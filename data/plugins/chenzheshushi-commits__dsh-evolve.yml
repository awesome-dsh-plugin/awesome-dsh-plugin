description:
  en: "Cross-session memory with zero-token deterministic recall (bigram-Jaccard fused with FTS5 BM25 via RRF), a tiered approval gate that auto-confirms only reversible user-anchored writes, and reinforcement that strengthens repeated observations. Crystallizes procedures into SKILL.md files that refine in place, curated through an active-stale-archived lifecycle with reversible archive and rollback. v0.4.2 adds a controlled-prune settings page: reversible soft-delete (tombstone, restorable), pinned three-tier protection, read-only heat ordering, and two-stage preview-then-execute with idempotent apply. Anti-bloat convergence for skills and memory, background per-turn review in an isolated call. Requires Node 22.5+."
  zh: "跨会话记忆，零 token 确定性召回（bigram-Jaccard 与 FTS5 BM25 经 RRF 融合，中文分词精确）；分级审批门只自动确认可逆且源自用户原话的写入，其余待人工确认；重复观察会强化已有理解而非堆叠重复。过程性知识结晶为 SKILL.md，就地精炼升级，走 active-stale-archived 生命周期治理，归档可逆、可回滚。v0.4.2 新增受控剪枝设置页：可逆软删除（墓碑标记、可恢复）、pinned 三层保护、只读 heat 冷度排序、两阶段预览-执行且幂等应用。含 skill 与记忆双层防臃肿收敛、每轮结束的隔离式后台复盘。需要 Node 22.5+。"
