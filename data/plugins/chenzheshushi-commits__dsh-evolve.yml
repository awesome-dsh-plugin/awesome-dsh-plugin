url: https://github.com/chenzheshushi-commits/dsh-evolve
name: chenzheshushi-commits/dsh-evolve
category: memory
description:
  en: "Cross-session memory with zero-token deterministic recall (bigram-Jaccard fused with FTS5 BM25 via RRF), a tiered approval gate that auto-confirms only reversible user-anchored writes, and reinforcement that strengthens repeated observations. Crystallizes procedures into SKILL.md files that refine in place and are curated through an active-stale-archived lifecycle with reversible archive and rollback. Adds anti-bloat convergence for both skills and memory, background per-turn review in an isolated call, and a web settings page. Requires Node 22.5+."
  zh: "跨会话记忆，零 token 确定性召回（bigram-Jaccard 与 FTS5 BM25 经 RRF 融合，中文分词精确）；分级审批门只自动确认可逆且源自用户原话的写入，其余待人工确认；重复观察会强化已有理解而非堆叠重复。过程性知识结晶为 SKILL.md，就地精炼升级，并走 active-stale-archived 生命周期治理，归档可逆、可回滚，绝不删除。另含 skill 与记忆双层防臃肿收敛、每轮结束的隔离式后台复盘、以及完整的网页设置页。需要 Node 22.5+。"
