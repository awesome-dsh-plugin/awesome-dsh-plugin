  zh: "通过 OneBot 11/12、Satori、Milky 或 QQ 官方接口把 DeepSeek Harness 接到 QQ：十个分权工具、识图、两段式主动发言；编排工具（子代理 / 队友 / 工作流）不暴露给 QQ 会话，拥有者私聊里也要先过一次 30 秒 TOTP 动态码才放行，跑完自动把产物打包发回。"
  en: "Bridges DeepSeek Harness to QQ over OneBot 11/12, Satori, Milky or the official QQ API: ten scoped tools, vision, a two-stage proactive chatter. Orchestration tools (subagent / teammates / workflow) are never exposed to QQ sessions; even in the owner's private chat they require a one-shot 30-second TOTP code first, and artifacts are packaged and delivered when the run finishes."
