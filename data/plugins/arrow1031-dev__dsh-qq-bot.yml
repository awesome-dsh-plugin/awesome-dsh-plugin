description:
  zh: "把 DeepSeek Harness 接到 QQ。支持 OneBot 11/12、Satori、Milky 与 QQ 官方机器人接口，群聊和私聊各有一条独立会话；内置十个工具：群管理、聊天记录与图片理解、联网搜索、网页抓取、图片反搜、生图等，另有按间隔自主接话的主动发言（判断与发言可分用两个模型）。模型、代理、白名单等全部在 DSH 设置页里配置，不需要改代码。"
  en: "Connects DeepSeek Harness to QQ over OneBot 11/12, Satori, Milky or the official QQ bot API, with a separate session per group or private chat and ten built-in tools: group management, chat history with image understanding, web search, page fetching, reverse image search and image generation. Optional proactive chatter reads recent messages on an interval and decides whether to join in, with the judging and speaking stages able to use different models. Models, proxy and allowlists are configured in the DSH settings page."
