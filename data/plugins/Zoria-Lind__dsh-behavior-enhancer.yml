description:
  en: 'Tool-call discipline for DeepSeek Harness with behavior prompts, failure-driven concurrency reduction and retry guidance, post-write checks with backup rollback, high-risk command gates, change summaries and verification reminders, advisory project-memory checks, configurable project-discipline reminders after compaction or at intervals, and compliance statistics.'
  zh: '工具调用纪律：提供行为提示、失败后降低并行度与重试提醒、写后检查及备份回滚、高风险命令闸门、变更摘要与验证提醒、项目记忆建议性检查、可配置的项目纪律周期重述与压缩后补充，以及遵守度统计。'
