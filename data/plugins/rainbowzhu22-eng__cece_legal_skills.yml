description:
  en: "A DeepSeek Harness bundle adapted from whatcccup/cece_legal_skills (MIT) for local DOCX, PDF, TXT and Markdown redaction with human review, PDF masking, local history and optional Agent rule edits. Requires Python 3.9+ and first-run dependency downloads. Model access is needed only for rule generation; 1.3.0 is a development prerelease and Windows acceptance is pending. The upstream is a standalone offline tool/SkillHub skill, not a DSH plugin, so it cannot be installed alongside this bundle."
  zh: "在 whatcccup/cece_legal_skills（MIT）基础上适配的 DeepSeek Harness 文书脱敏插件，提供本地识别、人工复核、PDF 框选遮盖、历史记录与可选 Agent 改规则。需 Python 3.9+，首次准备依赖需要联网；仅规则生成需要模型。1.3.0 为开发预发布，Windows 待实机验收；上游是独立离线工具/SkillHub 技能，不是 DSH 插件，无法在 DSH 内与本插件同装。"
