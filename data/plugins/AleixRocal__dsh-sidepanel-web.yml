url: https://github.com/AleixRocal/dsh-sidepanel-web
name: AleixRocal/dsh-sidepanel-web
category: browser
description:
  en: 'A DSH Web plugin that adds a browser to the right sidebar: open any page beside the chat, pick an element, and send the agent its selector, HTML, styles and a pinned screenshot so it can find and fix that component. Local/dev pages stay interactive through a same-origin proxy; public pages render in a host Chromium. Fork of zengxiaolou/dsh-annotate-browser (MIT), install one or the other — both add their own right-sidebar browser tab and drive a separate Chromium. Requires DSH 0.2.1-rc.2 to 0.2.x, Node.js 22.19+ and a Chromium-based browser on the host (auto-detected, or set chromePath).'
  zh: '一个 DSH Web 插件，在右侧边栏添加浏览器：在对话旁边打开任意页面，选中元素，把它的 selector、HTML、样式和一张带标记的截图发给 agent，让它能定位并修改组件。本地/开发页面经同源代理保持可交互；公共页面由宿主机上的 Chromium 渲染。fork 自 zengxiaolou/dsh-annotate-browser（MIT），两者二选一安装——都会新增自己的右侧栏浏览器标签页并驱动各自独立的 Chromium。需要 DSH 0.2.1-rc.2 至 0.2.x、Node.js 22.19+，以及宿主机上的 Chromium 系浏览器（自动检测，或设置 chromePath）。'
icon: https://raw.githubusercontent.com/AleixRocal/dsh-sidepanel-web/main/assets/icon-180.png
