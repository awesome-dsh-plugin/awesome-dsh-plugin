url: https://github.com/callmeocean1/dsh-taskbar-status
name: callmeocean1/dsh-taskbar-status
category: notify
description:
  en: Shows Windows taskbar progress while a turn runs, turns amber and flashes when an approval or question is waiting, and latches red after a failed turn.
  zh: 回合运行中在 Windows 任务栏显示进度条，等待审批或提问时变成琥珀色并闪烁，回合失败后保持红色。
