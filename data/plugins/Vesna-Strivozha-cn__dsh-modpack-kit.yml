url: https://github.com/Vesna-Strivozha-cn/dsh-modpack-kit
name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: "(Put these plugins together and it is genuinely good.) A PCL/HMCL-style modpack tool for DSH: bundle DSH plugins with their own config and data into one .dshpack and install them in one go; a bare DSH can install it too. Three strategies: lazy pack (payload included, works offline), download-only (install code only, smallest), hybrid (the strategy follows how each plugin is configured). Per-plugin setup: \"plugin preset\" or \"custom config\"; entries are restored item by item, existing local files are not overwritten by default, and suspected credentials become ${REDACTED}. Forced checks: before packing, scan for risky or sensitive content (masked only); high risk pauses for confirmation. Before installing, verify sha256, compatibility and licences. In sync with the market: categories, search, paging, groups and versions follow the plugin market catalog; packing and installing still work without it. Use it as a backup of your plugin combo: move to a new machine, back up or share plugin config. Sources include file and folder pickers, any directory, imported list and links; supports the market AI search. Would love to build a modpack marketplace but not skilled enough; updates are irregular (cluck cluck). Installing the plugin market (dshmarket) is recommended for a better experience. npm: https://www.npmjs.com/package/dsh-modpack-kit"
  zh: "（你说这几个插件整一块不牛逼坏了） 类似 HMCL / PCL 的 DSH 整合包工具：把多个 DSH 插件连同各自的配置与数据打成一个 .dshpack，一次装好；纯净版 DSH 也能装。 三种打包策略：懒人包（带本体，离线可装）、仅下载码（只记安装码，体积最小）、混合（按插件配置类型选择打包策略） 逐插件定制：「插件预设」或「自定义配置」，按条目回填、默认不覆盖本机文件，疑似凭据替换为 ${REDACTED}。 强制检测：打包前扫描风险与敏感信息（只留掩码），高风险停下等确认；安装前校验 sha256、兼容性与许可证。 和市场同源：分类、搜索、分页、分组、版本与插件市场目录同步；没装市场也能打包与安装。 平时可以把整合包当作插件组合的备份，迁移到新机器、备份或分享插件配置。 取包支持文件/文件夹选择器、任意目录、已导入列表与链接；支持市场的新版 AI 搜索。 想整整合包市场奈何技术力不足，不定时更新咕咕咕。建议先装插件市场（dshmarket）以获得更好的体验。 npm：https://www.npmjs.com/package/dsh-modpack-kit"
