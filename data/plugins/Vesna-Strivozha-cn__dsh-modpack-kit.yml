name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: 'Who says DSH cannot do modpacks? (Put these plugins together and it is genuinely good.) PCL/HMCL-style modpack tool: bundle plugins with their config and data into one .dshpack, pack them in one click, move the whole thing to another machine instead of reinstalling each plugin. Three strategies - full (offline), download-only (smallest), hybrid (per plugin); all ship a standalone installer for a bare DSH: copy into vendor, then register, skipping installed ones unless you pass --replace. Install everything in one click, or pick plugins yourself for a custom install (packed or local config each), enable them afterwards or keep them off, and sync market groups; sha256, dependencies and licences are checked before installing. Select plugins in bulk when packing, and use a pack as a backup of a plugin combo: migrate to a new machine, back up, or share plugin config. Sources: file or folder picker, any directory, imported list and links; categories, search, paging, same-name market switch and groups come from the plugin market, and search can use its AI search on newer versions. Plugin market recommended, not required. npm: https://www.npmjs.com/package/dsh-modpack-kit'
  zh: '谁说dsh不能整整合包呢？（你说这几个插件整一块不牛逼坏了） 类似 HMCL / PCL 的 DSH 整合包工具：把多个插件连同配置与数据打成一个 .dshpack，一键打包成整合包，换机器时整包搬走，不用逐个重装。 三种策略：完整包离线可装、仅下载码体积最小、混合包按插件分档；都带独立安装器，裸 DSH 也能装——先复制进 vendor 再登记，已装的默认跳过，--replace 才覆盖。 安装可以一键安装全部，也可以逐个挑插件做自定义安装（每份配置用包内的还是保留本机），装完整体启用或先不启用，并同步市场分组；装前校验 sha256、依赖与许可证。 打包时批量勾选插件；平时也能把整合包当作插件组合的备份，迁移到新机器、备份或分享插件配置都行。 取包支持文件/文件夹选择器、任意目录、已导入列表与链接；分类、搜索、分页、同名切市场版与分组都和插件市场同源，搜索可用市场的新版 AI 搜索。 建议先装插件市场（dshmarket），不是必须。npm：https://www.npmjs.com/package/dsh-modpack-kit'
icon: https://raw.githubusercontent.com/Vesna-Strivozha-cn/dsh-modpack-kit/main/assets/icon-180.png
