url: https://github.com/Vesna-Strivozha-cn/dsh-modpack-kit
name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: PCL/HMCL-style modpack tool for DeepSeek Harness: bundle plugins with their config and data into one .dshpack, install them in one pass, works offline, no need to install each plugin by hand when moving to another machine. Also searched as: modpack, plugin bundle, batch install, one-click install, offline install, migrate plugins, back up plugin config, share a plugin combo. Three strategies: full (installs offline), download-only (smallest), hybrid (per-plugin — only what cannot be fetched by version ships inside). Packing scans in memory and redacts suspected credentials (never written to disk; high-risk findings pause until confirmed); installing re-checks sha256, dependencies and licences. Categories, search, paging and groups share the plugin market. The plugin market is recommended, not required.
  zh: 类似 HMCL / PCL 的 DSH 整合包工具（modpack）：把多个插件连同配置与数据打成一个 .dshpack，一键安装、离线也能装，换机器时不用逐个装。常用叫法：整合包、插件打包、一键安装、批量安装、离线安装、迁移或备份插件配置、打包分享插件组合。三种策略——完整包（不联网也能装）、仅下载码（体积最小）、混合包（按插件分档，只把离不开本体的打全）。打包前在内存里强制安全扫描并擦除疑似凭据（原文不落盘，高危先停下等确认），安装前校验 sha256、依赖与许可证；分类、搜索、分页与分组和插件市场同源。建议先装插件市场（dshmarket），不是必须。
