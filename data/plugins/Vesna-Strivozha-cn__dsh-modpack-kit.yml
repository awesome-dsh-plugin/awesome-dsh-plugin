url: https://github.com/Vesna-Strivozha-cn/dsh-modpack-kit
name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: "\"Put these plugins together and it is genuinely good.\" A PCL/HMCL-style modpack tool for DSH: bundle plugins with their config and data into one .dshpack and install them in one go; a bare DSH can install it too. Three strategies: lazy pack (payload included, offline), download-only (smallest), hybrid (follows how each plugin is configured). Per-plugin setup: \"plugin preset\" or \"custom config\"; entries restored item by item, local files not overwritten by default, suspected credentials become ${REDACTED}; sha256, compatibility and licences are checked before installing. \"Community\" browses modpacks shared by others — search by name, author or plugin, tagged light/medium/large/huge by plugin count, open one to read the description carried inside the pack and what each plugin does. In sync with the market: categories, search, paging, groups and versions follow the plugin market catalog; works without it too. Use it as a backup of your plugin combo: move machines, back up or share config; sources include file and folder pickers, any directory, imported list and links. Installing the plugin market (dshmarket) is recommended. npm: https://www.npmjs.com/package/dsh-modpack-kit"
  zh: "「你说这几个插件整一块不牛逼坏了」类似 HMCL / PCL 的 DSH 整合包工具：把多个插件连同各自的配置与数据打成一个 .dshpack，一次装好；无插件 DSH 也能装。 三种打包策略：懒人包（带本体，离线可装）、轻量包（体积最小）、混合包（按插件配置类型选择）。 逐插件定制：「插件预设」或「自定义配置」，按条目回填、默认不覆盖本机文件，疑似凭据替换为 ${REDACTED}；安装前校验 sha256、兼容性与许可证。「社区资源」浏览社区上传的整合包——按名称/作者/插件名搜索，按插件总数标轻量/中型/大型/大宗，点开看包内自带的简介、包含哪些插件与各自用途。 和市场同源：分类、搜索、分页、分组、版本跟插件市场目录同步；没装市场也能用。  平时可以把整合包当作插件组合的备份，迁移、备份或分享配置；取包支持文件/文件夹选择器、任意目录、已导入列表与链接。 建议先装插件市场（dshmarket）。 npm：https://www.npmjs.com/package/dsh-modpack-kit"
icon: https://raw.githubusercontent.com/Vesna-Strivozha-cn/dsh-modpack-kit/main/assets/icon-180.png
