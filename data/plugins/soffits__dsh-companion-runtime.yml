url: https://github.com/soffits/dsh-companion-runtime
name: soffits/dsh-companion-runtime
category: model
description:
  en: 'Keeps long-running agents going: continues a turn on the next model in an ordered list when a request still fails after the built-in retries or the model refuses (formerly dsh-fallback-models), continues turns and subagents a restart cut off, tells the model who sent each message from which channel, and can add leads from old chats before a step. Each part is its own row and can be turned off.'
  zh: '让长期运行的 agent 保持工作：请求在内置重试后仍失败或模型拒绝回答时，换到有序列表里的下一个模型继续这一轮（原 dsh-fallback-models）；重启后继续被打断的回合和子代理；告诉模型每条消息是谁、从哪个渠道发的；还可以在每一步前从旧聊天里找线索。每个部分都是单独的一行，可以分别关闭。'
