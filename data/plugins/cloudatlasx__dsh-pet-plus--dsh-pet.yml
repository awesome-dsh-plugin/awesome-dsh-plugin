name: cloudatlasx/dsh-pet-plus#dsh-pet
category: ui
description:
  en: "A desk pet for DeepSeek Harness that carries the work with it: scheduled briefings and reminders land on the pet as clickable bubbles (up to three shortcut actions reply straight into the session), approvals and questions can be answered on the pet, a work bubble shows step count and elapsed time, and snooze / mute keep it quiet when you are busy. Adds a recent-items log you can reopen, double-click to cycle corners, voice output with a preview button, and a configurable data directory."
  zh: "给 DeepSeek Harness 的桌宠：定时播报与提醒直接落在宠物身上（最多 3 个快捷动作，点一下就把话投回会话），审批与提问可以在宠物上直接回答，工作气泡显示第几步与已用时间，忙的时候能「等会儿」或静音；另有可随时翻开的最近记录、双击换角落、带试听的语音播报与可配置的数据目录。"

