name: cloudatlasx/dsh-pet-plus#dsh-pet
category: ui
description:
  en: "A desktop pet living in DeepSeek Harness — 100+ transparent animations, multiple pets, draggable throw physics — plus schedule reminders that pop up on time and can be answered in place (agents push an announcement bubble with a checklist, and a 'reply in session' button jumps back to the conversation), approval/question bubbles on the pet itself (allow once, allow for this session, or reject), TTS with voice preview, sliders for every tuning value, and a configurable data directory."
  zh: 住在 DSH 里的桌面宠物：100+ 段透明动画、可多开、可拖拽甩抛；到点提醒直接弹在宠物身上（agent 也能主动推一条带清单的播报气泡，点「去会话回复」就切回原会话继续聊），审批/提问也能在宠物上处理（允许一次 / 本会话都允许 / 拒绝），语音合成带试听、参数全是滑条、数据目录可配置。
