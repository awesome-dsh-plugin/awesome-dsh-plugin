description:
  en: 'Verified-progress ledger: three tools record a claimed step as progress only after an independent subagent with a fresh context confirms it against the workspace. Files are fingerprinted before and after each verification, so a verifier that changed anything has its verdict voided and the round cannot become progress.'
  zh: '已验证进度账本：三个工具只在「带全新上下文的独立子代理」对着工作区核实之后，才把某一步声明记为进度。每次验证前后做文件指纹比对，改动过工作区的验证者其裁决一律作废，该轮不得成为进度。'
