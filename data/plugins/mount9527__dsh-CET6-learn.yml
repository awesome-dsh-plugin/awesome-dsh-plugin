url: https://github.com/mount9527/dsh-CET6-learn
name: mount9527/dsh-CET6-learn
category: tools
description:
  en: 'CET-6 training panel: 2,500 core words and a 6,000-word syllabus list with three practice modes, 25-question listening in three sections, cloze, long reading, careful reading, partial and full translation, timed writing, plus a vocabulary notebook and a wrong-answer notebook. Ships with an original sample bank, so it works right after install; your own papers, transcripts, audio and word lists are imported from a local data-pack folder and never leave the machine.'
  zh: '大学英语六级训练台：核心词 2500 与大纲词 6000 分组背记（背词 / 记词 / 默写三种模式）、听力按 Section A/B/C 三段 25 题、选词填空 / 长篇阅读 / 仔细阅读、片段翻译与全篇翻译、作文计时，另有生词本与错词错题本。包内自带一份原创示例题库，装完即用；真题、听力原文、录音与词表由使用者自备，按分类放进本机 data-pack 目录后本地构建，不上传、不分发。'
