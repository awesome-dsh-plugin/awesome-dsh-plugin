  en: 'Sidebar and conversation top-bar menu editor for DSH web: reorder, group, hide and re-icon entries (drag and drop, group flyouts, custom SVG or uploaded icons), reserves a configurable minimum height for the workspace tree, and exposes window.__dshSidebarManager for agents.'
