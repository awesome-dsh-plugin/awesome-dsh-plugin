url: https://github.com/yanli-nyan/dsh-sidebar-entry-manager
name: yanli-nyan/dsh-sidebar-entry-manager
category: ui
description:
  en: 'Per-row display switches for the DeepSeek Harness sidebar''s panel entries: switching a row off hides it from the panel list, the choice is kept in localStorage across reloads and restarts, and any hidden row is switched back on from the plugin''s management panel.'
  zh: '给 DeepSeek Harness 左侧栏的面板入口行加显示开关：关掉的入口从面板列表里隐藏，选择存在 localStorage 里，刷新和重启都保留，随时可在管理面板里拨回来。'
icon: https://raw.githubusercontent.com/yanli-nyan/dsh-sidebar-entry-manager/main/icon.png
