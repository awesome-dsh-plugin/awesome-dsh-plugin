url: https://github.com/HCGuo2000/hcguo-public/tree/main/plugins/amber-forge
name: HCGuo2000/hcguo-public#amber-forge
category: theme
description:
  en: 'Adeptus Mechanicus amber CRT skin for DeepSeek Harness, themed on Warhammer 40,000: a gear-and-skull emblem replaces the brand mark, the new-session slogan is written as a machine-cult verse, 14 theme tokens and 23 static palette entries are overridden, a monospace font stack covers the UI outside KaTeX math, scanlines and a screen vignette are added, and the agent-preset selector is 10% wider.'
  zh: '以《战锤 40,000》机械神教为灵感的琥珀 CRT 风格皮肤：以齿轮骷髅圣徽替代默认品牌标记，新会话口号改写为机械神教偈语，覆写 14 枚主题令牌与 23 枚静态调色板色值，在 KaTeX 公式之外统一全站等宽字体，叠加扫描线与屏幕暗角，并把模式选择器加长 10%。'
