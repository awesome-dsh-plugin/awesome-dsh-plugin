url: https://github.com/feifandiv/dsh-feifan-life
name: feifandiv/dsh-feifan-life
category: tools
description:
  en: 'A local life-management workspace with tasks, planning, finance, lists and inventory, habit check-ins, an inspiration library and reviews; data stays in a local JSON file. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '本地生活管理工作台：任务、规划、财务记账、清单与物资、习惯打卡、灵感库、复盘八个模块，数据以本地 JSON 保存。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
