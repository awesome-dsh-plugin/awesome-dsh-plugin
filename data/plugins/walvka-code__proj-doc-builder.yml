url: https://github.com/walvka-code/proj-doc-builder
name: walvka-code/proj-doc-builder
category: docs
description:
  en: 'Scans a repository with its bundled Python 3.12+ tools and scaffolds one Markdown outline per source directory, then publishes the index with a hash manifest that proves the documents match the code; the bundled reader verifies that manifest before serving an overview or one document. The project root needs a project_docs/ directory and a CLAUDE.md entry point.'
  zh: '用随包的 Python 3.12+ 工具扫描仓库，为每个源码目录生成一份 Markdown 大纲，并随索引发布可证明文档与代码一致的哈希 manifest；自带读取器在输出概览或单份文档前会先校验 manifest。项目根需已有 project_docs/ 目录与 CLAUDE.md 入口。'
icon: https://raw.githubusercontent.com/walvka-code/proj-doc-builder/main/assets/icon-180.png
tarball: https://github.com/walvka-code/proj-doc-builder/releases/download/v4.0.0/proj-doc-builder-4.0.0.tgz
