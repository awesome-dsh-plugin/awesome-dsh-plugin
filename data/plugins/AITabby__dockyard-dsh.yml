description:
  en: 'Native account-pool and provider plugin for DeepSeek Harness on macOS: official browser OAuth plus provider-native transports for those plus WorkBuddy and Command Code, with live model catalogs, Antigravity browser OAuth needs your own DOCKYARD_ANTIGRAVITY_CLIENT_ID and DOCKYARD_ANTIGRAVITY_CLIENT_SECRET, plan and quota windows, and manual, sticky-session, round-robin or failover account selection.'
  zh: 'DeepSeek Harness 的 macOS 原生账号池与 Provider 插件：Codex、Antigravity、Grok、Claude 与 Cursor 支持官方浏览器 OAuth，这些 Provider 与 WorkBuddy、Command Code 均走原生请求链路；读取实时模型目录、套餐与额度窗口，并支持手动、sticky session、轮询与 failover 账号选择。'
