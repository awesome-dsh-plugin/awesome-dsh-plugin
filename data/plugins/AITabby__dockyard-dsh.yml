description:
  en: 'Native account-pool and provider plugin for DeepSeek Harness on macOS and Windows: official browser OAuth and provider-native transports for Codex, Antigravity, Grok, Claude, Cursor, WorkBuddy, Command Code, Hermes and OpenRouter Free, with per-account model catalogs, plan and quota windows, quota warnings, and manual, sticky-session, round-robin, failover or most-allowance-left account selection.'
  zh: 'DeepSeek Harness 的 macOS 与 Windows 原生账号池与 Provider 插件：为 Codex、Antigravity、Grok、Claude、Cursor、WorkBuddy、Command Code、Hermes 与 OpenRouter Free 提供官方浏览器 OAuth 与原生请求链路，读取按账号的模型目录、套餐与额度窗口并提供额度提醒，账号选择支持手动、sticky session、轮询、failover 与额度最充足优先。'
