url: https://github.com/Soviet-Dreadnaught/dsh-theme-longmarch
name: Soviet-Dreadnaught/dsh-theme-longmarch
category: theme
description:
  en: 'Red-phosphor CRT terminal theme for the DeepSeek Harness Web GUI: black background, phosphor-red text, animated data rain and scanlines, and four department presets (Party Affairs, State Council, Central Military Commission, State Security), each with its own emblem, palette and background pattern.'
  zh: '把 DeepSeek Harness Web GUI 换成黑底红字的磷光终端主题：红色数据雨与 CRT 扫描线，外加党务 / 国家政务 / 中央军委 / 国家安全四套部门预设，每套自带徽记、配色与背景纹样。'
