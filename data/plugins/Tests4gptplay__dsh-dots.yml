description:
  en: 'Open ChatGPT Dots in a full-width DSH page with Desktop startup preload, retained page state across panel switches, bilingual theme-aware controls, refresh and external-browser access. Optional login persistence (DSH Desktop only): a Settings button backs up and patches the browser-partition code in DSH Desktop''s app.asar (Restore undoes it); it needs a full DSH restart, must be re-applied after a DSH upgrade, and is refused on code-signed macOS builds.'
  zh: '在 DSH 全幅页面使用 ChatGPT Dots，支持 Desktop 启动预加载、切换面板保留网页状态、中英文主题工具栏、刷新和外部浏览器打开。可选的登录保持（仅 DSH Desktop）：设置页按钮会先备份、再修改 DSH Desktop 安装目录里 app.asar 的浏览器分区代码（可「恢复原版」），需完全重启 DSH，DSH 升级后须重新应用；带系统代码签名的 macOS 应用会被拒绝。'
