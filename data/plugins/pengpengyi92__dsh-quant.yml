url: https://github.com/pengpengyi92/dsh-quant
name: pengpengyi92/dsh-quant
category: tools
description:
  en: Quantitative R&D toolkit for DeepSeek Harness — 59 tools across six domains covering market data, indicators, factor evaluation, walk-forward ML validation, risk (VaR/CVaR/drawdown/Beta with Kupiec POF), options, bonds, FICC and fund simulation, with an end-to-end PDAT→PET research pipeline.
  zh: 面向 DeepSeek Harness 的量化研发工具箱，59 个工具覆盖行情、指标、因子评价、滚动样本外机器学习验证、风险（VaR/CVaR/回撤/Beta 与 Kupiec POF）、期权、债券、FICC 和基金模拟，并提供端到端 PDAT→PET 研究管线。
