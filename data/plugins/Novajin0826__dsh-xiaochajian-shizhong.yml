description:
  en: Adds a Skills group to the composer + menu with enable/disable filtering, and a manager panel that searches, toggles, deletes and batch-manages installed skills. Choosing a skill inserts its slash command into the draft without sending.
  zh: 在输入框 + 菜单顶部增加技能分组，仅显示已启用技能，并提供管理页搜索、启用/停用、删除与批量管理；选中技能后把斜杠命令插入草稿，不自动发送。
