description:
  en: 'Local GPT-SoVITS voice for DeepSeek Harness: boots the engine with DSH and kills it on exit, speaks only the line marked for voice, and ships a default voice, so you only need to point runtimeDir at a local GPT-SoVITS install.'
  zh: '把本机 GPT-SoVITS 接进 DeepSeek Harness：随 DSH 启停引擎、只念该说出口的那一句；自带默认音色，只需填好本机 GPT-SoVITS 的 runtimeDir。'
