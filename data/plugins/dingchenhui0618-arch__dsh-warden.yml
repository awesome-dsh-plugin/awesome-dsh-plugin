url: https://github.com/dingchenhui0618-arch/dsh-warden
name: dingchenhui0618-arch/dsh-warden
category: security
description:
  en: 'Adversary review gate for DSH tool calls, in two layers. First a local regex pass with no added latency flags destructive commands (rm -rf in any flag order, Remove-Item -Recurse, dd if=, DROP TABLE, git push --force, shutdown, Clear-Disk) and writes to sensitive paths (.env, credentials, .ssh, .git/, cordis*.yml, AGENTS.md, anything under $DSH_HOME); only those hits are sent to an independent small model that returns allow or deny before the call runs. Ordinary reads, writes and commands never enter either layer, so everyday work pays no extra latency. Rules come from a built-in set that $DSH_HOME/adversary.md fully overrides and reloads on mtime change. Every reviewed call is appended as one JSON line to $DSH_HOME/warden-audit.jsonl, and a panel in the conversation view reports tool calls, risky categories, reviews, allows, denials and degradations plus the last 60 verdicts with the model and reason used. It never returns ask, and every failure path allows: its worst case is doing nothing.'
  zh: 'DSH 工具调用的对抗式审查门，两层判定。第一层是零延迟的本地正则：拦不可逆破坏命令（任意旗标顺序的 rm -rf、Remove-Item -Recurse、dd if=、DROP TABLE、git push --force、shutdown、Clear-Disk）与敏感路径写入（.env、credential、.ssh、.git/、cordis*.yml、AGENTS.md、$DSH_HOME 下任何文件）；只有命中者才交给一个独立小模型，在调用执行前返回 allow 或 deny。普通读写与普通命令完全不进这两层，日常工作的额外延迟是 0。规则来自内置一份默认集，$DSH_HOME/adversary.md 存在时完全覆盖它并按 mtime 自动重载。每一次送审的调用追加一行 JSON 到 $DSH_HOME/warden-audit.jsonl；对话视图里的面板汇报工具调用、风险类别、送审、放行、拦截与异常降级计数，以及最近 60 条判定及其所用模型与理由。它永不返回 ask，且任何异常路径一律放行：最坏表现是什么都不做。'
