url: https://github.com/jediliu005/dsh-fairy-zzz-for-jediliu
name: jediliu005/dsh-fairy-zzz-for-jediliu
category: ui
description:
  en: 'Fairy III (Zenless Zone Zero) H.D.D skin for DeepSeek Harness: boot video, an eye-core dock that can be dragged vertically so it never covers text, and time-of-day greeting voices written by a model every day (5 lines, each <= 20 characters) and synthesized locally with GPT-SoVITS, with a fallback chain of today -> latest -> bundled audio so there is always something to hear. Replies can be spoken: a trailing marker line takes priority over length heuristics, and long replies can be compressed into one sentence first. The reader hashes the utterance it just played (MD5) so each reply is voiced exactly once, and switching sessions stays silent. Personal fork of dsh-fairy-zzz with its own package, route and storage namespace, plus a rate-limited summarize endpoint, POST-only engine control and bounded TTS and greeting caches. Two diagnostic logs (client revision, decision trace) are written next to the plugin and stay on the local machine. A personal fork of AssassinVIX/fairy-zzz-plugin (upstream package dsh-fairy-zzz): install this fork or the upstream, not both - both mount the full-screen skin on the same DSH surfaces. Dynamic greetings and spoken summaries need a DeepSeek-compatible API key in ~/.dsh/fairy-tts.json (or DEEPSEEK_API_KEY); without it only the bundled greeting audio plays.'
  zh: '《绝区零》Fairy Ⅲ 的 H.D.D 皮肤：开机动画、可沿纵轴拖动（X 轴固定）的常驻眼徽，用来避开正文；每天由模型生成 5 段时段问候台词（每句不超过 20 字），用本地 GPT-SoVITS 合成，取用顺序为「今日 → 最近一份 → 内置语音」，生成失败也有声音。回复可选朗读：末尾标记行优先于字数判断，长回复可先压成一句结论；朗读器对刚念过的句子做 MD5 去重，保证每条只念一次，切换会话保持安静。本仓库是 dsh-fairy-zzz 的个人定制分支，包名、路由与存储命名空间独立，并做了摘要接口限流、引擎启停改 POST、TTS 缓存与问候语定期清理。插件会在自身目录写两份本地诊断日志（客户端版本、决策追踪），只留本机、不外传。本仓库是 AssassinVIX/fairy-zzz-plugin（上游包名 dsh-fairy-zzz）的个人定制分支：与上游二选一安装，不要同时装——两者都会在相同的 DSH 界面挂载全屏皮肤。每日动态问候与朗读摘要需要 ~/.dsh/fairy-tts.json（或 DEEPSEEK_API_KEY）提供 DeepSeek 兼容 API key；未配置时只播放内置问候音频。'
