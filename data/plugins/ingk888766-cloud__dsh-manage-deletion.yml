description:
  en: 'Delete the sessions you no longer need, and get them back if you change your mind. Delete from a sidebar row, from a multi-select list, or from a scan of the whole store; deletions go to a trash that can be restored. When a session goes, the files it created or edited inside its own working directory can go with it, and the dialog lists them first. Pinned and idle-open sessions can be deleted; a session with a running turn is refused.'
  zh: '删掉用不着的会话，删错了能找回来。侧栏会话行、工作区多选、整库扫描三个入口，删除先进回收站，可按时间还原。删会话时可以带上它自己写过的文件（只算它工作目录里的），删之前对话框会把文件列出来。置顶和空闲的会话能删，正在跑的不行。'
