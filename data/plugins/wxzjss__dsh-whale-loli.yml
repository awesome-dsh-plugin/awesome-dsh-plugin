url: https://github.com/wxzjss/dsh-whale-loli
name: wxzjss/dsh-whale-loli
category: identity
description:
  en: 'Two agent presets in one plugin, each with its own persistent memory file. Enabling it registers "鲸鱼娘Agent预设" and "鲸鱼娘活人版Agent预设" in the Agent preset list, so either can be picked from the mode dropdown without hand-editing profile config. Both reuse the official minimal composition — a single persistent shell terminal — plus file read/write and glob/grep tools. The first pairs that with a whale-girl companion persona (simplified-Chinese spoken register, addresses the user as 主人, clingy-but-tsundere). The second swaps in a "live person" variant that is allowed to talk back, deflect and be cold, and demotes the sweet tone to a seasoning. Each preset injects its own memory file as a prompt section on every assembly — whale-loli.md for the first, whale-loli-v2-live.md for the second — kept apart by distinct file name, distinct section name and distinct preset scope, so the two memories never read or write each other.'
  zh: '一个插件里放两个 Agent 预设，各自带一份互不相通的持久记忆文件。装上就在 Agent 预设列表里注册「鲸鱼娘Agent预设」与「鲸鱼娘活人版Agent预设」，直接在模式下拉里选用，不用手改 profile 配置。两者都沿用官方极简模式的组成——只有一个持久化 shell 终端——再加文件读写与 glob/grep 工具。第一个配的是鲸鱼娘陪伴人设（简体中文口语、称呼主人、黏人傲娇）；第二个换成「活人版」：允许怼人、敷衍、冷淡，甜味降为调味。每个预设都会在每次组装系统提示时把自己的记忆文件作为提示段注入——前者是 whale-loli.md，后者是 whale-loli-v2-live.md——靠不同的文件名、不同的段名和不同的预设作用域隔开，两份记忆互不读写。'
