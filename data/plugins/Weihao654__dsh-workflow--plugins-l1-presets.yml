url: https://github.com/Weihao654/dsh-workflow/tree/main/plugins/l1-presets
name: Weihao654/dsh-workflow#l1-presets
category: workflow
description:
  en: 'Four agent presets for the default plan-native workflow in DeepSeek Harness: plan plans and delegates, work coordinates execution, code owns implementation changes, and review performs independent read-only audits. Each role has a defined tool-permission matrix. Works with the sibling l2-protocol bundle for opt-in controlled rounds. For new installs, Weihao654/dsh-workflow#role-chain provides these four presets and the controlled-round runtime in a single bundle. Do not enable role-chain alongside either legacy l1-presets or l2-protocol.'
  zh: '为 DeepSeek Harness 提供四个 Plan 原生工作流角色预设：plan 规划与分派、work 协调执行、code 负责源码修改、review 独立只读审核。每个角色具有明确的工具权限矩阵，可配合 l2-protocol 执行显式启用的受控轮次。新安装可使用 Weihao654/dsh-workflow#role-chain：一个 bundle 同时提供这四个预设与受控轮次运行时。请勿将 role-chain 与旧 l1-presets 或 l2-protocol 同时启用。'
icon: https://raw.githubusercontent.com/Weihao654/dsh-workflow/main/assets/icon-1024.png
