description:
  en: 'Multi-agent deep long-form article pipeline skill for DeepSeek Harness: 9 roles (T0 orchestrator + T1-T3 retrieval + T4 analysis + T5 writing + T6 critical companion + T7 audit + T9 review, T8 final check done by the orchestrator) across 5 phases, with parallel literature/data/case retrieval, triangle verification, M-Gate mechanical final check, G14 Chinese AI-trace gate and human verification gates. v2.5.2-dsh.8 ships 12 commits of token optimization (cacheRead 191M → ~85M, ~55% saved), 9-layer Phase 1.5 trigger-field consistency, machine-readable scripts (count-chars/m-gate/build-evidence/final-check) with --json/--summary/--deep-summary modes.'
  zh: 多 Agent 深度长文流水线技能包：9 角色（T0 主控 + T1-T3 检索 + T4 分析 + T5 写作 + T6 批判伙伴 + T7 审计 + T9 审稿，T8 终检由主控亲完成）+ 5 阶段，文献/数据/案例三线并行检索，三角验证 + M 门机械化终检 + G14 中文 AI 痕迹闸 + 人工核验节点，产出带证据底座、反方论证与独立审计的深度文章/论文。v2.5.2-dsh.8 合并 12 个 token 优化 commits（实测 cacheRead 191M → 约 85M，省 50~55%），新增 9 层 Phase 1.5 trigger 字段决策一致性，4 个核心脚本（count-chars/m-gate/build-evidence/final-check）支持 --json / --summary / --deep-summary 机器可读输出。
