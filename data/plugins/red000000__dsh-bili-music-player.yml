url: https://github.com/red000000/dsh-bili-music-player
name: red000000/dsh-bili-music-player
category: voice
description:
  en: "Bilibili music player for the DSH composer dock: import your Bilibili login cookie and a listening-profile JSON for profile-based recommendation with like/skip/dislike feedback and 192k playback; without a profile it falls back to genre-based online search and progressive playback."
  zh: 在 DSH 输入框上方点播 B 站音乐：导入 B 站登录态与听歌画像 JSON 后按画像推荐，支持喜欢/跳过/不喜欢软反馈；没有画像时退回按风格词在线搜索，播放为边下边播。