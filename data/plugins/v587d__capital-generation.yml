description:
  en: 'China A-share financial data MCP server for the harness: 11 fin_data__* tools (quotes/K-lines/financials/calendar/special-data/announcements/EDB/reconcile/funds/indices) over THS free official REST (primary) + AKShare (fallback) + Wind (exclusive domains), with observable degradation, context-budget compression (result-side -72.2% measured), and an offline 10-year market-data lake; BYOK.'
  zh: 中国 A 股金融数据 MCP server：11 个 fin_data__* 工具（行情/K线/财务/日历/特色数据/公告/EDB/对账/基金/指数），同花顺免费官方 REST 主干 + AKShare 兜底 + Wind 独家域，降级全程可观测；上下文压缩（实测结果侧 -72.2%）；离线 10 年数据湖；BYOK 零平台密钥。
  ja: harness 向けの中国 A 株の金融データ MCP サーバー。11 種の fin_data__* ツール（気配値/K 線/財務/カレンダー/特殊データ/開示/EDB/照合/ファンド/指数）を、同花順の無料公式 REST（主）＋ AKShare（フォールバック）＋ Wind（専用領域）で提供します。機能縮退が見える形で行われ、コンテキスト予算の圧縮（結果側で実測 -72.2%）と 10 年分のオフライン市場データレイクを備えます。キーは各自で用意（BYOK）。
