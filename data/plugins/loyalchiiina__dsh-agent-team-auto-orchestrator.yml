url: https://github.com/loyalchiiina/dsh-agent-team-auto-orchestrator
name: loyalchiiina/dsh-agent-team-auto-orchestrator
category: workflow
description:
  en: 'Host-side orchestrator for DSH agent teams. Every turn it injects an 11-section orchestration methodology into the system prompt and backs it with a counting tool-layer gate, so parallel dispatch, task-board tracking, cross-session handoff, employee-pool reuse and preset routing become the default in any preset and any session instead of something you have to ask for. The gate counts real dispatches (subagent / subagent_fork / spawn_teammate) rather than words: a todo listing N unmarked items only needs the base threshold, items explicitly marked as parallel must be launched in one batch up to a configurable cap, and a genuine single-step task is exempt by writing one marker. Read-only tools (read, glob, grep, context-management tools) are never gated. Team members are woken up and reused before new ones are hired, and subagents are reserved for work that must run under a specific preset. Local-only settings (preset routes, domain keywords, profile name, active tier) live in <DSH_HOME>/team-orchestrator.local.json and never ship inside the package. Status is exposed on a loopback-only HTTP route. Zero telemetry, no hosted service, no account. Adapts DSH kernel 0.2.2-rc.1.'
  zh: 'DSH 智能体团队的宿主端编排器。每轮把 11 节编排方法论注入系统提示，并配一层按真实派活次数计数的工具层硬门，让并行派活、任务板追踪、跨会话交接、员工池复用与预设路由在任何预设、任何会话里都是默认行为，而不是每次都要你特意要求。硬门只数真的派出去了几次（subagent / subagent_fork / spawn_teammate），不看你嘴上怎么说：todo 里列 N 条但没有并行标记时只要求基础门槛，明确标了并行的条目必须在同一批里一次派满（上限可配），真·单步任务写一个标记即可免派。只读工具（read、glob、grep 及上下文管理类工具）永不被拦。先唤醒并复用已有团队成员，不够才新增，subagent 只留给必须在某个专用预设下执行的任务。本机专属配置（预设路由表、业务域关键词、profile 名、当前挡位）外置在 <DSH_HOME>/team-orchestrator.local.json，从不随包发布。状态只在本机回环 HTTP 路由上暴露。零遥测、无托管服务、无需账号。适配 DSH 内核 0.2.2-rc.1。'
