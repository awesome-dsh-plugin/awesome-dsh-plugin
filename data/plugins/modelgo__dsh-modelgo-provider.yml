url: https://github.com/modelgo/dsh-modelgo-provider
name: modelgo/dsh-modelgo-provider
category: model
description:
  en: 'ModelGo model provider: lists the chat models your ModelGo key can use, read from the site''s /v1/models, and sends each one over a protocol the site lists for it (OpenAI Chat Completions, Anthropic Messages or OpenAI Responses). The key is pasted on the plugin page or in Settings → Models and verified before it is saved.'
  zh: 'ModelGo 模型提供商：从站点的 /v1/models 读取你的 ModelGo 密钥可用的对话模型，并按站点为每个模型列出的协议（OpenAI Chat Completions、Anthropic Messages 或 OpenAI Responses）发送请求。密钥在插件页或「设置 → 模型」中粘贴，验证通过后才保存。'
icon: https://raw.githubusercontent.com/modelgo/dsh-modelgo-provider/main/icon.png
