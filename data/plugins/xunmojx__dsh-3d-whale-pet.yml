url: https://github.com/xunmojx/dsh-3d-whale-pet
name: xunmojx/dsh-3d-whale-pet
category: ui
description:
  en: "A 3D baby-orca desktop pet: it can follow your cursor, or wander, roll over and doze off on its own, plus some simple interactions. Stroke the cursor over its head three times to pet it. It nods in time when music plays — local files or any app's sound."
  zh: "3D 小虎鲸桌宠：可以跟着鼠标，也可以自己溜达、翻身、打盹，还可以简单互动。把鼠标箭头放它头上蹭三下可以摸摸它。放歌时会跟着节拍点头（本地音频或任何软件的声音都行）。"
