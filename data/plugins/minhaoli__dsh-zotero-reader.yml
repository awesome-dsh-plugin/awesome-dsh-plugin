name: minhaoli/dsh-zotero-reader
category: docs
description:
  en: "Read Zotero PDFs inside the DSH right sidebar and let the model work on them directly. Requires Zotero 10 or newer with the local API enabled (Zotero 7/8 is read-only and cannot accept annotations). The model gets three tools: search_zotero_library to search your library, read_zotero_paper to read a paper by page or by query, and ask_zotero_paper for page-cited answers. Annotation handling mirrors Zotero's own reader: click an annotation to open a card with page number, quoted text, a comment box and tags; the three-dot menu recolors or deletes it; multi-line selections get a single surrounding box rather than one box per line. Comments, tags, colors and deletions are written back through the Zotero local API, so they show up in Zotero and annotations made in Zotero show up here. Selection actions cover translate, explain, ask and highlight; the reader remembers the exact reading position (page plus offset) and zoom level per paper, and keeps opened PDFs mounted so switching tabs does not reload them. MinerU re-parsing is available for scanned or broken-text PDFs and is off by default."
  zh: "在 DSH 右侧栏里阅读 Zotero 的本地 PDF，并让模型直接基于原文工作。需要 Zotero 10 及以上版本并开启本地 API（Zotero 7/8 只能读、不能写入批注）。插件向模型提供三个工具：search_zotero_library 搜索文献库、read_zotero_paper 按页或按关键词读正文、ask_zotero_paper 做带页码依据的问答。批注操作与 Zotero 自带阅读器一致：点击批注弹出卡片，显示页码、原文引用、评论框与标签；右上角三点菜单可改色或删除；跨行选中只画一个外围长方形，不再每行一个框。评论、标签、颜色与删除都通过 Zotero 本地 API 写回，因此在 Zotero 里能看到，在 Zotero 里做的批注这里也能看到。划词动作包括翻译、解释、询问与高亮；阅读器按论文记住精确阅读位置（页加页内偏移）与缩放比例，已打开的 PDF 保持挂载，切换标签不会重新加载。扫描件或文本层损坏时可用 MinerU 重新解析，默认关闭。"
