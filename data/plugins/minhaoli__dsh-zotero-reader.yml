url: https://github.com/minhaoli/dsh-zotero-reader
name: minhaoli/dsh-zotero-reader
category: docs
description:
  en: "Brings Zotero's whole reading workflow into DSH: library, PDFs and annotations all live here, with no switching between apps. Library: browse every item by Zotero collection tree, searchable, plus a This session view listing only the papers the current conversation matched. Reading: outline navigation, in-document find with case and whole-word options, per-paper memory of reading position and zoom, and several PDFs open at once without interfering. Annotations: highlights made in Zotero show up here, and comments, tags, recoloring and deletion written here go back to Zotero. Page-cited answers: replies are grounded in the paper text, each claim carries a real page number, and clicking it jumps to that page and highlights it. Selection actions: translate, explain, ask or highlight from any selection. Models and credentials: translation, explanation and asking can each use their own provider and model picked from what you have configured, falling back to the current conversation when left empty; Zotero cloud, MinerU and embedding credentials are entered separately and never held in plain text on the page, with a one-click connectivity test. Scanned or broken-text PDFs: re-parse on demand, off by default."
  zh: "把 Zotero 的整套阅读工作搬进了 DSH：文献库、PDF、批注都在这里，不必再在两个应用之间来回切。文献库：按 Zotero 专题树浏览全部文献，可搜索；「本次搜索」只列出这轮对话里 AI 命中的那几篇。阅读：大纲按章节跳转，文档内查找支持区分大小写、整词与高亮所有，每篇论文记住阅读位置和缩放，多篇 PDF 可同时开着互不干扰。批注：Zotero 里做的批注在这里能看到，这里加的评论、标签、改色与删除也会写回 Zotero。带页码问答：基于论文原文回答，每个结论标出真实页码，点页码跳回原文并高亮。划词动作：选中一段即可翻译、解释、追问或标成高亮。模型与凭据：划词翻译、解释、提问可分别指定服务商与模型，从已配置的列表里选，留空则跟随当前会话；Zotero 云端、MinerU 与 Embedding 的凭据单独填写，页面不保存明文，可一键测试连通性。扫描件与图纸：文本层损坏或扫描版可按需重新解析，默认关闭。"
