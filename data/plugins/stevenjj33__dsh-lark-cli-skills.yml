description:
  en: 'Agent skills for the Lark/Feishu CLI: exports the 27 skills embedded in the lark-cli binary (docs, sheets, base, calendar, drive, task, wiki, approval, mail, slides, vc, minutes and more) and registers them with the DeepSeek Harness skill registry so the agent can read them on demand. Excludes lark-im so it complements an IM bridge plugin rather than duplicating one. Requires lark-cli to be installed.'
  zh: '飞书/Lark CLI 的 agent 技能包：把 lark-cli 二进制内嵌的 27 个技能（文档、表格、多维表格、日历、云空间、任务、知识库、审批、邮箱、幻灯片、视频会议、妙记等）导出并注册到 DeepSeek Harness 技能库，供 agent 按需读取。刻意排除 lark-im，与 IM 桥接插件互补而非重复。需先安装 lark-cli。'
