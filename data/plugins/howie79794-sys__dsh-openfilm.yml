name: howie79794-sys/dsh-openfilm
category: tools
description:
  en: 'OpenFilm AI video making, enhanced for DeepSeek Harness — embedded Studio, local MP4 rendering, canvas pointing, render jobs, and a sidechat with screenshots and voice. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '开源 OpenFilm AI 视频制作，针对 DeepSeek Harness 做了增强：内嵌 Studio、本地渲染 MP4、指着画布改片、后台渲染任务、支持截图与语音的面板对话。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
