url: https://github.com/YixuanLi911/dsh-mail-widget
name: YixuanLi911/dsh-mail-widget
category: notify
description:
  en: 'Unread mail widget for DeepSeek Harness: 7-day and 30-day unread sections with senders, a local widget page and two agent tools, IMAP over TLS with no runtime dependencies. The IMAP app password is stored in plain text in ~/.dsh/mail-widget/config.json (mode 600), and the two agent tools return sender and subject lines from your mailbox to the model.'
  zh: 'DeepSeek Harness 的未读邮件挂件：按近 7 天 / 近一个月两段显示未读数量与发件人，带一个本地挂件页面和两个 agent 工具；纯内置模块实现 IMAP，无运行时依赖。IMAP 应用专用密码以明文存放在 ~/.dsh/mail-widget/config.json（权限 600），两个 agent 工具会把你邮箱里的发件人和主题返回给模型。'
icon: https://raw.githubusercontent.com/YixuanLi911/dsh-mail-widget/main/assets/icon-180.png
