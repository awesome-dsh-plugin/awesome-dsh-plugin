name: Why-147369/dsh-line-pool#dsh-line-pool
category: dev
description:
  en: 'Outbound route pool for DeepSeek Harness. Ships 15 seed routes plus a 20-entry candidate pool covering 7 target kinds (GitHub raw/codeload/main, npm registry, PyPI index, HuggingFace, general). Routes are verified before use — TCP handshake plus a TLS handshake with certificate validation for upstream IP lists (a bare TCP check can be answered locally and report dead IPs as healthy), and failures advance a cooldown ladder of 2/5/15 minutes with the fastest healthy route picked per target kind. Routes are applied by rewriting the URL with one of four rules (prefix, registry, index, host-replace), and the chosen route reaches git, pip, npm, pnpm, gh, curl and wget through three paths: the shell seam (every download command run by the model is intercepted and rewritten automatically), two registered tools the model can call directly (line_pool_status, line_pool_run), and child-process spawn. No global config is modified. A sidebar panel lists every route with latency, failure reason and cooldown countdown, supports per-route retest and enable/disable, shows live TUN/proxy status (network adapter plus local proxy port scan, refreshed within seconds), and the candidate pool is re-verified every 24 hours so newly usable routes are added and dead ones dropped.'
  zh: 'DSH 出站线路池。内置 15 条种子线路 + 20 条候选池，覆盖 7 类目标（GitHub raw/codeload/main、npm registry、PyPI index、HuggingFace、通用）。线路投入使用前均经验证：上游 IP 表用 TCP 握手 + **TLS 握手与证书校验**（纯 TCP 判据会被本地应答伪造，把死 IP 报成可用）；失败沿 2/5/15 分钟冷却阶梯递进，按目标类型选最快健康线路。线路经四种改写规则之一生效（前缀、registry、index、域名替换），并通过三条路径抵达 git/pip/npm/pnpm/gh/curl/wget：**shell 拦截**（模型跑的每条下载命令自动改写）、**两个注册给模型的工具**（line_pool_status、line_pool_run）、子进程传递；全程不改动任何全局配置。侧边栏面板列出每条线路的延迟、失败原因与冷却倒计时，支持单条重测与启停，并常驻显示 **TUN 开关与本地代理端口**（网卡检测 + 端口扫描，数秒内刷新）；候选池每 24 小时重新验证，自动纳入新可用线路、剔除失效线路。'
