url: https://github.com/Weilv-D/dsh-pf-stream
name: Weilv-D/dsh-pf-stream
category: vision
description:
  en: 'Streams and inspects local video for agents: adaptive motion/settle canvas sampling, deterministic probe, timestamp and uniform frame extraction, and RoI zoom on 42px-grid-aligned canvases. Requires ffmpeg and ffprobe on PATH (or configured absolute paths); clips without subtitles also need a ~190 MB local whisper model or a cloud transcription API key.'
  zh: 面向智能体的本地视频流感知与定点检视：动/静双尺度画布采样、元数据探测、时间戳与均匀抽帧、局部放大复核；画布按 42px 网格对齐。需自备 ffmpeg 与 ffprobe（在 PATH 中或在配置里写绝对路径）；无字幕视频另需约 190 MB 本地转写模型或云端转写 API Key。
