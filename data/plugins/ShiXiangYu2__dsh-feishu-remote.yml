url: https://github.com/ShiXiangYu2/dsh-feishu-remote
name: ShiXiangYu2/dsh-feishu-remote
category: notify
description:
  en: 'Control a DeepSeek Harness agent from Feishu/Lark: send a task by DM, an agent runs it with your configured model and replies in the chat, and a feishu_send tool lets the agent push results. Uses lark-cli''s WebSocket connection, so no public webhook is needed, and ships a resident launcher. Note: the plugin does not check who sent a message, so anyone who can DM the bot — by default, members of the Feishu tenant the app belongs to — can drive an agent running with the host''s own model credentials and file permissions. Setup is not one `dsh plugin add`: `lark-cli` must be installed and authenticated once, and a Feishu self-built app with the permissions the README lists is required.'
  zh: '从飞书/Lark 操作 DeepSeek Harness：私聊发送任务，agent 用你配置的模型执行并把结果回到会话；feishu_send 工具可让 agent 主动推送结果。基于 lark-cli 的 WebSocket 长连接，无需公网 webhook，并附常驻启动器。注意：插件不校验发送者身份，因此任何能私聊到该机器人的人（默认即该飞书应用所属企业内的成员）都能驱动一个使用宿主机自身模型凭据与文件权限运行的 agent。安装不是一条 `dsh plugin add` 就完事：需要先全局安装并登录一次 `lark-cli`，并在飞书开放平台建一个带 README 所列权限的自建应用。'
