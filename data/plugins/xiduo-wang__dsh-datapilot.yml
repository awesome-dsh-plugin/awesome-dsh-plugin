url: https://github.com/xiduo-wang/dsh-datapilot
name: xiduo-wang/dsh-datapilot
category: tools
description:
  en: 'A persistent DSH sidebar workbench for local data analysis: nine chart types, column profiles, ONNX model graphs, uploads, structured reports, and built-in ML/DL training across multiple workspaces. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 侧边栏常驻的数据分析工作台：九类图表、列画像、ONNX 模型结构图、上传、结构化报告与内置机器学习训练，跨多工作区查看本地数据。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/xiduo-wang/dsh-datapilot/main/docs/icon.png
