description:
  en: 'TransProof translation proofreader for DeepSeek Harness: full web UI (AI translation needs your own model API key or a local Ollama endpoint) plus a local, non-networked run-local-check agent tool.'
  zh: '译校助手 TransProof 的 DSH 插件：内置完整网页界面，支持 AI 翻译（需自备模型 API Key 或本地 Ollama 端点）、三段流水线校对、术语与专名核验、批量体检改错与一键交付报告；网页版与插件内置同一套界面，另提供一个不联网、不调模型的本地体检 Agent 工具。'
