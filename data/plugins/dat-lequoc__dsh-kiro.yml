url: https://github.com/dat-lequoc/dsh-kiro
name: dat-lequoc/dsh-kiro
category: model
description:
  en: Kiro model provider with Builder ID, Identity Center, Google, GitHub and credential-import sign-in, automatic token and profile refresh, account usage, live model discovery, selectable reasoning efforts, streaming tool calls, provider stop-reason and context-overflow handling, and exact input/output/cache token telemetry whenever Kiro supplies terminal token metadata.
  zh: Kiro 模型提供商，支持 Builder ID、Identity Center、Google、GitHub 与凭据导入登录、token 和 profile 自动刷新、账户用量、实时模型发现、推理档位选择、流式工具调用、上游结束原因与上下文溢出处理；当 Kiro 提供终端 token 元数据时，还会上报精确的输入/输出/缓存 token 遥测。
