description:
  en: "Reorder your own models and providers: drag inside each provider card on the Models settings page; the host returns models in that order and the config is backed up before every write."
  zh: "自定义模型与提供方的排列顺序：在「设置 → 模型」里拖拽调整，宿主的模型列表按这份顺序返回，写配置前自动备份并逐字节校验。"
