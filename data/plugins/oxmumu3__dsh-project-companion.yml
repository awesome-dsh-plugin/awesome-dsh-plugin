name: "oxmumu3/dsh-project-companion"
category: "workflow"
description:
  en: "Personal assistant with logical project boards, bounded workspace access, native conversations, project memory, personal reviews and interest-based public news. Includes a WeChat component; binding still requires the user's own QR scan. API acceptance is not phone receipt."
  zh: "个人助理：按逻辑目标组织项目看板，在授权工作区内整理资料，衔接原生对话、项目记忆、个人回顾与兴趣资讯。单包内置微信组件，仍需本人扫码绑定；接口接受不代表手机实收。"
