name: "oxmumu3/dsh-project-companion"
category: "workflow"
description:
  en: "Personal assistant for projects, conversations, memory, reviews and news. Bundled WeChat pins the QR-confirmed account; first messages cannot claim ownership. An optional allowlist further restricts access. Missing or conflicting identity requires desktop recovery. API acceptance is not phone receipt."
  zh: "个人助理：在授权范围内整理项目，衔接原生对话、记忆、回顾与资讯。单包内置微信，扫码确认账号为唯一操作者，陌生人先发消息不能认领；白名单可进一步限制，身份缺失或冲突会暂停并提示在电脑恢复。接口接受不代表手机实收。"
