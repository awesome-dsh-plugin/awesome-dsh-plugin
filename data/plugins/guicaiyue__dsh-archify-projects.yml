description:
  en: 'Architecture map workbench: register local repos, let a restricted agent (run as a hidden subagent session) read the code with the archify skill, keep branch-level structure and domain diagrams with concepts, temporary/permanent custom diagrams, read-only Q&A, and pick the analysis model from the models DSH already has configured.'
  zh: '代码库架构图册：登记本地仓库，由受限 agent（跑在子代理会话里，不占会话列表）用 archify skill 读代码，按分支维护结构图与领域图，支持概念提取、临时/永久自定义图、只读追问，并可在设置里挑选 DSH 已配好的模型来跑分析。'
