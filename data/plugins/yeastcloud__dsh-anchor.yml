url: https://github.com/yeastcloud/dsh-anchor
name: yeastcloud/dsh-anchor
category: session
description:
  en: 'Session instruction anchor for DeepSeek Harness: the first step of a new session injects a freely composed instruction block as a plugin-sourced message, and the same text is re-anchored after a summarizing compaction or once a configurable number of turns has passed. The trigger reads the durable session log only, so restart, resume and replay reach the same decision, and an /anchor command adds the current combination on demand without a model call. A settings page manages the paged preset library, injection order, re-anchor source and character limits.'
  zh: 'DSH 会话指令定锚：新会话的第一个 step 把自由组合的指令块作为插件来源消息注入，之后在完成压缩或跨过设定轮数时重锚同一段原文。触发判定只读会话日志，重启、续聊、回放得到同一结论；`/anchor` 命令可随时定锚当前组合且不触发模型调用；设置页管理分页预设库、注入顺序、重锚来源与字数上限。'
