name: sw503544488/dsh-harness-launcher
category: ui
description:
  en: 'A Windows desktop shortcut for DeepSeek Harness: it opens the authenticated UI when the harness is running and starts it with no console window when it is not. A Settings page adds the shortcut action, a two-click restart and close, and a switch that keeps the launcher out of the sidebar.'
  zh: 'Windows 上的 DSH 桌面图标：Harness 在运行时直接打开已认证的界面，未运行时以隐藏窗口启动。设置页提供生成该图标、两次点击的重启与关闭，以及把入口从侧栏移开的开关。'
icon: https://raw.githubusercontent.com/sw503544488/dsh-harness-launcher/main/assets/icon-180.png
