description:
  en: 'DSH Pro plugin that plans a task into stages and switches models between stages using DSH native planning, without requiring the WB router gateway. Costs are recorded per stage; unpriced models are marked unavailable rather than guessed. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'WB 路由的 DSH Pro 插件：用 DSH 原生规划把任务拆段并按段切换模型，不依赖网关；按段记账，未配价模型明示不可用、不猜数。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
