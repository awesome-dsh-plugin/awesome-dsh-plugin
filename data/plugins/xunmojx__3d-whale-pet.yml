description:
  en: "A 3D killer-whale desktop pet that follows your cursor, wanders and naps on its own, nods in time to whatever music is playing (local files or any app's audio), and squints with hearts when you pet it."
  zh: "一只 3D 小虎鲸桌宠：跟着鼠标游、自己溜达打盹；放歌时会跟着节拍点头（本地音频或任何软件的声音都行），被摸会眯眼冒爱心。"
