name: xunmojx/3d-whale-pet
category: ui
description:
  en: "A 3D killer-whale desktop pet that follows your cursor, wanders around on its own, naps when idle, and squints with hearts when you pet it. It nods in time when music plays — local files or any app's sound."
  zh: "一只 3D 小虎鲸桌宠：跟着鼠标游、自己溜达、翻跟头打盹，被摸会眯眼冒爱心；放歌时会跟着节拍点头（本地音频或任何软件的声音都行）。"
