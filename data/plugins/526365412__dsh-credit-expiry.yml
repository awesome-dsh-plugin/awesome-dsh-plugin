url: https://github.com/526365412/dsh-credit-expiry
name: 526365412/dsh-credit-expiry
category: usage
description:
  en: 'Credit expiry panel for WorkBuddy, Trae, MiniMax Code, Qoder and Doubao: a sidebar row shows each credit pool balance and its nearest expiry date, and the full page adds expiry buckets, a filterable credit ledger, an expiry calendar with per-platform layers, 7/14/30-day spend charts, the sessions that spent credits, a per-platform subscription and quota overview, expiry notifications, and CSV/JSON export.'
  zh: '积分到期面板：侧边栏底栏一行显示 WorkBuddy、Trae、MiniMax、Qoder 与豆包各积分池的余额和最近到期日；完整页面提供到期分布、可筛选的积分账本、可按时段与平台筛选的到期日历、近 7/14/30 天消耗图表、消耗过积分的会话清单、按平台的订阅与额度总览、到期提醒，以及 CSV/JSON 导出。'
