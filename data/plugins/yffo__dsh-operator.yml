url: https://github.com/yffo/dsh-operator
name: yffo/dsh-operator
category: tools
description:
  en: 'Computer Use for every DSH session: screen capture, mouse and keyboard, app launch, plan and skill replay, an audit log, guards for dangerous actions, a background code agent, and an OCR workflow (text and coordinates) for apps whose accessibility tree is empty. Verified on macOS only: Windows has a basic GUI backend that is unverified, Linux has no desktop backend (calls fail with unsupported_platform), and the window/AX/browser/clipboard tools register on macOS only.'
  zh: '装一次、所有 DSH 会话可用的 Computer Use 插件：截屏、鼠标键盘、启动应用、计划与技能回放、审计日志、危险动作守卫、后台代码代理，以及面向无障碍树缺失应用的 OCR 工作流（文字与坐标）。仅 macOS 已验证：Windows 只有未验证的基础 GUI 后端，Linux 没有桌面后端（调用报 unsupported_platform），窗口/AX/浏览器/剪贴板工具只在 macOS 注册。'
icon: https://raw.githubusercontent.com/yffo/dsh-operator/main/assets/icon.png
