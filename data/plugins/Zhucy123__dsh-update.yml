url: https://github.com/Zhucy123/dsh-update
name: Zhucy123/dsh-update
category: git
description:
  en: 'One-click updater for a source-installed DeepSeek Harness checkout: compares the local tree with the dsh-v* release tags on origin via git ls-remote (read-only), shows the version diff and release notes, and changes nothing until you click. The pipeline runs fetch, four safety gates (required paths, plugin peer conflicts, leftover lib/ of removed packages, post-restart startup log), stash of uncommitted and untracked changes, checkout, pnpm install, clean, build, then restarts DSH and polls /ping until the new process binds the port before reloading the page. Any failure rolls the tree back to the previous version and rebuilds; local changes stay in the stash. The same pipeline also moves forward or back to any historical dsh-v* tag. Network source picks Auto (direct first, then mirrors), GitHub direct with an optional local proxy port, or a fixed mirror (gh-proxy.com, ghproxy.net, ghfast.top); automatic checks run every 1 / 6 / 12 / 24 hours (6 by default) and put a red dot on the button when a new tag appears. The UI ships in Chinese, English and Japanese and follows the DSH locale. All API routes accept loopback requests only. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 源码安装版的一键更新插件：用 git ls-remote 只读比对本地 checkout 与 origin 的 dsh-v* 发布 tag，展示版本差异与发布说明，不点就不动手。更新链路依次 fetch、过四道安全闸门（必需路径、插件 peer 冲突、被删包的残留 lib/、重启后的启动日志）、暂存未提交与未跟踪改动、checkout、pnpm install、clean、build，成功后自动重启 DSH 并轮询 /ping 等新进程绑定端口再刷新页面。任一步失败自动回滚到原版本并重建，本地改动留在 stash 中不丢。同一条链路也能前滚或回退到任一历史 dsh-v* tag。网络来源可选自动（先直连再逐个试镜像）、官方直连（可填本地代理端口）或固定镜像（gh-proxy.com、ghproxy.net、ghfast.top）；自动检查支持 1 / 6 / 12 / 24 小时（默认 6），有新版时按钮带红点。界面中文、English、日本語三语，跟随 DSH 语言设置实时切换。所有 API 路由只接受本机请求。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
