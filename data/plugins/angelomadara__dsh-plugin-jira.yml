url: https://github.com/angelomadara/dsh-plugin-jira
name: angelomadara/dsh-plugin-jira
category: tools
description:
  en: 'Jira integration for DSH: a Settings page stores the site, email and API token, /jira-do fetches the ticket and branches it for the agent, /jira-comment posts a comment or summarizes the branch changes, and the jira_ticket and jira_comment tools read and write issues.'
