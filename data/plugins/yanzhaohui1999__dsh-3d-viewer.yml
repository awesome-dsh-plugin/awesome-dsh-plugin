url: https://github.com/yanzhaohui1999/dsh-3d-viewer
name: yanzhaohui1999/dsh-3d-viewer
category: ui
description:
  en: 'Opens STEP/STP/STL/GLB/GLTF models in a sidebar 3D viewer: STEP is tessellated in the browser with OpenCASCADE WASM, with orthographic/perspective toggle, per-part isolation and a size limit on remote URIs.'
  zh: '在侧栏直接打开 STEP/STP/STL/GLB/GLTF 模型：STEP 用浏览器内的 OpenCASCADE WASM 转网格，支持正交/透视切换、按件隔离，并对远程 URI 设了体积上限。'
