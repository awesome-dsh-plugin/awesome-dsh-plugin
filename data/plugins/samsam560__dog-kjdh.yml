url: https://github.com/samsam560/dog-kjdh
name: samsam560/dog-kjdh
category: ui
description:
  en: "Splash and exit animations for DeepSeek Harness. Five hand-drawn styles (whale light-sweep, pulse, stardust, typewriter, radar rings) — or drop in your own video / GIF. A settings panel controls speed, particle count, accent colour, wording, mute and fit. The exit animation needs the bundled one-time desktop-shell patch (node tools/patch-asar.mjs --apply, reversible); without it closing only hides the window."
  zh: "DeepSeek Harness 的开场 / 退场动画：5 套纯代码自绘样式（鲸鱼光扫 / 极简脉冲 / 星尘汇聚 / 打字机 / 雷达环），也可以换成你自己的视频或动图；设置页可调速度、粒子数、主色、文案、静音与画面适配。退场动画需先运行 node tools/patch-asar.mjs --apply 给桌面壳打补丁（可回滚）；不打补丁时关闭只隐藏窗口。"
