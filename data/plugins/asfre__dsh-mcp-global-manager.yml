url: https://github.com/asfre/dsh-mcp-global-manager
name: asfre/dsh-mcp-global-manager
category: ui
description:
  en: 'Scans MCP configs from the tools it knows (28 built-in sources plus custom ones), syncs diffs into DSH, and lets you import, write back, or edit MCP servers from the DSH sidebar.'
  zh: '扫描本机各工具的 MCP 配置（28 个内置源，支持自定义源），把差异同步进 DSH，并在 DSH 侧栏直接导入、写回或增删改 MCP 服务器。'
