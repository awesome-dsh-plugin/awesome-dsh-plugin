url: https://github.com/asfre/dsh-mcp-global-manager
name: asfre/dsh-mcp-global-manager
category: ui
description:
  en: 'Scans MCP configs from the tools it knows (28 built-in sources plus custom ones), syncs diffs into DSH, and lets you import, sync back, or edit MCP servers from the DSH sidebar. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '扫描本机各工具的 MCP 配置（28 个内置源，支持自定义源），把差异同步进 DSH，并在 DSH 侧栏直接导入、同步回或增删改 MCP 服务器。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
tarball: https://github.com/asfre/dsh-mcp-global-manager/releases/download/v0.2.1/dsh-mcp-global-manager-0.2.1.tgz
