name: ZIye1208/dsh-clean-chat
category: ui
icon: https://raw.githubusercontent.com/ZIye1208/dsh-clean-chat/main/assets/icon-180.png
description:
  en: 'A deliberately context-free chat panel in the right sidebar: it sends only a one-line system prompt plus what you type there, with no tools, no session history and no fork of the current conversation, and keeps the panel history in memory. Each reply reports its own token usage, plus the cache hit rate on routes that return cache stats.'
  zh: '在右侧栏加一个刻意「无上下文」的对话面板：只发一句系统提示和你在面板里输入的内容，不带工具、不复制当前会话、不派生分支，面板历史只存在内存里。每条回复下方显示本轮 token 用量；在返回缓存统计的路由上同时显示缓存命中率。'
