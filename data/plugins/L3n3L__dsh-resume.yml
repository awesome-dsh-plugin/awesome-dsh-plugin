url: https://github.com/L3n3L/dsh-resume
name: L3n3L/dsh-resume
category: workflow
description:
  en: Writing a resume with AI is easy, but the result can still suffer from unsuitable templates, overflow, excessive whitespace, and layout changes caused by small edits. dsh-resume streamlines manual resume refinement and gives DSH an end-to-end workflow for content writing, template selection, layout tuning, and producing tailored resume versions for different job-search scenarios.
  zh: AI 写简历容易，但写完常会遇到模板不合适、排版溢出、页面留白过多，以及改一处导致全局变形等问题。dsh-resume 专注解决手动修改简历繁琐、低效的问题，让 DSH 覆盖从内容撰写、模板选择到排版调优的完整简历工作流，并支持针对不同求职场景产出合适的简历版本。
