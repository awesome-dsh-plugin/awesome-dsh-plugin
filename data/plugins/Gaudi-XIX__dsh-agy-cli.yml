url: https://github.com/Gaudi-XIX/dsh-agy-cli
name: Gaudi-XIX/dsh-agy-cli
category: model
description:
  en: "Windows-only model provider for Google Antigravity CLI. It reads the Antigravity token from the Windows Credential Manager and sends it only to the Google Cloud Code endpoints, while DSH owns the tool policy, approvals, and sandbox. Lean prompts with adaptive tool projection (base exec/file tools plus on-demand mounting via dsh_discover_tools), folding of long historical tool output, and pre-send sanitizing; streams the tail without rollback and tracks the real quota windows."
  zh: "Windows 专用的 Google Antigravity CLI 模型提供方。从 Windows 凭据管理器读取 Antigravity 令牌并只发往 Google Cloud Code 端点；工具策略、审批与沙箱仍由 DSH 全权负责。精简提示词＋工具按需自适应挂载（默认只下发基础执行与文件工具，其余经 dsh_discover_tools 调用时即时挂载）、历史长输出折叠、下发前脱敏清洗；尾流式输出防回滚，并跟踪真实配额窗口。"
