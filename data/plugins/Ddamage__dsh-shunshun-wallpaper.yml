url: https://github.com/Ddamage/dsh-shunshun-wallpaper
name: Ddamage/dsh-shunshun-wallpaper
category: theme
description:
  en: 'Fan-made wallpaper plugin themed on the streamer Zhang Shunfei: full-screen high-definition rotating colorful pegasus GIF wallpaper with theme blending and prominence control, plus a Bilibili music player (add songs by pasting a link, delete, volume, seek, single/list/shuffle loop, and a sidebar mini player).'
  zh: '以网络主播张顺飞为主题的粉丝同人二创壁纸插件：彩色飞马高清旋转动图全屏壁纸，支持主题融合与突出度调节；附带 B站音乐播放器，可粘贴链接添加歌曲、删除、调音量、拖进度条、切换单曲/列表/随机循环，并有侧栏迷你播放器。'
