url: https://github.com/JYT-copy/dsh-minecraft-ui
name: JYT-copy/dsh-minecraft-ui
category: theme
description:
  en: 'Minecraft-styled theme for the DSH web GUI: blocky pixel components, a photo wallpaper library with auto-rotation and local uploads, Minecraft UI sound samples, and a BGM player with a local track library.'
  zh: '给 DSH Web 界面用的 Minecraft 风格主题：方块化像素组件、可自动轮换与本地导入的照片壁纸库、Minecraft 界面音效，以及可导入本地曲目的 BGM 播放器。'