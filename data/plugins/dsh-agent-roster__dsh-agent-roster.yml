url: https://github.com/dsh-agent-roster/dsh-agent-roster
name: dsh-agent-roster/dsh-agent-roster
category: workflow
description:
  en: 'Defines a multi-agent team as reviewed, versioned files, then checks the team that actually runs against them field by field: drift, overridden values and values the runtime does not carry are reported separately. When a team drifts you can write the runtime values back into the roster or hand over to a new generation, and the captain persona is a live file re-read on every step.'
  zh: '把多 Agent 团队写成可评审、可版本化的档案文件，再逐字段核对真正跑起来的团队：「漂移 / 被覆盖 / 运行时未携带」三档分开报；跑偏了可以把运行值回写档案或整队换代，队长人设是活文件、每步重读。'
