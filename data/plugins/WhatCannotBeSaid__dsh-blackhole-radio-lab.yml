description:
  en: 'Opens a full-screen 3-D black-hole stage from a sidebar card, where 24,514 real internet radio stations orbit inside an accretion disc; drag to orbit, hold to cross a wormhole into a star cluster, click a star to play, with search, 13 genre filters, favourites and ICY now-playing titles.'
  zh: '从左栏卡片打开全屏 3D 黑洞舞台，2.45 万台真实网络电台嵌在吸积盘里环绕运行；拖动环绕、按住穿过虫洞进入星团、点星点播放，带搜索、13 个流派筛选、收藏与流内 ICY 曲目信息。'
