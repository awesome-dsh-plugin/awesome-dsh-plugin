url: https://github.com/439436269-ctrl/dsh-zspace
name: 439436269-ctrl/dsh-zspace
category: tools
description:
  en: 'Turns a ZSpace (极空间) NAS into native agent tools: list, stat, search, read, download, upload, write, create folders, rename, move, copy and delete files on the NAS. Works across networks through the desktop client relay — no LAN, no WebDAV, no SSH — and switches to the faster direct WebDAV transport automatically when the NAS is on the same network. Deletes require an explicit confirm: true; write, upload, create-folder, rename, move and copy run directly, and zspace_write overwrites a same-named file unless overwrite is false.'
  zh: '把极空间（ZSpace）NAS 变成 agent 的原生工具：列目录、查属性、按名检索、读取、下载、上传、写入、建目录、重命名、移动、复制、删除 NAS 文件。跨网络走桌面客户端中转——不需要同一局域网、不用 WebDAV、不用 SSH；同一网络时自动改走更快的 WebDAV 直连。删除需显式传 confirm: true；写入、上传、建目录、重命名、移动、复制默认直接执行，zspace_write 会覆盖同名文件（除非传 overwrite: false）。'
