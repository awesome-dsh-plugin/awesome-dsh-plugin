url: https://github.com/VagrAntYuan/dsh-zotero-cite
name: VagrAntYuan/dsh-zotero-cite
category: tools
description:
  en: "Imports PDFs into the local Zotero library, writes native Zotero citation and bibliography fields into Word documents, verifies those fields, and drafts a per-reference citation review report; duplicate items are reported, and merging them uses the Zotero 9.1+ local write API."
  zh: "把 PDF 导入本地 Zotero 文献库，向 Word 文档写入原生 Zotero 引文与书目字段并做校验，同时生成逐篇引用合理性报告；重复条目先报告，合并需 Zotero 9.1+ 本地写接口。"
