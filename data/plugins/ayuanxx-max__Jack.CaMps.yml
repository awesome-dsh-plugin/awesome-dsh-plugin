description:
  en: 'Chat turn accordion: every interaction folds into one row showing a time pill and the question summary, only the latest turn stays open, expanding one folds the others, and the execution process opens only when its own summary is clicked.'
  zh: 会话交互折叠：每次交互压成一行（时间胶囊 + 提问摘要），只保留最近一次展开；展开一条自动收起其它；执行过程仅在单独点击时展开。