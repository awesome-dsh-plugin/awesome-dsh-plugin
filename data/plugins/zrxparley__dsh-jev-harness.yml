description:
  en: 'One switch decides who does the work in DeepSeek Harness. OFF steps aside and uses the DSH model gateway; ON sends every instruction to a JEV judge first, which routes judgment tasks to Kimi and routine execution to DeepSeek Flash. By default the routed calls run through the DSH model gateway (ctx.llm), so only the JEV judge key is needed here; the strategy and execution models are picked from the providers and model ids this DSH install actually has (ctx.llm.listProviders/listModels), auto-ranked or pinned in the panel; Direct mode calls your own OpenAI-compatible gateway instead. Includes a left-sidebar settings page, a composer switch, a hover decision trace (which model actually answered), a traffic dashboard, and a skill router that asks the same judge which of the 39 mattpocock/skills fits the task. Tools: harness_call/harness_classify/harness_review/harness_probe/harness_skill/harness_dsh. No user-facing tier choice.'
  zh: '一个开关决定 DSH 会话由谁干活：关 = 插件让位、走 DSH 自身模型网关；开 = 每条指令先交给 JEV 判定器，再由它自动分流。默认走 DSH 自己的模型网关（ctx.llm）：只需要 JEV 判定器的 key，策略模型与执行模型从这台机器 DSH 真正有的 provider/model 里选（面板下拉或自动挑）；也可以切到直连模式改用本插件自己的 OpenAI 兼容网关。含左侧栏设置页、输入框开关、悬停决策浮层（看这次到底是谁回答的）、流量看板，以及技能路由：同一个判定器会从 mattpocock/skills 的 39 个技能里挑出最合适的一个挂进调用。工具：harness_call/harness_classify/harness_review/harness_probe/harness_skill/harness_dsh。不向用户暴露分层选择。'
