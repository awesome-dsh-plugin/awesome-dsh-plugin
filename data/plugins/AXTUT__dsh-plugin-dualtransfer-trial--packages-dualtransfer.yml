description:
  en: 'Cross-computer Harness Agent messaging, commit-specific task handoff and parallel-branch or shared-baseline Git project collaboration with diff and conflict previews. Pairing, binding and the receiver''s existing local authorization remain required. The same package is distributed for macOS and Windows as a free evaluation build (UNLICENSED, not open source or for production); requires Node.js 24+ and Git 2.38+ for project collaboration. The 7.0.public.1 candidate corrects publication metadata while preserving the 7.0 runtime and Native payloads. Existing macOS records do not establish new Windows execution, fresh SDK, full Host/browser or cross-platform model end-to-end validation for this correction.'
  zh: '跨电脑 Agent 通信、带精确 commit 的任务交接，以及分支并行或共同基线 Git 项目协作，提供差异与冲突预览。须先配对、绑定，并遵守接收端本机既有授权。macOS 与 Windows 分发同一个免费评估试用包（UNLICENSED，非开源，勿用于生产）；需要 Node.js 24+，项目协作另需 Git 2.38+。7.0.public.1 候选更正发布元数据，保留 7.0 运行代码与 Native 载荷。已有 macOS 记录不代表本次已新增 Windows 执行、fresh SDK、完整 Host/浏览器或跨平台模型端到端验收。'
