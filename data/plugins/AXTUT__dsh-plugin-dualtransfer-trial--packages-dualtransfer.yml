tarball: https://github.com/AXTUT/dsh-plugin-dualtransfer-trial/releases/download/candidate.7.0.public.2/dsh-plugin-dualtransfer-0.2.0-candidate.7.0.public.2.tgz
description:
  en: 'Harness messaging between paired computers, commit-specific task handoff, and Git collaboration with parallel branches or a shared baseline, with diff and conflict previews. The 7.0.public.2 candidate lets you associate registered sessions on this computer or a paired device, send to one or confirm a send to all, and see a separate delivery result for each. Existing bindings and local permissions stay in place. macOS and Windows share one free evaluation package (UNLICENSED, not for production). Requires Node.js 24+; Git collaboration also requires Git 2.38+.'
  zh: '为已配对的电脑提供 Harness 消息传递、指定提交的任务交接，以及分支并行或共同基线的 Git 协作，可预览差异和冲突。7.0.public.2 候选版新增会话关联：可单发给本机或已配对设备上的一个关联会话，也可核对名单和正文后群发给全部关联会话，并分别查看每个目标的投递结果。原有绑定和本机权限保持不变。macOS 和 Windows 共用同一个免费试用包（UNLICENSED，勿用于生产）。需要 Node.js 24+；Git 协作另需 Git 2.38+。'
