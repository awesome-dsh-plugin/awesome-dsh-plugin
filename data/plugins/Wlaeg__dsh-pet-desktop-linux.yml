url: https://github.com/Wlaeg/dsh-pet-desktop-linux
name: Wlaeg/dsh-pet-desktop-linux
category: fun
description:
  en: A transparent always-on-top desktop pet for DSH on Linux (X11 / XWayland), driven by the session state. The pet lives outside the browser as its own window, follows the pointer with a distance and per-display limit, shows a live session-status bubble that lists each session task and state, and auto-starts with your session. Linux only (X11/XWayland); needs Python 3 with PyGObject, GTK3, GdkPixbuf and xdotool. Its sprite sheets come from @michengai/dsh-codex-pet (MichengAI/dsh-codex-pet in this list).
  zh: Linux 桌面上的透明置顶 DSH 桌宠（独立于浏览器窗口运行）。桌宠会跟随鼠标目光，但带距离与屏幕限制；悬浮气泡实时列出每个会话的任务名与状态，点击即可跳转；支持随 DSH 会话自启动。仅 Linux（X11/XWayland）；需本机已装 Python 3 与 PyGObject、GTK3、GdkPixbuf、xdotool；精灵图取自本列表内的 MichengAI/dsh-codex-pet。
