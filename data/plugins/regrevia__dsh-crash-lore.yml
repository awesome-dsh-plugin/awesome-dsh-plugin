url: https://github.com/regrevia/dsh-crash-lore
name: regrevia/dsh-crash-lore
category: dev
description:
  en: 'Turns real DSH crash logs into a short rule list: preflight a plugin before it installs, check it against what is installed after, and self-heal in a controlled way when the harness will not start. Install check is a switchable module, on by default.'
  zh: '把 DSH 真实崩溃日志沉淀成精简约束：装插件前静态预检拦崩，装完体检冲突，起不来时受控自愈。安装体检是可开关的模块，默认开。'
icon: https://raw.githubusercontent.com/regrevia/dsh-crash-lore/main/icon.png