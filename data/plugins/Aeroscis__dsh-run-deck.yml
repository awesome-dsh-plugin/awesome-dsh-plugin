name: Aeroscis/dsh-run-deck
category: dev
description:
  en: 'A launch bar above the composer: one button per launcher a project declares in .dsh/run-deck/run.json, using the VS Code tasks.json vocabulary — click to run, click again to stop, with live status, three label densities and a pinnable output card.'
  zh: '输入框上方的启动条：按项目 .dsh/run-deck/run.json 里声明的条目各生成一个按钮（字段沿用 VS Code 的 tasks.json），点一下跑、再点停，附实时状态、三档按钮密度与可钉住的输出卡。'