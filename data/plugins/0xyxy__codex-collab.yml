url: https://github.com/0xyxy/codex-collab
name: 0xyxy/codex-collab
category: skill
description:
  en: 'Skill bundle that installs the codex-collab skill for driving the local OpenAI Codex CLI as a vendor instead of a consultant: every delegation carries acceptance criteria and a self-test script, the result is verified by running those tests locally, and a failure is handed back with its original error output; batch delegation runs sequentially (parallel subprocesses are not usable locally) and multi-turn continuation stays inside one session. Requires the local Codex CLI and PowerShell 7+; the helper scripts are Windows-native and only partially work on macOS/Linux.'
  zh: '把 codex-collab 技能装进 DSH 的技能包：把本地 OpenAI Codex CLI 当供应商而非顾问来派活——每次派活附验收标准与自测脚本，本地跑测试验收，失败把原始报错原样丢回去；支持批量派活（本机子进程并行不可用，按顺序执行）与单会话多轮续接。需已安装本地 Codex CLI 与 PowerShell 7+；辅助脚本为 Windows 原生，macOS/Linux 只能部分运行。'
