name: KunKun24/dsh-until-done
category: agi
description:
  en: Keep working when a turn ends without finishing, and only stop once the reply ends with a completion keyword. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.
  zh: 回合正常结束但任务没做完时自动续跑，回复以「完成」收尾才算真正完成。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
