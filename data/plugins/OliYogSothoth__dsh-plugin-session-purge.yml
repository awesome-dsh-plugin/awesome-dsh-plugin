description:
  en: 'Two-step session deletion: the session menu moves a chat into a recycle bin without deleting anything, the bin panel restores it, and the next start wipes its log, projection cache, spill files and workspace membership.'
  zh: '两步删除会话：会话菜单先把会话移入回收站（此时不删任何内容，可随时恢复），下次启动才真正清掉日志、投影缓存、spill 文件与工作区登记。'
