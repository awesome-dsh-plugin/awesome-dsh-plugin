url: https://github.com/Chengyunlai/dsh-workbench
name: Chengyunlai/dsh-workbench
category: dev
description:
  en: A workbench beside DeepSeek Harness conversations with source navigation, Python class hierarchies, Git diffs, breakpoint debugging, and searchable Markdown memory cards. Go and Java navigation need their own language servers; breakpoint debugging needs separately installed debug adapters (debugpy, Delve, vscode-js-debug); Python class relationships are Python-only and in beta.
  zh: DeepSeek Harness 对话旁的开发工作台，支持源码跳转、Python 类关系、Git 差异、断点调试与可搜索的 Markdown 记忆卡片。Go 与 Java 的源码跳转需自备语言服务器；断点调试需另行安装调试适配器（debugpy、Delve、vscode-js-debug）；Python 类关系仅支持 Python，且处于 beta。
