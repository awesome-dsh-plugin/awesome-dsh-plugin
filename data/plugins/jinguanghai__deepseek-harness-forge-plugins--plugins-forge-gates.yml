  ja: 実際に計算して検証するゲート。数式の簡約、論理の証明、正規表現の検証、E-prover による一階述語論理、状態機械のチェック、コードの修復を、Go でコンパイルしたバイナリ（Windows 向けのビルド済み実行ファイルつき）で行います。
