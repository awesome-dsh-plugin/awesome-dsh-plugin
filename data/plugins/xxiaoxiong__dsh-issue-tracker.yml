url: https://github.com/xxiaoxiong/dsh-issue-tracker
name: xxiaoxiong/dsh-issue-tracker
category: tools
description:
  en: Jira Cloud issue-tracker integration exposing eight model tools for issue search, project and transition lookup, creation, updates, comments, and transitions; writes are opt-in and support dry-run.
  zh: Jira Cloud 工单集成，提供 8 个模型工具用于工单查询、项目与流转查询、创建、更新、评论和状态流转；写操作默认关闭并支持 dry-run。
  ja: Jira Cloud の課題管理との連携。issue の検索、プロジェクトと遷移の参照、作成、更新、コメント、状態遷移を扱う 8 つのモデルツールを提供します。書き込みはオプトインで、ドライランにも対応します。
