url: https://github.com/YeqingTang/dsh-task-watcher-plugin
name: YeqingTang/dsh-task-watcher-plugin
category: notify
description:
  en: 'Windows-only tray monitor for DeepSeek Harness: deploys and manages the standalone DshTaskWatcher tray app - four-state tray icon (gray=disconnected, green=idle, amber=running, red=attention), a per-task panel with live duration/tps/tokens, and completion & outcome notifications. Start/stop switch in Settings > Plugins; the watcher is an independent process that survives DSH restarts.'
  zh: 'Windows 托盘任务监视器：部署并管理独立监视程序——四态托盘图标（灰=未连接、绿=空闲、橙=运行中、红=有待处理）、逐任务实时面板（时长/速度/token）、完成与结局通知。设置→插件内启停开关；监视器独立进程运行，DSH 重启不影响。'
