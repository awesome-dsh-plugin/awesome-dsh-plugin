description:
  en: "Puts the plugins, skills and MCP servers a DSH installation runs into one panel: per-row switches, group and preset management, MCP server add/edit/test, per-tool masking, lazy MCP tools with an on-demand catalog, per-session overlays and saved scenes, plus a manager for official compatibility packs with checksum-verified install, update and uninstall behind explicit confirmations."
  zh: "把这套 DSH 安装里的插件、技能与 MCP 服务收进一个面板：逐行开关、分组与预设管理、MCP 服务器新增/编辑/测试、工具级屏蔽、带按需目录的 MCP 懒加载、按会话的工具覆盖与可保存场景；同时从远端目录管理官方兼容包，安装、更新和卸载均先校验并在确认后执行。"
