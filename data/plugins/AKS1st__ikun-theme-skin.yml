name: AKS1st/ikun-theme-skin
category: theme
description:
  en: 'IKUN fandom skin for the DSH Web UI: star-blue and black-gold palettes in the system theme list, full-screen photo wallpaper rotation, a music box, and a send-button voice line.'
  zh: ikun 主题皮肤：星蓝昼/夜与背带裤黑金三套配色接入系统主题列表，全屏照片壁纸轮播、音乐盒与发送音效。
  ja: DSH Web UI 向けの IKUN ファンスキン。システムテーマ一覧に星空ブルーと黒金の配色を追加し、全画面の写真壁紙のローテーション、ミュージックボックス、送信ボタンのボイスを備えます。
