name: Alan2Z/dsh-speak
category: notify
description:
  en: Voice-announce the final reply on Windows (SAPI5 natural voices) and macOS (system voice); skips reasoning and tool calls, one-line npm install.
  zh: 语音播报 agent 最终回复：Windows SAPI5 自然语音 / macOS 系统语音，自动跳过思考与工具调用，npm 一行安装。
  ja: 最終応答を Windows（SAPI5 のナチュラルボイス）と macOS（システム音声）で読み上げます。推論とツール呼び出しは読み飛ばし、npm で 1 行インストール。
