url: https://github.com/XiaoFeng7418/dsh-plugin-chat-mode
name: XiaoFeng7418/dsh-plugin-chat-mode
category: session
description:
  en: 'Adds a tool-free Chat preset for everyday conversation: no tool schemas are sent, the system prompt is one short tone line or empty, and no OS, git or file-tree snapshot is injected. Measured on a plugin-heavy install, one message costs about 1.9K instead of 36K input tokens (roughly 19x fewer); thinking starts off unless you turn it on; on-device DSH Go verified; v0.2.0 adds local slash commands such as `/chat`, `/tone`, `/temp`, `/web` and `/think`, plus opt-in web search that only costs model tokens.'
  zh: '新增零工具的「Chat（轻量对话）」模式，用来做日常聊天：不发送任何工具 schema，系统提示只剩一句极简语气提示或完全留空，也不注入系统、git 与文件树快照。在插件较多的环境实测，单条消息的输入 token 从约 36K 降到约 1.9K（约 19 倍）；思考默认关闭，需要时可在界面里打开；已在安卓 DSH Go 上实机验证。v0.2.0 增加本地斜杠命令（`/chat`、`/tone`、`/temp`、`/web`、`/think`），并支持按需开启联网搜索（只计模型 token）。'
tarball: https://github.com/XiaoFeng7418/dsh-plugin-chat-mode/releases/download/v0.2.0/dsh-plugin-chat-mode-0.2.0.tgz
