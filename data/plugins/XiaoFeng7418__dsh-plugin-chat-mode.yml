url: https://github.com/XiaoFeng7418/dsh-plugin-chat-mode
name: XiaoFeng7418/dsh-plugin-chat-mode
category: session
description:
  en: 'Adds a tool-free Chat preset for everyday conversation: no tool schemas are sent, the system prompt is one short tone line or empty, and no OS, git or file-tree snapshot is injected. Measured on a plugin-heavy install, one message costs about 1.9K instead of 36K input tokens (roughly 19x fewer); thinking starts off unless you turn it on; on-device DSH Go verified; v0.2.0 adds local slash commands such as `/chat`, `/tone`, `/temp`, `/web` and `/think`, plus opt-in web search that only costs model tokens; v0.3.0 adds web-like composer toggles for thinking and web search that stay in sync with those commands; v0.3.1 gives them DeepSeek-style SVG icons, hover hints and motion, and keeps unrelated global tools out of the request; v0.3.2 adds the web app one-shot icon rotation, removes the square host focus frame, and quiets the hint after a click; v0.3.3 releases the per-session tool mask when the preset changes, so switching Chat to PTC or Standard no longer loses tools; v0.4.0 adds native image vision, inline text up to 8 KiB, zero-dependency DOCX extraction, and an on-demand read_attachment tool that only exists while the current message carries an upload.'
  zh: '新增零工具的「Chat（轻量对话）」模式，用来做日常聊天：不发送任何工具 schema，系统提示只剩一句极简语气提示或完全留空，也不注入系统、git 与文件树快照。在插件较多的环境实测，单条消息的输入 token 从约 36K 降到约 1.9K（约 19 倍）；思考默认关闭，需要时可在界面里打开；已在安卓 DSH Go 上实机验证。v0.2.0 增加本地斜杠命令（`/chat`、`/tone`、`/temp`、`/web`、`/think`），并支持按需开启联网搜索（只计模型 token）；v0.3.0 在输入框旁提供与网页端同款的「深度思考」与「联网」双开关，并与斜杠命令双向同步；v0.3.1 换成 DeepSeek 同款线框图标，加悬停提示与柔和微交互，并确保请求里不会混入无关的全局工具；v0.3.2 对齐网页端的单次旋转动效，去掉宿主遗留的直角外框，并让点击后的提示气泡自动收起；v0.3.3 在切换预设时释放该会话的工具屏蔽，从 Chat 切到 PTC 或标准模式不再丢失工具；v0.4.0 支持原生识图、8 KiB 内联文本与零依赖 DOCX 抽取，并按需为当前消息放行 read_attachment 读取上传文件。'
tarball: https://github.com/XiaoFeng7418/dsh-plugin-chat-mode/releases/download/v0.4.0/dsh-plugin-chat-mode-0.4.0.tgz
