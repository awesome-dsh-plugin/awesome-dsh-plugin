description:
  en: 'It logs how you talk to your AI — the 7th "final version" gets a bold red page, a late-night rewrite request gets underlined, a "thanks" earns a gold star, and a post-AGI verdict decides your fate. All local, rule-based, bilingual.'
  zh: 记着你怎么跟 AI 说话——第 7 次「最后一版」红页加粗，半夜改需求红页画线，一句「谢谢」金页贴花，AGI 来了翻本子给你发清算判决书。纯本地规则引擎，中英双语。
