description:
  en: 'Provider and account hub for DeepSeek Harness: several API-key accounts per provider with one-click switching and failover when a call dies on quota or credential errors, a per-account usage and quota panel in the conversation header, built-in Grok Build device-code OAuth, and pre-filled vendor templates for OpenAI-compatible gateways such as Huawei Cloud MaaS and WorkBuddy.'
  zh: 'DeepSeek Harness 的提供商与账号中心：同一提供商保存多个 API Key 账号并一键切换，请求因额度或凭据失败时自动换号；会话头部按账号显示用量与配额进度条；内置 Grok Build 设备码 OAuth；并提供华为云 MaaS、WorkBuddy 等 OpenAI 兼容网关的厂商模板。'
