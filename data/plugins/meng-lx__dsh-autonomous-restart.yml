url: https://github.com/meng-lx/dsh-autonomous-restart
name: meng-lx/dsh-autonomous-restart
category: session
description:
  en: 'Restart initiated by the agent itself, not by a button. The agent calls one tool, then the plugin takes over: it waits until every agent and background job on the host is idle, runs a visible ten-second countdown that a click, a scroll, or a key press cancels, then restarts DSH and wakes the original session so the agent carries on from its last sentence. No button, no manual entry: the tool is the only way in. Works on the official desktop app and the official web client; third-party shells are not supported out of the box. Windows only. Known risk: every launch of the DSH desktop app writes a fresh identity cookie into its own profile and never prunes the old ones. Enough restarts and the cookie header outgrows the request limit, so the next launch dies with HTTP 431 and `Error: desktop welcome: Web authentication failed` before any window appears. This plugin restarts far more often than a person would by hand, so it brings that day closer. The failure lives in the DSH profile, not in the restart logic. If that trade-off is not acceptable, use a lighter restart approach or restart by hand instead.'
  zh: '由 agent 自己发起的重启，不是按钮。agent 调一个工具，之后由插件接管：等这台机器上所有 agent 与后台任务都空闲，走完十秒可见倒计时（点一下鼠标、滚一下滚轮、按任意键都会取消），再重启 DSH，并唤醒原会话让 agent 接着说下去。没有按钮、没有手动入口——工具是唯一入口。官方桌面端与官方网页端均已适配，第三方壳不在默认支持范围内。仅限 Windows。已知风险：DSH 桌面端每次启动都会往自己的 profile 里写一份新的身份 cookie，旧的不清理；重启次数多了，cookie 会堆积到请求头超限，下一次启动直接失败，窗口出不来，报 HTTP 431 与 Error: desktop welcome: Web authentication failed。本插件比手动重启频繁得多，因此会加速这一天的到来。这个失败发生在 DSH 自己的 profile 里，与插件的重启逻辑无关。不能接受这个风险的话，请改用更轻的重启方式，或者手动重启。'