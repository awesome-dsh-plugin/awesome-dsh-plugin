description:
  en: 'Conversation outline for DeepSeek Harness: the Markdown headings of the whole session, grouped by turn, in a side panel or a full-width curtain; hover previews can be pinned for comparison, bookmarks keep the places you come back to, and a right-click jumps to a section or copies a heading and the levels below it. Six theme colours and a translucent material, title/prompt/full-text/cross-session search, reading-position follow and a Chinese/English interface.'
  zh: 'DeepSeek Harness 对话大纲：按回合整理整段会话的 Markdown 标题，侧边面板与全屏「幕布」两种视图；悬停预览可钉住对照，书签留住常回看的几处，右键即可跳转到某一节或复制标题及其下面所有层级。支持六种主题色与半透明材质、标题/提问/全文/跨会话搜索、阅读位置跟随与中英双语界面。'
