name: tangyixiao/dsh-workbuddy-connect-community
category: model
description:
  en: Community-maintained WorkBuddy and WorkBuddy AI model provider using local desktop sign-in, with model discovery and credit display. Version 0.1.23 retains saved-account credit refresh, check-in observations, and bounded 1/7/30-day statistics for text usage observed by this plugin; it refreshes exact-account context-window choices while retaining the CLI model roster and input/output budget, with one bounded supplementary CN read for missing tiers; it supports per-model context-window selection and DSH 0.2.1-rc.2, rc.3, rc.5 and 0.2.2-rc.1/rc.3; its CN compatibility layer differs from the functy23 fork. Derived from corrinehu/dsh-workbuddy-connect (MIT), it registers the same workbuddy / workbuddy-ai provider ids, so it cannot be enabled together with the original or other WorkBuddy bridges. Version 0.1.23 explicitly applies the synchronous Host request policy and authenticated owner admission to all nine registered HTTP routes, including update metadata, before body reads or route actions; missing, throwing, malformed or asynchronous admission services fail closed.
  zh: 复用本机桌面登录的 WorkBuddy 与 WorkBuddy AI 模型提供器社区分叉，提供模型发现和额度显示。正式版 0.1.23 保留已保存账号额度刷新、签到结果及插件观察到的文本用量 1/7/30 天有界统计，刷新精确账号的上下文窗口选项，保留 CLI 模型列表与输入/输出预算，并仅在缺少档位时执行一次有界 CN 补充读取；支持按模型选择上下文窗口及 DSH 0.2.1-rc.2、rc.3、rc.5 和 0.2.2-rc.1/rc.3，CN 兼容层与 functy23 的分叉不同。派生自 corrinehu/dsh-workbuddy-connect（MIT），注册相同的 workbuddy / workbuddy-ai provider id，不能与原版或其它 WorkBuddy 桥同装。0.1.23 对全部九条 HTTP 注册路由（含更新元数据）显式执行同步宿主请求策略与 owner 准入，先认证再读取请求体或执行动作；服务缺失、抛错、畸形或异步返回均拒绝。
