name: tangyixiao/dsh-workbuddy-connect-community
category: model
description:
  en: Community-maintained WorkBuddy and WorkBuddy AI model provider using local desktop sign-in, with model discovery and credit display. Declares DSH 0.2.1-rc.2 and rc.3 compatibility, with a CN compatibility layer that differs from the functy23 fork. Preview 0.1.7-rc5.2 adds per-model context-window selection and DSH rc.5 support; select it explicitly from GitHub Releases.
  zh: 复用本机桌面登录的 WorkBuddy 与 WorkBuddy AI 模型提供器社区分叉，提供模型发现和额度显示。声明兼容 DSH 0.2.1-rc.2 和 rc.3，CN 兼容层与 functy23 的分叉不同。预览版 0.1.7-rc5.2 支持按模型选择上下文窗口及 DSH rc.5，需在 GitHub Releases 显式选择。
tarball: https://github.com/tangyixiao/dsh-workbuddy-connect-community/releases/download/v0.1.6/dsh-workbuddy-connect-community-0.1.6.tgz
