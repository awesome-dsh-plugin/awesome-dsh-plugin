url: https://github.com/literaf/dsh-ai4scholar
name: literaf/dsh-ai4scholar
category: tools
description:
  en: 'AI4Scholar academic search: 38 tools over Semantic Scholar, PubMed, Google Scholar, arXiv, bioRxiv/medRxiv, and DOI resolution (search, citation graph, authors, recommendations, PDF full text in slices, auto-cite, scientific figures), a unified cross-platform search with de-duplication, an API-key card in Settings, and per-call credit accounting with an `/ai4scholar` balance card.'
  zh: AI4Scholar 学术检索：覆盖 Semantic Scholar、PubMed、Google Scholar、arXiv、bioRxiv/medRxiv 与 DOI 解析的 38 个工具（搜索、引用图谱、作者、推荐、PDF 全文分片、自动引用、科研绘图），跨平台去重统一搜索，设置页 API Key 卡片，按次积分统计与 `/ai4scholar` 余额卡。
  ja: AI4Scholar の学術検索。Semantic Scholar、PubMed、Google Scholar、arXiv、bioRxiv/medRxiv、DOI 解決にまたがる 38 のツール（検索、引用グラフ、著者、推薦、PDF 全文の分割取得、自動引用、図表）に加え、重複を除いた横断検索、設定画面の API キーカード、`/ai4scholar` の残高カードによる呼び出しごとのクレジット管理を備えます。
