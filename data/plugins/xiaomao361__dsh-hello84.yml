  en: A theme-independent floating 1984 Macintosh companion for DeepSeek Harness with animated CRT states, ClaraCore-inspired InnerLife proactive thoughts, Mini DSH sidecar agent, retro CLI Terminal, flip Note Pad, Floppy Disk Markdown/PNG export, Alarm Clock, MacPaint Lite, and Minesweeper.
