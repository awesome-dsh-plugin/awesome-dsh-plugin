url: https://github.com/almost-nowhere/dsh-antigravity
name: almost-nowhere/dsh-antigravity
category: model
description:
  en: "Google Antigravity model provider based on LiZhenNet/dsh-antigravity, with a multi-account pool added. Do not install it in the same profile as LiZhenNet/dsh-antigravity: both register the same bundle id (dsh-antigravity) and the same npm package name."
  zh: Google Antigravity 模型提供商插件，基于 LiZhenNet/dsh-antigravity，增加了账号池。请勿与上游 LiZhenNet/dsh-antigravity 同装：两者注册同一个 bundle id（dsh-antigravity）和同一个 npm 包名。
