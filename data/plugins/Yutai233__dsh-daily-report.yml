url: https://github.com/Yutai233/dsh-daily-report
name: Yutai233/dsh-daily-report
category: session
description:
  en: 'Turns DSH sessions into a one-page daily brief: what you did, tokens spent, where you got stuck and what comes next. A morning card above the welcome-page whale, data pulled from other session plugins, and Windows reminders when you sit too long.'
  zh: 把 DSH 会话变成一页日报：做了什么、花多少 token、卡在哪、明天接着做什么。欢迎页鲸鱼上方有早晨卡片，可与其他会话插件内容联动，另有 Windows 久坐提醒。
