url: https://github.com/LittleBlackTong/dsh-plugin-memory
name: LittleBlackTong/dsh-plugin-memory
category: memory
description:
  en: 'Long-term cross-session markdown memory with an LLM-Wiki structure and a SOUL.md persona, injected at session start (by default only after the first user message and only in the active session), plus remember/recall/consolidate/forget workflows, an embedded memory skill, pack/unpack migration tooling, and an idle-time first-person recall nudge that surfaces real memories in a companion voice. Also gives the store observability and upkeep it lacked: a per-file boot-block budget that keeps the index routing table from being truncated, automatic last_access stamping so salience decay actually works, a read-only memory health dashboard (size, freshness, lint-parity checks), a declarative index compiler (pages declare summary:, one command re-lines the index), an interactive memory graph (page links plus shared tags, draggable, wheel zoom), structured queries (tag/type/salience/hot/stale filters), cross-link suggestions for pages that have no relationship yet, and a `checkup` report that ends in a prioritised action list. The boot payload was also cut by ~23% by moving operational detail into the on-demand skill. Its settings section now carries its own navigation mark (a brain half wired to a node cluster, since the shell offers no icon slot to plugins) and a feedback entry that opens this repository. Requires DSH session format v4 (official DeepSeek Harness 0.1.7+): injected messages declare the producer-owned source kind plugin:memory. v0.11 added a bilingual settings panel whose copy and sidebar label follow DSH language setting (中文「记忆」/ English "Memory"); v0.12 added the shared cross-plugin speech floor, a context-sensitive tone section and a weekly growth recap; v0.13 declares its DSH compatibility via engines.dsh (official 0.2.1-rc.5 series; older hosts are refused by the gate), adds a "Review now" button (POST /api/memory/control, action growth-now) that sends one growth recap immediately while still respecting the speech floor, panel accessibility (aria labels, status and alert roles, focus-visible rings), and the public PROACTIVE-PROTOCOL.md. v0.14 adds per-session memory: a composer chip with a dropdown (this session / workspace default), the /memory on|off|status command, and a settings-panel switch all flip the same gate — off means no boot injection, no digest/recall nudges and no last_access stamping for that session (nothing is deleted); disabledWorkspaces lets whole projects default to off, and session choices persist for 7 days. v0.15 adds a Basic soul (quick forging) card: my name / what I call you / baseline persona, saved into a managed block inside SOUL.md (the rest of the file is left untouched) and marks BOOTSTRAP complete; existing chat-forged souls are echoed from the SOUL text, and the boot block now asks the agent to remind the user to forge first when no soul exists yet. v0.16 turns the memory graph into an interactive 3D sphere (Canvas, zero dependency): drag to rotate, wheel to zoom, drag nodes to arrange them in 3D, double-click empty space to reset, auto-spin (reduced-motion aware); hover or click a node to instantly light up its neighbours (displacement+duration click threshold), and colours adapt to light/dark panel themes. v0.17 adds graph search (ranked matches, the camera flies to the hit and lights up its neighbours), Reveal in Finder / Copy path for any node (the host command is awaited, and the absolute path is copied automatically when reveal fails), Windows support (path-variable expansion, CRLF parsing with style-preserving writes, explorer /select, argv and exit-code handling, case-insensitive workspace matching), plus a much shorter README with real screenshots.'
  zh: '带 LLM Wiki 结构与 SOUL 人格文件的长期 markdown 记忆库：会话启动注入 boot 块（默认提问后才注入、且只注入当前激活会话），含 remember/recall/consolidate/forget 工作流、内嵌 memory 技能、pack/unpack 迁移工具，以及空闲时以第一人称主动追忆（recall nudge）的拟人化能力。同时补上记忆库原先缺的“可观测 + 可维护”：按文件分配 boot 预算（索引路由表不再被截断）、自动戳记 last_access（salience 衰减真正生效）、只读记忆健康看板（体量/新鲜度/与 lint 同源的体检）、声明式索引编译器（页面声明 summary:，一条命令重写索引行），可拖动、可滚轮缩放的记忆图谱（页间链接 + 共享 tag）、结构化检索（tag/type/salience/hot/stale 过滤）、针对「尚无内容关系」页面的补链建议，以及以「最该做的 N 件事」收尾的 `checkup` 体检报告。同时把操作细节移到按需加载的技能，boot 注入体量减少约 23%。设置区块现在还有专属侧栏图标（半脑 + 节点——因为设置 shell 不给插件留图标位）和直达本仓库的反馈入口。要求 DSH session format v4（官方 DeepSeek Harness 0.1.7+）：注入消息使用 producer-owned source kind plugin:memory。 v0.11 起设置面板与侧栏 label 跟随 DSH 语言设置（中文「记忆」/英文 "Memory"）；v0.12 新增跨插件共享发言权、按语境微调的语气段与每周成长回顾；v0.13 用 engines.dsh 声明 DSH 兼容范围（官方 0.2.1-rc.5 系列，旧宿主会被闸门拒绝），新增「立即回顾」按钮（POST /api/memory/control，action growth-now，立即发一次成长回顾且仍尊重发言权）、面板可访问性（aria-label、status/alert role、focus-visible 焦点环）与公开的 PROACTIVE-PROTOCOL.md。v0.14 新增按会话记忆开关：输入框芯片（下拉可选本会话 / 此工作区默认）、/memory on|off|status 命令与设置面板开关共用同一判定——关闭后该会话不注入 boot 块、不发 digest/追忆提醒、不盖 last_access（记忆文件不删）；disabledWorkspaces 可让整个项目默认关闭，会话选择持久化 7 天。v0.15 新增「人格基础（快速铸魂）」卡片：我的名字 / 你的称呼 / 基础人格描述，保存写入 SOUL.md 受管区块（其余内容一字不动）并把 BOOTSTRAP 标 complete；对话铸魂的老库会从 SOUL 文本回显，未铸魂时 boot 块会先提醒用户完成铸魂。v0.16 把记忆图谱升级为可交互 3D 球面（Canvas 手绘、零依赖）：拖拽旋转、滚轮缩放、拖节点 3D 整理布局、双击空白重置、自动慢转（尊重减少动态效果）；悬停或点击节点即时高亮邻居（位移+时长点击阈值），配色随浅色/深色面板自适应。v0.17 新增图谱搜索（排序匹配，镜头飞到命中的节点并点亮邻居）、节点的「在 Finder 中显示 / 复制路径」（等待命令结果，失败自动复制路径兜底）、Windows 兼容（路径变量展开、CRLF 读写保留换行风格、explorer 参数与退出码处理、工作区大小写匹配），README 精简并加入真实截图。'
