description:
  en: 'Select-all cleanup for archived DeepSeek Harness sessions: deletes the session log, projection cache, workspace accounting and archive marker, cascades subagent logs, and can also remove unreferenced attachments, the request-image cache, the workspace files a Session wrote and leftovers of already-deleted Sessions.'
  zh: 'DSH 归档会话清理：全选并永久删除归档会话的日志、投影缓存、工作区记账与归档标记（级联子代理日志），可选深度清理无人引用的附件、请求图缓存与该会话写出的工作区文件，并可扫描已删除会话的历史残留。'
