url: https://github.com/yingrui96/dsh-attention-board
name: yingrui96/dsh-attention-board
category: ui
description:
  en: 'An always-on attention pill in the session header. One glance shows how many sessions are waiting on you — approvals, questions, and failures — and what you already declined. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '会话头部的常驻注意力胶囊：一眼看到还有几个会话在等你——待批准、待回答、出错，以及你已经拒掉的事。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
