name: du-u-uck/DSH-Transparent-UI-Plugin
category: theme
description:
  en: 'Aqua glassmorphism theme for the DeepSeek Harness web UI: mica and compatibility modes with adjustable blur and frost, fluid or wallpaper backdrop, background brightness, particle-whale accent, and a master switch that restores the stock UI.'
  zh: 'Aqua 玻璃质感主题：云母/兼容双模式、可调模糊与磨砂、流体/壁纸背景、背景亮度、粒子鲸鱼点缀，一键关闭即还原原生界面。'
