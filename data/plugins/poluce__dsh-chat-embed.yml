description:
  en: "A multi-tab AI chat panel for the desktop app: seven services (DeepSeek, 豆包, ChatGPT, MiniMax, Kimi, Gemini, Grok) each run in their own webview and login partition, and the chat can live in the left navigation panel or in a right sidebar tab — whichever one you open owns it."
  zh: "桌面版的多标签 AI 聊天面板：七个服务（DeepSeek、豆包、ChatGPT、MiniMax、Kimi、Gemini、Grok）各自在独立 webview 与独立登录分区中运行，聊天页可放在左栏主面板或右栏标签里——哪边点开就由哪边承载。"
