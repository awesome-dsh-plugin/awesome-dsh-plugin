name: dingchenhui0618-arch/dsh-plugin-daily
category: workflow
description:
  en: 'Daily brief for DeepSeek Harness. At a fixed hour (11:00 by default) it reads the plugin market''s own catalog — the same JSON the market browser uses — ranks it by real install counts and stars, and proposes two kinds of item: a concrete delta on a plugin people actually use (the original does A, this one would do B) and a direction nobody has built yet. Popularity numbers are quoted into the prompt rather than guessed, and an entry the market has not measured stays unmeasured instead of becoming zero. Every item is re-checked by pure functions before you see it: evidence has to match a pooled repository word for word, a delta that only says "improve the UX" is dropped and counted, and a title that renames the source repository is refused. Approving an item opens a new session named after it through the same host path the GUI''s own "new session" button uses, and hands that session a fixed delivery contract: implement independently, never fork, tests green before publishing. The panel is a tab in the conversation view; 202 unit tests, zero runtime dependencies. Formerly dsh-daily — the package and repository are now dsh-plugin-daily. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: DSH 每日简报。到点（默认 11:00）读市场自己发布的目录——就是市场浏览器用的那份 JSON——按真实下载量与 star 排一遍，产出两类条目：对已经有人真在用的插件的具体改法（原版是 A，提案做成 B），以及生态里还没有的新方向。热度数字原样写进提示词而不是由模型猜；市场没测到的条目保持「无热门度数据」，绝不当作 0。每条在你看到之前都要过纯函数校验：证据必须逐字命中候选池里的仓库，只写「优化体验」的改法会被丢弃并计数，把标题写成原仓库名的「改名重发」会被拒。批准一条会走 GUI「新会话」用的同一条宿主路径，按项目名开一个会话，并把一份固定交付契约交给它：独立实现、不许 fork、测试全绿才发布。面板是对话视图里的一个「日报」Tab；202 个单测、零运行时依赖。原名 dsh-daily，包名与仓库现已改为 dsh-plugin-daily。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。
