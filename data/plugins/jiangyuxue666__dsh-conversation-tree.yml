name: jiangyuxue666/dsh-conversation-tree
category: session
description:
  en: 'Workspace-wide conversation tree for DeepSeek Harness: every conversation and branch on one canvas with its source turn, own token usage and notes; compare two branches, bring a summary back, export, archive, and an undoable subtree deletion (macOS and Windows only).'
  zh: '工作区级对话树：所有对话与分支画在同一块画布上，节点显示来源轮次、各自用量与备注；可并排对比两条分支、把来源会话压缩成摘要带回、导出 Markdown、归档，并可撤销删除子树（删除仅限 macOS 与 Windows）。'
