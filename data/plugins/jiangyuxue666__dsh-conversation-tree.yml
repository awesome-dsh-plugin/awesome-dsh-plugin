name: jiangyuxue666/dsh-conversation-tree
category: session
description:
  en: 'Workspace-wide conversation tree for DeepSeek Harness: every conversation and branch on one draggable canvas with its source turn and own token usage, plus bring-back summaries, archive, and subtree deletion on macOS and Windows.'
  zh: '工作区级对话树：所有对话和分支画在同一块可拖拽的画布上，节点显示来源轮次与各自用量，可把来源会话压缩成摘要带回，并支持归档与删除子树（删除仅限 macOS 与 Windows）。'
