url: https://github.com/guiyinrenshi/dsh-hermes-link/tree/main/packages/dsh-hermes-link
name: guiyinrenshi/dsh-hermes-link#dsh-hermes-link
category: tools
description:
  en: 'Compatibility fork of the Hermes ↔ DSH bridge, working on dsh 0.2.x: receives Hermes-dispatched tasks over JSON-RPC and SSE, exposes 16 DSH-side tools for importing, consulting and dispatching to Hermes, mirrors DSH sessions to Hermes with redaction, and adds a link doctor plus metrics endpoints.'
  zh: 'Hermes ↔ DSH 双向桥接插件的兼容性分支，可在 dsh 0.2.x 上运行：接收 Hermes 下发的任务（JSON-RPC 与 SSE），提供 16 个 DSH 侧工具用于导入会话、咨询 Hermes 与向 Hermes 派单，支持带脱敏的会话镜像，并附带链路诊断与指标接口。'
