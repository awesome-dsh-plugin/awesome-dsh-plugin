url: https://github.com/NIRVANA-APOC/dsh-api-cost
name: NIRVANA-APOC/dsh-api-cost
category: usage
description:
  en: 'Registers an apiCost session projection that estimates DeepSeek spend from reported token usage at published peak / off-peak rates, in CNY and USD, over self, delegation-tree or verified-team scopes: a composer-dock pill and its detail panel, the /cost command, a session_cost tool, and GET routes for the view and the current rate card. A panel switch parks model requests at the llm/stream waterfall while peak rates apply and dispatches them unchanged once the off-peak window opens, so the call is billed at the off-peak rate with no failure reported to the session.'
  zh: '注册 apiCost 会话投影，按官方公布的峰谷价目表把上报的 token 用量折算成 ¥/$ 花费，覆盖本会话、委派树与经校验的团队三种范围：输入框下方的胶囊与其详情面板、/cost 命令、session_cost 工具，以及读取视图与当前价目表的 GET 路由。面板上的开关可在高峰时段把模型请求停在 llm/stream 上，待谷时窗口开启后原样派发，于是按谷时价计费，且会话中不会出现任何失败。'
