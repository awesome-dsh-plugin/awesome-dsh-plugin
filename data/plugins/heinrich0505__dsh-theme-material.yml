name: heinrich0505/dsh-theme-material
category: theme
description:
  en: "Eight Material-family colour themes for DeepSeek Harness (Palenight, Ocean, Darker, Lighter, Catppuccin Latte, Vitesse, Snazzy and GitHub Gray), each with light and dark palettes, switched from a row of colour cards in Settings → General → Theme."
  zh: "为 DeepSeek Harness 做的八套 Material 系配色（夜紫、幽蓝、墨灰、素白、奶咖、青苔、霓光、灰阶），每套含深浅两版，在「设置 → 通用 → 主题」里点色卡切换。"
