description:
  en: 'Declares image input on relay routes whose endpoint omits modality metadata, so models that can see photos stop being rejected as text-only.'
  zh: '为端点不返回模态元数据的中转路由补上图片输入声明，让本来就能看图的模型不再被当成纯文本拒收。'
