description:
  en: 'Stops the agent from re-reading the same code every turn: verified results are cached and reused, and only the affected part is recomputed when code changes.'
  zh: '解决 AI 重复阅读上下文的问题：问过的结果记下来直接复用，代码改了只重算受影响的部分，省 token、提效率。'
