url: https://github.com/renorai/dsh-renor
name: renorai/dsh-renor
category: memory
description:
  en: 'Connects DeepSeek Harness to the hosted Renor memory MCP server over Streamable HTTP, using a Renor API key from RENOR_API_KEY, so the model can call Renor''s recall and save tools. It is a configuration bundle with no code of its own.'
  zh: '通过 Streamable HTTP 把 DeepSeek Harness 连接到托管的 Renor 记忆 MCP 服务器，使用环境变量 RENOR_API_KEY 中的 Renor API Key，让模型能调用 Renor 的检索与保存工具。这是纯配置包，自身不含代码。'
