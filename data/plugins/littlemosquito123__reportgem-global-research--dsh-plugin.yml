url: https://github.com/littlemosquito123/reportgem-global-research/tree/main/dsh-plugin
name: littlemosquito123/reportgem-global-research#dsh-plugin
category: tools
description:
  en: Connects DSH to ReportGem's hosted MCP server to search and cite investment-bank research reports, company filings, earnings-call notes and charts, with source links and page numbers. Adds a Connect ReportGem card on the Plugins page for OAuth sign-in. Free to try with a ReportGem account (new accounts get 10 free credits, about 100,000 returned tokens); after that, usage is billed in credits.
  zh: 把 DSH 接到 ReportGem 托管的 MCP 服务，检索并引用投行研报、公司公告、业绩会纪要和图表，答案附来源链接和页码。在插件页添加“连接 ReportGem”卡片，用 OAuth 登录。注册 ReportGem 账号即可免费试用（新账号赠送 10 积分，约 10 万 token 返回资料），用完后按积分计费。
icon: https://raw.githubusercontent.com/littlemosquito123/reportgem-global-research/main/dsh-plugin/icon.png
