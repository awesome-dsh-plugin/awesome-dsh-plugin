name: littlemosquito123/reportgem-global-research#dsh-plugin
category: tools
description:
  en: Connects DSH to ReportGem's hosted MCP server to search and cite investment-bank research reports, company filings, earnings-call notes and charts, with source links and page numbers. Adds a Connect ReportGem card on the Plugins page for OAuth sign-in. Requires a ReportGem account; usage is billed in credits, and new accounts get 10 free credits.
  zh: 把 DSH 接到 ReportGem 托管的 MCP 服务，检索并引用投行研报、公司公告、业绩会纪要和图表，答案附来源链接和页码。在插件页添加“连接 ReportGem”卡片，用 OAuth 登录。需要 ReportGem 账号，按积分计费，新账号赠送 10 积分。
icon: https://raw.githubusercontent.com/littlemosquito123/reportgem-global-research/main/dsh-plugin/icon.png
