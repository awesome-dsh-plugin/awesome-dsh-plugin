description:
  en: 'Skill hub: browse and classify local agent skills, compose them into teams with roles and stages, insert a skill prompt into the composer in one click, and keep third-party API keys in the OS keychain instead of dotfiles.'
  zh: '技能中枢：罗列与分类本机 skill，按角色与流程编排专家团，一键把 skill 提示词插进输入框，并把第三方 API Key 收进系统钥匙串而不是 dotfiles。'
