url: https://github.com/TongjieYang/dsh-skill-hub
name: TongjieYang/dsh-skill-hub
category: skill
description:
  en: 'Skill hub: browse and classify local agent skills, compose them into teams with roles and stages, insert a skill prompt into the composer in one click, and keep third-party API keys in the OS keychain instead of dotfiles. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '技能中枢：罗列与分类本机 skill，按角色与流程编排专家团，一键把 skill 提示词插进输入框，并把第三方 API Key 收进系统钥匙串而不是 dotfiles。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
