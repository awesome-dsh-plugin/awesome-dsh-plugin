description:
  en: 'Domi-grade git worktree isolation and delivery: permanent worktrees under .dsh-worktrees, ready-for-review / apply / finish / discard lifecycle with conflict handling and safe cleanup (ported from Domi''s production system).'
  zh: Domi 级 git worktree 隔离与交付：.dsh-worktrees 永久 worktree，ready-for-review / apply / finish / discard 完整生命周期，冲突处理与安全清理（移植自 Domi 生产系统）。
  ja: Domi 品質の git worktree による分離と受け渡し。.dsh-worktrees 配下の永続 worktree と、レビュー準備 / 適用 / 完了 / 破棄 のライフサイクルを、コンフリクト処理と安全な後片付けつきで提供します（Domi の本番システムからの移植）。
