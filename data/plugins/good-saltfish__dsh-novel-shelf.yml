category: fun
description:
  en: 'AI companion in the DSH right sidebar: read local TXT novels while a companion character comments on whatever you just read, on a timer or on demand, in four styles, floating in the corner with a speech bubble. Pick any model provider registered in DSH, or your own OpenAI-compatible endpoint and API key; off by default, and when something breaks it names the exact route and the reason. Add your own TXT, split into chapters and rendered one at a time with adjustable font size and line height; five reading themes; annotations and reading progress written back to the same files the novel-reader desktop app uses, so the two stay in sync; Chinese and English UI.'
  zh: 'AI 陪读：在 DSH 右侧栏看本地 TXT 小说，陪读人物边读边吐槽——定时就着刚读到的内容说一句，也能随时点「现在就说」，四种风格可选，右下角常驻人物与气泡。模型可在 DSH 已注册的 provider 里挑，也能自填 OpenAI 兼容端点与 API key，默认关闭，出问题会说明是哪个路由、什么原因。书架可自行添加 TXT，按章切分逐章渲染，可调字号与行距；内置五套阅读主题；批注与阅读进度写回 novel-reader 桌面版同一份文件，两边互通；界面中英双语。'
