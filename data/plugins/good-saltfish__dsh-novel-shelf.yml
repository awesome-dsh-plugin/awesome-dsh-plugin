description:
  en: 'New in v0.4.0, a built-in public-domain library of 434 Chinese classics - Journey to the West, Dream of the Red Chamber, Romance of the Three Kingdoms and more - searchable by title or author, one click to download and read offline, no book sources to configure. Only the 44 KB catalogue ships with the plugin and the text is fetched from a CDN when you ask for it, with four edges as fallback, and the Gutenberg header and footer stripped so the book opens at chapter one. Everything from before still stands - import your own TXT three ways, an AI companion that comments on whatever you just read, five reading themes, and chapters, progress and annotations shared with the novel-reader desktop app.'
  zh: 'v0.4.0 新增内置公版书库，434 本中文经典——西遊記、紅樓夢、三國志演義、水滸傳等，可按书名或作者搜索，一键下载即入架、之后离线可读，不用配任何书源。包里只带 44 KB 书目，正文在你点下载时才从 CDN 取，四个边缘节点自动回退，并自动剥掉 Gutenberg 的页眉页脚，打开就是第一回。原有功能照旧：三种方式导入本地 TXT、AI 陪读边读边吐槽、五套阅读主题，章节、进度与批注和 novel-reader 桌面版互通。'
tarball: https://github.com/good-saltfish/dsh-novel-shelf/releases/download/v0.4.1/dsh-novel-shelf-0.4.1.tgz
