description:
  en: 'A novel reader docked in the DSH right sidebar for office slacking, with an AI companion that roasts whatever you just read alongside you - import your own TXT three ways, five reading themes, and saved chapters, progress and annotations. The companion comments as you go, in one of four voices (sharp-tongued, warm, detective or slacker) at a pace you pick, off by default. 434 Chinese classics as a 44 KB catalogue, searchable by title or author, one click to download and read offline, four CDN edges as fallback.'
