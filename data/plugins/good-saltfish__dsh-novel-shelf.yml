name: good-saltfish/dsh-novel-shelf
category: fun
description:
  en: 'Office loitering companion for DSH: keep a local TXT novel open in the right sidebar while you keep working on your project. Three novels ship in the box, so a fresh install already has a bookshelf, and you can add your own TXT files the same way. The panel lists the books in %APPDATA%\novel-reader, splits them into chapters, renders one chapter at a time with adjustable font size and line height, and writes annotations and reading progress back to the same files the novel-reader desktop app uses, so the two stay in sync. Five reading themes (day, eye, sepia, dark, black) follow the same settings file, and the panel is fully localized in Chinese and English. New in v0.2.0: an AI companion that comments on whatever you just read on a timer or on demand, in four styles, with a small character floating in the corner; pick any model provider registered in DSH or point it at your own OpenAI-compatible endpoint and API key, and when something breaks it names the exact route and the reason. Reads the novel-reader data directory (on Windows %APPDATA%\novel-reader); macOS and Linux are supported too.'
  zh: '办公摸鱼专用：在 DSH 右侧栏里放着本地 TXT 小说，边看小说边做项目。自带三本小说，全新安装打开即有书架，也可继续添加自己的 TXT。书架面板读取 %APPDATA%\novel-reader 里的书目，按章切分并逐章渲染，可调字号与行距；批注与阅读进度写回与 novel-reader 桌面版相同的文件，两边数据互通。内置五套阅读主题（白天、护眼、米黄、深灰、纯黑），与设置文件同步，界面提供中英双语。v0.2.0 新增 AI 陪读：定时就着刚读到的内容吐槽，也能随时点「现在就说」，四种风格可选，右下角常驻一个陪读人物；模型可以在 DSH 已注册的 provider 里挑，也能自填 OpenAI 兼容端点与 API key，出问题时直接说明是哪个路由、什么原因。读取 novel-reader 的数据目录（Windows 下为 %APPDATA%\novel-reader）；macOS 与 Linux 同样支持。'
tarball: https://github.com/good-saltfish/dsh-novel-shelf/releases/download/v0.2.0/dsh-novel-shelf-0.2.0.tgz