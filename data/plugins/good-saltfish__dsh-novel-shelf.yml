name: good-saltfish/dsh-novel-shelf
category: fun
description:
  en: 'New in v0.3.0, import your own TXT three ways - pick files or drag them in, browse folders and click a book, or type a path - while an AI companion rides along in the DSH right sidebar commenting on whatever you just read, on a timer or on demand, in four styles, floating in the corner with a speech bubble. Picked files land as content-hashed copies so re-importing is a no-op and your originals are never touched; folder picks stay zero-copy. Chapters split and render one at a time with adjustable font size and line height; five reading themes; annotations and progress written back to the same files the novel-reader desktop app uses; pick any model provider registered in DSH or your own OpenAI-compatible endpoint, off by default, and when something breaks it names the route and the reason; Chinese and English UI.'
  zh: 'v0.3.0 新增三种导入：选文件或直接拖进来、浏览目录点选、手填路径——选文件存的是内容哈希命名的副本，重复导入不重复加，你的原文件永不被碰；浏览目录走零复制。另有 AI 陪读在 DSH 右侧栏陪你看本地 TXT 小说，边读边吐槽：定时就着刚读到的内容说一句，也能随时点「现在就说」，四种风格可选，右下角常驻人物与气泡。按章切分逐章渲染，可调字号与行距；内置五套阅读主题；批注与阅读进度写回 novel-reader 桌面版同一份文件，两边互通；模型可在 DSH 已注册的 provider 里挑，也能自填 OpenAI 兼容端点与 API key，默认关闭，出问题会说明是哪个路由、什么原因；界面中英双语。'
