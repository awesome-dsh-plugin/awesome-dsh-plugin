url: https://github.com/good-saltfish/dsh-novel-shelf
name: good-saltfish/dsh-novel-shelf
category: fun
description:
  en: 'Office loitering companion: keep a local TXT novel open in the DSH right sidebar while you work on your project. Ships three novels in the box (十日终焉, 我在精神病院学斩神, 我不是戏神) so a fresh install already has a bookshelf, and you can add your own TXT files the same way. Adds a bookshelf panel that lists the books in %APPDATA%\novel-reader, splits them into chapters, and renders one chapter at a time with adjustable font size and line height; annotations and reading progress are written back to the same files the novel-reader desktop app uses, so the two stay in sync. Ships five reading themes (day, eye, sepia, dark, black) that follow the same settings file, and the panel is fully localized in Chinese and English. Reads the novel-reader data directory (on Windows %APPDATA%\novel-reader); macOS and Linux are supported too.'
  zh: '办公摸鱼专用：在 DSH 右侧栏里放着本地 TXT 小说，边看小说边做项目。自带《十日终焉》《我在精神病院学斩神》《我不是戏神》三本书，全新安装打开即有书架，也可继续添加自己的 TXT。书架面板读取 %APPDATA%\novel-reader 里的书目，按章切分并逐章渲染，可调字号与行距；批注与阅读进度写回与 novel-reader 桌面版相同的文件，两边数据互通。内置五套阅读主题（白天、护眼、米黄、深灰、纯黑），与设置文件同步，界面提供中英双语。读取 novel-reader 的数据目录（Windows 下为 %APPDATA%\novel-reader）；macOS 与 Linux 同样支持。'
tarball: https://github.com/good-saltfish/dsh-novel-shelf/releases/download/v0.1.1/dsh-novel-shelf-0.1.1.tgz
