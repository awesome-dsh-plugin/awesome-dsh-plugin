url: https://github.com/good-saltfish/dsh-novel-shelf
name: good-saltfish/dsh-novel-shelf
category: usage
description:
  en: 'Keep a local TXT novel open in the DSH right sidebar while you work on your project. Adds a bookshelf panel that lists the books in %APPDATA%\novel-reader, splits them into chapters, and renders one chapter at a time with adjustable font size and line height; annotations and reading progress are written back to the same files the novel-reader desktop app uses, so the two stay in sync. Ships five reading themes (day, eye, sepia, dark, black) that follow the same settings file, and the panel is fully localized in Chinese and English.'
  zh: '办公摸鱼专用：在 DSH 右侧栏里放着本地 TXT 小说，边看小说边做项目。书架面板读取 %APPDATA%\novel-reader 里的书目，按章切分并逐章渲染，可调字号与行距；批注与阅读进度写回与 novel-reader 桌面版相同的文件，两边数据互通。内置五套阅读主题（白天、护眼、米黄、深灰、纯黑），与设置文件同步，界面提供中英双语。'
tarball: https://github.com/good-saltfish/dsh-novel-shelf/releases/download/v0.1.0/dsh-novel-shelf-0.1.0.tgz
