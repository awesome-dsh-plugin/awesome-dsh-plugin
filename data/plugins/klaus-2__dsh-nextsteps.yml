url: https://github.com/klaus-2/dsh-nextsteps
name: klaus-2/dsh-nextsteps
category: ui
description:
  en: 'Suggested next-step prompts under every finished agent turn in the DeepSeek Harness chat: the model proposes a few followup prompts at the end of each turn, they render as clickable cards under that turn, and clicking one sends it verbatim as your next message. Each card stays attached to the turn that produced it across reloads and restarts, the generation language can be chosen from 15 languages or follow the conversation, and a settings page in the dsh settings covers the language, how many suggestions per turn, the header and the in-app update check. Requires DeepSeek Harness 0.2.x (web profile) and Node.js 20+.'
  zh: '在 DeepSeek Harness 聊天的每个已完成的智能体回合下方，都会给出可一键继续的下一步建议：模型在回合结尾提出若干后续提示，它们以可点击的卡片渲染在该回合下，点击即原样作为你的下一条消息发送。每张卡片始终归属于产生它的回合，重载与重启后依然对应；生成语言可在 15 种语言中选择或跟随对话；dsh 设置内还有设置页（语言、每个回合的建议数量、标题显示与内置更新检查）。需要 DeepSeek Harness 0.2.x（web profile）与 Node.js 20+。'
icon: https://raw.githubusercontent.com/klaus-2/dsh-nextsteps/main/docs/assets/icon.png
