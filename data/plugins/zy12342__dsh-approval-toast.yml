url: https://github.com/zy12342/dsh-approval-toast
name: zy12342/dsh-approval-toast
category: notify
description:
  en: 'Windows toast notifications for DeepSeek Harness: approve or reject from the notification while DSH is in the background, with an in-app fallback; foreground only skips the current conversation, while other conversations still notify. Also reports turn completion and errors; subagent sessions stay silent.'
  zh: 'DSH 的 Windows 授权通知：后台时可直接在通知上点「允许一次 / 拒绝」，前台时当前对话走应用内审批框、其他对话照常提醒；另含完成 / 出错通知，子代理会话保持静默。'
icon: https://raw.githubusercontent.com/zy12342/dsh-approval-toast/main/assets/icon.png
