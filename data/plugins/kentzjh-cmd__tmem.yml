url: https://github.com/kentzjh-cmd/tmem
name: kentzjh-cmd/tmem
category: memory
description:
  en: 'Project-scoped deterministic execution trace memory and zero-token session digest plugin for DSH, compiling session histories into guarded playbooks and behavior summaries with inline session_id lineage. Registers the /tmem slash command, recalls memories only on explicit file-path or error anchors in agent/pre-step (skipping unchanged repeated steps), and intercepts tools/post-execute errors and code edits with same-origin L2 fixes, failure-loop warnings, and statistical L1 co-change partner hints (skipping routine read calls when idle). Needs Python 3 on PATH (or TMEM_PYTHON) and spawns python3 -m tmem.cli with a 5-second timeout; stores all data inside each project''s .tmem/ directory (no ~/.tmem/ global store) and makes no network requests. It needs Python 3 on PATH (or TMEM_PYTHON) and runs python3 -m tmem.cli synchronously, with a 5-second timeout, on every agent step and tool result; traces are stored in .tmem/ inside each project and in ~/.tmem/ shared across projects. It makes no network requests.'
  zh: '面向 DSH 的项目级确定性执行轨迹记忆与零额外 token 历史会话摘要插件，将会话历史提炼为带守卫条件的执行剧本及内联 session_id 溯源的需求行为摘要。注册 /tmem 斜杠命令，在 agent/pre-step 仅基于显式文件路径或报错锚点召回记忆（跳过输入未变的重复步骤），并在 tools/post-execute 对报错和代码修改拦截提供同源 L2 修复、死循环熔断警告与统计 L1 共变文件提醒（空闲时跳过常规读取工具）。需要 PATH 中有 Python 3（或设置 TMEM_PYTHON），通过子进程调用 python3 -m tmem.cli（超时 5 秒）；所有数据仅存于各项目 .tmem/ 目录（无 ~/.tmem/ 全局存储），不发任何网络请求。需要 PATH 里有 Python 3（或设置 TMEM_PYTHON），并在每个 agent 步骤和每条工具结果上同步运行 python3 -m tmem.cli（5 秒超时）；轨迹存放在各项目内的 .tmem/ 和跨项目共用的 ~/.tmem/。不发任何网络请求。'
