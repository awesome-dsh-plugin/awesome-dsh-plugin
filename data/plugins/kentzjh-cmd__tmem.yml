url: https://github.com/kentzjh-cmd/tmem
name: kentzjh-cmd/tmem
category: memory
description:
  en: 'Project-scoped deterministic execution trace memory and zero-token session digest plugin for DSH (v0.3.0), compiling session histories via temporal causal slicing and AST symbol attribution into guarded L0/L1/L2 playbooks with inline session_id lineage. Registers /tmem (status, list, forget, gc, telemetry, bench, evaluate, inspect, replay, diff, sync), recalls memories in agent/pre-step only on explicit file-path or error anchors (skipping unchanged repeated steps), and intercepts tools/post-execute errors and code edits with same-origin L2 fixes, failure-loop warnings, statistical L1 co-change partner hints, and runtime adoption telemetry (skipping idle read calls). Requires Python 3 on PATH (or TMEM_PYTHON) and spawns python3 -m tmem.cli asynchronously with a 5-second timeout; stores all data strictly inside each project''s .tmem/ directory (no ~/.tmem/ global store) and makes no network requests. Needs Python 3 on PATH (or TMEM_PYTHON); it runs python3 -m tmem on every agent step and tool result.'
  zh: '面向 DSH 的项目级确定性执行轨迹记忆与零额外 token 历史会话摘要插件（v0.3.0），通过时间因果切片与 AST 符号归因将会话提炼为带守卫条件的 L0/L1/L2 执行剧本及内联 session_id 溯源摘要。注册 /tmem 命令（status、list、forget、gc、telemetry、bench、evaluate、inspect、replay、diff、sync），在 agent/pre-step 仅基于显式文件路径或报错锚点召回记忆（跳过输入未变的重复步骤），并在 tools/post-execute 对报错和代码修改提供同源 L2 修复、死循环熔断警告、统计 L1 共变搭档提醒与采纳率遥测（空闲时跳过常规读取工具）。需要 PATH 中有 Python 3（或设置 TMEM_PYTHON），通过异步子进程调用 python3 -m tmem.cli（超时 5 秒）；所有数据仅存于各项目 .tmem/ 目录（无 ~/.tmem/ 全局存储），不发任何网络请求。需要 PATH 里有 Python 3（或设置 TMEM_PYTHON），并在每个 agent 步骤和每条工具结果上同步运行 python3 -m tmem。'
