url: https://github.com/William20100221/dsh-context-graph
name: William20100221/dsh-context-graph
category: memory
description:
  en: 'Indexes each chat of a workspace into a small topic graph every 4 turns, and once when a short chat goes quiet (one model call, cited messages kept verbatim under .context-graph/); typed messages, /goal rounds, reminders, approved plans and your answers to the model all count. Appends up to 5 matching topics from the other chats to a message, putting topics from a day you name ("yesterday", 上周) first, and adds a recall tool that returns the original text by topic, chat, day or turn. On and shared by default; /context-graph off and unshare opt a chat out, and stats, build, map and find inspect it.'
  zh: '每 4 轮把工作区里的每个对话索引成小型主题图谱，短对话安静下来时也会补一次（一次模型调用，被引用的原文保存在 .context-graph/）；你输入的消息、/goal 的每一轮、提醒、批准的计划和你对模型提问的回答都会计入。在消息末尾附上其他对话中最多 5 个匹配主题，提到某天（“昨天”“上周”）时先排那一天的，并提供 recall 工具按主题、对话、日期或轮次取回原文。默认开启并共享；/context-graph off 与 unshare 可让某个对话退出，stats、build、map、find 用于查看。'
