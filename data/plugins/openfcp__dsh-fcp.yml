url: https://github.com/openfcp/dsh-fcp
name: openfcp/dsh-fcp
category: workflow
description:
  en: 'A financial consumer-protection workbench in the DSH sidebar with its own home page: six built-in expert personas (policy research, consumer-protection review, complaint handling, financial education, general management and sales management) dispatched by task keywords or selected manually, a skill catalog with search, category filters, a detail view and install state kept on the local machine, IMA / Obsidian / local md and zip knowledge-source configuration, thinking-method cards, model settings and screenshot input. Local HTTP routes are guarded by a loopback check, and configuration is kept in browser localStorage and a local state file. This release records skill install state and knowledge-source configuration; downloading skill files into the skills directory, retrieving knowledge into context and switching the session model are not implemented yet. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在 DSH 左侧栏加一个金融消保工作台，有独立首页：六位内置专家（政策研究、消保审查、投诉管理、金融教育、综合管理、销售管理），按任务关键词自动调度或手动点选；技能目录支持搜索、分类筛选、详情查看，安装状态保存在本机；知识源可配置 IMA、Obsidian 与本地 md / zip；另有思维方法卡片、模型设置与截图输入。本地 HTTP 路由带回环地址校验，配置保存在浏览器 localStorage 与本机状态文件。当前版本完成技能安装状态记录与知识源配置；技能文件下发到 skills 目录、知识检索注入上下文与切换会话模型尚未实现。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
