description:
  en: 'AI image and video generation for the DSH Web GUI: text-to-image and image-to-image over per-channel model catalogs with per-family request shaping (gpt-image, Grok Imagine, Nano Banana, Seedream, GLM-Image, Qwen-Image, MiniMax image-01, DALL-E 3), a sidebar generation studio, an infinite canvas with node workflows, files preview and canvas skills, and a prompt template library; the video side adds text-to-video, image-to-video, first/last-keyframe and multi-reference modes on an async submit/poll/download pipeline, host-side video tools, video nodes on the canvas, and clip stitching of two or more video nodes into one MP4 with the local ffmpeg.'
  zh: '面向 DSH Web GUI 的 AI 生图与生视频插件：文生图/图生图按渠道配置模型目录，并按模型族适配请求协议（gpt-image、Grok Imagine、Nano Banana、Seedream、GLM-Image、Qwen-Image、MiniMax image-01、DALL-E 3），提供侧边栏生图工作台、带节点工作流的无限画布、文件预览与画布技能，以及提示词模板库；生视频侧含文生视频、图生视频、首尾帧与多参考图模式，走异步提交/轮询/下载链路，另有宿主侧视频工具、画布视频节点，并可用本机 ffmpeg 把两个以上视频节点拼接成一个 MP4。'
