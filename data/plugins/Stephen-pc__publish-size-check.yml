url: https://github.com/Stephen-pc/publish-size-check
name: Stephen-pc/publish-size-check
category: skill
description:
  en: 'Publish size check skill: verifies a deliverable''s geometric specs against a target platform before publishing - pixel dimensions, aspect ratio, dpi, file size, format, physical print width and colour mode. Geometry only: it does not review content compliance (QR codes, text-to-image ratio, copyright and prohibited content are out of scope). Pure Python standard library, no third-party packages, and inputs are never modified. Python 3.8+. Covers 10 platforms and 20 slots with per-platform confidence labels - WeChat MP, Xiaohongshu, Bilibili, Zhihu, Weibo, Douyin, WeChat Channels, journal submission, print and client delivery - and resolves a platform by id, Chinese name or alias with fuzzy matching. Two trigger modes: asked directly, or as a parasitic self-check that runs by itself once an image, poster, chart or export workflow has written a file and the user mentioned a publishing target, reporting in one line when everything passes and only expanding when something is wrong. For journal submission and print it judges by physical width (pixels / dpi), which catches files whose dpi metadata passes but whose actual printed size is too small; for multi-image posts it checks whether the whole set is consistent and names the odd one out rather than listing every file.'
  zh: '发布尺寸检查技能：发布前对照目标平台的几何规格核验交付物——像素尺寸、宽高比、dpi、体积、格式、物理印刷宽度、色彩模式。只查几何参数，不做内容合规审查（二维码、文字占比、版权、违规内容均不在范围内）。纯 Python 标准库实现，不装任何第三方包，原件全程只读。需 Python 3.8+。覆盖 10 个平台、20 个槽位，并按平台标注可信度——微信公众号、小红书、哔哩哔哩、知乎、微博、抖音、微信视频号、学术投稿、印刷交付、甲方交付；平台参数支持 id、中文名、别名，模糊匹配也能命中。两种触发：直接提问，或作为「寄生自检」在出图/海报/图表/导出流程落盘且用户提到发布目标后自行运行，全部通过时一句话带过，有问题才展开。投稿与印刷按「像素÷dpi=实际印刷宽度」判定，能抓出 dpi 字段达标但实际尺寸不足的图；多图连发时检查整组是否整齐，并指出少数派是哪一张，而不是罗列每个文件。'
