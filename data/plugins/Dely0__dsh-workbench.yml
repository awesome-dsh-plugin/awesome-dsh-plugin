description:
  en: 'Calendar and hierarchical task workbench: AI-assisted intake clarification, consultation, decomposition, execution with user acceptance, and review, plus reminders and per-task AI session workspaces.'
  zh: 日历 + 层级任务个人工作台：AI 辅助澄清、咨询、拆解、执行（用户验收）与复盘，支持到期提醒与按任务组织的 AI 会话工作区。
  ja: カレンダーと階層型タスクのワークベンチ。AI の補助による要件の確認、相談、分解、ユーザー承認を伴う実行、振り返りに加え、リマインダーとタスクごとの AI セッションワークスペースを提供します。
