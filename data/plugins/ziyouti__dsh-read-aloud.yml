url: https://github.com/ziyouti/dsh-read-aloud
name: ziyouti/dsh-read-aloud
category: voice
description:
  en: 'Reads assistant replies aloud with Microsoft Edge neural voices and highlights the sentence being spoken as it plays, so you can follow along: a sound-wave play button on every reply, pause plus previous and next sentence, adjustable highlight background and text colour with an opacity slider, and an auto-read toggle.'
  zh: '用微软 Edge 神经音色朗读助手回复，并在播放时高亮当前正在朗读的那一句，方便边听边看：每条回复下方的音浪播放键、暂停与上句/下句跳转、可调的高亮底色与文字颜色（带浓淡滑杆）、以及自动朗读开关。'
