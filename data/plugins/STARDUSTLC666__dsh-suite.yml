description:
  en: 'Plugin bundle (@stardustlc/dsh-suite) that composes shared Cordis and Minimal-PTC configuration patches across 18 pinned plugins (9 native workbenches with 5 switchable themes), with Cordis hot-reload cleanup and unified in-place bundle update and rollback controls in component footers; components remain independently installable, while Review and Computer Use ship separately.'
  zh: '组合补丁包（@stardustlc/dsh-suite）：统一注入 Cordis 与极简 PTC 默认配置并固定加载 18 个独立插件（含 9 个支持 5 套主题切换的原生工作台），带 Cordis 热重载清理与组件页底部的整包热更新/回滚控件；各组件仍可独立安装，Review 与 Computer Use 另行分发。'
