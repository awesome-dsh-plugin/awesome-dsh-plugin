name: XWIDE/DSH_X-Wide-Thought-Chain
category: tools
description:
  en: 'Runs a six-step debugging chain as callable tools (freeze facts, measure the real shape, minimal repro, single-variable comparison, judge, delivery gate), plus a dependency-free boot self-check for install-path drift, missing files and version mismatch. Ships a settings page with five categories, one-click presets (plus your own saved presets), sliders with live values, read-only panels showing where your data lives and what each option costs in seconds, a lessons bank of distilled mistake-to-fix rules injected into every turn, and a rules-backup panel: snapshot your AGENTS.md / dictionaries / rulers to your own private git repo, restore them file-by-file with sha256 checks, and publish only a sanitized method whitelist to a public repo after you tick "this state is good" and pass a privacy scan.'
  zh: '把排障六步（冻结事实、量真形状、最小复现、单变量对照、判定器、交活闸）做成可调用的工具，并带零依赖开机自检：安装路径漂移、配方缺件、版本三处不一致。附带设置页：五个分类、一键档位（含你自己存的）、带实时数值的滑条、只读面板（数据在哪、每项值多少秒）、经验库（把「做错→做对」蒸成一条条带实测读数的规则，注入每轮开工），以及规则库备份栏：把你的 AGENTS.md／词典／错题本／尺子快照进你自己的私有 git 仓，恢复时逐文件 .bak ＋ sha256 校验；只有勾了「我认为这是好状态」并通过脱敏扫描，才允许把方法白名单发到公开仓——插件不挂 hook、零自动同步。'
