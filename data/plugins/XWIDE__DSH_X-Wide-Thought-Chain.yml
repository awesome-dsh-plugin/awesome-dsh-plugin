name: XWIDE/DSH_X-Wide-Thought-Chain
category: tools
description:
  en: 'Runs a six-step debugging chain as callable tools (freeze facts, measure the real shape, minimal repro, single-variable comparison, judge, delivery gate), plus a dependency-free boot self-check for install-path drift, missing files and version mismatch. Ships a settings page with four categories, one-click presets (plus your own saved presets), sliders with live values, read-only panels showing where your data lives and what each option costs in seconds, and a lessons bank: distilled mistake-to-fix rules (each with the measured evidence) injected into every turn so the agent starts already knowing the traps it hit before.'
  zh: '把排障六步（冻结事实、量真形状、最小复现、单变量对照、判定器、交活闸）做成可调用的工具，并带零依赖开机自检：安装路径漂移、配方缺件、版本三处不一致。附带设置页：四个分类、一键档位（含你自己存的）、带实时数值的滑条、两个只读面板（数据在哪、每项值多少秒），以及一个经验库——把「做错→做对」蒸成一条条规则（每条带实测读数），注入每轮开工，让助手一上来就带着它踩过的坑。'
icon: https://raw.githubusercontent.com/XWIDE/DSH_X-Wide-Thought-Chain/master/assets/xwide-avatar.png
