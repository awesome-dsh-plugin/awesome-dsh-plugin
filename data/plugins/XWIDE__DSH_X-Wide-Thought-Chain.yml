name: XWIDE/DSH_X-Wide-Thought-Chain
category: tools
description:
  en: 'Runs a six-step debugging chain as callable tools (freeze facts, measure the real shape, minimal repro, single-variable comparison, judge, delivery gate), plus a dependency-free boot self-check for install-path drift, missing files and version mismatch. Ships a settings page with four categories, four one-click presets (plus your own saved presets), sliders with live values, and read-only panels showing where your data lives, how past mistakes stay fixed, and what each option costs in seconds. Every change is backed up; one command rolls it back.'
  zh: '把排障六步（冻结事实、量真形状、最小复现、单变量对照、判定器、交活闸）做成可调用的工具，并带零依赖开机自检：安装路径漂移、配方缺件、版本三处不一致。附带设置页：四个分类、四组一键档位（含你自己存的档位）、带实时数值的滑条，以及两个只读面板——告诉你数据在哪、之前犯过的错怎么守住、每个选项值多少秒。每次改动都留备份，一条命令退回。'
icon: https://raw.githubusercontent.com/XWIDE/DSH_X-Wide-Thought-Chain/master/assets/xwide-avatar.png
