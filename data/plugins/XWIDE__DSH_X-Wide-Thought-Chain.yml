name: XWIDE/DSH_X-Wide-Thought-Chain
category: tools
description:
  en: 'Runs a six-step debugging chain as callable tools (freeze facts, measure the real shape, minimal repro, single-variable comparison, judge, delivery gate), plus a dependency-free boot self-check for install-path drift, missing files and version mismatch; every setting is documented and each change keeps a backup to roll back.'
  zh: '把排障六步（冻结事实、量真形状、最小复现、单变量对照、判定器、交活闸）做成可调用的工具，并带零依赖开机自检：安装路径漂移、配方缺件、版本三处不一致；设置逐项可调且每项带说明，改动均留备份可退回。'
icon: https://raw.githubusercontent.com/XWIDE/DSH_X-Wide-Thought-Chain/master/assets/xwide-avatar.png