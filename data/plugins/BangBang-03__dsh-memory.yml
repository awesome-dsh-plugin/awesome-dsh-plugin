name: BangBang-03/dsh-memory
category: memory
description:
  en: Long-term memory scoped to the DSH workspace. A session opens with a one-line-per-memory index - bodies are fetched on demand by the `memory` tool, so the same character budget holds about three times as many entries - and when a turn ends a purely local search over the last user message pulls the matching memories into the next briefing at no model cost. Optional auto-capture distils a stretch of conversation into structured memories; in draft mode they wait in an approval queue instead of landing directly. A portrait layer keeps a workspace and a global picture, rewritten from the journal and the records, with the same draft-or-direct choice. Settings → Memory holds the archive, list and timeline views, a health check (duplicate clusters, stale entries, broken links), the supersede version chain with rollback, and a read-only scan that imports existing WorkBuddy / Qoder memory files.
  zh: DSH 的工作区长期记忆。会话开始只注入「一行一条」的记忆索引，正文由 memory 工具按需取——同样字数预算约装三倍条目；一轮结束时用当轮最后一条用户消息做纯本地检索，命中的记忆下一轮随简报召回，不花模型 token。可选自动提炼把一段对话归纳成结构化记忆，captureMode=draft 时先进审批队列、你批准了才生效。另有画像层：工作区与全局各一份全貌，由日志与条目重写生成，同样可走草稿。设置 → 记忆 里有档案 / 列表 / 时间线、体检（重复簇、过期未用、断链）、版本链 supersede 与一键回滚，以及「扫描本机」把已有的 WorkBuddy / Qoder 记忆文件导入（只读，不动来源）。
