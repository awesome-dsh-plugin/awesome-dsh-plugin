description:
  en: "Whale Dream is a theme plugin for DeepSeek Harness. It replaces the app palette with a deep-sea colour set, draws an ASCII whale backdrop behind the conversation, and plays a short whale-leap startup screen while the app boots. Light and dark skins are both included and follow the app's own appearance setting. On Windows and Apple-silicon Mac desktops it can also open a small always-on-top companion window with the latest reply, balance and usage."
  zh: "鲸梦是一款 DeepSeek Harness 主题插件：用深海配色替换应用配色，在对话背后绘制字符鲸鱼背景，并在启动时播放一段跃鲸开场动画。包含浅色与深色两套皮肤，跟随应用自身的外观设置切换。Windows 与 Apple 芯片 Mac 桌面版还可以开启一个置顶的实况小窗，显示最近回复、余额与用量。"
