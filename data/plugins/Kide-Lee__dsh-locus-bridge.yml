url: https://github.com/Kide-Lee/dsh-locus-bridge
name: Kide-Lee/dsh-locus-bridge
category: dev
description:
  en: 'Let DSH act as a Locus client to deliver a one-stop Unity development experience. The plugin itself does not depend on Locus: you can install the Locus plugin for your Unity project in the settings interface. Features include operating the Unity Editor through Locus’s native broker; semantic analysis and debugging of C# code; and previewing prefabs and 3D models in the sidebar. Its Unity tools can evaluate C# on the editor main thread and edit assets and scene objects.'
  zh: '让 DSH 扮演 Locus 客户端，来实现一站式的 Unity 开发体验。插件本身不依赖 Locus：可在设置界面为你的 Unity 项目安装 Locus 插件。功能包括通过 Locus 原生 broker 操作 Unity 编辑器；对 C# 代码进行语义分析和调试；对 prefab 和 3D 模型在侧栏预览。它的 Unity 工具可以在编辑器主线程上执行 C#，并修改资源与场景对象。'
