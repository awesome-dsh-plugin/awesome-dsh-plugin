url: https://github.com/mu915275-cmd/dsh-boot-animation
name: mu915275-cmd/dsh-boot-animation
category: ui
description:
  en: 'Plays an intro full-frame on a new conversation, or every time you open the one you pinned. Four clips ship inside the plugin itself, embedded in code with no separate video files, and an in-app library switches between them, previews the choice, and accepts your own clip. The selected clip can also skin the workspace behind the canvas, as a still or as a looping tail of the last N seconds, with independent transparency for the picture and the sidebar plus three blur levels.'
  zh: '打开新对话、或每次打开你钉住的那个会话时，铺满窗口播放一段片头动画。插件自带四段片头，直接内嵌在代码里（不带独立的视频文件）；界面里的片库可切换、可预览，也能随时换成你自己的片子。选中那段的画面还能当工作区皮肤（静帧，或只循环片尾 N 秒的动态），画面与侧边栏各有独立透明度，另有三档模糊。'
