url: https://github.com/Andromder/dsh-task-budget
name: Andromder/dsh-task-budget
category: usage
description:
  en: Per-task cost dashboard and budget guard that prices each model call at peak or off-peak rates, turns the remaining budget into a per-turn work envelope in the system prompt, and stops the task at its cap until the user replies.
  zh: 按任务统计模型调用费用（峰/谷价），把剩余预算换算成每轮提示词里的调用/文件额度，并在超出上限时暂停任务等待用户确认。