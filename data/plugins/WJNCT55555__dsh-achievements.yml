description:
  en: 'Achievement system for the DSH Web UI: gallery with category/rarity sorting, unlock toasts, sidebar trophy, composer dock, crossover achievements, and local persistence.'
  zh: DSH Web 成就系统：画廊支持按分类/难度双排序、解锁 toast、侧栏奖杯、输入坞进度读条、联动成就，并本地持久化进度。
  ja: DSH Web UI の実績システム。カテゴリ/レア度で並べ替えられるギャラリー、解除時のトースト、サイドバーのトロフィー、コンポーザーのドック、他プラグインと連動した実績、ローカル保存に対応します。
