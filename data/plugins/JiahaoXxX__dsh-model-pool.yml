description:
  en: "Declarative provider/model fallback chains for the model picker: an ordered root chain plus named pools, failure-code triggered switching, per-model cooldowns, time-slot presets, and subagent role routing. A fork of omdsh-dev/dsh-llm-fallbacks 0.6.5; do not install it alongside that plugin (both use the \"llm-fallbacks\" profile row id)."
  zh: "模型选择器用的可配置降级链：有序主链加命名池，按失败码自动切换，支持按模型冷却、分时段预设与子代理角色路由。omdsh-dev/dsh-llm-fallbacks 0.6.5 的 fork；不要与上游同时安装（两边的 profile 行 id 都是 \"llm-fallbacks\"）。"
