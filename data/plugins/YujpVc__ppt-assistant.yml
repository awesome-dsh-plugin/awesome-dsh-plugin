url: https://github.com/YujpVc/ppt-assistant
name: YujpVc/ppt-assistant
category: docs
description:
  en: 'A PPT assistant preset for DeepSeek Harness that turns source documents and images into editable PowerPoint decks, with layout-density gates, custom mechanism diagrams, and independent visual-review checks. Needs Python 3.10+ and requirements.txt; rendering also needs LibreOffice and pdftoppm.'
  zh: '面向 DeepSeek Harness 的 PPT 助手预设：把源文档与图片生成可编辑 PowerPoint，并带版式密度门禁、自定义机制图与独立视觉审查。需 Python 3.10+ 并安装 requirements.txt；渲染另需 LibreOffice 与 pdftoppm。'
icon: https://raw.githubusercontent.com/YujpVc/ppt-assistant/master/assets/logo.png
