url: https://github.com/Chenghui-Liang/dsh-web-pick
name: Chenghui-Liang/dsh-web-pick
category: browser
description:
  en: 'Adds an element and region picker to the DSH Desktop built-in browser: hovering labels the element under the pointer, a click records that element, a drag records a rectangle, and each pick opens a small note box beside the pick. A batch is then inserted into the composer draft, never sent automatically, as one text block plus one attached crop per pick, so the user reviews and sends it themselves. Desktop only: the Web profile browser is an iframe, so the picker does not appear there.'
  zh: '在 DSH 桌面版内置浏览器里加一个元素 / 区域选取层：悬停显示所指元素，点选记下元素、拖框记下矩形，每条当场在选取框旁弹小卡片写说明；整批会写成一段文字插进对话输入框，并把每条裁剪截图作为附件挂上，不会自动发送，检查、改完再自己按回车。仅桌面版可用：Web 版浏览器是 iframe，选取层不会出现。'
icon: https://raw.githubusercontent.com/Chenghui-Liang/dsh-web-pick/main/assets/icon-180.png
