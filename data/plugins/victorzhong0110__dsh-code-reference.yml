description:
  en: Surveys local code and GitHub/npm for reusable implementations before development, evaluates reuse versus rewrite, and checks architecture coupling.
  zh: 在开发前检索本地代码与 GitHub/npm 的可复用实现，评估复用与重写成本，并检查架构耦合。
  ja: 開発の前に、ローカルのコードと GitHub/npm から再利用できる実装を洗い出し、再利用と作り直しを比較して、アーキテクチャの結合度も確認します。
