url: https://github.com/YunongDai2005/dsh-theone
name: YunongDai2005/dsh-theone
category: session
description:
  en: "Talk about everything in one chat (the main chat): each message is routed automatically to the topic it belongs to, each topic runs in its own background session with its own context, and existing DSH chat history is organized into topics."
  zh: 所有事在一个对话框（主聊天）里聊：每条消息自动分到所属话题，每个话题在后台有独立的会话和上下文；已有的 DSH 旧会话也会自动整理、分类成话题。
