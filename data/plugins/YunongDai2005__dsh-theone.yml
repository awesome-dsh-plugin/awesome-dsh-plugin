name: YunongDai2005/dsh-theone
category: session
description:
  en: One main chat that routes each message to a per-topic background session with its own context, organizes existing DSH sessions into topic workspaces, and shares progress between related topics.
  zh: 一个主聊天，把每条消息分到对应话题的后台会话（各自独立上下文），把已有 DSH 会话整理成话题工作区，并在相关话题之间共享进展。
