url: https://github.com/PerryLink/dsh-lit-watch
name: PerryLink/dsh-lit-watch
category: tools
description:
  en: "Literature watch for DeepSeek Harness: save named Crossref bibliographic queries with time windows, run them against Crossref with a bounded client, keep a seen-DOI store so repeated runs return only genuinely new items, and render a Markdown digest plus SARIF. A watch reports new DOIs in a search window, not relevance or quality."
