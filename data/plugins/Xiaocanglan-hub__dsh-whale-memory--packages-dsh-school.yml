name: Xiaocanglan-hub/dsh-whale-memory#dsh-school
category: memory
description:
  en: 'She keeps the questions your chats left unanswered, then goes and looks them up later. A line she asked you that ended in "?" and never got an answer is stored as a hanging question; when you are away and the keyboard has been quiet for a while, she picks the oldest one, searches the web and Bilibili, reads what is actually readable, distils it into two or three sentences and leaves a note on her desk. Questions about its own plugins are skipped and left for you. Read-only on her events: nothing is written to her memory, her growth is untouched, and dsh-fish needs no patching.'
  zh: '让她自己补上那些你没答、她也没懂的问题。聊天里她问出口、以问号结尾、又没等到回答的话，被记成一条「悬着的问」；等你不在、键鼠安静够久时，她挑最久的那条自己去查——搜网页与 B 站，只读真正读得进来的页面，提炼成两三句，在你桌上留一张纸条。问的是我们自家插件的事就跳过，留给你答。全程只读她的经历：不写她的记忆、不动她的成长，也不需要改 dsh-fish 一行代码。'
