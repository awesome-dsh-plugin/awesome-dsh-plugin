url: https://github.com/lpf20200901/dsh-memory-delta
name: lpf20200901/dsh-memory-delta
category: memory
description:
  en: Layered cross-session memory for DSH that pushes only what changed. The first round injects every active entry, later rounds push only added / updated / removed ones, and nothing at all is injected when nothing changed. Facts and decisions carry semantic keys (one active truth per key), the model may only write to an inbox that a human promotes, an entry can carry a review date that raises a one-time reminder when it comes due, search is relevance-ranked with Chinese matched by bigram, and a read-only sidebar tab shows the standing entries, the due items, the inbox candidates and the current injection size. A zero-dependency CLI ships with it, so the store is usable without DSH.
  zh: 分层跨会话记忆，只推变化的部分：首轮注入全部有效条目，之后只推新增 / 已更新 / 已失效，没有任何变化时一个字都不注入。事实与决策带语义键（一个 key 只有一个有效结论），模型只能写收件箱、由人确认后才成为常驻事实；条目可以带复核时间，到期后提醒一次；检索按相关度排序，中文按 bigram 匹配；侧边栏有一个只读页签，显示常驻条目、待复核项、收件箱候选与当前注入体积。附带零依赖 CLI，不装 DSH 也能用这套记忆库。
tarball: https://github.com/lpf20200901/dsh-memory-delta/releases/download/v1.0.0/dsh-memory-delta-1.0.0.tgz
