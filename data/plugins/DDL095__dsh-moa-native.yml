url: https://github.com/DDL095/dsh-moa-native
name: DDL095/dsh-moa-native
category: agi
description:
  en: 'Native generation-time Mixture-of-Agents: every turn, reference models run the same session context in parallel as pre-run drafts and one aggregator executes with full tooling; config-as-model recipes, F mirror / R trimmed views, enforced subagent gating (dual-shape session indexing), derived per-recipe vision (vision refs relay image reads to text-only aggregators), tiered cadence with separate steering and patrol rosters plus frozen reuse between beats, degeneration guard dropping degenerate reference output, anonymized model face (failure notices carry no provider identity), and cache-friendly guidance placement (the rehearsal record is pinned where it was produced instead of appended to every request, so the cached prefix covers it and each step pays only for what was added since - on by default across every cadence).'
  zh: 原生生成时 MoA：每轮参考模型并行预演同一会话上下文产出草稿，单一聚合模型带完整工具循环执行；配置即模型配方、F 镜像 / R 裁剪双视野、子会话门控（双形态会话目录索引，修复后实效）、按成分派生的配方级视觉（视觉参考路可为纯文本聚合转述图像）、节拍节奏（定调与巡检两套阵容、拍间冻结复用）、退化守卫（剔除退化的参考输出）、模型面匿名（失败提示零供应商身份）、缓存友好化注入（预演记录钉在产出它的那一步而非每步追加到请求末尾，缓存前缀覆盖它、每步只付新增量，缺省开启、全 cadence 档生效）。
