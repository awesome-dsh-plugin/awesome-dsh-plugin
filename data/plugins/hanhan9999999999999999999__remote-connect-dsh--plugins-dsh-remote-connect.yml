name: hanhan9999999999999999999/remote-connect-dsh#dsh-remote-connect
category: remote
description:
  en: 'Drive DSH on your computer from a phone browser (scan a code), and pair two computers to move plugins, skills, rules, config and sessions across in one click. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '手机扫码即可在浏览器里操作电脑上的 DSH；两台电脑配对后能把插件、技能、规则、配置与会话一键搬过去。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
