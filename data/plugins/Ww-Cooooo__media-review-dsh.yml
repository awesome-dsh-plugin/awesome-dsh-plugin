description:
  en: "A Windows Harness adaptation of [Media Review Skill](https://github.com/Ww-Cooooo/media-review) for AI video feedback: annotate frame regions or time ranges and jump to recognized speech or imported subtitle cues; other Agents with local file and command access can use the original Skill."
  zh: "让 AI 视频改稿反馈更直接：框选画面、拖选时间段或定格写意见，点击识别台词或导入字幕定位；基于 [Media Review Skill](https://github.com/Ww-Cooooo/media-review) 改造的 Windows Harness 插件，其他支持本机文件访问与命令执行的 Agent 可用原版 Skill。"
