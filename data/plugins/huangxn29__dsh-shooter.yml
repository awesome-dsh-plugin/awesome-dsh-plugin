description:
  en: 'A top-down arena shooter that lives in the DSH sidebar: an autopilot AI plays the blue whale-fish hero for you while the dsh-pet desktop pet narrates each wave out loud, and combos, boss waves every fifth wave, in-run upgrade choices, a local leaderboard, achievements, skins and a floating desk widget (a fish that keeps playing in the corner, click to pet, double-click to open) keep the run going while you work.'
  zh: 'DSH 侧栏里的俯视角生存射击：AI 托管替你把蓝鱼主角打起来，dsh-pet 桌宠逐波解说并念出声；连杀倍率、每 5 波 Boss、局内三选一强化、本机排行榜、成就与皮肤，切面板后还能缩成右下角的小鱼挂件继续打——点一下摸摸它，双击展开画面。'
