description:
  en: 'Voice Studio for DSH with 10+ cloud and local speech engines (Xiaomi MiMo, Doubao, Breeze, DeepSeek, local MOSS-Nano, browser speech, external adapters) plus cloud ASR, smart text filtering, live subtitles and voice orbs, /director multi-role WAV drama studio, and desktop pet, novel, QQ Bot, dsh-Go, and AI Passport integrations. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '音色工坊：为 DSH 提供小米 MiMo、豆包、Breeze、DeepSeek、本地 MOSS-Nano 与浏览器等 10+ 语音引擎及云端 ASR，支持智能过滤流式朗读、实时字幕响应球、/director 多角色有声剧录音棚，以及桌宠、听书、QQ Bot、dsh-Go 与 AI Passport 联动。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
