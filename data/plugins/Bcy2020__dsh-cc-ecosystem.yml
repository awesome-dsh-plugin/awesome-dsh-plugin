url: https://github.com/Bcy2020/dsh-cc-ecosystem
name: Bcy2020/dsh-cc-ecosystem
category: dev
description:
  en: 'Load Claude Code assets into DSH at runtime — skills, slash commands, rules, permission rules (deny/ask/allow), subagents and hooks from .claude/, plus Claude Code plugins (plugin.json / marketplace / skills / agents / MCP), via an in-memory IR that keeps .claude as the source of truth and writes back only when you opt in. Also surfaces Claude Code auto-memory in the system prompt, read-only by default, with a write-back switch in the /cc-memory panel. Eight packages: one bundle that installs the whole set, plus the loader and six adapters (skills, permissions, agents, hooks, mcp, memory).'
  zh: '运行时把 Claude Code 全家桶原样加载进 DSH：.claude/ 的技能、斜杠命令、规则、权限（deny/ask/allow）、子代理与 hooks，以及 Claude Code 插件（plugin.json / marketplace / 技能 / 代理 / MCP）——内存 IR 解析层，.claude 始终是唯一事实来源，只有主动开启才会写回。同时把 Claude Code 的 auto-memory 接入系统提示，默认只读，可在 /cc-memory 面板打开写回。八个包：一个可一键装齐的全家桶包、loader，以及 skills、permissions、agents、hooks、mcp、memory 六个适配包。'
