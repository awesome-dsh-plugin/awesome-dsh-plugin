name: hyun20202023-ui/dsh-qfish
category: identity
description:
  en: Unofficial QQ bot plugin for DeepSeek Harness: editable persona, per-user memory with condensing, session rotation with summaries, image and Bilibili video understanding, sticker library, slang and catchphrase learning, favorability, group management, reminders, cross-group messaging, and a built-in web console.
  zh: DeepSeek Harness 的非官方 QQ 机器人插件：可编辑人设、按人记忆并自动压缩、会话轮换带摘要、看图与 B 站视频理解（字幕/逐帧画面/弹幕/热评）、表情库、黑话与口头禅学习、好感度、群管理与定时提醒、跨群发消息，以及内置网页控制台。
