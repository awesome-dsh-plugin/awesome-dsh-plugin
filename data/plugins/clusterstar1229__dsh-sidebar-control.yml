url: https://github.com/clusterstar1229/dsh-sidebar-control
name: clusterstar1229/dsh-sidebar-control
category: browser
description:
  en: 'Controls the Browser panel DSH renders in the right Sidebar: snapshot refs, click/hover/type/press/select/scroll, screenshots including the full page, shadow DOM, query-scoped reads and change diffs, 12-step batches, and tabs scoped to the conversation that opened them.'
  zh: '控制 DSH 右栏内置 Browser 的 Agent 插件：快照编号控件、点击/悬停/输入/按键/选择/滚动、截图（含整页）、shadow DOM、按问题检索阅读与变化对比、一次最多 12 步，标签按开启它的对话隔离。'