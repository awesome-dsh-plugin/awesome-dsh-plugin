description:
  en: 'Which of your agents is waiting on you? One always-on-top Windows panel answers it: DeepSeek Harness, Claude Code, OpenCode and Antigravity sessions, each row saying working, waiting for approval, failed or finished, and a collapsed strip showing how long the blocked one has been blocked. The arrow at a row''s end jumps to that terminal; the row itself copies its project path. It rings only for real events - not for an ordinary command, not for a session that vanished - and approvals still happen in DSH. Harness sessions appear on install; the other three need their reporter.'
  zh: '哪个 agent 在等你？一块置顶的 Windows 面板就能回答：DeepSeek Harness、Claude Code、OpenCode 与 Antigravity 的会话都在这，每一行写着进行中、等待确认、出错还是完成，收起成一条时还会显示那个卡住的会话已经卡了多久。点行尾的箭头跳到对应终端，点行本身复制它的项目路径。它只在真事件上响——普通命令不响，会话消失也不算完成——授权仍然在 DSH 里完成。装上即接上 Harness 的会话；另外三个终端要先各自装好上报端。'
