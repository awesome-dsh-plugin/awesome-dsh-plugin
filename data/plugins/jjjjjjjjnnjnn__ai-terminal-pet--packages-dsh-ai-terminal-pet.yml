description:
  en: 'A floating desktop overlay for Windows that shows which terminal of yours is waiting: it aggregates OpenCode, Claude Code, Antigravity and DeepSeek Harness session state over a named pipe and renders one small always-on-top panel, so you stop tabbing between windows to find out which agent needs approval. Click a row to jump to that terminal. Installing this bundle wires up DeepSeek Harness sessions; sessions from OpenCode, Claude Code or Antigravity appear once each of those terminals has its own reporter from the repository installed. For DeepSeek Harness sessions the panel only shows the state (working, waiting for approval, error, idle) and jumps to the DSH window; approving is still done in DSH.'
