url: https://github.com/ChuanTianML/dsh-chat-tidy
name: ChuanTianML/dsh-chat-tidy
category: ui
description:
  en: 'One stylesheet that retypesets the DSH conversation to measured Codex metrics: 14/22 px body, tighter headings, lists and blocks, a rounded quote bar, and Tidy Tables with a themed header, row/column rules, full-width short tables and contained scrolling for wide tables; no settings or DOM rewriting, with real before/after captures.'
  zh: 一张样式表，按实测的 Codex 版式重排 DSH 对话页：14/22 px 正文，收紧标题、列表与块级节奏，使用圆角引用条，并把表格补成带主题化表头、行列分隔、短表铺满和宽表容器内滚动的 Tidy Tables；无设置项、不改写 DOM，仓库内附真实前后对比图。
