category: notify
description:
  en: 'Review Changes panel above the web composer with a VS Code sidebar bridge: send editor selections, drag files/folders as tags, and batch accept/reject every listed file.'
  zh: Web 输入框上方的 Review Changes 面板与 VS Code 侧栏桥：发送编辑器选区、把文件/文件夹拖成 tag，并批量接受/撤回列表中的全部文件。
  ja: Web コンポーザーの上に置く変更レビューパネルと、VS Code サイドバーとの橋渡し。エディターの選択範囲を送る、ファイル/フォルダーをタグとしてドラッグする、一覧のファイルをまとめて受け入れ/却下する、といった操作ができます。
