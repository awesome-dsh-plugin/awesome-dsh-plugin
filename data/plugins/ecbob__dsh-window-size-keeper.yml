url: https://github.com/ecbob/dsh-window-size-keeper
name: ecbob/dsh-window-size-keeper
category: ui
description:
  en: 'Keeps the DSH desktop window the size you left it: records the last outer frame of the main window in physical pixels and restores it, centred on the work area, on the next start - and it acts before the window is ever shown, so the boot animation plays at the right size. The settings page offers 12 presets (1024x768 to 3840x2160), free-form custom width and height, a centre-on-restore switch and an apply-now action; a choice takes effect immediately and persists. Resizing goes through a small helper executable compiled on the user''s own machine: the C# source ships inside the plugin, is built on first run with the in-box Windows csc.exe (measured ~110 ms once, cached next to the state file, ~90 ms to start), and falls back to a short-lived powershell.exe process when that is not possible. The package ships no binary, declares no npm dependencies and makes no outbound network request.'
  zh: '让 DSH 桌面端窗口保持你离开时的大小：记录主窗口最后一次的外框尺寸（物理像素），下次启动恢复并居中到工作区，而且赶在窗口露面之前改完，启动动画不会播在错误的分辨率上。设置页有 12 个常用分辨率（1024×768 到 3840×2160）、任意自定义宽高、「恢复时居中」开关与「立即应用」，选中即生效并持久化。改尺寸走一个在使用者本机现编的小助手 exe：C# 源码随插件一起发布，首次运行用 Windows 自带的 csc.exe 编一次（实测约 110 毫秒），产物与同名 .cs 缓存到状态文件同目录，之后起进程约 90 毫秒；编不出来时退回临时 powershell.exe 进程。包里不含二进制、package.json 不声明任何依赖、不发任何外部网络请求。'
