name: a1141171521/dsh-plugin-memfuse
category: memory
description:
  en: 'Long-term memory for DSH stored as plain Markdown. Real user/assistant exchanges are captured into daily session files without a model call; an LLM pass then distils them into memories that are injected into the system prompt each turn. Retrieval is local (CJK bigram + BM25) in three levels — index, summary, full text — so the model only pays for the detail it asks for. Memories carry priorities; P0 and user-written entries are never changed automatically, and forgetting marks an entry stale instead of deleting it, so the whole chain stays auditable in status.md. Six tools cover recall, write, status, extract, feedback and the skill library; when a cluster of memories is ready to become a skill, a card appears at the end of the turn, writes the SKILL.md on click, and installs it only after you approve. Learning is on by default and follows the conversation model; turning the master switch off stops the LLM entirely while capture keeps working. Failures are surfaced in the prompt and in status.md instead of being swallowed. Pure JavaScript, no third-party runtime dependencies beyond the harness packages.'
  zh: 'DSH 的长期记忆，全部存成纯文本 Markdown。真实的用户/助手对话会零模型调用地落进按天切分的会话文件，再由一轮 LLM 抽取沉淀成记忆，每轮注入系统提示。检索在本地完成（中文二元组 + BM25），分索引、摘要、全文三级，模型只为它真正要看的细节付费。记忆带优先级；P0 与用户手写的条目永不被自动改动，遗忘是把条目标记为 stale 而不是删除，整条链路都能在 status.md 里审计。六个工具覆盖检索、写入、状态、抽取、反馈与技能库；当一组记忆够格变成技能时，回合尾部会出现一张卡片，点一下当场写出 SKILL.md，经你确认后才装进技能库。学习默认开启并跟随对话模型；关掉总开关即完全不用 LLM，而原始问答照样落盘。失败会写进提示与 status.md，不会被吞掉。纯 JavaScript，除 harness 自带包外无第三方运行时依赖。'
