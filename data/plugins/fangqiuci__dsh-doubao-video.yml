url: https://github.com/fangqiuci/dsh-doubao-video
name: fangqiuci/dsh-doubao-video
category: workflow
description:
  zh: "豆包视频工坊：把分镜脚本做成成片的全流程闸门。风格锁定、分镜机检、角色卡与参考图分离、首尾帧衔接、片段去重；支持多模型时长上限（Mini/Fast ≤10s、2.0 ≤15s、2.5 ≤40s）。用 ffmpeg 做取帧、拼接与字幕；语音合成调用另装的本机 TTS 插件，原声字幕识别另需 Python 与 faster-whisper。"
  en: "Doubao video workshop: a gated pipeline from storyboard to finished cut. Locked art direction, shot validation, character-card vs reference-image separation, first/last-frame continuity and clip dedup; model-aware duration caps (Mini/Fast 10s, 2.0 15s, 2.5 40s). Uses ffmpeg for frame extraction, concatenation and subtitles; speech synthesis calls a separately installed local TTS plugin, and ASR subtitles need Python with faster-whisper."
