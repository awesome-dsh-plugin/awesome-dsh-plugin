url: https://github.com/Hongcheng-LI/dsh-zotero
name: Hongcheng-LI/dsh-zotero
category: tools
description:
  en: 'Zotero library tools via the local API (no API key, Zotero 7+): search items and collections, read metadata, abstracts and PDF full text (on-the-fly parsing when the cache misses), download attachments, and manage notes; API endpoint, target library and limits are configurable.'
  zh: 通过 Zotero 本地 API（无需 API Key，Zotero 7+）操作文献库：检索条目与分类、读元数据/摘要/PDF 全文（缓存未命中时现场解析）、下载附件、管理笔记；API 地址、目标文献库与限额均可配置。
