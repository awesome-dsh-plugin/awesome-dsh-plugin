url: https://github.com/heiyedehen/dsh-whale-whispers
name: heiyedehen/dsh-whale-whispers
category: ui
description:
  en: "Whale Whispers: a quote book for the lines worth reading twice — what you said, and what the agent said back. Every line lives in a tab above the input box, keeps the moment it came from, and can be searched, picked at random, or exported. Local only."
  zh: "鲸语：给说过的话留一本句子本——你说过的、它回你的，那句值得再看一遍的话都收进输入框上方的「鲸语」标签里，每句都带着当时的上下文，能搜、能随手翻一句、能导出。只存本地。"
