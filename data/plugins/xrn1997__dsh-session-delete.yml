url: https://github.com/xrn1997/dsh-session-delete
name: xrn1997/dsh-session-delete
category: session
description:
  en: 'Adds a trash for DSH sessions: nothing expires automatically. Delete or batch delete moves sessions there, where you can read, restore, or permanently delete them.'
  zh: '给 DSH 会话加上回收站。增加删除会话、多选批量删除会话功能，删除的会话会被移至回收站。回收站内的会话可恢复，也可彻底删除；彻底删除就是永久删除，之后不可恢复，也不会自动过期。回收站内可以查看会话正文，方便区分会话。'
