url: https://github.com/xrn1997/dsh-session-delete
name: xrn1997/dsh-session-delete
category: session
description:
  en: 'Adds a trash for DSH sessions: the host natively offers archive but no delete. Deleting one session or batch-deleting several moves each session together with its subagent children into a local trash; there you can read the full conversation, restore it, or permanently delete it. The panel has an archived tab as well, with read-only preview and one-step unarchive. Permanent delete cannot be undone, and nothing expires on its own.'
  zh: '给 DSH 会话加上回收站——宿主原生只有归档、没有删除。单条删除或多选批量删除，都会把会话连同其子代理一起移入本机回收站；回收站里可读完整正文、恢复或彻底删除。面板另有「归档」档，可只读预览并一步解除归档。彻底删除后不可恢复，也不会自动过期。'
