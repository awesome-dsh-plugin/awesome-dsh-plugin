url: https://github.com/baibiaowang/dsh-voice-input-wb-asr
name: baibiaowang/dsh-voice-input-wb-asr
category: voice
description:
  en: "Free speech-to-text for DeepSeek Harness. Hold the composer microphone (or Alt while the caret is in the composer) and the text is typed into the input box as you speak: the audio is cut at pauses, each phrase is recognized as it lands, and releasing the button recognizes the whole take once more and replaces the preview with the corrected transcript. Also ships wb_transcribe, which turns long audio or video into one timestamped Markdown document (an 82-minute recording in 47 seconds in a measured run). Recognition uses the WorkBuddy accounts already signed in; WorkBuddy does not bill speech input. International and domestic builds are separate settings, international by default."
  zh: "\u8f93\u5165\u6846\u91cc\u7684\u6309\u4f4f\u8bf4\u8bdd\u9ea6\u514b\u98ce\uff1a\u8bf4\u8bdd\u65f6\u5b57\u76f4\u63a5\u6253\u8fdb\u8f93\u5165\u6846\uff08\u6309\u4f4f\u671f\u95f4\u97f3\u9891\u5728\u505c\u987f\u5904\u5207\u5f00\uff0c\u6bcf\u53e5\u843d\u4e0b\u5c31\u8bc6\u522b\uff09\uff0c\u677e\u5f00\u540e\u6574\u6bb5\u91cd\u65b0\u8bc6\u522b\u4e00\u6b21\uff0c\u7528\u7ea0\u6b63\u540e\u7684\u6587\u7a3f\u66ff\u6362\u9884\u89c8\u3002\u53e6\u5e26 wb_transcribe\uff0c\u628a\u957f\u97f3\u9891/\u89c6\u9891\u8f6c\u6210\u4e00\u4efd\u5e26\u65f6\u95f4\u6233\u7684 Markdown \u6587\u7a3f\uff08\u5b9e\u6d4b 82 \u5206\u949f\u5f55\u50cf 47 \u79d2\u8f6c\u5b8c\uff09\u3002\u8bc6\u522b\u8d70\u672c\u673a\u5df2\u767b\u5f55\u7684 WorkBuddy \u8d26\u53f7\uff0cWorkBuddy \u5bf9\u8bed\u97f3\u8f93\u5165\u4e0d\u8ba1\u8d39\u3002\u56fd\u9645\u7248\u4e0e\u56fd\u5185\u7248\u5206\u5f00\u8bbe\u7f6e\uff0c\u9ed8\u8ba4\u56fd\u9645\u7248\u3002"
