description:
  en: Hold-to-talk microphone in the composer that recognizes through the WorkBuddy cloud, using the accounts already signed in on this machine. International and domestic builds are separate settings, international by default.
  zh: 输入框里的按住说话麦克风，走 WorkBuddy 云端识别，直接用本机已登录的账号。国际版与国内版分开设置，默认国际版。