url: https://github.com/baibiaowang/dsh-voice-input-wb-asr
name: baibiaowang/dsh-voice-input-wb-asr
category: voice
description:
  en: 'Hold-to-talk microphone in the composer that recognizes through the WorkBuddy cloud, using the accounts already signed in on this machine. International and domestic builds are separate settings, international by default. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '输入框里的按住说话麦克风,走 WorkBuddy 云端识别，直接用本机已登录的账号。国际版与国内版分开设置，默认国际版。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'