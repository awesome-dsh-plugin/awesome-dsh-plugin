url: https://github.com/Mastiff-No/dsh-tone
name: Mastiff-No/dsh-tone
category: identity
description:
  en: 'A 0-10 tone dial for DeepSeek Harness that writes the selected level into the system prompt on every turn, with four editable levels and a master on/off switch. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '给 DeepSeek Harness 加一个 0-10 的语气档位旋钮，每轮把所选档位写进系统提示；四档文案可自行编辑，另有总开关。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/Mastiff-No/dsh-tone/main/icon.png
