name: hemu996/smart-ppt-designer#国赛PPT设计台
category: ui
description:
  en: 'Competition-grade PPT design console for DeepSeek Harness, paired with the smart-ppt-designer skill: 19 visual systems to retrieve by content, 29 hard red lines that a failing design must be rebuilt against, a 13-step workflow, 32 ready commands, 18 animation recipes and 95 catalogued templates. Import a local .pptx and it extracts the cover and summarises the deck structure (page outline, imagery and data it expects, theme colours); templates are browsed with inline thumbnails, and one click copies the assembled generation brief for the skill to execute. Latest (1.8.0): structure summary on import, opt-in model analysis, ppt-effects 1.2.0 recipes (18 total), truthful template availability reporting, and a theme-following ambient background.'
  zh: '国赛/创赛级 PPT 设计台，配合 smart-ppt-designer 技能使用：19 套视觉系统按内容检索、29 条硬红线（违反即返工）、13 步工作流、32 条命令、18 条动效、95 份模板清单。导入本地 .pptx 会自动抽取封面，并生成结构速览（页面框架、需要的素材与数据、主题色）；模板内联缩略图预览，一键复制组装好的生成指令交给技能执行。最新 1.8.0：导入即出结构速览、可选 AI 深度分析、并入 ppt-effects 1.2.0（共 18 条动效）、模板可用性如实上报、随主题自适应的环境光背景。'
