description:
  en: 'Sidebar workbench for the smart-ppt-designer PPT skill in DeepSeek Harness: browse design styles and red lines, look up the workflow, preview templates with inline thumbnails, and import local .pptx files that get a cover thumbnail automatically. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 侧边栏设计台：检索视觉风格与红线、速查工作流、内联缩略图预览模板，导入本地 .pptx 自动抽取封面作预览。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
