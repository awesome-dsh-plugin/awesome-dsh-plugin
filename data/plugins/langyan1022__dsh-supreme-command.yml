name: langyan1022/dsh-supreme-command
category: theme
icon: https://raw.githubusercontent.com/langyan1022/dsh-supreme-command/main/assets/icon.png
description:
  en: 'Startup screen and matching FUI theme for DeepSeek Harness, styled after The Wandering Earth. The opening beat traces a 550W mark with self-check lines and a connect bar; a HUD title, meter and log then lead into a scanned ID badge (front: lab mark, ID band, barcode; back: name, role, code) and an authorization banner. Three MOSS-voice lines ship as audio assets (serialised, never overlapping). The skin repoints 125 --dsw-* tokens and adds a toggleable FUI layer: telemetry block, edge rulers, data ticker, turn gutter, user-message prompts, empty-state radar, live uptime/power readouts. Panels get numbered tags and reticles, and the Windows title bar follows the theme palette. One settings section exposes palette, texture, copy, voice, badge and FUI density.'
  zh: 'DeepSeek Harness 的《流浪地球》启动屏与 FUI 主题。开屏先描边绘制 550W 标识，配自检行与连接进度条；随后 HUD 标题、进度条与状态日志依次进场，扫描并翻面一张工牌（正面：实验室标识、编号带与条码；背面：姓名、职务与编码），以授权横幅收尾。三句 MOSS 音色语音随包（串行播放，不会叠音）。界面皮肤替换 125 枚 --dsw-* 令牌，并加一层可开关的 FUI 增强层：遥测块、边缘刻度、数据条、轮次编号、用户消息提示符、空状态雷达、实时任务时钟与功率读数；面板有编号标签与取景角标，Windows 标题栏跟随主题配色。一个设置分区里提供配色、质感、文案、语音、工牌与 FUI 密度。'
