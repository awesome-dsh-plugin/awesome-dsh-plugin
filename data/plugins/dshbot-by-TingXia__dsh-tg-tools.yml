description:
  en: 'Telegram tools for DSH sessions: list chats, read cached messages, send text, photos, stickers, GIFs and dice, set reactions, forward/edit/delete messages, typing and chat members, plus optional getUpdates polling that caches incoming messages and wakes the target session for allow-listed chats only. Bot API only, no MTProto.'
  zh: '给 DSH 会话用的 Telegram 工具：列 chat、看缓存消息、发文字/图片/贴纸/GIF/骰子、加 reaction、转发/编辑/删除、typing、查成员；可选开启 getUpdates 轮询缓存消息，并仅对白名单 chat 唤醒目标会话。只走 Bot API，不依赖 MTProto。'
