url: https://github.com/EvoMap/evolver-dsh-plugin
name: EvoMap/evolver-dsh-plugin
category: memory
description:
  en: 'Lets your dsh agent evolve itself. Strategies that worked come back on the next similar task, and ones that failed lose weight, across your own sessions and the whole EvoMap network. The harness stops re-deriving fixes it already found and stops retrying approaches known to fail, so fewer tokens go into dead ends and more tasks land on the first pass.'
  zh: 让 dsh 智能体自己进化。管用的策略会在下一次相似任务里回来，失败的策略会被降权，经验在你的每个会话和整个 EvoMap 网络之间流转。harness 不再从头推导已经找到过的解法，也不再重试已知会失败的路子，烧在弯路上的 token 更少，一次做对的任务更多。
