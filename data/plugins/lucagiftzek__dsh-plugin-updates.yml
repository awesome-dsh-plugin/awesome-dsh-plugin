url: https://github.com/lucagiftzek/dsh-plugin-updates
name: lucagiftzek/dsh-plugin-updates
category: tools
description:
  en: 'Notify-only update checker for the plugins in a DSH profile: classifies each dependency by its specifier and offers only releases the running DSH core can load, in a plugin_updates tool and an Updates sidebar tab (the tab needs dsh-better-sidebar; the tool and settings work without it).'
  zh: '面向 DSH profile 内插件的只提醒更新检查器：按依赖写法（specifier）分类，只列出当前 DSH 内核能加载的版本；提供 plugin_updates 工具和 Updates 侧栏页（侧栏页需装 dsh-better-sidebar，不装时工具与设置仍可用）。'
