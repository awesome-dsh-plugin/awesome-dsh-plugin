url: https://github.com/loyalchiiina/dsh-chat-image-lightbox
name: loyalchiiina/dsh-chat-image-lightbox
category: ui
description:
  zh: '聊天图片全屏查看器：点击任意图片打开原始分辨率大图，支持缩放（滚轮、按钮、快捷键）、拖拽平移、左右翻页、文件名显示、下载保存，以及键盘方向键与移动端滑动切换。输入框旁一个「对话图显控制」面板，可一键把整个会话的图收成可调列数（1–12，自动记忆）的缩略图网格，或整块隐藏并收掉占位、随时还原；图片只原地加样式，绝不搬移或重挂节点。宿主侧 display_image 工具支持本地路径或目录（TIFF/HEIC 自动转码，下载仍保存原文件）、网络直链、以及 Bing、花瓣、搜狗的关键词搜图（按抽样可加载率选源，被防盗链拦截的自动转存，坏链按字节校验剔除），返回可直接粘贴的 Markdown；并在 system prompt 常驻一条投递规则，要求发出的图必须写进回复正文（![](…)），因为折叠的工具行读者看不到。'
  en: 'Full-screen lightbox for chat images: click any image to open the full-resolution original with zoom (wheel, buttons, shortcuts), drag panning, prev/next paging, filename caption and download, plus keyboard-arrow and touch-swipe navigation. One "image display control" popover next to the composer collapses every image in the conversation into a thumbnail grid whose column count (1-12) is configurable and remembered, or hides them entirely so the space closes up and restores them later; images are styled in place and no node is ever moved or reparented. The host-side display_image tool takes a local path or directory (TIFF/HEIC transcoded, originals still saved on download), a remote URL, or a keyword search over Bing, Huaban and Sogou that samples loadability before picking a source, re-saves images blocked by hotlink protection and drops dead links after a magic-byte check, returning paste-ready Markdown. It also keeps a system-prompt rule that every delivered image must appear in the reply body as ![](…) markdown, because collapsed tool rows are invisible to the reader.'