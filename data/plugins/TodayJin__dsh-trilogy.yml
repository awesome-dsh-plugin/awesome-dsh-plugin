url: https://github.com/TodayJin/dsh-trilogy
category: memory
description:
  en: "Per-project memory for DeepSeek Harness. Three Markdown files per workspace — PROJECT.md, DECISIONS.md and SESSIONS.md — are auto-created on the first step of any session in that workspace, re-read from disk and re-injected only when they change (and re-injected if compaction dropped them), and written back by classification through a memory_checkpoint tool, with a bounded end-of-turn nudge when a turn did work but recorded nothing. Zero-dependency BM25 memory_search across live and archived entries. The session log is capped at 200 entries with the overflow moved to SESSIONS-archive.md — never injected, but visible, readable and searchable, and restorable one entry at a time. Settings page: workspace list, live file view, edit/save, path filter, archive tab, cross-workspace overview, export/import of a workspace's memory as a JSON bundle, a panel for the AGENTS.md instruction block (rewrite/remove), a PROJECT.md staleness reminder, and clear. A composer status chip shows that workspace's sync state and creates the files on click. Zero dependencies — no vector store, no embeddings, and no model calls."
  zh: "DeepSeek Harness 的项目记忆插件。每个工作区三份 Markdown 文件（PROJECT.md / DECISIONS.md / SESSIONS.md）：会话首个步骤自动创建、每个会话自动加载、内容变了才重注入（被上下文压缩挤掉也会重注入），并按分类经 memory_checkpoint 工具写回，在「干了实事却没记录」时给一次收尾提醒。零依赖 BM25 的 memory_search 可同时搜活日志与归档。会话日志上限 200 条，溢出搬进 SESSIONS-archive.md —— 不自动注入，但可见、可读、可搜，并能逐条恢复。设置界面：工作区列表 / 实时查看 / 编辑保存 / 路径筛选 / 归档页签 / 全部工作区概览 / 导出导入单个工作区的记忆包（JSON）/ AGENTS.md 指令段面板（重写或移除）/ PROJECT.md 陈旧提醒 / 清除。输入框状态图标显示该工作区的同步状态，无记忆时可点击创建。零依赖——不含向量库、embedding 或模型调用。"
