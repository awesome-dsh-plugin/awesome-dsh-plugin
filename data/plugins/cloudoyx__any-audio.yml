name: cloudoyx/any-audio
category: voice
description:
  en: 'Agent audio studio for DeepSeek Harness: compose from note-level scores, narrate, add sound effects and mix, then fine-tune every track on an editable timeline where each generated sound arrives as its own clip.'
  zh: '给 agent 用的音频工作室（DeepSeek Harness 插件）：写谱编曲、配音、音效与混音，生成的每个声音都以独立片段落到同一条可视化时间轴上，可逐轨试听、单独调节与微调。'