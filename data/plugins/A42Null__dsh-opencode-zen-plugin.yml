url: https://github.com/A42Null/dsh-opencode-zen-plugin
name: A42Null/dsh-opencode-zen-plugin
category: model
description:
  en: "OpenCode Console (Zen) models for DeepSeek Harness: paste a Console API key under Settings → Plugins and the Console's chat models become selectable, with the catalog synced automatically, each model routed to the endpoint the official docs assign, and free *-free models hidden by default because they only run inside the OpenCode client."
  zh: "为 DeepSeek Harness 接入 OpenCode Console (Zen) 模型：在「设置 → 插件」填入 Console API Key 后即可选用 Console 的对话模型，模型目录自动同步，每个模型按官方文档路由到对应端点，免费 *-free 模型默认不列出（它们只能在 OpenCode 客户端内运行）。"