url: https://github.com/william-jin-cmu/dsh-native-runtimes
name: william-jin-cmu/dsh-native-runtimes
category: model
description:
  en: 'Runs sessions on your own Claude Code and Codex CLIs from the model picker, and lets a DSH agent hand background tasks to them and follow up. Permission prompts cannot be answered from DSH: Claude Code runs in acceptEdits mode by default, Codex in its workspace-write sandbox, and ACP permission requests are approved automatically by default.'
  zh: '在模型选择器里用你本机的 Claude Code 和 Codex CLI 跑会话，也让 DSH agent 把后台任务交给它们并继续追问。权限提示无法在 DSH 里回答：Claude Code 默认以 acceptEdits 模式运行，Codex 用 workspace-write 沙箱，ACP 的权限请求默认自动批准。'
