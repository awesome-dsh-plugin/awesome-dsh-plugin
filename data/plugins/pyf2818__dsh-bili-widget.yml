name: pyf2818/dsh-bili-widget
category: ui
description:
  en: Floating Bilibili video mini-player for DSH — always-on-top window with discover/search/follow-UP channels, auto-playlist, mini & focus modes, persisted watch history and window minimize-to-ball.
  zh: DSH 里的 B站悬浮看片小窗：置顶窗口，含推荐/热门/排行/精选/关注/AI 频道与搜索，自动连播、迷你专注模式、历史持久化与最小化悬浮球。
  ja: DSH 向けのフローティング Bilibili ミニプレーヤー——常に手前に表示されるウィンドウで、発見/検索/フォロー中のチャンネル、自動プレイリスト、ミニ＆集中モード、視聴履歴の保存、ウィンドウのボール化に対応します。
