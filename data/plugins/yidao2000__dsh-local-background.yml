url: https://github.com/yidao2000/dsh-local-background
name: yidao2000/dsh-local-background
category: theme
description:
  en: 'Local-folder wallpaper for the DSH Web UI: point it at a directory on your own disk and the host serves those images over same-origin HTTP, rotating one every N minutes (0-1440, default 5) in a shuffled pass with no repeats; settings page under Plugins picks the folder through the native Windows dialog with an in-app directory browser as fallback, and tunes image opacity, darkening scrim and panel opacity with changes applied live. Reads .jpg .jpeg .png .webp .gif .avif .bmp straight from disk, and keeps per-user settings under $DSH_HOME so upgrades never ship your folder path.'
  zh: '用本地文件夹当 DSH Web 壁纸：指定磁盘上一个目录，宿主即通过同源 HTTP 提供其中的图片，每 N 分钟轮换一张（0-1440，默认 5），洗牌后一轮内不重复；「插件」页的设置界面可通过 Windows 原生文件夹对话框选目录（不可用时回退为应用内目录浏览），并可调节背景图不透明度、压暗遮罩与面板不透明度，改动即时生效。直接读取 .jpg .jpeg .png .webp .gif .avif .bmp，用户配置写入 $DSH_HOME，升级不会带上你的目录路径。'
