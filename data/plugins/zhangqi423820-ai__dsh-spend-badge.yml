name: zhangqi423820-ai/dsh-spend-badge
category: usage
description:
  en: 'Appends what each turn cost to its usage row and the running session total to the composer status bar, priced on DeepSeek''s published peak and off-peak rates. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在每条回复的用量行后面接上本轮花费，在输入框下方状态栏接上本会话累计花费，按 DeepSeek 官方峰谷价折算。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
