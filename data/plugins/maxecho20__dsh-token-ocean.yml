  en: 'Adds a Token Ocean panel to the DSH sidebar. On DSH Desktop it opens the ascii-ocean page in a webview for scooping fish and feeding the water; the web build shows an open-in-browser card.'
  zh: '在 DSH 左侧栏加入 Token Ocean 面板。桌面版用 webview 打开 ascii-ocean，可以点鱼捞起、点水投喂；网页版没有 webview 载体，会显示在浏览器中打开的提示卡。'
