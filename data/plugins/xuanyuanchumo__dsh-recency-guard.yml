url: https://github.com/xuanyuanchumo/dsh-recency-guard
name: xuanyuanchumo/dsh-recency-guard
category: security
description:
  en: "Crash-recovery guard for DeepSeek Harness: records plugin install and update recency plus declared compatibility metadata, blocks the offending suspects before the next boot after a crash, and restores stable plugins afterwards. Ships a management panel with an interactive capability graph, a hot-reload loop that syncs the running instance with the built dist before reloading, torn-line-tolerant journaling with integrity reporting, per-project partition isolation, archive-and-reset, and an offline rescue CLI."
  zh: "DeepSeek Harness 的插件崩溃恢复守护：记录插件的安装更新时序与声明的兼容元数据，崩溃后在下一次启动前拦下问题嫌疑插件，稳定后自动恢复。带可交互能力图谱（按功能域过滤）、与构建产物指纹联动的热重载闭环、坏行容错且如实上报完整性的事件日志、按项目分区隔离、归档重置与离线救援 CLI。"
icon: https://raw.githubusercontent.com/xuanyuanchumo/dsh-recency-guard/main/assets/icon-256.png
