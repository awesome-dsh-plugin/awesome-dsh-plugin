url: https://github.com/JinYihang1011/dsh-plugins/tree/main/dsh-ui-tweaks
name: JinYihang1011/dsh-plugins#dsh-ui-tweaks
category: ui
description:
  en: 'A stylesheet and small DOM patches that align third-party sidebar entries with the host: matching row height, padding and icon size, a consistent active background, and mutual exclusion so the cron panel and host panels never overlap. It also hides the duplicate cyrene theme shortcut in the sidebar footer while keeping the settings entry and theme features available.'
  zh: '通过样式表和少量 DOM 补丁统一第三方侧栏入口与宿主的行高、内边距和图标尺寸，统一选中底色，并避免定时任务面板与宿主面板重叠；同时隐藏侧栏底部重复的昔涟主题入口，设置页入口及主题功能仍可使用。'
