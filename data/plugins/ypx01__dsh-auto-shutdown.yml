url: https://github.com/ypx01/dsh-auto-shutdown
name: ypx01/dsh-auto-shutdown
category: workflow
description:
  en: "Windows-only: per-session auto-shutdown switch in the session header — once every armed session has no turn, job, subagent or scheduled run still running (by default every other live session must be idle too), a two-minute countdown starts and the machine powers off; clicking the countdown cancels it, and sessions without the switch never start one."
  zh: "仅 Windows：会话标题栏上的「任务完成后自动关机」开关——所有开启它的会话都不再有进行中的回合、任务、子代理或定时执行（默认还要求其他在线会话也空闲）时，开始两分钟倒计时，结束后关机；点倒计时即取消，没开这个开关的会话不会触发任何动作。"
icon: https://raw.githubusercontent.com/ypx01/dsh-auto-shutdown/main/assets/icon-180.png
