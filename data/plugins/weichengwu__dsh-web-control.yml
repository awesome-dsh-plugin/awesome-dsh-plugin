tarball: https://github.com/weichengwu/dsh-web-control/releases/download/v0.1.0/dsh-web-control-0.1.0.tgz
description:
  en: "Manage a LAN or Tailscale reachable dsh web instance from inside DSH. dsh web listens on loopback by default; this adds a Settings > Web access panel that detects the machine's Tailscale and LAN addresses, starts dsh web bound to the one you pick, and shows the token URL to open on a phone or another machine. Also stops and restarts it, tails the child log, persists the bind address and port, and registers two agent tools (dsh_web_control, dsh_web_config). Zero runtime dependencies."
  zh: "在 DSH 内管理一个可被局域网或 Tailscale 访问的 dsh web 实例。dsh web 默认只监听回环地址，本插件新增「设置 → Web 访问」面板：自动探测本机的 Tailscale 与局域网地址，选定后启动绑定到该地址的 dsh web，并给出可直接在手机或另一台机器上打开的带 token 地址。同时支持停止、重启、查看子进程日志、持久化绑定地址与端口，并注册两个智能体工具（dsh_web_control、dsh_web_config）。零运行时依赖。"
