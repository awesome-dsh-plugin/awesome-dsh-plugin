url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) wired end to end into DeepSeek Harness, with six tools: jev_decision (1-25 parallel atomic verdicts in one call, question types noul/choice/score, typed answers plus calibrated confidence, measured median 266-484 ms and p95 825-1468 ms, verdicts only - never prose), jev_choose (rank 2-10 candidate approaches by scoring each one in parallel - fit 0-3 and risk - into an explicit composite with a recommended pick and no explanation), jev_usage (the usage/quota panel: locally measured calls, input/output tokens, estimated cost, latency median and p95, question-type and per-tool mix, rolling windows today/7d/30d/all/session, a projected daily burn rate, a per-day sparkline and optional hard budgets), jev_overview (usage ledger: calls, median latency, tokens, cost, guard events - recorded even when the dashboard page is disabled), jev_guard_status (guard counters plus a registrations block that surfaces any per-surface registration failure, honest disabled when off) and jev_verify (frozen 27-question live benchmark run at concurrency 6: 96.3%, 26/27, measured 2026-10-04 with median 282-484 ms, p95 1468 ms and 4.0-5.0 s wall versus 10.1 s serial). Each tool renders a structured in-chat view (answers, confidence, latency, cost, guard counters, benchmark report, ranking table, quota meters). The plugin registers a real agent system-prompt section (v0.7.4) so the harness calls Jev on its own, plus a Settings > Plugins card covering every option (credentials, tool toggles, the whole auto-guard block, dashboard, guidance, usage/quota). The auto-guard (0.7.5) runs two deterministic tiers under a Jev backstop: 7 hard rules block catastrophic operations (recursive deletes of a filesystem, home, drive or directory tree, disk formatting, database destruction, force-pushed git history, credential exfiltration) but only in executable position, so documenting a dangerous command in prose is never blocked; any hard match found elsewhere and 3 soft patterns (host restart, git-history rewrite short of a force push, always-true DELETE/UPDATE) are handed to Jev against denyThreshold. Both tiers report onSafetyDeny and the loop check reports onLoopAdvisory into the ledger with the tool name; Jev failure is fail-open. Honest by design: TypeSafe publishes no balance or quota endpoint (GET /v1/usage, /v1/quota, /v1/account, /v1/balance, /v1/credits, /v1/limits, /v1/billing all return 404; only /v1/models answers), so the quota panel reports only what this machine measured against locally configured budgets and says so explicitly - it never invents a provider-side balance. quota.enforce turns those budgets into a pre-call hard stop (display-only by default); history is in-memory unless quota.persist is enabled, then up to quota.historyDays days are kept in $DSH_HOME/jev-usage.json. Since 0.8.1 the Settings > Plugins card also decodes correctly on hosts whose bundled schemastery is older than the server-side one: the schema registered with the settings service no longer carries GUI-only volatile markers (a separate entry-form schema keeps them), the card falls back to the raw base/user config layers when a decoded value is unavailable, and the credential badge reports three honest states - a literal key, an environment-variable/credential reference, or none - instead of claiming "unconfigured" over a key that is in fact configured. Regression-tested: the registered schema is asserted plain and JSON-safe, and the card is rendered against an undecodable snapshot and asserted to name the configured reference. No mock fallback: a missing key produces an explicit error with setup instructions." 0.8.2 fixes and extends the surfaces around the tools: the /jev page no longer 404s (dashboard.basePath is normalized - a leading slash is added, trailing slashes trimmed, empty or "/" falls back to /jev - and both /jev and /jev/ are registered; with dashboard.enabled off the path still answers with a server-rendered, JS-free live status page showing today's calls, cost, instance count, tokens, latency and quota state, and pointing at the composer pill), a read-only /jev/api/usage JSON route always mounts (independent of dashboard.enabled) and feeds a compact composer usage pill registered in the conversation.input.right slot next to the submit button (label "Jev - today N calls - $0.000534" with warn/danger tone dot, expanding into a 270 px popover with today's calls and cost against their limits, this instance's calls, today's tokens, median and p95 latency, guard denials, top three tools, time to reset, last refresh and a manual refresh; refreshed every 60 s and on tab focus, falling back to the full board API when the pill route is absent, degrading to "quota unavailable" with the exact error, never throwing, and reporting local measurements only - never a vendor balance).
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型），共六个工具：jev_decision（一次并行完成 1-25 个原子判定，问题类型 noul/choice/score，返回类型化答案与校准置信度，实测中位 266-484 ms、p95 825-1468 ms，只出判定不写文本）、jev_choose（对 2-10 个候选方案并行逐项打分——契合度 0-3 与风险——合成综合分并给出推荐，只给分不解释）、jev_usage（使用额度面板：本机实测调用数、input/output tokens、估算成本、延迟中位与 p95、问题类型与按工具分布、today/7d/30d/all/session 滚动窗口、全天用量预测、每日走势图，以及可选的硬性预算）、jev_overview（用量账本：调用次数、中位延迟、tokens、成本、护栏事件，看板页面关闭时也照记）、jev_guard_status（护栏计数，另以 registrations 暴露任何分面注册失败；未启用时如实报 disabled）与 jev_verify（对线上 API 以 6 路并发运行冻结的 27 题带标签基准：96.3%，26/27，2026-10-04 实测中位 282-484 ms、p95 1468 ms、墙钟 4.0-5.0 s，串行需 10.1 s）。每个工具都有对话内结构化视图（答案、置信度、延迟、成本、护栏计数、实测报告、排名表、额度进度条）。插件会注册真实的代理 system prompt 段（0.7.4 起，这才让 harness 自己主动调用 Jev），并提供覆盖全部选项的「设置 → 插件」卡片（凭据、工具开关、整组自动护栏、看板、引导段、使用额度）。自动护栏（0.7.5）在 Jev 兜底之上分两层确定性规则：7 条硬规则拦截灾难性操作（对文件系统根、家目录、盘根或目录树的递归删除，磁盘格式化，数据库破坏语句，强制推送的 git 历史，凭据外泄），但只在可执行位置命中，因此在正文里引用或描述危险命令不会被拦；硬模式出现在其他位置、以及 3 条软规则（主机重启或关机、未强推的历史重写、恒真 DELETE/UPDATE）都交给 Jev 按 denyThreshold 判定。两层都会上报 onSafetyDeny、循环检测会以工具名上报 onLoopAdvisory 到账本；Jev 失败即放行（fail-open）。诚实设计：TypeSafe 没有余额或额度接口（GET /v1/usage、/v1/quota、/v1/account、/v1/balance、/v1/credits、/v1/limits、/v1/billing 全部 404，只有 /v1/models 有响应），因此额度面板只报本机实测用量、对照你配置的本地预算，并明确写明这一点——绝不编造供应商侧余额。quota.enforce 可把这些预算变成调用前硬停（默认只展示不拦截）；历史默认只存内存，开启 quota.persist 后最多保留 quota.historyDays 天到 $DSH_HOME/jev-usage.json。0.8.1 起「设置 → 插件」卡片在自带 schemastery 比服务端更老的宿主上也能正确解码：注册给设置服务的 schema 不再带只服务于入口表单的 volatile 标记（标记由另一个入口表单 schema 保留），解码值不可用时卡片回退读取原始 base/user 配置图层，凭据徽章改为三态（明文 Key / 环境变量或凭据引用 / 无），不再对已经配好的 Key 显示「未配置」。已有回归测试：断言注册用 schema 上线后为普通值且可 JSON 往返，并以「解码失败」的快照渲染卡片、断言其给出真实凭据引用。无 Mock 回退：未配置 Key 时给出带配置说明的明确报错。 0.8.2 修复并补齐工具周围的界面：/jev 不再 404（dashboard.basePath 会规范化——补前导斜杠、去尾部斜杠、空值或「/」回落 /jev——且同时注册 /jev 与 /jev/；即使 dashboard.enabled 关闭，该路径也会返回一张服务端渲染、零 JS 的实时状态页，显示今日调用、今日成本、本插件实例、tokens、时延与额度状态，并指路输入框右侧的胶囊），只读路由 /jev/api/usage 无条件挂载（不依赖 dashboard.enabled），为注册在 conversation.input.right 槽位（提交按钮旁）的紧凑额度胶囊供数（标签形如「Jev · 今日 N 次 · $0.000534」，带 warn/danger 状态点，点开 270px 小面板：今日调用与今日成本对照各自上限、本插件实例调用、今日 tokens、中位与 p95 时延、护栏拦截、用量前 3 的工具、额度重置倒计时、最后刷新时间与手动刷新；每 60 秒与切回标签页时刷新，胶囊路由缺失时回退完整看板 API，失败降级为「额度不可用」并附真实错误、绝不抛错，只报本机实测数据、绝不编造供应商余额）。"
