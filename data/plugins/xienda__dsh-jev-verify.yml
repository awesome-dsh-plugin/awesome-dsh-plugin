url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) wired into DeepSeek Harness, with six tools: jev_decision (1-25 parallel atomic verdicts in one call - noul/choice/score, typed answers plus calibrated confidence, median ~282 ms, verdicts only and never prose), jev_choose (rank 2-10 candidate approaches by scoring each one in parallel), jev_usage (a local usage/quota panel: calls, tokens, cost, latency median and p95, per-tool mix, rolling windows, projections and optional hard budgets), jev_overview, jev_guard_status and jev_verify (a frozen 27-question live benchmark: 96.3%, 26/27). Every tool renders a structured in-chat view (answers, confidence, latency, cost, meters, ranking table, report). A settings card covers credentials and every switch; the plugin registers a real system-prompt section, so the harness reaches for Jev on its own instead of waiting to be asked. A two-tier, position-aware auto-guard blocks catastrophic commands while never flagging prose that merely describes one. 0.8.2 adds a compact usage pill beside the composer and a /jev status page that no longer 404s; 0.8.3 makes settings saves actually apply (nested paths were written as literal dotted keys). Honest by design: local measurements only, no mock fallback, never a fabricated vendor balance."
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型），共六个工具：jev_decision（一次并行 1-25 个原子判定，noul/choice/score，类型化答案+校准置信度，中位约 282 ms，只出判定不写文本）、jev_choose（对 2-10 个候选方案并行打分排序）、jev_usage（本机用量/额度面板：调用数、tokens、成本、时延中位与 p95、按工具分布、滚动窗口、用量预测与可选硬性预算）、jev_overview、jev_guard_status 与 jev_verify（冻结的 27 题在线基准：96.3%，26/27）。每个工具都有对话内结构化视图（答案、置信度、延迟、成本、进度条、排名表、实测报告）。「设置 → 插件」卡片覆盖凭据与全部开关；插件注册真实的 system prompt 段，harness 会主动调用 Jev 而不是等指令。两级位置感知自动护栏拦截灾难性命令，仅在正文中描述危险命令不会被拦。0.8.2 在输入框右侧加入紧凑额度胶囊，/jev 不再 404；0.8.3 让设置保存真正生效（此前嵌套路径被写成字面点号键）。诚实设计：只报本机实测，无 Mock 回退，绝不编造供应商侧余额。"
