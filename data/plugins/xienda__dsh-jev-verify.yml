url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) wired into DeepSeek Harness, with six tools: jev_decision (1-25 parallel atomic verdicts in one call - noul/choice/score, typed answers, calibrated confidence, median ~282 ms, verdicts only and never prose), jev_choose (rank 2-10 candidate approaches by scoring each one in parallel), jev_usage (a local usage panel: calls, tokens, cost, latency median and p95, per-tool mix, projections and optional hard budgets), jev_overview, jev_guard_status and jev_verify (a frozen 27-question live benchmark: 96.3%, 26/27). Every tool renders a structured in-chat view. A settings card covers credentials and every switch, and the plugin registers a real system-prompt section. 0.8.4: the panel is honest and money-first - TypeSafe exposes no balance endpoint, so with no local budget configured there is no "quota normal" verdict, no bar drawn against infinity and no reset countdown, only locally measured usage; the auto-guard own Jev verdicts are now metered (they used to leave jev_usage reading zero calls); and auto-triage (on by default) judges the first step of every turn and injects its advice, so the harness reaches for Jev on its own. Honest by design: local measurements only, no mock fallback, never a fabricated vendor balance."
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型），共六个工具：jev_decision（一次并行 1-25 个原子判定，noul/choice/score，类型化答案+校准置信度，中位约 282 ms，只出判定不写文本）、jev_choose（对 2-10 个候选方案并行打分排序）、jev_usage（本机用量面板：调用数、tokens、成本、时延中位与 p95、按工具分布、预测与可选硬性预算）、jev_overview、jev_guard_status 与 jev_verify（冻结的 27 题在线基准：96.3%，26/27）。每个工具都有对话内结构化视图；「设置 → 插件」卡片覆盖凭据与全部开关，插件并注册了真实的 system prompt 段。 0.8.4：面板改为诚实且金钱优先——TypeSafe 没有余额接口，未设本地预算时不出现「额度正常」判定、不对着 ∞ 画进度条、也没有重置倒计时，只报本机实测用量；自动护栏自己的 Jev 判定现在也入账（此前会让 jev_usage 一直显示 0 次调用）；新增自动预判（默认开启）在每轮第一步先做一次 Jev 判定并注入建议，harness 会主动调用 Jev。诚实设计：只报本机实测，无 Mock 回退，绝不编造供应商侧余额。"
