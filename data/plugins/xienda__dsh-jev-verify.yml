url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) wired end to end into DeepSeek Harness, with six tools: jev_decision (1-25 parallel atomic verdicts in one call, question types noul/choice/score, typed answers plus calibrated confidence, measured median 266-484 ms and p95 825-1468 ms, verdicts only - never prose), jev_choose (rank 2-10 candidate approaches by scoring each one in parallel - fit 0-3 and risk - into an explicit composite with a recommended pick and no explanation), jev_usage (the usage/quota panel: locally measured calls, input/output tokens, estimated cost, latency median and p95, question-type and per-tool mix, rolling windows today/7d/30d/all/session, a projected daily burn rate, a per-day sparkline and optional hard budgets), jev_overview (usage ledger: calls, median latency, tokens, cost, guard events - recorded even when the dashboard page is disabled), jev_guard_status (guard counters plus a registrations block that surfaces any per-surface registration failure, honest disabled when off) and jev_verify (frozen 27-question live benchmark run at concurrency 6: 96.3%, 26/27, measured 2026-10-04 with median 282-484 ms, p95 1468 ms and 4.0-5.0 s wall versus 10.1 s serial). Each tool renders a structured in-chat view (answers, confidence, latency, cost, guard counters, benchmark report, ranking table, quota meters). The plugin registers a real agent system-prompt section (v0.7.4) so the harness calls Jev on its own, plus a Settings > Plugins card covering every option (credentials, tool toggles, the whole auto-guard block, dashboard, guidance, usage/quota). The auto-guard (0.7.5) runs two deterministic tiers under a Jev backstop: 7 hard rules block catastrophic operations (recursive deletes of a filesystem, home, drive or directory tree, disk formatting, database destruction, force-pushed git history, credential exfiltration) but only in executable position, so documenting a dangerous command in prose is never blocked; any hard match found elsewhere and 3 soft patterns (host restart, git-history rewrite short of a force push, always-true DELETE/UPDATE) are handed to Jev against denyThreshold. Both tiers report onSafetyDeny and the loop check reports onLoopAdvisory into the ledger with the tool name; Jev failure is fail-open. Honest by design: TypeSafe publishes no balance or quota endpoint (GET /v1/usage, /v1/quota, /v1/account, /v1/balance, /v1/credits, /v1/limits, /v1/billing all return 404; only /v1/models answers), so the quota panel reports only what this machine measured against locally configured budgets and says so explicitly - it never invents a provider-side balance. quota.enforce turns those budgets into a pre-call hard stop (display-only by default); history is in-memory unless quota.persist is enabled, then up to quota.historyDays days are kept in $DSH_HOME/jev-usage.json. No mock fallback: a missing key produces an explicit error with setup instructions."
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型），共六个工具：jev_decision（一次并行完成 1-25 个原子判定，问题类型 noul/choice/score，返回类型化答案与校准置信度，实测中位 266-484 ms、p95 825-1468 ms，只出判定不写文本）、jev_choose（对 2-10 个候选方案并行逐项打分——契合度 0-3 与风险——合成综合分并给出推荐，只给分不解释）、jev_usage（使用额度面板：本机实测调用数、input/output tokens、估算成本、延迟中位与 p95、问题类型与按工具分布、today/7d/30d/all/session 滚动窗口、全天用量预测、每日走势图，以及可选的硬性预算）、jev_overview（用量账本：调用次数、中位延迟、tokens、成本、护栏事件，看板页面关闭时也照记）、jev_guard_status（护栏计数，另以 registrations 暴露任何分面注册失败；未启用时如实报 disabled）与 jev_verify（对线上 API 以 6 路并发运行冻结的 27 题带标签基准：96.3%，26/27，2026-10-04 实测中位 282-484 ms、p95 1468 ms、墙钟 4.0-5.0 s，串行需 10.1 s）。每个工具都有对话内结构化视图（答案、置信度、延迟、成本、护栏计数、实测报告、排名表、额度进度条）。插件会注册真实的代理 system prompt 段（0.7.4 起，这才让 harness 自己主动调用 Jev），并提供覆盖全部选项的「设置 → 插件」卡片（凭据、工具开关、整组自动护栏、看板、引导段、使用额度）。自动护栏（0.7.5）在 Jev 兜底之上分两层确定性规则：7 条硬规则拦截灾难性操作（对文件系统根、家目录、盘根或目录树的递归删除，磁盘格式化，数据库破坏语句，强制推送的 git 历史，凭据外泄），但只在可执行位置命中，因此在正文里引用或描述危险命令不会被拦；硬模式出现在其他位置、以及 3 条软规则（主机重启或关机、未强推的历史重写、恒真 DELETE/UPDATE）都交给 Jev 按 denyThreshold 判定。两层都会上报 onSafetyDeny、循环检测会以工具名上报 onLoopAdvisory 到账本；Jev 失败即放行（fail-open）。诚实设计：TypeSafe 没有余额或额度接口（GET /v1/usage、/v1/quota、/v1/account、/v1/balance、/v1/credits、/v1/limits、/v1/billing 全部 404，只有 /v1/models 有响应），因此额度面板只报本机实测用量、对照你配置的本地预算，并明确写明这一点——绝不编造供应商侧余额。quota.enforce 可把这些预算变成调用前硬停（默认只展示不拦截）；历史默认只存内存，开启 quota.persist 后最多保留 quota.historyDays 天到 $DSH_HOME/jev-usage.json。无 Mock 回退：未配置 Key 时给出带配置说明的明确报错。"
