url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) for DeepSeek Harness, end to end: jev_decision (choice/score/noul, one parallel call, typed answers + confidence), jev_choose (rank 2-10 candidate approaches with calibrated fit/risk scores, parallel per-option calls, recommended pick), jev_overview and jev_guard_status for auditing usage and the auto-guard, structured in-chat views for all five tools (answers, confidence bars, latency, cost, guard counters, benchmark report), a Settings > Plugins card covering every option (credentials, tool toggles, the whole auto-guard block, dashboard), an auto-guard (deterministic rules + Jev risk/loop checks), a local /jev dashboard, and jev_verify, which runs a 27-question labeled benchmark against the live API (96.3%, 26/27, measured 2026-09-21 and re-measured 2026-09-28; median 283-484 ms on jev-latest). Honest by design: real API only, no mock fallback."
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型）：jev_decision（choice/score/noul 一次并行调用，类型化答案 + 置信度）、jev_choose（对 2–10 个候选方案并行打分：契合度 + 风险，综合排序并给出推荐）、jev_overview 与 jev_guard_status 审计用量与自动护栏、五个工具的对话内结构化视图（答案、置信度条、延迟、成本、护栏计数、实测报告）、覆盖全部选项的「设置 → 插件」卡片（凭据、工具开关、整组自动护栏、看板）、自动护栏（确定性规则 + Jev 风险/循环检测）、本地 /jev 仪表盘，以及 jev_verify——对线上 API 运行 27 题带标签基准（96.3%，26/27，2026-09-21 实测、2026-09-28 复测；jev-latest 中位 283–484 ms）。诚实设计：只走真实 API，无 Mock 回退。"