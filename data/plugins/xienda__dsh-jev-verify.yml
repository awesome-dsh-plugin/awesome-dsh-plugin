url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) wired end to end into DeepSeek Harness, with five tools: jev_decision (1-25 parallel atomic verdicts in one call, question types noul/choice/score, typed answers plus calibrated confidence, ~70-500 ms, never prose), jev_choose (rank 2-10 candidate approaches by scoring each option in parallel - fit 0-3 and risk - into an explicit composite with a recommended pick and no explanation), jev_overview (usage ledger: calls, median latency, tokens, cost, guard events), jev_guard_status (auto-guard counters, honest "disabled" when off) and jev_verify (27-question labeled benchmark run against the live API: 96.3%, 26/27, measured 2026-09-21 and re-measured 2026-09-28, median 283-484 ms on jev-latest). Each tool renders a structured in-chat view (answers, confidence, latency, cost, guard counters, benchmark report, ranking table). The plugin also registers a real agent system-prompt section (v0.7.4) so the harness calls Jev on its own, plus a Settings > Plugins card covering every option (credentials, tool toggles, the whole auto-guard block, dashboard, guidance), an auto-guard that runs deterministic rules first and only then asks Jev (risk + loop checks, fail-open, per-session budget) and a local /jev dashboard. Honest by design: live API only, no mock fallback, explicit error when no key is configured."
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型），共五个工具：jev_decision（一次并行完成 1–25 个原子判定，问题类型 noul/choice/score，返回类型化答案与校准置信度，实测 ~70–500 ms，只出判定不写文本）、jev_choose（对 2–10 个候选方案并行逐项打分——契合度 0–3 与风险——合成综合分并给出推荐，只给分不解释）、jev_overview（用量账本：调用次数、中位延迟、tokens、成本、护栏事件）、jev_guard_status（护栏计数，未启用时如实报 disabled）、jev_verify（对线上 API 运行 27 题带标签基准：96.3%，26/27，2026-09-21 实测、2026-09-28 复测，jev-latest 中位 283–484 ms）。每个工具都有对话内结构化视图（答案、置信度、延迟、成本、护栏计数、实测报告、排名表）。插件还会注册真实的代理 system prompt 段（0.7.4 起，这才让 harness 自己主动调用 Jev），并提供覆盖全部选项的「设置 → 插件」卡片（凭据、工具开关、整组自动护栏、看板、引导段）、自动护栏（先走确定性规则、再问 Jev 做风险与循环检测，失败即放行，带每会话预算）以及本地 /jev 仪表盘。诚实设计：只走真实 API、无 Mock 回退、未配置 Key 时明确报错。"
