category: ui
tarball: https://github.com/OrderG-X/dsh-video-preview/releases/latest/download/dsh-video-preview.tgz
description:
  en: "Plays local video and audio inside the conversation. Media files the model writes during a turn - screen recordings, transcodes, voiceovers - get a player under its final reply automatically when their paths appear in its commands, the command output or the reply; the play_video tool plays any other file. Video shows as compact cards with a hover preview, audio as a slim seek bar, streamed over HTTP Range so long files seek instead of loading into memory. Also registers a sidebar media preview renderer, since the built-in previewer treats mp4 as unviewable. The look_video tool lets the model see a video itself: a hidden local Chrome or Edge grabs frames into a time-labelled contact sheet (or big frames at given times, or a short range frame by frame), checks the audio (silence, too quiet, clipping, one channel only) and the picture (black or frozen frames), and reads MP4 / MOV headers for phone compatibility (codec, HDR, faststart and more), with ffmpeg fixes."
  zh: "在对话流里直接播放本地视频和音频。模型这一轮写出的媒体文件（录屏、转码、配音），只要路径出现在它跑的命令、命令输出或回复里，回合收尾时播放器就自动出现在回复正下方，不用调工具；别的文件用 play_video 工具播放。视频是带悬停预览的小卡片，音频是可拖进度的细条，走 HTTP Range 流式传输，长视频能拖进度条、不会整个读进内存。同时注册了侧边栏媒体预览渲染器——内置预览器把 mp4 当作不可预览。look_video 工具让模型自己看视频：在本机一个看不见的 Chrome / Edge 里按时间截帧，拼成一张每格标时间的图交给模型（也能看某几刻的大图、逐帧看一小段），顺便量声音（没声、太小、爆音、只有一边声道）、找黑屏和卡住的画面，并读 mp4 / mov 文件头查手机上能不能放（编码、HDR、文件头位置等），附 ffmpeg 改法。"
