name: xiaoyuyu6420/dsh-backup
category: dev
description:
  en: 'One-command backup & restore of DSH user data: /backup commands, a backup_dsh tool and a visual Settings panel — destination, retention and excludes edit live and apply without a restart; sha256 verification with hardened restore (path-traversal and symlink rejection), scheduled auto-backup that survives restarts, rotation with an automatic retention default, an archive download route and GitHub sync to a private repo. Credentials are redacted by default — .credentials.yaml and .env stay in a local vault rather than the archive, and a cross-machine restore lists what to re-enter. macOS/Linux/Windows.'
  zh: '一键备份与恢复 DSH 用户数据：/backup 命令族、backup_dsh 工具与可视化设置面板——备份目标、保留份数与排除规则即改即生效、免重启；sha256 校验与加固恢复（拒绝路径穿越/软链），定时自动备份（重启续跑）、带自动默认值的轮换、归档下载路由、GitHub 私有仓库同步。默认对凭据脱敏——.credentials.yaml 与 .env 留在本地保险库而不进归档，跨机恢复时会列出需要重新填写的项。macOS/Linux/Windows。'
