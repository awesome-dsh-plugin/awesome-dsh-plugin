url: https://github.com/xiaoyuyu6420/dsh-backup
name: xiaoyuyu6420/dsh-backup
category: dev
description:
  en: 'One-command backup & restore of DSH user data: /backup commands and a visual Settings panel — destination, retention and excludes edit live and apply without a restart. sha256 verification with hardened restore (path-traversal and symlink rejection) that auto-rolls-back on failure and reports a result receipt; scheduled auto-backup that survives restarts; daily/weekly tiered retention; /backup doctor checks and repairs session logs from a known-good backup; smart backup takes pre-upgrade snapshots on host version changes and quarantines corrupt session logs before rotation can destroy good copies; out-of-process rescue channel (zero-dependency rescue web UI dropped into the backup dir, works even when the host won''t boot); archive download route and GitHub sync for cross-machine moves. Credentials are redacted by default — .credentials.yaml and .env stay in a local vault rather than the archive, and a cross-machine restore lists what to re-enter. macOS/Linux/Windows.'
  zh: '一键备份与恢复 DSH 用户数据：/backup 命令族与可视化设置面板——备份目标、保留份数与排除规则即改即生效、免重启。sha256 校验与加固恢复（拒绝路径穿越/软链），失败自动回滚并回执结果；定时自动备份（重启续跑）；每日/每周分级保留；/backup doctor 从已知良好备份体检并修复会话日志；智能备份在宿主版本变化时自动快照，轮换销毁前先隔离损坏会话日志；进程外救援通道（备份目录内置零依赖救援网页，宿主起不来也能用）；归档下载路由与 GitHub 同步实现跨机迁移。默认对凭据脱敏——.credentials.yaml 与 .env 留在本地保险库而不进归档，跨机恢复时会列出需要重新填写的项。macOS/Linux/Windows。'
