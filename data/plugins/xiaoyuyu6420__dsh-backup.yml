url: https://github.com/xiaoyuyu6420/dsh-backup
name: xiaoyuyu6420/dsh-backup
category: dev
description:
  en: 'One-command backup & restore of DSH user data with a visual Settings panel: scheduled auto-backup, sha256 verification, hardened restore with auto-rollback, typed sub-backups (--types), credential redaction into a local vault, GitHub sync for cross-machine moves, and an out-of-process rescue channel for when the host won''t boot. /backup doctor checks and repairs corrupt session logs from a known-good backup; migrate-check predicts which sessions a host upgrade would break (frozen event-list rules, filename mismatch, legacy credentials); the credential sentinel preserves pre-migration copies before the host rewrites them; smart backup snapshots before host upgrades and quarantines corrupt logs before rotation; /backup check-update and /backup update report and install new releases (snapshotting first), and it spans DSH 0.1.1-rc.2 through 0.2.0-rc.1, including 0.2.0''s install-time peer gate. macOS/Linux/Windows.'
  zh: '一键备份与恢复 DSH 用户数据，附可视化设置面板：定时自动备份、sha256 校验、失败自动回滚的加固恢复、分类型子集备份（--types）、凭据脱敏进本机 vault、GitHub 同步跨机迁移、宿主起不来时的进程外救援通道。/backup doctor 从已知良好备份体检并定点修复损坏会话日志；migrate-check 迁移预检在升级前预测哪些会话打不开（冻结清单、文件名代际等）；凭据哨兵在宿主改写前自动存底；智能备份在宿主升级前快照、损坏日志先隔离再轮换；/backup check-update 与 /backup update 感知并一键更新（先留快照）；覆盖 DSH 0.1.1-rc.2–0.2.0-rc.1，含 0.2.0 起的安装期 peer 闸门。macOS/Linux/Windows。'
