url: https://github.com/drscrewdriver/dsh-cookie-cleaner
name: drscrewdriver/dsh-cookie-cleaner
category: tools
description:
  en: 'Reports leftover `dsh-auth-*` login cookies in the desktop client cookie database (Chromium SQLite); cleanup is explicit and offline, keeps a `.bak` copy, and `--expired-only` narrows the scope, while the startup broadcast stays read-only. Since 0.2.0 it also checks whether the profile `cordis.patch.yml` override rows for `webserver`/`connection` actually take effect (rules P1-P12: shallow top-level assignment replacing the whole `config` block, rows whose `name` mismatches being skipped silently, home-layer shadowing, a literal `port` that outranks `--port`), fixes the cookie-lifetime row through the host configEditor with a per-profile snapshot so one click reverts it, and can rewrite `port` as a `!!js` expression so the launch flag keeps priority. `patch check|plan` runs read-only from the CLI with the client closed. Interface, docs and market copy in 9 languages. npm: `dsh-cookie-cleaner`.'
  zh: '报告桌面客户端 cookie 库（Chromium SQLite）里残留的 `dsh-auth-*` 登录凭据；清理为显式且离线，保留 `.bak` 副本，`--expired-only` 可收窄范围，启动播报面恒只读。0.2.0 起还会检查 profile 的 `cordis.patch.yml` 覆盖行是否真的生效（判定规则 P1-P12：顶层键浅赋值整块替换 `config`、`name` 不匹配的行被静默跳过、home 层影子、`port` 写成字面量会压过 `--port`），并经由宿主官方 configEditor 修复 cookie 寿命行（按 profile 留快照，点一次即可回滚），也可把 `port` 改写成 `!!js` 表达式让启动参数继续优先。客户端关着时可用只读 CLI（`patch check|plan`）。界面、文档与市场文案覆盖 9 语。npm 包名：`dsh-cookie-cleaner`。'
