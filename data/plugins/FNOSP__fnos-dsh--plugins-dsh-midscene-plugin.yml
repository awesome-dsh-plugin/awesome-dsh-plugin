url: https://github.com/FNOSP/fnos-dsh/tree/main/plugins/dsh-midscene-plugin
name: FNOSP/fnos-dsh#dsh-midscene-plugin
category: tools
description:
  en: 'Runs Midscene on the models already configured in DeepSeek Harness instead of separate third-party API keys: hosts an OpenAI-compatible bridge on 127.0.0.1 (default port 8787, automatically skipping occupied ports) that proxies chat completions, streaming and non-streaming, to the DSH host model layer, so DeepSeek official routing, CodeBuddy, Codex and custom OpenAI/Anthropic endpoints all become available to Midscene agents while credentials stay inside the provider plugins and the bridge never touches them. A `/v1/midscene-env` endpoint generates the four MIDSCENE_MODEL_* environment lines with the model family inferred, and seven built-in skills — browser, desktop, Android, iOS and HarmonyOS automation plus a Vitest E2E skill and a Midscene knowledge reference — appear in the session skill catalog without `npx skills add`. Install from npm with `dsh plugin --profile web add @tnnevol/dsh-midscene`.'
  zh: '让 Midscene 直接用 DeepSeek Harness 里已配置的模型，不再需要第三方模型 API Key：在 127.0.0.1 托管一个 OpenAI 兼容桥接服务（默认端口 8787，被占用时自动跳号），把流式与非流式的对话补全代理到 DSH 宿主模型层，DeepSeek 官方路由、CodeBuddy、Codex 与自定义 OpenAI/Anthropic 端点对 Midscene 全部可用；凭据留在各提供方插件内，桥不接触。`/v1/midscene-env` 端点直接生成四行 MIDSCENE_MODEL_* 环境变量并自动推断模型家族；浏览器、桌面、Android、iOS、鸿蒙自动化加 Vitest E2E 与 Midscene 知识参考共 7 个内置技能随装随用，无需 `npx skills add`。npm 安装：`dsh plugin --profile web add @tnnevol/dsh-midscene`。'
