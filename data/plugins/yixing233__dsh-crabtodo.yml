name: yixing233/dsh-crabtodo
category: workflow
description:
  en: 'Persistent todo manager for DeepSeek Harness: six model-facing tools (add, list, update, done, remove, clear) over a JSON store under the DSH home, plus a web sidebar page with a bottom-anchored composer, status tabs, project/global scoping resolved from the session workspace, and one-click task references into the composer.'
  zh: 'DeepSeek Harness 的持久化待办管理：六个模型工具（增、列、改、完成、删、清）读写 DSH 主目录下的 JSON 存储，Web 侧边栏提供底部输入卡片、状态标签页、按会话工作区解析的项目/全局范围，以及一键把任务引用进输入框。'