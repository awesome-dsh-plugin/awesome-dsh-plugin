name: mumu1001ai-jpg/dsh-dingpan
category: ui
description:
  en: 'A watchlist panel for A-share, Hong Kong, US, Korean and FTSE China A50 quotes, with daily/weekly/monthly candlestick charts that page and zoom, a global-markets board, sector boards, DRAM/NAND spot prices, and a draggable Windows taskbar price pill. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '盯盘面板：A股/港股/美股/韩股/富时中国A50 实时行情，可翻页缩放的日周月K线，全球市场、板块与存储（DRAM/NAND）价格走势，以及把自选股价格钉在 Windows 任务栏上的可拖动胶囊。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
