url: https://github.com/loyalchiiina/dsh-lobsterai-daddy
name: loyalchiiina/dsh-lobsterai-daddy
category: ui
description:
  en: 'Bridges LobsterAI (Youdao Lobster) into DSH: its free daily check-in credits become usable inside DeepSeek Harness, so conversations, workflows and skill packs run on those credits. Check-in, credit balance, account switching and the current account readout are built into the plugin and need no separate client; signing another account in without logging out and syncing the gateway into DSH still use the LobsterDaddy console. Adapts DSH kernel 0.2.2-rc.1.'
  zh: '把 LobsterAI（有道龙虾）桥接进 DSH：免费签到积分直接接进 DSH 对话，用这些额度跑对话、工作流与技能包。签到、额度、切号与当前账号显示由插件内置完成，不需要常驻客户端；只有「＋ 免退出登录新账号」与「同步网关到 DSH」仍需 LobsterDaddy 控制台。适配 DSH 内核 0.2.2-rc.1。'
