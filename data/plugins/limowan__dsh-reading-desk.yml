description:
  en: 'A WeRead reading desk: monthly book plan and calendar, FSRS-scheduled highlight review, notes with AI summaries, a monthly reading exhibition and reading statistics. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '微信读书阅读台：月度书单与日历、按 FSRS 排期的划线回顾、带 AI 摘要的笔记、月度阅读展与阅读统计。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
