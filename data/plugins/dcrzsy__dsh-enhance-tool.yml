name: dcrzsy/dsh-enhance-tool
category: ui
description:
  en: 'All-in-one UI enhancement layer for DeepSeek Harness web: prompt library with quick-insert and management, two-step AI polish, predicted-reply dock with click-to-send, MCP tool management, scheduled automation, smart session titles, adjustable chat width, full-width AI messages without gray background, auto-collapse for long user messages with smooth expand/collapse animations, and scene-specific entrance animations across all plugin surfaces.'
  zh: 'DeepSeek Harness Web 一站式界面增强：提示词库（快选+管理）、两步 AI 润色、预测回复栏（点击直接发送）、MCP 工具管理、定时自动化、智能会话标题、对话宽度可调、AI 回复占满无灰底、超长用户消息自动折叠（带平滑展开/收起动效），以及各面板的场景化入场动效。'
