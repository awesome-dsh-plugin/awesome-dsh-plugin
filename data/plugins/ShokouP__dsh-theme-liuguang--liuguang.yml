description:
  en: 'Two switchable design languages for the DSH GUI — liquid glass with inner-lit surfaces and pointer specular, and Soviet constructivism with cream/ink/red poster geometry — plus a personalization panel, drop-in CSS skin packs, and a seven-expression whale-girl pet.'
  zh: '给 DSH 界面的两套可切换设计语言：内部发光的液态玻璃，与米色/血红/墨黑的苏联构成主义海报；附带个性化面板、投放式 CSS 皮肤包与 7 种表情的鲸鱼娘桌宠。'
