description:
  en: 'One place for the window background, the intro clip and the screensaver, with a shared material library. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '把窗口背景、开机片头和屏保收在一处管，共用一份素材库。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
