description:
  en: 'Intercept auto context compaction before it runs — four tiers (ask first / delay / forbid) with an occupancy gauge; manual /compact untouched. Built for local small-window models. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在自动压缩执行前拦下——四档（先问/推迟/禁止）+ 会话内占用仪表；手动 /compact 不受影响。为本地小窗口模型准备。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
