url: https://github.com/xingyingyuzhui/dsh-claw-delegate
name: xingyingyuzhui/dsh-claw-delegate
category: workflow
description:
  en: Delegation broker for Claw agents, with depth caps, role attenuation, write-child git worktrees, and handoff accept or reject. Hard deps (install together or single install fails): dsh-claw-permissions, dsh-claw-observability, dsh-claw-policy.
  zh: Claw 委派：深度上限、角色衰减、写入型 child 的 Git worktree，以及 handoff 接受/拒绝。硬依赖（需同装，否则单装会崩）：dsh-claw-permissions、dsh-claw-observability、dsh-claw-policy。
