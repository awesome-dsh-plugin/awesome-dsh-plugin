url: https://github.com/Existence001100/dsh-budget-guard-plugin
name: Existence001100/dsh-budget-guard-plugin
category: security
description:
  en: Add a budget line to every DSH task: support real-time accounting, automatic interception, and estimated degradation. Support viewing, modifying, or adding third-party models and model unit prices on the settings page UI and in the workbench.
  zh: 给 DSH 的每一次任务加一条预算线：支持实时核算、自动拦截、预估降级。支持在设置页 UI 和工作台中查看、修改或新增来自第三方的模型及模型单价。
