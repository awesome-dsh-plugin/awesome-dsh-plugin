description:
  en: A draggable mascot invites you to play Xiangqi (Chinese chess) while the AI thinks, with a built-in engine, move-record export, and optional multi-model commentary.
  zh: 卡通小宠物邀请你在 AI 思考间隙下中国象棋：内置引擎、走子记谱导出、可选多模型局势点评。
  ja: ドラッグできるマスコットが、AI の思考中に象棋（中国将棋）へ誘います。エンジンを内蔵し、棋譜の書き出しと任意の複数モデルによる解説に対応します。
