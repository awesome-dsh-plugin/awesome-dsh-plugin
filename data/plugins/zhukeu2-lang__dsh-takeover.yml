url: https://github.com/zhukeu2-lang/dsh-takeover
name: zhukeu2-lang/dsh-takeover
category: session
description:
  en: 'Adds a "Handoff session" item to the session context menu: pick an older session, choose how the new one should read it, and a fresh session is created with the handoff instruction pre-filled in its composer while the old session stays untouched. Three read modes — the AI decides what to read, a six-part summary written into a .md file, or just the last 20 turns. The second tab turns those .md files into a cleanup list grouped by workspace, deletable once the receiving session has run 3 turns or the handoff is 7 days old. All file, record and turn-count operations run in the host process; the browser half only renders and requests.'
  zh: '在会话右键菜单加「移交会话」：选一个老会话、挑新会话用哪种模式怎么读，新开一个上下文干净的会话，交接指令已预填进输入框；老会话全程不动。三种读取方式——AI 自行判断读多少、让 AI 先写成六段摘要落到 .md、或只读最近 20 轮。第二个标签把那批 .md 变成按工作区分组的清理清单，接手会话跑满 3 轮或移交满 7 天即可逐条删除。删文件、写记录、数轮数全部在主进程完成，界面只负责画和发请求。'
