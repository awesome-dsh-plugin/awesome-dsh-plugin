description:
  en: 'Durable task-decomposition plans for DeepSeek Harness built on a single five-step work method (task analysis → resources/tools/approach with basis → preparation with evidence → verification against every acceptance criterion → retrospective). Department subagents must deliver a structured JSON evidence block to settle: malformed JSON never counts as done, thin evidence is sent back for a bounded retry, and the verify step must record problems, detours and resolutions into a permanent lessons file ranked and injected into later dispatches so the same mistake is not repeated. No DSH version requirement (engines.dsh removed in 3.0.9). Adds a read-only dsh_workplan_lessons tool, a progress panel drawn as a ring, a stacked bar and per-stage steps, and a public ISO/IEC 15408:2026 security self-assessment with zero runtime dependencies.'
  zh: '为 DeepSeek Harness 提供持久化任务分解计划，单框架五步工作法（任务梳理 → 资源/工具/方案与依据 → 准备与就绪证据 → 逐项核验验收 → 复盘沉淀）。部门子 Agent 必须交付结构化 JSON 结果块才能结算：非法 JSON 绝不计完成，证据不足按缺口回喂有界重试，验证阶段必须提交问题、弯路与解决方式的复盘，写入永久教训记忆文件，下次派发时按部门与关键词排序注入，避免重犯。自 3.0.9 起对 DSH 版本不作要求（已取消 engines.dsh 门槛）。新增只读 dsh_workplan_lessons 工具、环形图/四段构成条/逐阶段步进条进度面板，以及按 ISO/IEC 15408:2026 结构编写的公开安全自评估——每条声明都可被读者核对，零运行时依赖。'
