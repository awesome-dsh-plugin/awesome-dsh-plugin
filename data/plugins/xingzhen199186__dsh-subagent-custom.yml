url: https://github.com/xingzhen199186/dsh-subagent-custom
name: xingzhen199186/dsh-subagent-custom
category: model
description:
  en: 'Subagent model control: a Jev classifier labels each turn, and the subagent request itself is rewritten to the provider, model and reasoning effort that the label maps to, at the agent/request hook; a per-session inherit/auto/manual selector, one prompt per role injected ahead of the task, and offline replay of past verdicts.'
  zh: '子代理模型管控：由 Jev 判定本轮任务类别，再把子代理自身的请求改写为该类别对应的 provider、model 与推理强度（在 agent/request 钩子上执行）；会话内可用继承/自动/手动三种方式指定模型，每个角色可带一条先于任务注入的前置提示词，并可离线回放历史判定。'
