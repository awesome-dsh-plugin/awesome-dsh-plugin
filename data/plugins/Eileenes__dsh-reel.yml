url: https://github.com/Eileenes/dsh-reel
name: Eileenes/dsh-reel
category: tools
description:
  en: 'Promo studio panel for DSH plugins: type a plugin name, match it to a case file and render a promo film and poster locally. The bundled Remotion template pipeline works from the npm package; the real-UI (V0.1) pipeline also needs a local Onetake runtime and the repository checkout, otherwise the panel reports the environment as not ready. The DSH tools reel_scan, reel_plan and reel_render are still scaffolding. Needs Node.js 22+ and Chrome or Chromium.'
  zh: 'DSH 插件宣传台面板：输入插件名称，匹配案例文件，在本机渲染宣传片与海报。npm 包内置的 Remotion 模板管线可直接用；真机界面（V0.1）管线还需要本机 Onetake 运行时和仓库源码，否则面板提示环境未就绪。DSH 工具 reel_scan、reel_plan、reel_render 仍是脚手架。需要 Node.js 22+ 与 Chrome 或 Chromium。'
