name: wb-exec
category: skill
description:
  en: Delegate bounded coding tasks to a headless CLI agent (WorkBuddy by default, or codex, claude, aider or a custom command) and collect a structured result plus the real diff, with a writable-path whitelist and an isolated git worktree.
  zh: 把边界明确的编码任务派给无头 CLI 执行体（默认 WorkBuddy，也可选 codex、claude、aider 或自定义命令），回收结构化结论与真实 diff，并带可写路径白名单与独立 worktree 隔离。
