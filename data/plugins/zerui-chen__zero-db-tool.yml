url: https://github.com/zerui-chen/zero-db-tool
name: zerui-chen/zero-db-tool
category: tools
description:
  en: 'Database workbench for DeepSeek Harness: connection menu with live health and latency, object tree, data/schema/SQL tabs with table indexes, automatic one-shot reconnect, read-only-first sql_* tools where INSERT is allowed, every UPDATE is confirmed and DELETE/DDL are refused, for SQLite, PostgreSQL and MySQL.'
  zh: DeepSeek Harness 数据库工作台：连接菜单显示可用状态与耗时、对象树、数据/结构/SQL 页签、结构页索引；断线自动重连；只读优先的 sql_* 工具，允许 INSERT，UPDATE 每次确认，DELETE/DDL 拒绝；支持 SQLite/PostgreSQL/MySQL。
icon: https://raw.githubusercontent.com/zerui-chen/zero-db-tool/main/assets/icon.png
