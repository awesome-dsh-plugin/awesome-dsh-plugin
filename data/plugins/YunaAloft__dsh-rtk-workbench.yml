url: https://github.com/YunaAloft/dsh-rtk-workbench
name: YunaAloft/dsh-rtk-workbench
category: dev
description:
  en: 'Brings the rtk token-saving setup from Claude Code to DeepSeek Harness: commands rtk can rewrite are rewritten, and builds, tests and logs it cannot reach are compressed; git, cargo, npm and pytest are covered. Compressed output tells the model what was elided and how to recover it; when the sandbox cannot reach the rtk store the original is saved and its path given. Savings show without a command: a pill below the composer, with `/rtk stats` for detail. When a rewrite is unreliable the original command runs as usual: if rtk cannot run, or the returned command would drop arguments, nothing breaks. The rtk binary ships with the package, so mainstream platforms need no separate rtk install, unlike most other rtk plugins.'
  zh: '把 Claude Code 里 rtk 的省 token 机制接进 DSH：能改写的命令交给 rtk 重写，改写够不着的构建、测试、日志也会被压缩；git、cargo、npm、pytest 等常见命令都有覆盖。压缩后会告诉模型省略了什么、怎么找回原文——读不到 rtk 存储时原文另存并给出路径；省了多少不用敲命令，输入框下方的浮标直接显示，`/rtk stats` 看明细。改写不可靠时原命令照常执行：rtk 跑不起来，或命令会丢参数，都不会失败。rtk 二进制随包，主流平台不用像多数其他 rtk 插件那样先自行安装。'
