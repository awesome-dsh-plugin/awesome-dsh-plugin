url: https://github.com/zhangj1164/dsh-mega-plugins/tree/main/packages/github-issue/dsh-github-issue
name: zhangj1164/dsh-mega-plugins#dsh-github-issue
category: dev
description:
  en: "GitHub issue service for DSH: turns a telemetry failure analysis into a uniform issue report, builds a pre-filled new-issue URL that is shortened when it would exceed a configured length budget, rewrites a plain description into a structured issue with the deployment's model, and closes the intake loop by listing the open issues that carry a claim label and handing each one to a fresh session as a one-shot automation task on the host's Schedule service, which delivers the rendered prompt into that session when the task comes due and shows up on the Web Automation tasks page (a host with no Schedule service admits the prompt directly instead), skipping issues an earlier pass already dispatched, leaving the local day uncommitted when every dispatch is refused so the next startup tries again, and repeating the pass on the first start of each local day when autopilot is enabled."
  zh: "面向 DSH 的 GitHub issue 服务：把遥测失败分析整理成统一格式的 issue 报告，构造预填的新建 issue 链接并在超出配置长度时裁剪正文，用部署配置的模型把一段自然语言描述改写为结构化 issue，也打通接单闭环——按认领标签列出可接的 issue，为每个 issue 新建会话并登记成宿主 Schedule 服务上的一次性自动化任务（出现在 Web 自动化任务页，到点把渲染好的提示词送进该会话；宿主没有 Schedule 服务时直接排入提示词），跳过此前已经派发过的 issue，若一轮派发全部被拒则不记下当天以便下次启动重试，开启自动驾驶后在每个本地日的首次启动时自动跑一轮。"
