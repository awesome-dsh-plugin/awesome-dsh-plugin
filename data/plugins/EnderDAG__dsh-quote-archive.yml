url: https://github.com/EnderDAG/dsh-quote-archive
name: EnderDAG/dsh-quote-archive
category: tools
description:
  en: 'Archive, search, and recall group-chat quotes locally, with an agent-callable quote tool and a full AstrBot-style management page (library, statistics, insights, trash, people, collections, and collaboration). Needs Node.js 22.13+; QQ capture and reposting are optional and require a running SnowLuma / OneBot v11 HTTP gateway, whose address and access token the plugin finds automatically in local SnowLuma and qq-bridge config files.'
  zh: '本地收藏、检索与随机回放群聊语录，提供 Agent 可调用的 quote 工具和 AstrBot 风格的整页管理后台（语录库、统计、数据可视化、回收站、人物、专题合集、协作维护）。需要 Node.js 22.13+；QQ 采集与回发为可选功能，需要运行中的 SnowLuma / OneBot v11 HTTP 网关，插件会从本机 SnowLuma 与 qq-bridge 的配置文件里自动查找网关地址和访问令牌。'
