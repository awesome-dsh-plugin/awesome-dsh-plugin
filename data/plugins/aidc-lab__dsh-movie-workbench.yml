name: aidc-lab/dsh-movie-workbench
category: tools
description:
  en: 'DSH Movies workbench : Search for movies and TV series from TMDB, IMDb and Douban on one page and automatically discover BT resources. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DSH 影视工作台：在一个页面里检索 TMDB、IMDb 和 豆瓣 的电影与剧集，自动发现 BT 资源。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/aidc-lab/dsh-movie-workbench/main/assets/icon-180.png
