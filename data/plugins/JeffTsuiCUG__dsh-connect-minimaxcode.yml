name: JeffTsuiCUG/dsh-connect-minimaxcode
category: model
description:
  en: Connects the MiniMax Code models to DSH - reusing the desktop app's sign-in or signing in on its own - with Anthropic-compatible model access, a live model catalog, the daily check-in that grants the free credits, and a credit balance that follows the model you selected.
  zh: 将 MiniMax Code 的模型接入 DSH：复用桌面 App 登录态或用设备码自行登录，提供 Anthropic 兼容接入、动态模型目录、每日签到领取免费额度，以及跟随所选模型显示的积分余额与到期提示。
