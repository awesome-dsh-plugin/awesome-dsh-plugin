url: https://github.com/webkubor/dsh-llm-hub
name: webkubor/dsh-llm-hub
category: model
description:
  en: 'Fills in what the official pi-ai adapter leaves out on the Models page — gateway reachability probing with latency, one-click pull of the gateway model catalog with checkbox write-back, DeepSeek balance plus MiniMax / Zhipu / Moonshot / StepFun quota cards in place, per-provider billing mode (subscription vs pay-as-you-go) auto-detected with a one-click switch and package models auto-prioritised in the dropdown, monthly usage statistics with CSV export, provider health dashboard, external subagent tools surfaced when codex / claude / agy is installed, and a model dropdown that hides dead keys / empty balances / exhausted quotas until you fix them — they come back on its own.'
  zh: '补上官方 pi-ai 适配器在模型页缺的那半：网关可达性与延迟探测、一键拉取模型目录并勾选写回配置、DeepSeek 余额 + MiniMax / 智谱 / Moonshot / StepFun 配额卡就地常驻、每个 provider 的计费模式（套餐 vs 按量）自动识别并一键切换、套餐模型自动置顶 LLM 下拉、本月用量统计 + CSV 导出、Provider 健康看板、装了 codex / claude / agy 即出现子代理工具；模型下拉只列当前真能用的分组 —— key 失效、余额耗尽、配额用尽都会被摘掉，修好后自动恢复。'
