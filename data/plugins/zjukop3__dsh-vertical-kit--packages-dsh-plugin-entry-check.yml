name: 'zjukop3/dsh-vertical-kit#dsh-plugin-entry-check'
category: 'dev'
description:
  en: 'Check an awesome-dsh-plugin catalog entry before you submit it: that the filename matches the monorepo path, that name and url point at the same repository, that #sub equals the last segment of the path, that the category is one of the 23 the catalog accepts, that both description languages exist, that the icon is a real image URL, and that the description does not read like the aggregation bundle rule #7 refuses. Sixteen rules, all taken from the catalog contributing guide, all decidable from the entry file alone — no network, no access to your repository, no model calls. The catalog CI reports that the shape is wrong; this reports the line, before you open the pull request, which is where most of the round trips happen: a filename that does not match the subdirectory, a name pointing at another repository, an English description with no Chinese one. Calibrated on five real entries — four merged into the catalog and one pending review — which must produce zero findings; the first version produced four false positives on them. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '提交到 awesome-dsh-plugin 之前自查一份目录条目：文件名与 monorepo 路径是否对得上、name 与 url 是否指向同一个仓库、#sub 是否等于路径最后一段、分类是否在上游那 23 个取值里、双语描述是否都写了、图标是不是图片地址、描述读起来像不像上游第 7 条不收的聚合包。十六条规则全部取自目录的 contributing 正文，全部只依赖条目文件本身——不联网、不读你的仓库、不调模型。目录 CI 只会说「形状不对」，这个会说哪一行，在你开 PR 之前；而绝大多数来回都发生在这里：文件名与子目录不一致、name 指向另一个仓库、只有英文没有中文。语料是五份真实条目（四份已合并、一份在评审），它们必须零发现——第一版在它们身上报出四种误报。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: 'https://raw.githubusercontent.com/zjukop3/dsh-vertical-kit/main/assets/icon-180.png'
