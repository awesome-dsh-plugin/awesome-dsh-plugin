url: https://github.com/huihui3488/dsh-native-toast
name: huihui3488/dsh-native-toast
category: notify
description:
  en: Windows notification-center toasts when a DeepSeek Harness turn finishes or the agent waits for your choice or approval, attributed to DeepSeek Harness' own notification identity when it is installed; text, logo, sound and per-event switches are configurable.
  zh: 任务完成、需要你选择或批准时，在 Windows 通知中心弹出原生通知；桌面版已安装时使用 DeepSeek Harness 自己的通知身份，文字、徽标、提示音与各类开关都可配置。
icon: https://raw.githubusercontent.com/huihui3488/dsh-native-toast/main/assets/dsh-logo.png