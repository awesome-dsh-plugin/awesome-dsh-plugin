name: happpsee/dsh-desktop-app
category: skill
description:
  en: 'Skill for packaging DeepSeek Harness into a Tauri 2 desktop app (macOS + Windows): dual-platform install playbook, China mirror bootstrap with a subagent timeout sentinel, admin-free Windows toolchain recipe (no VS Build Tools), and three-path acceptance checklists.'
  zh: 把 DeepSeek Harness 封装成 Tauri 2 桌面应用（macOS + Windows）的技能包：双平台安装、国内镜像加速（含 subagent 超时哨兵）、无管理员 Windows 工具链方案、三路径验收清单。
  ja: DeepSeek Harness を Tauri 2 のデスクトップアプリ（macOS ＋ Windows）に仕上げるためのスキル。両プラットフォームのインストール手順、サブエージェントのタイムアウト監視つき中国ミラーの初期設定、管理者権限のいらない Windows のツールチェーン構成（VS Build Tools 不要）、3 通りの受け入れチェックリストを収録します。
