url: https://github.com/plankton12138/dsh-darkSoulGuide
name: plankton12138/dsh-darkSoulGuide
category: tools
description:
  en: "Answers Dark Souls III questions from your own save file: level and stats, current area, bonfires/rings/spells/covenants counted by family, kill state for the 24 bosses, and Steam achievements — exposed as model tools plus a progress pill beside the composer and a 19-area sidebar page with next-step suggestions. The save stays read-only and is parsed locally by a bundled Python script, and the game data ships with the plugin."
  zh: "读你自己的《黑暗之魂3》存档回答问题：等级与属性、当前区域、按家族统计的篝火/戒指/法术/誓约完成度、24 个 Boss 的击杀状态以及 Steam 成就，并以模型工具的形式提供，另配输入框旁的进度药丸和 19 区域的侧栏进度图。存档只读，由附带的 Python 脚本在本地解析，游戏数据随插件分发。"
