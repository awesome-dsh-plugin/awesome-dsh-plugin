url: https://github.com/Doctor-Pan-code/ncm-player5
name: Doctor-Pan-code/ncm-player5
category: fun
description:
  en: 'Derived from WolfGenerals/ncm-player (ncm-player4 1.3.1 lineage, baseline published on the repo''s baseline/ncm-player4-1.3.1 branch); cannot be enabled together with ncm-player2/3/4, because they all register the /ncm/api prefix. Floating NetEase Cloud Music player in the DSH web UI: search, playlists, synced lyrics with translation, a persisted queue, a collapsible mini bar, and a bottom-right note button that can be dragged and pulses with the bass; tracks that come back without a playable URL are skipped automatically.'
  zh: 衍生自 WolfGenerals/ncm-player（ncm-player4 1.3.1 一系，基线源码公开在仓库的 baseline/ncm-player4-1.3.1 分支）；不能与 ncm-player2/3/4 同时启用，它们都占用 /ncm/api 前缀。DSH Web 界面里的网易云音乐浮窗播放器：搜索、歌单、专辑、逐行同步歌词与翻译、队列持久化，可收起为迷你条，右下角音符按钮可拖动并随低频鼓点跳动；无版权或已下架的歌曲会自动跳过并播放下一首。
