name: hai55555/dsh-deepseek-pricing
category: usage
description:
  en: 'Shows the current DeepSeek billing window (peak or off-peak, Beijing time) as a composer badge and in settings, lists DeepSeek''s per-model prices, and estimates the cost of each turn. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在输入框徽标与设置页显示当前 DeepSeek 计费时段（高峰或空闲，北京时间），列出 DeepSeek 各模型价格，并估算每一轮对话的花费。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/hai55555/dsh-deepseek-pricing/main/assets/icon.png
