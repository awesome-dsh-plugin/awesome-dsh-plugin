url: https://github.com/Witherwithwinter/dsh-ccx
name: Witherwithwinter/dsh-ccx
category: theme
description:
  en: Animated background themes for the DSH desktop — 10 scene renderers (milky way, glow horizon, layered mountains, cloud dome, aurora ionosphere, black hole, cloud train, particle image, pixel sculpt, blinking squares), a wallpaper and video library, per-zone UI surface transparency, and a replica of the Appearance settings panel.
  zh: 给 DSH 桌面版换上动态背景——10 种场景渲染器（银河、辉光地平线、层峦、云穹、极光电离层、黑洞、云列车、粒子成像、像素雕塑、闪烁方块）、壁纸与视频素材库、UI 表面分区透明，外加逐像素复刻的 Appearance 设置面板。
