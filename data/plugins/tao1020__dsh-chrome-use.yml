url: https://github.com/tao1020/dsh-chrome-use
name: tao1020/dsh-chrome-use
category: browser
description:
  en: 'Browser control for your own Chrome: reuses your logged-in tabs through a local bridge, so the model can read pages, click, fill inputs, scroll, take screenshots, and inspect console and network logs. Requires Chrome 120+; the extension installs from the Chrome Web Store and pairs with an 8-digit code.'
  zh: '操控你正在用的 Chrome：通过本机桥接复用已登录的标签页，让模型读取页面、点击、填写、滚动、截图，并查看控制台与网络日志。需要 Chrome 120+，扩展从 Chrome 应用商店安装，用 8 位配对码连接。'
