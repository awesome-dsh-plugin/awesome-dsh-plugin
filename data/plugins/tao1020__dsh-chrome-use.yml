url: https://github.com/tao1020/dsh-chrome-use
name: tao1020/dsh-chrome-use
category: browser
description:
  en: 'Drive the Chrome browser you already use: open new tabs or reuse logged-in ones to read pages, click, fill, drag, scroll, screenshot, upload files, export PDFs, inspect console and network logs, and group tabs by task — 38 tools in all. Several harnesses can connect to the same Chrome at once, each working on its own tabs; a tab belongs to one harness at a time, so they never fight over it, and they can message each other. With foreground mode off, operations never bring the window to the front. Requires Chrome 120+; install the extension from the store and pair with an 8-digit code.'
  zh: '操纵你正在用的 Chrome 浏览器：新建标签页或复用已登录的标签页，读取页面、点击、填写、拖拽、滚动、截图、上传文件、导出 PDF、查看控制台与网络日志、按任务分组标签页，共 38 个工具。多个 Harness 可以同时连同一个 Chrome，各自操作不同标签页；同一个标签页只归一个 Harness，不会互相抢，彼此还能留言传话。关闭前台模式后，操作不会把窗口切到前台。需要 Chrome 120 或更新版本；从扩展商店装好扩展，用 8 位配对码连接。'
