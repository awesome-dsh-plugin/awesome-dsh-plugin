url: https://github.com/tao1020/dsh-chrome-use
name: tao1020/dsh-chrome-use
category: browser
description:
  en: 'Drive the Chrome you already use: reuse logged-in tabs to read pages, click, fill, drag, scroll, screenshot, upload files, export PDFs, and inspect console and network logs — 33 tools in all. Several harnesses can connect to the same Chrome, each working on its own tabs without fighting over a page, and they can message each other. Foreground mode can be off so operations never steal window focus. Requires Chrome 120+; install the extension and pair with an 8-digit code.'
  zh: '操纵你正在用的 Chrome：复用已登录的标签页，读取页面、点击、填写、拖拽、滚动、截图、上传文件、导出 PDF，查看控制台与网络日志，共 33 个工具。多个 Harness 可以同时连同一个 Chrome，各自操作不同标签页，同一个标签页只归一个 Harness，不会互相抢；它们之间还能互相留言传话。前台模式可以关闭，关闭后操作不抢窗口焦点。需要 Chrome 120 或更新版本；装扩展后用 8 位配对码连接。'
