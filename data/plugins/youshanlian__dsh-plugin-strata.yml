name: youshanlian/dsh-plugin-strata
tarball: https://github.com/youshanlian/dsh-plugin-strata/releases/latest/download/dsh-plugin-strata.tgz
category: model
description:
  en: 'Integrated control plane for the local strata model stack: manage the strata-hop :8080 model-switching router (status/models/warm/logs), stream live model-switch and load state into the web GUI status chip and the strata_status tool, preload a model engine the moment it is selected, edit run-config and shared chat settings from a GUI tuning panel or strata_params, and ship the dsh provider patch that routes chats to the router with Effort-level mappings. Read-only toward inference: it never sends a prompt and spends no tokens; bring your own running strata plus strata-hop (defaults :8080 hop, :8756 monitor). As shipped, the status server listens on 0.0.0.0:8756 with no authentication and open CORS, and its endpoints can change run-config and restart the engine; set host to 127.0.0.1 in cordis.patch.yml to keep it on this machine. It expects strata-hop as a systemd user unit.'
  zh: '本地 strata 模型栈的一体化控制面：管理 strata-hop :8080 模型切换路由（status/models/warm/logs），把模型切换与加载状态实时送进 Web GUI 状态芯片和 strata_status 工具，选中模型即预热引擎，GUI 调参面板/strata_params 编辑 run-config 与共享聊天设置，并自带把聊天路由到路由器的 dsh provider 补丁（含 Effort 档位映射）。对推理只读：从不发 prompt、不消耗 token；需自备运行中的 strata 与 strata-hop（默认 :8080 路由、:8756 监控）。随包的补丁默认让状态服务监听 0.0.0.0:8756，没有鉴权且 CORS 全开，它的接口能修改 run-config 并重启引擎；想只留在本机，把 cordis.patch.yml 里的 host 改成 127.0.0.1。它按 systemd 用户单元的形式使用 strata-hop。'
