name: ECCVIK/LMTAgent
category: workflow
description:
  en: 'Multi-agent software engineering orchestrator for DeepSeek Harness (dsh-lmtagent v1.0.0, 8 role presets: Captain + CEO, Designer, Eng Manager, Reviewer/CSO, Builder, QA Lead, Release). Features 1:1 session-isolated workspaces, AI wish clarification & file-disjoint sharding, 12 lean lmt_* tools (11.6KB schema), 12 clean engineering skills, experimental speculative 4-Wave DAG dispatch, pre/post-write ShardLock + Git scope rollback, workspace token/cost budget circuit breaker, PG Wire v3 / SQLite WAL fact store, and a full bilingual (en-US / zh-CN) docked web console. Uses independent namespace (lmtagent-*, /lmtagent/api, $DSH_HOME/lmtagent, auto copy migration from $DSH_HOME/redteam) and coexists cleanly with dsh-redteam-mode.'
  zh: 'DeepSeek Harness 多智能体软件研发编排工作台（dsh-lmtagent v1.0.0，内置 Captain 主控与 7 个工程执行角色预设）。支持 1:1 会话专属工作区隔离、AI 需求澄清与无交集分片拆解、12 个精简 lmt_* 工具（Schema 压缩 58%）、12 个纯净工程技能包、实验性推测 4-Wave DAG 流水线调度、ShardLock 写前预检与 Git 一键越界回滚、工作区预算熔断器、PostgreSQL Wire v3 / SQLite WAL 双模事实库及全双语（中文 / EN）常驻 Web 控制台。采用完全独立命名空间（lmtagent-*、/lmtagent/api、$DSH_HOME/lmtagent，首次启动自动无损迁移旧数据），可与 dsh-redteam-mode 无冲突共存。'
