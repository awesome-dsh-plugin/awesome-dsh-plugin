url: https://github.com/ECCVIK/LMTAgent
name: ECCVIK/LMTAgent
category: workflow
description:
  en: 'Multi-agent software engineering orchestrator for DeepSeek Harness (8 role presets: Captain + CEO, Designer, Eng Manager, Reviewer/CSO, Builder, QA Lead, Release). Features 1:1 session-isolated workspaces, AI wish clarification & file-disjoint sharding, 4-Wave DAG concurrent dispatch across 6 default slots (1-12) with autoAdvanceWave, post-write ShardLock scope audit, PostgreSQL Wire v3 + SQLite WAL fact store, 29 skills, and a docked right-panel web console. Storage uses PostgreSQL when REDTEAM_PG_URL/DSH_PG_URL/DATABASE_URL/PGHOST is set, or SQLite under $DSH_HOME/redteam; presets live in $DSH_HOME/.agent-presets/redteam. Fork of Jueze-2019/dsh-redteam-mode (shares package name, mount ids and redteam_* tools, so do not install both together).'
  zh: 'DeepSeek Harness 多智能体软件研发编排工作台（内置 Captain 主控与 CEO、Designer、Eng Manager、Reviewer/CSO、Builder、QA Lead、Release 共 8 个角色预设）。支持 1:1 会话专属工作区隔离、AI 需求澄清与无交集分片拆解、默认 6 并发槽（1-12 可调）的 4-Wave DAG 调度与 Wave 自动接力、写后 ShardLock 越界审计、PostgreSQL Wire v3 与 SQLite WAL 双模事实库、29 个随包技能及右侧常驻 Web 控制台。设置 REDTEAM_PG_URL/DSH_PG_URL/DATABASE_URL/PGHOST 时写入 PostgreSQL，否则落盘 $DSH_HOME/redteam 本地 SQLite；预设写入 $DSH_HOME/.agent-presets/redteam。注：为 Jueze-2019/dsh-redteam-mode 分支，沿用其包名与 redteam_* 工具名，勿与原版同时安装。'
