url: https://github.com/Xiaofei-fei/dsh-prompt-history
name: Xiaofei-fei/dsh-prompt-history
category: ui
description:
  en: 'Bash-like prompt history and terminal-style right-click paste for the DSH web composer: Up/Down arrows recall previously submitted messages and right-click pastes the clipboard directly, sourced from the session''s own message log (zero config, zero extra storage).'
  zh: '为 DSH Web 输入框提供类 Linux shell 的提示词历史与右键粘贴：按 ↑/↓ 召回之前发送过的消息，右键直接粘贴剪贴板内容，历史取自会话自身的消息记录（零配置、零额外存储）。'
