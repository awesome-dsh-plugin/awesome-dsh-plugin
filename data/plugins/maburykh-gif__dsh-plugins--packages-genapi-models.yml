name: maburykh-gif/dsh-plugins#genapi-models
category: model
description:
  en: 'GenAPI routes in the model picker: the OpenAI-compatible chat gateway (https://proxy.gen-api.ru/v1) as five sections — text, architecture, design, images and video; the key is read from GENAPI_API_KEY in the credential store. The image and video sections are catalogs only, because GenAPI generates media through its native task API. A settings card edits shortcodes, creates user-defined sections, and links to the key page (author referral link, disclosed).'
  zh: 在模型选择器中接入 GenAPI（https://proxy.gen-api.ru/v1）OpenAI 兼容对话网关，按文本、架构、设计、图像与视频五个分区展示，密钥从凭据库的 GENAPI_API_KEY 读取；图像与视频分区仅作目录展示（实际生成需走其原生任务 API）。设置卡片支持编辑快捷码、创建自定义分区，并提供密钥页链接（含作者推广链接，已注明）。
