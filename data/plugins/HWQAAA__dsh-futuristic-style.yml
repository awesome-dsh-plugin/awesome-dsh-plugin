description:
  en: 'Cinematic 10-second cold-start animation with the original soundtrack, a 1.2 s dissolve into a looping anime chat background, and a frosted settings panel for DeepSeek Harness. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '为 DeepSeek Harness 提供带原声的 10 秒电影感冷启动动画、1.2 秒叠化转场，以及可循环的动漫聊天背景和毛玻璃设置面板。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
