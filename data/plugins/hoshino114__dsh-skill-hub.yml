url: https://github.com/hoshino114/dsh-skill-hub
name: hoshino114/dsh-skill-hub
category: skill
description:
  en: 'Skill center: browse and manage local Agent Skills, and search, preview and install skills from the ClawHub, ModelScope and QwenPaw marketplaces in one merged view with source and category filters; ships a `skill_hub` tool so the agent can install skills itself. It uses the same package name (dsh-skill-hub) and mount id (skill-hub) as cheshireez/dsh-skill-hub and amd47802574/dsh-skill-hub, so only one of the three can be installed.'
  zh: '技能中心：浏览与管理本地 Agent Skills，并在同一视图中搜索、预览、安装 ClawHub、ModelScope、QwenPaw 三个市场的技能，支持来源与分类筛选；同时提供 skill_hub 工具，让 agent 也能自助安装技能。包名 dsh-skill-hub 和挂载 id skill-hub 与 cheshireez/dsh-skill-hub、amd47802574/dsh-skill-hub 相同，三者只能装一个。'
