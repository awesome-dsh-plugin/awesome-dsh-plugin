url: https://github.com/LiangshouX/dsh-ide-workbench
name: LiangshouX/dsh-ide-workbench
category: ui
description:
  en: 'JetBrains-style IDE workbench in the DSH sidebar: Project file tree, Commit panel, Git history with a swimlane graph, a real PTY terminal and an embedded editor with Markdown preview and Find in Files, plus chat file links and send-to-chat references.'
  zh: 'DSH 侧栏里的 JetBrains 式 IDE 工作台：Project 文件树、Commit 面板、泳道图 Git 历史、真实 PTY 终端与内置编辑器（Markdown 预览、全项目查找），并支持聊天文件链接与发送到聊天框的 @ 引用。'
