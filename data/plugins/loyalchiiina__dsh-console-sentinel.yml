url: https://github.com/loyalchiiina/dsh-console-sentinel
name: loyalchiiina/dsh-console-sentinel
category: tools
description:
  en: 'Windows console and system-window watchdog for DSH. It scans every console window, marks the idle and finished ones, and lists them in a collapsible taskbar panel (collapsed by default, expand by clicking the title bar) in two views — a compact icon grid and per-app grouped cards — then closes selected windows the graceful way (WM_CLOSE, the same as Alt+F4, never a force-kill) after a dry-run preview and a confirm step. Close a single window, every window of one app, or a whole batch; the icon view adds a red × badge to single-close any non-whitelisted window, and a thin 2px progress bar counts each close as i/N. Empty console shells are hidden or truly closed, while the DSH host, Fluent/MPI/ANSYS solver processes, the foreground window and whitelisted programs (added one row at a time by process image name or window-title substring) are never touched, and elevated admin windows go through one UAC prompt. Resource-Manager folder windows can be closed on their own without ever touching the desktop or taskbar. It also lists the DSH sidebar panels of the current mounted session and closes one in one click, and flags MCP service consoles (red badge, no close button) as never-close. Adapts DSH kernel 0.2.2-rc.1.'
  zh: 'Windows 专属的 DSH 控制台与系统窗口哨兵：扫描所有控制台窗口并标出已空闲或已跑完的，在本插件抽屉面板里以紧凑图标网格或按软件分组的详情卡两种视图展示（面板默认折叠，点标题栏展开），先在干跑预览里确认，再用优雅关闭（WM_CLOSE，等同 Alt+F4，绝不强杀）关掉选中的窗口。可只关某个单个窗口、关掉某款软件的全部窗口或整批处理；图标视图每个可关窗口右上角带红色小 × 角标，点一下即单独关闭该窗口；批量关闭时顶部有一条 2px 细进度条并实时显示「正在关闭 i/N」。空的控制台壳窗口可被隐藏或真正关闭，但 DSH 宿主、Fluent/MPI/ANSYS 求解进程、当前前台窗口与白名单程序永不被关闭；管理员窗口只弹一次 UAC 提权即可关闭。资源管理器的文件夹窗口可单独关闭，绝不会误关桌面、任务栏等系统外壳。另有一张「DSH 侧边栏 · 当前面板」卡，可枚举当前挂载会话已在侧边栏打开的面板并一键关闭，MCP 服务控制台会打上红底「勿关」徽标、不渲染关闭按钮，确保永不误关。适配 DSH 内核 0.2.2-rc.1。'