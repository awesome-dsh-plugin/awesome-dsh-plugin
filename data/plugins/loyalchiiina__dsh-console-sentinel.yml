url: https://github.com/loyalchiiina/dsh-console-sentinel
name: loyalchiiina/dsh-console-sentinel
category: tools
description:
  en: 'A Windows-only DSH plugin that cleans up the taskbar in one click and closes windows the graceful way, sending WM_CLOSE (exactly what Alt+F4 sends) so applications can save and exit. Cleanup is preview-first, listing every window that would be closed before anything happens, and the execute action stays disabled until you have previewed. Windows are shown two ways, a compact icon grid where one click closes that single window and a per-app detail view with full titles plus a close this whole app action and a per-window close button, so you can close one window, every window of one application, or everything at once. Elevated administrator windows are supported too, through a single UAC prompt that sends the same graceful close and reports the real result instead of pretending success. Leftover empty console shells, meaning consoles whose interpreter has no business child process left besides conhost, can be hidden losslessly or genuinely closed, and that action is restricted to bare cmd, powershell, pwsh and python prompts. Hard guards keep the DSH host and its whole process tree, Fluent, MPI, ANSYS and solver processes, the foreground window and the plugin itself out of reach, and a persistent exemption whitelist of process names and title keywords is stored in ~/.dsh/console-sentinel/whitelist.json and editable from the Console Sentinel page under Settings, which also shows live window status.'
  zh: '仅支持 Windows 的 DSH 插件，一键清理任务栏窗口，并且一律以优雅方式关闭，发送 WM_CLOSE（与 Alt+F4 完全相同），让程序有机会保存后自行退出。清理坚持预演优先，先列出即将关闭的每一个窗口，未预演前执行按钮保持禁用。窗口提供图标网格与详细两种视图，图标网格里单击即可关闭单个窗口，详细视图按软件分组显示完整标题，并提供「关掉该软件」与逐窗口关闭按钮，因此可以只关一个窗口、只关某个软件的全部窗口，或一次全部清理。管理员权限窗口同样支持，只需一次 UAC 提权，由提权助手发送同样的优雅关闭并回传真实结果，不会把没关掉说成关掉了。空壳控制台——解释器进程除 conhost 外已无任何业务子进程的窗口——可以无损隐藏（进程继续运行）或真正关闭，且只针对裸 cmd、powershell、pwsh、python 提示符。硬保护覆盖 DSH 宿主及其整条进程树、Fluent、MPI、ANSYS 与 solver 进程、当前前台窗口以及插件自身，另有持久化豁免白名单（进程名与标题关键字，落盘 ~/.dsh/console-sentinel/whitelist.json），可在设置页「控制台哨兵」中编辑，该页同时显示实时窗口状态。'
