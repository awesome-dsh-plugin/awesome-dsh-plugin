url: https://github.com/loyalchiiina/dsh-console-sentinel
name: loyalchiiina/dsh-console-sentinel
category: tools
description:
  en: 'Monitors Windows console windows and hides or closes empty ones — consoles whose interpreter process has no business child process left besides conhost or openconsole and stays idle at about zero CPU. Recognizes both classic console windows and Windows Terminal CASCADIA tabs that only host a bare cmd, powershell, pwsh or python prompt. Hard-protects Fluent, MPI and solver processes, the DSH host, Explorer and the foreground window, so running solvers are never touched. Also provides a taskbar window cleanup action named close other windows, plus a persistent exemption whitelist of process names and title keywords stored in ~/.dsh/console-sentinel/whitelist.json. A settings panel under Settings then Console Sentinel shows live window status, one click hide of empty consoles, a taskbar cleanup preview and run button, and whitelist editing. Windows only.'
  zh: '监控 Windows 控制台窗口，自动隐藏或关闭「空壳」控制台——解释器进程除 conhost / openconsole 外没有任何业务子进程、且长期 CPU 接近 0 的窗口。同时识别传统控制台与 Windows Terminal（CASCADIA）中只挂着裸 cmd / powershell / pwsh / python 提示符的标签页。对 Fluent、MPI、求解器进程、DSH 宿主、资源管理器与前台窗口做硬保护，绝不误伤正在计算的控制台。另提供「一键关闭其他窗口」的任务栏清理动作，以及持久化豁免白名单（进程名 + 标题关键字，落盘 ~/.dsh/console-sentinel/whitelist.json）。设置页「控制台哨兵」可查看实时窗口状态、一键隐藏空壳、预演并执行任务栏清理、编辑白名单。仅支持 Windows。'
