url: https://github.com/znlgis/dsh-video-studio-skill
name: znlgis/dsh-video-studio-skill
category: skill
description:
  en: 'Registers the video-studio skill in the DSH skill catalog. It builds a Chinese-narrated video from a script: edge-tts synthesizes the narration, the timeline is derived from each line''s measured audio duration rather than estimated from text length, Pillow renders every frame deterministically and pipes the raw frames to ffmpeg as rawvideo, burned-in subtitles and SRT/ASS export come from that same timeline, physical-model sound effects and a generated score are mixed sample by sample with numpy, and QA runs in four layers: container, signal, temporal and page level (the page layer only when the browser engine is used). An optional Playwright-driven browser engine renders the whole film as Canvas2D instead, sending PNG frames through image2pipe. Needs network access for the narration, ffmpeg on PATH and Python with numpy, Pillow and edge-tts; the browser engine also needs Playwright with a local Edge/Chromium.'
  zh: '把 video-studio 技能注册进 DSH 技能目录。它按剧本生成中文旁白视频：edge-tts 合成旁白，时间轴由每条音频的实测时长反推而非按字数估算，Pillow 逐帧确定性渲染并把原始帧以 rawvideo 管道交给 ffmpeg，烧录字幕与 SRT/ASS 外挂字幕由同一条时间轴生成，物理建模音效与程序化配乐用 numpy 采样级混音，质检分容器、信号、时间、页面四层（页面层只在走浏览器引擎时才有）。整片可改用可选的 Playwright 无头浏览器引擎渲染 Canvas2D 画面，帧以 PNG 经 image2pipe 送入编码器。需要联网合成旁白，PATH 上有 ffmpeg，以及装了 numpy、Pillow、edge-tts 的 Python；浏览器引擎还需要 Playwright 与本机 Edge/Chromium。'
