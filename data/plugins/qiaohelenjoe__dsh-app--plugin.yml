name: qiaohelenjoe/dsh-app#plugin
category: remote
icon: https://raw.githubusercontent.com/qiaohelenjoe/dsh-app/main/plugin/assets/icon-256.png
description:
  en: 'Use DeepSeek Harness on a computer from your phone, through a relay server you deploy. The DSH desktop plugin registers this computer as a device and keeps an outbound WebSocket tunnel to the relay; the Android app (Flutter + WebView) logs in with the same account, picks the computer from the device list and opens its DSH web UI over HTTPS. Nothing on this computer needs an inbound port or port forwarding. The relay (server/ in this repository, Fastify + PostgreSQL, Docker-deployable) handles accounts, devices, tunnel tickets and the /t/<deviceId>/* reverse proxy. The plugin also shows a PC-side panel with login state, device quota, device list and the latest app download QR code. An injected adapter layer reflows the existing web UI for phones — drawer sidebar, bottom-docked composer, larger touch targets — and switches dynamically when a foldable folds or unfolds or the window is resized (below 900px wide it goes mobile; with more room, e.g. a tablet or an opened foldable, it keeps the desktop layout).'
  zh: '用手机远程使用电脑上的 DeepSeek Harness，走一台自建中继服务器。DSH 桌面插件把本机注册成设备，并保持一条出站 WebSocket 隧道连到中继；安卓 App（Flutter + WebView）用同一账号登录，在设备列表里选中这台电脑，就能通过 HTTPS 打开它的 DSH Web UI。本机不需要公网端口或端口映射。中继（本仓库 server/，Fastify + PostgreSQL，可用 Docker 部署）负责账号、设备、隧道票据与 /t/<deviceId>/* 反向代理。插件另提供 PC 端面板（登录态、设备配额、设备列表、最新 App 下载二维码）。注入式适配层让现有 Web UI 在手机上可用：抽屉侧栏、吸底输入、放大触控尺寸，并在折叠屏展开/合上或窗口尺寸变化时动态切换——宽度小于 900px 走移动布局，空间充足（平板或展开的折叠屏）则保持桌面布局。'
