name: qiaohelenjoe/dsh-app#plugin
category: remote
icon: https://raw.githubusercontent.com/qiaohelenjoe/dsh-app/main/plugin/assets/icon-256.png
description:
  en: 'The mobile client for DeepSeek Harness: use the DSH running on your computer from your phone. The Android app signs in with the same account, picks this computer from the device list and opens its DeepSeek Harness UI on mobile. The desktop plugin handles registration and the connection, and nothing on the computer needs an inbound port. The UI adapts on its own: on a phone it becomes a touch-friendly layout, and returns to the desktop layout when a foldable opens or the window gets bigger. A PC-side panel shows login state, device quota, device list and the app download QR code.'
  zh: 'DeepSeek Harness 移动端：用手机使用你电脑上的 DSH。安卓 App 用同一账号登录，在设备列表里选中这台电脑，就能在手机上打开并进入它的 DeepSeek Harness 界面。桌面端插件负责注册与连接，本机不用开公网端口；界面会自己适应屏幕——手机上变成适合手指操作的布局，折叠屏展开或窗口变大时回到桌面布局。PC 端面板可以看到登录态、设备配额、设备列表与 App 下载二维码。'
