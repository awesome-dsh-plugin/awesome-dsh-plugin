description:
  en: 'Mobile remote control for DeepSeek Harness: open the DSH web UI from your phone. The desktop plugin registers this computer as a device over an outbound WebSocket tunnel (no inbound port or port forwarding needed), so the same account in the Android app can list the machine on mobile and open its DeepSeek Harness UI from anywhere. Includes a PC-side panel with account, device quota and the latest App download QR code, plus a host-side /api/file proxy and narrow-screen adapters that make the existing DSH web UI usable on a phone.'
