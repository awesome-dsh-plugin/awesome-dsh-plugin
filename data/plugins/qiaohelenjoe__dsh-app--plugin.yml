name: qiaohelenjoe/dsh-app#plugin
category: remote
icon: https://raw.githubusercontent.com/qiaohelenjoe/dsh-app/main/plugin/assets/icon-256.png
description:
  en: 'Use DeepSeek Harness on a computer from your phone, through a relay server you deploy. The DSH desktop plugin registers this computer as a device and keeps an outbound WebSocket tunnel to the relay; the Android app (Flutter + WebView) logs in with the same account, picks the computer from the device list and opens its DSH web UI over HTTPS. Nothing on this computer needs an inbound port or port forwarding. The relay (server/ in this repository, Fastify + PostgreSQL, Docker-deployable) handles accounts, devices, tunnel tickets and the /t/<deviceId>/* reverse proxy. The plugin also shows a PC-side panel with login state, device quota, device list and the latest app download QR code, and a narrow-screen adapter layer makes the existing web UI usable on a phone.'
  zh: '用手机远程使用电脑上的 DeepSeek Harness，走一台自建中继服务器。DSH 桌面插件把本机注册成设备，并保持一条出站 WebSocket 隧道连到中继；安卓 App（Flutter + WebView）用同一账号登录，在设备列表里选中这台电脑，就能通过 HTTPS 打开它的 DSH Web UI。本机不需要公网端口或端口映射。中继（本仓库 server/，Fastify + PostgreSQL，可用 Docker 部署）负责账号、设备、隧道票据与 /t/<deviceId>/* 反向代理。插件另提供 PC 端面板（登录态、设备配额、设备列表、最新 App 下载二维码），窄屏适配层让现有 Web UI 在手机上可用。'
