name: qiaohelenjoe/dsh-app#plugin
category: remote
icon: https://raw.githubusercontent.com/qiaohelenjoe/dsh-app/main/plugin/assets/icon-256.png
description:
  en: 'The mobile client for DeepSeek Harness: use the DSH running on your computer from your phone. The Android app (Flutter + WebView) signs in with the same account, picks this computer from the device list and opens its DeepSeek Harness UI on mobile — the desktop plugin handles device registration and the connection, and nothing on the computer needs an inbound port or port forwarding. A narrow-screen adapter makes the existing web UI genuinely usable on a phone: drawer sidebar, bottom-docked composer, larger touch targets, and automatic switching between mobile and desktop layout when a foldable folds or unfolds or the window is resized. The PC-side panel shows login state, device quota, device list and the latest app download QR code.'
  zh: 'DeepSeek Harness 移动端：用手机使用你电脑上的 DSH。安卓 App（Flutter + WebView）用同一账号登录，在设备列表里选中这台电脑，就能在手机上打开并进入它的 DeepSeek Harness 界面——桌面端插件负责设备注册与连接，本机不用开公网端口或做端口映射。窄屏适配层让现有 Web UI 在手机上真正可用：抽屉侧栏、吸底输入、放大触控尺寸，折叠屏展开/合上或窗口尺寸变化时自动在移动布局与桌面布局之间切换；PC 端面板展示登录态、设备配额、设备列表与 App 下载二维码。'
