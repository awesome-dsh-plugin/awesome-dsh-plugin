name: qiaohelenjoe/dsh-app#plugin
category: remote
icon: https://raw.githubusercontent.com/qiaohelenjoe/dsh-app/main/plugin/assets/icon-256.png
description:
  en: 'Mobile remote control for DeepSeek Harness (DSH): open your DeepSeek Harness web UI on a phone. The desktop plugin registers this computer as a device over an outbound WebSocket tunnel — no public IP, no port forwarding, no NAT or reverse-proxy setup — so the same account in the Android app (APK) can list the machine on mobile and open its DSH UI from anywhere. Handy for remote work and for reaching your own PC while away, as a lightweight alternative to a VPN. Includes a PC-side panel with account, device quota and the latest App download QR code, plus a host-side /api/file proxy and narrow-screen adapters so the existing web UI works on a phone.'
  zh: '用手机（移动端）远程使用 DeepSeek Harness（DSH）：在手机上打开 DSH Web UI。桌面插件通过出站隧道把本机注册成设备，不需要公网 IP、端口映射，也不用配内网穿透 / 反向代理 / VPN，手机 App（安卓 APK）用同一账号登录即可在设备列表看到这台电脑，并在移动端打开它的 DeepSeek Harness 界面。适合远程办公、出差外出时回连自己的电脑；PC 端面板展示账号、设备配额与最新 App 下载二维码，主机侧 /api/file 代理与窄屏适配层让现有 Web UI 在手机上可用。'
