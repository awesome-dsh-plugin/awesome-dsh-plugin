url: https://github.com/111xjyuan/dsh-desktop-sidecar
name: 111xjyuan/dsh-desktop-sidecar
category: tools
description:
  en: "Native Windows desktop control for DSH, 21 tools: UIA control tree plus offline OCR to see the screen, click a control by its name, type CJK without touching your clipboard, and drive WeChat / Office / browsers / online-class pages. Ships a sidebar panel (\"steering desk\") for typing corrections mid-task, a persistent built-in browser channel, and it waits for you to stop using the mouse and never resizes your windows. No driver, no extra runtime."
  zh: "原生 Windows 桌面控制，共 21 个工具：UIA 控件树 + 离线 OCR 看屏幕、按控件名字点击、不占剪贴板地打中文，微信 / Office / 浏览器 / 网课都能操作；侧边栏「指挥台」可随时打字纠正，内置持久登录的网页通道；你动鼠标时它会等，并且从不改你的窗口状态。无需驱动、无额外运行时。"
