description:
  en: 'Many long sessions and the desktop app drags? One press. A plugin update wants a restart while tasks are running? One press: the tasks keep running, and most restart cases are gone. The desktop app has its own refresh button.'
  zh: 'dsh 桌面端会话开多了、开久了卡了？点一下！插件更新要我重启？一堆任务在跑呢，咋办？直接点一下！一键刷新，任务照常跑完，大部分需要重启的场景就这么过去了。刷新解千愁 —— DSH 桌面端自己的刷新按钮。心动不如行动，赶紧来试试。'
