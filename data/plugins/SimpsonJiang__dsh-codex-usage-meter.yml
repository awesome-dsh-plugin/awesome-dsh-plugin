description:
  en: 'DeepSeek Harness usage meter: a current-session cost status bar, a per-turn cost next to each completed conversation turn with a cache-hit / cache-miss / output breakdown, and a Codex-style statistics page with token KPIs, a 53-week activity heatmap and weekly cell bars, priced with DeepSeek peak/off-peak rates.'
  zh: 'DeepSeek Harness 用量统计：状态栏显示当前会话费用拆分，每轮对话完成后显示本轮费用并可点击查看缓存命中、缓存未命中与输出明细，统计页提供 Codex 风格的 KPI 卡片、53 周活动热力图与每周柱状图，按 DeepSeek 峰谷价计费。'
