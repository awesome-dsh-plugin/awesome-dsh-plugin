name: SimpsonJiang/dsh-codex-usage-meter
category: usage
description:
  en: 'DeepSeek Harness usage meter: a current-session cost status bar, a per-turn cost next to each completed conversation turn with a cache-hit / cache-miss / output breakdown, and a Codex-style statistics page with token KPIs, a 53-week activity heatmap, weekly cell bars, and a chat usage ranking with each chat''s model / reasoning-effort mix, priced with DeepSeek peak/off-peak rates. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: 'DeepSeek Harness 用量统计：状态栏显示当前会话费用拆分，每轮对话完成后显示本轮费用并可点击查看缓存命中、缓存未命中与输出明细，统计页提供 Codex 风格的 KPI 卡片、53 周活动热力图、每周柱状图与聊天用量排行（含每个聊天的模型 / 推理强度占比），按 DeepSeek 峰谷价计费。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
icon: https://raw.githubusercontent.com/SimpsonJiang/dsh-codex-usage-meter/main/assets/icon-180.png
