description:
  en: 'A private diary for your agent: eight zero-dependency tools to write, amend, search and export daily entries kept on date-hashed paths the index never records (inner_find returns a day''s path on request).'
  zh: '给 agent 的私人日记本：八个零依赖工具负责写、改、翻、导出，正文按日期哈希散落在看似随机的目录里，索引不记路径（需要时由 inner_find 按日给出路径）。'
