description:
  en: 'A private diary for your agent: eight zero-dependency tools to write, amend, search and export daily entries kept on date-hashed paths the index never records, so where today''s page lives is a question only the agent can answer.'
  zh: '给 agent 的私人日记本：八个零依赖工具负责写、改、翻、导出，正文按日期哈希散落在看似随机的目录里，索引不记路径——「今天的日记在哪」只有它自己答得上来。'
