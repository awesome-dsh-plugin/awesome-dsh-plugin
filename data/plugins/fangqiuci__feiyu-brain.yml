description:
  en: 'Persona-grounded brain kernel with four tools (feiyu_status, feiyu_wake, feiyu_observe, feiyu_tick): weighted traits that erode into memories, a 30-day recall window, PAD emotions, and phone/tablet/desktop bodies.'
  zh: '以人设为根的大脑内核，提供 4 个工具（feiyu_status / feiyu_wake / feiyu_observe / feiyu_tick）：带权重的命题随经历涨落、蜕皮成记忆，30 天回忆窗口，PAD 三维情绪，手机/平板/电脑三具身体。'
