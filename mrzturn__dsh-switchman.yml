url: https://github.com/mrzturn/dsh-switchman
name: mrzturn/dsh-switchman
category: session
description:
  en: 'Sessions and messages (`session`): built to defuse the three ways a long agent session fails. 1) The context window fills up — the session gets dull, forgets earlier agreements, or dies mid-task. The plugin manages the context watermark end to end: automatic folding at idle boundaries with a persisted fold ledger and deterministic rebuild (the serialized prefix stays byte-identical between folds, so the provider prompt-prefix cache keeps hitting), a protected recent tail, three escalating watermark tiers, and an automatic write-handover-doc-then-compact at the top tier that never abandons running subagents — the main session never explodes, and token spend tracks the work instead of the chat length. 2) File edits fail in loops — a missed anchor burns turn after turn. A listener rewrites native `edit` / `str_replace_editor` misses into self-contained corrective feedback: per-match excerpts of the file''s exact text, the failure class (whitespace drift, multi-hit, zero-hit…), the correct retry recipe, and a loop-guard that orders a strategy switch after three same-class failures — the model fixes itself on the next try instead of guessing. 3) One model in one burnt-out context loses perspective — advantage-based delegation dispatches across six model pools (economy/mechanical/main/hard/vision/review, optional intent routing) only when it wins: a pristine child context that has not spent a token on your history, an independent model/effort lane, parallelism, blast-radius isolation; detail-bearing edits are still done directly. When two of three structural constraint tags fire in a turn, an Agent Team assembles autonomously; otherwise plain subagent dispatch stays the default, and tiered verification routes larger or core changes to independent reviewers. Also: per-scope output-language preferences, token tracking (no bill calculation), read-only MySQL/Redis checks plus commit-message and requirements-doc skills, and an offline session-log repair tool. Every capability above serves the live session and its messages. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '会话与消息（session）：针对长会话的三种典型死法逐一设防。1）上下文爆炸——会话越聊越钝、忘记早前约定，甚至撑爆窗口中途死掉：插件端到端管理上下文水位——空闲边界自动折叠并持久化折叠台账、确定性重建（两次折叠之间序列化前缀字节不变，供应商提示词缓存持续命中）、近期消息保护、三级水位线逐级升压，顶格时自动「写交接文档再压缩」且不丢运行中的 subagent——主会话永远不爆炸，token 开销随工作量而非聊天时长增长。2）文件编辑陷入失败循环——锚点对不上就一错再错、空耗轮次：监听器把原生 edit / str_replace_editor 的失配改写成自足的纠正反馈——逐个匹配点摘录文件原文、标注失败类别（空白漂移/多命中/零命中）、给出正确的重试配方，同类失败三次后循环守卫强制「换策略」——模型下一把就改对，而不是继续瞎猜。3）单模型在烧穿的单上下文里失去视角——按优势委派把工作派往六大模型池（economy/mechanical/main/hard/vision/review，可选意图路由），只在真的划算时才派：一段没被你的历史污染过的纯净子上下文、一条独立的模型/思考档泳道、并行与爆炸半径隔离；承载细节的修改仍然亲自做。一轮内三个结构性约束标签命中至少两个，自动拉起 Agent Team；否则维持 subagent 单发；分级验证把较大或核心改动交独立复审。另含：按范围的多语言输出偏好、token 用量统计（不计账单）、MySQL/Redis 只读核验与提交信息/需求文档技能、离线会话日志修复工具。以上每一项能力都服务于进行中的会话及其消息。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
