description:
  en: 'Standalone QQ-bot extension pack for DeepSeek Harness — fully independent, no other plugin required. Two-layer SQLite memory with hippocampal recall, a persona that keeps learning from daily chats, group tiers, local-model quick replies with a single-brain arbiter, TTS outbox, sticker library, an approval-gated video studio, and a four-form desktop pet (three custom characters plus the stock fish) playable over a public invite link with access-code login, single seat and brute-force protection. Chat bridging is deny-by-default: c2c/group access defaults to a care mode that only responds to the special-cared people and groups of the owner (shared with the persona system, zero extra config); allowlist, open and disabled modes remain available. v0.1.8 removes every hard-coded author-machine path (everything resolves from the module location at runtime, so it works on any machine/user); v0.1.7 adds a release gate (a privacy/compat check that runs before every publish: no runtime data, no tokens, no hard-coded account ids in the package; entry syntax and local profile dependency form are verified; a built-in default persona keeps emotion and worldview even without a character file), makes the persona loader port-free of local absolute paths, and fixes three long-standing bugs: the local scoring model no longer starves the CPU (single-threaded, serialized, idle unload), the kids-watch channel stops re-sending duplicated catch-up messages, and /bot-restart keeps its environment, waits for the port and retries. v0.1.6 makes a fresh install work out of the box: first-run defaults (persistent inbound dedupe, configurable outbound-hook budget, optional default permission preset, extension seeding) are written only where nothing was configured and never overwrite user changes; interview and quiz practice run inside chat with local scoring and configurable transcript retention.'
  zh: '独立的 QQ 机器人扩展包（DeepSeek Harness 桌面端插件，无需安装其他本体）。提供两层 SQLite 记忆（类海马体召回）、会从日常聊天里成长的人格、群分级、本地小模型代答与单脑仲裁、TTS 发件箱、表情包库、主人审核制的视频流水线，以及四形态桌宠（三套自绘形象 + 原生大肥鱼）——可通过带访问码、单席位、防爆破的公网邀请链接远程陪玩，网页端能切形态、发动作、拎起逗她。聊天桥接默认拒绝：私聊/群聊默认 care 模式——只回应主人的「特别关心」名单（与人格体系同源，零额外配置），陌生人无法触发 AI。v0.1.8 起整套插件不再写死作者本机路径（换成运行期从模块位置推导），换机器/换用户名都能跑；v0.1.7 新增发版闸门（每次发布前自动检查：包里不带运行期数据/token/写死的账号、入口语法与本地 profile 依赖写法、并确保没有人物档案时也有内置默认人设，保证基本情绪与世界观），人设加载不再写死本机路径；同时修了三处老问题：本地打分小模型不再抢 CPU（单线程+串行+空闲卸载）、小天才通道不再重复补发同一批积压消息、/bot-restart 会保留环境变量并等待端口释放后重试。v0.1.6 起开箱即用：首装只往没配过的位置补默认值（落盘去重、出站扩展预算、可选默认权限档、扩展自动播种），已改过的配置一律不覆盖；聊天里可直接用 /面试 与 /答题 练习，评分全在本地，会话与录音保留策略可配。'
