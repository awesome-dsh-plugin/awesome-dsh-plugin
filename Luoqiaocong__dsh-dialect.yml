description:
  en: 'Seasons DeepSeek Harness replies with a light dialect flavor — Northeast, Tianjin, Beijing, Cantonese or Hakka (Meizhou Xingning, experimental) — behind a five-step frequency ladder (off to about 50%), three intensity levels, and a per-session switch beside the composer.'
  zh: '给 DeepSeek Harness 的回答偶尔掺一点方言口气（东北话、天津话、北京话、粤语、客家话·梅州兴宁，试验中），五档频率（关闭到约 50%）、三档强度，输入框旁可按会话单独切换。'
