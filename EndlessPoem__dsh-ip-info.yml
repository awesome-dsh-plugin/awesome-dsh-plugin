url: https://github.com/EndlessPoem/dsh-ip-info
name: EndlessPoem/dsh-ip-info
category: ui
description:
  en: 'Shows the current public IP with its location, provider, ASN and local network interfaces, as a composer line or a draggable floating card. Its HTTP routes have no DSH access check, so a web page open in your browser could call them.'
  zh: '在输入框下方或悬浮窗里显示当前公网 IP、归属地、运营商、ASN 与本地网卡，字号跟随 Harness 设置。它的 HTTP 路由没有 DSH 的访问检查，浏览器里打开的网页可以调用它们。'
