# dsh-pouch bundle layer: automatically loads all pocket utilities into DSH
- id: web
  config:
    searchProvider: tavily

- insert:
    - id: dsh-pouch
      name: '@moon16u/dsh-pouch'
      config:
        apiKeyEnv: TAVILY_API_KEY
        baseURL: https://api.tavily.com/search
        searchDepth: basic
        maxResults: 5
