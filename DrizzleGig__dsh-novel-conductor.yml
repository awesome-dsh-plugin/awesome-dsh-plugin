url: https://github.com/DrizzleGig/dsh-novel-conductor
name: DrizzleGig/dsh-novel-conductor
category: workflow
description:
  en: >-
    Want every chapter to move forward smoothly, without losing track of important story decisions or what needs attention after drafting? "Stage Manager" helps you keep each chapter on track: make the key decisions, write your story, review what happened, and wrap things up. It never writes the prose for you or changes records in your other writing tools. It works on its own, too, and tells you where you are stuck when progress stalls.
  zh: >-
    想让每一章都写得有条不紊，不遗漏重要的剧情选择，也不让写完后的事情乱成一团？「舞台监督」帮助小说作者安排好每章的写作顺序：先拍板，再写故事，写完后整理进展、核对内容，最后收好尾。它不替你写正文，也不改动其他写作工具里的记录；即使单独使用也没问题。写作卡住时，它会告诉你停在了哪一步。
