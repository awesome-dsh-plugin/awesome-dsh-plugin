url: https://github.com/tinqiao-oss/engramory/tree/master/adapters/dsh/plugin
name: tinqiao-oss/engramory#plugin
category: memory
description:
  en: 'Long-term memory for DeepSeek Harness. What the AI remembers is saved as plain markdown files you can open and edit. Every conversation carries a short memory index, so the AI knows what it has saved and opens a note when it needs the detail. The index has a size cap (200 lines / 25 KB by default); a write that would push it over is blocked and the AI is asked to tidy up first. A sidebar Memory page lists every note, and the same memory also works with Claude Code, Codex and others.'
  zh: 'DeepSeek Harness 的长期记忆插件。AI 记住的事存成普通 markdown 文件，你随时能打开改。每次对话自动带上一份记忆目录，AI 一看就知道记过什么，要细节再翻对应笔记。目录有大小上限（默认 200 行 / 25 KB），写超了会被拦下，让 AI 先整理。侧栏有「记忆」页可翻看全部笔记；同一份记忆 Claude Code、Codex 等也能用。'
