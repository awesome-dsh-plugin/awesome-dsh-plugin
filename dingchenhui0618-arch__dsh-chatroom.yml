description:
  en: 'Multi-person personal chat rooms for DeepSeek Harness: you, the named agents you bring in, and another machine on your LAN can talk in one room. Members are bots with a name, a role and their own native session, so each agent keeps its own memory. Three speaking rules coexist as parallel switches: mention-triggered replies, a full round of every agent, and a chair agent that hands the turn onward; a shared speaker budget (max speakers per message, max hand-off depth) stops a roomful of agents from burning tokens. Rooms live on the host machine; another machine joins by address plus a six-character room code. When the turn belongs to an agent on the other machine, the host dispatches that turn there and the remote machine runs it in its own session, then returns the reply, so a person and the agent they carry stay together. Host and LAN members are labelled by origin everywhere (message rows, member list, floating window). Also ships an independent floating chat window in the session view with unread badges, toasts and a title prefix.'
  zh: '给 DeepSeek Harness 的多人群聊房间：你、你带进来的具名 agent，以及局域网里另一台机器上的人，可以在一间屋子里说话。成员是 Bot 模型 —— 有名字、有职责、有自己独立的原生会话，所以每个 agent 的记忆是自己的。三条发言规则并行生效：被 @ 必回、全员各说一句、设一个主持人接力；共用的发言预算（每条消息最多几个回合、agent 之间最多接力几层）防止一屋子 agent 把 token 烧光。房间在宿主那台机器上，另一台机器用地址 + 六位房间码加入。轮到对面机器上的 agent 时，宿主把这一轮派发过去，由那台机器用自己的会话跑完再回传，所以真人和他携带的 agent 始终在一起。本机与 LAN 成员在消息行、成员列、悬浮窗三处都标出来源，一眼分得清。另外在会话界面里有独立悬浮窗（可拖动、可折叠）、未读徽标、新消息 toast 与标题前缀。'
