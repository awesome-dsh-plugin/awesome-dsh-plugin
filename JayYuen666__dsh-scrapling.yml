url: https://github.com/JayYuen666/dsh-scrapling
name: JayYuen666/dsh-scrapling
category: browser
description:
  en: 'Wraps the Scrapling Python library in up to nineteen model tools, registered by probed capability: real-browser rendering for JavaScript-only pages, CSS/XPath extraction that returns structured data instead of Markdown, self-healing selectors, reusable login-state sessions with XHR capture and network history, page reads, screenshots, downloads, gated browser actions, a page-grounded answer tool and a domain-scoped crawler with content/sitemap/feed/Shopify modes on the official job backend. It can replace the built-in web_fetch / web_search, serve the same tool table over MCP, and screens every outbound URL against a public-address policy. Requires Python 3.14+ with Scrapling installed; the browser tools also need a Chromium engine for patchright, which an optional CLI installs on macOS arm64 only.'
  zh: '把 Scrapling Python 库包成最多十九个模型工具，按探测到的能力注册：为纯 JavaScript 页面上真实浏览器渲染、用 CSS/XPath 取出结构化数据而不是 Markdown、选择器自愈、可复用且带 XHR 抓取与网络历史的登录态会话、页面读取、截图、下载、受部署门禁的浏览器动作、基于页面内容的回答工具，以及在官方作业后端上跑的限定域爬虫（content / sitemap / feed / Shopify 四种模式）。它能顶替内置的 web_fetch / web_search，把同一份工具表通过 MCP 端出，并对每个外发 URL 做公网地址校验。需要 Python 3.14+ 且装好 Scrapling；浏览器工具还需要 patchright 的 Chromium 引擎，可选的 CLI 只在 macOS arm64 上装得起来。'
