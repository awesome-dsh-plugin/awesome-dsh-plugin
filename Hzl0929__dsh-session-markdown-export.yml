description:
  en: Exports one session as a single Markdown document from the sidebar session menu, with reasoning and tool calls folded into collapsible sections and front matter, per-turn sections and usage totals included.
  zh: 在侧栏会话菜单把整个会话导出为一份可折叠的 Markdown，思考与工具调用收进折叠块，并带 front matter、分轮正文与用量统计。
