name: Vesna-Strivozha-cn/dsh-modpack-kit
category: tools
description:
  en: 'Who says DSH cannot do modpacks? (Put these plugins together and it is genuinely good.) PCL/HMCL-style modpack tool: bundle plugins with their config and data into one .dshpack - one-click pack, one-click install, works offline, no installing each plugin by hand when moving machines. Also called plugin bundling, custom install, batch install, offline install, migrating or backing up plugin config, sharing a plugin combo. Three strategies - full (offline), download-only (smallest), hybrid (per plugin) - all ship a standalone installer, so a bare DSH can install it: copy into vendor, then register; installed ones are skipped unless you pass --replace. While installing you can pick plugins, choose packed or local config, enable all or keep them off, and sync market groups; sha256, dependencies and licences are checked before installing. Sources: file or folder picker, any directory, imported list and links; categories, search, paging, same-name market switch and groups come from the plugin market, and search can use its AI search on newer versions. Plugin market recommended, not required. npm: https://www.npmjs.com/package/dsh-modpack-kit'
  zh: '谁说dsh不能整整合包呢？（你说这几个插件整一块不牛逼坏了） 类似 HMCL / PCL 的 DSH 整合包工具：把多个插件连同配置与数据打成一个 .dshpack，一键打包、一键安装、离线可装，换机器不用逐个装。 也叫插件打包、自定义安装、批量安装、离线安装、迁移或备份插件配置、分享插件组合。 三种策略：完整包（离线可装）、仅下载码（最小）、混合包（按插件分档），都带独立安装器，裸 DSH 也能装：先复制进 vendor 再登记，已装的默认跳过，--replace 才覆盖。 安装时可逐个挑插件、选包内配置或保留本机、整体启用或先不启用，并同步市场分组；装前校验 sha256、依赖与许可证。 取包支持文件/文件夹选择器、任意目录、已导入列表与链接；分类、搜索、分页、同名切市场版与分组都和插件市场同源，搜索可用市场的新版 AI 搜索。 建议先装插件市场（dshmarket），不是必须。npm：https://www.npmjs.com/package/dsh-modpack-kit'
